<head>

<title>114下學期自主學習成果報告完成證書</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    gap: 20px;
  }
  h1 { color: #f0d070; font-size: 18px; font-weight: normal; letter-spacing: 2px; text-align: center; }
  .input-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  input[type=text] {
    padding: 10px 18px; font-size: 22px;
    border: 2px solid #c8a840; border-radius: 8px;
    background: #0d0d1a; color: #f8e8a0;
    width: 260px; text-align: center;
    font-family: 'Microsoft JhengHei', Georgia, serif; outline: none;
  }
  input[type=text]:focus { border-color: #f0d070; box-shadow: 0 0 10px rgba(240,208,112,0.4); }
  input[type=text]::placeholder { color: #887730; }
  button {
    padding: 11px 28px; font-size: 16px; border: none; border-radius: 8px;
    cursor: pointer; font-weight: bold; letter-spacing: 1px;
    background: linear-gradient(135deg, #c8a840, #f0d070); color: #1a0a00;
    transition: all 0.2s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(200,168,64,0.4); }
  #result { display: none; flex-direction: column; align-items: center; gap: 16px; }
  #result img {
    width: min(92vw, 820px); height: auto;
    border: 2px solid #c8a840; border-radius: 4px;
    box-shadow: 0 0 30px rgba(200,168,64,0.35); display: block;
  }
  .save-hint {
    background: rgba(200,168,64,0.15); border: 1px solid #c8a840;
    border-radius: 10px; padding: 14px 24px;
    color: #f5e070; font-size: 18px; text-align: center; line-height: 1.7;
  }
  .save-hint .big { font-size: 22px; font-weight: bold; }
</style>
</head>

const bg = new Image();
bg.src = BG_SRC;

// ── 下學期只改這三行 ──
const SEMESTER = "114下學期";
const DATE_STR = "Date: 2026/06/10";
const INSTRUCTOR = "Instructor: 黃彥蓉老師";

function st(ctx, text, x, y, font, color, sc, blur) {
  ctx.save();
  ctx.shadowColor = sc || "#000";
  ctx.shadowBlur = blur || 8;
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawCert(name) {
  const canvas = document.getElementById('cert');
  const ctx = canvas.getContext('2d');
  const W = 1536, H = 1024, cx = W / 2;

  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bg, 0, 0, W, H);

  // Title bar
  ctx.save();
  ctx.fillStyle = "rgba(0,0,40,0.55)";
  ctx.fillRect(60, 42, W - 120, 100);
  ctx.restore();

  // y=156 標題
  st(ctx, SEMESTER + "自主學習成果報告完成證書", cx, 156,
    "bold 64px 'Microsoft JhengHei','PingFang TC',serif", "#f5e060", "#000", 14);

  // y=263 This certificate declares that
  st(ctx, "This certificate declares that", cx, 263,
    "italic 32px Georgia,serif", "#d4b860", "#000", 6);

  // y=390 姓名
  ctx.save();
  ctx.font = "bold 92px 'Microsoft JhengHei','PingFang TC',Georgia,serif";
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = 'center';
  ctx.shadowColor = "#c8a840";
  ctx.shadowBlur = 20;
  ctx.fillText(name, cx, 390);
  const nw = Math.min(ctx.measureText(name).width + 80, 720);
  ctx.strokeStyle = "#c8a840";
  ctx.lineWidth = 2.5;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.moveTo(cx - nw/2, 410); ctx.lineTo(cx + nw/2, 410);
  ctx.stroke();
  ctx.restore();

  // y=468 has completed
  st(ctx, "has completed", cx, 468, "italic 32px Georgia,serif", "#d4b860", "#000", 6);

  // y=548 The Final Presentation
  st(ctx, "The Final Presentation of Self-Directed Learning", cx, 548,
    "bold 48px Georgia,serif", "#f0d878", "#000", 12);

  // y=632 特頒此狀
  st(ctx, "特頒此狀，以茲證明", cx, 632,
    "bold 36px 'Microsoft JhengHei','PingFang TC',serif", "#f5e070", "#000", 8);

  // Divider
  ctx.save();
  ctx.strokeStyle = "#c8a840";
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.6;
  ctx.setLineDash([4, 10]);
  ctx.beginPath();
  ctx.moveTo(cx - 340, 680); ctx.lineTo(cx + 340, 680);
  ctx.stroke();
  ctx.restore();

  // y=755 Date x=568 / Instructor x=968
  st(ctx, DATE_STR, 568, 755, "26px Georgia,serif", "#f0d070", "#000", 6);
  st(ctx, INSTRUCTOR, 968, 755,
    "26px 'Microsoft JhengHei','PingFang TC',Georgia,serif", "#f0d070", "#000", 6);
}

function generate() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { alert('請先輸入姓名！'); return; }
  if (!bg.complete || bg.naturalWidth === 0) {
    bg.onload = () => doGenerate(name);
  } else {
    doGenerate(name);
  }
}

function doGenerate(name) {
  drawCert(name);
  document.getElementById('certImg').src = document.getElementById('cert').toDataURL('image/png');
  document.getElementById('result').style.display = 'flex';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') generate();
});
</script>
