<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>成績排序表</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap');

:root{
  --paper:#FAF6EE;
  --ink:#1F2A44;
  --ink-soft:#5B6780;
  --red:#B23A2E;
  --rule:#DCD3BF;
  --rule-blue:#C9D2E0;
  --bar:#7C8FAE;
  --gold:#B8902E;
  --silver:#8A8F98;
  --bronze:#A5673A;
  --ok:#3B6B4E;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:
    repeating-linear-gradient(
      var(--paper) 0px, var(--paper) 31px, var(--rule-blue) 32px
    );
  background-color:var(--paper);
  font-family:'Noto Sans TC', sans-serif;
  color:var(--ink);
  padding:28px 20px 60px;
}

.sheet{
  max-width:920px;
  margin:0 auto;
  position:relative;
}

.margin-rule{
  position:absolute;
  left:52px; top:0; bottom:0;
  width:1px;
  background:var(--red);
  opacity:.35;
}

header{
  padding-left:64px;
  margin-bottom:22px;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;
}
header .eyebrow{
  font-family:'Roboto Mono', monospace;
  font-size:12px;
  letter-spacing:.12em;
  color:var(--red);
  text-transform:uppercase;
}
h1{
  font-family:'Noto Serif TC', serif;
  font-weight:700;
  font-size:28px;
  margin:4px 0 10px;
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
#className{
  font-family:'Noto Serif TC', serif;
  font-weight:700;
  font-size:28px;
  border:none;
  border-bottom:1px dashed var(--ink-soft);
  background:transparent;
  color:var(--ink);
  width:5em;
  padding:0 2px;
}
#className:focus{ outline:none; border-bottom-color:var(--red); }
h1 .fixed{ white-space:nowrap; }

.controls{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  padding-left:64px;
  margin-bottom:6px;
  font-size:13px;
  color:var(--ink-soft);
}
.toggle{
  display:inline-flex; border:1px solid var(--ink); border-radius:3px; overflow:hidden;
}
.toggle button{
  font-family:'Noto Sans TC',sans-serif;
  font-size:13px;
  padding:6px 14px;
  border:none;
  background:var(--paper);
  color:var(--ink);
  cursor:pointer;
}
.toggle button.active{
  background:var(--ink); color:var(--paper);
}

main{
  padding-left:64px;
}
.mini-btn{
  font-family:'Noto Sans TC',sans-serif; font-size:12px;
  padding:5px 10px; background:transparent; color:var(--ink-soft);
  border:1px solid var(--ink-soft); border-radius:3px; cursor:pointer;
}
.mini-btn:hover{ color:var(--red); border-color:var(--red); }
.toggle button .dot{ font-size:10px; opacity:.6; margin-left:4px; }
.dl-row{ display:flex; gap:8px; margin-bottom:8px; }
.dl-row button.copy-btn{ margin-top:0; background:var(--ink); }
.rank-col{ min-width:0; }

.panel-title{
  font-family:'Roboto Mono', monospace;
  font-size:12px;
  letter-spacing:.08em;
  color:var(--ink-soft);
  margin:26px 0 8px;
  text-transform:uppercase;
}

.inputs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
textarea{
  width:100%;
  min-height:150px;
  font-family:'Roboto Mono', monospace;
  font-size:13px;
  line-height:1.7;
  padding:10px 12px;
  border:1px solid var(--ink-soft);
  border-radius:4px;
  background:#FFFDF8;
  color:var(--ink);
  resize:vertical;
}
textarea:focus{ outline:none; border-color:var(--red); }
.hint{ font-size:12px; color:var(--ink-soft); margin-top:5px; }

.warning{
  margin-top:10px;
  font-size:13px;
  color:var(--red);
  font-family:'Roboto Mono', monospace;
  display:none;
}

.results{ margin-top:28px; display:grid; grid-template-columns: 1.3fr 1fr; gap:24px; align-items:start; }
@media (max-width:760px){ .results{ grid-template-columns:1fr; } .inputs{ grid-template-columns:1fr; } }

table{ width:100%; border-collapse:collapse; font-size:14px; background:#FFFDF8; }
thead th{
  text-align:left; font-family:'Roboto Mono',monospace; font-size:11px; letter-spacing:.06em;
  color:var(--ink-soft); text-transform:uppercase;
  border-bottom:2px solid var(--ink); padding:6px 8px;
}
tbody td{ padding:7px 8px; border-bottom:1px solid var(--rule-blue); }
tbody tr:hover{ background:#F3EEE0; }
td.rank, td.score{ font-family:'Roboto Mono',monospace; }
.stamp{
  display:inline-block; min-width:22px; text-align:center;
  border-radius:2px; padding:1px 5px; font-weight:700; font-family:'Roboto Mono',monospace; font-size:12px;
}
.stamp.r1{ background:var(--gold); color:#fff; }
.stamp.r2{ background:var(--silver); color:#fff; }
.stamp.r3{ background:var(--bronze); color:#fff; }

.summary-box{
  border:1px solid var(--ink);
  border-radius:4px;
  background:#FFFDF8;
  padding:16px 18px;
}
.summary-box h3{
  font-family:'Noto Serif TC', serif; font-size:16px; margin:0 0 10px;
  border-bottom:1px solid var(--rule); padding-bottom:8px;
}
.band-row{ display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; }
.band-label{ width:70px; font-family:'Roboto Mono',monospace; color:var(--ink-soft); flex-shrink:0; }
.band-bar-track{ flex:1; background:#EFE9D8; border-radius:2px; height:12px; overflow:hidden; }
.band-bar-fill{ height:100%; background:var(--bar); }
.band-count{ width:34px; text-align:right; font-family:'Roboto Mono',monospace; flex-shrink:0; }

.avg-line{
  margin-top:14px; padding-top:10px; border-top:1px dashed var(--rule);
  font-family:'Roboto Mono',monospace; font-size:14px; font-weight:700;
}

.copy-block{ margin-top:16px; }
.copy-output{
  width:100%; min-height:70px; font-family:'Roboto Mono',monospace; font-size:12.5px;
  padding:10px; border:1px dashed var(--ink-soft); border-radius:4px; background:#F6F1E4;
  white-space:pre-wrap; color:var(--ink);
}
button.copy-btn{
  margin-top:8px;
  font-family:'Noto Sans TC', sans-serif;
  font-size:13px; font-weight:700;
  padding:8px 16px;
  background:var(--red); color:#fff;
  border:none; border-radius:3px; cursor:pointer;
}
button.copy-btn:hover{ opacity:.9; }
button.copy-btn.copied{ background:var(--ok); }

.empty-note{ color:var(--ink-soft); font-size:13px; padding:20px 0; }
</style>
</head>
<body>
<div class="sheet">
  <div class="margin-rule"></div>
  <header>
    <div class="eyebrow">Grade Ledger · 成績登記簿</div>
    <h1><input id="className" placeholder="三年二" value=""><span class="fixed">班成績排序表</span></h1>
  </header>

  <div class="controls">
    暫存班級：
    <div class="toggle" id="slotTabs"></div>
    <button class="mini-btn" id="clearSlotBtn" title="清空目前這個暫存格">清空此格</button>
    <span class="hint" style="margin:0">自動存在這台電腦的瀏覽器裡</span>
  </div>
  <div class="controls">
    排序：
    <div class="toggle">
      <button id="btnDesc" class="active">高 → 低</button>
      <button id="btnAsc">低 → 高</button>
    </div>
  </div>

  <main>
    <div class="panel-title">輸入資料</div>
    <div class="inputs">
      <div>
        <textarea id="nameInput" placeholder="每行一筆，例如：
1 王小明
2 陳美玲
王小華
（若不寫座號，會依行數自動編號）
（空一行＝該座號已轉出/休學，後面不遞補）"></textarea>
        <div class="hint">座號 姓名（可只寫姓名，自動依順序編座號；空白行＝轉出/休學，座號不遞補）</div>
      </div>
      <div>
        <textarea id="scoreInput" placeholder="每行一筆，順序需對應左邊：
88
92
76"></textarea>
        <div class="hint">成績（需與左邊筆數、順序一致）</div>
      </div>
    </div>
    <div class="warning" id="warning"></div>

    <div id="output"></div>
  </main>
</div>

<script>
const nameInput = document.getElementById('nameInput');
const scoreInput = document.getElementById('scoreInput');
const warningEl = document.getElementById('warning');
const outputEl = document.getElementById('output');
const classNameInput = document.getElementById('className');
const btnDesc = document.getElementById('btnDesc');
const btnAsc = document.getElementById('btnAsc');

let sortDir = 'desc';

function syncSortBtns(){
  btnDesc.classList.toggle('active', sortDir === 'desc');
  btnAsc.classList.toggle('active', sortDir === 'asc');
}
btnDesc.addEventListener('click', () => { sortDir='desc'; syncSortBtns(); saveStore(); render(); });
btnAsc.addEventListener('click', () => { sortDir='asc'; syncSortBtns(); saveStore(); render(); });

// ---- 三個班暫存（localStorage）----
// 唯一寫入者：slots[activeSlot] 由輸入框 input 事件寫入；切換時先存再載入。
const STORE_KEY = 'gradeRanker.slots.v1';
const SLOT_COUNT = 3;
let slots = Array.from({length: SLOT_COUNT}, () => ({ cls:'', names:'', scores:'' }));
let activeSlot = 0;
const slotTabs = document.getElementById('slotTabs');

function loadStore(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(d && Array.isArray(d.slots)){
      for(let i = 0; i < SLOT_COUNT; i++){
        if(d.slots[i]) slots[i] = Object.assign(slots[i], d.slots[i]);
      }
      if(d.active >= 0 && d.active < SLOT_COUNT) activeSlot = d.active;
      if(d.sortDir === 'asc') sortDir = 'asc';
    }
  }catch(e){}
}
function saveStore(){
  slots[activeSlot] = { cls: classNameInput.value, names: nameInput.value, scores: scoreInput.value };
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({ slots, active: activeSlot, sortDir }));
  }catch(e){}
}
function slotHasData(s){ return !!(s.names.trim() || s.scores.trim() || s.cls.trim()); }
function applySlotToInputs(){
  const s = slots[activeSlot];
  classNameInput.value = s.cls; nameInput.value = s.names; scoreInput.value = s.scores;
}
function renderTabs(){
  slotTabs.innerHTML = '';
  slots.forEach((s, i) => {
    const b = document.createElement('button');
    const label = s.cls.trim() ? s.cls.trim() : `班級 ${i + 1}`;
    b.textContent = label;
    if(slotHasData(s) && i !== activeSlot){
      const dot = document.createElement('span'); dot.className = 'dot'; dot.textContent = '●'; b.appendChild(dot);
    }
    if(i === activeSlot) b.classList.add('active');
    b.addEventListener('click', () => {
      if(i === activeSlot) return;
      saveStore();            // 先存目前這格
      activeSlot = i;         // 再切換 model
      applySlotToInputs();
      saveStore();
      renderTabs(); render();
    });
    slotTabs.appendChild(b);
  });
}
document.getElementById('clearSlotBtn').addEventListener('click', () => {
  const s = slots[activeSlot];
  if(slotHasData(s) && !confirm('確定清空這一格的資料？')) return;
  slots[activeSlot] = { cls:'', names:'', scores:'' };
  applySlotToInputs(); saveStore(); renderTabs(); render();
});

[nameInput, scoreInput, classNameInput].forEach(el => el.addEventListener('input', () => {
  saveStore(); renderTabs(); render();
}));

// 空白行＝該座號已轉出/休學：保留位置（後面座號不遞補），但不列入統計。
// 只去掉結尾多餘的空行。
function splitLines(text){
  const lines = text.split('\n').map(l => l.trim());
  while(lines.length && lines[lines.length - 1] === '') lines.pop();
  return lines;
}

function parseNames(text){
  return splitLines(text).map((line, idx) => {
    if(line === '') return { vacant: true, seat: String(idx + 1), name: '' };
    const parts = line.split(/\s+/);
    if(parts.length > 1 && /^\d+$/.test(parts[0])){
      return { seat: parts[0], name: parts.slice(1).join(' ') };
    }
    return { seat: String(idx + 1), name: line };
  });
}

function parseScores(text){
  return splitLines(text).map(l => {
    if(l === '') return null;
    const v = parseFloat(l);
    return isNaN(v) ? null : v;
  });
}

function bandOf(score){
  if(score >= 90) return { low: 90, high: 100, label: '90-100' };
  const low = Math.max(0, Math.floor(score / 10) * 10);
  const high = low + 9;
  return { low, high, label: `${low}-${high}` };
}

const BAND_ORDER = ['90-100','80-89','70-79','60-69','50-59','40-49','30-39','20-29','10-19','0-9'];

function render(){
  const scores = parseScores(scoreInput.value);
  const noNames = nameInput.value.trim() === '';
  const names = noNames
    ? scores.map((_, i) => ({ seat: String(i + 1), name: '' }))
    : parseNames(nameInput.value);

  if(names.length === 0 && scores.length === 0){
    outputEl.innerHTML = '<p class="empty-note">貼上座號姓名與成績後，會自動排序並統計。</p>';
    warningEl.style.display = 'none';
    return;
  }

  if(names.length !== scores.length){
    warningEl.style.display = 'block';
    warningEl.textContent = `⚠ 筆數不一致：座號姓名 ${names.length} 筆，成績 ${scores.length} 筆，請確認每行一一對應。`;
  } else {
    warningEl.style.display = 'none';
  }

  const n = Math.min(names.length, scores.length);
  let students = [];
  for(let i = 0; i < n; i++){
    if(names[i].vacant || scores[i] === null) continue;
    students.push({ seat: names[i].seat, name: names[i].name, score: scores[i] });
  }

  if(students.length === 0){
    outputEl.innerHTML = '<p class="empty-note">目前沒有有效的成績資料。</p>';
    return;
  }

  // sort for ranking (always need desc order to compute competition rank)
  const byDesc = [...students].sort((a, b) => b.score - a.score);
  let rank = 1;
  for(let i = 0; i < byDesc.length; i++){
    if(i > 0 && byDesc[i].score === byDesc[i-1].score){
      byDesc[i].rank = byDesc[i-1].rank;
    } else {
      byDesc[i].rank = i + 1;
    }
  }

  const displayList = sortDir === 'desc' ? byDesc : [...byDesc].sort((a, b) => a.score - b.score);

  // band counts
  const bandCounts = {};
  BAND_ORDER.forEach(b => bandCounts[b] = 0);
  students.forEach(s => { bandCounts[bandOf(s.score).label]++; });

  const total = students.reduce((sum, s) => sum + s.score, 0);
  const avg = (total / students.length);
  const avgStr = avg.toFixed(1);
  const maxCount = Math.max(...Object.values(bandCounts), 1);

  // build table rows
  const rows = displayList.map(s => {
    let rankCell = s.rank;
    if(s.rank === 1) rankCell = `<span class="stamp r1">${s.rank}</span>`;
    else if(s.rank === 2) rankCell = `<span class="stamp r2">${s.rank}</span>`;
    else if(s.rank === 3) rankCell = `<span class="stamp r3">${s.rank}</span>`;
    return `<tr>
      <td class="rank">${rankCell}</td>
      <td>${s.seat}</td>
      ${noNames ? '' : `<td>${s.name}</td>`}
      <td class="score">${s.score}</td>
      <td>${bandOf(s.score).label}</td>
    </tr>`;
  }).join('');

  // build band summary rows (skip empty)
  const bandRows = BAND_ORDER.filter(b => bandCounts[b] > 0).map(b => {
    const count = bandCounts[b];
    const pct = (count / maxCount) * 100;
    return `<div class="band-row">
      <div class="band-label">${b}</div>
      <div class="band-bar-track"><div class="band-bar-fill" style="width:${pct}%"></div></div>
      <div class="band-count">${count}人</div>
    </div>`;
  }).join('');

  const cls = classNameInput.value.trim().replace(/班$/, '');
  const className = cls ? cls + '班' : '本班';
  const bandTitle = cls ? `${cls}班級距人數` : '級距人數';
  const copyText = `${className}，` +
    BAND_ORDER.filter(b => bandCounts[b] > 0).map(b => `${b}：${bandCounts[b]}人`).join('、') +
    `，全班平均：${avgStr}`;

  outputEl.innerHTML = `
    <div class="panel-title">排序結果（共 ${students.length} 人）</div>
    <div class="results">
      <div class="rank-col">
      <div class="dl-row">
        <button class="copy-btn" id="dlRankImgBtn">下載排名圖片</button>
        <button class="copy-btn" id="dlRankTxtBtn">下載排名文字檔</button>
      </div>
      <table>
        <thead><tr><th>名次</th><th>座號</th>${noNames ? '' : '<th>姓名</th>'}<th>成績</th><th>級距</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
      <div class="summary-box">
        <h3 id="bandTitle">${bandTitle}</h3>
        ${bandRows}
        <button class="copy-btn" id="dlBtn" style="margin-top:12px">下載級距圖</button>
        <div class="avg-line">全班平均：${avgStr}</div>
        <div class="copy-block">
          <div class="copy-output" id="copyOutput">${copyText}</div>
          <button class="copy-btn" id="copyBtn">一鍵複製</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('dlBtn').addEventListener('click', () => {
    const rowsData = BAND_ORDER.filter(b => bandCounts[b] > 0).map(b => [b, bandCounts[b]]);
    downloadBandImage(bandTitle, rowsData, maxCount, avgStr);
  });

  const rankTitle = (cls ? cls + '班' : '') + '成績排名';
  document.getElementById('dlRankImgBtn').addEventListener('click', () => {
    downloadRankImage(rankTitle, displayList, noNames, avgStr);
  });
  document.getElementById('dlRankTxtBtn').addEventListener('click', () => {
    const head = ['名次', '座號'].concat(noNames ? [] : ['姓名'], ['成績']).join('\t');
    const lines = displayList.map(s =>
      [s.rank, s.seat].concat(noNames ? [] : [s.name], [s.score]).join('\t'));
    const text = rankTitle + '\n' + head + '\n' + lines.join('\n') + '\n' + `全班平均：${avgStr}` + '\n';
    downloadBlob(new Blob(['﻿' + text], { type: 'text/plain;charset=utf-8' }), rankTitle + '.txt');
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    const text = document.getElementById('copyOutput').textContent;
    const btn = document.getElementById('copyBtn');
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '已複製 ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '一鍵複製'; btn.classList.remove('copied'); }, 1500);
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      btn.textContent = '已複製 ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '一鍵複製'; btn.classList.remove('copied'); }, 1500);
    });
  });
}

function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function downloadRankImage(title, list, noNames, avgStr){
  const pad = 28, rowH = 32, titleH = 64, headH = 34, footH = 52;
  const cols = noNames
    ? [['名次', 0], ['座號', 90], ['成績', 190]]
    : [['名次', 0], ['座號', 90], ['姓名', 190], ['成績', 330]];
  const W = noNames ? 360 : 470;
  const H = titleH + headH + list.length * rowH + footH;
  const scale = 2;
  const c = document.createElement('canvas');
  c.width = W * scale; c.height = H * scale;
  const g = c.getContext('2d');
  g.scale(scale, scale);
  g.fillStyle = '#FFFDF8'; g.fillRect(0, 0, W, H);
  g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillStyle = '#1F2A44';
  g.font = '700 22px "Noto Serif TC", serif';
  g.fillText(title, pad, 34);
  g.fillRect(pad, 52, W - pad * 2, 1.5);
  g.font = '700 13px "Noto Sans TC", sans-serif';
  g.fillStyle = '#5B6780';
  cols.forEach(([label, x]) => g.fillText(label, pad + x, titleH + headH / 2));
  g.fillStyle = '#1F2A44'; g.fillRect(pad, titleH + headH - 1, W - pad * 2, 1.5);
  const medal = { 1:'#B8902E', 2:'#8A8F98', 3:'#A5673A' };
  list.forEach((s, i) => {
    const y = titleH + headH + i * rowH + rowH / 2;
    if(i % 2 === 1){ g.fillStyle = '#F6F1E4'; g.fillRect(pad, y - rowH / 2, W - pad * 2, rowH); }
    g.font = '500 15px "Roboto Mono", "Noto Sans TC", monospace';
    g.fillStyle = medal[s.rank] || '#1F2A44';
    g.font = (medal[s.rank] ? '700 ' : '500 ') + '15px "Roboto Mono", "Noto Sans TC", monospace';
    g.fillText(String(s.rank), pad + cols[0][1], y);
    g.fillStyle = '#1F2A44'; g.font = '500 15px "Roboto Mono", "Noto Sans TC", monospace';
    g.fillText(String(s.seat), pad + cols[1][1], y);
    if(!noNames){
      g.font = '500 15px "Noto Sans TC", sans-serif';
      g.fillText(s.name, pad + cols[2][1], y);
    }
    g.font = '700 15px "Roboto Mono", monospace';
    g.fillText(String(s.score), pad + cols[cols.length - 1][1], y);
  });
  const fy = titleH + headH + list.length * rowH + footH / 2;
  g.fillStyle = '#1F2A44'; g.fillRect(pad, fy - footH / 2 + 4, W - pad * 2, 1);
  g.font = '700 15px "Roboto Mono", "Noto Sans TC", monospace';
  g.fillText(`全班平均：${avgStr}`, pad, fy + 4);
  c.toBlob(blob => downloadBlob(blob, title + '.png'));
}

function downloadBandImage(title, rowsData, maxCount, avgStr){
  const W = 520, pad = 28, rowH = 34, titleH = 64, footH = 44;
  const H = titleH + rowsData.length * rowH + footH + pad / 2;
  const scale = 2;
  const c = document.createElement('canvas');
  c.width = W * scale; c.height = H * scale;
  const g = c.getContext('2d');
  g.scale(scale, scale);
  g.fillStyle = '#FFFDF8'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#1F2A44';
  g.font = '700 22px "Noto Serif TC", serif';
  g.textBaseline = 'middle';
  g.fillText(title, pad, 34);
  g.fillStyle = '#1F2A44'; g.fillRect(pad, 52, W - pad * 2, 1.5);
  const labelW = 74, countW = 50;
  const trackX = pad + labelW, trackW = W - pad * 2 - labelW - countW;
  rowsData.forEach(([label, count], i) => {
    const y = titleH + i * rowH + rowH / 2;
    g.font = '500 15px "Roboto Mono", monospace';
    g.fillStyle = '#5B6780'; g.textAlign = 'left';
    g.fillText(label, pad, y);
    g.fillStyle = '#EFE9D8'; g.fillRect(trackX, y - 7, trackW, 14);
    g.fillStyle = '#7C8FAE'; g.fillRect(trackX, y - 7, trackW * count / maxCount, 14);
    g.fillStyle = '#1F2A44'; g.textAlign = 'right';
    g.fillText(count + '人', W - pad, y);
  });
  const ay = titleH + rowsData.length * rowH + footH / 2;
  g.fillStyle = '#1F2A44'; g.fillRect(pad, ay - footH / 2 + 4, W - pad * 2, 1);
  g.textAlign = 'left';
  g.font = '700 16px "Roboto Mono", "Noto Sans TC", monospace';
  g.fillText(`全班平均：${avgStr}`, pad, ay + 4);
  c.toBlob(blob => downloadBlob(blob, title + '.png'));
}

loadStore();
applySlotToInputs();
syncSortBtns();
renderTabs();
render();
</script>
