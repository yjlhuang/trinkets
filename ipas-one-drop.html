<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一滴水・iPAS AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --soil:#bba88b; --speck:#a08d70; --speck2:#cbbb9f;
  --wet:#6f5a40;
  --panel:#e8ebe1; --ink:#27301f; --muted:#66705a; --line:#c9cfbd;
  --opt:#f4f6ef; --opt-hover:#fbfcf8;
  --water:#3b7ea8; --right:#4c7a33; --wrong:#a4513b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --soil:#5c4f3d; --speck:#4b4032; --speck2:#6a5c48; --wet:#2e251a;
    --panel:#1c2119; --ink:#e2e6d8; --muted:#9aa38c; --line:#343c2e;
    --opt:#252b21; --opt-hover:#2d3428;
    --water:#6fb1d8; --right:#8fbf6c; --wrong:#e0886f;
  }
}
:root[data-theme="dark"]{
  --soil:#5c4f3d; --speck:#4b4032; --speck2:#6a5c48; --wet:#2e251a;
  --panel:#1c2119; --ink:#e2e6d8; --muted:#9aa38c; --line:#343c2e;
  --opt:#252b21; --opt-hover:#2d3428;
  --water:#6fb1d8; --right:#8fbf6c; --wrong:#e0886f;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--panel); color:var(--ink);
  font-family:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  display:flex; overflow:hidden;
}
button{font:inherit}
.land{position:relative;flex:1;min-width:0;min-height:0;background:var(--soil);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:default}
.land.has-water canvas{cursor:pointer}
.hint{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:1.35rem;color:var(--ink);opacity:.55;pointer-events:none;
  text-align:center;line-height:1.6;transition:opacity .6s;white-space:nowrap;
}
.hint.gone{opacity:0}
.toast{
  position:absolute;left:50%;bottom:1.25rem;transform:translateX(-50%);
  background:var(--panel);color:var(--ink);padding:.5rem 1rem;border-radius:999px;
  font-size:1rem;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:.95}
.snap{
  position:absolute;right:.75rem;top:.75rem;font-size:.9rem;
  color:var(--ink);background:var(--panel);border:0;border-radius:999px;
  padding:.35rem .9rem;cursor:pointer;opacity:.85;
}
.snap:hover{opacity:1}
.snap[hidden]{display:none}

.panel{
  width:min(540px,48vw);display:flex;flex-direction:column;
  border-left:1px solid var(--line);min-height:0;
}
.water{
  display:flex;align-items:center;gap:.6rem;padding:.9rem 1.25rem;
  border-bottom:1px solid var(--line);min-height:3.75rem;
}
.water-label{font-size:1rem;color:var(--muted);white-space:nowrap}
.drops{display:flex;flex-wrap:wrap;gap:.2rem;align-items:center;flex:1;min-width:0}
.drops svg{width:18px;height:24px;display:block}
.drops .more{font-size:1rem;color:var(--water);margin-left:.25rem}
.drops .none{color:var(--muted);font-size:.95rem}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) translateY(-8px)}100%{transform:scale(1)}}
.bar-btn{
  flex:none;font-size:.9rem;color:var(--muted);background:none;
  border:1px solid transparent;border-radius:999px;padding:.3rem .75rem;cursor:pointer;white-space:nowrap;
}
.bar-btn:hover{border-color:var(--line);color:var(--ink)}
.bar-btn.armed{color:var(--wrong);border-color:var(--wrong)}
#range{color:var(--ink);border-color:var(--line)}

.view{flex:1;overflow-y:auto;padding:1.1rem 1.5rem 1.5rem;min-height:0}
.view[hidden]{display:none}
.where{display:flex;flex-wrap:wrap;gap:.35rem .75rem;align-items:center;font-size:.85rem;color:var(--muted);margin:0 0 .9rem}
.kind{color:var(--ink);background:var(--opt);border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem}
.again{color:var(--wrong)}
.again[hidden]{display:none}

.stem{margin:0 0 1rem;font-size:1.08rem;line-height:1.8;white-space:pre-line}

.opts{display:flex;flex-direction:column;gap:.5rem;margin:0;padding:0;list-style:none}
.opt{
  display:flex;gap:.6rem;width:100%;text-align:left;font-size:1rem;line-height:1.6;
  color:var(--ink);background:var(--opt);border:1.5px solid var(--line);border-radius:10px;
  padding:.6rem .8rem;cursor:pointer;
}
.opt:hover:not(:disabled){background:var(--opt-hover);border-color:var(--muted)}
.opt .k{font-weight:700;color:var(--muted);flex:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--right);background:color-mix(in srgb,var(--right) 14%,var(--opt))}
.opt.right .k{color:var(--right)}
.opt.wrong{border-color:var(--wrong);opacity:.8}
.opt.wrong .k{color:var(--wrong)}
.opt.dim{opacity:.5}

.after{margin-top:1rem;display:none;flex-direction:column;gap:.75rem}
.after.on{display:flex}
.msg{font-size:1rem;line-height:1.6;margin:0}
.msg.good{color:var(--right)}
.msg.bad{color:var(--wrong)}
.card{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem .8rem;border-radius:10px;background:var(--opt);border:1px solid var(--line)}
.card b{font-size:1.05rem;color:var(--right);flex:none}
.card span{line-height:1.6}
.card .ex{flex-basis:100%;color:var(--ink);font-size:.95rem;line-height:1.75}
.card .ex.none{color:var(--muted);font-size:.85rem}
.next{
  align-self:flex-start;font-size:1rem;padding:.55rem 1.2rem;border-radius:999px;cursor:pointer;
  background:var(--ink);color:var(--panel);border:0;
}
.next:disabled{opacity:.4;cursor:default}
.ghost{
  font-size:1rem;padding:.55rem 1.1rem;border-radius:999px;cursor:pointer;
  background:none;color:var(--muted);border:1px solid var(--line);
}
.ghost:hover{color:var(--ink)}

/* range picker */
.pick h2{font-size:1.25rem;margin:0 0 .25rem}
.pick h3{font-size:1rem;margin:1.1rem 0 .5rem;color:var(--muted);font-weight:400}
.pick .sub{margin:0 0 .75rem;color:var(--muted);font-size:.9rem}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.8rem,1fr));gap:.5rem}
.unit,.chip{
  text-align:left;color:var(--ink);background:var(--opt);border:1.5px solid var(--line);
  border-radius:10px;padding:.55rem .7rem;cursor:pointer;
}
.unit{display:flex;flex-direction:column;gap:.25rem}
.unit[aria-pressed="true"],.chip[aria-pressed="true"]{border-color:var(--water);background:color-mix(in srgb,var(--water) 13%,var(--opt))}
.unit .pg{font-weight:700;font-size:1.05rem}
.unit .meta{font-size:.8rem;color:var(--muted)}
.unit .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.unit .bar i{display:block;height:100%;background:var(--right)}
.quick{display:flex;gap:.5rem;margin:.6rem 0 0}
.quick button{font-size:.85rem;padding:.25rem .8rem;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border-radius:999px;padding:.4rem .9rem}
.chip small{color:var(--muted);margin-left:.3rem}
.unit .desc{font-size:.8rem;color:var(--muted)}
.unit:disabled{opacity:.45;cursor:default}
.quick button:disabled{opacity:.45;cursor:default}
.wrongbook{margin-top:.75rem;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;background:var(--opt)}
.wrongbook[hidden]{display:none}
.book-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.book-head .sub{margin:0}
.book-head .ghost{padding:.3rem .9rem;font-size:.9rem}
.book{list-style:none;margin:.5rem 0 0;padding:0;max-height:16rem;overflow-y:auto}
.book{max-height:24rem}
.book li{border-top:1px solid var(--line)}
.bq{display:flex;flex-wrap:wrap;gap:.15rem .6rem;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:.5rem 0;cursor:pointer;font-size:.95rem;line-height:1.6}
.bq .src{color:var(--muted);font-size:.8rem}
.bq .bstem{flex-basis:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.bq .bans{flex-basis:100%;color:var(--right);font-size:.9rem;display:none}
.book li.open .bstem{display:block;-webkit-line-clamp:unset}
.book li.open .bans{display:block}
.book .tag{color:var(--wrong);font-size:.8rem}
.book .tag.ok{color:var(--right)}
.stale{
  position:absolute;left:50%;top:.75rem;transform:translateX(-50%);width:max-content;max-width:calc(100% - 2rem);
  background:var(--panel);color:var(--ink);border:1.5px solid var(--wrong);border-radius:12px;
  padding:.6rem .9rem;font-size:.95rem;line-height:1.5;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;
}
.stale[hidden]{display:none}
.stale button{font-size:.9rem;padding:.3rem .9rem;border-radius:999px;border:0;background:var(--ink);color:var(--panel);cursor:pointer}
/* 存檔失敗警告會一直掛著：靠左放，讓出右上角的「存成圖片」 */
#savewarn{left:.75rem;transform:none;max-width:calc(100% - 8.5rem)}
.go{margin-top:1.25rem}
.credit{margin:.9rem 0 0;font-size:.75rem;line-height:1.6;color:var(--muted)}
.credit .ver{margin-left:.5rem;white-space:nowrap}
.fine{margin-top:1.5rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

button:focus-visible,.unit:focus-visible,.chip:focus-visible{outline:3px solid var(--water);outline-offset:2px}
/* 鍵盤移動選項：低調的焦點（只在鍵盤操作時出現，滑鼠點擊不會） */
.opt:focus-visible{outline:none;border-color:var(--water);background:var(--opt-hover);box-shadow:0 0 0 3px color-mix(in srgb,var(--water) 16%,transparent)}

@media (max-width:760px){
  body{flex-direction:column}
  .land{flex:1 1 40%}
  .panel{width:100%;flex:1 1 60%;border-left:0;border-top:1px solid var(--line)}
  .water{padding:.5rem 1rem;min-height:3rem;gap:.4rem}
  .view{padding:.9rem 1rem 1.2rem}
  .stem{font-size:1.02rem}
  .opt{font-size:.97rem}
}
@media (max-width:480px){ .water-label{display:none} }
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>
<main class="land" id="land">
  <canvas id="cv" aria-label="你的土地。手上有水時，點一下土地把水滴下去。"></canvas>
  <div class="hint" id="hint">一片安靜的空地</div>
  <div class="toast" id="toast" role="status"></div>
  <button class="snap" id="snap" hidden>存成圖片</button>
  <div class="stale" id="stale" role="alert" hidden>另一個分頁更新了紀錄，這個分頁先暫停存檔。<button type="button" onclick="location.reload()">重新載入</button></div>
  <div class="stale" id="savewarn" role="alert" hidden>存檔失敗（可能是瀏覽器空間不足），最近的進度還沒存到。</div>
</main>
<aside class="panel">
  <div class="water">
    <span class="water-label">手上的水</span>
    <div class="drops" id="drops" aria-live="polite"></div>
    <button class="bar-btn" id="range">範圍</button>
    <button class="bar-btn" id="reset">清空土地</button>
  </div>

  <section class="view" id="quiz" hidden>
    <p class="where"><span class="kind" id="kind"></span><span id="scope"></span><span class="again" id="again" hidden>上次答錯的題</span></p>
    <p class="stem" id="stem"></p>
    <ul class="opts" id="opts"></ul>
    <div class="after" id="after">
      <p class="msg" id="msg"></p>
      <div class="card" id="card"></div>
      <button class="next" id="next">下一題</button>
    </div>
  </section>

  <section class="view pick" id="pick" hidden>
    <h2>要練哪些題？</h2>
    <p class="sub">iPAS AI 應用規劃師（初級）。可以選一份，也可以多選一起考。</p>
    <div class="units" id="units"></div>
    <div class="quick">
      <button type="button" data-q="1">全選科目一</button>
      <button type="button" data-q="2">全選科目二</button>
      <button type="button" data-q="all">全選</button>
      <button id="book" type="button">看錯題本</button>
    </div>
    <div class="wrongbook" id="wrongbook" hidden></div>
    <h3>出題方式</h3>
    <div class="chips">
      <button class="chip" id="weak">只出還不熟的題</button>
      <button class="chip" id="mix">打亂選項順序</button>
    </div>
    <button class="next go" id="go">開始</button>
    <div class="fine">
      <span>連續答對兩次，就算這題「熟了」。紀錄存在這台裝置上。</span>
      <button class="bar-btn" id="wipe">清除作答紀錄</button>
    </div>
    <p class="credit">題目：iPAS AI 應用規劃師（初級）114-4、115-1、115-2、115-3 公告試題，以及學習指引模擬考題（已套用官方勘誤）。歷屆試題沒有官方解析，學習指引的題目才有。<span class="ver" id="ver"></span></p>
  </section>
</aside>

<script type="application/json" id="bank">[{"id":"114-4-1-1","src":"114-4","subj":1,"n":1,"q":"在人工智慧系統的決策流程中，下列哪一種情境最符合「人在迴圈上（Human-over-the-loop）」所強調的監督機制？","o":["AI 系統只能提供建議，人類需主動下達命令才能進行決策","人類對 AI 的運行進行日常監督，必要時可立即介入修正或干預","人類平時不參與 AI 的運作，僅在發生異常或重大錯誤時才接手控制","AI 的所有判斷與行動在執行前，皆須經過人類逐一審核與批准"],"a":1,"ex":""},{"id":"114-4-1-2","src":"114-4","subj":1,"n":2,"q":"下列哪一種特徵工程技巧，最適合將「星期幾」和「24 小時制時間」這兩個欄位結合，以預測通勤時間？","o":["One-hot 編碼（One-hot encoding）","正規化（Normalization）","特徵交叉（Feature Cross）","寬深模型（Wide and Deep）"],"a":2,"ex":""},{"id":"114-4-1-3","src":"114-4","subj":1,"n":3,"q":"關於 ETL（Extract-Transform-Load），下列敘述何者為正確？","o":["E 表示將資料直接儲存至目標儲存庫","ETL 的處理順序可以自由調整為 TEL","L 表示將目標儲存庫經過反加密處理載入資料","T 包括資料的清理與排序"],"a":3,"ex":""},{"id":"114-4-1-4","src":"114-4","subj":1,"n":4,"q":"關於資料正則化（Regularization）L1、L2 方法，下列敘述何者正確？","o":["L1 權重個數愈多，愈可以提升模型的正確率","L2 稱為 Lasso 正則化","L1 運用減少權重的絕對值來控制模型的複雜度","L2 較 L1 正則化方法會將特徵權重趨近於零"],"a":2,"ex":""},{"id":"114-4-1-5","src":"114-4","subj":1,"n":5,"q":"在機器學習中，「偏差與變異權衡（Bias-Variance Tradeoff）」主要用來解決下列哪一類型的問題？","o":["因資料來源或收集方式限制，導致模型學習到的資訊不足","測試資料樣本與訓練資料高度重複，造成模型泛化能力評估失準","訓練資料中類別分布不均，使模型在少數類別上表現不佳","如何在模型偏差與變異之間取得平衡，以避免過度擬合或欠擬合"],"a":3,"ex":""},{"id":"114-4-1-6","src":"114-4","subj":1,"n":6,"q":"在 Lasso 模型中，L1 正則化（Regularization）導致參數收斂為零的原因為何？","o":["L1 正則化忽略目標變數","L1 對梯度有平滑作用","L1 對大係數懲罰較強，促使稀疏解","L1 會轉換損失函數為非凸形"],"a":2,"ex":""},{"id":"114-4-1-7","src":"114-4","subj":1,"n":7,"q":"貝氏分類器（Naive Bayes Classifier）常被應用於文字分類、垃圾郵件過濾等場景。依據模型特性，它最適合歸類於下列哪一類？","o":["透過直接學習輸入特徵與目標標籤之間的邊界或關係來進行分類的模型","透過建構資料的整體分布，並利用條件關係進行推斷和分類的模型","側重探索資料中樣本間的相似性，將資料自動分成不同群組的模型","透過試錯學習，根據行動結果的獎勵或懲罰來優化決策策略的模型"],"a":1,"ex":""},{"id":"114-4-1-8","src":"114-4","subj":1,"n":8,"q":"為提升生成式 AI 系統回應的語境一致性，常會結合哪類模型技術？","o":["決策樹分類器（Decision Tree Classifier）","條件語言模型（Conditional Language Model）","強化學習 Q-learning 函數模型","基因演算法（Genetic Algorithm）"],"a":1,"ex":""},{"id":"114-4-1-9","src":"114-4","subj":1,"n":9,"q":"根據 2025 年 9 月行政院通過之《人工智慧基本法》草案，政府推動人工智慧之「創新實驗環境」制度，主要參考歐盟的何種制度？","o":["Data Protection Impact Assessment","Regulatory Sandbox","AI Trust Label","AI Ethics Review Board"],"a":1,"ex":""},{"id":"114-4-1-10","src":"114-4","subj":1,"n":10,"q":"根據《金融機構運用人工智慧技術作業規範》，金融機構須建立內部治理架構，並指定專責單位或人員負責推動及管理人工智慧事務，下列何者並非規範所明訂須落實的治理措施？","o":["辦理人工智慧人才培育","清楚了解生成式 AI 技術之運作模式","每日公布人工智慧系統運作狀況","指派高階主管或委員會進行監督管理"],"a":2,"ex":""},{"id":"114-4-1-11","src":"114-4","subj":1,"n":11,"q":"下列哪一類問題最適合使用非監督式學習（Unsupervised Learning）來處理？","o":["根據已標記的醫療影像訓練模型診斷疾病","根據使用者行為將用戶分群，以優化行銷策略","透過已知交通事故記錄預測未來事故發生機率","根據歷史股價預測未來股市的走勢"],"a":1,"ex":""},{"id":"114-4-1-12","src":"114-4","subj":1,"n":12,"q":"下列哪一種圖表最適合用來呈現並分析「兩個數值型變數」之間的關係，例如觀察身高與體重的相關性？","o":["散佈圖（Scatter Plot）","折線圖（Line Chart）","直方圖（Histogram）","長條圖（Bar Chart）"],"a":0,"ex":""},{"id":"114-4-1-13","src":"114-4","subj":1,"n":13,"q":"下列哪一項應用情境與機器學習類型搭配正確？","o":["在醫療影像資料中，僅有少部分影像有專家標註診斷，其餘大多數影像未標註，研究者結合已標註與未標註資料來建立模型 — 監督式學習（Supervised Learning）","在自駕車模擬環境中，模型透過試駕獲得「是否安全通過路口」的獎勵或懲罰訊號，逐步調整決策策略 — 非監督式學習（Unsupervised Learning）","在顧客購買紀錄中，利用已知的「顧客是否流失」標籤，訓練模型以預測新顧客未來是否會流失 — 強化式學習（Reinforcement Learning）","在股票市場資料中，輸入歷史股價序列，嘗試將未來可能走勢劃分成若干「上升型、盤整型、下降型」群組，無需使用任何標籤 — 非監督式學習（Unsupervised Learning）"],"a":3,"ex":""},{"id":"114-4-1-14","src":"114-4","subj":1,"n":14,"q":"某企業分析團隊正在處理一組近兩年的營運與銷售數據，共有四個部門提出了各自的分析需求，請判斷哪一個最接近「預測性分析（Predictive Analysis）」的特性？","o":["視覺化所有產品線過去月銷售走勢與標準差，觀察其分佈情況與波動程度","藉由資料比對分析，找出去年母親節促銷失效的地區與品類組合","建構模型推算下一季的主力商品銷量，以規劃備貨與倉儲資源配置","透過熱圖分析廣告投放成本與訂單轉換率之間的潛在關聯性"],"a":2,"ex":""},{"id":"114-4-1-15","src":"114-4","subj":1,"n":15,"q":"某模型使用 K-近鄰演算法（KNN）進行分類，K 設為 3。 一筆新的測試資料輸入後，與其最接近的 3 筆資料的類別如下：鄰近樣本 1：類別 A；鄰近樣本 2：類別 B；鄰近樣本 3：類別 A。請問模型會將這筆資料預測為哪一類別？","o":["類別 A","類別 B","類別 A 與 B 各一半，無法分類","類別 A 或 B，視距離遠近加權而定"],"a":0,"ex":""},{"id":"114-4-1-16","src":"114-4","subj":1,"n":16,"q":"某團隊想採用循環神經網路（Recurrent Neural Network, RNN）建構長期氣候數據的預測模型，以下哪一項敘述最符合使用 RNN 可能會遇到的挑戰？","o":["RNN 無法處理可變長度的序列輸入，因此在實務上限制極大","RNN 在長序列訓練中可能出現梯度消失，影響模型效果","RNN 無法捕捉時間上的依賴關係，因此預測準確度低","RNN 只能用於分類任務，不能應用於時間序列預測"],"a":1,"ex":""},{"id":"114-4-1-17","src":"114-4","subj":1,"n":17,"q":"一間金融科技公司設計一款智慧投資系統，該系統會根據市場變化自動決定「買進」、「持有」或「賣出」的行動，並根據每次交易後的盈虧結果，逐步優化下一次的投資策略。整個過程中，系統不依賴事先標記的資料，而是根據歷次行動獲得的獎勵進行調整。請問此系統最可能採用哪一種學習方法？","o":["強化式學習（Reinforcement Learning）","監督式學習（Supervised Learning）","非監督式學習（Unsupervised Learning）","遷移學習（Transfer Learning）"],"a":0,"ex":""},{"id":"114-4-1-18","src":"114-4","subj":1,"n":18,"q":"關於 Q-Learning 與 Deep Q-Learning，下列敘述何者最正確？","o":["Q-Learning 與 Deep Q-Learning 的差異在於是否使用標記資料作為學習基礎","Q-Learning 可處理任意維度的狀態空間，因此比 Deep Q-Learning 更靈活","Deep Q-Learning 透過深度神經網路近似 Q 值，避免了 Q 表在高維空間中難以擴展的問題","Deep Q-Learning 無法搭配經驗回放（Experience Replay），因為會導致樣本順序被打亂"],"a":2,"ex":""},{"id":"114-4-1-19","src":"114-4","subj":1,"n":19,"q":"在訓練機器學習模型時，若任務為預測房價，應選用下列哪一種損失函數（Loss Function）來衡量預測誤差？","o":["均方誤差（MSE）","交叉熵損失（Cross-Entropy Loss）","Hinge 損失（Hinge Loss）","KL 散度（Kullback-Leibler Divergence）"],"a":0,"ex":""},{"id":"114-4-1-20","src":"114-4","subj":1,"n":20,"q":"某醫院希望開發一個系統，根據患者的年齡、血壓與 BMI 等資訊，預測其罹患糖尿病的機率（0~1），並依據預測值是否超過 0.5 做出風險警示。下列哪一種模型最適合用於此分類任務？","o":["邏輯迴歸（Logistic Regression）","支援向量機（Support Vector Machine）","決策樹（Decision Tree）","K 平均演算法（K-means）"],"a":0,"ex":""},{"id":"114-4-1-21","src":"114-4","subj":1,"n":21,"q":"某金融科技公司正開發一套違約風險預測系統，需大量處理不同客戶的財務特徵資料。考量到資料特徵數量眾多，且希望提升預測的穩定性與泛化能力，下列哪一種鑑別式 AI 模型最適合？","o":["邏輯迴歸（Logistic Regression）","支援向量機（Support Vector Machine）","決策樹（Decision Tree）","隨機森林（Random Forest）"],"a":3,"ex":""},{"id":"114-4-1-22","src":"114-4","subj":1,"n":22,"q":"關於變分自編碼器（Variational Autoencoder, VAE）的運作流程，下列何者敘述最為正確？","o":["解碼器的任務是將低維壓縮向量分類為不同類別","編碼器將輸入資料轉換為可視化圖像以利模型學習","編碼器將資料轉換為潛在空間表示，解碼器再重建資料","編碼器利用最大邊際機率對資料進行異常點偵測"],"a":2,"ex":""},{"id":"114-4-1-23","src":"114-4","subj":1,"n":23,"q":"下列何者不是我國數位發展部 AI 產品與系統評測中心對生成式 AI 的評測項目？","o":["當責性","可靠性","隱私及資安","互動性"],"a":3,"ex":""},{"id":"114-4-1-24","src":"114-4","subj":1,"n":24,"q":"在保持 GPT-OSS 模型架構不變的前提下，如果將模型參數量從 20 億提升至 120 億，並假設有足夠的訓練資料支撐，下列敘述何者最正確？","o":["模型參數增加會線性提升效能，且即使訓練資料不變也不會遇到瓶頸","參數越多模型推理越快，因為每層可以並行計算更多參數","較大的參數量能提升模型的表達能力與預測效能，但需足夠訓練資料支持","增加參數量不影響記憶體使用，只會影響計算速度"],"a":2,"ex":""},{"id":"114-4-1-25","src":"114-4","subj":1,"n":25,"q":"在自然語言處理任務中，為了減少訓練語料中偏見對模型的影響，下列哪種資料處理策略屬於常見的「資料去偏（Data Debiasing）」做法？","o":["讓模型在訓練時隨機替換輸出，以抵消資料中存在的系統性偏差","增加模型的參數量，依賴更大的模型自動消除原始資料中的偏見","調整或擴充訓練語料，使不同群體或類型資料的比例更加平衡，避免模型過度偏向出現頻率高的類別","對訓練資料施加額外正則化或噪音，使模型在學習過程中對偏見敏感度降低"],"a":2,"ex":""},{"id":"114-4-1-26","src":"114-4","subj":1,"n":26,"q":"在深度學習模型的微調（Fine-tuning）過程中，可能出現所謂的「災難性遺忘(Catastrophic Forgetting)」。此現象最可能造成哪種情況？","o":["由於計算資源或訓練步驟不足，模型在微調過程中無法完整收斂，導致學習效果受限","微調後模型的表現變得隨機，無法有效記憶新學到的模式與知識","微調後模型的部分權重產生偏移，導致模型無法針對較長的文字進行回應","模型過度適應微調的資料分佈，逐漸遺忘先前預訓練所獲得的廣泛知識，在原有任務或廣泛領域上表現變差"],"a":3,"ex":""},{"id":"114-4-1-27","src":"114-4","subj":1,"n":27,"q":"在大型 Transformer 模型的效能優化過程中，常見的方法之一是「剪枝（Pruning）」。下列哪一項最符合該方法的核心概念？","o":["將模型中所有權重按比例縮小，使其值更接近零，以降低計算量","移除模型中影響較小或冗餘的部分權重參數，以減少模型大小並提升推理效率","在訓練時僅更新部分權重而將其他權重凍結，從而減少需要調整的參數數量","根據注意力分數動態跳過處理部分輸入 Token，以減少每次前向傳播的計算"],"a":1,"ex":""},{"id":"114-4-1-28","src":"114-4","subj":1,"n":28,"q":"對非常長的輸入序列進行推理（Inference），Transformer 模型推理的主要計算瓶頸通常是什麼？","o":["模型輸出層產生文本的過程，因為每生成一個詞都必須重新訓練整個模型一次","詞嵌入（Embedding）查找操作，因為其時間複雜度隨詞彙表大小指數級增長","Softmax 函數的計算，因為對每個 Token 都需要執行繁重的運算","自注意力層的計算和其記憶體使用，因為注意力矩陣的大小隨序列長度呈平方級增長"],"a":3,"ex":""},{"id":"114-4-1-29","src":"114-4","subj":1,"n":29,"q":"在「可解釋人工智慧（Explainable AI, XAI）」領域中，LIME（Local Interpretable Model-agnostic Explanations）方法最核心的應用目的是什麼？","o":["解釋單一樣本（局部預測）的黑箱模型決策過程","全面提升黑箱模型整體的預測準確度","將黑箱模型轉換成完全可解釋的模型作為替代","用於生成大量擬真數據來替代訓練集"],"a":0,"ex":""},{"id":"114-4-1-30","src":"114-4","subj":1,"n":30,"q":"在醫療診斷決策支援系統等高風險領域中，「可解釋人工智慧（Explainable AI, XAI）」的核心價值最主要呈現在哪個面向？","o":["透過提供可理解的決策依據，促進患者與醫療專業人員對系統診斷結果的信任與接受度","以可解釋性方法優化臨床資料蒐集與管理流程，從而降低整體醫療作業成本","利用解釋機制增強模型預測的統計顯著性與準確度，使其在研究及實務應用中更具科學性","透過提供透明化的運作過程，進而減輕臨床人員負擔，並提升醫療服務的整體效率"],"a":0,"ex":""},{"id":"114-4-1-31","src":"114-4","subj":1,"n":31,"q":"在金融科技公司的信貸決策系統中，導入反事實解釋（Counterfactual Explanation）時，實際部署往往伴隨技術與監管挑戰。下列哪一項最符合該情境下的核心挑戰？","o":["需要建立完整的客戶行為預測模型來估算建議改變的實施成本，並整合到現有的風險管理系統架構中","必須使用聯邦學習技術保護客戶隱私，同時在分散式環境中計算跨機構的反事實解釋結果","需要建構時間序列因果圖來處理客戶信用狀況的動態變化，並預測未來可能的信用評分軌跡","生成的反事實樣本必須滿足特徵間的因果約束和業務邏輯約束，同時確保建議的改變在現實中具有可操作性且符合公平放貸法規"],"a":3,"ex":""},{"id":"114-4-1-32","src":"114-4","subj":1,"n":32,"q":"在統計推論中，若樣本來自母體但呈現明顯偏態分布，且樣本數有限，下列哪一項策略最能減少推估母體參數的偏誤？","o":["直接使用樣本平均數與變異數估計母體參數，不做任何調整","增加樣本數並考慮使用分位數或中位數作為中心趨勢估計","將樣本隨機重新排列後，多次計算平均值以消除偏態影響","完全依賴樣本標準差來估計母體參數，忽略分布形態"],"a":1,"ex":""},{"id":"114-4-1-33","src":"114-4","subj":1,"n":33,"q":"在工業物聯網架構中，進行設備預測性維護(Predictive Maintenance)時，若面對異常事件發生頻率極低、樣本高度不平衡的時間序列資料，下列哪一種方法最能兼顧模型穩定性與異常偵測效能？","o":["將每筆異常事件資料複製多次以提升模型對異常的辨識敏感度，搭配全序列訓練模型（如 LSTM）","對時間序列進行差分與標準化後，使用傳統監督式學習模型（如 SVM）進行分類訓練","使用經過時間序列特化的 SMOTE 技術生成異常樣本，以平衡異常與正常資料比例","採用基於重建誤差的自編碼器模型（Sequence-to-Sequence Autoencoder）進行異常偵測，並僅使用正常資料進行訓練"],"a":3,"ex":""},{"id":"114-4-1-34","src":"114-4","subj":1,"n":34,"q":"在零售業進行客戶行為分析時，資料倉儲中發現多個欄位儲存相同的購買金額資訊(例如：amount_usd、total_price、transaction_value)，但其單位、命名慣例及格式不一致，進而導致特徵工程階段混淆模型輸入。針對此種跨欄位語義重疊與結構冗餘問題，下列哪一種資料處理策略最合適且具實務可行性？","o":["利用資料探勘技術自動選擇資料集中對目標變數最敏感的欄位，其他欄位捨棄即可，避免過度清理干擾原始結構","保留所有相似欄位，交由高階模型（如 Gradient Boosting 或 Deep Learning）自動學習特徵關聯，無需手動處理","建立欄位命名標準，統一金額單位與格式，進行欄位正規化與語義合併，減少重複資訊影響特徵重要性估計","將重複欄位視為類別欄位，進行 One-hot 編碼（One-hot encoding）後輸入模型，以避免數值誤導模型學習過程"],"a":2,"ex":""},{"id":"114-4-1-35","src":"114-4","subj":1,"n":35,"q":"某大型零售企業準備將商品推薦模型上線，專案團隊在檢視訓練資料時，發現部分商品類別（例如高價商品）樣本數量極少，而多數樣本集中於低價商品。若此不平衡問題未妥善處理，下列何種狀況最可能在實際推薦結果中發生？","o":["模型在預測時傾向輸出稀有類別，導致雖能捕捉到少數樣本，但精確率（Precision）顯著下降","模型由於類別分布不均，難以建立有效的線性分離邊界，進而無法收斂","模型過度聚焦於稀有類別樣本，導致對多數類別的預測能力下降，整體效能受損","模型學到的決策邊界主要由多數類別主導，忽視了稀有類別，造成該類別的召回率（Recall）大幅降低"],"a":3,"ex":""},{"id":"114-4-1-36","src":"114-4","subj":1,"n":36,"q":"某電商資料團隊要協助行銷部門規劃再行銷策略。目前取得資料包含使用者點擊、購買紀錄、流量來源與轉換率。若資料團隊希望先進行探索性資料分析（EDA），下列哪一項最符合 EDA 的做法？","o":["建立隨機森林模型，預測使用者是否會完成購買","使用 K-means 對使用者群進行分群並立即制定對應促銷策略","繪製各類流量來源對轉換率的關聯圖，尋找潛在關係","對不同購物路徑設定統計假設並進行雙樣本 t 檢定"],"a":2,"ex":""},{"id":"114-4-1-37","src":"114-4","subj":1,"n":37,"q":"某金融科技公司在利用歷史交易資料建立風險控管模型時，嘗試推估整體詐騙交易比例。近期發現，樣本間存在明顯的時間序列相關性，導致模型在實際偵測新交易時誤判率升高。若希望同時改善詐騙比例推估的準確性並提升模型的穩健性，下列哪一種做法最為合適？","o":["擴充樣本數量，以涵蓋更多潛在的詐騙型態，但維持既有的隨機抽樣方式不變","採取時間序列敏感的抽樣策略，例如依據交易時間區間進行分層，以保存原始的時間結構特性","將資料完全隨機打散，以降低序列相關性對模型訓練造成的影響","在模型評估時，針對相鄰時間區段進行誤差合併，以便用整體估計方式修正詐騙比例"],"a":1,"ex":""},{"id":"114-4-1-38","src":"114-4","subj":1,"n":38,"q":"某公司建置基於檢索增強生成（RAG）的知識查詢系統，需同時兼顧查詢效能與資料的即時更新。近期發現回應內容偶爾過時，且每次更新文件都需完整重建索引，導致系統在更新期間無法服務。若要解決此問題並提升整體穩健性，下列哪項做法最適合？","o":["調整生成模型的回應隨機性參數，以降低答案偏差並提升一致性","提升檢索與索引的運算效能，以縮短查詢與更新所需時間","採用索引的增量或分段更新方式，使新資料能即時納入而不需全部重建","建立常見問題的標準答案集，透過快速檢索回應以降低模型負擔"],"a":2,"ex":""},{"id":"114-4-1-39","src":"114-4","subj":1,"n":39,"q":"某醫院計畫開發住院日數預測模型，以協助病房調度。多數病人的住院日數集中在 3-7 天，但仍有少數重症患者因治療需求而住院日數明顯偏長。醫院希望採用一種合適的評估方式，既能兼顧大部分病人的預測準確度，也能確保對重症個案的預測維持穩健。下列哪一種方法最符合此需求？","o":["在模型檢核時，同時呈現平均絕對誤差（MAE）與重症子群的誤差指標","僅針對一般病人樣本進行交叉驗證，以避免重症個案拉高誤差","將所有病人的住院日數進行標準化處理，以減少數值範圍差異的影響","只採用單一的整體決定係數（R²）作為模型優劣的判斷依據"],"a":0,"ex":""},{"id":"114-4-1-40","src":"114-4","subj":1,"n":40,"q":"關於監督式學習（Supervised Learning）與非監督式學習（Unsupervised Learning）的目標，下列敘述何者錯誤？\n1. 非監督式學習的核心在於發掘資料內在結構，例如分群、關聯規則與降維，而不依賴外部標籤。\n2. 監督式學習的典型應用為分類與迴歸，通常不適合應用於異常偵測任務。\n3. 非監督式學習若搭配少量標註資料，即會完全轉化為監督式學習。\n4. 監督式學習仰賴已標註的資料集，透過最小化輸出與真實標籤之間的差距，學習輸入與目標之間的對應函數。\n5. 所有監督式學習任務都必須要有大量完整標註資料，否則無法進行任何有效的模型訓練。\n6. 非監督式學習不需要目標變數，僅透過輸入資料本身的特徵分布進行模式學習。","o":["3、5、6","1、4、6","2、4、6","2、3、5"],"a":3,"ex":""},{"id":"114-4-1-41","src":"114-4","subj":1,"n":41,"q":"一家旅遊平台希望建立模型，預測顧客下次是否會再次透過該平台訂房。資料包含：顧客 ID、年齡、旅遊次數、平均花費金額、主要交通方式（火車/飛機/自駕/公車）、會員等級（普通/進階/白金）、是否為海外旅遊等。下列哪一種特徵工程方法最適合處理「主要交通方式」欄位？","o":["布林轉換（Boolean Conversion）","序數編碼（Ordinal Encoding）","數值標準化（Numerical Standardization）","One-hot 編碼（One-hot Encoding）"],"a":3,"ex":""},{"id":"114-4-1-42","src":"114-4","subj":1,"n":42,"q":"一家跨國醫療研究機構希望利用各地醫院的病患資料，建立一個能夠預測疾病早期風險的機器學習模型。由於各國法規限制，病患的原始資料無法集中到單一伺服器。在此情境下，下列哪一種方法最能同時滿足「各醫院保留資料不外流」與「模型仍能跨院學習」的需求？","o":["資料匿名化（Data Anonymization）","差分隱私（Differential Privacy）","聯邦學習（Federated Learning）","交叉驗證（Cross-validation）"],"a":2,"ex":""},{"id":"114-4-1-43","src":"114-4","subj":1,"n":43,"q":"某公司欲建立員工離職風險預測模型，資料集中包含「年度績效分數」、「平均每月加班時數」、「年齡」等數值型特徵。由於各特徵的數值範圍差異極大（例如績效分數 1-5、加班時數 0-80、年齡 20-65），若直接輸入至使用梯度下降的邏輯迴歸(Logistic Regression)模型，可能導致模型收斂緩慢或權重偏斜。為提升模型訓練效率與準確度，下列哪一種特徵工程方法最適合應用於這些數值特徵？","o":["布林轉換（Boolean Conversion）","時間序列分解（Time Series Decomposition）","One-hot 編碼（One-hot Encoding）","數值標準化（Numerical Standardization）"],"a":3,"ex":""},{"id":"114-4-1-44","src":"114-4","subj":1,"n":44,"q":"在機器學習中，「叢集（Clustering）」方法最典型的應用情境是下列何者？","o":["根據歷史交易紀錄與已標註的詐欺案例，訓練模型來偵測未來的詐欺交易","使用醫療數據與病患的診斷標籤，建立模型以預測病人是否罹患特定疾病","根據顧客的消費行為與特徵，將顧客自動劃分為數個群組，以便進行差異化行銷","透過大量已標註影像，訓練深度學習模型來辨識照片中的物件種類"],"a":2,"ex":""},{"id":"114-4-1-45","src":"114-4","subj":1,"n":45,"q":"某醫院研究團隊蒐集了大量病患的「收縮壓」數據，經檢驗後顯示此數值大致呈現常態分布。在進行後續模型分析前，研究人員希望妥善處理可能存在的極端血壓數值。下列哪一種做法最為合適？","o":["將所有極端偏高或偏低的血壓數據直接刪除，以保留最具代表性的病患樣本","使用對數轉換（Log Transformation），將數據壓縮至更接近常態，以降低極端值的影響","透過 Z 分數（Z-score）或標準差範圍檢測異常值，並依研究需求決定是否調整或移除","將檢測到的離群值以 Label Encoding 編碼，轉換為序號標籤以避免影響原始分布"],"a":2,"ex":""},{"id":"114-4-1-46","src":"114-4","subj":1,"n":46,"q":"某電商公司想預測用戶是否會購買特定商品，資料中包含多種用戶屬性與行為特徵。分析師希望選出對購買結果最有預測價值的特徵，以提升模型效能。下列哪一種描述最符合監督式特徵選擇（Supervised Feature Selection）的概念？","o":["根據特徵的整體分布、變異度或資訊量進行篩選，而不直接參考目標變數","評估每個特徵與目標變數之間的相關性，選擇對預測結果貢獻最大的特徵","使用模型評估特徵對預測結果的重要性，並保留對目標變數影響較大的欄位","將特徵透過降維方法（如 PCA）轉換為新特徵，再用於模型訓練"],"a":1,"ex":""},{"id":"114-4-1-47","src":"114-4","subj":1,"n":47,"q":"在訓練神經網路時，為了提升模型收斂速度與穩定性，避免梯度消失或梯度爆炸，下列哪一種做法最常被使用？","o":["對輸入資料進行隨機旋轉或水平翻轉，以增加資料多樣性","選用 ReLU 或其變體作為隱藏層的啟動函數，以改善梯度傳播","減少樣本量提升訓練速度","對目標變數或特徵進行標準化"],"a":1,"ex":""},{"id":"114-4-1-48","src":"114-4","subj":1,"n":48,"q":"若希望檢視某一連續型數據的分布情形（如集中程度、偏態或是否呈現多峰），下列哪一種應用情境最適合使用直方圖（Histogram）來進行分析？","o":["探討顧客年齡資料的整體分布特徵，並檢視是否存在異常集中或分散現象","比較不同商品在各月份的銷售額變化趨勢，以觀察季節性波動","追蹤公司近一年營收的時間序列變化，以了解整體成長趨勢","檢視產品價格與月銷售量之間的關聯性，以評估是否具線性相關"],"a":0,"ex":""},{"id":"114-4-1-49","src":"114-4","subj":1,"n":49,"q":"下列何者並非我國數位發展部 AI 產品與評測中心在評估大型語言模型安全性時，所指出的常見使用指標？","o":["資料複雜性","事實正確性","偏見與歧視","惡意與濫用可能性"],"a":0,"ex":""},{"id":"114-4-1-50","src":"114-4","subj":1,"n":50,"q":"某雲端服務公司計畫將大型語言模型部署於線上系統，並以批次推論（Batch Inference）方式處理每日上百萬筆用戶請求。專案團隊在評估可能遇到的挑戰時，下列哪一項通常不會被視為批次推論階段的主要難題？","o":["如何確保訓練語料的涵蓋性與標註品質，以避免模型偏差影響輸出","當批次規模增大時，如何降低推論延遲並保持即時回應能力","在推論過程中，有效管理與分配龐大的輸入資料量以避免資源壅塞","在叢集環境中精確安排推論任務，以提升 GPU/TPU 等硬體資源的利用率"],"a":0,"ex":""},{"id":"114-4-2-1","src":"114-4","subj":2,"n":1,"q":"在 Low Code 平台的開發應用設計中，關於「模型（Model）」，下列敘述何者最符合實際情況？","o":["模型僅扮演設計視覺化的輔助工具，對應用邏輯的影響有限","模型是用來抽象描述資料結構、業務流程與介面邏輯的核心元素，影響應用的設計與維護","模型僅依循 UML（Unified Modeling Language）等傳統建模方式，缺乏針對 Low Code 環境的延展性","模型在 Low Code 平台中已被自動程式碼生成全面取代，實際價值有限"],"a":1,"ex":""},{"id":"114-4-2-2","src":"114-4","subj":2,"n":2,"q":"企業在導入生成式 AI 平台時，往往需要利用分散於不同部門或機構中的大量敏感文本資料。若希望在確保隱私的前提下，仍能讓模型持續優化並降低資料外洩風險，下列哪一種方法最適合？","o":["同態加密（Homomorphic Encryption）","安全多方計算（Secure Multi-party Computation）","零知識證明（Zero-knowledge Proofs）","聯邦學習（Federated Learning）"],"a":3,"ex":""},{"id":"114-4-2-3","src":"114-4","subj":2,"n":3,"q":"某企業利用 No Code/Low Code 平台開發內部營運系統。為確保系統在跨部門流程與外部服務整合下仍具良好的可測試性（Testability），下列哪一項作法最為合適？","o":["依賴 No Code/Low Code 平台提供的即時預覽與基本單元測試功能，快速驗證常見流程","導入可重複執行的自動化測試流程，並透過 API 或服務虛擬化進行模組化驗證","將測試聚焦於使用者介面互動與操作流程驗證，檢查系統表面功能","依靠使用者回饋與正式上線後的監控資料，作為修正依據"],"a":1,"ex":""},{"id":"114-4-2-4","src":"114-4","subj":2,"n":4,"q":"某社交平台嘗試結合自動提示工程（Automatic Prompt Engineer, APE）與圖提示（Graph Prompting），讓 AI 協助分析使用者之間的互動關係。在這個過程中，下列何者為最可能遇到的挑戰？","o":["圖結構轉換為文字提示時，可能導致部分關聯資訊遺失","APE 在圖資料上無法產生任何提示內容","圖轉文字後能完整保留所有上下文，對推理不造成影響","Graph Prompting 僅能處理線性路徑，限制多分支探索"],"a":0,"ex":""},{"id":"114-4-2-5","src":"114-4","subj":2,"n":5,"q":"在超長上下文任務中使用自動提示工程（Automatic Prompt Engineer, APE）時，可能面臨的最大限制是什麼？","o":["迭代優化難以因應上下文的不斷變動，導致調整失效","模型的記憶容量有限，無法完整保留所有長篇資訊","提示內容難以有效分解，無法支援複雜任務拆解","回饋機制通常僅針對局部片段，難以全面評估最終輸出品質"],"a":3,"ex":""},{"id":"114-4-2-6","src":"114-4","subj":2,"n":6,"q":"某設計團隊計畫在短時間內完成一款行動應用程式，必須同時達到高度個人化體驗、快速生成介面與行銷內容自動產出等需求。若結合 No Code/Low Code 平台與生成式 AI 技術，以下哪一種整合策略最能符合目標？","o":["使用生成式 AI 自動產生 API 呼叫與元件配置，並由開發者手動整合至 No Code 平台流程","透過生成式 AI 在 No Code 平台中自動建立介面模板，並結合使用者數據即時生成個人化功能與行銷推播內容","在 No Code 平台中導入生成式 AI，快速建立跨專案可重用的通用模組，專注於提升開發速度","在 No Code 平台中完全依賴生成式 AI 自動產生所有應用功能與流程，不經人工設計或驗證"],"a":1,"ex":""},{"id":"114-4-2-7","src":"114-4","subj":2,"n":7,"q":"某團隊希望讓 AI 自動查詢 GitHub 上的程式碼庫，並生成摘要給使用者參考。開發者決定透過 Model Context Protocol（MCP）來實現，AI 需先發出請求，再經由 MCP 架構逐步完成查詢與回傳。在此情境下，MCP 運作流程的正確順序為何？","o":["MCP Server→AI Host→MCP Client→資料查詢→結果回傳 AI Host","MCP Client→AI Host→MCP Server→資料查詢→結果回傳 AI Host","AI Host→MCP Client→MCP Server→資料查詢→結果回傳 AI Host","AI Host→MCP Server→MCP Client→資料查詢→結果回傳 AI Host"],"a":2,"ex":""},{"id":"114-4-2-8","src":"114-4","subj":2,"n":8,"q":"在 Agent-to-Agent（A2A）架構中，不同代理人之間會分工合作。一般而言，下列敘述何者最符合 Client Agent 與 Remote Agent 的互動流程？","o":["Remote Agent 主動分派任務給 Client Agent","由人工事先設定 Client Agent 與 Remote Agent 處理任務的先後順序","Client Agent 發起任務，Remote Agent 執行並回傳結果","Client Agent 與 Remote Agent 同時處理任務並同步處理結果"],"a":2,"ex":""},{"id":"114-4-2-9","src":"114-4","subj":2,"n":9,"q":"在導入生成式 AI 的應用規劃中，上下文工程（Context Engineering）的核心目的為何？","o":["縮短模型訓練時間","優化提示與上下文","增加模型參數數量","優化 Fine-tuning 正確率"],"a":1,"ex":""},{"id":"114-4-2-10","src":"114-4","subj":2,"n":10,"q":"某公司在導入生成式 AI 協助撰寫內部報告時，測試人員刻意在輸入的上下文中放入互相矛盾的資訊（例如：同一位員工在不同段落被描述為「入職三年」與「入職五年」）。在這種情況下，最常見的模型行為會是什麼？","o":["永遠選擇第一段資訊作為答案依據","可能生成幻覺或隨機採信其中一方的內容","拒絕回答，並要求提供更一致的輸入","自動判斷並只選擇正確的資訊"],"a":1,"ex":""},{"id":"114-4-2-11","src":"114-4","subj":2,"n":11,"q":"Agentic AI 在解決方案圖譜（Solution Graph）上尋找最佳解決路徑時，通常會使用什麼樣的搜尋策略？","o":["使用廣度優先、深度優先或最佳優先等演算法進行探索","每一步都隨機選擇動作，反覆嘗試直到找到一條可行路徑","只執行事先假定的一條路徑，失敗就停止","完全依靠 LLM 一次性推斷最優完整路徑"],"a":0,"ex":""},{"id":"114-4-2-12","src":"114-4","subj":2,"n":12,"q":"某企業考慮將開源大型語言模型（GPT-OSS）自行部署在本地伺服器，以取代雲端服務。下列何者最能代表本地部署對企業的實際好處？","o":["可以達到無運算成本，因為本地部署模型不會產生額外的資源消耗","模型的預測能力會比在雲端運行時更精度，因為本地環境更加可靠","可確保輸入模型的敏感資料不會傳輸給第三方，提升資料隱私和自主控制","以上皆是"],"a":2,"ex":""},{"id":"114-4-2-13","src":"114-4","subj":2,"n":13,"q":"關於 GitHub Copilot，下列敘述何者正確？","o":["GitHub Copilot 基於程式碼片段查詢工具，透過後端搜尋大型程式碼資料庫提供建議","GitHub Copilot 僅適用於 GitHub 上的開源專案，無法在私有程式碼庫或本地環境中提供程式碼補全建議","GitHub Copilot 利用靜態分析技術分析程式碼，根據邏輯流程推導下一步應寫的程式碼","GitHub Copilot 由 OpenAI 的 Codex 模型提供技術支援，可即時在開發者編輯程式碼時給出整行或整個函式建議"],"a":3,"ex":""},{"id":"114-4-2-14","src":"114-4","subj":2,"n":14,"q":"某電商公司導入 Agentic AI 來處理客服工作。測試發現 Agent 在回答產品 FAQ 時經常出錯，且無法幫客戶修改訂單。這種情況最可能是因為缺少下列哪兩項工具或技術？","o":["API 調用（API Calling）＋任務規劃器（Task Planner）","向量資料庫檢索（Vector Retrieval）＋API 調用（API Calling）","向量資料庫檢索（Vector Retrieval）＋任務規劃器（Task Planner）","任務規劃器（Task Planner）＋溫度參數（Temperature）設定"],"a":1,"ex":""},{"id":"114-4-2-15","src":"114-4","subj":2,"n":15,"q":"某客服自動回應系統希望根據不同客戶群體調整回覆風格。在兼顧即時性與效果的前提下，下列哪一種方案最適合？","o":["直接微調預訓練模型針對每個客戶群體分別訓練不同風格模型","利用控制變量（Control Tokens）或風格標籤在同一模型內動態調整風格","利用生成對抗網路（GAN）生成不同風格文本，並透過人工篩選最終答案","採用規則式替換方法，替換回覆詞彙以符合不同風格要求"],"a":1,"ex":""},{"id":"114-4-2-16","src":"114-4","subj":2,"n":16,"q":"在建置多代理大型語言模型（Multi-agent LLMs）系統時，如果沒有清楚定義每個代理的任務啟動條件和角色分工，最可能出現什麼問題？","o":["回覆內容前後不連貫，系統邏輯斷裂","不同代理的答案互相衝突，無法判斷最終決策","系統陷入無限對話循環，導致資源耗盡","多個代理重複做同樣的任務，造成效率低落"],"a":3,"ex":""},{"id":"114-4-2-17","src":"114-4","subj":2,"n":17,"q":"某公司部署結合 Fine-tuning 與檢索增強生成（RAG）的語言模型系統作為內部文件助理。系統需同時確保回覆語氣一致、能即時查詢每日新增文件、維持效能穩定，並避免頻繁重新訓練。在長期維護與效能平衡下，下列哪一種策略最合適？","o":["每週重新 Fine-tune 模型，將新文件整合進模型知識，逐步取代 RAG 模組","完全依靠基礎模型與 RAG，不進行 Fine-tune，僅透過提示設計控制語氣","每日進行增量 Fine-tune，讓模型即時學習新文件內容，避免依賴檢索","保留語氣相關 Fine-tuning，僅透過檢索系統更新文件內容，不頻繁改動模型"],"a":3,"ex":""},{"id":"114-4-2-18","src":"114-4","subj":2,"n":18,"q":"某客服系統在回覆「訂單取消政策」時，即使生成溫度固定為 0.6，回覆品質仍常出現差異。調查顯示，檢索到的政策內容有時是最新版本，有時則是過時文件，此外 Prompt 約束不足，微調語料也有模糊描述。若要優先改善品質波動，應先解決下列哪一項問題？","o":["調整溫度參數，降低生成隨機性","加強 Prompt 設計，限制模型表達方式","優化微調語料，減少含糊描述","提升檢索系統品質，確保取得的政策內容正確且最新"],"a":3,"ex":""},{"id":"114-4-2-19","src":"114-4","subj":2,"n":19,"q":"某醫院導入了一套智慧系統，由三個模組構成：語音辨識（ASR）→語言模型生成（LLM）→查詢醫療資料庫 API。近期發現部分查詢結果錯誤，例如醫師詢問「術後復健流程」時，系統卻誤判為要查詢「術前注意事項」，因此查詢到錯誤的文件。經檢查已排除語音辨識的錯誤，下列何者最可能是造成查詢錯誤的來源？","o":["醫療資料庫 API 對應規則設計不清，造成意圖映射模糊","LLM 的 Prompt 缺乏明確指示，導致語意分類判斷錯誤","查詢 API 回傳速度過慢，影響系統處理正確性","LLM 未經醫療領域微調，難以正確理解專業性詞彙"],"a":1,"ex":""},{"id":"114-4-2-20","src":"114-4","subj":2,"n":20,"q":"某醫院正在規劃一個 AI 專案，目的是協助醫師從胸腔 X 光影像中判斷是否存在肺炎徵兆，團隊卻誤將生成式 AI 模型運用於影像診斷。下列哪一項最可能成為主要風險？","o":["模型在生成報告時語句流暢，但僅在文字表達上有差異，對診斷結果沒有重大影響","模型若資料不足，僅會降低生成報告的完整性，而非影響判斷病灶的正確性","模型偏向生成內容而非分類，但此差異僅影響效率，不會造成誤診風險","模型可能生成與實際影像不符的診斷結論，導致誤判並引發醫療與法律風險"],"a":3,"ex":""},{"id":"114-4-2-21","src":"114-4","subj":2,"n":21,"q":"某公司開發的智慧車載語音助理，可透過語音辨識（ASR）辨識駕駛語音，再由 LLM 生成回答並查詢車載 API。測試中發現：ASR 對汽車專業術語辨識錯誤率高；LLM 的回覆常不精確；系統回覆延遲雖存在但仍可接受。若目標是「優先提升準確性與回答品質」，下列改進步驟的最合理執行順序為何？\n1. 擴充並標註汽車領域語音資料，微調 ASR 模型\n2. 微調 LLM 並加入檢索增強（RAG）\n3. 優化系統架構，引入批次推論降低延遲\n4. 動態調整生成溫度，平衡準確度與多樣性","o":["1→2→4→3","2→1→3→4","1→3→2→4","3→1→2→4"],"a":0,"ex":""},{"id":"114-4-2-22","src":"114-4","subj":2,"n":22,"q":"一家顧問公司使用生成式 AI 協助撰寫數據分析報告。雖然模型在測試中表現優異，但其生成的報告多半僅遵循固定段落結構，替換數值或關鍵詞即可完成，卻未能展現針對不同專案的多樣化推理與分析。下列何者為造成這種現象的最合理解釋？","o":["模型在生成過程中缺乏對字體與排版的優化能力，因此無法展現分析邏輯","測試資料涵蓋過多統計圖表，導致模型無法專注於文字內容的多樣化表達","模型過度依賴訓練語料中的常見報告範式，導致生成結果以樣板化結構取代真正的推理","模型因無法正確辨識報告中的頁碼與標題層級，才出現樣板化的結果"],"a":2,"ex":""},{"id":"114-4-2-23","src":"114-4","subj":2,"n":23,"q":"在應用零樣本提示（Zero-Shot Prompting）時，下列哪一種情境最可能因缺乏示範而失敗，出現語意錯誤或結構錯誤的輸出？","o":["要求模型判斷一段影評文字的情感傾向","要求模型將一段新聞摘要濃縮為一句話","要求模型將一段繁體中文翻譯成英文","要求模型從表格中擷取所有城市的最高氣溫"],"a":3,"ex":""},{"id":"114-4-2-24","src":"114-4","subj":2,"n":24,"q":"某保險公司計畫導入生成式 AI 的內部合約查詢系統，協助業務員與法務部門快速解讀保單條款與理賠規範。高層特別強調客戶資料隱私與合規風險控管，即使需要投入較多資源，也必須確保資料不會外洩。在此情況下，下列哪一種策略最符合公司的資料安全與合規優先考量？","o":["導入開源模型並由 IT 團隊自建，後續再逐步補強隱私與合規控管","在需求確認階段即納入法遵與稽核單位，設定準確率 KPI，並透過 MVP 驗證成效","優先使用雲端大型 API 模型快速部署，並根據使用數據持續調整","投入資源自訓並私有化部署 LLM，並同步建立自動化風控機制"],"a":3,"ex":""},{"id":"114-4-2-25","src":"114-4","subj":2,"n":25,"q":"某新創公司開發一套圖像描述生成系統，能根據輸入的照片自動產生說明文字。為了讓產生的描述文字能與圖片資訊精準對應，下列哪一種設計思路最關鍵？","o":["強化語言模型的句法與流暢性，確保生成文字更自然易讀","在生成過程中結合圖片特徵與語言建模，讓模型同時利用影像內容與文字資訊","調整生成策略（如 Beam Search 或溫度參數），以提升輸出文字的合理性","專注於文字序列上下文的建模，只提升文字間的連貫性"],"a":1,"ex":""},{"id":"114-4-2-26","src":"114-4","subj":2,"n":26,"q":"某電商平台希望生成的商品描述在風格與用詞上保持一致性，但不需要新增專業知識。下列哪種方法最適合？","o":["擴充語料庫並微調模型，使風格統一","增加提示詞複雜度，引導模型風格一致","降低生成溫度，以減少隨機性並提升風格一致性","使用全連接神經網路對生成結果後期篩選"],"a":2,"ex":""},{"id":"114-4-2-27","src":"114-4","subj":2,"n":27,"q":"某企業已建置 AI 語音記錄系統，並希望整合生成式 AI 進行「會議即時摘要」功能，下列哪一種策略最能提升摘要的語意品質與使用價值？","o":["使用語音轉文字模型即時輸出逐字稿並轉入 GPT 摘要","將語音逐段切分並建立關鍵字索引，以利摘要模型從中擷取核心內容生成會議重點","將語音轉文字後標註發言角色與主題邊界，結合語意分群進行動態摘要","將所有語音內容儲存為完整紀錄，提供事後人工摘要比對用"],"a":2,"ex":""},{"id":"114-4-2-28","src":"114-4","subj":2,"n":28,"q":"某公司正在開發一個智慧客服系統，負責回覆顧客關於退換貨、優惠活動與商品建議等問題。研發團隊嘗試使用不同的提示設計方式來提升模型效能。下列哪一個提示最符合「少樣本提示（Few-Shot Prompting）」的設計原則？","o":["「請回答顧客詢問：如何申請退貨？」","「以下是兩組客服對話範例，請依照相同風格回覆新的顧客問題」","「請逐步分析顧客投訴的原因，並依照推理過程生成合適回覆」","「請以正式的語氣回覆顧客的提問」"],"a":1,"ex":""},{"id":"114-4-2-29","src":"114-4","subj":2,"n":29,"q":"某投資公司導入生成式 AI，用於即時分析股市波動並提供市場背景資訊。若希望 AI 能兼顧「即時性」與「可靠性」。下列哪一項設計最能有效提升 AI 在即時股市分析上的表現？","o":["將 AI 系統連結至公司內部歷史交易資料庫，以便快速調用既有的案例參考","調整模型的回應邏輯，讓 AI 優先輸出最新市場行情，而不是完整的背景分析","建立與外部即時行情來源同步的查詢模組，確保 AI 能即時擷取最新金融數據","增加訓練資料中模擬的金融危機與市場異常案例，以提升 AI 在特殊情境下的表現能力"],"a":2,"ex":""},{"id":"114-4-2-30","src":"114-4","subj":2,"n":30,"q":"某大型物流公司計畫導入 AI 系統，以改善客服與配送作業的效率。專案團隊規劃了以下四個步驟，請問正確的執行順序為何？\n1. 建立符合公司服務流程的 AI 對話邏輯與應答範本，確保顧客體驗一致\n2. 明確定義導入 AI 的目標並設定關鍵績效指標（KPI）\n3. 蒐集與清理過往客服紀錄與配送相關資料，作為模型訓練素材\n4. 評估並選擇合適的 AI 技術供應商或開源方案，確立技術方向與架構","o":["2→3→4→1","3→2→1→4","2→1→3→4","1→4→3→2"],"a":0,"ex":""},{"id":"114-4-2-31","src":"114-4","subj":2,"n":31,"q":"某跨國電商企業導入生成式 AI，協助處理顧客服務請求，並根據顧客歷史訂單提供個人化建議。資安與法遵部門擔心 AI 在回覆時可能洩漏顧客個資，若要在導入初期優先避免觸法風險，下列哪一項措施最符合要求？","o":["在加密環境下導入完整的顧客訂單與行為資料，並透過嚴格存取控管降低洩漏風險","實施資料最小化與去識別化，確保 AI 在訓練與生成過程中不直接處理或暴露敏感個資","強化模型的回覆審查流程，透過自動過濾與人工抽查結合，降低個資外洩的機率","設定 AI 的角色與回覆範圍，讓其專注於客服相關內容，避免回答其他敏感議題"],"a":1,"ex":""},{"id":"114-4-2-32","src":"114-4","subj":2,"n":32,"q":"某國際銀行導入生成式 AI，用於彙整不同國家金融監管機構的合規規範，建立跨國合規知識庫。由於各國條文表述方式不同，且監管要求具有高度專業性與隱含邏輯，若要確保知識庫在後續查詢與生成報告時能維持正確性與一致性，下列哪一項 AI 能力最為關鍵？","o":["具備跨語言專業術語對齊與條文語意抽取能力，能正確辨識不同國家規範間的對應與差異","能自動最佳化文件檢索效率，縮短跨國法規查詢的延遲時間，提升合規部門使用體驗","能將合規文件轉換為多種輸出形式（如簡報、摘要或法規清單），以符合不同決策層級需求","具備根據歷史案例生成合規解釋的能力，協助新進員工快速理解法規在實務上的應用"],"a":0,"ex":""},{"id":"114-4-2-33","src":"114-4","subj":2,"n":33,"q":"在企業導入 MLOps（Machine Learning Operations）的過程中，除了模型部署與維運挑戰外，仍可能面臨其他推動上的困難。下列何者為 No Code 平台最能有效解決的挑戰？","o":["自動化大量資料的標註與前處理，以降低數據準備成本","提升運算基礎設施的可擴展性，以因應大規模服務需求","透過可視化建模介面，降低技術門檻並促進跨部門協作","提供進階特徵工程能力，優化高維度數據的處理效率"],"a":2,"ex":""},{"id":"114-4-2-34","src":"114-4","subj":2,"n":34,"q":"某醫療機構計畫導入生成式 AI 協助撰寫病歷摘要。在技術測試階段，為確保系統能安全應用於臨床，最應優先關注下列哪一項指標？","o":["資料儲存與存取架構的完整性，確保長期運作過程中的數據可追溯性","生成內容的醫療準確性與臨床一致性，避免出現錯誤或誤導性資訊","模型在不同病例語境下的泛化能力，確保不因個別樣本而偏差","系統回應時間的穩定性，以支援醫療場域中可能的即時需求"],"a":1,"ex":""},{"id":"114-4-2-35","src":"114-4","subj":2,"n":35,"q":"在即時客服系統的效能測試中，若針對延遲測試（Latency Testing）進行評估，下列哪一項指標最能反映系統是否符合用戶即時互動需求？","o":["AI 模型在同一分鐘內可完成的回覆訊息數量","客戶從輸入問題到收到第一個完整回應所需的時間","客服系統能連續提供服務的運行時長","AI 產生回答時用詞的多樣性與表達創意程度"],"a":1,"ex":""},{"id":"114-4-2-36","src":"114-4","subj":2,"n":36,"q":"某航空公司導入生成式 AI 聲控客服，提供航班與票務查詢。有人員透過惡意提示，試圖讓系統洩漏內部安檢流程。在此情境中，下列何者為降低提示攻擊（Prompt Injection）風險的最佳策略？","o":["導入輸入檢測與回應審核流程，防止敏感指令被執行","限制 AI 可回應的主題範圍，使系統僅回答非敏感的航班與票務查詢，避免處理內部或敏感流程資訊","隨機變化回覆內容，讓攻擊者難以預測回應行為以增加攻擊難度","擴充與更新航班與票務資料來源，以提升模型的知識正確性與覆蓋率"],"a":0,"ex":""},{"id":"114-4-2-37","src":"114-4","subj":2,"n":37,"q":"在機器學習模型的實務應用中，常會出現數據漂移（Data Drift）的情況。此現象主要是指下列哪一種情況？","o":["訓練時使用的資料分佈，與部署後實際輸入資料的統計特徵隨時間逐漸出現差異，導致模型表現衰退","在資料前處理過程中，因特徵刪減或缺失補值不當，造成樣本資訊量下降","模型對訓練數據擬合過度，在未知數據上泛化能力不足","後端資料庫因欄位定義或結構調整，導致特徵提取流程與原始設計不一致"],"a":0,"ex":""},{"id":"114-4-2-38","src":"114-4","subj":2,"n":38,"q":"某銀行導入生成式 AI 放貸審核系統，用於分析申貸人條件並生成初步審核意見。測試過程中發現，模型對不同族群的核准率存在顯著差異，可能引發演算法偏見問題。為降低此風險，下列哪一項措施最合適？","o":["提升模型運算速度與效能，以確保在大量申請中快速回應","全面移除與申貸人身份相關的敏感屬性，避免模型因變數影響而產生偏差","導入資料與結果的公平性檢測流程，並依合規規範調整模型或決策邏輯","減少訓練樣本數量，降低偏見被放大的可能性"],"a":2,"ex":""},{"id":"114-4-2-39","src":"114-4","subj":2,"n":39,"q":"在提示工程（Prompt Engineering）的應用中，Chain-of-Thought（CoT）與 Tree of Thoughts（ToT）各適用於不同的推理情境，請問以下兩個情境，分別最適合採用哪一種方法？\n情境一：電商公司開發客服助理，用來協助客戶查詢退款流程與相關規範\n情境二：活動策劃團隊使用 AI 協助規劃多場跨部門行銷活動，需要同時考量預算、場地、時程與人力資源，並比較不同方案的可行性。","o":["情境一採用 CoT，情境二採用 ToT","情境一採用 ToT，情境二採用 CoT","情境一與情境二都適合 CoT","情境一與情境二都適合 ToT"],"a":0,"ex":""},{"id":"114-4-2-40","src":"114-4","subj":2,"n":40,"q":"在生成式 AI 的提示工程中，Graph Prompting 在處理複雜關係資料時，為何通常比 Chain-of-Thought（CoT）更有效？","o":["Graph Prompting 幾乎不需要推理，只依靠圖結構即可得出結論","Graph Prompting 僅需單次提示，即可避免多輪推理的誤差累積","Graph Prompting 的生成速度通常更快，因此效率更高","Graph Prompting 能捕捉非線性結構與上下文關聯，適合處理網絡化資訊"],"a":3,"ex":""},{"id":"114-4-2-41","src":"114-4","subj":2,"n":41,"q":"在少樣本提示（Few-shot Prompting）僅能提供 1-2 個範例的情況下，若遇到領域偏移（Domain Shift），下列何者為模型最可能面臨的核心挑戰？","o":["範例數量過少，無法涵蓋新領域的多樣性，導致模型泛化不足","範例表徵有限，模型容易依賴單一樣本特性而降低適應力","範例覆蓋不足，使模型難以抽取跨領域的穩定模式","範例資訊過於稀缺，模型缺乏應對不同輸入情境的能力"],"a":0,"ex":""},{"id":"114-4-2-42","src":"114-4","subj":2,"n":42,"q":"某金融機構導入檢索增強生成（Retrieval-Augmented Generation, RAG）模型，用於客服文件查詢與自動回覆。由於大型模型運算成本過高，若考慮引入知識蒸餾（Knowledge Distillation, KD）技術，下列何者為帶來的主要效益？","o":["讓小型模型學習大型模型的知識，在降低運算成本的同時維持檢索與生成品質","只能應用於語音或影像辨識，無法提升文字檢索生成效能","因為 RAG 已有檢索機制，因此無需額外蒸餾知識","僅能依賴特定 API 供應商才能使用，無法在自建模型中實現"],"a":0,"ex":""},{"id":"114-4-2-43","src":"114-4","subj":2,"n":43,"q":"在評估大型語言模型，例如 7B、13B、175B 參數規模時，模型規模對基準測試（Benchmark）結果的影響，下列哪一種說法最為恰當？","o":["小模型在正確調整下能超越大模型，因此模型大小並不重要","大模型在多數情境下表現較好，但在特定任務上略遜於小模型","模型規模與基準測試結果完全無關，影響主要來自測試設計","模型越大，Benchmark 結果可能提升，但幅度取決於訓練數據品質與資源配置"],"a":3,"ex":""},{"id":"114-4-2-44","src":"114-4","subj":2,"n":44,"q":"在 AI 應用設計中，Model Context Protocol（MCP）與檢索增強生成（RAG）都能擴展模型的能力，但兩者的核心差異主要為下列何者？","o":["MCP 擴展模型工具，但主要用於補足訓練資料不足","MCP 能標準化連接資源，但仍需依賴向量資料庫","RAG 常用於擴展知識庫內容，而 MCP 更著重於動態工具與 API 呼叫的整合","RAG 透過統一協議，提升回答相關性"],"a":2,"ex":""},{"id":"114-4-2-45","src":"114-4","subj":2,"n":45,"q":"下列哪一個資料集專門設計用於測試大型語言模型在多領域、多任務語言理解中，涵蓋人文、科學與社會科學等領域，而非專門用於數學推理或中文專業知識？","o":["MMLU","GSM8K","MATH","C-Eval"],"a":0,"ex":""},{"id":"114-4-2-46","src":"114-4","subj":2,"n":46,"q":"某智慧工廠導入生成式 AI，協助產線工程師即時產生維修指引與操作建議。下列哪一項並非團隊在系統設計中加入 Guardrails（防護機制）的主要目的？","o":["檢查工程師輸入內容，避免觸發錯誤或危險需求","過濾與驗證 AI 輸出的維修指引，確保符合安全標準","確保生成的操作建議符合法規與產業安全規範","完整重建並追蹤 AI 模型的全部推理過程"],"a":3,"ex":""},{"id":"114-4-2-47","src":"114-4","subj":2,"n":47,"q":"某顧問公司導入生成式 AI，協助團隊快速檢索並摘要長篇的法規文件。為了改善檢索結果常出現不相關或過於分散內容的問題，下列何者為團隊決定對文件進行文本切分（Chunking）的主要目的？","o":["讓模型在回答時能加快推理速度","提高檢索相關性與降低長上下文噪音","降低系統記憶體和硬體資源的負擔","使模型在生成回覆時更具創造性與多樣化"],"a":1,"ex":""},{"id":"114-4-2-48","src":"114-4","subj":2,"n":48,"q":"某開發團隊在建置企業內部知識檢索系統時，選擇採用多向量檢索器（Multi-vector Retriever），下列何者為協助提升系統查詢的完整性與精準度的主要方式？","o":["支援同時處理多種資訊表示，提升跨文本型態的檢索效果","透過多向量壓縮與共享權重方式，降低檢索過程的運算與儲存成本","以切分並過濾文件片段，減少上下文長度帶來的 Token 負擔","透過調整生成階段的溫度參數，使模型在回覆時更穩定一致"],"a":0,"ex":""},{"id":"114-4-2-49","src":"114-4","subj":2,"n":49,"q":"在 Agentic AI 的架構中，解決方案圖譜（Solution Graph）常被用來輔助代理的任務執行，其主要作用為何？","o":["透過圖形結構完全取代大型語言模型的推理，讓代理只依靠圖演算法完成任務","僅用於保存代理的輸出結果，方便後續檢視與審計，而不影響實際推理流程","將代理限制在既定流程內，避免其產生偏離設計腳本的行為","作為代理在執行過程中的參考框架，用於組織決策步驟並支援任務推理"],"a":3,"ex":""},{"id":"114-4-2-50","src":"114-4","subj":2,"n":50,"q":"小明想開發一個部落格寫作工具，讓用戶輸入文章開頭後，系統自動幫忙寫出後續內容，例如輸入「今天去了台北木柵動物園...」，系統就能續寫。若要實現這樣的功能，最適合選擇下列哪一類任務？","o":["序列到序列建模（Sequence-to-Sequence Modeling），透過輸入序列產生新的輸出序列","遮罩語言建模（Masked Language Modeling），補齊文字中缺失的詞語或片段","生成式語言建模（Text Generation），依據上下文持續產生新的內容","文本分類（Text Classification），針對輸入文本判斷情感、主題或標籤"],"a":2,"ex":""},{"id":"115-1-1-1","src":"115-1","subj":1,"n":1,"q":"下列何者不屬於資料整合（Data Integration）的主要目的？","o":["統一不同來源資料的格式與欄位定義，以確保分析一致性","識別並處理重複資料，避免影響模型訓練結果","整併多來源資料，以提升資料完整性與應用價值","依資料保存政策延長原始資料留存期限，以利未來可能的分析需求"],"a":3,"ex":""},{"id":"115-1-1-2","src":"115-1","subj":1,"n":2,"q":"某智慧城市專案導入 AI 技術，以優化垃圾收集路線調度並即時監測空氣品質變化。系統需持續蒐集環境數據（如 PM2.5、氣體濃度）與設備狀態（如垃圾桶滿溢度）。下列何種技術最直接支援上述需求？","o":["專家系統（Expert System）","決策支援系統（Decision Support System）","啟發式決策引擎（Heuristic Decision Engine）","感知器網路（Sensor Network）"],"a":3,"ex":""},{"id":"115-1-1-3","src":"115-1","subj":1,"n":3,"q":"下列何者不符合非監督式學習（Unsupervised Learning）的典型特徵？","o":["模型可依據資料中的特徵相似性進行自動分群","訓練過程中不需仰賴事先定義的標籤資料","常用於探索資料的潛在結構或隱含模式","模型主要學習輸入特徵與既定目標標記之間的對應關係"],"a":3,"ex":""},{"id":"115-1-1-4","src":"115-1","subj":1,"n":4,"q":"某保險公司建立 AI 理賠金額預測模型。歷史理賠資料經檢定後呈近似常態分佈，但仍存在少數極端高額案件。資料科學團隊在不破壞整體分佈特性的前提下，規劃進行離群值處理。下列何者最不適當？","o":["依統計準則（如 Z-score 或 IQR）評估後，再決定是否調整或處理極端值","採用截尾（Trimming）處理極端值，以提升模型穩定性","使用 One-hot 編碼（One-hot Encoding）將離群值轉換為類別特徵以改善數值穩定性","結合領域知識評估其合理性，再決定保留或修正"],"a":2,"ex":""},{"id":"115-1-1-5","src":"115-1","subj":1,"n":5,"q":"某銀行建立 AI 詐欺交易偵測模型。歷史交易資料中，詐欺樣本比例極低，導致模型訓練時偏向預測為「正常交易」。資料科學團隊評估採用 SMOTE（Synthetic Minority Over-sampling Technique）改善訓練資料分佈。下列何者最符合 SMOTE 技術的主要功能？","o":["透過隨機刪除部分正常交易資料，以降低類別失衡程度","依據少數類別樣本的特徵空間，合成產生新的少數類別樣本","調整模型的損失函數（Loss Function）權重，使誤判少數類別時的懲罰提高","以交叉驗證（Cross-validation）方式重新分割資料集，使各折資料類別比例一致"],"a":1,"ex":""},{"id":"115-1-1-6","src":"115-1","subj":1,"n":6,"q":"資料科學團隊在模型訓練前，需對數值特徵進行正規化（Normalization）或標準化（Standardization）。為確保模型評估結果具真實性並避免資料洩漏（Data Leakage），下列何者為最適當的作法？","o":["於資料分割前，先對完整資料集計算統計量並進行標準化處理","先分割訓練資料（Training Data）和測試資料（Test Data），並各自獨立計算統計量後進行標準化","先分割訓練資料（Training Data）和測試資料（Test Data），僅以訓練資料計算統計量，再套用至測試資料","僅對訓練資料（Training Data）進行標準化處理，測試資料（Test Data）保持原始數值"],"a":2,"ex":""},{"id":"115-1-1-7","src":"115-1","subj":1,"n":7,"q":"某電信公司建立機器學習模型預測用戶流失風險。資料中包含多個類別型特徵（Categorical Features），例如「資費方案類型」與「客戶地區」。為使模型能有效使用這些特徵，下列何者最直接用於將類別型特徵轉換為模型可處理的數值格式？","o":["資料分群（Data Clustering）","特徵交叉（Feature Cross）","One-hot 編碼（One-hot Encoding）","寬深模型（Wide and Deep）"],"a":2,"ex":""},{"id":"115-1-1-8","src":"115-1","subj":1,"n":8,"q":"某零售企業在建置機器學習模型預測顧客購買機率時，資料同時包含大量稀疏類別特徵與數值型特徵。團隊希望模型既能學習過去已出現的特徵組合規律，也能對未出現的特徵組合做出合理預測。下列哪一種模型架構最適合此類需求？","o":["線性迴歸（Linear Regression）","決策樹（Decision Tree）","支援向量機（Support Vector Machine, SVM）","寬深模型（Wide and Deep）"],"a":3,"ex":""},{"id":"115-1-1-9","src":"115-1","subj":1,"n":9,"q":"某影音串流平台建立神經網路模型，用於預測使用者最可能感興趣的影片類型。模型輸出層需將結果轉換為各類別的機率分佈，以便系統依機率高低推薦內容。下列哪一種函數最適合用於模型輸出層？","o":["Softmax 函數（Softmax Function）","Sigmoid 函數（Sigmoid Function）","線性函數（Linear Function）","ReLU 函數（Rectified Linear Unit Function）"],"a":0,"ex":""},{"id":"115-1-1-10","src":"115-1","subj":1,"n":10,"q":"某設計公司導入生成式 AI（Generative AI）工具，用於自動產生產品概念圖與風格草圖。為了讓系統能依據既有圖像資料產生具有變化且風格一致的新圖像，模型必須具備學習資料特性並生成新樣本的能力。下列哪一種模型技術或方法最符合上述需求？","o":["隱變量自編碼器（Variational Autoencoder, VAE）","隨機森林（Random Forest）","K-近鄰演算法（K-Nearest Neighbors, KNN）","貝氏網路（Bayesian Network）"],"a":0,"ex":""},{"id":"115-1-1-11","src":"115-1","subj":1,"n":11,"q":"某企業導入生成式 AI（Generative AI）系統自動產出會議摘要，並規劃額外建置一套 AI 系統，用於評估摘要內容的正確性與完整性。下列何者為此 AI 系統的核心目標？","o":["自動新增專業名詞與技術指標","判斷摘要是否遺漏關鍵資訊或出現語意錯誤","調整語音轉文字結果","自動標註摘要的關鍵字與主題標籤"],"a":1,"ex":""},{"id":"115-1-1-12","src":"115-1","subj":1,"n":12,"q":"ChatGPT、Gemini 等對話型生成式 AI 工具所依據的基礎模型技術，下列何者正確？","o":["決策樹（Decision Tree）","大型語言模型（Large Language Model, LLM）","生成對抗網路（Generative Adversarial Network, GAN）","圖卷積網路（Graph Convolutional Network, GCN）"],"a":1,"ex":""},{"id":"115-1-1-13","src":"115-1","subj":1,"n":13,"q":"根據《金融機構運用人工智慧技術作業規範》，金融機構於使用人工智慧提供金融服務並直接與消費者互動時，下列何者非必要揭露之資訊？","o":["該服務之 AI 模型原始程式碼","服務適用對象與用途範圍","該服務是否為 AI 自動完成","該服務是否提供替代方案"],"a":0,"ex":""},{"id":"115-1-1-14","src":"115-1","subj":1,"n":14,"q":"下列哪一項「AI 技術應用與產業領域」的對應最為恰當？","o":["利用 AI 分析商場顧客購買紀錄以預測股票市場波動—智慧交通","使用 AI 進行設備故障預測與預防性維護—智慧製造","以 AI 模型融合即時氣象資料與乘客消費行為特徵，推薦會員升級優惠方案—智慧醫療","利用 AI 分析社群媒體互動以提升臨床診斷準確度—金融服務業"],"a":1,"ex":""},{"id":"115-1-1-15","src":"115-1","subj":1,"n":15,"q":"在資料處理中，下列何者屬於「結構化數據」的例子？","o":["儲存在 MySQL 資料庫中的訂單記錄","以 JSON 格式儲存的商品訂單資訊","用 XML 標註的產品目錄","儲存在純文字檔案中的客服對話紀錄"],"a":0,"ex":""},{"id":"115-1-1-16","src":"115-1","subj":1,"n":16,"q":"關於敘述性統計指標，下列敘述何者最為正確？","o":["中位數（Median）能有效反映極端值對資料分佈的影響","標準差（Standard Deviation）越大，代表資料越集中","百分位數（Percentile）主要用於衡量資料在整體分布中的相對位置","平均值（Mean）適合描述偏態且包含離群值（Outliers）的資料"],"a":2,"ex":""},{"id":"115-1-1-17","src":"115-1","subj":1,"n":17,"q":"某企業資料分析人員需針對不同型態的數據選擇合適的視覺化工具。下列哪一種情境最適合使用直方圖（Histogram）？","o":["檢視顧客年齡資料在不同區間的集中情形","分析產品售價與銷售量之間的關聯程度","比較各產品類別的年度銷售總額","在地圖上標示各縣市加盟店的地理分布位置"],"a":0,"ex":""},{"id":"115-1-1-18","src":"115-1","subj":1,"n":18,"q":"某電商平台工程師需在已排序的價格清單中，快速定位指定價格是否存在，給定排序後陣列：arr = [3, 8, 14, 19, 21, 27, 33, 45, 52]。若搜尋目標值為 27，且採用標準二分搜尋（Binary Search）流程（每次比較後排除中位數），請問最多需要比較幾次即可找到目標？","o":["2 次","3 次","4 次","5 次"],"a":1,"ex":""},{"id":"115-1-1-19","src":"115-1","subj":1,"n":19,"q":"某物流公司導入強化式學習（Reinforcement Learning）優化車隊調度。模型在系統運行過程中，會依據不同配送狀態動態調整行動選擇方式，使決策結果逐步朝較佳績效收斂。上述模型在學習過程中的調整行為，最符合下列哪一項強化式學習核心機制？","o":["調整策略函數以改變行動選擇機率","更新訓練資料分布以降低模型偏差","重新分群狀態資料以識別決策類型","建立正確決策標籤進行誤差修正"],"a":0,"ex":""},{"id":"115-1-1-20","src":"115-1","subj":1,"n":20,"q":"某團隊訓練影像分類模型，發現模型在訓練資料上的準確率達 98%，但在測試資料上僅有 72%。若團隊希望提升模型對新資料的適應能力，並增加訓練資料的多樣性，下列何者最適合？","o":["增加模型的深度與參數量，使模型學習更多細節","對訓練影像進行旋轉、翻轉等隨機變化","提高訓練速度，使模型更快完成學習","僅保留模型表現較好的訓練資料"],"a":1,"ex":""},{"id":"115-1-1-21","src":"115-1","subj":1,"n":21,"q":"某時尚品牌導入生成式 AI（Generative AI）技術，建立服裝設計輔助系統。系統需根據設計師輸入的風格條件，自動產生具有高度視覺品質、細節穩定且風格變化自然的服裝草圖。團隊特別重視生成結果的穩定性與多樣性控制能力。在此需求下，下列哪一種模型技術或方法較為適合？","o":["支援向量機（Support Vector Machine, SVM）","生成對抗網路（Generative Adversarial Network, GAN）","決策樹（Decision Tree）","擴散模型（Diffusion Model）"],"a":3,"ex":""},{"id":"115-1-1-22","src":"115-1","subj":1,"n":22,"q":"某製造業工廠規劃導入 AI 監控系統，持續分析設備感測數據（如溫度、震動與壓力）。系統需能在缺乏完整異常標註資料的情況下，辨識與一般運作型態顯著不同的狀態，並發出預警。在此需求下，下列何種技術較為適合？","o":["使用支援向量機（Support Vector Machine, SVM）建立異常分類模型","以決策樹（Decision Tree）學習異常類型的判斷規則","採用變分自編碼器（Variational Autoencoder, VAE）學習正常資料分佈","使用生成對抗網路（Generative Adversarial Network, GAN）直接預測異常標籤"],"a":2,"ex":""},{"id":"115-1-1-23","src":"115-1","subj":1,"n":23,"q":"在 AI 推論服務架構設計中，「批次推論（Batch Inference）」與「即時推論（Real-time Inference）」常依任務特性選擇不同機制。下列關於兩者特性的敘述何者最正確？","o":["批次推論通常以同步請求方式回傳結果，以確保資料一致性；即時推論則多採非同步機制以提升系統吞吐量（Throughput）","批次推論多用於延遲容忍度較高的大規模資料處理，通常以吞吐量（Throughput）最佳化為優先；即時推論則著重於請求回應時間的穩定性與低延遲特性","批次推論因計算資源需求高，僅適用於影像類模型；即時推論則主要應用於結構化資料模型","即時推論為確保回應速度，通常限制為單筆資料輸入；批次推論則可支援同步多筆資料即時回傳"],"a":1,"ex":""},{"id":"115-1-1-24","src":"115-1","subj":1,"n":24,"q":"某企業導入大型語言模型作為客服助理。模型已具備穩定語言能力，但在回覆偏好一致性與組織規範遵循方面仍需優化，團隊因此規劃導入人類反饋強化學習（RLHF）流程，下列何者最不屬於 RLHF 階段的典型技術活動？","o":["透過人工評估方式建立偏好資料，使模型的不同候選輸出可反映人類主觀品質差異","訓練一個能依據人類偏好判斷輸出品質的模型，作為模型優化過程中的回饋依據","依據品質評估結果，調整模型生成策略，使其輸出更符合偏好導向的行為表現","以未標註語料為主進行長週期表示學習訓練，以提升模型基礎語言建模能力"],"a":3,"ex":""},{"id":"115-1-1-25","src":"115-1","subj":1,"n":25,"q":"在大型語言模型（LLM）的推論服務中，常透過請求批次處理（Batching）來提升系統效能。關於批次處理（Batching）機制的影響，下列敘述何者最正確？","o":["Batching 可提升加速器資源使用效率並增加整體吞吐量（Throughput），但在部分情境下可能對單筆請求延遲造成影響","Batching 主要用於加快單筆請求回應時間","Batching 的效益主要來自降低記憶體使用量，對於吞吐量（Throughput）與延遲表現影響有限","Batching 在低併發（Concurrency）請求下，仍能明顯提升系統效能"],"a":0,"ex":""},{"id":"115-1-1-26","src":"115-1","subj":1,"n":26,"q":"在可解釋 AI(Explainable AI, XAI) 的分類架構中，LIME（Local Interpretable Model-agnostic Explanations）屬於哪一類解釋技術？","o":["內建可解釋模型（Intrinsic Interpretability）：模型本身具有透明的決策結構","對話式解釋系統（Conversational AI Explainer）：透過互動對話提供模型解釋","後處理模型解釋（post-hoc）：對已訓練模型提供外部解釋","代理模型技術（Surrogate Model）：訓練另一個簡單模型來完全取代原黑盒模型進行推論"],"a":2,"ex":""},{"id":"115-1-1-27","src":"115-1","subj":1,"n":27,"q":"SHAP（SHapley Additive exPlanations）值常用於分析機器學習模型的輸出行為。下列何者最符合 SHAP 值所提供的資訊？","o":["模型在訓練過程中，各特徵對損失函數收斂速度的影響程度","依據特徵對模型整體準確率的影響，自動篩除低重要性變數","在單一預測結果中，各輸入特徵對最終輸出所產生的貢獻分配","透過調整特徵權重，使模型在推論階段降低計算複雜度"],"a":2,"ex":""},{"id":"115-1-1-28","src":"115-1","subj":1,"n":28,"q":"在金融業導入 AI 模型與可解釋性技術時，反事實解釋（Counterfactual Explanation）最符合下列哪一種應用？","o":["分析整體客戶群的信用風險分布，以預測未來違約率趨勢","回溯歷史呆帳案例，辨識造成違約的主要影響因素","分析在模型不變的前提下，客戶申請資料變動對授信決策結果的影響","依據客戶輪廓與行為資料，推薦最適合的金融商品以提升交叉銷售"],"a":2,"ex":""},{"id":"115-1-1-29","src":"115-1","subj":1,"n":29,"q":"在深度學習模型的分析與驗證過程中，研究人員有時會利用「顯著性圖（Saliency Map）」來輔助理解模型行為。下列何者最符合此技術的主要用途？","o":["量化各輸入特徵對模型整體預測準確度的平均影響程度","標示輸入資料中對單一預測結果影響較大的區域或部分","評估在不同模型參數設定下，預測結果的穩定性變化","比較不同模型架構在測試資料上的泛化能力差異"],"a":1,"ex":""},{"id":"115-1-1-30","src":"115-1","subj":1,"n":30,"q":"某商業銀行想建立洗錢行為檢測系統，擁有過去 5 年的交易記錄，其中包含已確認的洗錢案例（標記為「異常」）和正常交易（標記為「正常」）。銀行希望系統能自動識別新交易是否為洗錢行為，請問使用下列哪一種機器學習方法最為適合？","o":["監督式學習的分類問題","非監督式學習的分群問題","強化式學習","非監督式學習的關聯規則挖掘"],"a":0,"ex":""},{"id":"115-1-1-31","src":"115-1","subj":1,"n":31,"q":"某農場收集了大量作物葉片影像，但只有 30%的影像有病害類別標註，其餘 70% 的影像沒有任何標籤。農場希望充分利用所有資料來訓練病害識別模型。這種情況最適合使用哪一種學習方法？","o":["半監督式學習（Semi-supervised Learning）","監督式學習（Supervised Learning）","非監督式學習（Unsupervised Learning）","強化式學習（Reinforcement Learning）"],"a":0,"ex":""},{"id":"115-1-1-32","src":"115-1","subj":1,"n":32,"q":"某環保局想建立 AI 系統監測空氣品質，透過分析監測站攝影機拍攝的影像來識別煙霧。系統需要在影像中找出煙霧區域並標示其位置和範圍。這個應用主要屬於電腦視覺的哪個技術領域？","o":["影像分類，判斷影像中是否有煙霧","物件偵測，找出煙霧位置並用方框標示","影像分割，精確標示出煙霧的像素區域","人臉辨識，識別煙霧來源"],"a":2,"ex":""},{"id":"115-1-1-33","src":"115-1","subj":1,"n":33,"q":"某公車系統想預測各站點的到站時間，需要考慮歷史班次資料、即時路況、天氣等因素。由於路況變化複雜，傳統循環神經網路（Recurrent Neural Network, RNN）在建模時可能難以保留較早期的重要資訊。下列哪種架構最能解決這個問題？","o":["卷積神經網路（Convolutional Neural Network, CNN），利用卷積層捕捉局部特徵","自編碼器（Autoencoder, AE），先進行資料壓縮再重建","全連接神經網路（Fully Connected Neural Network, FCNN），增加隱藏層數量","長短期記憶網路（Long Short-Term Memory, LSTM），改善 RNN 的長期記憶問題"],"a":3,"ex":""},{"id":"115-1-1-34","src":"115-1","subj":1,"n":34,"q":"某保險公司每月處理約 50 萬筆理賠申請，希望建立 AI 系統自動識別可疑的詐欺案件。由於公司內部缺乏 AI 專業人員，且需要快速上線驗證效果，IT 資訊主管正在評估不同的 AI 平台解決方案。在去識別化個人隱私資料後，下列哪一種平台類型最適合該公司的需求？","o":["從零開始建立深度學習框架並自行訓練模型","採用開源機器學習框架進行客製化模型開發","使用雲端 AutoML 平台進行自動化模型訓練","購買現成的詐欺偵測軟體套件直接部署"],"a":2,"ex":""},{"id":"115-1-1-35","src":"115-1","subj":1,"n":35,"q":"某市政府規劃釋出市民用電資料供學術研究使用，資料內容包含用電紀錄與部分人口統計欄位。考量資料可能涉及可識別個人之資訊，且須符合個人資料保護相關規範，下列哪一種資料處理方式最為適當？","o":["提供完整資料集並透過合約約定研究用途與保密責任","僅保留用電數值資料，移除所有其他欄位以避免識別風險","對具識別風險的資料欄位進行轉換處理，並移除直接識別資訊","僅將資料加密後提供，確保資料在傳輸過程中的安全性"],"a":2,"ex":""},{"id":"115-1-1-36","src":"115-1","subj":1,"n":36,"q":"某電子製造公司建置 AI 視覺檢測系統，用於辨識 PCB 電路板製程缺陷。系統在影像判讀任務上表現穩定，但其模型設計與訓練目標皆侷限於特定應用範圍，無法直接遷移至其他營運決策任務。依人工智慧能力範疇分類，下列何者最符合該系統特性？","o":["弱 AI（Weak AI/Narrow AI）","強 AI（Strong AI）","通用人工智慧（Artificial General Intelligence, AGI）","超級人工智慧（Artificial Superintelligence, ASI）"],"a":0,"ex":""},{"id":"115-1-1-37","src":"115-1","subj":1,"n":37,"q":"某紡織製造公司導入 AI 系統進行布料瑕疵檢測，每天需處理來自 30 條產線的影像資料，包括高解析度照片、感測器數值、生產參數記錄等多種格式。該公司收集的資料量從每日 2GB 增長至 50GB，且需在布料離開產線前的 3 秒內完成瑕疵判定。近期團隊發現系統在尖峰時段容易出現判定延遲，影響製程節奏。若要優先改善此問題，下列哪一種做法最適合？","o":["擴充資料儲存容量，以因應長期資料累積需求","強化即時資料處理與推論計算資源配置，以降低延遲風險","調整資料格式標準，以降低跨來源整合複雜度","增加資料驗證與清理機制，以提升資料品質穩定性"],"a":1,"ex":""},{"id":"115-1-1-38","src":"115-1","subj":1,"n":38,"q":"某果園管理公司計畫導入 AI 系統協助農民判斷蘋果成熟度，透過分析果實特徵資訊，評估成熟狀態並自動判斷採收時機。根據 AI 應用領域的分類，這個系統主要屬於哪一個應用領域？","o":["自然語言處理（Natural Language Processing）","電腦視覺（Computer Vision）","語音識別（Speech Recognition）","推薦系統（Recommendation System）"],"a":1,"ex":""},{"id":"115-1-1-39","src":"115-1","subj":1,"n":39,"q":"某企業評估於不同業務場景導入機器學習技術。下列哪一項應用情境與機器學習類型的搭配最為適當？","o":["在醫療影像分析中，同時運用少量已標註資料與大量未標註影像進行模型訓練—監督式學習（Supervised Learning）","在智慧推薦系統中，利用顧客是否點擊的歷史標籤資料預測未來偏好—非監督式學習（Unsupervised Learning）","在詐欺交易分析中，模型透過錯誤判斷所產生的損失作為回饋訊號，持續調整策略—監督式學習（Supervised Learning）","在股價資料分析中，將歷史價格變動模式劃分為若干趨勢型態，且未使用人工標註—非監督式學習（Unsupervised Learning）"],"a":3,"ex":""},{"id":"115-1-1-40","src":"115-1","subj":1,"n":40,"q":"某製造業公司建置機器學習模型，用於預測產品是否為瑕疵品。實際生產資料中，瑕疵品比例極低，大多數樣本皆為正常品。模型測試時發現，即使模型多數預測為正常品，仍可獲得很高的整體準確率。在此情境下，若希望更有效衡量模型對瑕疵品的辨識能力，下列何者較適合作為主要評估指標？","o":["F1-score","均方誤差（Root Mean Squared Error, RMSE）","準確率（Accuracy）","判定係數（R², Coefficient of Determination）"],"a":0,"ex":""},{"id":"115-1-1-41","src":"115-1","subj":1,"n":41,"q":"在大型語言模型（LLM）的效能優化中，Flash Attention 常被用來改善 Transformer 注意力機制的運算效率。關於 Flash Attention 的主要效益，下列敘述何者最正確？","o":["透過忽略影響較小的注意力權重，減少模型需要計算的關聯數量，以降低運算成本","透過調整注意力計算與資料處理方式，減少中間結果的儲存需求，進而改善速度與資源使用效率","透過增加注意力計算的並行程度，使模型可同時處理更多注意力頭部","透過將注意力結果暫存於高速快取記憶體，以避免重複計算造成延遲"],"a":1,"ex":""},{"id":"115-1-1-42","src":"115-1","subj":1,"n":42,"q":"某企業建置基於檢索增強生成（RAG）的法遵知識輔助系統，用於整合法規條文、內控制度與歷史函釋文件。系統運行後發現，每當法規更新或新增解釋文件時，需重新建立完整索引，導致更新期間系統暫停服務，且部分回應偶有引用舊版內容的情形。若希望在兼顧查詢效率的同時提升知識更新彈性與系統穩定性，下列何者最適合？","o":["提升模型推論資源配置，以維持高流量查詢時的回應效能","調整語言模型的輸出限制機制，以降低生成內容與法規不一致的風險","建立固定法規問答對照表，以規則化方式優先回應常見問題","導入可支援增量更新的索引管理方式，使異動文件可即時反映於檢索結果"],"a":3,"ex":""},{"id":"115-1-1-43","src":"115-1","subj":1,"n":43,"q":"關於機器學習不同的學習模式，下列敘述何者錯誤？\n1. 監督式學習（Supervised Learning）透過已標註資料學習輸入與目標之間的對應關係，常見任務包含分類與數值預測。\n2. 非監督式學習（Unsupervised Learning）雖不需標註資料，但通常需預先定義每筆資料的正確輸出類別以利模型收斂。\n3. 半監督式學習（Semi-supervised Learning）在訓練過程中僅利用未標註資料進行特徵學習，並不涉及標註資料。\n4. 自監督式學習（Self-supervised Learning）的訓練方式與監督式學習相同，皆需人工逐筆提供標註資料。\n5. 強化式學習（Reinforcement Learning）透過與環境互動並依據回饋訊號調整策略，以優化決策行為。\n6. 自監督式學習（Self-supervised Learning）通常利用資料本身產生訓練目標，以降低對人工標註資料的依賴。","o":["2、3、6","2、4、5","1、3、6","2、3、4"],"a":3,"ex":""},{"id":"115-1-1-44","src":"115-1","subj":1,"n":44,"q":"某零售業者建立顧客行為預測模型，資料集中包含「年消費金額」、「平均單筆交易金額」及「會員年資」等數值型特徵。資料分析顯示，部分金額特徵呈現高度偏態分布，少數樣本的數值顯著高於多數觀測值。為降低極端值對模型學習穩定性的影響，下列哪一種特徵工程方法最適合？","o":["對數轉換（Log Transformation）","區間化（Binning）","One-hot 編碼（One-hot Encoding）","隨機重抽樣（Random Resampling）"],"a":0,"ex":""},{"id":"115-1-1-45","src":"115-1","subj":1,"n":45,"q":"某團隊訓練深層神經網路模型時，發現訓練誤差長時間幾乎未下降，模型參數更新幅度極小，呈現學習停滯現象。若研判問題與梯度傳遞效率有關，下列何者最適合的改善策略？","o":["延長模型訓練時間，使模型有更多機會調整參數","增加訓練樣本數量，以提升模型學習能力","調整模型中的啟動函數設定，以改善訓練過程的穩定性","簡化模型結構，以降低模型過度擬合的可能性"],"a":2,"ex":""},{"id":"115-1-1-46","src":"115-1","subj":1,"n":46,"q":"某市政府建置城市治理資料平台，需整合交通車流偵測資料、路口監視器影像，以及民眾透過陳情系統提交的文字通報。由於各類資料格式、儲存方式與資料型態差異甚大，導致資料清理與整合成本顯著增加。就大數據特性而言，此專案最主要面臨下列哪一項挑戰？","o":["Volume","Velocity","Variety","Veracity"],"a":2,"ex":""},{"id":"115-1-1-47","src":"115-1","subj":1,"n":47,"q":"某企業規劃導入 AI 技術支援多項資料分析任務中，下列何種屬於結構化預測（Structured Prediction）問題？","o":["判斷一封電子郵件是否為垃圾郵件","預測未來一週的產品需求量","預測客戶是否可能流失","為語音內容轉換後的文字進行逐詞標註"],"a":3,"ex":""},{"id":"115-1-1-48","src":"115-1","subj":1,"n":48,"q":"某物流公司想導入 AI 以提升營運效率，評估不同資料型態與模型架構。下列哪一種應用情境最適合採用卷積神經網路（Convolutional Neural Network, CNN）作為主要模型架構？","o":["依據包裹每日掃描紀錄的時間序列，預測下週各倉庫的進貨量波動","根據客服對話逐句內容的先後順序，判斷客訴是否可能升級為申訴案件","根據倉庫監視器影像，自動辨識貨架是否缺貨並標示缺貨區域位置","依據車隊 GPS 路徑點的連續軌跡，預測下一段可能行駛路線"],"a":2,"ex":""},{"id":"115-1-1-49","src":"115-1","subj":1,"n":49,"q":"某 AI 科技公司在工業缺陷檢測領域已有成熟的辨識產品經驗。現欲與新客戶合作開發一項類似產品的表面瑕疵檢測系統，但因新產品量產不久，標註樣本極為稀少且專家標註成本高昂。在不大幅增加標註預算的前提下，下列哪一種做法最能利用該公司既有的技術優勢來提升模型表現？","o":["增加模型參數規模，使模型具備更強表達能力","透過資料增強（Data Augmentation）擴展影像變化，以提升模型穩定性","重新蒐集大量影像並進行完整人工標註","採用遷移學習（Transfer Learning），利用既有預訓練模型進行調整"],"a":3,"ex":""},{"id":"115-1-1-50","src":"115-1","subj":1,"n":50,"q":"某醫院使用機器學習模型篩檢癌症患者。模型預測結果會決定哪些病人需要進一步檢查。院方非常重視盡量找出所有可能的癌症患者，即希望降低漏診（Missed Diagnosis）風險，即便這可能增加一些誤判。下列哪一個評估指標最能反映模型找出癌症患者的能力？","o":["精準率（Precision）","召回率（Recall）","假陽性率（False Positive Rate）","ROC-AUC 曲線"],"a":1,"ex":""},{"id":"115-1-2-1","src":"115-1","subj":2,"n":1,"q":"某零售企業導入生成式 AI 商品推薦系統。測試結果顯示，在購物行為、偏好設定與價格區間相同的情況下，不同客戶族群收到的推薦商品類型仍出現明顯差異，且差異方向不易以既有行銷策略解釋。若在模型架構與推論設定皆未調整情形下，專案目標是優先降低可能的模型偏差風險，下列何者最合理？","o":["重新檢視訓練資料的樣本分布與代表性","限制推薦結果僅顯示高銷量商品","降低模型參數規模以簡化決策邏輯","提高推薦結果的隨機性以增加多樣性"],"a":0,"ex":""},{"id":"115-1-2-2","src":"115-1","subj":2,"n":2,"q":"在進行大型語言模型（LLM）企業專屬知識的 Fine-tuning 時，若內部 GPU 運算資源與記憶體嚴重受限，下列哪一種參數高效微調（PEFT, Parameter Efficient Fine-Tuning）技術最能在維持模型效能的前提下，顯著降低需更新的參數數量？","o":["知識蒸餾（Knowledge Distillation）","提示詞工程（Prompt Engineering）","梯度凍結（Gradient Freezing）","低秩適配（Low-Rank Adaptation）"],"a":3,"ex":""},{"id":"115-1-2-3","src":"115-1","subj":2,"n":3,"q":"某企業規劃透過 Low-Code 平台建置可視化儀表板，以支援營運數據的即時監控與分析判讀。若企業特別關注儀表板顯示結果的穩定性與分析可信度，下列何者最應優先確認？","o":["是否具備穩定的資料串接能力與即時更新機制","是否提供自動化決策建議與預測分析模組","是否支援彈性介面設計與多角色權限管理","是否整合流程觸發與跨系統通知功能"],"a":0,"ex":""},{"id":"115-1-2-4","src":"115-1","subj":2,"n":4,"q":"某企業導入生成式 AI 客服系統後發現，系統整體運作穩定，且在單位時間內可處理大量對話請求。部分使用者仍反映在互動過程中回覆出現卡頓感，經初步排除網路連線與前端介面效能問題後，若專案團隊希望針對此現象進行效能測試，下列何者最符合測試重點？","o":["評估系統長時間運作的穩定程度","測量系統單位時間的總處理量","比較不同回覆內容的語言品質","分析單次互動回覆的反應速度表現"],"a":3,"ex":""},{"id":"115-1-2-5","src":"115-1","subj":2,"n":5,"q":"某企業導入生成式 AI 系統，希望自動產出客服回覆與內部文件摘要。系統需能理解使用者輸入的完整語句內容，並在回覆中維持語意連貫，即使對話內容較長仍能保持上下文一致性。基於上述需求，下列何種模型架構最為適合？","o":["卷積神經網路（Convolutional Neural Network, CNN）","遞迴神經網路（Recurrent Neural Network, RNN）","基於 Transformer 架構的自迴歸模型（Autoregressive Model）","生成對抗網路（Generative Adversarial Network, GAN）"],"a":2,"ex":""},{"id":"115-1-2-6","src":"115-1","subj":2,"n":6,"q":"OpenAI 已為 Sora 生成的影片提供多種出處證明機制，以降低誤導性或欺騙性內容帶來的風險。下列何者不屬於目前 OpenAI 官方為 Sora 內容提供的出處證明工具？","o":["所有資產上內嵌的 C2PA（Content Credentials）元數據","預設可見的動態浮水印","用於追蹤生成內容的內部反向影像與音訊搜尋工具","平台對外開放的實時來源驗證介面"],"a":3,"ex":""},{"id":"115-1-2-7","src":"115-1","subj":2,"n":7,"q":"某企業導入 No-Code/Low-Code 平台，讓各部門能自行建立資料分析與流程應用。隨著使用範圍擴大，管理層開始關注資料權限、存取紀錄與合規要求。依資料治理觀點，下列何者最合理描述此類平台對企業治理機制的典型影響？","o":["平台內建角色權限與資料存取控管機制，有助治理制度落實","平台強化部門自主性，通常使既有治理流程難以延續","平台主要支援應用快速開發，資料治理仍需完全仰賴外部系統","平台透過自動化設定機制，可顯著降低治理與合規管理需求"],"a":0,"ex":""},{"id":"115-1-2-8","src":"115-1","subj":2,"n":8,"q":"某製造企業規劃於設備端建置邊緣運算（Edge Computing）架構，並以 No-Code/Low-Code 平台開發即時監控應用。測試顯示，系統在雲端環境執行順暢，但部署至邊緣裝置後出現回應延遲與效能下降。依此情境判斷，下列何者最合理解釋該現象？","o":["邊緣運算架構可降低系統對效能的需求","No-Code/Low-Code 平台僅能在雲端環境執行","雲端部署通常比邊緣部署更容易出現延遲","邊緣裝置通常受限於運算能力與可用資源"],"a":3,"ex":""},{"id":"115-1-2-9","src":"115-1","subj":2,"n":9,"q":"某企業使用生成式 AI 進行文字分類，初期僅根據既有業務資料設計少量樣本提示（Few-shot Prompting）。當模型應用至新市場資料時，團隊發現分類結果明顯不穩定，且原先提供的範例並未涵蓋新市場常見的表達方式。依此情境判斷，下列何者最可能為主要原因？","o":["模型容易對單一範例產生過度記憶","少量範例難以涵蓋新情境的資料差異","Prompt 設計無法引導模型擷取共通特徵","模型推理能力不足以完成分類任務"],"a":1,"ex":""},{"id":"115-1-2-10","src":"115-1","subj":2,"n":10,"q":"某企業建置檢索增強生成（Retrieval-augmented generation, RAG）系統支援內部知識查詢。隨著使用量提升，團隊發現模型回覆品質穩定，但推論延遲與運算成本逐漸增加。專案規劃在維持回覆品質前提下進行效能優化。在此情境下，若採用知識蒸餾（Knowledge Distillation），下列敘述何者最為合理？","o":["將檢索資料轉換為結構化規則以取代模型","僅透過增加檢索文件數量改善效能","停用生成模型以避免延遲問題","使小型模型學習大型模型行為，以降低推論成本"],"a":3,"ex":""},{"id":"115-1-2-11","src":"115-1","subj":2,"n":11,"q":"某零售企業規劃提升門市數據應用能力，目標包括：門市主管可自行調整分析畫面與檢視指標呈現，以及由行銷部門建立銷售預測模型，以支援補貨與促銷規劃。企業在選型時以工具的主要功能定位與典型用途作為評估依據。依此需求判斷，下列哪一項 AI 工具使用規劃最合理？","o":["以 AutoML 作為分析介面調整平台，No-Code 平台用於模型訓練","以 No-Code 平台支援分析與介面調整，AutoML 負責模型建立","僅導入 No-Code 平台，同時滿足高階模型建立與分析需求","僅導入 AutoML，以兼顧介面調整與模型訓練"],"a":1,"ex":""},{"id":"115-1-2-12","src":"115-1","subj":2,"n":12,"q":"下列何者最能正確說明 Model Context Protocol（MCP）與檢索增強生成（Retrieval-Augmented Generation, RAG）在功能定位上的主要差異？","o":["MCP 主要用於降低模型訓練成本；RAG 主要用於提升推論速度","MCP 著重模型與外部工具或系統互動；RAG 著重補充模型知識來源","RAG 必須依賴向量資料庫；MCP 不需任何外部整合","RAG 屬標準化通訊協議；MCP 屬資料檢索技術"],"a":1,"ex":""},{"id":"115-1-2-13","src":"115-1","subj":2,"n":13,"q":"某企業建置文件型知識查詢系統，將大量長篇內部文件轉換為可供生成式 AI 使用的知識來源。在測試過程中，團隊發現若直接以整份文件進行檢索，模型回覆常包含無關內容，且引用段落不夠精準。團隊評估後，決定導入 Chunking 機制的主要目的為何？","o":["透過縮短輸入長度，加速模型推理流程","提升檢索結果的語意對齊程度，並降低長文件帶來的干擾","減少模型執行時的記憶體使用量，以提升系統穩定性","讓模型在生成回覆時具備更高的創意發揮空間"],"a":1,"ex":""},{"id":"115-1-2-14","src":"115-1","subj":2,"n":14,"q":"某企業導入大型語言模型（LLM）分析內部報表，使用者經常提供 Excel 匯出的表格資料（如銷售數據與統計表）。測試時發現，模型對原始表格解析效果不穩定。為提升模型理解與回應品質，下列哪一種上下文工程（Context Engineering）作法較為適當？","o":["將表格內容轉換為結構化 JSON 或 Markdown table","在維持原始表格呈現方式下，補充欄位與數據說明","將表格資料隨機切割後分段輸入","直接提供原始表格內容以保留完整資訊"],"a":0,"ex":""},{"id":"115-1-2-15","src":"115-1","subj":2,"n":15,"q":"在生成式 AI 應用設計中，情境感知代理（Context-aware Agent）的核心特性為何？","o":["能依任務需求即時重新訓練模型參數以優化結果","僅依使用者當前輸入指令執行任務，不保留歷程資訊","具備跨模態處理能力，可同時理解文字與影像內容","能利用對話歷史、任務狀態調整行為與決策"],"a":3,"ex":""},{"id":"115-1-2-16","src":"115-1","subj":2,"n":16,"q":"某企業建置 Agentic AI 系統處理跨部門複雜任務，團隊以解決方案圖譜（Solution Graph）作為規劃框架。下列何者為 Solution Graph 的主要功能？","o":["取代語言模型推理機制，改以圖形搜尋完成決策","作為任務知識庫，用於儲存 AI 已完成案例以供檢索","限制代理（Agent）僅能依固定流程執行，以降低行為不確定性","定義代理（Agent）可參考的任務分解與決策路徑結構"],"a":3,"ex":""},{"id":"115-1-2-17","src":"115-1","subj":2,"n":17,"q":"某企業提供大型語言模型（LLM）API 服務，需支援高併發請求與流量波動，同時要求服務不中斷並具備故障容忍能力。若以高可用性與可擴展性為主要設計原則，下列哪一種部署方式較為適當？","o":["採用單一高效能虛擬機（VM）集中部署，以提升資源使用效率","建立多個模型服務實例並透過負載分散機制提供服務","將推論任務改由用戶端設備分擔，以降低伺服器負載壓力","使用 FTP 協議傳輸請求與回應，以減少服務通訊負擔"],"a":1,"ex":""},{"id":"115-1-2-18","src":"115-1","subj":2,"n":18,"q":"關於 ChatGPT、Anthropic Claude、GitHub Copilot 等 AI 程式碼輔助工具的運作原理，下列敘述何者正確？","o":["這些工具基於大型語言模型，經由大量程式碼與文本訓練，透過預測下一個符號來生成程式碼，但不保證產生程式碼的正確性","GitHub Copilot 會在提供程式碼建議前執行並驗證該程式碼，確保其執行結果正確無誤","Anthropic Claude 的程式碼建議並非即時生成，而是從事先整理的已知解答資料庫中檢索而得","ChatGPT 內建完整的編譯器，可在輸出程式碼前自動編譯並更正所有語法與邏輯錯誤"],"a":0,"ex":""},{"id":"115-1-2-19","src":"115-1","subj":2,"n":19,"q":"某新創公司採用 MVP（Minimum Viable Product）策略，導入 Vibe Coding 以加速開發，雖然初期能快速產出可運作功能，但技術主管提醒，在正式上線前仍可能存在程式碼品質與安全風險。下列哪一項措施最合理，以降低品質與安全問題？","o":["直接沿用 AI 生成程式碼至正式環境，以降低開發成本","持續優化提示詞，即可避免大部分品質問題","將生成程式碼納入審查、重構與安全測試流程","限制開發者修改 AI 生成之程式碼架構，以維持一致性"],"a":2,"ex":""},{"id":"115-1-2-20","src":"115-1","subj":2,"n":20,"q":"在規劃生成式 AI 解決方案時，下列何種應用場景最適合採用 GPT-Realtime 類型模型？","o":["需長時間批次處理的大規模報表生成任務","即時資料查詢與結構化資訊檢索系統","即時語音客服與互動式 AI 代理","以高一致性為優先的法規文件自動摘要"],"a":2,"ex":""},{"id":"115-1-2-21","src":"115-1","subj":2,"n":21,"q":"關於 2025 年 OpenAI 提供的 AgentKit，下列何者最能描述其主要用途？","o":["建立強化式學習（Reinforcement Learning）訓練所需的互動式模擬環境","提供代理（Agent）模型的大規模預訓練與權重優化機制","「Agent-to-Agent」的代理通訊協議","支援 Agents 的建構、工具整合與任務流程開發"],"a":3,"ex":""},{"id":"115-1-2-22","src":"115-1","subj":2,"n":22,"q":"所有在 Gemini 應用程式透過 Veo 生成的影片，皆採用何種技術措施來協助企業用戶應對 AI 生成內容可能帶來的不實資訊風險？","o":["嚴格限制所有用戶每日的影片生成次數與使用時間","在所有生成影片的開頭與結尾處強制加入明顯的 AI 標示警語","要求所有影片輸出時必須附帶至少 10 秒的免責聲明片段","使用 SynthID 技術在每一幀（frame）影片中嵌入不可見的數位浮水印"],"a":3,"ex":""},{"id":"115-1-2-23","src":"115-1","subj":2,"n":23,"q":"某保險公司想建立智慧理賠系統，包含兩個功能：(1)自動判斷理賠案件是否為詐欺案件 (2)自動生成理賠調查報告。請問這兩個功能分別屬於哪種 AI 技術類型？","o":["(1)鑑別式 AI (2)生成式 AI","(1)生成式 AI (2)鑑別式 AI","兩者都是鑑別式 AI","兩者都是生成式 AI"],"a":0,"ex":""},{"id":"115-1-2-24","src":"115-1","subj":2,"n":24,"q":"某大型製造工廠導入生成式 AI 系統來優化能源消耗，每日需處理約 10 萬筆設備數據並生成能源優化建議。系統每月 API 調用成本約 15 萬元，內部維護人力成本 8 萬元，基礎設施成本 5 萬元。該工廠評估導入效益時，下列哪一項總體擁有成本（Total Cost of Ownership, TCO）分析最完整？","o":["主要以 API 調用成本 15 萬元作為 TCO 評估基礎","以 API 調用成本 15 萬元及維護人力成本 8 萬元進行整體估算","綜合 API 調用、維護人力與基礎設施等直接成本進行評估，共約 28 萬元","除直接成本外，並考量訓練、系統整合與資安合規等相關支出"],"a":3,"ex":""},{"id":"115-1-2-25","src":"115-1","subj":2,"n":25,"q":"某機構計畫導入生成式 AI 旅遊資訊服務對話系統自動生成多語言對話。目前每月需人工翻譯 600 則訊息，每則成本 50 元；若改用 ChatGPT API，每則訊息需 2000 Tokens，而 Token 成本 0.8 元/1000 Tokens，但需額外投入系統整合費用 20 萬元。關於投資報酬率（Return on Investment, ROI）評估，下列何者最為正確？","o":["每月節省成本 29,040 元，系統整合成本約 7 個月回收","每月節省成本 30,000 元，系統整合成本約 7 個月回收","每月節省成本 28,040 元，系統整合成本約 8 個月回收","每月節省成本 25,000 元，系統整合成本約 8 個月回收"],"a":0,"ex":""},{"id":"115-1-2-26","src":"115-1","subj":2,"n":26,"q":"某支付平台為了強化洗錢行為檢測，計劃導入生成式 AI 技術來輔助分析可疑交易模式。該平台擁有大量歷史交易記錄和已知洗錢案例資料，希望 AI 能自動生成可疑交易的特徵描述報告。下列哪一種生成式 AI 技術最適合此需求？","o":["使用 Midjourney 生成交易流程圖像","採用 Few-shot Learning 訓練圖像識別模型","運用 RAG 檢索增強生成技術結合歷史案例資料庫","直接使用 ChatGPT 的基礎模型進行分析"],"a":2,"ex":""},{"id":"115-1-2-27","src":"115-1","subj":2,"n":27,"q":"某紡織公司希望建立自動化品質檢測流程，既有的 AI 系統檢測到布料瑕疵時，需自動拍照存檔、發送通知給品管人員。該公司具有一定開發人力，希望快速建置此工作流程，並保有彈性調整空間，下列哪一種解決方案最適合？","o":["使用 n8n 建立工作流（Workflow），整合 AI 檢測 API、檔案系統、通訊軟體","委外開發客製化程式，完全符合公司需求規格","採購現成的品質管理軟體，直接導入使用","使用 Excel 巨集搭配人工作業處理檢測結果"],"a":0,"ex":""},{"id":"115-1-2-28","src":"115-1","subj":2,"n":28,"q":"某市政府交通局計劃導入生成式 AI 技術來自動生成公車到站時間預測的文字報告，每日需處理約 50 萬筆交通資料並生成 1000 份報告。在評估導入成本時，團隊希望進行 Token Economics 分析（指模型推理與生成過程中，Token 使用量及其費用）。下列何者不屬於 Token Economics 的考量範圍？","o":["每次 API 呼叫所需的輸入 Token 數量","生成報告內容所消耗的輸出 Token 費用","AI 模型訓練階段使用 Token 數量所需的 GPU 記憶體成本","模型推理過程中的 Token 使用量統計"],"a":2,"ex":""},{"id":"115-1-2-29","src":"115-1","subj":2,"n":29,"q":"某農業合作社希望建立一套自動化工作流程，當農民透過手機 APP 回報田間病蟲害照片時，系統能自動通知相關專家、建立案件紀錄並排程現場訪查。該合作社 IT 資訊人力有限，僅有一位具備基礎程式概念的人員。下列哪一種開發方式最適合此需求？","o":["採用傳統程式開發，從零開始撰寫完整系統","使用純粹的 No-Code 平台，完全不需要任何程式技能","使用 Low-Code 平台，結合視覺化拖拉與少量程式碼","直接購買現成的農業管理軟體，不進行客製化"],"a":2,"ex":""},{"id":"115-1-2-30","src":"115-1","subj":2,"n":30,"q":"某市政府環保局想建立一個垃圾分類查詢系統，讓民眾輸入物品名稱後自動判斷分類。由於垃圾種類繁多，但每種分類的訓練範例有限，工程師決定採用少樣本學習（Few-shot Learning）技術。下列何者為少樣本學習（Few-shot Learning）的主要特徵？","o":["需重新蒐集大規模標註資料，以確保模型具備穩定表現","透過少量任務示例，引導模型適應新情境或新分類需求","不需任何範例輸入，即可完成新任務推論","僅適用於自然語言處理任務，對其他模態效果有限"],"a":1,"ex":""},{"id":"115-1-2-31","src":"115-1","subj":2,"n":31,"q":"某有機農場累積了十年的病蟲害防治紀錄文件，包含不同作物的病害症狀描述、防治方法和效果評估。農場主人希望建立一個 AI 助手，能根據農民描述的作物症狀，快速提供相關的防治建議和歷史案例。下列哪一種技術最適合解決這個需求？","o":["直接使用 ChatGPT 的預訓練知識回答農業問題","將所有文件內容加入 ChatGPT 的系統提示詞中","採用 RAG 技術，將農場文件建立向量資料庫，結合大語言模型生成回答","使用少樣本學習（Few-shot Learning），在提示詞中提供 3-5 個病害案例"],"a":2,"ex":""},{"id":"115-1-2-32","src":"115-1","subj":2,"n":32,"q":"隨著企業加速導入 AI，No-Code/Low-Code 平台逐漸成為模型開發與產品化的常見工具。相較於傳統自行撰寫程式的建模流程，下列何者最能正確描述此類平台在模型訓練機制上的典型特性？","o":["透過視覺化介面與標準化流程，協助完成模型訓練與調校","主要提供既有模型推論能力，通常不支援重新訓練","著重資料處理與轉換，模型訓練仍需外部工具完成","多數僅適用於特定大數據框架（如 Spark）的訓練流程"],"a":0,"ex":""},{"id":"115-1-2-33","src":"115-1","subj":2,"n":33,"q":"某醫療院所希望改善行政效率，規劃讓各科室人員可自行建立行政回報與內部申請表單，並導入 AI 功能以自動判讀與分類填寫內容（如問題類型或需求性質），同時需兼顧流程調整彈性與降低系統開發維運負擔。下列哪一種技術組合最適合？","o":["Low-Code 平台 × 預訓練語言模型 API","No-Code 平台 × 規則式自動化（Rule-based Automation）","傳統程式開發 × 自建深度學習模型","試算表工具 × 手動資料標記分析"],"a":0,"ex":""},{"id":"115-1-2-34","src":"115-1","subj":2,"n":34,"q":"某企業導入 No-Code/Low-Code 平台開放各部門自行開發應用。半年後發現：出現多個功能相近系統、資料欄位定義不一致，且部分應用未經審核即上線，並伴隨權限與維運管理混亂。下列何者最可能為根本問題？","o":["缺乏統一的開發與上線管理機制","平台提供過高的應用設計自主性","部門未建立共用的資料分析呈現標準","系統整合與自動化能力尚未完善"],"a":0,"ex":""},{"id":"115-1-2-35","src":"115-1","subj":2,"n":35,"q":"在生成式 AI 文字生成模型設計中，Encoder–Decoder 與 Decoder-only 為常見架構。下列何者最能正確說明兩者在資訊處理與生成機制上的核心差異？","o":["Encoder–Decoder 透過編碼與解碼階段處理序列，Decoder-only 則以單一模型完成處理","Encoder–Decoder 區分輸入理解與內容生成階段，Decoder-only 以單一模型同時處理上下文與生成","Decoder-only 架構主要依賴外部知識檢索，Encoder–Decoder 則不需要","Encoder–Decoder 架構僅適用於翻譯任務，Decoder-only 架構較適合對話任務"],"a":1,"ex":""},{"id":"115-1-2-36","src":"115-1","subj":2,"n":36,"q":"某連鎖零售企業使用生成式 AI 協助規劃門市補貨策略。決策時需同時考量多項彼此相關的因素，例如：庫存水位、促銷活動、區域銷售差異與物流限制。專案團隊發現，AI 雖能逐步說明推論過程，但對於多條件之間的相互影響掌握不足，導致建議結果偶有偏差。若希望透過提示工程（Prompt Engineering）改善此問題，下列哪一種策略最為適合？","o":["Chain of Thought，要求模型逐步展開推論","Tree of Thoughts，增加多種推論路徑探索","Graph Prompting，以結構化方式呈現條件與關聯","Zero-shot Prompting，避免範例影響模型判斷"],"a":2,"ex":""},{"id":"115-1-2-37","src":"115-1","subj":2,"n":37,"q":"某電商平台導入生成式 AI 客服助理，用於自動回覆顧客詢問。營運需求包含：需即時反映每日更新的促銷活動與商品資訊，同時維持品牌一致的回覆語氣，且企業希望避免因模型重新訓練所造成的成本增加與系統不穩定。在此情境下，下列哪一種技術策略最合理？","o":["僅進行 Fine-tuning，使模型同時學習品牌語氣與即時促銷內容","僅導入 RAG 更新促銷資訊，期望模型直接從檢索內容學習品牌語氣","透過 Prompt Engineering 控制回覆風格，並以 RAG 引入最新商品與活動資訊","持續進行增量 Fine-tuning，以確保活動資訊同步更新"],"a":2,"ex":""},{"id":"115-1-2-38","src":"115-1","subj":2,"n":38,"q":"某企業規劃導入生成式 AI 助理，在正式全面部署前進行概念驗證（PoC），下列何者最不適合作為此階段的主要工作？","o":["驗證模型在實際使用情境下的回覆品質與穩定性","測試 AI 功能與業務需求的匹配程度","制定跨部門使用規範，與長期治理框架","評估系統整合可行性與技術限制"],"a":2,"ex":""},{"id":"115-1-2-39","src":"115-1","subj":2,"n":39,"q":"某企業規劃導入生成式 AI 客服系統，需處理顧客查詢並引用歷史交易資料。法遵部門在風險評估中指出，系統若不當處理顧客個人資料，可能引發合規與法律責任。若專案初期希望從資料層面降低敏感資訊暴露風險，下列敘述何者最為合理？","o":["強化模型輸出審查與遮罩機制，以過濾可能出現的敏感資訊","設定 AI 回覆範圍與角色權限，限制其存取特定類型資料","將資料集中於加密儲存環境，並加強系統存取控管","僅提供必要資料或數據欄位與去識別化策略，減少模型接觸可識別個資"],"a":3,"ex":""},{"id":"115-1-2-40","src":"115-1","subj":2,"n":40,"q":"某企業導入大型語言模型（LLM）進行客服自動化，並已透過 Fine-Tuning 學習企業標準問答範例，但在實務運作中仍出現回應策略未符合服務優先順序及語氣與品牌風格不一致的情況，因此技術團隊建議再導入 Reinforcement Fine-tuning（RFT）機制進行優化，其主要目的為何？","o":["擴展模型的知識涵蓋範圍與資料記憶能力","透過 reward 訊號調整模型回應策略與行為偏好","提升模型推論速度與降低回應延遲","降低 prompt 設計複雜度並取代訓練流程"],"a":1,"ex":""},{"id":"115-1-2-41","src":"115-1","subj":2,"n":41,"q":"企業在評估 AI 決策模型是否存在資料分布偏差時，下列何者最屬於偏見檢測（Bias Detection）而非偏見緩解（Bias Mitigation）措施？","o":["比較不同資料分布的模型預測結果分布與錯誤率","重新加權訓練樣本以平衡資料分布代表性","在推論階段加入輸出過濾規則","調整模型決策閾值（Decision Threshold）以降低預測差異"],"a":0,"ex":""},{"id":"115-1-2-42","src":"115-1","subj":2,"n":42,"q":"某企業希望利用含敏感資訊的資料進行 AI 模型訓練，但政策要求原始資料不得外洩，且資料可集中於安全環境中處理。同時，企業希望在資料使用過程中，即使資料處於加密狀態，仍能完成模型計算。在此需求下，下列哪一種技術最為適合？","o":["聯邦學習（Federated Learning）","同態加密（Homomorphic Encryption）","零知識證明（Zero-knowledge Proof）","資料匿名化（Data Anonymization）"],"a":1,"ex":""},{"id":"115-1-2-43","src":"115-1","subj":2,"n":43,"q":"某金融服務公司規劃導入生成式 AI，在評估模型部署方式時，基於內部控制與治理要求，企業考慮將大型語言模型建置於公司可管理環境，而非直接採用外部雲端服務。下列何者最能合理說明此部署決策的潛在優勢？","o":["有助提升模型回覆穩定性並降低隨機性影響","可降低敏感資料需傳輸至外部服務的風險","可直接減少模型訓練與維運所需資源投入","可避免模型輸出偏差與幻覺（Hallucination）問題"],"a":1,"ex":""},{"id":"115-1-2-44","src":"115-1","subj":2,"n":44,"q":"某智慧製造廠導入語音互動 AI 助理，作業人員可透過語音查詢設備狀態與操作指引。系統流程包含語音轉文字、語言模型生成回覆，以及即時查詢內部系統資料。測試結果顯示：語音轉文字在專業設備術語上錯誤率偏高；語言模型回覆偶有內容不夠精準；系統整體回應速度略慢但仍在可接受範圍。若專案目標為優先確保正確執行指令，下列改進措施的執行順序何者最合理？","o":["優化語言模型 → 強化語音模型 → 優化系統效能 → 調整生成參數","強化語音模型 → 優化語言模型與知識補充 → 調整生成參數 → 優化系統效能","優化系統效能 → 強化語音模型 → 優化語言模型與知識補充 → 調整生成參數","強化語音模型 → 優化系統效能 → 優化語言模型與知識補充 → 調整生成參數"],"a":1,"ex":""},{"id":"115-1-2-45","src":"115-1","subj":2,"n":45,"q":"某企業導入生成式 AI 助理，協助內部人員撰寫專案建議與分析報告。團隊希望透過思維鏈（Chain of Thought, CoT）提示設計提升模型輸出的邏輯性與推理透明度，下列何者最符合該提示策略？","o":["「請直接給出最終建議，不需顯示分析過程。」","「以下提供兩份分析報告範例，請依相同格式產出新報告。」","「請將任務拆為三個步驟：資料整理 → 重點摘要 → 建議產出。」","「請逐步說明你的判斷依據與推理過程，最後再給出結論。」"],"a":3,"ex":""},{"id":"115-1-2-46","src":"115-1","subj":2,"n":46,"q":"某金融監理機構規劃導入生成式 AI 以協助內部人員分析申報文件與監理報告，系統需處理大量涉及企業敏感資料與未公開資訊。主管機關明確要求「資料安全與法規遵循必須優先於導入速度與成本考量」。在此條件下，下列哪一種策略最為適當？","o":["採用雲端大型語言模型 API，並透過資料遮罩與加密機制降低外洩風險","導入開源模型進行私有化部署，以兼顧成本彈性與模型可控性","自行訓練並私有化部署模型，同時建立存取控管與稽核機制","先驗證模型效益，再逐步補強合規與資安架構"],"a":2,"ex":""},{"id":"115-1-2-47","src":"115-1","subj":2,"n":47,"q":"某製造企業規劃導入生成式 AI 協助產線異常紀錄分析，系統將根據設備回報與維修紀錄自動產出問題摘要與建議處置說明。在試行測試階段，為降低營運與決策風險，下列何者最應優先驗證？","o":["AI 生成建議與實際工程判斷的一致性與正確性","系統在高資料量輸入下的處理速度與延遲表現","模型對不同設備品牌資料格式的轉換能力","異常分析報告的視覺化呈現與介面易讀性"],"a":0,"ex":""},{"id":"115-1-2-48","src":"115-1","subj":2,"n":48,"q":"某企業將機器學習模型部署於線上推薦系統。模型在測試階段表現良好，但上線數月後，點擊率與預測準確度逐漸下降。經分析發現，近期使用者行為模式與模型訓練期間的資料特徵出現顯著變化。此現象最可能屬於下列何者？","o":["模型過度擬合訓練資料，無法泛化至未知樣本","特徵工程設計不佳，導致輸入資訊不足","資料統計特徵隨時間改變，影響模型推論效果","系統資料結構調整，造成特徵欄位錯置"],"a":2,"ex":""},{"id":"115-1-2-49","src":"115-1","subj":2,"n":49,"q":"某企業使用 Low-Code 平台建置內部營運系統，系統需整合財務、庫存與第三方物流服務。團隊希望確保系統在跨部門流程與外部服務整合下，具高可靠性與可測試性。下列哪一項作法最能達成目標？","o":["只透過平台提供的流程模擬與即時預覽，檢查常用操作路徑","建立自動化測試流程，結合模擬外部服務與可重複執行的整合測試","將測試重點放在使用者介面操作，確認操作流程是否順暢","上線後再透過使用者回饋與報表監控系統行為，進行修正"],"a":1,"ex":""},{"id":"115-1-2-50","src":"115-1","subj":2,"n":50,"q":"某招聘公司使用生成式 AI 生成面試問題與候選人評估建議。團隊發現模型可能對性別或年齡產生的資料分布偏差。下列哪一種策略最能有效降低生成偏差輸出的風險？","o":["調整模型架構與參數，使生成更靈活與多樣化","大幅增加訓練資料量，但不清理或平衡資料中的性別與年齡分布","在生成後對模型輸出進行人工審查，並依偏差情況修正結果","僅允許高階主管操作系統，透過人員篩選控制生成結果"],"a":2,"ex":""},{"id":"115-2-1-1","src":"115-2","subj":1,"n":1,"q":"某地方政府委託資料科學團隊，針對選舉期間的社群媒體貼文進行大規模輿情分析，目標是了解選民對各政策議題的態度傾向。團隊規劃整合多種AI技術以提升分析涵蓋率。下列哪一種技術組合最符合上述需求，且不涉及對特定個人的身份辨識？","o":["情感分析結合關鍵詞提取，分析貼文內容的立場與高頻議題詞彙","文本分類結合人臉辨識，辨識發文者身份後再進行政治立場分類","語音辨識結合影像辨識，將選舉造勢影片轉換為可分析的文字資料，並進行內容整理與主題歸納","推薦系統結合社群圖譜分析，針對個別使用者預測其投票選擇"],"a":0,"ex":""},{"id":"115-2-1-2","src":"115-2","subj":1,"n":2,"q":"某物流公司正在規劃導入AI系統以優化多項業務流程，包含異常包裹偵測、路線自動規劃與倉儲揀貨效率提升。技術團隊在評估過程中，針對不同任務的資料特性與學習目標，討論應採用哪種機器學習方式。請問下列對於各學習方式的敘述，何者有誤？","o":["監督式學習（Supervised Learning）適合用於異常包裹偵測，前提是須備有大量已標註為正常或異常的歷史資料","非監督式學習可（Unsupervised Learning）用於分析倉儲揀貨動線的潛在分群，但無法直接預測特定行為的對錯","強化學習（Reinforcement Learning）適合應用於路線規劃，模型透過反覆嘗試與環境回饋，逐步找出最佳配送策略","非監督式學習（Unsupervised Learning）可用於異常包裹偵測，並能在缺乏標註資料的情況下，準確判斷每筆資料是否屬於特定異常類別"],"a":3,"ex":""},{"id":"115-2-1-3","src":"115-2","subj":1,"n":3,"q":"某電子製造公司在產線上導入AI系統，自動判斷電路板是否存在焊接瑕疵，並取代人工目視檢查。該系統需處理大量產品外觀影像，並在高產量環境下短時間內完成品質判定。下列何者最不符合此應用所展現的AI核心技術能力？","o":["自然語言處理（Natural Language Processing）","電腦視覺（Computer Vision）","異常偵測（Anomaly Detection）","診斷性分析（Diagnostic Analytics）"],"a":0,"ex":""},{"id":"115-2-1-4","src":"115-2","subj":1,"n":4,"q":"某金融科技公司的交易系統，在毫秒等級的時間內持續掃描跨市場價格差異、分析大量即時報價，並自動執行交易指令。系統架構師在技術選用評估時，需確認該系統於即時交易決策中最核心依賴的AI能力。下列何者最能正確說明其核心AI能力？","o":["透過自然語言處理技術分析財經新聞語意，作為輔助性市場情緒指標","快速分析龐大市場數據並在極短時間內識別交易機會，驅動自動化交易決策","運用生成對抗網路模擬極端市場情境，預先產出各類黑天鵝事件的應對策略","透過推薦系統技術，根據投資人歷史交易行為推薦最適合的投資組合標的"],"a":1,"ex":""},{"id":"115-2-1-5","src":"115-2","subj":1,"n":5,"q":"某地方政府導入AI系統審核低收入補助資格。系統已通過內部測試且準確率高，但民間團體指出不同族群核准率差異顯著。政府表示該系統由專業廠商開發，且未接獲大量申訴。依《人工智慧基本法》精神，下列何者為最適當之優先作法？","o":["要求廠商提出無歧視聲明，並持續觀察","提升模型整體準確率，以降低錯誤影響","進行偏誤影響評估並建立可解釋與申訴機制","因尚無大量申訴，暫不調整現行制度"],"a":2,"ex":""},{"id":"115-2-1-6","src":"115-2","subj":1,"n":6,"q":"某AI新創公司申請AI系統認證，並聲稱其產品已通過我國「AI產品與系統評測中心」之生成式AI評測。下列何者不屬於該中心之評測項目？","o":["資安（Secure）","公平性（Fair）","效率性（Efficiency）","可靠性（Reliability）"],"a":2,"ex":""},{"id":"115-2-1-7","src":"115-2","subj":1,"n":7,"q":"某媒體集團計畫自行訓練一套生成式AI系統，用於自動產出新聞摘要與評論內容。在專案啟動會議中，法務與技術團隊共同討論如何從訓練階段就降低模型產出有害或偏頗內容的風險，並兼顧內容的多元性與公平性。請問下列哪一項措施最應該在模型訓練階段優先落實？","o":["確保訓練資料來源多元，並經過嚴格的內容清洗與偏見過濾，以減少模型學習到有害或偏頗資訊的風險","完全避免使用任何外部文本資料，以降低模型學習到不當內容的可能性","僅使用公司內部的新聞稿與公告進行訓練，確保資料來源可控且符合企業立場","限制模型僅能產出固定格式的內容，從輸出端約束模型避免生成不當資訊"],"a":0,"ex":""},{"id":"115-2-1-8","src":"115-2","subj":1,"n":8,"q":"某保險公司規劃推出一套AI核保輔助系統，針對線上投保申請進行初步風險評估並自動回覆審核結果。系統開發完成後，依據金融機構運用人工智慧技術作業規範，系統在正式與消費者互動前，必須確認相關揭露義務已落實。請問下列何者不屬於該規範要求金融機構必要揭露的事項？","o":["詳細公開本系統所採用的機器學習模型架構與完整訓練資料內容","說明本服務的適用對象與用途範圍，使消費者了解系統的使用限制與服務邊界","說明當消費者對AI核保結果有異議時，是否提供人工複核或申訴管道","告知消費者本次核保審查結果係由AI系統自動完成，非人工逐案審核"],"a":0,"ex":""},{"id":"115-2-1-9","src":"115-2","subj":1,"n":9,"q":"某大型醫院導入AI輔助診斷系統，用於分析病患的電子病歷與影像資料並提供疾病風險評分。系統上線後，院方陸續收到三類回饋：①放射科醫師反映無法理解系統判斷某病患為高風險的依據與理由；②數位治理委員會發現系統對特定族裔病患的誤診率顯著偏高；③資訊安全部門指出部分病患個資在未告知當事人的情況下被納入模型再訓練。依據AI倫理五大核心原則，上述三類問題分別對應哪一項原則的違反？","o":["①違反安全性、②違反問責性、③違反透明性","①違反隱私性、②違反安全性、③違反公平性","①違反公平性、②違反透明性、③違反問責性","①違反透明性、②違反公平性、③違反隱私性"],"a":3,"ex":""},{"id":"115-2-1-10","src":"115-2","subj":1,"n":10,"q":"某市政府環保局計畫建立空氣品質監測AI系統，需整合全市5萬個感測器的即時數據（每秒產生大量資料記錄），並持續接收氣象、交通與工廠排放等資料，且需即時處理持續產生的資料。就大數據特性分析，下列何者最能說明此專案面臨的主要挑戰組合？","o":["Volume與Velocity，因為資料量龐大且持續高速產生","Variety與Veracity，因為資料來源多元且需確保正確性","Velocity與Value，因為需即時判斷資料是否具有分析價值","Volume與Value，因為需從大量資料中篩選出有用資訊"],"a":0,"ex":""},{"id":"115-2-1-11","src":"115-2","subj":1,"n":11,"q":"某保險公司建立理賠風險預測模型時，資料科學家在特徵選擇階段提出以「性別」作為預測愛滋病毒感染風險的輸入特徵之一。資料治理委員會在審查特徵清單時，對此提出異議。下列哪一項理由最能說明「以性別預測愛滋病毒感染風險」是不適當的原因？","o":["性別為類別型變數，需進行編碼轉換才能輸入模型，增加前處理複雜度","性別特徵在資料集中可能存在缺失值，影響模型訓練的穩定性","以性別作為感染風險的代理特徵，會強化對特定族群的歧視性標籤，違反公平性原則","性別特徵與感染風險之間的統計相關性有限，可能降低模型預測效能"],"a":2,"ex":""},{"id":"115-2-1-12","src":"115-2","subj":1,"n":12,"q":"某製造業導入AI進行生產排程，需整合ERP（企業資源規劃系統）訂單資料、設備感測器產生的連續數值紀錄，以及維修技師手寫異常描述（掃描為PDF）。資料治理主管需判斷三類資料的型態。下列何者最能正確對應其資料型態？","o":["ERP訂單資料為半結構化、感測器數值為結構化、維修文字描述為非結構化","ERP訂單資料為結構化、感測器數值為結構化、維修文字描述為非結構化","ERP訂單資料為結構化、感測器數值為非結構化、維修文字描述為半結構化","三者皆屬結構化資料，因為都可以轉換為數值格式後進行分析"],"a":1,"ex":""},{"id":"115-2-1-13","src":"115-2","subj":1,"n":13,"q":"某銀行建立機器學習模型預測客戶的貸款違約風險。資料集中有一個「職業類別」欄位，包含「工程師、教師、業務、自由業」等類別。工程師計劃將此欄位進行編碼處理後直接輸入線性模型。下列哪一種編碼方式最可能導致模型錯誤解讀類別之間的關係？","o":["One-Hot Encoding","Binary Encoding","Target Encoding","Label Encoding"],"a":3,"ex":""},{"id":"115-2-1-14","src":"115-2","subj":1,"n":14,"q":"某能源公司以過去三年每小時用電資料建立需求預測模型，並以5-fold交叉驗證評估，但上線後誤差偏高。技術主管認為問題出在資料分割方式。下列何者最能說明使用標準k-fold交叉驗證的根本問題？","o":["k-fold交叉驗證需要的計算資源過大，不適合處理三年以上的長期資料","k-fold交叉驗證會隨機分割資料，使訓練集中可能包含比測試集更晚的時間點，破壞時間依賴性","k-fold交叉驗證的折數設定過少，應改為10-fold以提升驗證穩定性","k-fold交叉驗證僅適用於分類問題，不適合電力需求這類連續數值預測任務"],"a":1,"ex":""},{"id":"115-2-1-15","src":"115-2","subj":1,"n":15,"q":"某醫療院所建置病患再住院風險預測模型，特徵包含「年齡」、「體重」、「血壓數值」及「診斷類別代碼」等，資料科學家考慮是否需對數值特徵進行標準化（Standardization）處理。下列何種模型對特徵尺度最不敏感、最適合在不進行標準化的情況下直接使用上述特徵進行訓練？","o":["線性迴歸（Linear Regression）","支援向量機（Support Vector Machine）","K近鄰演算法（K-Nearest Neighbors）","決策樹（Decision Tree）"],"a":3,"ex":""},{"id":"115-2-1-16","src":"115-2","subj":1,"n":16,"q":"某企業集團在多個領域導入AI技術，應用於不同業務場景。請問下列哪一項最符合異常檢測（Anomaly Detection）的主要應用目標？","o":["分析客戶的消費行為資料，將客群依偏好進行分群，以制定差異化行銷策略","根據歷史交易與客戶資料，建立模型預測未來可能發生違約的客戶","彙整企業各部門的營運數據，建立儀表板供管理層追蹤關鍵績效指標（KPI）的變化","從設備感測資料中，即時偵測出與正常運作模式顯著偏離的訊號，以預警可能發生的故障"],"a":3,"ex":""},{"id":"115-2-1-17","src":"115-2","subj":1,"n":17,"q":"某交通局計劃將公車乘客刷卡資料提供給學術機構進行通勤模式研究，該資料包含卡號、上下車時間、路線編號等欄位，且需保留跨時間追蹤同一乘客行為能力。為保護乘客隱私，下列哪種處理方式最符合個人資料保護法的去識別化要求？","o":["將卡號欄位全部刪除，僅保留上下車時間與路線編號","對卡號進行MD5雜湊處理，並保留對照表供查詢","將資料彙總為每日各路線總乘客數統計","將卡號替換為隨機編號，且不保留任何對應關係"],"a":3,"ex":""},{"id":"115-2-1-18","src":"115-2","subj":1,"n":18,"q":"某工業感測器回傳溫度時序資料，約5%出現遺漏值，確認為短暫失聯所致，非設備異常。資料工程師需在不引入虛假異常的前提下進行補值。考量資料具時間連續性，下列何種填補方式最為合適？","o":["將遺漏值全數填補為0","以前後時間點的觀測值進行線性插補","填補整份資料的平均值","直接刪除包含遺漏值的時間點"],"a":1,"ex":""},{"id":"115-2-1-19","src":"115-2","subj":1,"n":19,"q":"某溫室農場開發AI系統自動識別作物葉片上的害蟲種類，測試結果顯示：在1000張測試影像中，系統正確識別出80隻害蟲，但誤判了20張正常葉片為有害蟲，同時漏檢了10隻實際存在的害蟲。對於害蟲檢測這個關鍵任務，下列哪個評估指標最需要優先關注？","o":["召回率（Recall）","精確率（Precision）","準確率（Accuracy）","F1分數（F1-Score）"],"a":0,"ex":""},{"id":"115-2-1-20","src":"115-2","subj":1,"n":20,"q":"某跨國企業需透過網路將各國子公司之敏感資料傳輸至總部進行模型訓練。資訊安全主管要求在傳輸過程中防範中間人攻擊，避免資料遭竊取或竄改。在不影響系統跨國即時傳輸效率之前提下，下列哪一項措施最能有效降低此風險？","o":["在接收端加強存取權限與身分驗證，限制只有授權人員可讀取資料","在資料傳輸過程中進行加密，並確認雙方身分以確保通訊安全","將資料拆分為多個部分分批傳送，降低單次資料外洩風險","改用離線備援方式進行跨國資料交換，以降低網路攻擊風險"],"a":1,"ex":""},{"id":"115-2-1-21","src":"115-2","subj":1,"n":21,"q":"關於深度學習（Deep Learning），下列敘述何者最為正確？","o":["深度學習模型通常需要人工設計特徵，以提升模型表現","深度學習主要應用於資料壓縮與特徵轉換，較少用於預測任務","深度學習透過多層神經網路，能自動從大量資料中學習抽象特徵","深度學習模型通常不需要大量資料即可達到良好效果，適合資料量有限的情境"],"a":2,"ex":""},{"id":"115-2-1-22","src":"115-2","subj":1,"n":22,"q":"某企業於不同業務場景導入AI應用。下列關於其應用情境與機器學習類型的敘述，何者正確？","o":["客服對話分析中，同時使用少量標註資料與大量未標註資料進行訓練，屬於監督式學習（Supervised Learning）","商品分類系統依據顧客購買行為自動將商品分群，且未使用任何標註資料，屬於監督式學習（Supervised Learning）","自動駕駛系統根據操作結果的回饋持續調整決策策略，屬於非監督式學習（Unsupervised Learning）","使用者行為分析中，依據瀏覽與點擊模式將使用者分群，且未使用標註資料，屬於非監督式學習（Unsupervised Learning）"],"a":3,"ex":""},{"id":"115-2-1-23","src":"115-2","subj":1,"n":23,"q":"某房仲業者委託AI團隊開發一套房價預測系統，希望根據物件坪數、屋齡、樓層與地段等條件，自動估算每間房屋的成交價格，供業務人員作為議價參考依據。下列哪一種指標最適合在系統上線前評估模型的預測準確程度？","o":["均方誤差（MSE）","精確率（Precision）","F1分數（F1 Score）","召回率（Recall）"],"a":0,"ex":""},{"id":"115-2-1-24","src":"115-2","subj":1,"n":24,"q":"某電商平台導入強化學習（Reinforcement Learning）技術優化商品推薦策略，AI代理（AI Agent）會根據使用者的點擊與購買行為持續調整推薦內容。技術團隊在討論中發現，系統面臨一個核心挑戰：若AI Agent總是推薦過去表現良好的商品，可能會錯失發掘更高潛力商品的機會；但若頻繁嘗試未知商品，又可能影響短期的推薦成效與使用者體驗。請問上述情境敘述的是強化學習中哪一個核心問題？","o":["探索與利用的權衡（Exploration vs. Exploitation）","偏差與變異的權衡（Bias vs. Variance）","梯度爆炸與消失（Vanishing and Exploding Gradients）","過擬合與欠擬合（Overfitting and Underfitting）"],"a":0,"ex":""},{"id":"115-2-1-25","src":"115-2","subj":1,"n":25,"q":"某語音辨識系統需分析長時間的語音序列，發現當句子較長時，模型難以保留長時間序列中的前段資訊，導致辨識準確度下降。為改善此問題，下列何種模型最適合？","o":["長短期記憶網路（LSTM）","循環神經網路（RNN）","卷積神經網路（C
