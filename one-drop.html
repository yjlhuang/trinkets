n't help but feel nostalgic for her high school days.","example_zh":"看著舊照片，她忍不住對高中時代感到懷念。"},{"id":405,"word":"canyon","pos":"n","meaning":"n. 峽谷","example":"The Grand Canyon is one of the most famous natural wonders in the United States.","example_zh":"大峽谷是美國最著名的自然奇觀之一。"},{"id":406,"word":"capability","pos":"n","meaning":"n. 能力","example":"This new software has the capability to process large amounts of data in seconds.","example_zh":"這款新軟體具有在幾秒鐘內處理大量數據的能力。"},{"id":407,"word":"capable","pos":"adj","meaning":"adj. 能夠；有能力的 (+of)","example":"She is a highly capable lawyer who has won many difficult cases for her clients.","example_zh":"她是一位非常有能力的律師，為客戶贏得許多困難的官司。"}]},
{"unit":4,"unit_label":"p.7-8","words":[{"id":408,"word":"capacity","pos":"n","meaning":"n. 容量；能力","example":"The stadium has a seating capacity of fifty thousand people for major concerts.","example_zh":"體育場在大規模音樂會時的座位容量為五萬人。"},{"id":409,"word":"cape","pos":"n","meaning":"n. 岬；披風","example":"The superhero wore a long red cape that flowed behind him as he ran.","example_zh":"超人穿著一件長長的紅色披風，跑動時在身後飄揚。"},{"id":410,"word":"capital","pos":"n","meaning":"n. 首都；資金 (adj) 大寫的","example":"Taipei is the capital city of Taiwan and is its political and economic center.","example_zh":"台北是台灣的首都，也是其政治與經濟中心。"},{"id":411,"word":"capitalism","pos":"n","meaning":"n. 資本主義","example":"Under capitalism, most industries are owned and operated by private individuals.","example_zh":"在資本主義下，大多數產業由私人擁有和經營。"},{"id":412,"word":"capitalist","pos":"n","meaning":"n. 資本家","example":"The wealthy capitalist invested millions of dollars in the new technology startup.","example_zh":"那位富有的資本家向這家新技術新創公司投資了數百萬美元。"},{"id":413,"word":"capture","pos":"v","meaning":"v. 捕獲；獲得；吸引；迷住 (n) 捕獲（物）","example":"The photographer tried to capture the beautiful sunset over the ocean.","example_zh":"攝影師試圖捕捉海面上美麗的日落。"},{"id":414,"word":"care for (someone)","pos":"phr","meaning":"phr. 照顧、照料某人","example":"It is important to find someone who can care for your pets while you are on vacation.","example_zh":"度假時找到能照顧你寵物的人是很重要的。"},{"id":415,"word":"career","pos":"n","meaning":"n. 生涯；職業","example":"He spent his entire career working as a dedicated teacher in a remote village.","example_zh":"他整個職業生涯都在偏遠村莊擔任一名敬業的老師。"},{"id":416,"word":"cargo","pos":"n","meaning":"n. 貨物","example":"The large ship was carrying a heavy cargo of oil and coal across the Atlantic.","example_zh":"那艘大船載著沉重的石油和煤炭貨物橫跨大西洋。"},{"id":417,"word":"carpenter","pos":"n","meaning":"n. 木匠","example":"We hired a skilled carpenter to build some custom bookshelves for our new office.","example_zh":"我們聘請了一位熟練的木匠為我們的新辦公室製作一些訂製書架。"},{"id":418,"word":"carriage","pos":"n","meaning":"n. 馬車","example":"In the past, people used a horse-drawn carriage to travel from one city to another.","example_zh":"過去，人們乘坐馬車從一個城市旅行到另一個城市。"},{"id":419,"word":"carrier","pos":"n","meaning":"n. 運送者；航空公司；航空母艦；軍艦；帶菌者；傳染媒介","example":"Mosquitoes are the primary carrier of malaria in many tropical regions.","example_zh":"蚊子是許多熱帶地區瘧疾的主要傳染媒介。"},{"id":420,"word":"carve","pos":"v","meaning":"v. 切（肉）；雕刻","example":"The artist used a sharp tool to carve a beautiful statue out of a block of marble.","example_zh":"藝術家使用鋒利的工具從一塊大理石中雕刻出一尊美麗的雕像。"},{"id":421,"word":"cast","pos":"v","meaning":"v. 投；丟 (n) 演員陣容","example":"The director is very happy with the talented cast chosen for the new movie.","example_zh":"導演對為新電影挑選的才華橫溢的演員陣容感到非常滿意。"},{"id":422,"word":"cast out","pos":"phr","meaning":"phr. 驅逐，趕走","example":"In the ancient story, the wizard was cast out of the kingdom for his dark magic.","example_zh":"在那個古老的故事中，巫師因其黑魔法而被驅逐出王國。"},{"id":423,"word":"casual","pos":"adj","meaning":"adj. 偶然的；意外的；不經意的；隨便的；非正式的","example":"He dressed in casual clothes for the weekend picnic with his family.","example_zh":"他穿著休閒的衣服參加週末與家人的野餐。"},{"id":424,"word":"casually","pos":"adv","meaning":"adv. 偶然地，臨時地，隨便地","example":"They were just talking casually about their plans for the upcoming summer holiday.","example_zh":"他們只是隨便聊聊關於即將到來的暑假計畫。"},{"id":425,"word":"catalog","pos":"n","meaning":"n. 目錄","example":"You can look through our online catalog to see all the products we have in stock.","example_zh":"你可以查看我們的線上目錄，看看我們所有的現貨產品。"},{"id":426,"word":"catalogue","pos":"n","meaning":"n. 目錄","example":"The library's catalogue makes it easy for students to find the books they need.","example_zh":"圖書館的目錄讓學生很容易找到他們需要的書。"},{"id":427,"word":"catch one's eye","pos":"phr","meaning":"phr. 吸引某人的注意","example":"The bright neon sign was designed to catch one's eye from a distance.","example_zh":"那個明亮的霓虹燈招牌旨在從遠處吸引某人的注意。"},{"id":428,"word":"catch up on","pos":"phr","meaning":"phr. 了解，得知 (近況)；補做","example":"We met for coffee to catch up on each other's news after not seeing each other for years.","example_zh":"幾年沒見後，我們見面喝咖啡以了解彼此的近況。"},{"id":429,"word":"category","pos":"n","meaning":"n. 種類，類別","example":"These books are organized into different categories based on their subjects.","example_zh":"這些書根據主題被組織成不同的類別。"},{"id":430,"word":"caterpillar","pos":"n","meaning":"n. 毛毛蟲","example":"The children watched the caterpillar crawl slowly along the green leaf.","example_zh":"孩子們看著毛毛蟲在綠葉上緩緩爬行。"},{"id":431,"word":"cattle","pos":"n","meaning":"n. 牛群","example":"The rancher owns hundreds of cattle that graze on the vast green fields.","example_zh":"牧場主擁有數百頭在廣闊綠地上吃草的牛群。"},{"id":432,"word":"cause","pos":"v","meaning":"v. 造成 (n) 原因","example":"The heavy rain was the main cause of the sudden flood in the low-lying area.","example_zh":"大雨是低窪地區突然淹水的主要原因。"},{"id":433,"word":"CD (=compact disk)","pos":"n","meaning":"n. 雷射唱片；光碟","example":"Although most people use streaming services now, I still enjoy listening to my old CDs.","example_zh":"雖然現在大多數人都使用串流服務，我仍然喜歡聽我的舊雷射唱片。"},{"id":434,"word":"cease","pos":"v","meaning":"v. 停止 (n) 停止","example":"The two countries agreed to cease fire and start peaceful negotiations.","example_zh":"兩國同意停止交火並開始和平談判。"},{"id":435,"word":"celebration","pos":"n","meaning":"n. 慶祝（活動）","example":"The whole town joined in the celebration after the local team won the championship.","example_zh":"在當地球隊贏得冠軍後，全鎮都參加了慶祝活動。"},{"id":436,"word":"cement","pos":"n","meaning":"n. 水泥","example":"The workers used cement to build a strong foundation for the new house.","example_zh":"工人們用水泥為新房子建造了牢固的地基。"},{"id":437,"word":"centimeter","pos":"n","meaning":"n. 公分","example":"The insect was only a few centimeters long and was difficult to see.","example_zh":"那隻昆蟲只有幾公分長，很難看見。"},{"id":438,"word":"century","pos":"n","meaning":"n. 世紀","example":"This historic building was constructed at the beginning of the twentieth century.","example_zh":"這棟歷史建築是在二十世紀初建造的。"},{"id":439,"word":"ceramic","pos":"adj","meaning":"adj. 製陶藝術的；陶器的","example":"The museum has a wonderful collection of ancient Chinese ceramic vases.","example_zh":"這間博物館收藏了許多精彩的古代中國陶器花瓶。"},{"id":440,"word":"ceremony","pos":"n","meaning":"n. 典禮；儀式","example":"The opening ceremony of the Olympic Games was watched by millions of people.","example_zh":"數百萬人觀看了奧運會的開幕典禮。"},{"id":441,"word":"certain","pos":"adj","meaning":"adj. 某種的，確信的，肯定的","example":"I am certain that I locked the door before I left the house this morning.","example_zh":"我確信今天早上離開家前鎖了門。"},{"id":442,"word":"certainly","pos":"adv","meaning":"adv. 必定，無疑；當然","example":"If you practice every day, you will certainly improve your English skills.","example_zh":"如果你每天練習，你的英文能力無疑會進步。"},{"id":443,"word":"certainty","pos":"n","meaning":"n. 必然的事，確定性","example":"There is no certainty that the weather will be clear for the outdoor wedding.","example_zh":"無法確定戶外婚禮當天天氣是否會晴朗。"},{"id":444,"word":"chain","pos":"n","meaning":"n. 鏈；項圈；一連串；連鎖店 (v) 以鏈鎖住","example":"The bicycle was attached to the fence with a heavy metal chain.","example_zh":"自行車被一條沉重的金屬鏈鎖在籬笆上。"},{"id":445,"word":"challenge","pos":"v","meaning":"v. 挑戰；質疑 (n) 挑戰","example":"Learning a new language is a difficult challenge, but it is very rewarding.","example_zh":"學習新語言是一項艱難的挑戰，但非常值得。"},{"id":446,"word":"challenging","pos":"adj","meaning":"adj. 有挑戰性的","example":"The puzzle was very challenging, and it took me two hours to complete it.","example_zh":"這個拼圖很有挑戰性，花了我兩個小時才完成。"},{"id":447,"word":"chamber","pos":"n","meaning":"n. 房間；寢室","example":"The heart has four chambers that work together to pump blood throughout the body.","example_zh":"心臟有四個腔室，共同運作將血液泵送到全身。"},{"id":448,"word":"champion","pos":"n","meaning":"n. 冠軍；優勝者","example":"The young athlete was proud to be crowned the world champion in swimming.","example_zh":"這位年輕運動員為獲得世界游泳冠軍頭銜感到自豪。"},{"id":449,"word":"championship","pos":"n","meaning":"n. 冠軍頭銜；冠軍賽；錦標賽","example":"Our school basketball team won the national championship for the third year in a row.","example_zh":"我們學校籃球隊連續第三年贏得全國錦標賽。"},{"id":450,"word":"changeable","pos":"adj","meaning":"adj. 易變的","example":"The weather in the mountains is very changeable, so you should bring a jacket.","example_zh":"山區的天氣非常易變，所以你應該帶件夾克。"},{"id":451,"word":"channel","pos":"n","meaning":"n. 頻道；管道；途徑；海峽","example":"You can change the TV channel using the remote control on the table.","example_zh":"你可以用桌上的遙控器更換電視頻道。"},{"id":452,"word":"chapter","pos":"n","meaning":"n. 章節；重要時期；時代","example":"The first chapter of the book introduces the main characters and the setting.","example_zh":"這本書的第一章介紹了主要人物和背景。"},{"id":453,"word":"characteristic","pos":"n","meaning":"n. 特色；特性","example":"Kindness is one of the most important characteristics of a good friend.","example_zh":"善良是好朋友最重要的特性之一。"},{"id":454,"word":"charity","pos":"n","meaning":"n. 仁慈；善心；慈善機構","example":"The local charity provides food and clothing for families in need.","example_zh":"當地的慈善機構為需要的家庭提供食物和衣服。"},{"id":455,"word":"charm","pos":"v","meaning":"v. 使陶醉；吸引 (n) 魅力；護身符","example":"The small coastal village has a unique charm that attracts many visitors.","example_zh":"這個沿海小村莊有一種吸引許多遊客的獨特魅力。"},{"id":456,"word":"chat","pos":"v","meaning":"v. 聊天 (n) 聊天","example":"I had a long chat with my old friend on the phone last night.","example_zh":"我昨晚和老朋友在電話上長聊了一番。"},{"id":457,"word":"cheek","pos":"n","meaning":"n. 臉頰","example":"The little boy's cheeks turned red when he ran in the cold wind.","example_zh":"小男孩在冷風中奔跑時，臉頰變紅了。"},{"id":458,"word":"cheer","pos":"v","meaning":"v. 喝采；加油 (n) 喝采；加油","example":"The fans began to cheer loudly when their team scored the winning goal.","example_zh":"當球隊踢進致勝球時，球迷們開始大聲喝采。"},{"id":459,"word":"cheerful","pos":"adj","meaning":"adj. 愉快的","example":"Despite the bad news, she tried to remain cheerful for the sake of her children.","example_zh":"儘管有壞消息，她還是為了孩子努力保持愉快。"},{"id":460,"word":"cheese","pos":"n","meaning":"n. 乳酪；起司","example":"I like to put a lot of extra cheese on my pizza and pasta.","example_zh":"我喜歡在披薩和義大利麵上放很多額外的起司。"},{"id":461,"word":"chemistry","pos":"n","meaning":"n. 化學","example":"In chemistry class, we performed an experiment to see how different substances react.","example_zh":"在化學課上，我們做了一個實驗，看不同物質如何反應。"},{"id":462,"word":"cherish","pos":"v","meaning":"v. 珍惜","example":"You should cherish the time you spend with your family and friends.","example_zh":"你應該珍惜與家人和朋友共度的時光。"},{"id":463,"word":"cherry","pos":"n","meaning":"n. 櫻桃","example":"We picked some fresh cherries from the tree and ate them for dessert.","example_zh":"我們從樹上摘了一些新鮮櫻桃當作甜點吃。"},{"id":464,"word":"chest","pos":"n","meaning":"n. 胸（膛）","example":"The doctor listened to the patient's heartbeat by placing the stethoscope on his chest.","example_zh":"醫生透過將聽診器放在病人的胸膛上來聽心跳。"},{"id":465,"word":"chew","pos":"v","meaning":"v. 咀嚼","example":"You should chew your food thoroughly before swallowing it to help with digestion.","example_zh":"你應該在吞嚥前徹底咀嚼食物以幫助消化。"},{"id":466,"word":"childhood","pos":"n","meaning":"n. 童年","example":"He has many happy memories of his childhood in the countryside.","example_zh":"他對在鄉村度過的童年有許多快樂的回憶。"},{"id":467,"word":"chill","pos":"v","meaning":"v. 使冷卻 (n) 寒氣；風寒","example":"Put the white wine in the refrigerator to chill before the dinner party.","example_zh":"晚宴前把白葡萄酒放進冰箱冷卻。"},{"id":468,"word":"chilly","pos":"adj","meaning":"adj. 寒冷的","example":"It was a chilly evening, so we decided to sit by the fireplace.","example_zh":"那是一個寒冷的夜晚，所以我們決定坐在火爐旁。"},{"id":469,"word":"chimney","pos":"n","meaning":"n. 煙囪","example":"Smoke rose from the chimney of the small cottage in the woods.","example_zh":"煙從森林裡小木屋的煙囪中升起。"},{"id":470,"word":"chip","pos":"n","meaning":"n. 碎片；洋芋片 (v) 弄缺；削成碎片","example":"I accidentally broke the plate and a small chip flew across the floor.","example_zh":"我不小心打破了盤子，一塊小碎片飛過地板。"},{"id":471,"word":"chirp","pos":"v","meaning":"v. 鳥叫；蟲鳴 (n) 鳥或蟲的叫聲","example":"I love waking up to the sound of birds as they chirp outside my window.","example_zh":"我喜歡在窗外鳥兒的鳴叫聲中醒來。"},{"id":472,"word":"choice","pos":"n","meaning":"n. 選擇","example":"You have to make a choice between going to the movie or staying home to study.","example_zh":"你必須在去看電影或留在家裡讀書之間做出選擇。"},{"id":473,"word":"choke","pos":"v","meaning":"v. 使窒息；噎住","example":"The thick smoke from the fire began to choke the people inside the building.","example_zh":"火災產生的濃煙開始使建築物內的人窒息。"},{"id":474,"word":"choose","pos":"v","meaning":"v. 選擇（chose, chosen）","example":"It was difficult to choose which dress to wear for the graduation party.","example_zh":"很難選擇要穿哪件禮服參加畢業派對。"},{"id":475,"word":"chop","pos":"v","meaning":"v. 砍；剁 (n) 排骨","example":"You need to chop the onions and carrots into small pieces for the soup.","example_zh":"你需要把洋蔥和紅蘿蔔剁成小塊來煮湯。"},{"id":476,"word":"chore","pos":"n","meaning":"n. 家事；雜事","example":"My daily chores include washing the dishes and taking out the trash.","example_zh":"我的日常家事包括洗碗和倒垃圾。"},{"id":477,"word":"chorus","pos":"n","meaning":"n. 合唱（團）","example":"The school chorus performed a beautiful song at the year-end concert.","example_zh":"學校合唱團在年終音樂會上表演了一首動聽的歌。"},{"id":478,"word":"cigar","pos":"n","meaning":"n. 雪茄","example":"The businessman sat in his office and smoked an expensive cigar.","example_zh":"那位商人坐在辦公室裡抽著昂貴的雪茄。"},{"id":479,"word":"cigarette","pos":"n","meaning":"n. 香菸","example":"Smoking cigarettes is a major cause of lung cancer and other health problems.","example_zh":"吸香菸是導致肺癌和其他健康問題的主要原因。"},{"id":480,"word":"cinema","pos":"n","meaning":"n. 電影院；電影","example":"We usually go to the cinema on Saturday nights to see the latest movies.","example_zh":"我們通常在週六晚上去電影院看最新的電影。"},{"id":481,"word":"circular","pos":"adj","meaning":"adj. 圓形的","example":"The children sat in a circular formation on the floor to listen to the story.","example_zh":"孩子們在地上坐成圓形聽故事。"},{"id":482,"word":"circulate","pos":"v","meaning":"v. 循環；流通","example":"Blood must circulate through the body to provide oxygen to all the organs.","example_zh":"血液必須在體內循環，為所有器官提供氧氣。"},{"id":483,"word":"circulation","pos":"n","meaning":"n. 循環；流通；發行量","example":"This newspaper has a large circulation and is read by people all over the country.","example_zh":"這份報紙發行量很大，全國各地的人都在閱讀。"},{"id":484,"word":"circumstance","pos":"n","meaning":"n. 情況；情勢（慣用複數）","example":"Under the current circumstances, we have to cancel the outdoor event.","example_zh":"在目前的情況下，我們不得不取消戶外活動。"},{"id":485,"word":"circumstances","pos":"n","meaning":"n. 情況","example":"You should adapt your plans according to the changing circumstances.","example_zh":"你應該根據變化的情況調整你的計畫。"},{"id":486,"word":"circus","pos":"n","meaning":"n. 馬戲團","example":"The children were excited to see the acrobats and animals at the circus.","example_zh":"孩子們看到馬戲團裡的雜技演員和動物感到很興奮。"},{"id":487,"word":"civic","pos":"adj","meaning":"adj. 市民的","example":"It is our civic duty to vote in the elections and participate in community activities.","example_zh":"參加選舉投票和參與社區活動是我們的市民義務。"},{"id":488,"word":"civilization","pos":"n","meaning":"n. 文明；教化；開化","example":"Ancient Egypt was one of the earliest and most advanced civilizations in history.","example_zh":"古埃及是歷史上最早且最先進的文明之一。"},{"id":489,"word":"civilize","pos":"v","meaning":"v. 使文明，使開化","example":"Some people believe that education is the key to civilize a society.","example_zh":"有些人認為教育是使社會文明的關鍵。"},{"id":490,"word":"claim","pos":"v/n","meaning":"v/n. 宣稱，主張","example":"The company made a claim that their new product could help people lose weight quickly.","example_zh":"該公司宣稱他們的新產品能幫助人們快速減肥。"},{"id":491,"word":"clarify","pos":"v","meaning":"v. 釐清；闡明；淨化；使純淨","example":"The teacher tried to clarify the difficult concept by giving some simple examples.","example_zh":"老師試圖透過給出一些簡單的例子來釐清那個困難的概念。"},{"id":492,"word":"clash","pos":"v","meaning":"v. 鏗鏘地撞擊；衝突 (n) 撞擊聲；衝突","example":"Protesters began to clash with the police during the demonstration downtown.","example_zh":"抗議者在市中心的示威活動中開始與警察發生衝突。"},{"id":493,"word":"classic","pos":"adj","meaning":"adj. 經典的 (n) 經典名著","example":"\"Pride and Prejudice\" is a classic novel that has been loved for generations.","example_zh":"《傲慢與偏見》是一本受世世代代喜愛的經典小說。"},{"id":494,"word":"classical","pos":"adj","meaning":"adj. 古典的","example":"My sister loves listening to classical music while she is studying for exams.","example_zh":"我姊姊在準備考試時喜歡聽古典音樂。"},{"id":495,"word":"classification","pos":"n","meaning":"n. 分類","example":"The classification of animals into different groups is based on their physical features.","example_zh":"將動物分成不同組別的分類是基於它們的身體特徵。"},{"id":496,"word":"classify","pos":"v","meaning":"v. 分類","example":"In the library, books are usually classified according to their subject matter.","example_zh":"在圖書館裡，書籍通常根據其主題內容來分類。"},{"id":497,"word":"click","pos":"v","meaning":"v. （使）發出喀的一聲；按滑鼠點選 (n) 喀嚓聲；按滑鼠的動作","example":"You can open the file by a simple click on the icon with your mouse.","example_zh":"你只需用滑鼠在圖標上點一下即可打開檔案。"},{"id":498,"word":"client","pos":"n","meaning":"n. 客戶","example":"The lawyer met with his client to discuss the legal strategy for the trial.","example_zh":"律師會見了其客戶以討論審判的法律策略。"},{"id":499,"word":"cliff","pos":"n","meaning":"n. 懸崖","example":"Be careful not to stand too close to the edge of the steep cliff.","example_zh":"小心不要站得離陡峭的懸崖邊緣太近。"},{"id":500,"word":"climate","pos":"n","meaning":"n. 氣候","example":"Scientists are concerned about the effects of global warming on the world's climate.","example_zh":"科學家們對全球暖化對世界氣候的影響感到擔憂。"},{"id":501,"word":"climatic","pos":"adj","meaning":"adj. 氣候的","example":"Many regions are experiencing extreme weather due to changing climatic conditions.","example_zh":"由於氣候條件的改變，許多地區正經歷極端天氣。"},{"id":502,"word":"climax","pos":"n","meaning":"n. 巔峰；頂點；精彩之處 (v) 達到巔峰","example":"The movie reaches its dramatic climax when the hero finally discovers the truth.","example_zh":"當英雄終於發現真相時，電影達到了戲劇性的頂點。"},{"id":503,"word":"clinic","pos":"n","meaning":"n. 診所","example":"My sister went to the local dental clinic to get her wisdom teeth checked.","example_zh":"我姊姊去當地的牙科診所檢查智齒。"},{"id":504,"word":"clip","pos":"n","meaning":"n. 迴紋針 (v) 夾住；修剪；剪輯","example":"You can use a paper clip to keep all these important documents together.","example_zh":"你可以用迴紋針將所有這些重要文件夾在一起。"},{"id":505,"word":"clone","pos":"n","meaning":"n. 複製的生物 (v) 基因複製","example":"Dolly the sheep was famous for being the first mammal ever to be a clone.","example_zh":"桃莉羊以作為史上第一隻基因複製哺乳動物而聞名。"},{"id":506,"word":"cloth","pos":"n","meaning":"n. 布料","example":"The tailor selected a high-quality wool cloth to make the gentleman's suit.","example_zh":"裁縫挑選了高品質的羊毛布料來製作那位紳士的西裝。"},{"id":507,"word":"clothing","pos":"n","meaning":"n. 衣服，服裝","example":"Please bring enough warm clothing because the temperature drops significantly at night.","example_zh":"請帶夠保暖的衣服，因為夜晚氣溫會大幅下降。"},{"id":508,"word":"clue","pos":"n","meaning":"n. 線索","example":"The police are searching the crime scene for any clue that might lead to the suspect.","example_zh":"警方正在犯罪現場搜尋任何可能導向嫌疑犯的線索。"},{"id":509,"word":"clumsy","pos":"adj","meaning":"adj. 手腳笨拙的","example":"I am so clumsy that I often trip over my own feet or drop things accidentally.","example_zh":"我手腳太笨拙了，經常被自己的腳絆倒或不小心掉東西。"},{"id":510,"word":"coarse","pos":"adj","meaning":"adj. 粗糙的；粗俗的；粗魯的","example":"The wall felt coarse to the touch because it was made of unfinished stone.","example_zh":"這面牆摸起來很粗糙，因為它是用未經加工的石頭做的。"},{"id":511,"word":"coast","pos":"n","meaning":"n. 海岸","example":"We spent the entire weekend driving along the beautiful northern coast of the island.","example_zh":"我們整個週末都在沿著這座島美麗的北海岸開車。"},{"id":512,"word":"coastal","pos":"adj","meaning":"adj. 沿海的，海岸的","example":"The government is planning to build more wind turbines in coastal areas.","example_zh":"政府計畫在沿海地區建造更多風力發電機。"},{"id":513,"word":"cocktail","pos":"n","meaning":"n. 雞尾酒","example":"The waiter served us a colorful fruit cocktail as a welcome drink at the party.","example_zh":"服務生在派對上送上色彩繽紛的水果雞尾酒作為迎賓飲料。"},{"id":514,"word":"coconut","pos":"n","meaning":"n. 椰子","example":"You can find many stalls selling fresh coconut water along the tropical beach.","example_zh":"你可以在熱帶海灘邊找到許多販賣新鮮椰子水的攤位。"},{"id":515,"word":"code","pos":"n","meaning":"n. 代碼；密碼；法典；法規 (v) 編成密碼","example":"The secret agent used a special code to send hidden messages to his headquarters.","example_zh":"特務使用特殊代碼向總部發送隱藏訊息。"},{"id":516,"word":"coincide","pos":"v","meaning":"v. 同時發生，相符，一致(+with)","example":"The school sports day will coincide with the local festival next Saturday.","example_zh":"學校運動會剛好與下週六的當地節慶同時發生。"},{"id":517,"word":"coincidence","pos":"n","meaning":"n. 巧合","example":"It was a strange coincidence that we both wore the exact same shirt today.","example_zh":"我們今天竟然穿了完全一樣的襯衫，真是奇妙的巧合。"},{"id":518,"word":"collapse","pos":"v","meaning":"v. 倒塌；崩潰 (n) 倒塌；（健康）衰竭","example":"The old building began to collapse after the powerful earthquake struck the city.","example_zh":"強震襲擊城市後，這棟舊建築開始倒塌。"},{"id":519,"word":"collar","pos":"n","meaning":"n. 衣領","example":"He loosened his collar and tie because the room was becoming too hot.","example_zh":"因為房間變得太熱，他鬆開了衣領和領帶。"},{"id":520,"word":"collection","pos":"n","meaning":"n. 收集品","example":"My brother has an impressive collection of rare stamps from all over the world.","example_zh":"我哥哥收集了來自世界各地令人印象深刻的稀有郵票。"},{"id":521,"word":"college","pos":"n","meaning":"n. 大學；學院","example":"After graduating from high school, she plans to study art at a famous college.","example_zh":"高中畢業後，她計畫在一所著名的學院學習藝術。"},{"id":522,"word":"colony","pos":"n","meaning":"n. 殖民地；一群","example":"This tropical island used to be a British colony many years ago.","example_zh":"這座熱帶島嶼多年前曾是英國的殖民地。"},{"id":523,"word":"column","pos":"n","meaning":"n. 欄；段；專欄；圓柱","example":"The journalist writes a weekly column about healthy cooking for the newspaper.","example_zh":"這位記者在報紙上寫一個關於健康烹飪的每週專欄。"},{"id":524,"word":"combination","pos":"n","meaning":"n. 結合；組合","example":"The dish is a delicious combination of sweet and spicy flavors.","example_zh":"這道菜是甜味與辣味的美味結合。"},{"id":525,"word":"combine","pos":"v","meaning":"v. 結合","example":"To make a good cake, you need to combine the flour, eggs, and sugar thoroughly.","example_zh":"要做出好吃的蛋糕，你需要將麵粉、雞蛋和糖徹底結合。"},{"id":526,"word":"come to blows","pos":"phr","meaning":"phr. 動武，打架","example":"The argument between the two neighbors quickly managed to come to blows.","example_zh":"兩位鄰居之間的爭論很快就演變成了打架。"},{"id":527,"word":"come up with","pos":"phr","meaning":"phr. 想出，提出（計畫）","example":"We need to come up with a creative idea for our group project by tomorrow.","example_zh":"我們明天前需要想出一個創意點子作為小組計畫之用。"},{"id":528,"word":"come upon","pos":"phr","meaning":"phr. 偶遇","example":"While walking through the park, I happened to come upon an old friend from junior high.","example_zh":"在公園散步時，我碰巧偶遇一位國中老朋友。"},{"id":529,"word":"comedy","pos":"n","meaning":"n. 喜劇","example":"The audience laughed throughout the entire comedy because it was so funny.","example_zh":"觀眾在整部喜劇中笑個不停，因為它實在太有趣了。"},{"id":530,"word":"comfort","pos":"v","meaning":"v. 安慰 (n) 安慰；舒適；安逸","example":"The mother tried to comfort her crying child after he fell off his bicycle.","example_zh":"孩子從腳踏車上摔下來後，母親試圖安慰大哭的他。"},{"id":531,"word":"comic","pos":"adj","meaning":"adj. 滑稽逗趣的；喜劇的 (n) 漫畫","example":"Many teenagers enjoy reading comic books about superheroes and their adventures.","example_zh":"許多青少年喜歡閱讀關於超級英雄及其冒險的漫畫書。"},{"id":532,"word":"comma","pos":"n","meaning":"n. 逗號","example":"You should place a comma after the introductory phrase in your sentence.","example_zh":"你應該在句中的引導短語後加上一個逗號。"}]},
{"unit":5,"unit_label":"p.9-10","words":[{"id":533,"word":"command","pos":"v","meaning":"v. 命令；指揮；統率 (n) 命令；掌握；運用能力","example":"The general was able to command his troops with great confidence and skill.","example_zh":"將軍能夠以極大的信心和技巧指揮他的部隊。"},{"id":534,"word":"commander","pos":"n","meaning":"n. 指揮官","example":"The commander ordered the soldiers to return to the base immediately.","example_zh":"指揮官命令士兵立即返回基地。"},{"id":535,"word":"comment","pos":"n","meaning":"n. 評論；批評 (v) 評論","example":"Please feel free to leave a comment if you have any questions about the video.","example_zh":"如果你對這段影片有任何疑問，請隨時留下評論。"},{"id":536,"word":"commerce","pos":"n","meaning":"n. 商業；貿易","example":"The internet has completely transformed the world of international commerce.","example_zh":"網路完全改變了國際貿易的世界。"},{"id":537,"word":"commercial","pos":"adj","meaning":"adj. 商業的 (n) 商業廣告","example":"I find it annoying when a long commercial interrupts my favorite TV show.","example_zh":"當長長的商業廣告打斷我最愛的電視節目時，我覺得很煩。"},{"id":538,"word":"commit","pos":"v","meaning":"v. 犯罪；做錯事；承諾；使負責任","example":"It is a serious crime to commit robbery or any form of physical violence.","example_zh":"犯下搶劫或任何形式的肢體暴力都是嚴重的罪行。"},{"id":539,"word":"commitment","pos":"n","meaning":"n. 奉獻，允諾","example":"Success in learning a piano requires a lot of time and long-term commitment.","example_zh":"成功學習鋼琴需要大量的時間和長期的奉獻。"},{"id":540,"word":"committed","pos":"adj","meaning":"adj. 熱心奉獻的，投入的","example":"She is a committed volunteer who spends every weekend helping at the animal shelter.","example_zh":"她是一位熱心奉獻的志工，每個週末都去動物收容所幫忙。"},{"id":541,"word":"committee","pos":"n","meaning":"n. 委員會","example":"The student committee met yesterday to discuss the plans for the school festival.","example_zh":"學生委員會昨天開會討論學校慶典的計畫。"},{"id":542,"word":"communicate","pos":"v","meaning":"v. 溝通；傳播","example":"Modern technology allows us to communicate with people around the world instantly.","example_zh":"現代科技讓我們能與全世界的人立即溝通。"},{"id":543,"word":"communication","pos":"n","meaning":"n. 溝通；通訊；消息","example":"Good communication is essential for maintaining a healthy relationship with others.","example_zh":"良好的溝通對於與他人維持健康關係至關重要。"},{"id":544,"word":"communicative","pos":"adj","meaning":"adj. 健談的","example":"The new student is very communicative and easily made many friends on her first day.","example_zh":"那位新學生非常健談，在第一天就輕鬆交到了許多朋友。"},{"id":545,"word":"community","pos":"n","meaning":"n. 社區","example":"The local community organized a clean-up event to keep the park beautiful.","example_zh":"當地社區組織了一次清理活動以保持公園的美麗。"},{"id":546,"word":"companion","pos":"n","meaning":"n. 同伴","example":"My dog is a wonderful companion who always follows me whenever I go for a walk.","example_zh":"我的狗是個極佳的同伴，每當我去散步時牠總是跟著我。"},{"id":547,"word":"compare","pos":"v","meaning":"v. 比較","example":"If you compare these two smartphones, you will see that this one has a better camera.","example_zh":"如果你比較這兩款智慧型手機，你會發現這一款的相機更好。"},{"id":548,"word":"comparison","pos":"n","meaning":"n. 比較；對照","example":"In comparison with last year, the company's profits have increased by twenty percent.","example_zh":"與去年相比，公司的利潤增長了百分之二十。"},{"id":549,"word":"compassion","pos":"n","meaning":"n. 同情，憐憫","example":"We should show compassion toward those who are going through difficult times.","example_zh":"我們應該對那些正在經歷困難時期的人展現同情。"},{"id":550,"word":"compassionate","pos":"adj","meaning":"adj. 充滿同情的","example":"The nurse was very compassionate and spent extra time talking to the lonely patients.","example_zh":"那位護士非常充滿同情心，花了額外的時間與孤獨的病人聊天。"},{"id":551,"word":"compete","pos":"v","meaning":"v. 競爭","example":"Many companies compete with each other to attract more customers to their stores.","example_zh":"許多公司互相競爭，以吸引更多顧客到他們的店裡。"},{"id":552,"word":"competition","pos":"n","meaning":"n. 競爭；競賽","example":"The singing competition will be held in the school hall next Friday afternoon.","example_zh":"歌唱競賽將於下週五下午在學校禮堂舉行。"},{"id":553,"word":"competitive","pos":"adj","meaning":"adj. 競爭的；有競爭力的","example":"To survive in the competitive job market, you need to keep learning new skills.","example_zh":"為了在競爭激烈的就業市場生存，你需要不斷學習新技能。"},{"id":554,"word":"competitor","pos":"n","meaning":"n. 競爭者；對手","example":"He shook hands with his competitor after the tennis match as a sign of respect.","example_zh":"網球賽後，他與對手握手以示尊重。"},{"id":555,"word":"complain","pos":"v","meaning":"v. 抱怨","example":"Many passengers began to complain about the long delay of the international flight.","example_zh":"許多乘客開始抱怨國際航班的長時間延誤。"},{"id":556,"word":"complaint","pos":"n","meaning":"n. 抱怨；申訴","example":"The customer filed a formal complaint after receiving the damaged product.","example_zh":"顧客在收到受損產品後提出了正式申訴。"},{"id":557,"word":"complex","pos":"adj","meaning":"adj. 複雜的 (n) 情結","example":"The human brain is a complex organ that controls everything we think and do.","example_zh":"人類大腦是一個複雜的器官，控制著我們所想所做的一切。"},{"id":558,"word":"complexion","pos":"n","meaning":"n. 氣色","example":"Her healthy complexion shows that she eats well and gets plenty of sleep.","example_zh":"她健康的氣色顯示她飲食良好且睡眠充足。"},{"id":559,"word":"complexities","pos":"n","meaning":"n. 複雜的事物","example":"The manager has to deal with the complexities of running a large international company.","example_zh":"經理必須處理經營一家大型國際公司的複雜事物。"},{"id":560,"word":"complexity","pos":"n","meaning":"n. 複雜","example":"The complexity of the math problem was so high that no one could solve it.","example_zh":"那道數學題的複雜程度非常高，沒人能解出來。"},{"id":561,"word":"complicate","pos":"v","meaning":"v. 使複雜；使麻煩；病情惡化；併發","example":"Don't try to explain everything at once, or you will only complicate the situation.","example_zh":"不要試圖一次解釋所有事情，否則你只會使情況變得更複雜。"},{"id":562,"word":"compliment","pos":"n/v","meaning":"n/v. 稱讚","example":"I would like to pay you a compliment on your excellent performance tonight.","example_zh":"我想就你今晚優異的表現對你表示稱讚。"},{"id":563,"word":"complimentary","pos":"adj","meaning":"adj. 讚美的，贈送的","example":"The hotel offers a complimentary breakfast and free Wi-Fi for all its guests.","example_zh":"這家飯店為所有客人提供免費早餐和免費無線網路。"},{"id":564,"word":"component","pos":"n","meaning":"n. 零件 (adj) 組成的","example":"The motherboard is a vital component of any modern computer system.","example_zh":"主機板是任何現代電腦系統中至關重要的零件。"},{"id":565,"word":"compose","pos":"v","meaning":"v. 創作；組成","example":"It took the artist several months to compose the music for the new film.","example_zh":"藝術家花了幾個月的時間為這部新電影創作音樂。"},{"id":566,"word":"composer","pos":"n","meaning":"n. 作曲家","example":"Ludwig van Beethoven is one of the most famous composers in the history of music.","example_zh":"路德維希·范·貝多芬是音樂史上最著名的作曲家之一。"},{"id":567,"word":"composition","pos":"n","meaning":"n. 作文；作曲；結構；組成","example":"The teacher asked the students to write a short composition about their summer vacation.","example_zh":"老師要求學生寫一篇關於暑假的短作文。"},{"id":568,"word":"compromise","pos":"v/n","meaning":"v/n. 妥協，損害","example":"In a marriage, both partners often have to compromise to maintain a happy relationship.","example_zh":"在婚姻中，雙方通常必須妥協以維持幸福的關係。"},{"id":569,"word":"compute","pos":"v","meaning":"v. 計算","example":"The computer can compute millions of mathematical operations in a split second.","example_zh":"電腦可以在不到一秒的時間內計算數百萬個數學運算。"},{"id":570,"word":"concentrate","pos":"v","meaning":"v. 集中","example":"You need to concentrate on your studies if you want to get good grades.","example_zh":"如果你想拿到好成績，你需要集中精神在學業上。"},{"id":571,"word":"concentration","pos":"n","meaning":"n. 注意力；集中","example":"The loud noise from the construction site made it difficult to maintain my concentration.","example_zh":"建築工地的巨大噪音使我很難保持注意力。"},{"id":572,"word":"concept","pos":"n","meaning":"n. 觀念；概念","example":"The concept of time travel is a popular theme in many science fiction movies.","example_zh":"時間旅行的概念是許多科幻電影中受歡迎的主題。"},{"id":573,"word":"concern","pos":"v","meaning":"v. 涉及；關心到；使擔心；使不安 (n) 憂慮；關切；擔心（的事）","example":"The current increase in housing prices is a major concern for young people.","example_zh":"目前房價的上漲是年輕人的一大憂慮。"},{"id":574,"word":"concerned","pos":"adj","meaning":"adj. 關心的/ 擔憂的","example":"The parents were very concerned about their daughter's health after she caught a cold.","example_zh":"父母在女兒感冒後非常擔憂她的健康。"},{"id":575,"word":"concerning","pos":"prep","meaning":"prep. 關於","example":"The manager will hold a meeting concerning the new safety regulations next week.","example_zh":"經理下週將召開一個關於新安全法規的會議。"},{"id":576,"word":"concert","pos":"n","meaning":"n. 音樂會","example":"We are going to a rock concert at the national stadium this Sunday evening.","example_zh":"我們這週日晚上要去國家體育場參加一場搖滾音樂會。"},{"id":577,"word":"conclude","pos":"v","meaning":"v. 結束；下結論","example":"The scientist was able to conclude from the data that the experiment was a success.","example_zh":"科學家能夠從數據中下結論，認為該實驗是成功的。"},{"id":578,"word":"conclusion","pos":"n","meaning":"n. 結論","example":"I have come to the conclusion that we need to find a more efficient way to work.","example_zh":"我得出了結論，我們需要找到一種更有效率的工作方式。"},{"id":579,"word":"concrete","pos":"adj","meaning":"adj. 具體的 (n) 混凝土","example":"Please give me some concrete examples so that I can understand your point better.","example_zh":"請給我一些具體的例子，以便我能更好地理解你的觀點。"},{"id":580,"word":"condition","pos":"n","meaning":"n. 狀況；條件","example":"The old car is still in good condition even though it was made twenty years ago.","example_zh":"這輛舊車即使是二十年前製造的，狀況依然良好。"},{"id":581,"word":"conditional","pos":"adj","meaning":"adj. 附帶條件的","example":"The job offer is conditional on passing a medical examination and a background check.","example_zh":"這份工作邀約是附帶條件的，必須通過體檢和背景調查。"},{"id":582,"word":"conduct","pos":"v","meaning":"v. 進行，執行 (n) 行為，表現","example":"The research team decided to conduct a survey to find out what customers want.","example_zh":"研究團隊決定進行一項調查，以找出顧客的需求。"},{"id":583,"word":"conductor","pos":"n","meaning":"n. 指揮家；導體","example":"Copper is an excellent conductor of electricity, so it is often used in wires.","example_zh":"銅是極佳的導體，因此常用於電線中。"},{"id":584,"word":"cone","pos":"n","meaning":"n. 圓錐體；圓錐筒","example":"The children enjoyed eating their ice cream in a crunchy waffle cone.","example_zh":"孩子們喜歡吃裝在脆皮甜筒裡的冰淇淋。"},{"id":585,"word":"conference","pos":"n","meaning":"n. 會議","example":"Experts from all over the world will attend the international conference on climate change.","example_zh":"來自世界各地的專家將參加關於氣候變遷的國際會議。"},{"id":586,"word":"confess","pos":"v","meaning":"v. 坦白；承認；懺悔；告解","example":"The suspect finally decided to confess to his crimes after hours of questioning.","example_zh":"嫌犯在數小時的質詢後，終於決定坦白他的罪行。"},{"id":587,"word":"confidence","pos":"n","meaning":"n. 信心；信任","example":"The speaker's powerful voice and clear message gave the audience a lot of confidence.","example_zh":"演講者有力的聲音和清晰的信息給了觀眾很大的信心。"},{"id":588,"word":"confident","pos":"adj","meaning":"adj. 有信心的，有自信的","example":"She is confident that she will pass the driving test on her first attempt.","example_zh":"她有信心第一次嘗試就能通過駕照考試。"},{"id":589,"word":"confine","pos":"v","meaning":"v. 限制；監禁；使臥病","example":"The sick man was forced to confine himself to bed until he fully recovered.","example_zh":"那名病人被迫臥病在床，直到他完全康復。"},{"id":590,"word":"conflict","pos":"v/n","meaning":"v/n. 衝突，爭執","example":"There is a conflict between his personal beliefs and the requirements of his job.","example_zh":"他的個人信仰與工作要求之間存在衝突。"},{"id":591,"word":"confront","pos":"v","meaning":"v. 面對；遭遇","example":"You must be brave enough to confront the difficulties in your life.","example_zh":"你必須夠勇敢去面對生活中的困難。"},{"id":592,"word":"confuse","pos":"v","meaning":"v. 使迷惑；混淆","example":"The complex instructions on the box only managed to confuse the users more.","example_zh":"盒子上的複雜說明只會讓使用者感到更加迷惑。"},{"id":593,"word":"confused","pos":"adj","meaning":"adj. （人）感到困惑的","example":"I was completely confused by the map and ended up getting lost in the city.","example_zh":"我完全被地圖搞困惑了，最後在城市裡迷路了。"},{"id":594,"word":"confusing","pos":"adj","meaning":"adj. 令人困惑的","example":"The traffic signs in this area are very confusing and lead to many accidents.","example_zh":"這個地區的交通標誌非常令人困惑，導致了許多事故。"},{"id":595,"word":"confusion","pos":"n","meaning":"n. 混亂；紊亂","example":"There was a lot of confusion at the airport after several flights were canceled.","example_zh":"在幾架航班被取消後，機場陷入了一片混亂。"},{"id":596,"word":"congratulate","pos":"v","meaning":"v. 恭喜；道賀","example":"I would like to congratulate you on winning the first prize in the speech contest.","example_zh":"我想恭喜你獲得演講比賽的第一名。"},{"id":597,"word":"congress","pos":"n","meaning":"n. 代表大會；會議；美國國會（大寫）","example":"The U.S. Congress is responsible for making laws and managing the country's budget.","example_zh":"美國國會負責制定法律並管理國家預算。"},{"id":598,"word":"conjunction","pos":"n","meaning":"n. 連接詞","example":"A conjunction like \"and\" or \"but\" is used to connect words or phrases in a sentence.","example_zh":"像 \"and\" 或 \"but\" 這樣的連接詞是用來連接句子中的單字或短語。"},{"id":599,"word":"connect","pos":"v","meaning":"v. 連結；有關聯；聯想","example":"This new bridge will connect the two islands and make travel much easier.","example_zh":"這座新橋將連結這兩座島嶼，使交通變得更容易。"},{"id":600,"word":"connection","pos":"n","meaning":"n. 連接；連線","example":"You need to have a stable internet connection to join the online meeting.","example_zh":"你需要有穩定的網路連線才能加入線上會議。"},{"id":601,"word":"conquer","pos":"v","meaning":"v. 克服；征服","example":"He worked hard for many years to finally conquer his fear of heights.","example_zh":"他努力工作多年，終於克服了對高度的恐懼。"},{"id":602,"word":"conquest","pos":"n","meaning":"n. 克服，佔領，征服","example":"The history of the region was changed forever by the conquest of the neighboring kingdom.","example_zh":"該區域的歷史因為鄰國的征服而永遠改變。"},{"id":603,"word":"conscience","pos":"n","meaning":"n. 良心","example":"Her conscience would not allow her to lie about what she had seen.","example_zh":"她的良心不允許她對自己所見之事撒謊。"},{"id":604,"word":"conscious","pos":"adj","meaning":"adj. 有意識的；意識到的","example":"He was conscious of someone watching him while he was reading in the library.","example_zh":"他意識到自己在圖書館閱讀時有人在看他。"},{"id":605,"word":"consciousness","pos":"n","meaning":"n. 意識，知覺；覺悟，自覺","example":"The patient slowly regained consciousness after the successful surgery.","example_zh":"病人在成功手術後慢慢恢復了意識。"},{"id":606,"word":"consequence","pos":"n","meaning":"n. 影響；結果","example":"You must be prepared to face the consequence of your actions.","example_zh":"你必須準備好面對自己行為的後果。"},{"id":607,"word":"consequent","pos":"adj","meaning":"adj. 由～而起的","example":"The rise in prices and the consequent decline in sales worried the store owner.","example_zh":"物價上漲以及隨之而來的銷量下降讓店主感到擔憂。"},{"id":608,"word":"consequently","pos":"adv","meaning":"adv. 因此，結果","example":"It started raining heavily; consequently, the outdoor event was canceled.","example_zh":"開始下起大雨；因此，戶外活動被取消了。"},{"id":609,"word":"conservation","pos":"n","meaning":"n. 保護、保存","example":"Water conservation is important to ensure that we have enough clean water for the future.","example_zh":"節約用水對於確保我們未來有足夠的乾淨水源非常重要。"},{"id":610,"word":"conservative","pos":"adj","meaning":"adj. 保守的；守舊的","example":"My grandfather has very conservative views on technology and prefers to use a paper calendar.","example_zh":"我祖父對科技抱持非常保守的觀點，更喜歡使用紙本月曆。"},{"id":611,"word":"conserve","pos":"vt","meaning":"vt. 保護，保存","example":"We should try our best to conserve energy by turning off the lights when leaving a room.","example_zh":"我們應該盡力透過離開房間時隨手關燈來節省能源。"},{"id":612,"word":"consider","pos":"v","meaning":"v. 認為；考慮","example":"Please consider my proposal carefully before you make your final decision.","example_zh":"在你做出最終決定前，請仔細考慮我的提案。"},{"id":613,"word":"considerable","pos":"adj","meaning":"adj. 相當大的","example":"The company has spent a considerable amount of money on research and development.","example_zh":"公司在研發上花費了相當大的金額。"},{"id":614,"word":"considerably","pos":"adv","meaning":"adv. 相當多地，非常","example":"The situation has improved considerably since the new management took over.","example_zh":"自從新管理層接手後，情況改善了相當多。"},{"id":615,"word":"consideration","pos":"n","meaning":"n. 考慮；體貼；關心","example":"Please give some consideration to the needs of other people in the office.","example_zh":"請多體貼辦公室裡其他人的需求。"},{"id":616,"word":"consist","pos":"v","meaning":"v. 由～組成；在於","example":"The diet consists of fruits, vegetables, and lean meat.","example_zh":"這份飲食由水果、蔬菜和瘦肉組成。"},{"id":617,"word":"consist of","pos":"phr","meaning":"phr. 由～組成","example":"The committee consists of five members from different departments.","example_zh":"這個委員會由來自不同部門的五名成員組成。"},{"id":618,"word":"consistent","pos":"adj","meaning":"adj. 一貫的；一致的","example":"You should be consistent in your training if you want to improve your fitness.","example_zh":"如果你想增進體能，訓練必須持之以恆。"},{"id":619,"word":"consonant","pos":"n","meaning":"n. 子音","example":"In English, the letters B, C, D, and F are all examples of a consonant.","example_zh":"在英文中，字母 B、C、D 和 F 都是子音的例子。"},{"id":620,"word":"constant","pos":"adj","meaning":"adj. 不斷的；始終如一的","example":"He was under constant pressure to finish the project before the deadline.","example_zh":"他承受著不斷的壓力，必須在截止日期前完成專案。"},{"id":621,"word":"constantly","pos":"adv","meaning":"adv. 不斷地，始終","example":"The baby is constantly crying, which makes it hard for the parents to sleep.","example_zh":"嬰兒不斷地哭泣，這使得父母很難入睡。"},{"id":622,"word":"constitute","pos":"v","meaning":"v. 構成；組成","example":"What constitutes a healthy lifestyle? It includes diet, exercise, and sleep.","example_zh":"什麼構成了健康的生活方式？它包含飲食、運動和睡眠。"},{"id":623,"word":"constitution","pos":"n","meaning":"n. 組成；結構；憲法","example":"The constitution of the country guarantees freedom of speech for all citizens.","example_zh":"該國的憲法保障所有公民的言論自由。"},{"id":624,"word":"construct","pos":"v","meaning":"v. 建造；構造","example":"They are going to construct a new bridge across the river next year.","example_zh":"他們明年將在河上建造一座新橋。"},{"id":625,"word":"construction","pos":"n","meaning":"n. 建造；營造","example":"Due to the construction of the new subway line, the road will be closed for a month.","example_zh":"由於新捷運線的建造，這條路將封閉一個月。"},{"id":626,"word":"constructive","pos":"adj","meaning":"adj. 建設性的；有助益的","example":"The teacher gave some constructive feedback to help the student improve his writing.","example_zh":"老師給了一些建設性的回饋，以幫助學生改進寫作。"},{"id":627,"word":"consult","pos":"v","meaning":"v. 請教；諮詢","example":"If you feel sick, you should consult a doctor as soon as possible.","example_zh":"如果你覺得身體不適，應盡快請教醫生。"},{"id":628,"word":"consultant","pos":"n","meaning":"n. 顧問","example":"The company hired a marketing consultant to help them attract more customers.","example_zh":"公司聘請了一位行銷顧問來幫助他們吸引更多客戶。"},{"id":629,"word":"consume","pos":"v","meaning":"v. 消耗；花費；吃光","example":"The new laptop consumes less power, which makes the battery last longer.","example_zh":"這台新筆電消耗較少的電力，使得電池續航力更久。"},{"id":630,"word":"consumer","pos":"n","meaning":"n. 消費者","example":"Consumers are becoming more concerned about the quality of the products they buy.","example_zh":"消費者們越來越關心他們所購買產品的品質。"},{"id":631,"word":"consumption","pos":"n","meaning":"n. 消耗；用盡；消耗量","example":"The high consumption of sugar can lead to various health problems.","example_zh":"高糖份的消耗量會導致各種健康問題。"},{"id":632,"word":"contact","pos":"v/n","meaning":"v/n. 聯繫，聯絡","example":"Please keep in contact with us if you need any further information.","example_zh":"如果你需要任何進一步資訊，請與我們保持聯繫。"},{"id":633,"word":"contain","pos":"v","meaning":"v. 含有，裝有","example":"This glass bottle contains a special kind of mineral water.","example_zh":"這個玻璃瓶裝有一種特殊的礦泉水。"},{"id":634,"word":"container","pos":"n","meaning":"n. 容器；貨櫃","example":"Please put the leftovers in a plastic container and store them in the fridge.","example_zh":"請將剩菜裝在塑膠容器中並放入冰箱儲存。"},{"id":635,"word":"contemporary","pos":"adj","meaning":"adj. 當代的(n) 同時代的人","example":"She is interested in contemporary art and often visits local galleries.","example_zh":"她對當代藝術很感興趣，常參觀當地的藝廊。"},{"id":636,"word":"content","pos":"adj","meaning":"adj. 滿足的；滿意的 (v) 使滿足 (n) 滿意；知足；內容","example":"He is content with his simple life and does not desire more money.","example_zh":"他對自己簡單的生活感到滿足，並不渴望更多錢。"},{"id":637,"word":"contentment","pos":"n","meaning":"n. 高興；滿意","example":"True contentment comes from within, not from material possessions.","example_zh":"真正的滿足來自內心，而非物質財產。"},{"id":638,"word":"contents","pos":"n","meaning":"n. 容納的東西；目錄","example":"Please check the table of contents to find the page number for each chapter.","example_zh":"請查看目錄以找到每一章的頁碼。"},{"id":639,"word":"contest","pos":"n","meaning":"n. 競爭；比賽 (v) 競爭","example":"Many people signed up for the singing contest hoping to win the prize.","example_zh":"許多人報名參加歌唱比賽，希望能贏得獎品。"},{"id":640,"word":"contestant","pos":"n","meaning":"n. 參賽者，競爭者","example":"Each contestant has two minutes to perform on the stage.","example_zh":"每位參賽者有兩分鐘的時間在舞台上表演。"},{"id":641,"word":"context","pos":"n","meaning":"n. 上下文","example":"It is easier to understand the meaning of a new word by looking at its context.","example_zh":"透過查看上下文，更容易理解一個新單字的意思。"},{"id":642,"word":"continent","pos":"n","meaning":"n. 洲；大陸","example":"Asia is the largest continent in the world by both area and population.","example_zh":"亞洲是世界上面積與人口最大的洲。"},{"id":643,"word":"continental","pos":"adj","meaning":"adj. 大陸的","example":"The company is expanding its operations in several continental European countries.","example_zh":"公司正在擴展其在幾個歐洲大陸國家的業務。"},{"id":644,"word":"continual","pos":"adj","meaning":"adj. 頻頻的，一再發生的","example":"The continual noise from the street outside makes it hard to focus on work.","example_zh":"街上傳來頻頻的噪音使得工作很難集中精神。"},{"id":645,"word":"continue","pos":"v","meaning":"v. 持續，繼續","example":"Even after his failure, he decided to continue with his plan to build a new business.","example_zh":"即便失敗後，他仍決定繼續他建立新事業的計畫。"},{"id":646,"word":"continuous","pos":"adj","meaning":"adj. 連續的；不斷的","example":"The rain has been continuous since early this morning, causing many roads to flood.","example_zh":"自今天清晨以來，雨一直連續地下，導致許多道路淹水。"},{"id":647,"word":"contract","pos":"n","meaning":"n. 契約；合同 (v) 訂契約","example":"Both parties signed a contract to ensure that the work will be completed on time.","example_zh":"雙方簽署了一份契約，以確保工作能如期完成。"},{"id":648,"word":"contrary","pos":"adj","meaning":"adj. 相反的；反對的 (n) 相反","example":"On the contrary, I actually enjoyed the movie and found it quite interesting.","example_zh":"相反地，我其實很喜歡那部電影，並覺得它相當有趣。"},{"id":649,"word":"contrast","pos":"n","meaning":"n. 對比；對照 (v) 對比；對照","example":"There is a sharp contrast between the bright city lights and the dark night sky.","example_zh":"明亮的城市燈光與黑暗的夜空之間有著鮮明的對比。"},{"id":650,"word":"contribute","pos":"v","meaning":"v. 捐助；捐獻；貢獻","example":"Many people contribute to charity every year to help those in need.","example_zh":"許多人每年都捐助慈善機構以幫助有需要的人。"},{"id":651,"word":"contribution","pos":"n","meaning":"n. 貢獻；捐助","example":"His contribution to the field of medicine has saved many lives.","example_zh":"他對醫學領域的貢獻拯救了許多生命。"},{"id":652,"word":"control","pos":"v/n","meaning":"v/n. 操控，控制","example":"You should learn how to control your temper when you feel angry.","example_zh":"當你感到生氣時，你應該學會如何控制自己的脾氣。"},{"id":653,"word":"convenience","pos":"n","meaning":"n. 方便；便利（的設施）","example":"The convenience of online shopping makes it easy to buy things from home.","example_zh":"線上購物的便利性使得在家購物變得很容易。"},{"id":654,"word":"convention","pos":"n","meaning":"n. 大會；會議；習俗","example":"Breaking social convention, she decided to wear a casual dress to the formal party.","example_zh":"她打破社交習俗，決定穿著便服參加正式派對。"},{"id":655,"word":"conventional","pos":"adj","meaning":"adj. 傳統的；慣例的","example":"He prefers a conventional way of teaching rather than using new technologies.","example_zh":"他偏好傳統的教學方式，而非使用新科技。"},{"id":656,"word":"converse","pos":"v","meaning":"v. 交談","example":"It was nice to sit down and converse with my old neighbor about his travels.","example_zh":"能坐下來與我的老鄰居交談關於他的旅行，感覺真好。"},{"id":657,"word":"convert","pos":"v","meaning":"v. 轉換，轉變","example":"You can convert this file into a PDF document for easier sharing.","example_zh":"你可以將此檔案轉換為 PDF 文件以利分享。"},{"id":658,"word":"convey","pos":"v","meaning":"v. 傳達；表達；輸送","example":"The artist used colors and shapes to convey the emotions of the scene.","example_zh":"藝術家使用顏色與形狀來傳達場景的情緒。"},{"id":659,"word":"convict","pos":"n/v","meaning":"n/v. 囚犯，宣布有罪","example":"The court decided to convict the man after hearing all the evidence.","example_zh":"在聽取所有證據後，法庭決定宣布那個人有罪。"},{"id":660,"word":"convince","pos":"v","meaning":"v. 使相信；說服","example":"I tried to convince my parents to let me go on the school trip.","example_zh":"我試圖說服父母讓我參加學校旅遊。"},{"id":661,"word":"convincing","pos":"adj","meaning":"adj. 有說服力的","example":"He gave a very convincing argument for why we should adopt the new plan.","example_zh":"他對我們為什麼應該採取新計畫給出了一個非常有說服力的論點。"},{"id":662,"word":"cooperate","pos":"v","meaning":"v. 合作","example":"If we all cooperate, we can finish this big task in much less time.","example_zh":"如果我們都合作，我們就能以更短的時間完成這項大任務。"},{"id":663,"word":"cooperation","pos":"n","meaning":"n. 合作","example":"The success of the project was due to the close cooperation between the two departments.","example_zh":"專案的成功歸功於兩個部門之間的緊密合作。"},{"id":664,"word":"cooperative","pos":"adj","meaning":"adj. 合作的；協力的","example":"She is a very cooperative team member who is always ready to help others.","example_zh":"她是一位非常樂於合作的團隊成員，總是準備好幫助他人。"},{"id":665,"word":"cope","pos":"v","meaning":"v. 應付；處理","example":"It is hard to cope with the pressure when you have too much work to do.","example_zh":"當你有太多工作要做時，是很難應付壓力的。"},{"id":666,"word":"copper","pos":"n","meaning":"n. 銅","example":"The old coins were made of copper and had turned green over time.","example_zh":"那些舊硬幣由銅製成，隨著時間推移變成了綠色。"},{"id":667,"word":"cord","pos":"n","meaning":"n. 繩；索","example":"Please tie the package securely with a strong cord before you ship it.","example_zh":"在寄送前，請用堅固的繩子將包裹綁緊。"}]},
{"unit":6,"unit_label":"p.11-12","words":[{"id":668,"word":"cork","pos":"n","meaning":"n. 軟木塞 (v) 用軟木塞塞緊","example":"He used a cork to seal the bottle of wine tightly.","example_zh":"他用軟木塞將葡萄酒瓶緊緊塞住。"},{"id":669,"word":"correspond","pos":"v","meaning":"v. 一致；符合；通信","example":"His actions do not correspond with what he told us earlier.","example_zh":"他的行為與他之前告訴我們的並不一致。"},{"id":670,"word":"costume","pos":"n","meaning":"n. 服裝","example":"The children wore a colorful costume for the school Halloween parade.","example_zh":"孩子們穿著色彩鮮豔的服裝參加學校的萬聖節遊行。"},{"id":671,"word":"cottage","pos":"n","meaning":"n. 小屋","example":"We spent a quiet weekend in a small stone cottage by the sea.","example_zh":"我們在海邊的一間石頭小屋裡度過了一個安靜的週末。"},{"id":672,"word":"couch","pos":"n","meaning":"n. 長沙發","example":"We bought a new, comfortable couch for the living room.","example_zh":"我們為客廳買了一張新的、舒適的長沙發。"},{"id":673,"word":"cough","pos":"v","meaning":"v. (n) 咳嗽","example":"She had a bad cough, so she went to see a doctor for some medicine.","example_zh":"她咳嗽得很厲害，所以去看醫生拿藥。"},{"id":674,"word":"council","pos":"n","meaning":"n. 會議；委員會","example":"The city council met to discuss the plans for building a new park.","example_zh":"市議會開會討論了建造新公園的計畫。"},{"id":675,"word":"countable","pos":"adj","meaning":"adj. 可數的","example":"In English grammar, \"cat\" is a countable noun, but \"water\" is not.","example_zh":"在英文文法中，\"cat\" 是可數名詞，但 \"water\" 不是。"},{"id":676,"word":"counter","pos":"n","meaning":"n. 櫃臺","example":"The cashier stood behind the counter to help customers with their purchases.","example_zh":"收銀員站在櫃臺後幫助顧客結帳。"},{"id":677,"word":"courage","pos":"n","meaning":"n. 勇氣","example":"It takes a lot of courage to speak in front of a large audience.","example_zh":"在大群觀眾面前演講需要很大的勇氣。"},{"id":678,"word":"courageous","pos":"adj","meaning":"adj. 無畏的；有勇氣的","example":"The courageous firefighter ran into the burning building to save the trapped puppy.","example_zh":"那位無畏的消防員跑進燃燒的建築物救出了受困的小狗。"},{"id":679,"word":"courteous","pos":"adj","meaning":"adj. 有禮貌的；謙恭的","example":"Please be courteous to others by waiting in line patiently.","example_zh":"請透過耐心地排隊來對他人展現禮貌。"},{"id":680,"word":"courtesy","pos":"n","meaning":"n. 禮貌；殷勤","example":"It is a common courtesy to say thank you when someone helps you.","example_zh":"當某人幫助你時說聲謝謝是一種基本的禮貌。"},{"id":681,"word":"coward","pos":"n","meaning":"n. 膽小鬼；懦夫","example":"He was too much of a coward to tell his friend the truth.","example_zh":"他太膽小了，不敢告訴朋友真相。"},{"id":682,"word":"cozy","pos":"adj","meaning":"adj. 溫暖的；舒適的","example":"The hotel room was small but very cozy, with a warm blanket and soft lights.","example_zh":"飯店房間很小但很舒適，有溫暖的毛毯和柔和的燈光。"},{"id":683,"word":"crack","pos":"v","meaning":"v. 使破裂；裂開 (n) 裂縫","example":"The heavy stone caused the ice to crack when we walked on it.","example_zh":"當我們走在冰上時，沉重的石頭導致冰層裂開。"},{"id":684,"word":"cradle","pos":"n","meaning":"n. 搖籃 (v) （放在懷中）搖","example":"The mother rocked the baby gently in the cradle until he fell asleep.","example_zh":"母親在搖籃裡輕輕搖著嬰兒，直到他睡著。"},{"id":685,"word":"craft","pos":"n","meaning":"n. 手藝；技術；船；飛機；太空船","example":"The ancient ship was a magnificent craft that could travel long distances across the ocean.","example_zh":"那艘古代船是一艘能橫跨海洋長距離航行的宏偉船隻。"},{"id":686,"word":"cram","pos":"v","meaning":"v. 塞入；填滿；硬記死背","example":"He had to cram all the information for the history test in just one night.","example_zh":"他必須在一個晚上內硬記下歷史考試的所有資訊。"},{"id":687,"word":"crash","pos":"v","meaning":"v. 碰撞；墜毀；當機 (n) 相撞；墜毀；當機","example":"The accident happened when two cars managed to crash into each other at the intersection.","example_zh":"這起事故發生在兩輛車在十字路口碰撞時。"},{"id":688,"word":"crawl","pos":"v","meaning":"v. 爬行；緩慢移動","example":"The small baby began to crawl across the floor to reach for his toy.","example_zh":"小嬰兒開始在地上爬行以拿到他的玩具。"},{"id":689,"word":"create","pos":"v","meaning":"v. 創造","example":"Everyone has the potential to create something beautiful in their own way.","example_zh":"每個人都有潛力以自己的方式創造出美麗的事物。"},{"id":690,"word":"creation","pos":"n","meaning":"n. 創造；創造物；作品","example":"The universe is a wonderful creation that continues to amaze scientists.","example_zh":"宇宙是一個讓科學家不斷感到驚嘆的美妙創造物。"},{"id":691,"word":"creative","pos":"adj","meaning":"adj. 有創造力的；獨創的","example":"She is a creative artist who always finds new ways to paint the same scene.","example_zh":"她是一位有創造力的藝術家，總能找到新方法來繪畫同一個場景。"},{"id":692,"word":"creativity","pos":"n","meaning":"n. 創造力","example":"The project gave the students an opportunity to express their creativity.","example_zh":"這個專案給了學生們表達他們創造力的機會。"},{"id":693,"word":"creator","pos":"n","meaning":"n. 創作者；創造者","example":"The young painter is considered one of the greatest creators of modern abstract art.","example_zh":"這位年輕畫家被認為是現代抽象藝術最偉大的創作者之一。"},{"id":694,"word":"creature","pos":"n","meaning":"n. 生物；人","example":"There are many strange creatures living in the deepest parts of the ocean.","example_zh":"海洋的最深處居住著許多奇怪的生物。"},{"id":695,"word":"credit","pos":"n","meaning":"n. 賒帳；讚揚；學分 (v) 相信；歸功於","example":"You should give credit to your team members for their hard work on the project.","example_zh":"你應該將功勞歸給你的團隊成員，以感謝他們在專案上的努力。"},{"id":696,"word":"creep","pos":"v","meaning":"v. 緩緩或悄悄行進；爬行","example":"The thief tried to creep into the house without making any noise.","example_zh":"小偷試圖悄悄地潛入屋內，不發出一點聲音。"},{"id":697,"word":"crew","pos":"n","meaning":"n. 全體人員","example":"The entire crew worked together to prepare the ship for its long journey.","example_zh":"全體人員共同努力，為船隻的漫長旅程做準備。"},{"id":698,"word":"cricket","pos":"n","meaning":"n. 蟋蟀；板球","example":"My brother loves to play cricket with his friends on the weekends.","example_zh":"我哥哥喜歡在週末和朋友們打板球。"},{"id":699,"word":"crime","pos":"n","meaning":"n. 犯罪","example":"It is the responsibility of the police to prevent and investigate crime.","example_zh":"預防並調查犯罪是警方的責任。"},{"id":700,"word":"criminal","pos":"n","meaning":"n. 罪犯 (adj) 犯罪的；刑事上的","example":"The police caught the criminal after a long chase through the city.","example_zh":"警方在市區進行了一場漫長的追逐後，抓到了那名罪犯。"},{"id":701,"word":"cripple","pos":"v","meaning":"v. 使殘廢 (n) 殘障者","example":"The old war crippled the country's economy, leaving many people in poverty.","example_zh":"那場舊戰爭嚴重摧殘了該國的經濟，導致許多人陷入貧困。"},{"id":702,"word":"crippled","pos":"adj","meaning":"adj. 跛足的","example":"He walked with a limp because he was crippled in a childhood accident.","example_zh":"他走路一瘸一拐的，因為他在童年的一場意外中變成了跛足。"},{"id":703,"word":"crisis","pos":"n","meaning":"n. 危機，緊要關頭（複數：crises）","example":"The government is facing a major economic crisis that could affect everyone.","example_zh":"政府正面臨一場可能影響所有人的重大經濟危機。"},{"id":704,"word":"crisp","pos":"adj","meaning":"adj. 脆的","example":"I love the crisp sound of dry leaves crunching under my feet in autumn.","example_zh":"我喜愛秋天腳下乾葉嘎吱作響的清脆聲音。"},{"id":705,"word":"crispy","pos":"adj","meaning":"adj. 脆的","example":"The skin of the roast chicken was perfectly crispy and golden brown.","example_zh":"烤雞的雞皮非常酥脆且呈金黃色。"},{"id":706,"word":"critic","pos":"n","meaning":"n. 評論家；批評家","example":"The famous food critic wrote a very positive review of the new restaurant.","example_zh":"那位著名的美食評論家對這家新餐廳寫了非常正面的評論。"},{"id":707,"word":"critical","pos":"adj","meaning":"adj. 批評的；挑剔的；關鍵的；嚴重的；危險的","example":"It is critical that you finish the report before the meeting starts.","example_zh":"在會議開始前完成報告是非常關鍵的。"},{"id":708,"word":"criticism","pos":"n","meaning":"n. 批評；評論","example":"She accepted the criticism from her boss and promised to improve her work.","example_zh":"她接受了老闆的批評，並承諾改進工作。"},{"id":709,"word":"criticize","pos":"v","meaning":"v. 批評","example":"It is easy to criticize others, but it is much harder to do the job well yourself.","example_zh":"批評別人很容易，但要自己把事情做好卻難得多。"},{"id":710,"word":"crop","pos":"n","meaning":"n. 農作物","example":"Farmers are expecting a good crop this year because of the favorable weather.","example_zh":"由於天氣良好，農夫們預期今年會有不錯的農作物收成。"},{"id":711,"word":"crown","pos":"n","meaning":"n. 皇冠","example":"The queen wore a golden crown decorated with precious jewels.","example_zh":"女王戴著一頂裝飾著珍貴寶石的金皇冠。"},{"id":712,"word":"crucial","pos":"adj","meaning":"adj. 決定性的，重要的","example":"It is crucial to have enough sleep if you want to perform well on your exam.","example_zh":"如果你想在考試中有好表現，充足的睡眠是至關重要的。"},{"id":713,"word":"cruel","pos":"adj","meaning":"adj. 殘忍的，殘酷的","example":"It is cruel to treat animals with violence or neglect.","example_zh":"以暴力或忽視來對待動物是殘忍的。"},{"id":714,"word":"cruelly","pos":"adv","meaning":"adv. 殘忍地，殘酷地","example":"The character in the story was cruelly treated by his evil stepmother.","example_zh":"故事裡的角色受到惡毒繼母的殘酷對待。"},{"id":715,"word":"cruelty","pos":"n","meaning":"n. 殘忍；殘酷","example":"The report documents the shocking cruelty shown to the captured soldiers.","example_zh":"這份報告記錄了對被俘士兵所展現的駭人殘忍行徑。"},{"id":716,"word":"crunchy","pos":"adj","meaning":"adj. 嘎吱作響的；鬆脆的","example":"The apple has a fresh, crunchy texture that everyone enjoys.","example_zh":"這顆蘋果有種大家都喜愛的清新酥脆口感。"},{"id":717,"word":"crush","pos":"v","meaning":"v. 壓壞 (n) 迷戀","example":"The heavy bookshelf began to crush the fragile vase underneath it.","example_zh":"沉重的書架開始壓碎底下易碎的花瓶。"},{"id":718,"word":"crutch","pos":"n","meaning":"n. 拐杖","example":"He had to walk on crutches for several weeks after breaking his leg.","example_zh":"他腿骨折後必須拄著拐杖走好幾個星期。"},{"id":719,"word":"cucumber","pos":"n","meaning":"n. 黃瓜","example":"I like to add fresh cucumber slices to my salad for extra crunch.","example_zh":"我喜歡在沙拉中加入新鮮的黃瓜切片，增加口感。"},{"id":720,"word":"cue","pos":"n","meaning":"n. 暗示；提示 (v) 提示","example":"The director gave the actors a secret cue to start the next scene.","example_zh":"導演給了演員一個秘密暗示，以開始下一場戲。"},{"id":721,"word":"cultivate","pos":"v","meaning":"v. 培養；種植；栽培","example":"The teacher tries to cultivate a love for reading in all her students.","example_zh":"老師試圖在所有學生心中培養對閱讀的熱愛。"},{"id":722,"word":"cultural","pos":"adj","meaning":"adj. 文化的","example":"The exchange program is a great opportunity to learn about different cultural traditions.","example_zh":"交換計畫是了解不同文化傳統的好機會。"},{"id":723,"word":"culture","pos":"n","meaning":"n. 文化","example":"Food is an important part of our culture and brings people together.","example_zh":"食物是我們文化的重要部分，且能將人們聚在一起。"},{"id":724,"word":"cunning","pos":"adj","meaning":"adj. 狡猾的 (n) 狡猾；奸詐","example":"The cunning fox managed to escape from the trap by clever planning.","example_zh":"那隻狡猾的狐狸透過精明的計畫成功逃出了陷阱。"},{"id":725,"word":"cupboard","pos":"n","meaning":"n. 櫥櫃","example":"Please store the clean plates in the kitchen cupboard after they dry.","example_zh":"盤子晾乾後，請將它們收進廚房櫥櫃裡。"},{"id":726,"word":"curiosity","pos":"n","meaning":"n. 好奇心","example":"Her natural curiosity led her to explore every corner of the old library.","example_zh":"她與生俱來的好奇心引導她探索了那座古老圖書館的每一個角落。"},{"id":727,"word":"curious","pos":"adj","meaning":"adj. 好奇的","example":"Children are naturally curious about the world around them.","example_zh":"孩子們對於身邊的世界天生就感到好奇。"},{"id":728,"word":"curiously","pos":"adv","meaning":"adv. 好奇地","example":"He looked curiously at the mysterious package left on his front porch.","example_zh":"他好奇地看著被遺留在前廊上的神祕包裹。"},{"id":729,"word":"curl","pos":"v","meaning":"v. 使捲曲；繚繞 (n) 捲髮；螺旋狀物","example":"She used a hot iron to curl her long, straight hair for the party.","example_zh":"她用熱電棒將長直髮捲曲，以便參加派對。"},{"id":730,"word":"curly","pos":"adj","meaning":"adj. 捲的","example":"The young girl has natural curly hair that she loves to wear in a ponytail.","example_zh":"那個小女孩有一頭她喜歡紮成馬尾的天然捲髮。"},{"id":731,"word":"current","pos":"adj","meaning":"adj. 目前的 (n) 洋流，水流，電流","example":"Strong ocean currents can be dangerous for swimmers who go too far out.","example_zh":"強勁的洋流對於游得太遠的泳者來說可能很危險。"},{"id":732,"word":"currently","pos":"adv","meaning":"adv. 現在，當今","example":"The shop is currently closed for renovations but will reopen next week.","example_zh":"這家店目前為了裝修而關閉，但下週將會重新營業。"},{"id":733,"word":"curse","pos":"n","meaning":"n. 詛咒；咒語 (v) 詛咒；咒罵","example":"He didn't mean to curse; he was just very angry at the moment.","example_zh":"他並非故意咒罵；他當時只是非常生氣。"},{"id":734,"word":"curve","pos":"n","meaning":"n. 路轉彎處 (v) 彎曲；轉彎","example":"The road begins to curve sharply as it goes up the mountain.","example_zh":"這條路在往山上爬升時開始急劇轉彎。"},{"id":735,"word":"cushion","pos":"n","meaning":"n. 坐墊；墊子","example":"She placed a soft cushion on the chair to make it more comfortable to sit on.","example_zh":"她在椅子上放了一個軟坐墊，讓坐起來更舒適。"},{"id":736,"word":"custom","pos":"n","meaning":"n. 習俗","example":"It is a local custom to exchange gifts during the lunar new year.","example_zh":"在農曆新年交換禮物是當地的習俗。"},{"id":737,"word":"cut down","pos":"phr","meaning":"phr. 減少","example":"We need to cut down on our expenses if we want to save money for travel.","example_zh":"如果我們想存旅遊基金，就必須減少開支。"},{"id":738,"word":"cycle","pos":"n","meaning":"n. 循環；週期 (v) 騎腳踏車","example":"The butterfly goes through a complete cycle of changes from egg to adult.","example_zh":"蝴蝶經歷了從卵到成蟲的完整循環。"},{"id":739,"word":"dairy","pos":"n","meaning":"n. 乳品廠 (adj) 牛乳的","example":"We visited a local dairy where they make fresh cheese and milk products.","example_zh":"我們參訪了一間當地的乳品廠，他們在那裡製作新鮮起司與乳製品。"},{"id":740,"word":"dam","pos":"n","meaning":"n. 水壩","example":"The large dam was built to generate electricity and control floods in the valley.","example_zh":"那座大水壩是為了發電並控制山谷中的洪水而建造的。"},{"id":741,"word":"damage","pos":"v/n","meaning":"v/n. 破壞，損害","example":"The heavy storm caused a lot of damage to the houses in the coastal town.","example_zh":"強烈風暴對沿海城鎮的房屋造成了很大損害。"},{"id":742,"word":"damn","pos":"v","meaning":"v. 詛咒；遭天譴；指責 (n) 一點點","example":"He was so frustrated that he didn't give a damn about what happened next.","example_zh":"他太挫折了，根本不在乎接下來發生什麼事。"},{"id":743,"word":"damp","pos":"adj","meaning":"adj. 潮濕的 (v) 使潮濕","example":"The grass was still damp from the rain that fell during the night.","example_zh":"因為夜間降雨，草地仍然潮濕。"},{"id":744,"word":"danger","pos":"n","meaning":"n. 危險","example":"The warning sign told people of the danger of falling rocks in the area.","example_zh":"警告標誌告知人們該區域有落石危險。"},{"id":745,"word":"dare","pos":"aux","meaning":"aux. 敢 (v) 膽敢","example":"Few people dare to swim in this river because of the strong current.","example_zh":"因為水流強勁，很少人敢在這條河裡游泳。"},{"id":746,"word":"darling","pos":"n","meaning":"n. 親愛的 (adj) 親愛的","example":"\"Come home soon, my darling,\" she said to her husband before he left.","example_zh":"「快點回家，我親愛的，」她在丈夫離開前對他說。"},{"id":747,"word":"dash","pos":"v","meaning":"v. 衝；猛撞 (n) 衝；急跑；破折號","example":"The cat gave a sudden dash across the room to chase after the mouse.","example_zh":"貓突然衝過房間去追逐老鼠。"},{"id":748,"word":"date back to","pos":"phr","meaning":"phr. 追溯至～（年代）","example":"This ancient castle is believed to date back to the 12th century.","example_zh":"這座古堡被認為可追溯至 12 世紀。"},{"id":749,"word":"dawn on (sb)","pos":"phr","meaning":"phr. 使某人開始明白","example":"It finally dawned on him that he had been wrong all along.","example_zh":"他終於意識到自己一直以來都錯了。"},{"id":750,"word":"deadline","pos":"n","meaning":"n. 截止日期","example":"The deadline for submitting your application is this coming Friday.","example_zh":"繳交申請的截止日期是這個週五。"},{"id":751,"word":"deafen","pos":"v","meaning":"v. 使耳聾（尤指短時間）","example":"The loud music was so deafening that I couldn't hear what my friend said.","example_zh":"音樂太震耳欲聾了，以致於我聽不到朋友說了什麼。"},{"id":752,"word":"deal with","pos":"phr","meaning":"phr. 處理(=cope with; handle)","example":"The manager is busy trying to deal with all the complaints from customers.","example_zh":"經理正忙著處理所有來自顧客的抱怨。"},{"id":753,"word":"dealer","pos":"n","meaning":"n. 商人","example":"The car dealer offered us a great price for our new vehicle.","example_zh":"那位汽車商人為我們的新車提供了很棒的價格。"},{"id":754,"word":"debate","pos":"v/n","meaning":"v/n. 辯論，討論","example":"The students held a lively debate about the importance of protecting the environment.","example_zh":"學生們針對保護環境的重要性進行了一場熱烈的辯論。"},{"id":755,"word":"decade","pos":"n","meaning":"n. 十年","example":"Over the past decade, there have been many significant changes in technology.","example_zh":"在過去十年裡，科技發生了許多重大變革。"},{"id":756,"word":"deck","pos":"n","meaning":"n. 甲板；層","example":"We spent a relaxing afternoon sitting on the deck of the ship.","example_zh":"我們在船的甲板上度過了一個放鬆的下午。"},{"id":757,"word":"declaration","pos":"n","meaning":"n. 宣告；聲明","example":"The country issued a formal declaration of peace after the long conflict.","example_zh":"長期衝突後，該國發布了正式的和平宣言。"},{"id":758,"word":"declare","pos":"v","meaning":"v. 宣佈；宣告；聲稱；申報；詳報","example":"The government will declare a national holiday next Monday to celebrate the event.","example_zh":"政府將宣佈下週一為國定假日以慶祝該活動。"},{"id":759,"word":"decline","pos":"v/n","meaning":"v/n. 下降，衰落 (v) 婉拒","example":"His interest in the hobby began to decline as he got older.","example_zh":"隨著年紀增長，他對那項嗜好的興趣開始下降。"},{"id":760,"word":"decoration","pos":"n","meaning":"n. 裝飾；裝飾品","example":"The beautiful Christmas decoration made the house look very festive.","example_zh":"精美的聖誕裝飾讓房子看起來非常有節慶氣氛。"},{"id":761,"word":"decrease","pos":"v","meaning":"v. 減少；下降 (n) 減少；下降","example":"The number of students in the class began to decrease after the mid-term exams.","example_zh":"期中考後，班級的人數開始減少。"},{"id":762,"word":"deed","pos":"n","meaning":"n. 行為","example":"A good deed can make a big difference in someone else's life.","example_zh":"一件善行可以在別人的生活中產生重大影響。"},{"id":763,"word":"deepen","pos":"v","meaning":"v. 加深","example":"As she studied more, her understanding of the subject began to deepen.","example_zh":"隨著她學習得越多，她對該學科的理解也開始加深。"},{"id":764,"word":"defeat","pos":"n","meaning":"n. 失敗；挫折；擊敗；戰勝 (v) 擊敗；戰勝","example":"They worked hard to ensure that their team would not suffer another defeat.","example_zh":"他們努力工作，以確保團隊不會再遭受一次失敗。"},{"id":765,"word":"defend","pos":"v","meaning":"v. 防禦；保護；辯護；辯解","example":"The lawyer tried to defend his client by providing evidence of his innocence.","example_zh":"律師試圖提供清白證據來為他的客戶辯護。"},{"id":766,"word":"defense","pos":"n","meaning":"n. 保衛；防衛","example":"The castle was built with high walls for the purpose of defense against invaders.","example_zh":"這座城堡建造高牆是為了防禦外敵。"},{"id":767,"word":"defensible","pos":"adj","meaning":"adj. 可防禦的；可辯解的","example":"His argument for the new policy was quite defensible even to his opponents.","example_zh":"他為新政策所提出的論點，就連反對者也認為是可辯解的。"},{"id":768,"word":"defensive","pos":"adj","meaning":"adj. 防禦性的；防禦用的","example":"The team played a very defensive game to prevent the other side from scoring.","example_zh":"那支球隊採取了非常防禦性的策略，以阻止對方得分。"},{"id":769,"word":"deficiency","pos":"n","meaning":"n. 缺乏，不足","example":"A diet rich in fruits and vegetables prevents vitamin deficiency.","example_zh":"富含水果和蔬菜的飲食可預防維生素缺乏。"},{"id":770,"word":"deficient","pos":"adj","meaning":"adj. 有缺點、缺陷的","example":"The poor soil is deficient in nutrients, making it hard for plants to grow.","example_zh":"貧瘠的土壤缺乏養分，使得植物很難生長。"},{"id":771,"word":"define","pos":"v","meaning":"v. 定義；界定","example":"We need to define the exact goals of the project before we start.","example_zh":"在開始之前，我們需要界定該專案的確切目標。"},{"id":772,"word":"definite","pos":"adj","meaning":"adj. 明確的；確定的","example":"There is no definite answer to this problem, as it depends on the situation.","example_zh":"這問題沒有明確的答案，因為這取決於情況。"},{"id":773,"word":"definitely","pos":"adv","meaning":"adv. 毫無疑問地，確定地","example":"I am definitely going to the party tonight, no matter what happens.","example_zh":"不管發生什麼事，我絕對會參加今晚的派對。"},{"id":774,"word":"definition","pos":"n","meaning":"n. 定義；界定","example":"The dictionary provides a clear definition of every word in the English language.","example_zh":"字典提供了英文中每個單字的清晰定義。"},{"id":775,"word":"degree","pos":"n","meaning":"n. 溫度，程度","example":"She graduated from the university with a degree in biology.","example_zh":"她從大學畢業，獲得生物學學位。"},{"id":776,"word":"delay","pos":"v/n","meaning":"v/n. 耽擱，延誤","example":"The heavy snow caused a long delay in our flight.","example_zh":"大雪導致我們的航班嚴重延誤。"},{"id":777,"word":"delicate","pos":"adj","meaning":"adj. 纖細的；易碎的；敏感的；精緻的；精美的","example":"The antique watch is very delicate and must be handled with great care.","example_zh":"這支古董錶非常精緻，必須小心處理。"},{"id":778,"word":"delight","pos":"v","meaning":"v. 使喜悅；使快樂；以～為樂 (n) 欣喜；愉快；使人愉快的人或事物","example":"It was a great delight to meet all my old friends at the party.","example_zh":"能在派對上見到我所有的老朋友真是令人欣喜。"},{"id":779,"word":"delighted","pos":"adj","meaning":"adj. 感到愉悅的","example":"The children were delighted when they saw the beautiful presents under the Christmas tree.","example_zh":"當孩子們看到聖誕樹下漂亮的禮物時，他們感到非常愉悅。"},{"id":780,"word":"delightful","pos":"adj","meaning":"adj. 愉快的；歡樂的","example":"We had a delightful evening talking and laughing with our neighbors.","example_zh":"我們與鄰居聊天大笑，度過了一個愉快的夜晚。"},{"id":781,"word":"deliver","pos":"v","meaning":"v. 遞送，投遞","example":"The mailman will deliver the packages to your house tomorrow morning.","example_zh":"郵差明天早上會把包裹遞送到你家。"},{"id":782,"word":"delivery","pos":"n","meaning":"n. 遞送","example":"The pizza shop offers free delivery if you order more than three pizzas.","example_zh":"如果你訂購超過三份披薩，這家披薩店提供免費遞送。"},{"id":783,"word":"demand","pos":"n","meaning":"n. 要求；需要；需求 (v) 要求；需要","example":"The customer made a demand for a full refund because the item was broken.","example_zh":"顧客要求全額退款，因為物品損壞了。"},{"id":784,"word":"democracy","pos":"n","meaning":"n. 民主（國家、政體）","example":"In a democracy, the people have the power to choose their leaders through voting.","example_zh":"在民主體制中，人民有權透過投票選出領導人。"},{"id":785,"word":"democrat","pos":"n","meaning":"n. 民主主義者；民主黨員","example":"He has been a loyal Democrat for over twenty years.","example_zh":"他已經當了二十多年的忠誠民主黨員。"},{"id":786,"word":"democratic","pos":"adj","meaning":"adj. 民主的","example":"The country is moving toward a more democratic system of government.","example_zh":"該國正邁向更民主的政府體系。"},{"id":787,"word":"demonstrate","pos":"v","meaning":"v. 示範；展示；顯示；證明；示威","example":"The teacher will demonstrate how to perform the experiment for the students.","example_zh":"老師將為學生示範如何進行該實驗。"},{"id":788,"word":"demonstration","pos":"n","meaning":"n. 展示；示威（活動）","example":"The peaceful demonstration in the city center was organized to protest the new law.","example_zh":"市中心的和平示威活動是為了抗議新法而組織的。"},{"id":789,"word":"denial","pos":"n","meaning":"n. 否認","example":"He still maintains a denial of any wrongdoing despite the strong evidence.","example_zh":"儘管證據確鑿，他仍堅持否認有任何不當行為。"},{"id":790,"word":"dense","pos":"adj","meaning":"adj. 緊密的；濃密的","example":"We had to walk through the dense forest to reach the hidden waterfall.","example_zh":"我們必須穿過濃密的森林才能抵達隱藏的瀑布。"},{"id":791,"word":"density","pos":"n","meaning":"n. 密度","example":"The high density of population in the city makes it very crowded.","example_zh":"城市中高人口密度使得這裡非常擁擠。"},{"id":792,"word":"deny","pos":"v","meaning":"v. 否認","example":"The suspect continues to deny that he was at the scene of the crime.","example_zh":"嫌疑人持續否認他曾出現在犯罪現場。"}]},
{"unit":7,"unit_label":"p.13-14","words":[{"id":793,"word":"depart","pos":"v","meaning":"v. 離開","example":"The train is scheduled to depart from the station at exactly ten o'clock.","example_zh":"火車預定在十點整從車站離開。"},{"id":794,"word":"departure","pos":"n","meaning":"n. 離開","example":"Please check the departure time of your flight before you go to the airport.","example_zh":"在前往機場前，請確認你的航班離開時間。"},{"id":795,"word":"dependable","pos":"adj","meaning":"adj. 可信賴的","example":"You can always count on him to be a dependable friend in times of need.","example_zh":"在需要的時候，你總是可以依靠他成為一個可信賴的朋友。"},{"id":796,"word":"dependent","pos":"adj","meaning":"adj. 依賴的；依靠的","example":"Many people are dependent on public transportation to get to work every day.","example_zh":"許多人每天依賴大眾運輸工具上下班。"},{"id":797,"word":"deposit","pos":"n","meaning":"n. 存款；押金 (v) 存款；存放","example":"I went to the bank to deposit my paycheck into my savings account.","example_zh":"我去銀行將我的薪水支票存入我的儲蓄帳戶。"},{"id":798,"word":"depress","pos":"v","meaning":"v. 使沮喪；使灰心","example":"The long winter and lack of sunshine can sometimes depress people.","example_zh":"漫長的冬天與缺乏陽光有時會讓人感到沮喪。"},{"id":799,"word":"depressed","pos":"adj","meaning":"adj. 沮喪的","example":"She felt very depressed after hearing the sad news about her old friend.","example_zh":"在聽到關於她老朋友的悲傷消息後，她感到非常沮喪。"},{"id":800,"word":"depressing","pos":"adj","meaning":"adj. 令人沮喪的","example":"Watching the news about the war can be a very depressing experience.","example_zh":"收看關於戰爭的新聞是一種非常令人沮喪的經驗。"},{"id":801,"word":"depression","pos":"n","meaning":"n. 憂鬱；沮喪；蕭條；不景氣","example":"During the Great Depression, many people struggled to find jobs and food.","example_zh":"在經濟大蕭條期間，許多人難以找到工作與食物。"},{"id":802,"word":"deprive","pos":"v","meaning":"v. 使喪失，剝奪（人＋of＋物）","example":"The long war served to deprive the people of their basic human rights.","example_zh":"長期的戰爭剝奪了人民的基本人權。"},{"id":803,"word":"deprived","pos":"adj","meaning":"adj. 貧困的","example":"The government is working to improve living conditions in the most deprived areas.","example_zh":"政府正致力於改善最貧困地區的居住條件。"},{"id":804,"word":"describe","pos":"v","meaning":"v. 描述，描寫","example":"Can you describe what the suspect looked like when you saw him?","example_zh":"你能描述當你看到嫌疑人時，他長什麼樣子嗎？"},{"id":805,"word":"description","pos":"n","meaning":"n. 描寫；敘述","example":"The witness gave a detailed description of the event to the police.","example_zh":"目擊者向警方對該事件做了詳細的敘述。"},{"id":806,"word":"descriptive","pos":"adj","meaning":"adj. 描述的，敘述的","example":"The report includes a descriptive analysis of the current market trends.","example_zh":"這份報告包含了目前市場趨勢的描述性分析。"},{"id":807,"word":"desert","pos":"n","meaning":"n. 沙漠 (v) 拋棄","example":"It is wrong for a parent to desert their children and leave them alone.","example_zh":"父母拋棄孩子讓他們獨處是錯誤的。"},{"id":808,"word":"deserve","pos":"v","meaning":"v. 應得","example":"You have worked very hard all year; you deserve a long vacation.","example_zh":"你整年都工作得很辛苦；你應得一個長假。"},{"id":809,"word":"design","pos":"v/n","meaning":"v/n. 設計","example":"The architect was asked to design a new building for the city center.","example_zh":"建築師被要求為市中心設計一棟新建築。"},{"id":810,"word":"designer","pos":"n","meaning":"n. 設計師","example":"The famous fashion designer presented her new collection in Paris.","example_zh":"那位著名的服裝設計師在巴黎發表了她的新系列作品。"},{"id":811,"word":"desirable","pos":"adj","meaning":"adj. 合意的；值得要的","example":"A well-paying job with flexible hours is highly desirable for many young people.","example_zh":"對許多年輕人來說，一份高薪且時間彈性的工作是非常合意的。"},{"id":812,"word":"despair","pos":"n","meaning":"n. 絕望 (v) 感到絕望","example":"After losing everything, he fell into deep despair and felt he had no hope.","example_zh":"在失去一切後，他陷入深深的絕望，覺得自己毫無希望。"},{"id":813,"word":"desperate","pos":"adj","meaning":"adj. 危險的；絕望的；緊急的","example":"The desperate man tried to find a way to pay his debts before it was too late.","example_zh":"那個絕望的人試圖在太遲之前找到償還債務的方法。"},{"id":814,"word":"despite","pos":"prep","meaning":"prep. 不管；不顧","example":"Despite the heavy rain, they decided to continue with the outdoor concert.","example_zh":"儘管下著大雨，他們仍決定繼續舉行戶外音樂會。"},{"id":815,"word":"destroy","pos":"v","meaning":"v. 破壞；毀滅","example":"The earthquake was powerful enough to destroy the entire town.","example_zh":"那場地震強烈到足以摧毀整個城鎮。"},{"id":816,"word":"destruction","pos":"n","meaning":"n. 毀壞；毀滅","example":"The city is still trying to recover from the destruction caused by the fire.","example_zh":"城市仍試圖從火災造成的毀壞中恢復。"},{"id":817,"word":"destructive","pos":"adj","meaning":"adj. 破壞的；毀壞的","example":"The destructive power of a hurricane can be seen in the damaged buildings.","example_zh":"颶風的破壞力可以在受損的建築物中看到。"},{"id":818,"word":"detail","pos":"n","meaning":"n. 細節；小事 (v) 詳細說明","example":"I need to go over the details of the plan one more time before we start.","example_zh":"在開始之前，我需要再確認一次計畫的細節。"},{"id":819,"word":"detailed","pos":"adj","meaning":"adj. 鉅細靡遺的；非常仔細的","example":"She gave a detailed explanation of why the experiment failed.","example_zh":"她對實驗為何失敗做了鉅細靡遺的解釋。"},{"id":820,"word":"detect","pos":"vt","meaning":"vt. 察覺，發覺；偵查，探測；對～檢波","example":"Modern smoke detectors can detect even a tiny amount of smoke.","example_zh":"現代煙霧探測器甚至能偵測到極少量的煙霧。"},{"id":821,"word":"detective","pos":"n","meaning":"n. 偵探","example":"The private detective was hired to find the missing person.","example_zh":"私家偵探被聘請來尋找那位失蹤者。"},{"id":822,"word":"detector","pos":"n","meaning":"n. 探測器","example":"The airport uses a metal detector to check all passengers before they board.","example_zh":"機場使用金屬探測器在登機前檢查所有乘客。"},{"id":823,"word":"determination","pos":"n","meaning":"n. 決心；決意","example":"With enough determination, you can overcome any obstacle in your path.","example_zh":"有足夠的決心，你就能克服路上的任何障礙。"},{"id":824,"word":"determine","pos":"v","meaning":"v. 決定","example":"Your grades will determine which university you are able to attend.","example_zh":"你的成績將決定你能就讀哪一所大學。"},{"id":825,"word":"determined","pos":"adj","meaning":"adj. 心意堅決的","example":"She is a determined student wh
