rd":"residential","pos":"adj","meaning":"adj. 居住的，住宅的","example":"They bought a house in a quiet residential area.","example_zh":"他們在一個安靜的住宅區買了一間房子。"},{"id":2454,"word":"resign","pos":"v","meaning":"v. 辭職","example":"The manager decided to resign after the company lost a lot of money.","example_zh":"公司虧損慘重後，經理決定辭職。"},{"id":2455,"word":"resignation","pos":"n","meaning":"n. 辭職；辭呈","example":"His sudden resignation surprised everyone in the office.","example_zh":"他突然請辭讓辦公室裡的每個人都很驚訝。"},{"id":2456,"word":"resist","pos":"v","meaning":"v. 抵抗；忍住；抑制","example":"I couldn't resist eating another piece of the chocolate cake.","example_zh":"我忍不住又吃了一塊巧克力蛋糕。"},{"id":2457,"word":"resistance","pos":"n","meaning":"n. 抵抗；抗拒；抵抗力","example":"The army met strong resistance when it tried to enter the city.","example_zh":"軍隊試圖進入那座城市時遭遇了強烈的抵抗。"},{"id":2458,"word":"resistant","pos":"adj","meaning":"adj. 有抵抗力的","example":"This new kind of rice is resistant to many plant diseases.","example_zh":"這種新品種的稻米對許多植物病害有抵抗力。"},{"id":2459,"word":"resolution","pos":"n","meaning":"n. 決心；解決","example":"My New Year's resolution is to exercise for thirty minutes every day.","example_zh":"我的新年新希望是每天運動三十分鐘。"},{"id":2460,"word":"resolve","pos":"v","meaning":"v. 決定；解決","example":"The two friends resolved their quarrel by talking honestly with each other.","example_zh":"兩個朋友藉由坦誠交談解決了他們的爭吵。"},{"id":2461,"word":"resource","pos":"n","meaning":"n. 資源","example":"Water is one of the most important natural resources on Earth.","example_zh":"水是地球上最重要的天然資源之一。"},{"id":2462,"word":"respectable","pos":"adj","meaning":"adj. 值得尊敬的；體面的","example":"He earned a respectable income from his job as a teacher.","example_zh":"他從教師這份工作中賺得一份體面的收入。"},{"id":2463,"word":"respectful","pos":"adj","meaning":"adj. 尊敬的；有禮貌的","example":"Students should be respectful to their teachers and classmates.","example_zh":"學生應該對老師和同學保持尊重。"},{"id":2464,"word":"respective","pos":"adj","meaning":"adj. 分別的 各自的","example":"After the meeting, the members went back to their respective offices.","example_zh":"會議結束後，成員們各自回到自己的辦公室。"},{"id":2465,"word":"respectively","pos":"adv","meaning":"adv. 分別，依次地","example":"The twins were born in 2008 and 2010 respectively.","example_zh":"這對雙胞胎分別在2008年和2010年出生。"},{"id":2466,"word":"respond","pos":"v","meaning":"v. 回答；回應","example":"She didn't know how to respond when he asked her to dance.","example_zh":"當他邀她跳舞時，她不知該如何回應。"},{"id":2467,"word":"response","pos":"n","meaning":"n. 回答；回覆；回應","example":"I'm still waiting for a response to my job application.","example_zh":"我還在等待我的工作申請得到回覆。"},{"id":2468,"word":"responsibility","pos":"n","meaning":"n. 責任感","example":"Taking care of a pet is a big responsibility for a child.","example_zh":"照顧寵物對孩子來說是一項重大的責任。"},{"id":2469,"word":"responsible","pos":"adj","meaning":"adj. 負責任的","example":"Parents are responsible for the safety of their children.","example_zh":"父母要為孩子的安全負責。"},{"id":2470,"word":"restore","pos":"v","meaning":"v. 恢復；歸還；使復原；使恢復健康","example":"It took the workers three years to restore the old temple.","example_zh":"工人們花了三年時間修復那座古老的廟宇。"},{"id":2471,"word":"restrict","pos":"v","meaning":"v. 限制","example":"The school decided to restrict the use of phones in class.","example_zh":"學校決定限制上課使用手機。"},{"id":2472,"word":"restricted","pos":"adj","meaning":"adj. 受限制的；被限定的","example":"Parking is restricted to teachers and visitors only.","example_zh":"停車僅限教職員與訪客使用。"},{"id":2473,"word":"restriction","pos":"n","meaning":"n. 限制","example":"There is no restriction on the number of books you can borrow.","example_zh":"你能借的書本數量沒有任何限制。"},{"id":2474,"word":"restrictive","pos":"adj","meaning":"adj. 限制的；約束的","example":"The restrictive rules made the students feel they had no freedom.","example_zh":"這些嚴苛的規定讓學生覺得自己毫無自由。"},{"id":2475,"word":"result","pos":"n","meaning":"n. 結果 (v) 造成(+in)，由～引起(+from)","example":"Heavy rain resulted in a flood in the small town.","example_zh":"大雨在這個小鎮造成了水災。"},{"id":2476,"word":"retain","pos":"v","meaning":"v. 保持；保有","example":"This kind of bag can retain heat for several hours.","example_zh":"這種袋子可以保溫好幾個小時。"},{"id":2477,"word":"retire","pos":"v","meaning":"v. 退休","example":"My grandfather plans to retire at the end of this year.","example_zh":"我爺爺打算在今年年底退休。"},{"id":2478,"word":"retreat","pos":"v","meaning":"v. 撤退；退後；退隱；躲避 (n) 撤退；退隱處；僻靜處","example":"The soldiers had to retreat when the enemy became stronger.","example_zh":"敵軍變得更強時，士兵們不得不撤退。"},{"id":2479,"word":"return","pos":"v/n","meaning":"v/n. 回應，回報；返回","example":"Please return the book to the library by Friday.","example_zh":"請在星期五前把書歸還給圖書館。"},{"id":2480,"word":"reunion","pos":"n","meaning":"n. 重聚；團圓","example":"The class held a reunion twenty years after graduation.","example_zh":"這個班級在畢業二十年後舉辦了一場重聚。"},{"id":2481,"word":"reveal","pos":"v","meaning":"v. 透露","example":"The test results will reveal whether the medicine really works.","example_zh":"測試結果將揭曉這種藥是否真的有效。"},{"id":2482,"word":"revenge","pos":"n","meaning":"n. 復仇 (v) 報仇；報復","example":"He promised to take revenge on the people who had hurt his family.","example_zh":"他發誓要向傷害他家人的人報仇。"},{"id":2483,"word":"revise","pos":"v","meaning":"v. 修訂","example":"I need to revise my essay before handing it in.","example_zh":"我交作文之前需要先修改一下。"},{"id":2484,"word":"revision","pos":"n","meaning":"n. 修訂（版）","example":"The new edition of the dictionary includes a major revision of its examples.","example_zh":"這本字典的新版對例句做了大幅修訂。"},{"id":2485,"word":"revolution","pos":"n","meaning":"n. 革命；旋轉","example":"The Industrial Revolution changed the way people lived and worked.","example_zh":"工業革命改變了人們生活與工作的方式。"},{"id":2486,"word":"revolutionary","pos":"adj","meaning":"adj. 革新的 (n) 革命份子；改革者","example":"The inventor's revolutionary idea changed the whole industry.","example_zh":"那位發明家革命性的想法改變了整個產業。"},{"id":2487,"word":"reward","pos":"n","meaning":"n. 報酬 (v) 報答；酬謝","example":"The boy received a toy car as a reward for his good grades.","example_zh":"那個男孩因成績優異而得到一輛玩具車作為獎勵。"},{"id":2488,"word":"rhyme","pos":"n","meaning":"n. 韻文；押韻詞 (v) 押韻","example":"The words \"cat\" and \"hat\" rhyme with each other.","example_zh":"「cat」和「hat」這兩個字互相押韻。"},{"id":2489,"word":"rhythm","pos":"n","meaning":"n. 節奏；韻律","example":"The dancers moved to the rhythm of the drums.","example_zh":"舞者隨著鼓聲的節奏舞動。"},{"id":2490,"word":"ribbon","pos":"n","meaning":"n. 緞帶","example":"She tied a red ribbon around the gift box.","example_zh":"她在禮物盒上繫了一條紅色緞帶。"},{"id":2491,"word":"rid","pos":"v","meaning":"v. 除掉 (adj) 除掉的","example":"The cleaner used a special liquid to rid the kitchen of bad smells.","example_zh":"清潔工用一種特殊的液體除去廚房裡的異味。"},{"id":2492,"word":"riddle","pos":"n","meaning":"n. 謎","example":"Can you solve this riddle about the clock?","example_zh":"你能解開這個關於時鐘的謎語嗎？"},{"id":2493,"word":"ridicule","pos":"v/n","meaning":"v/n. 奚落、嘲笑","example":"The other kids ridiculed him for wearing such a funny hat.","example_zh":"其他孩子嘲笑他戴了一頂那麼滑稽的帽子。"},{"id":2494,"word":"ridiculous","pos":"adj","meaning":"adj. 可笑的，荒唐的","example":"It's ridiculous to pay so much money for a plain T-shirt.","example_zh":"花那麼多錢買一件素T恤實在太荒謬了。"},{"id":2495,"word":"ripe","pos":"adj","meaning":"adj. 成熟的","example":"These mangoes are ripe and ready to eat.","example_zh":"這些芒果熟了，可以吃了。"},{"id":2496,"word":"rise","pos":"v","meaning":"v. 升起，上升（rose, risen）","example":"The sun rises in the east and sets in the west.","example_zh":"太陽從東方升起，在西方落下。"},{"id":2497,"word":"risk","pos":"v","meaning":"v. 冒著危險 (n) 危險；風險","example":"Firefighters risk their lives every day to save others.","example_zh":"消防員每天冒著生命危險去拯救他人。"},{"id":2498,"word":"ritual","pos":"n","meaning":"n. 儀式","example":"The villagers perform an ancient ritual to thank the gods for the harvest.","example_zh":"村民們舉行一場古老的儀式，感謝神明賜予豐收。"},{"id":2499,"word":"rival","pos":"n","meaning":"n. 競爭對手 (v) 比得上～，與～匹敵","example":"The two companies have been rivals for more than twenty years.","example_zh":"這兩家公司已經互為競爭對手超過二十年了。"},{"id":2500,"word":"rivalry","pos":"n","meaning":"n. 競爭","example":"The rivalry between the two schools is especially strong during basketball season.","example_zh":"兩所學校之間的競爭在籃球季時特別激烈。"},{"id":2501,"word":"roar","pos":"v","meaning":"v. 大聲吼叫 (n) 吼聲；轟響聲","example":"The lion roared loudly and scared all the visitors at the zoo.","example_zh":"那隻獅子大聲吼叫，嚇到了動物園裡所有的遊客。"},{"id":2502,"word":"roast","pos":"v","meaning":"v. 烤 (n) 烤肉（活動）","example":"We roasted marshmallows over the fire during the camping trip.","example_zh":"我們在露營時用營火烤棉花糖。"},{"id":2503,"word":"rob","pos":"v","meaning":"v. 搶奪","example":"Two men robbed the bank and ran away in a stolen car.","example_zh":"兩名男子搶劫了銀行，並駕著一輛偷來的車逃走。"},{"id":2504,"word":"robber","pos":"n","meaning":"n. 搶匪","example":"The police finally caught the robber who had stolen jewelry from the shop.","example_zh":"警方終於抓到了從那家店偷走珠寶的搶匪。"},{"id":2505,"word":"robbery","pos":"n","meaning":"n. 搶案；搶劫","example":"There was a bank robbery downtown, and the police closed the street.","example_zh":"市中心發生了一起銀行搶案，警方封鎖了街道。"},{"id":2506,"word":"robe","pos":"n","meaning":"n. 袍子","example":"He put on a soft robe after taking a hot bath.","example_zh":"他洗完熱水澡後穿上了一件柔軟的袍子。"},{"id":2507,"word":"rocket","pos":"n","meaning":"n. 火箭","example":"The rocket was launched into space early this morning.","example_zh":"火箭今天清晨被發射到太空中。"},{"id":2508,"word":"roll","pos":"v","meaning":"v. 流，滴，滾動","example":"Tears began to roll down her cheeks when she heard the sad news.","example_zh":"聽到這個悲傷的消息時，眼淚開始從她的臉頰滑落。"},{"id":2509,"word":"romance","pos":"n","meaning":"n. 戀愛（故事）；浪漫情調","example":"The movie is a sweet romance between a poor artist and a rich girl.","example_zh":"這部電影是一段窮畫家與富家女之間甜蜜的愛情故事。"},{"id":2510,"word":"romantic","pos":"adj","meaning":"adj. 浪漫的","example":"They had a romantic dinner by the sea on their anniversary.","example_zh":"他們在紀念日當天於海邊享用了一頓浪漫的晚餐。"}]},
{"unit":20,"unit_label":"p.39-40","words":[{"id":2511,"word":"rot","pos":"v","meaning":"v. 腐爛","example":"If you leave fruit in the sun for too long, it will start to rot.","example_zh":"如果你把水果放在太陽下太久，它就會開始腐爛。"},{"id":2512,"word":"rotten","pos":"adj","meaning":"adj. 腐爛的","example":"There was a rotten smell coming from the old refrigerator.","example_zh":"那台舊冰箱傳出一股腐爛的臭味。"},{"id":2513,"word":"rough","pos":"adj","meaning":"adj. 粗糙的","example":"The surface of the old wall felt rough under my fingers.","example_zh":"那面舊牆的表面摸起來很粗糙。"},{"id":2514,"word":"roughly","pos":"adv","meaning":"adv. 粗暴地；約略地","example":"It takes roughly two hours to drive from Taipei to Taichung.","example_zh":"從台北開車到台中大約要兩個小時。"},{"id":2515,"word":"route","pos":"n","meaning":"n. 路線","example":"Which route should we take to get to the beach?","example_zh":"我們該走哪一條路線去海邊？"},{"id":2516,"word":"routine","pos":"n","meaning":"n. 例行公事 (adj)例行的","example":"Brushing my teeth before bed is part of my daily routine.","example_zh":"睡前刷牙是我每天例行公事的一部分。"},{"id":2517,"word":"rug","pos":"n","meaning":"n. 小塊地毯","example":"The cat likes to sleep on the soft rug next to the sofa.","example_zh":"那隻貓喜歡睡在沙發旁邊柔軟的小地毯上。"},{"id":2518,"word":"ruin","pos":"v","meaning":"v. 毀滅；毀壞；使破產 (n) 毀滅；衰敗；廢墟；遺跡（用複數形）","example":"The heavy rain ruined our picnic plans.","example_zh":"這場大雨毀了我們的野餐計畫。"},{"id":2519,"word":"rumor","pos":"n","meaning":"n. 謠言；傳說 (v) 謠傳","example":"There is a rumor that the school will start a new club next year.","example_zh":"有傳言說學校明年會成立一個新社團。"},{"id":2520,"word":"run a risk (of doing something)","pos":"phr","meaning":"phr. 冒～的風險","example":"If you drive without a seat belt, you run a risk of getting hurt in an accident.","example_zh":"如果你開車不繫安全帶，就有在事故中受傷的風險。"},{"id":2521,"word":"run into","pos":"phr","meaning":"phr. 撞見；偶遇","example":"I ran into my old classmate at the supermarket yesterday.","example_zh":"我昨天在超市偶遇了我的老同學。"},{"id":2522,"word":"run out","pos":"phr","meaning":"phr. 用完，耗盡","example":"We are running out of time, so we have to hurry.","example_zh":"我們的時間快用完了，所以得趕快。"},{"id":2523,"word":"rural","pos":"adj","meaning":"adj. 鄉村的","example":"Many young people have moved from rural areas to big cities to find jobs.","example_zh":"許多年輕人已從鄉村地區搬到大城市去找工作。"},{"id":2524,"word":"rust","pos":"n","meaning":"n. 鏽 (v) 生鏽","example":"Rust had eaten holes in the bottom of the old car.","example_zh":"鏽蝕已經在那輛舊車的底部蝕出了洞。"},{"id":2525,"word":"rusty","pos":"adj","meaning":"adj. 生鏽的","example":"The rusty gate made a loud noise when I pushed it open.","example_zh":"我推開那扇生鏽的大門時，它發出了很大的聲響。"},{"id":2526,"word":"sack","pos":"n","meaning":"n. 大袋子 (v) 解雇","example":"The farmer carried a heavy sack of rice on his back.","example_zh":"那位農夫背著一大袋沉重的米。"},{"id":2527,"word":"sacrifice","pos":"n","meaning":"n. 犧牲；獻祭；祭品 (v) 犧牲；獻祭；祭祀","example":"Many parents sacrifice their free time to take care of their children.","example_zh":"許多父母犧牲自己的空閒時間來照顧孩子。"},{"id":2528,"word":"sake","pos":"n","meaning":"n. 緣故","example":"For the sake of your health, you should go to bed earlier.","example_zh":"為了你的健康著想，你應該早點睡覺。"},{"id":2529,"word":"salary","pos":"n","meaning":"n. 薪水","example":"She gets a good salary, so she can support her family easily.","example_zh":"她領有不錯的薪水，所以可以輕鬆地養家。"},{"id":2530,"word":"salesperson","pos":"n","meaning":"n. 售貨員","example":"The salesperson showed us several different kinds of washing machines.","example_zh":"那位售貨員向我們展示了好幾種不同的洗衣機。"},{"id":2531,"word":"satellite","pos":"n","meaning":"n. 衛星","example":"The weather satellite sends pictures of the clouds back to Earth.","example_zh":"氣象衛星把雲層的照片傳回地球。"},{"id":2532,"word":"satisfaction","pos":"n","meaning":"n. 滿足；滿意","example":"He felt great satisfaction after finishing the difficult project.","example_zh":"完成這個困難的專案後，他感到非常滿足。"},{"id":2533,"word":"satisfactory","pos":"adj","meaning":"adj. 令人滿意的","example":"The hotel's service was satisfactory, but the room was a bit small.","example_zh":"那家旅館的服務令人滿意，但房間有點小。"},{"id":2534,"word":"satisfy","pos":"v","meaning":"v. 使滿意","example":"It is impossible to satisfy everyone in the group.","example_zh":"要讓團體裡的每個人都滿意是不可能的。"},{"id":2535,"word":"satisfying","pos":"adj","meaning":"adj. 令人滿意的","example":"Finishing a long run is a very satisfying experience for me.","example_zh":"跑完一段長跑對我來說是非常令人滿足的經驗。"},{"id":2536,"word":"saucer","pos":"n","meaning":"n. 杯碟","example":"She placed the teacup carefully on the saucer.","example_zh":"她小心翼翼地把茶杯放在杯碟上。"},{"id":2537,"word":"sausage","pos":"n","meaning":"n. 香腸","example":"My little brother ate three sausages for breakfast.","example_zh":"我弟弟早餐吃了三根香腸。"},{"id":2538,"word":"savings","pos":"n","meaning":"n. 存款","example":"He used all his savings to buy a small house in the countryside.","example_zh":"他用盡所有積蓄在鄉下買了一間小房子。"},{"id":2539,"word":"scale","pos":"n","meaning":"n. 記數法；基準；規模；程度；刻度；尺度；磅秤","example":"The scale shows that I have lost two kilograms this month.","example_zh":"磅秤顯示我這個月瘦了兩公斤。"},{"id":2540,"word":"scan","pos":"v","meaning":"v. 掃描，粗略地看","example":"The librarian scanned the barcode on the back of the book.","example_zh":"圖書館員掃描了書背面的條碼。"},{"id":2541,"word":"scanner","pos":"n","meaning":"n. 掃瞄器","example":"The scanner at the supermarket can read every barcode quickly.","example_zh":"超市的掃描器可以快速讀取每一個條碼。"},{"id":2542,"word":"scarce","pos":"adj","meaning":"adj. 缺乏的；不足的","example":"Fresh water is scarce in many parts of the desert.","example_zh":"沙漠的許多地方都缺乏淡水。"},{"id":2543,"word":"scarcely","pos":"adv","meaning":"adv. 幾乎不","example":"It was so foggy that we could scarcely see the road ahead.","example_zh":"霧大到我們幾乎看不見前方的路。"},{"id":2544,"word":"scarecrow","pos":"n","meaning":"n. 稻草人","example":"The farmer put a scarecrow in the field to keep the birds away.","example_zh":"農夫在田裡放了一個稻草人來趕走鳥。"},{"id":2545,"word":"scary","pos":"adj","meaning":"adj. 可怕的","example":"The little boy was afraid to watch the scary movie alone.","example_zh":"那個小男孩不敢獨自看那部可怕的電影。"},{"id":2546,"word":"scatter","pos":"v","meaning":"v. （使）消散；（使）散開；撒","example":"The wind scattered the papers all over the floor.","example_zh":"風把紙張吹得散落一地。"},{"id":2547,"word":"scenery","pos":"n","meaning":"n. 風景","example":"We stopped the car to enjoy the beautiful scenery along the coast.","example_zh":"我們把車停下來，欣賞沿海美麗的風景。"},{"id":2548,"word":"schedule","pos":"n","meaning":"n. 計劃表；日程安排表；時間表 (v) 預定；安排","example":"I have a very busy schedule this week, so I can't join you.","example_zh":"我這個星期的行程很滿，所以沒辦法加入你們。"},{"id":2549,"word":"scholar","pos":"n","meaning":"n. 學者","example":"The scholar spent his whole life studying ancient Chinese poetry.","example_zh":"那位學者一生都在研究中國古典詩詞。"},{"id":2550,"word":"scholarship","pos":"n","meaning":"n. 獎學金","example":"She won a scholarship to study in the United States.","example_zh":"她獲得了一筆獎學金，可以到美國讀書。"},{"id":2551,"word":"science","pos":"n","meaning":"n. 科學","example":"Science has made our daily lives easier and more comfortable.","example_zh":"科學讓我們的日常生活變得更輕鬆、更舒適。"},{"id":2552,"word":"scientific","pos":"adj","meaning":"adj. 科學的","example":"The scientific method starts with asking a clear question.","example_zh":"科學方法是從提出一個明確的問題開始的。"},{"id":2553,"word":"scientist","pos":"n","meaning":"n. 科學家","example":"The scientist hopes to find a new cure for the disease.","example_zh":"那位科學家希望找到這種疾病的新療法。"},{"id":2554,"word":"scold","pos":"v","meaning":"v. 責罵","example":"My mother scolded me for coming home so late.","example_zh":"我媽媽責罵我這麼晚才回家。"},{"id":2555,"word":"scoop","pos":"n","meaning":"n. 勺子；一勺；獨家消息 (v) 用勺子挖","example":"He added a scoop of ice cream to my cake.","example_zh":"他在我的蛋糕上加了一勺冰淇淋。"},{"id":2556,"word":"scout","pos":"n","meaning":"n. 童子軍；星探；球探","example":"A talent scout noticed the young singer at the school concert.","example_zh":"一位星探在學校音樂會上注意到了那位年輕歌手。"},{"id":2557,"word":"scratch","pos":"v","meaning":"v. 抓；搔；刮 (n) 抓傷；刮痕","example":"The cat scratched the sofa and left marks on it.","example_zh":"那隻貓抓了沙發，在上面留下痕跡。"},{"id":2558,"word":"scream","pos":"v","meaning":"v. 尖叫 (n) 尖叫聲","example":"She screamed when she saw a big spider on the wall.","example_zh":"她看到牆上有一隻大蜘蛛時尖叫了起來。"},{"id":2559,"word":"screw","pos":"n","meaning":"n. 螺旋；螺絲","example":"One screw in the chair is loose, so it shakes a little.","example_zh":"椅子上有一顆螺絲鬆了，所以會有點晃動。"},{"id":2560,"word":"screwdriver","pos":"n","meaning":"n. 螺絲起子","example":"Can you pass me the screwdriver on the table?","example_zh":"你可以把桌上的螺絲起子遞給我嗎？"},{"id":2561,"word":"scrub","pos":"v","meaning":"v. 洗刷 (n) 洗刷","example":"I scrubbed the dirty floor for an hour until it was clean.","example_zh":"我把髒地板刷了一個小時，直到它變乾淨。"},{"id":2562,"word":"sculpture","pos":"n","meaning":"n. 雕刻（品）","example":"The museum has a famous sculpture of a dancing girl.","example_zh":"這間博物館有一件著名的舞蹈少女雕塑。"},{"id":2563,"word":"seagull","pos":"n","meaning":"n. 海鷗","example":"A seagull flew over the harbor looking for food.","example_zh":"一隻海鷗飛過港口尋找食物。"},{"id":2564,"word":"seal","pos":"n","meaning":"n. 封條；印鑑；海豹 (v) 密封；蓋章","example":"She sealed the envelope and put it in the mailbox.","example_zh":"她把信封封好，然後投進了郵筒。"},{"id":2565,"word":"secondary","pos":"adj","meaning":"adj. 次要的；第二的","example":"Money is of secondary importance to her; she cares more about her dream.","example_zh":"金錢對她而言是次要的，她更在乎自己的夢想。"},{"id":2566,"word":"secret","pos":"n","meaning":"n. 秘密 (adj) 秘密的","example":"Can you keep a secret if I tell you something about her?","example_zh":"如果我告訴你一件關於她的事，你能保守祕密嗎？"},{"id":2567,"word":"security","pos":"n","meaning":"n. 安全（感）","example":"The airport has strict security to keep all passengers safe.","example_zh":"機場有嚴格的安全措施來確保所有乘客的安全。"},{"id":2568,"word":"see for oneself","pos":"phr","meaning":"phr. 親自看看","example":"If you don't believe me, go and see for yourself.","example_zh":"如果你不相信我，就親自去看看吧。"},{"id":2569,"word":"seek","pos":"v","meaning":"v. 尋求","example":"Many people seek advice from their friends when they feel confused.","example_zh":"許多人感到困惑時會向朋友尋求建議。"},{"id":2570,"word":"seek out","pos":"phr","meaning":"phr. 找出","example":"The detective tried to seek out the truth behind the strange case.","example_zh":"偵探試圖找出那起怪案背後的真相。"},{"id":2571,"word":"seem","pos":"v","meaning":"v. 看來，似乎","example":"You seem tired today. Did you stay up late last night?","example_zh":"你今天看起來很累。你昨晚熬夜了嗎？"},{"id":2572,"word":"seize","pos":"v","meaning":"v. 抓住；把握","example":"The eagle seized a fish from the river with its sharp claws.","example_zh":"那隻老鷹用鋒利的爪子從河裡抓住一條魚。"},{"id":2573,"word":"seldom","pos":"adv","meaning":"adv. 很少；不常","example":"My grandfather seldom watches TV because he prefers reading books.","example_zh":"我爺爺很少看電視，因為他比較喜歡讀書。"},{"id":2574,"word":"select","pos":"v","meaning":"v. 挑選","example":"You can select one of the three colors for your new bike.","example_zh":"你可以從三種顏色中挑選一種作為新腳踏車的顏色。"},{"id":2575,"word":"selection","pos":"n","meaning":"n. 挑選，選擇","example":"This restaurant has a large selection of vegetarian dishes.","example_zh":"這家餐廳有各式各樣的素食料理可供選擇。"},{"id":2576,"word":"semester","pos":"n","meaning":"n. 學期","example":"I will take six courses next semester.","example_zh":"我下學期會修六門課。"},{"id":2577,"word":"senior","pos":"adj","meaning":"adj. 較年長的；資深的 (n) 較年長或資深者；大四或高三學生","example":"Senior students usually have to prepare for the college entrance exam.","example_zh":"高年級的學生通常得準備大學入學考試。"},{"id":2578,"word":"sense","pos":"v","meaning":"v. 感覺到，意識到 (n) 感覺，意識","example":"The dog sensed danger and began to bark loudly.","example_zh":"那隻狗察覺到危險，開始大聲吠叫。"},{"id":2579,"word":"sensible","pos":"adj","meaning":"adj. 明理的；明智的","example":"It is sensible to wear a helmet when you ride a motorcycle.","example_zh":"騎機車時戴安全帽是明智的。"},{"id":2580,"word":"sensitive","pos":"adj","meaning":"adj. 敏感的","example":"My skin is very sensitive, so I can't use this kind of soap.","example_zh":"我的皮膚很敏感，所以不能用這種肥皂。"},{"id":2581,"word":"sensitivity","pos":"n","meaning":"n. 體貼，善解人意","example":"Her sensitivity to other people's feelings makes her a great friend.","example_zh":"她對別人感受的體貼讓她成為一個很棒的朋友。"},{"id":2582,"word":"separate","pos":"v","meaning":"v. 分隔，分開 (adj) 分開的","example":"The river separates the city into two parts.","example_zh":"這條河把城市分隔成兩個部分。"},{"id":2583,"word":"separation","pos":"n","meaning":"n. 分離","example":"The long separation from her family made her feel very lonely.","example_zh":"與家人長期分離讓她感到非常孤單。"},{"id":2584,"word":"serve","pos":"v","meaning":"v. 服務，當作～","example":"This old box can serve as a table when we have a picnic.","example_zh":"我們野餐時，這個舊箱子可以當作桌子。"},{"id":2585,"word":"service","pos":"n","meaning":"n. 服務，宗教儀式","example":"The waiter at the restaurant gave us excellent service.","example_zh":"那家餐廳的服務生給了我們極佳的服務。"},{"id":2586,"word":"set off","pos":"phr","meaning":"phr. 出發、動身","example":"We set off for the mountain at five o'clock in the morning.","example_zh":"我們早上五點動身前往山上。"},{"id":2587,"word":"settler","pos":"n","meaning":"n. 移民；殖民者","example":"The early settlers built simple houses near the river.","example_zh":"早期的移民在河邊蓋了簡陋的房子。"},{"id":2588,"word":"severe","pos":"adj","meaning":"adj. 嚴厲的；嚴重的","example":"The severe storm caused serious damage to the coastal towns.","example_zh":"這場嚴重的風暴對沿海城鎮造成了重大損害。"},{"id":2589,"word":"severity","pos":"n","meaning":"n. 嚴重性，劇烈","example":"The doctor explained the severity of his illness to the family.","example_zh":"醫生向家屬說明了他病情的嚴重程度。"},{"id":2590,"word":"sew","pos":"v","meaning":"v. 縫","example":"My grandmother taught me how to sew a button on a shirt.","example_zh":"我奶奶教我如何在襯衫上縫鈕扣。"},{"id":2591,"word":"sex","pos":"n","meaning":"n. 性別；性行為","example":"You don't have to write your sex on the library card form.","example_zh":"你不需要在圖書證的申請表上填寫性別。"},{"id":2592,"word":"sexual","pos":"adj","meaning":"adj. 性（別）的；性方面的","example":"The company was fined for sexual discrimination against its workers.","example_zh":"那家公司因對員工的性別歧視而被罰款。"},{"id":2593,"word":"sexy","pos":"adj","meaning":"adj. 性感的","example":"Some people think short hair looks sexy on a woman.","example_zh":"有些人認為短髮在女生身上看起來很性感。"},{"id":2594,"word":"shabby","pos":"adj","meaning":"adj. 破舊的，破爛的","example":"The shabby old house looked like no one had lived there for years.","example_zh":"那棟破舊的老房子看起來好像已經好幾年沒人住了。"},{"id":2595,"word":"shade","pos":"n","meaning":"n. 陰影；陰涼處；（色彩）濃淡；色調 (v) 遮蔽","example":"We sat in the shade of a big tree to avoid the hot sun.","example_zh":"我們坐在大樹的陰涼處躲避炙熱的太陽。"},{"id":2596,"word":"shadow","pos":"n","meaning":"n. 影子","example":"In the evening, our shadows on the ground grew very long.","example_zh":"傍晚時，我們在地上的影子變得很長。"},{"id":2597,"word":"shady","pos":"adj","meaning":"adj. 遮蔽的","example":"We found a shady spot under the trees and had lunch there.","example_zh":"我們在樹下找到一個有遮蔭的地方，並在那裡吃了午餐。"},{"id":2598,"word":"shallow","pos":"adj","meaning":"adj. 淺的；膚淺的","example":"The water near the beach is shallow, so it is safe for small children.","example_zh":"海灘附近的水很淺，所以對小孩來說很安全。"},{"id":2599,"word":"shame","pos":"n","meaning":"n. 羞愧；恥辱；可惜的事；憾事","example":"It's a shame that you can't join us for the trip.","example_zh":"你不能和我們一起去旅行真是可惜。"},{"id":2600,"word":"shameful","pos":"adj","meaning":"adj. 可恥的","example":"It is shameful to laugh at people who are trying their best.","example_zh":"嘲笑那些正在盡力的人是可恥的。"},{"id":2601,"word":"shampoo","pos":"n","meaning":"n. 洗髮精 (v) 洗頭髮","example":"This shampoo makes my hair soft and smell like flowers.","example_zh":"這款洗髮精讓我的頭髮變得柔軟，而且有花的香味。"},{"id":2602,"word":"sharp","pos":"adj","meaning":"adj. 敏銳的，銳利的","example":"The chef used a sharp knife to cut the meat into thin slices.","example_zh":"主廚用一把鋒利的刀把肉切成薄片。"},{"id":2603,"word":"shave","pos":"v","meaning":"v. 刮（鬍子） (n) 刮鬍子","example":"My father shaves every morning before going to work.","example_zh":"我爸爸每天早上上班前都會刮鬍子。"},{"id":2604,"word":"shaver","pos":"n","meaning":"n. 刮鬍刀","example":"He bought an electric shaver as a birthday gift for his dad.","example_zh":"他買了一把電動刮鬍刀當作爸爸的生日禮物。"},{"id":2605,"word":"shelter","pos":"n","meaning":"n. 庇護；庇護所；避難所","example":"The hikers found a small cave and used it as a shelter from the storm.","example_zh":"登山客找到一個小山洞，把它當作躲避暴風雨的庇護所。"},{"id":2606,"word":"shepherd","pos":"n","meaning":"n. 牧羊人","example":"The shepherd led his sheep to the green hills every morning.","example_zh":"那位牧羊人每天早上都帶著他的羊群到綠色的山丘上。"},{"id":2607,"word":"shift","pos":"n","meaning":"n. 改變；輪值；輪班 (v) 改變；變速；換檔","example":"My mother works the night shift at the hospital three days a week.","example_zh":"我媽媽每週有三天在醫院上夜班。"},{"id":2608,"word":"shine","pos":"v","meaning":"v. 發亮(shone, shone); (v)擦亮(shined, shined)","example":"The stars shine brightly in the sky on a clear night.","example_zh":"晴朗的夜晚，星星在天空中閃閃發亮。"},{"id":2609,"word":"shiny","pos":"adj","meaning":"adj. 發亮的","example":"He polished his shoes until they were shiny.","example_zh":"他把鞋子擦到閃閃發亮。"},{"id":2610,"word":"shorten","pos":"v","meaning":"v. 縮短；變短","example":"The tailor will shorten these pants by three centimeters.","example_zh":"裁縫師會把這條褲子縮短三公分。"},{"id":2611,"word":"shortly","pos":"adv","meaning":"adv. 不久；馬上","example":"The train will leave shortly, so please take your seats.","example_zh":"火車即將開出，請就座。"},{"id":2612,"word":"shortsighted","pos":"adj","meaning":"adj. 近視的；無遠見的","example":"Being shortsighted, he cannot read the board without his glasses.","example_zh":"因為近視，他沒戴眼鏡就看不清黑板上的字。"},{"id":2613,"word":"shovel","pos":"n","meaning":"n. 鏟子 (v) 用鏟子鏟","example":"The workers used a shovel to dig a hole in the ground.","example_zh":"工人們用鏟子在地上挖了一個洞。"},{"id":2614,"word":"shrink","pos":"v","meaning":"v. 縮水；退縮","example":"My sweater shrank after I washed it in hot water.","example_zh":"我的毛衣用熱水洗過後縮水了。"},{"id":2615,"word":"shrug","pos":"v","meaning":"v. 聳肩 (n) 聳肩","example":"When I asked him what happened, he just shrugged and walked away.","example_zh":"我問他發生了什麼事，他只是聳聳肩就走開了。"},{"id":2616,"word":"shuttle","pos":"n","meaning":"n. 太空梭；接駁車 (v) 接駁","example":"A free shuttle takes visitors from the airport to the hotel.","example_zh":"一輛免費接駁車載著旅客從機場前往飯店。"},{"id":2617,"word":"sigh","pos":"v","meaning":"v. 嘆氣 (n) 嘆息","example":"She sighed deeply when she saw the big pile of homework.","example_zh":"她看到那一大堆作業時深深地嘆了一口氣。"},{"id":2618,"word":"sight","pos":"n","meaning":"n. 景色，視力，看到","example":"The sight of the sunrise over the sea took our breath away.","example_zh":"海上日出的景色讓我們屏息驚嘆。"},{"id":2619,"word":"sightseeing","pos":"n","meaning":"n. 觀光","example":"We spent the whole afternoon sightseeing in the old town.","example_zh":"我們整個下午都在古城區觀光。"},{"id":2620,"word":"signal","pos":"n","meaning":"n. 信號 (v) 打信號；用信號通知","example":"The driver gave a signal before turning left at the corner.","example_zh":"司機在路口左轉前打了信號。"},{"id":2621,"word":"signature","pos":"n","meaning":"n. 簽名","example":"Please write your signature at the bottom of the form.","example_zh":"請在表格底部簽上你的名字。"},{"id":2622,"word":"significance","pos":"n","meaning":"n. 重要（性）","example":"The significance of this event was not clear until many years later.","example_zh":"這個事件的重要性直到許多年後才變得清楚。"},{"id":2623,"word":"significant","pos":"adj","meaning":"adj. 重要的；有特殊意義的","example":"There has been a significant change in the weather over the past decade.","example_zh":"過去十年間，天氣發生了顯著的變化。"},{"id":2624,"word":"signify","pos":"v","meaning":"v. 意味著，象徵","example":"In many cultures, a white dress signifies purity and new beginnings.","example_zh":"在許多文化中，白色禮服象徵純潔與新的開始。"},{"id":2625,"word":"silence","pos":"n","meaning":"n. 寂靜，無聲","example":"The library is a place where silence is required.","example_zh":"圖書館是個需要保持安靜的地方。"},{"id":2626,"word":"silent","pos":"adj","meaning":"adj. 沈默的","example":"He stayed silent during the meeting because he didn't know what to say.","example_zh":"他在會議中保持沉默，因為他不知道該說什麼。"},{"id":2627,"word":"similar","pos":"adj","meaning":"adj. 相似的，類似的","example":"The two sisters have similar taste in music and clothes.","example_zh":"這對姊妹在音樂和服裝上的品味很相似。"},{"id":2628,"word":"similarity","pos":"n","meaning":"n. 相似處","example":"There is a strong similarity between the two paintings.","example_zh":"這兩幅畫之間有很高的相似度。"},{"id":2629,"word":"simply","pos":"adv","meaning":"adv. 僅僅，只是","example":"I simply wanted to say thank you for your kindness.","example_zh":"我只是想為你的善意說聲謝謝。"},{"id":2630,"word":"simultaneous","pos":"adj","meaning":"adj. 同時的","example":"The two runners crossed the finish line at simultaneous moments, so the race ended in a tie.","example_zh":"兩名跑者在同一時刻衝過終點線，所以比賽以平手收場。"},{"id":2631,"word":"simultaneously","pos":"adv","meaning":"adv. 同時地","example":"Two people in the class raised their hands simultaneously.","example_zh":"班上有兩個人同時舉起了手。"},{"id":2632,"word":"sin","pos":"n","meaning":"n. （宗教的）罪","example":"In some religions, telling lies is considered a sin.","example_zh":"在某些宗教中，說謊被視為一種罪。"},{"id":2633,"word":"sincere","pos":"adj","meaning":"adj. 認真的；真誠的","example":"He gave me a sincere apology for being late.","example_zh":"他為遲到而向我誠懇地道歉。"},{"id":2634,"word":"sincerity","pos":"n","meaning":"n. 誠意","example":"I doubt the sincerity of his promise because he has lied before.","example_zh":"我懷疑他承諾的誠意，因為他以前說過謊。"},{"id":2635,"word":"singular","pos":"adj","meaning":"adj. 單數的 (n) 單數（形）","example":"The singular form of \"children\" is \"child.\"","example_zh":"「children」的單數形是「child」。"},{"id":2636,"word":"sip","pos":"v","meaning":"v. 啜飲 (n) 一小口","example":"She sipped her hot tea slowly while reading a book.","example_zh":"她一邊看書，一邊慢慢啜飲熱茶。"},{"id":2637,"word":"sit back","pos":"phr","meaning":"phr. 不採取行動，悠閒坐好","example":"You can't just sit back and wait for good things to happen.","example_zh":"你不能只是袖手旁觀，等著好事發生。"},{"id":2638,"word":"site","pos":"n","meaning":"n. 地點；場所","example":"The old factory is the site of the new shopping mall.","example_zh":"那座舊工廠是新購物中心的所在地。"},{"id":2639,"word":"situation","pos":"n","meaning":"n. 情況；局勢","example":"The situation got worse when the heavy rain continued for three days.","example_zh":"大雨連續下了三天，情況變得更糟。"},{"id":2640,"word":"skate","pos":"n","meaning":"n. 溜冰鞋 (v) 溜冰","example":"He bought a new pair of skates and went to the ice rink.","example_zh":"他買了一雙新的溜冰鞋，然後去了溜冰場。"},{"id":2641,"word":"sketch","pos":"n","meaning":"n. 素描；梗概；大要 (v) 畫素描；略述；記述概要","example":"The artist made a quick sketch of the old man sitting by the window.","example_zh":"那位藝術家快速畫了一張坐在窗邊老人的素描。"},{"id":2642,"word":"ski","pos":"v","meaning":"v. 滑雪 (n) 滑雪板","example":"We plan to ski in Japan during the winter vacation.","example_zh":"我們計畫在寒假時到日本滑雪。"}]},
{"unit":21,"unit_label":"p.41-42","words":[{"id":2643,"word":"skip","pos":"v","meaning":"v. 跳躍；略過；漏掉","example":"I skipped breakfast this morning because I was running late.","example_zh":"我今天早上因為快遲到，所以沒吃早餐。"},{"id":2644,"word":"skyscraper","pos":"n","meaning":"n. 摩天樓","example":"The city is famous for its tall skyscrapers and busy streets.","example_zh":"這座城市以高聳的摩天大樓和熱鬧的街道聞名。"},{"id":2645,"word":"slash","pos":"v","meaning":"v. 割砍，大幅刪減","example":"The company slashed prices by half to attract more customers.","example_zh":"那家公司把價格砍了一半，以吸引更多顧客。"},{"id":2646,"word":"slave","pos":"n","meaning":"n. 奴隸 (v) 像奴隸般地工作；做苦工","example":"In the past, many slaves were forced to work in the fields all day.","example_zh":"過去許多奴隸被迫整天在田裡工作。"},{"id":2647,"word":"sleeve","pos":"n","meaning":"n. 袖子","example":"The sleeve of her shirt was caught in the door.","example_zh":"她襯衫的袖子被門夾住了。"},{"id":2648,"word":"slice","pos":"n","meaning":"n. 一片 (v) 把～切成薄片","example":"Would you like a slice of cheese on your sandwich?","example_zh":"你的三明治上要不要加一片起司？"},{"id":2649,"word":"slight","pos":"adj","meaning":"adj. 微小的；輕微的","example":"There is only a slight difference between these two colors.","example_zh":"這兩種顏色之間只有些微的差別。"},{"id":2650,"word":"slightly","pos":"adv","meaning":"adv. 稍微，略微","example":"The price of oil has risen slightly since last week.","example_zh":"油價從上週起略微上漲。"},{"id":2651,"word":"slip","pos":"v","meaning":"v. 滑落，滑倒；悄然逝去","example":"He slipped on the wet floor and hurt his back.","example_zh":"他在濕滑的地板上滑倒，弄傷了背。"},{"id":2652,"word":"slippery","pos":"adj","meaning":"adj. 滑溜的","example":"Be careful when you walk on the stairs because they are slippery.","example_zh":"走樓梯時要小心，因為樓梯很滑。"},{"id":2653,"word":"slogan","pos":"n","meaning":"n. 標語；口號","example":"The company's slogan is easy to remember and full of energy.","example_zh":"這家公司的標語容易記，而且充滿活力。"},{"id":2654,"word":"slope","pos":"n","meaning":"n. 斜坡","example":"The children rolled down the grassy slope and laughed happily.","example_zh":"孩子們從長滿草的斜坡滾下去，開心地笑著。"},{"id":2655,"word":"smash","pos":"v","meaning":"v. 使摧毀，粉碎 (n) 破碎聲","example":"The strong wind smashed the window and sent glass all over the floor.","example_zh":"強風打碎了窗戶，玻璃散落一地。"},{"id":2656,"word":"smog","pos":"n","meaning":"n. 煙霧","example":"Heavy smog covered the city, and many people wore masks outside.","example_zh":"濃厚的煙霧籠罩著這座城市，許多人外出時戴著口罩。"},{"id":2657,"word":"smooth","pos":"adj","meaning":"adj. 平滑的；平穩的 (v) 使平滑","example":"The surface of the lake was smooth like a mirror.","example_zh":"湖面平滑得像一面鏡子。"},{"id":2658,"word":"snap","pos":"v","meaning":"v. 突然折斷；（使）發出啪噠聲 (n) 啪噠聲（常用單數形）","example":"The branch snapped under the weight of the heavy snow.","example_zh":"樹枝在厚重積雪的重量下突然折斷了。"},{"id":2659,"word":"sneak","pos":"v","meaning":"v. 鬼鬼祟祟行事 (n) 鬼鬼祟祟的人","example":"The boy sneaked into the kitchen at midnight to get some cookies.","example_zh":"那個男孩在半夜偷偷溜進廚房拿餅乾。"},{"id":2660,"word":"sneaker","pos":"n","meaning":"n. 球鞋","example":"I need to buy a new pair of sneakers for gym class.","example_zh":"我需要買一雙新球鞋來上體育課。"},{"id":2661,"word":"sneaky","pos":"adj","meaning":"adj. 鬼鬼祟祟的","example":"The sneaky cat quietly stole a piece of fish from the table.","example_zh":"那隻鬼鬼祟祟的貓悄悄從桌上偷走了一塊魚。"},{"id":2662,"word":"sneeze","pos":"v","meaning":"v. 打噴嚏 (n) 噴嚏","example":"Pollen makes me sneeze a lot in spring.","example_zh":"春天時花粉讓我一直打噴嚏。"},{"id":2663,"word":"soak","pos":"v","meaning":"v. 浸泡，濕透","example":"You should soak the dirty clothes in water for half an hour.","example_zh":"你應該把髒衣服泡在水裡半小時。"},{"id":2664,"word":"soar","pos":"v","meaning":"v. 劇增，高飛","example":"Prices of vegetables soared after the typhoon destroyed many farms.","example_zh":"颱風摧毀許多農田後，蔬菜價格飆升。"},{"id":2665,"word":"soaring","pos":"adj","meaning":"adj. 遽增的，驟升的","example":"Soaring housing prices have made it difficult for young people to buy a home.","example_zh":"飆升的房價讓年輕人很難買得起房子。"},{"id":2666,"word":"sob","pos":"v","meaning":"v. 啜泣；嗚咽 (n) 啜泣；嗚咽","example":"The little girl sobbed quietly in the corner after losing her toy.","example_zh":"小女孩弄丟玩具後，在角落裡靜靜地啜泣。"},{"id":2667,"word":"socket","pos":"n","meaning":"n. 插座","example":"There is only one socket in my room, so I have to share it.","example_zh":"我房間裡只有一個插座，所以我得和別人共用。"},{"id":2668,"word":"software","pos":"n","meaning":"n. 軟體","example":"The company developed new software to help students learn English.","example_zh":"那家公司開發了新的軟體來幫助學生學英文。"},{"id":2669,"word":"solar","pos":"adj","meaning":"adj. 太陽的","example":"Solar energy is clean and will never run out.","example_zh":"太陽能很乾淨，而且永遠不會用完。"},{"id":2670,"word":"sole","pos":"adj","meaning":"adj. 唯一的，單獨的 (n) 鞋底，腳底","example":"The sole reason I called you is to say sorry.","example_zh":"我打電話給你的唯一原因就是向你道歉。"},{"id":2671,"word":"solid","pos":"adj","meaning":"adj. 固體的；內容充實的；堅固的 (n) 固體","example":"Ice is the solid form of water.","example_zh":"冰是水的固體形態。"},{"id":2672,"word":"solution","pos":"n","meaning":"n. 解決方法","example":"We are still looking for a good solution to the traffic problem.","example_zh":"我們仍在尋找解決這個交通問題的好方法。"},{"id":2673,"word":"solve","pos":"v","meaning":"v. 解決","example":"It took me an hour to solve this difficult math problem.","example_zh":"我花了一個小時才解開這道困難的數學題。"},{"id":2674,"word":"someday","pos":"adv","meaning":"adv. 將來有一天","example":"I hope to visit the Alps someday.","example_zh":"我希望有一天能去阿爾卑斯山。"},{"id":2675,"word":"somehow","pos":"adv","meaning":"adv. 以某種方法；不知何故","example":"The old car somehow made it to the top of the hill.","example_zh":"那輛舊車不知怎麼地開上了山頂。"},{"id":2676,"word":"sometime","pos":"adv","meaning":"adv. 過去或未來的某個時候","example":"Let's get together sometime next week for lunch.","example_zh":"我們下週找個時間一起吃午餐吧。"},{"id":2677,"word":"somewhat","pos":"adv","meaning":"adv. 有一點；幾分","example":"I felt somewhat nervous before the speech, but it went well.","example_zh":"演講前我有點緊張，但後來進行得很順利。"},{"id":2678,"word":"sooner or later","pos":"phr","meaning":"phr. 遲早","example":"If you keep ignoring your health, you will get sick sooner or later.","example_zh":"如果你一直忽視自己的健康，遲早會生病。"},{"id":2679,"word":"sophomore","pos":"n","meaning":"n. 大二或高二學生","example":"A sophomore at our school won the national speech contest.","example_zh":"我們學校一位高二學生贏得了全國演講比賽。"},{"id":2680,"word":"sore","pos":"adj","meaning":"adj. 痠痛的；疼痛的","example":"My legs were sore after climbing the mountain all day.","example_zh":"爬了一整天的山後，我的腿很痠痛。"},{"id":2681,"word":"sorrow","pos":"n","meaning":"n. 悲傷（的事）","example":"She felt deep sorrow when her old dog passed away.","example_zh":"她的老狗過世時，她感到深深的悲傷。"},{"id":2682,"word":"sorrowful","pos":"adj","meaning":"adj. 悲傷的","example":"The sorrowful music made many people in the audience cry.","example_zh":"那首悲傷的音樂讓許多觀眾落淚。"},{"id":2683,"word":"sort of","pos":"phr","meaning":"phr. 有點兒，有幾分","example":"I was sort of tired, so I went to bed early.","example_zh":"我有點累，所以很早就上床睡覺了。"},{"id":2684,"word":"source","pos":"n","meaning":"n. 來源","example":"Fruits and vegetables are good sources of vitamins.","example_zh":"水果和蔬菜是維生素的良好來源。"},{"id":2685,"word":"souvenir","pos":"n","meaning":"n. 紀念品","example":"I bought a small souvenir for my sister at the night market.","example_zh":"我在夜市為姊姊買了一件小紀念品。"},{"id":2686,"word":"spade","pos":"n","meaning":"n. 鏟子；黑桃","example":"The gardener dug a hole in the ground with a spade.","example_zh":"園丁用鏟子在地上挖了一個洞。"},{"id":2687,"word":"spare","pos":"v","meaning":"v. 撥出時間；吝惜；節省 (adj) 備用的；空閒的；多餘的 (n) 備用品","example":"Can you spare a few minutes to help me with my homework?","example_zh":"你能撥出幾分鐘幫我寫作業嗎？"},{"id":2688,"word":"spark","pos":"n","meaning":"n. 火花 (v) 引起","example":"A small spark from the fire set the dry grass on fire.","example_zh":"營火冒出的一小點火花點燃了乾草。"},{"id":2689,"word":"sparkle","pos":"v","meaning":"v. 閃亮；閃爍 (n) 光芒；火花","example":"The stars sparkled brightly above the quiet lake.","example_zh":"星星在寧靜的湖面上閃閃發亮。"},{"id":2690,"word":"sparrow","pos":"n","meaning":"n. 麻雀","example":"A sparrow sat on the fence and sang a cheerful song.","example_zh":"一隻麻雀停在籬笆上唱著歡快的歌。"},{"id":2691,"word":"spear","pos":"n","meaning":"n. 矛；魚叉；刺","example":"The hunters carried long spears when they walked into the forest.","example_zh":"獵人們走進森林時帶著長矛。"},{"id":2692,"word":"species","pos":"n","meaning":"n. 物種","example":"Many species of animals are in danger of dying out.","example_zh":"許多種動物正面臨絕種的危機。"},{"id":2693,"word":"specific","pos":"adj","meaning":"adj. 明確的；特定的","example":"Could you give me a specific example to help me understand?","example_zh":"你可以給我一個具體的例子幫助我理解嗎？"},{"id":2694,"word":"specifically","pos":"adv","meaning":"adv. 特別地，尤其","example":"This course is designed specifically for beginners who have never studied English.","example_zh":"這門課是專門為從未學過英文的初學者設計的。"},{"id":2695,"word":"specify","pos":"v","meaning":"v. 明確說明","example":"The rules specify that students must wear uniforms on Mondays.","example_zh":"規定明確指出學生星期一必須穿制服。"},{"id":2696,"word":"speech","pos":"n","meaning":"n. 演說，演講","example":"The principal gave a short speech at the opening ceremony.","example_zh":"校長在開學典禮上發表了一段簡短的演說。"},{"id":2697,"word":"speed up","pos":"phr","meaning":"phr. 加速，促進","example":"The driver sped up when he saw the green light.","example_zh":"司機看到綠燈時加速了。"},{"id":2698,"word":"spice","pos":"n","meaning":"n. 香料；調味品；趣味","example":"Adding some spice to the soup makes it taste much better.","example_zh":"在湯裡加些香料會讓味道好很多。"},{"id":2699,"word":"spicy","pos":"adj","meaning":"adj. 辛辣的；放了很多佐料的","example":"I can't eat spicy food because it hurts my stomach.","example_zh":"我不能吃辛辣的食物，因為會讓我胃痛。"},{"id":2700,"word":"spill","pos":"v","meaning":"v. 潑灑 (n) 溢出（的東西）","example":"Be careful not to spill the hot soup on the table.","example_zh":"小心不要把熱湯灑在桌上。"},{"id":2701,"word":"spin","pos":"v","meaning":"v. （使）旋轉；紡紗；織網 (n) 旋轉","example":"The washing machine spins very fast to get the water out of the clothes.","example_zh":"洗衣機轉得很快，把衣服裡的水甩出來。"},{"id":2702,"word":"spiritual","pos":"adj","meaning":"adj. 精神上的 (n) 靈魂樂","example":"Many people visit the temple to find spiritual peace.","example_zh":"許多人造訪這座廟宇，尋求心靈上的平靜。"},{"id":2703,"word":"spit","pos":"v","meaning":"v. 吐；吐痰；吐口水","example":"You shouldn't spit on the street because it's rude and unhealthy.","example_zh":"你不該在街上吐口水，因為這既不禮貌又不衛生。"},{"id":2704,"word":"spite","pos":"n","meaning":"n. 惡意","example":"Out of spite, he threw away the gift his brother had given him.","example_zh":"出於惡意，他把哥哥送他的禮物丟掉了。"},{"id":2705,"word":"splash","pos":"v","meaning":"v. 濺 (n) 潑濺（聲）","example":"The children splashed water at each other in the swimming pool.","example_zh":"孩子們在游泳池裡互相潑水。"},{"id":2706,"word":"splendid","pos":"adj","meaning":"adj. 壯觀的；絕佳的","example":"We had a splendid view of the ocean from our hotel room.","example_zh":"我們從飯店房間能欣賞到絕佳的海景。"},{"id":2707,"word":"split","pos":"v","meaning":"v. 分攤；分成；劃分；（使）破裂","example":"Let's split the bill so everyone pays the same amount.","example_zh":"我們來分攤帳單，讓每個人付一樣的錢吧。"},{"id":2708,"word":"spoil","pos":"v","meaning":"v. 破壞；寵壞；（食物）腐壞","example":"The sudden rain spoiled our plan to have a picnic in the park.","example_zh":"突如其來的雨破壞了我們去公園野餐的計畫。"},{"id":2709,"word":"sportsman","pos":"n","meaning":"n. 運動家","example":"A true sportsman never gives up, even when he is losing the game.","example_zh":"真正的運動家即使在比賽落後時也絕不放棄。"},{"id":2710,"word":"sportsmanship","pos":"n","meaning":"n. 運動家精神","example":"The coach praised the team for showing great sportsmanship after the match.","example_zh":"教練稱讚球隊在比賽後展現出極佳的運動家精神。"},{"id":2711,"word":"sprain","pos":"v","meaning":"v. 扭傷 (n) 扭傷","example":"She sprained her ankle while playing basketball.","example_zh":"她打籃球時扭傷了腳踝。"},{"id":2712,"word":"spray","pos":"v","meaning":"v. 噴灑 (n) 噴液","example":"The farmer sprayed the plants to keep insects away.","example_zh":"農夫對植物噴灑藥劑以趕走昆蟲。"},{"id":2713,"word":"spread","pos":"v/n","meaning":"v/n. 散佈，普及（spread, spread）","example":"The news spread quickly through the whole school.","example_zh":"這個消息很快就在全校傳開了。"},{"id":2714,"word":"spring up","pos":"phr","meaning":"phr. 湧現，突然興起","example":"New coffee shops have sprung up all over the neighborhood.","example_zh":"這個社區到處都冒出新的咖啡店。"},{"id":2715,"word":"sprinkle","pos":"v","meaning":"v. 灑；撒","example":"She sprinkled some cheese on top of the pizza.","example_zh":"她在披薩上撒了一些起司。"},{"id":2716,"word":"spy","pos":"n","meaning":"n. 間諜 (v) 暗中監視","example":"The movie is about a spy who works for the government.","example_zh":"這部電影講的是一個替政府工作的間諜。"},{"id":2717,"word":"squeeze","pos":"v","meaning":"v. 擠壓","example":"He squeezed the lemon to get some juice for the tea.","example_zh":"他擠壓檸檬，榨些汁加進茶裡。"},{"id":2718,"word":"stab","pos":"v","meaning":"v. 戳；刺 (n) 戳；刺","example":"The little boy stabbed the cake with a fork.","example_zh":"小男孩用叉子戳了蛋糕。"},{"id":2719,"word":"stability","pos":"n","meaning":"n. 穩定","example":"The country needs political stability to develop its economy.","example_zh":"這個國家需要政治穩定才能發展經濟。"},{"id":2720,"word":"stabilize","pos":"v","meaning":"v. 使～穩定","example":"The government took action to stabilize the price of rice.","example_zh":"政府採取行動來穩定米價。"},{"id":2721,"word":"stable","pos":"adj","meaning":"adj. 穩定的","example":"The ladder isn't stable, so please hold it for me.","example_zh":"這把梯子不穩，請幫我扶著。"},{"id":2722,"word":"stadium","pos":"n","meaning":"n. 運動場","example":"Thousands of fans filled the stadium to watch the baseball game.","example_zh":"成千上萬的球迷擠滿了運動場，觀看這場棒球賽。"},{"id":2723,"word":"staff","pos":"n","meaning":"n. 全體員工","example":"The hotel staff are always friendly and ready to help guests.","example_zh":"這家飯店的員工總是很友善，隨時準備幫助客人。"},{"id":2724,"word":"stain","pos":"n/v","meaning":"n/v. 玷污，污點","example":"There is a coffee stain on my white shirt.","example_zh":"我的白襯衫上有一塊咖啡漬。"},{"id":2725,"word":"stale","pos":"adj","meaning":"adj. 不新鮮的","example":"The bread is stale because it has been left out for a week.","example_zh":"這個麵包放了一個星期，已經不新鮮了。"},{"id":2726,"word":"stand a chance of (doing something)","pos":"phr","meaning":"phr. 有可能達成","example":"Our team stands a chance of winning the championship if everyone plays well.","example_zh":"如果每個人都表現良好，我們隊有可能贏得冠軍。"},{"id":2727,"word":"stand out (from something)","pos":"phr","meaning":"phr. 突出，顯眼；出色，傑出","example":"Her bright red coat made her stand out from the crowd.","example_zh":"她那件鮮紅色的外套讓她在人群中顯得很突出。"},{"id":2728,"word":"stand up for","pos":"phr","meaning":"phr. 維護 支持","example":"You should stand up for your friends when others treat them unfairly.","example_zh":"當別人不公平地對待你的朋友時，你應該挺身維護他們。"},{"id":2729,"word":"star","pos":"v","meaning":"v. 主演","example":"The famous actress will star in a new movie next year.","example_zh":"那位著名的女演員明年將主演一部新電影。"},{"id":2730,"word":"stare","pos":"v","meaning":"v. 凝視；盯著看 (n) 凝視","example":"It's rude to stare at people when they are eating.","example_zh":"人家吃飯時盯著他們看是很沒禮貌的。"},{"id":2731,"word":"start over","pos":"phr","meaning":"phr. 重新開始","example":"I made a mistake in my drawing, so I had to start over.","example_zh":"我的畫畫錯了，所以必須重新開始。"},{"id":2732,"word":"starve","pos":"v","meaning":"v. （使）挨餓","example":"Without enough food, the animals in the forest might starve in winter.","example_zh":"沒有足夠的食物，森林裡的動物可能會在冬天挨餓。"},{"id":2733,"word":"starving","pos":"adj","meaning":"adj. 挨餓的","example":"I skipped lunch today, so I'm starving now.","example_zh":"我今天沒吃午餐，所以現在餓壞了。"},{"id":2734,"word":"statistical","pos":"adj","meaning":"adj. 統計的","example":"The statistical results show that more students are using tablets in class.","example_zh":"統計結果顯示，越來越多學生在課堂上使用平板電腦。"},{"id":2735,"word":"statistics","pos":"n","meaning":"n. 數據","example":"According to the latest statistics, the number of tourists has doubled.","example_zh":"根據最新的統計數據，遊客人數已經增加了一倍。"},{"id":2736,"word":"statue","pos":"n","meaning":"n. 雕像","example":"A bronze statue of the famous poet stands in the center of the park.","example_zh":"一座著名詩人的銅像矗立在公園中央。"},{"id":2737,"word":"status","pos":"n","meaning":"n. 地位；狀態","example":"The patient's health status is much better than it was last week.","example_zh":"病人的健康狀況比上星期好多了。"},{"id":2738,"word":"stay out","pos":"phr","meaning":"phr. 在外逗留，不回家","example":"My parents don't allow me to stay out after ten o'clock.","example_zh":"我父母不准我十點以後還在外面逗留。"},{"id":2739,"word":"stay up","pos":"phr","meaning":"phr. 熬夜","example":"I stayed up until two in the morning to finish my report.","example_zh":"我熬夜到凌晨兩點才寫完報告。"},{"id":2740,"word":"steady","pos":"adj","meaning":"adj. 穩定的；牢固的","example":"He has a steady job, so he can pay the rent every month.","example_zh":"他有一份穩定的工作，所以每個月都付得起房租。"},{"id":2741,"word":"steep","pos":"adj","meaning":"adj. 陡峭的；險峻的","example":"The road up the mountain is so steep that we had to stop and rest.","example_zh":"通往山上的路非常陡，我們不得不停下來休息。"},{"id":2742,"word":"stem","pos":"n","meaning":"n. 莖；幹 (v) 起源於","example":"Cut the stem of the flower at an angle before putting it in water.","example_zh":"把花放進水裡之前，先將花莖斜剪。"},{"id":2743,"word":"stepchild","pos":"n","meaning":"n. 前次婚姻的子女；繼子女","example":"The man treated his stepchild as if she were his own daughter.","example_zh":"那位男士把他的繼女當成自己的親生女兒一樣對待。"},{"id":2744,"word":"stepfather","pos":"n","meaning":"n. 繼父","example":"My stepfather taught me how to ride a bike when I was seven.","example_zh":"我七歲的時候，繼父教我騎腳踏車。"},{"id":2745,"word":"stepmother","pos":"n","meaning":"n. 繼母","example":"In the story, the stepmother treated Cinderella very badly.","example_zh":"在故事裡，繼母對灰姑娘非常刻薄。"},{"id":2746,"word":"stereo","pos":"n","meaning":"n. 立體音響","example":"He turned up the stereo, and the whole room was filled with music.","example_zh":"他把音響的音量調大，整個房間充滿了音樂。"},{"id":2747,"word":"stick","pos":"v","meaning":"v. 黏住；堅持，信守(+to N/Ving)","example":"The tape won't stick to the wall because it's too dusty.","example_zh":"這捲膠帶黏不在牆上，因為牆太多灰塵了。"},{"id":2748,"word":"sticky","pos":"adj","meaning":"adj. 具黏性的；黏膩的","example":"My hands felt sticky after I ate the sweet candy.","example_zh":"我吃了那顆甜糖果之後，覺得手黏黏的。"},{"id":2749,"word":"stiff","pos":"adj","meaning":"adj. 僵硬的；拘謹的","example":"My neck is stiff because I slept in a strange position.","example_zh":"我的脖子很僵硬，因為我睡覺的姿勢很奇怪。"},{"id":2750,"word":"stimulate","pos":"v","meaning":"v. 激發～興趣，提振","example":"A good teacher knows how to stimulate students' interest in learning.","example_zh":"好老師懂得如何激發學生的學習興趣。"},{"id":2751,"word":"stimulation","pos":"n","meaning":"n. 刺激，激發（興趣）","example":"Babies need plenty of stimulation to help their brains develop.","example_zh":"嬰兒需要大量的刺激來幫助大腦發展。"},{"id":2752,"word":"sting","pos":"v","meaning":"v. 螫 (n) 刺痛；螫","example":"A bee stung my arm while I was picking flowers.","example_zh":"我摘花的時候，一隻蜜蜂螫了我的手臂。"},{"id":2753,"word":"stingy","pos":"adj","meaning":"adj. 吝嗇的","example":"He is too stingy to buy his friends even a cup of coffee.","example_zh":"他吝嗇到連一杯咖啡都不肯請朋友喝。"},{"id":2754,"word":"stir","pos":"v","meaning":"v. 攪動；激起 (n) 攪動（常用單數形）；騷動；轟動","example":"Stir the soup slowly so that it doesn't burn.","example_zh":"慢慢攪動湯，這樣才不會燒焦。"},{"id":2755,"word":"stitch","pos":"n","meaning":"n. 一針 (v) 縫紉","example":"The nurse put three stitches in the cut on his hand.","example_zh":"護理師在他手上的傷口縫了三針。"},{"id":2756,"word":"stocking","pos":"n","meaning":"n. 長襪（常用複數形）","example":"She wore long stockings under her skirt on cold days.","example_zh":"天氣冷的時候，她會在裙子底下穿長襪。"},{"id":2757,"word":"stool","pos":"n","meaning":"n. 凳子","example":"The boy stood on a stool to reach the top shelf.","example_zh":"男孩站在凳子上，想拿最上層架子上的東西。"},{"id":2758,"word":"stormy","pos":"adj","meaning":"adj. 有暴風雨的","example":"We stayed at home all weekend because of the stormy weather.","example_zh":"因為天氣風雨交加，我們整個週末都待在家裡。"},{"id":2759,"word":"straight","pos":"adj/adv","meaning":"adj/adv. 筆直的","example":"Draw a straight line from point A to point B.","example_zh":"從A點到B點畫一條直線。"},{"id":2760,"word":"strategic","pos":"adj","meaning":"adj. 戰略的","example":"The island has a strategic position in the middle of the sea.","example_zh":"這座島位於海中央，具有戰略地位。"},{"id":2761,"word":"strategy","pos":"n","meaning":"n. 策略；戰略","example":"The company is working on a new strategy to attract young customers.","example_zh":"這家公司正在擬定一項新策略來吸引年輕顧客。"},{"id":2762,"word":"stream","pos":"v","meaning":"v. 照射，（液體）流，（人）湧入 (n) 溪流","example":"Sunlight streamed through the window and filled the room with warmth.","example_zh":"陽光從窗戶照射進來，使房間充滿溫暖。"},{"id":2763,"word":"strength","pos":"n","meaning":"n. 力量；優點；長處","example":"Patience is one of her greatest strengths.","example_zh":"耐心是她最大的優點之一。"},{"id":2764,"word":"strengthen","pos":"v","meaning":"v. 加強；變強","example":"Doing exercise regularly can strengthen your muscles.","example_zh":"規律運動可以強化你的肌肉。"},{"id":2765,"word":"strike","pos":"v","meaning":"v. （想法）浮上心頭，想到，撞擊，（災害）襲擊 (n) 罷工","example":"A great idea suddenly struck me while I was taking a shower.","example_zh":"我洗澡時，腦中突然閃過一個很棒的點子。"},{"id":2766,"word":"strip","pos":"v","meaning":"v. 脫掉（衣服）；剝掉 (n) 細長條","example":"He stripped off his wet jacket and hung it by the fire.","example_zh":"他脫下濕透的外套，掛在爐火旁。"},{"id":2767,"word":"strip away (something)","pos":"phr","meaning":"phr. 擺脫，揭去","example":"The workers began to strip away the old paint from the walls.","example_zh":"工人們開始剝除牆上的舊油漆。"},{"id":2768,"word":"strive","pos":"v","meaning":"v. 奮鬥；力求","example":"Students should strive to do their best in everything they do.","example_zh":"學生應該力求在所做的每件事上盡力而為。"},{"id":2769,"word":"stroke","pos":"n","meaning":"n. 中風；一擊；擊打 (v) 撫摸","example":"My grandfather had a stroke last year, but he is recovering well.","example_zh":"我爺爺去年中風，但他恢復得很好。"},{"id":2770,"word":"structure","pos":"n","meaning":"n. 結構；構造；建築物","example":"The structure of this essay is clear and easy to follow.","example_zh":"這篇文章的結構清楚，容易理解。"}]},
{"unit":22,"unit_label":"p.43-44","words":[{"id":2771,"word":"struggle","pos":"v/n","meaning":"v/n. 掙扎，奮鬥(+to V)","example":"He struggled to carry the heavy boxes up the stairs.","example_zh":"他吃力地努力把沉重的箱子搬上樓梯。"},{"id":2772,"word":"stubborn","pos":"adj","meaning":"adj. 固執的","example":"My little brother is so stubborn that he never listens to anyone.","example_zh":"我弟弟非常固執，從來不聽任何人的話。"},{"id":2773,"word":"studio","pos":"n","meaning":"n. 攝影棚；錄音室；藝術家的工作室","example":"The singer recorded her new song in a studio downtown.","example_zh":"那位歌手在市中心的錄音室錄製了她的新歌。"},{"id":2774,"word":"stuff","pos":"n","meaning":"n. 物品；東西；事情 (v) 填塞","example":"I left all my stuff in the locker before going swimming.","example_zh":"去游泳之前，我把所有東西都放在置物櫃裡了。"},{"id":2775,"word":"stuffed","pos":"adj","meaning":"adj. 吃飽的","example":"I'm stuffed after eating three bowls of rice.","example_zh":"我吃了三碗飯，已經吃撐了。"},{"id":2776,"word":"style","pos":"n","meaning":"n. 風格；時尚；流行式樣","example":"She has her own style of dressing, and everyone likes it.","example_zh":"她有自己的穿衣風格，大家都很喜歡。"},{"id":2777,"word":"submarine","pos":"n","meaning":"n. 潛水艇","example":"The submarine moved quietly under the deep sea.","example_zh":"潛水艇在深海中靜靜地前進。"},{"id":2778,"word":"substance","pos":"n","meaning":"n. 物質；實質；內容","example":"The substance in the bottle is harmful to the skin.","example_zh":"瓶子裡的物質對皮膚有害。"},{"id":2779,"word":"substantial","pos":"adj","meaning":"adj. 大量的，重大的；堅固的","example":"The company made a substantial profit this year.","example_zh":"這家公司今年獲得了可觀的利潤。"},{"id":2780,"word":"substantially","pos":"adv","meaning":"adv. 非常，大體來說","example":"The price of fuel has increased substantially since last year.","example_zh":"燃料價格自去年以來大幅上漲。"},{"id":2781,"word":"substitute","pos":"v/n","meaning":"v/n. 代替","example":"You can substitute honey for sugar in this recipe.","example_zh":"這道食譜中，你可以用蜂蜜代替糖。"},{"id":2782,"word":"suburb","pos":"n","meaning":"n. 郊區","example":"They moved to a quiet suburb outside the city.","example_zh":"他們搬到了城外一個安靜的郊區。"},{"id":2783,"word":"succeed","pos":"v","meaning":"v. 成功","example":"If you work hard, you will succeed in the end.","example_zh":"只要你努力，最後就會成功。"},{"id":2784,"word":"success","pos":"n","meaning":"n. 成功，成功的人事物","example":"The concert was a great success, and all the tickets were sold out.","example_zh":"這場演唱會非常成功，所有票都賣光了。"},{"id":2785,"word":"suck","pos":"v","meaning":"v. 吸；糟透；很遜","example":"The vacuum cleaner sucks up all the dust on the carpet.","example_zh":"吸塵器把地毯上所有的灰塵都吸走了。"},{"id":2786,"word":"sudden","pos":"adj","meaning":"adj. 突然的","example":"A sudden noise woke the baby in the middle of the night.","example_zh":"一陣突如其來的聲響在半夜吵醒了嬰兒。"},{"id":2787,"word":"suddenly","pos":"adv","meaning":"adv. 突然地","example":"The lights suddenly went out, and the room became completely dark.","example_zh":"燈突然熄滅，房間變得一片漆黑。"},{"id":2788,"word":"suffer","pos":"v","meaning":"v. 蒙受痛苦；遭受","example":"Many people in the area suffered from the heavy flood last summer.","example_zh":"去年夏天，這個地區有許多人遭受大水之苦。"},{"id":2789,"word":"sufficiency","pos":"n","meaning":"n. 充足","example":"Having a sufficiency of sleep is important for students' health.","example_zh":"擁有充足的睡眠對學生的健康很重要。"},{"id":2790,"word":"sufficient","pos":"adj","meaning":"adj. 足夠的","example":"We don't have sufficient time to finish all the work today.","example_zh":"我們今天沒有足夠的時間完成所有的工作。"},{"id":2791,"word":"sufficiently","pos":"adv","meaning":"adv. 充足地，足夠地","example":"The room was sufficiently large for all twenty students.","example_zh":"這個房間夠大，足以容納全部二十位學生。"},{"id":2792,"word":"suggest","pos":"v","meaning":"v. 建議；暗示","example":"I suggest that we take a taxi because it's already late.","example_zh":"我建議我們搭計程車，因為時間已經很晚了。"},{"id":2793,"word":"suggestion","pos":"n","meaning":"n. 建議；暗示；聯想","example":"Do you have any suggestions for our class trip this year?","example_zh":"你對我們今年的班遊有什麼建議嗎？"},{"id":2794,"word":"suicide","pos":"n","meaning":"n. 自殺（行為）","example":"The school invited a counselor to give a talk on suicide prevention.","example_zh":"學校邀請了一位輔導老師來演講，主題是自殺防治。"},{"id":2795,"word":"suit","pos":"v","meaning":"v. 適合 (n) 訴訟；成套衣服","example":"This blue jacket suits you very well.","example_zh":"這件藍色外套非常適合你。"},{"id":2796,"word":"suitable","pos":"adj","meaning":"adj. 適合的","example":"This movie is not suitable for children under twelve.","example_zh":"這部電影不適合十二歲以下的兒童觀看。"},{"id":2797,"word":"sum","pos":"n","meaning":"n. 總數；金額 (v) 總結","example":"He paid a large sum of money to buy the old painting.","example_zh":"他付了一大筆錢來買那幅古畫。"},{"id":2798,"word":"summarize","pos":"v","meaning":"v. 概述；總結","example":"Please summarize the main idea of the story in two sentences.","example_zh":"請用兩句話概述這個故事的主旨。"},{"id":2799,"word":"summary","pos":"n","meaning":"n. 摘要；總結","example":"Write a short summary of the article after you finish reading it.","example_zh":"讀完這篇文章後，請寫一篇簡短的摘要。"},{"id":2800,"word":"summit","pos":"n","meaning":"n. 山頂；頂峰","example":"After six hours of climbing, we finally reached the summit of the mountain.","example_zh":"爬了六個小時後，我們終於到達了山頂。"},{"id":2801,"word":"superb","pos":"adj","meaning":"adj. 極好的，卓越的","example":"The chef prepared a superb dinner for the guests.","example_zh":"主廚為客人準備了一頓極為出色的晚餐。"},{"id":2802,"word":"superior","pos":"adj","meaning":"adj. 較好的；優秀的 (n) 上司","example":"This brand of coffee is far superior to the others I have tried.","example_zh":"這個牌子的咖啡比我試過的其他牌子好得多。"},{"id":2803,"word":"superiority","pos":"n","meaning":"n. 優越，優勢","example":"The team's superiority over its rivals was clear from the first minute.","example_zh":"這支球隊從第一分鐘起就明顯勝過對手。"},{"id":2804,"word":"superstition","pos":"n","meaning":"n. 迷信","example":"Some people avoid the number four because of an old superstition.","example_zh":"有些人因為一種古老的迷信而避開數字四。"},{"id":2805,"word":"superstitious","pos":"adj","meaning":"adj. 迷信的","example":"My grandmother is very superstitious and never cuts her hair on certain days.","example_zh":"我奶奶非常迷信，在某些日子絕不剪頭髮。"},{"id":2806,"word":"supervise","pos":"v","meaning":"v. 監督，督導","example":"A teacher will supervise the students during the field trip.","example_zh":"校外教學期間會有一位老師負責督導學生。"},{"id":2807,"word":"supervision","pos":"n","meaning":"n. 監督","example":"Young children should not swim without adult supervision.","example_zh":"年幼的孩子沒有大人監督時不應該游泳。"},{"id":2808,"word":"supervisor","pos":"n","meaning":"n. 監督者，指導者","example":"My supervisor gave me some useful advice on my first project.","example_zh":"我的主管針對我的第一個專案給了我一些有用的建議。"},{"id":2809,"word":"supplement","pos":"v/n","meaning":"v/n. 補充，增補，補給品","example":"Many people take vitamins to supplement their daily diet.","example_zh":"許多人服用維他命來補充日常飲食的不足。"},{"id":2810,"word":"supplemental","pos":"adj","meaning":"adj. 補充的","example":"The teacher handed out supplemental materials to help us prepare for the exam.","example_zh":"老師發了補充教材來幫助我們準備考試。"},{"id":2811,"word":"supplies","pos":"n","meaning":"n pl. 生活必需品","example":"We packed enough supplies, including water and food, for the three-day hike.","example_zh":"我們為三天的健行準備了足夠的物資，包括水和食物。"},{"id":2812,"word":"supply","pos":"v","meaning":"v. 供應 (n) 供給量","example":"The farm supplies fresh eggs to many local restaurants.","example_zh":"這座農場供應新鮮雞蛋給許多當地餐廳。"},{"id":2813,"word":"support","pos":"v/n","meaning":"v/n. 支持","example":"My parents always support my decisions, even when they are difficult.","example_zh":"我父母總是支持我的決定，即使那些決定很困難。"},{"id":2814,"word":"supporter","pos":"n","meaning":"n. 支持者","example":"The loud supporters cheered for their team throughout the whole game.","example_zh":"熱情的支持者在整場比賽中都為他們的球隊加油。"},{"id":2815,"word":"suppose","pos":"v","meaning":"v. 猜想；認為；假定","example":"I suppose he missed the bus, so he is late again.","example_zh":"我猜他錯過了公車，所以又遲到了。"},{"id":2816,"word":"surf","pos":"v","meaning":"v. 衝浪；上網 (n) 浪花；海浪","example":"Many tourists come to Taiwan to surf on the east coast.","example_zh":"許多遊客來到台灣，在東海岸衝浪。"},{"id":2817,"word":"surgeon","pos":"n","meaning":"n. 外科醫生","example":"The surgeon spent five hours operating on the patient.","example_zh":"那位外科醫生花了五個小時為病人動手術。"},{"id":2818,"word":"surgery","pos":"n","meaning":"n. 手術","example":"He had surgery on his knee after the car accident.","example_zh":"車禍之後，他的膝蓋動了手術。"},{"id":2819,"word":"surgical","pos":"adj","meaning":"adj. 外科的，手術的","example":"The hospital bought new surgical tools for the operating room.","example_zh":"醫院為手術室購買了新的手術器械。"},{"id":2820,"word":"surrender","pos":"v","meaning":"v. 投降；自首；放棄；交出 (n) 投降；屈服","example":"The soldiers decided to surrender when they ran out of food and water.","example_zh":"士兵們在食物和水都用完後決定投降。"},{"id":2821,"word":"surround","pos":"v","meaning":"v. 圍繞；包圍","example":"Tall mountains surround the small village on all sides.","example_zh":"高山從四面八方環繞著這個小村莊。"},{"id":2822,"word":"surroundings","pos":"n","meaning":"n. 環境","example":"It took me a few days to get used to my new surroundings.","example_zh":"我花了幾天才習慣新的環境。"},{"id":2823,"word":"survey","pos":"v","meaning":"v. 檢視；檢查；調查 (n) 調查","example":"The magazine conducted a survey on teenagers' sleeping habits.","example_zh":"這本雜誌針對青少年的睡眠習慣進行了一項調查。"},{"id":2824,"word":"survival","pos":"n","meaning":"n. 存活","example":"Water is necessary for the survival of all living things.","example_zh":"水對所有生物的生存都是必要的。"},{"id":2825,"word":"survivor","pos":"n","meaning":"n. 生還者","example":"The only survivor of the accident was taken to the hospital.","example_zh":"這起意外中唯一的生還者被送到了醫院。"},{"id":2826,"word":"suspect","pos":"v","meaning":"v. 懷疑 (n) 嫌犯","example":"The teacher suspected that someone had copied his answers.","example_zh":"老師懷疑有人抄了他的答案。"},{"id":2827,"word":"suspicion","pos":"n","meaning":"n. 懷疑；涉嫌","example":"The man was arrested on suspicion of stealing a bicycle.","example_zh":"那名男子因涉嫌偷竊一輛腳踏車而被逮捕。"},{"id":2828,"word":"suspicious","pos":"adj","meaning":"adj. 懷疑的；可疑的","example":"The security guard noticed a suspicious man standing near the gate.","example_zh":"警衛注意到一名可疑的男子站在大門附近。"},{"id":2829,"word":"sustain","pos":"v","meaning":"v. 維持（生命），保持","example":"A balanced diet can sustain a healthy body for many years.","example_zh":"均衡的飲食可以讓身體長年維持健康。"},{"id":2830,"word":"sustained","pos":"adj","meaning":"adj. 持續的；持久的","example":"Sustained effort is the key to learning a new language.","example_zh":"持續的努力是學好一門新語言的關鍵。"},{"id":2831,"word":"swear","pos":"v","meaning":"v. 發誓；咒罵","example":"He swore to keep the secret and never tell anyone.","example_zh":"他發誓要保守祕密，絕不告訴任何人。"},{"id":2832,"word":"sweat","pos":"n","meaning":"n. 汗水 (v) 流汗","example":"Sweat ran down his face after the long run.","example_zh":"長跑之後，汗水從他的臉上流下來。"},{"id":2833,"word":"swell","pos":"v","meaning":"v. 腫","example":"Her ankle began to swell after she fell off the bike.","example_zh":"她從腳踏車上摔下來後，腳踝開始腫起來。"},{"id":2834,"word":"swift","pos":"adj","meaning":"adj. 迅速的","example":"The swift river carried the small boat away from the shore.","example_zh":"湍急的河水把小船從岸邊帶走了。"},{"id":2835,"word":"swing","pos":"v","meaning":"v. 揮打 (n)起伏變化","example":"He swung the bat hard and hit the ball over the fence.","example_zh":"他用力揮動球棒，把球打過了圍籬。"},{"id":2836,"word":"switch","pos":"v","meaning":"v. 改變；轉換；交換；開或關（電器） (n) 開關；轉變","example":"Please switch off the lights when you leave the classroom.","example_zh":"離開教室時請把燈關掉。"},{"id":2837,"word":"sword","pos":"n","meaning":"n. 刀；劍","example":"The knight pulled out his sword and faced the dragon.","example_zh":"那位騎士拔出劍，面對那條龍。"},{"id":2838,"word":"syllable","pos":"n","meaning":"n. 音節","example":"The word \"banana\" has three syllables.","example_zh":"「banana」這個字有三個音節。"},{"id":2839,"word":"symbol","pos":"n","meaning":"n. 象徵","example":"The olive branch is a symbol of peace.","example_zh":"橄欖枝是和平的象徵。"},{"id":2840,"word":"symbolic","pos":"adj","meaning":"adj. 象徵性的","example":"The ceremony was held on that day as a symbolic act of friendship.","example_zh":"這場典禮在那天舉行，是一項象徵友誼的舉動。"},{"id":2841,"word":"symbolize","pos":"v","meaning":"v. 象徵，代表","example":"In many countries, the color red symbolizes good luck.","example_zh":"在許多國家，紅色象徵好運。"},{"id":2842,"word":"sympathetic","pos":"adj","meaning":"adj. 有同情心的；有同感的","example":"The sympathetic nurse listened carefully to the patient's worries.","example_zh":"那位富有同情心的護理師仔細傾聽病人的煩惱。"},{"id":2843,"word":"sympathize","pos":"v","meaning":"v. 同情；同意；贊成","example":"I sympathize with you because I also failed the exam last year.","example_zh":"我很同情你，因為我去年考試也不及格。"},{"id":2844,"word":"sympathy","pos":"n","meaning":"n. 同情；憐憫","example":"The whole class felt sympathy for the girl who lost her pet.","example_zh":"全班同學都同情那位失去寵物的女孩。"},{"id":2845,"word":"symphony","pos":"n","meaning":"n. 交響樂","example":"We went to the concert hall to listen to a beautiful symphony.","example_zh":"我們到音樂廳去聽了一場優美的交響樂。"},{"id":2846,"word":"syrup","pos":"n","meaning":"n. 糖漿","example":"She poured maple syrup over the pancakes.","example_zh":"她把楓糖漿淋在鬆餅上。"},{"id":2847,"word":"system","pos":"n","meaning":"n. 制度；系統","example":"The school's new system makes it easier to check students' grades.","example_zh":"學校的新系統讓查詢學生成績變得更容易。"},{"id":2848,"word":"systematic","pos":"adj","meaning":"adj. 有系統的；有條理的","example":"He is a systematic thinker who always plans every step carefully.","example_zh":"他是個有條理的思考者，總是仔細規劃每個步驟。"},{"id":2849,"word":"tablet","pos":"n","meaning":"n. 藥片；藥錠","example":"The doctor told me to take one tablet three times a day.","example_zh":"醫生叫我一天吃三次藥，每次一顆。"},{"id":2850,"word":"tack","pos":"n","meaning":"n. 大頭釘","example":"I used a tack to fix the poster on the notice board.","example_zh":"我用大頭釘把海報固定在布告欄上。"},{"id":2851,"word":"tackle","pos":"v","meaning":"v. 處理，對付（難題）","example":"The city is trying to tackle the problem of heavy traffic.","example_zh":"這座城市正試圖處理嚴重的交通問題。"},{"id":2852,"word":"tag","pos":"n","meaning":"n. 標籤 (v) 貼標籤於","example":"The price tag on the dress says it costs three hundred dollars.","example_zh":"洋裝上的價格標籤寫著它要三百元。"},{"id":2853,"word":"tailor","pos":"n","meaning":"n. 裁縫師","example":"The tailor made a perfect suit for my father.","example_zh":"那位裁縫師為我爸爸做了一套完美合身的西裝。"},{"id":2854,"word":"take … for granted","pos":"phr","meaning":"phr. 視為理所當然"
