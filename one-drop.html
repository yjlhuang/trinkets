s furious when he found out that his car had been damaged.","example_zh":"當他發現他的車被損壞時，他感到狂怒。"},{"id":1269,"word":"furnish","pos":"v","meaning":"v. 佈置","example":"It took them weeks to furnish their new apartment.","example_zh":"他們花了數週的時間佈置新公寓。"},{"id":1270,"word":"furniture","pos":"n","meaning":"n. 家具","example":"They went to the store to buy new furniture for the living room.","example_zh":"他們到店裡去為客廳買新家具。"},{"id":1271,"word":"furthermore","pos":"adv","meaning":"adv. 此外；再者","example":"The price is low; furthermore, the quality is excellent.","example_zh":"價格很低；此外，品質也非常卓越。"},{"id":1272,"word":"fury","pos":"n","meaning":"n. 憤怒，暴怒","example":"The fury of the storm destroyed many trees in the area.","example_zh":"那場暴風雨的暴怒摧毀了該地區的許多樹木。"},{"id":1273,"word":"fuse","pos":"vt","meaning":"vt. (vi)熔化，融合","example":"We need to fuse these two metals together to create a stronger alloy.","example_zh":"我們需要將這兩種金屬熔化在一起以創造出更強的合金。"},{"id":1274,"word":"fusion","pos":"n","meaning":"n. 熔化，融合","example":"Nuclear fusion is a process that produces a massive amount of energy.","example_zh":"核融合是一種能產生巨大能量的過程。"},{"id":1275,"word":"gallery","pos":"n","meaning":"n. 畫廊","example":"She likes to visit the local art gallery to see new paintings.","example_zh":"她喜歡參觀當地的畫廊以欣賞新的畫作。"},{"id":1276,"word":"gallon","pos":"n","meaning":"n. 加侖","example":"The car has a tank that holds fifteen gallons of gasoline.","example_zh":"這輛車的油箱可容納十五加侖的汽油。"},{"id":1277,"word":"gamble","pos":"v","meaning":"v. 賭博；投機 (n) 冒險；沒把握的事","example":"You shouldn't gamble with money that you cannot afford to lose.","example_zh":"你不應該拿你輸不起的錢去賭博。"},{"id":1278,"word":"gang","pos":"n","meaning":"n. 一夥；一幫","example":"A gang of thieves was caught by the police last night.","example_zh":"一夥竊賊昨晚被警方逮捕。"},{"id":1279,"word":"gangster","pos":"n","meaning":"n. 幫派分子；歹徒","example":"The movie is about a young man who becomes a gangster.","example_zh":"這部電影講述一個年輕人成為幫派分子的故事。"},{"id":1280,"word":"gap","pos":"n","meaning":"n. 裂縫；分歧","example":"There is a wide gap between his words and his actions.","example_zh":"他的言行之間有很大的分歧。"},{"id":1281,"word":"garlic","pos":"n","meaning":"n. 蒜頭","example":"Many people use garlic to add flavor to their cooking.","example_zh":"許多人使用蒜頭來為料理增添風味。"},{"id":1282,"word":"gasoline (=gas)","pos":"n","meaning":"n. 汽油","example":"We stopped at the gas station to buy some gasoline.","example_zh":"我們停在加油站去買些汽油。"},{"id":1283,"word":"gasp","pos":"v/n","meaning":"v/n. 倒抽一口氣","example":"She let out a sudden gasp in surprise when she saw the gift.","example_zh":"當她看到禮物時，驚訝地倒抽了一口氣。"},{"id":1284,"word":"gather","pos":"v","meaning":"v. 聚集，集合，收集","example":"The students will gather in the hall for the morning assembly.","example_zh":"學生們將聚集在禮堂進行晨會。"},{"id":1285,"word":"gaze","pos":"v","meaning":"v. 凝視 (n) 凝視；注視","example":"He could only gaze at the beautiful stars in the night sky.","example_zh":"他只能凝視著夜空中美麗的星星。"},{"id":1286,"word":"gear","pos":"n","meaning":"n. 裝備；齒輪","example":"You need to gear yourself with the right equipment for the hike.","example_zh":"你需要為這場徒步旅行裝備適合的器材。"},{"id":1287,"word":"gender","pos":"n","meaning":"n. 性別","example":"The survey asks participants about their age and gender.","example_zh":"這項調查詢問參與者的年齡與性別。"},{"id":1288,"word":"gene","pos":"n","meaning":"n. 基因","example":"Every person has a unique gene sequence that makes them who they are.","example_zh":"每個人都有獨特的基因序列，使他們成為他們自己。"},{"id":1289,"word":"generate","pos":"v","meaning":"v. 產生，引起","example":"Solar panels generate electricity from the sun's rays.","example_zh":"太陽能板從陽光中產生電力。"},{"id":1290,"word":"generation","pos":"n","meaning":"n. 一代；世代；產生；發生","example":"Each generation learns from the experiences of the ones before it.","example_zh":"每一代人都能從前一代人的經驗中學習。"},{"id":1291,"word":"generosity","pos":"n","meaning":"n. 慷慨","example":"Her generosity in helping others has earned her many friends.","example_zh":"她幫助他人的慷慨為她贏得了許多朋友。"},{"id":1292,"word":"genius","pos":"n","meaning":"n. 天賦；天資；天才","example":"Only a genius could solve that complex mathematical problem.","example_zh":"只有天才才能解開那個複雜的數學問題。"},{"id":1293,"word":"genuine","pos":"adj","meaning":"adj. 純正的；真正的","example":"Is this bag made of genuine leather or a synthetic material?","example_zh":"這個包包是真皮做的，還是合成材料？"},{"id":1294,"word":"germ","pos":"n","meaning":"n. 細菌","example":"Please wash your hands to prevent the spread of germs.","example_zh":"請洗手以防止細菌傳播。"},{"id":1295,"word":"gesture","pos":"n","meaning":"n. 手勢；姿勢 (v) 用手勢表示；用動作示意","example":"He used a gesture to indicate that he wanted me to follow him.","example_zh":"他用手勢表示他想要我跟隨他。"},{"id":1296,"word":"get away","pos":"phr","meaning":"phr. 逃離，逃脫","example":"The prisoner tried to get away but was soon caught.","example_zh":"那名囚犯試圖逃脫但很快就被抓住了。"},{"id":1297,"word":"get down to","pos":"phr","meaning":"phr. 開始認真做","example":"After a short break, it is time to get down to work.","example_zh":"短暫休息後，是開始認真工作的時候了。"},{"id":1298,"word":"get used to (Ving)","pos":"phr","meaning":"phr. 習慣，適應","example":"It takes time to get used to living in a new city.","example_zh":"適應在新城市生活需要一些時間。"},{"id":1299,"word":"gifted","pos":"adj","meaning":"adj. 有天賦的；有才能的","example":"She is a gifted musician who could play the piano at age four.","example_zh":"她是一位有天賦的音樂家，四歲時就能彈鋼琴。"},{"id":1300,"word":"gigantic","pos":"adj","meaning":"adj. 巨人般的；巨大的","example":"The ancient castle looked gigantic against the small houses surrounding it.","example_zh":"古堡在周圍小房子的襯托下顯得巨大無比。"},{"id":1301,"word":"giggle","pos":"v","meaning":"v. 咯咯地笑；傻笑 (n) 咯咯地笑；傻笑","example":"The children started to giggle when they saw the funny clown.","example_zh":"孩子們看到滑稽的小丑時開始咯咯地笑。"},{"id":1302,"word":"ginger","pos":"n","meaning":"n. 薑","example":"My mother often adds a little ginger to the tea to keep us warm.","example_zh":"我母親常在茶裡加一點薑來讓我們保持溫暖。"},{"id":1303,"word":"give birth to","pos":"phr","meaning":"phr. 生孩子","example":"The lioness is expected to give birth to her cubs soon.","example_zh":"那頭母獅預計很快就會生下小獅子。"},{"id":1304,"word":"give in","pos":"phr","meaning":"phr. 屈服，讓步","example":"After hours of negotiation, the company finally decided to give in to the union's demands.","example_zh":"經過數小時的談判，公司最終決定向工會的要求讓步。"},{"id":1305,"word":"give up","pos":"phr","meaning":"phr. 放棄","example":"Don't give up on your dreams, even when things get difficult.","example_zh":"即使情況變得困難，也不要放棄你的夢想。"},{"id":1306,"word":"glance","pos":"v","meaning":"v. 瞥視 (n) （匆匆）一瞥","example":"He took a quick glance at his watch to check the time.","example_zh":"他飛快地瞥了一眼手錶來確認時間。"},{"id":1307,"word":"glare","pos":"v/n","meaning":"v/n. 怒視，瞪視","example":"The teacher gave the noisy students a stern glare.","example_zh":"老師對吵鬧的學生投以嚴厲的怒視。"},{"id":1308,"word":"glide","pos":"v","meaning":"v. 滑動；滑行","example":"The eagle began to glide through the air without flapping its wings.","example_zh":"老鷹開始在空中滑行，沒有拍動翅膀。"},{"id":1309,"word":"glimpse","pos":"v","meaning":"v. 瞥見；一瞥 (n) 瞥見；隱約看見","example":"I managed to catch a brief glimpse of the celebrity as she entered the building.","example_zh":"當那位名人進入建築時，我設法瞥見了她一眼。"},{"id":1310,"word":"global","pos":"adj","meaning":"adj. 全球的","example":"Climate change is a global issue that requires international cooperation.","example_zh":"氣候變遷是一個需要國際合作的全球性議題。"},{"id":1311,"word":"globe","pos":"n","meaning":"n. 地球；球狀物","example":"He bought a large globe to help his children learn about different countries.","example_zh":"他買了一個大地球儀來幫助孩子們認識不同的國家。"},{"id":1312,"word":"gloom","pos":"n","meaning":"n. 沮喪，憂鬱","example":"The news of the factory closing cast a gloom over the entire town.","example_zh":"工廠倒閉的消息讓整個小鎮籠罩在沮喪之中。"},{"id":1313,"word":"gloomy","pos":"adj","meaning":"adj. 黑暗的，陰暗的；沮喪的","example":"It was a gloomy day with dark clouds and constant rain.","example_zh":"那是一個陰暗的日子，烏雲密佈且雨下不停。"},{"id":1314,"word":"glorious","pos":"adj","meaning":"adj. 光榮的；輝煌的；壯觀的","example":"The sunset over the ocean provided a glorious view for everyone on the beach.","example_zh":"海上的落日為海灘上的每個人提供了壯觀的景色。"},{"id":1315,"word":"gloriously","pos":"adv","meaning":"adv. 輝煌地，光榮地","example":"The team celebrated their victory gloriously with a parade through the city.","example_zh":"團隊透過在城市遊行，輝煌地慶祝他們的勝利。"},{"id":1316,"word":"glory","pos":"n","meaning":"n. 光榮；榮譽","example":"He sought glory on the battlefield but found only the harsh reality of war.","example_zh":"他在戰場上尋求光榮，卻只發現戰爭殘酷的現實。"},{"id":1317,"word":"glow","pos":"v","meaning":"v. 發亮；發熱 (n) 熾熱；光輝","example":"The embers of the fire continued to glow in the dark night.","example_zh":"火堆的餘燼在黑夜中繼續發亮。"},{"id":1318,"word":"go ahead","pos":"phr","meaning":"phr. 開始，著手進行","example":"Please go ahead with your presentation; we are all ready to listen.","example_zh":"請開始你的簡報；我們都準備好聽了。"},{"id":1319,"word":"go through","pos":"phr","meaning":"phr. 經歷，遭受","example":"You have to go through many challenges before you can achieve great success.","example_zh":"在獲得巨大成功之前，你必須經歷許多挑戰。"},{"id":1320,"word":"go to extreme","pos":"phr","meaning":"phr. 走極端","example":"It is not healthy to go to extremes when you are trying to lose weight.","example_zh":"當你試圖減重時，走極端是不健康的。"},{"id":1321,"word":"goal","pos":"n","meaning":"n. 目標","example":"Her primary goal in life is to become a successful doctor.","example_zh":"她人生的首要目標是成為一名成功的醫生。"},{"id":1322,"word":"goods","pos":"n","meaning":"n. 貨物；商品","example":"The truck was carrying a variety of goods to the local market.","example_zh":"這輛卡車正運送各式各樣的貨物到當地市場。"},{"id":1323,"word":"gossip","pos":"v","meaning":"v. 說閒話 (n) 流言蜚語","example":"It is unkind to spread gossip about your coworkers behind their backs.","example_zh":"在背後散播同事的流言蜚語是不厚道的。"},{"id":1324,"word":"govern","pos":"v","meaning":"v. 統治，治理","example":"The king was appointed to govern the land with justice and wisdom.","example_zh":"國王被委任以正義與智慧治理這片土地。"},{"id":1325,"word":"government","pos":"n","meaning":"n. 政府","example":"The government announced new measures to stimulate the economy.","example_zh":"政府宣布了刺激經濟的新措施。"},{"id":1326,"word":"governor","pos":"n","meaning":"n. 州長","example":"The governor of the state signed the new law into effect yesterday.","example_zh":"該州州長昨天簽署使新法律生效。"},{"id":1327,"word":"gown","pos":"n","meaning":"n. （女用）禮服","example":"She wore a stunning silk gown to the annual charity ball.","example_zh":"她穿著一件極美的絲綢禮服參加年度慈善舞會。"},{"id":1328,"word":"grab","pos":"v","meaning":"v. 抓住","example":"He tried to grab the railing as he slipped on the icy stairs.","example_zh":"他在冰冷的樓梯上滑倒時試圖抓住扶手。"}]},
{"unit":11,"unit_label":"p.21-22","words":[{"id":1329,"word":"grace","pos":"n","meaning":"n. 優雅；斯文；恩典 (v) 使優雅；使增色","example":"She handled the difficult situation with great grace and patience.","example_zh":"她以極大的優雅與耐心處理了那個困境。"},{"id":1330,"word":"graceful","pos":"adj","meaning":"adj. 優美的","example":"The dancer's movements were graceful and fluid across the stage.","example_zh":"舞者在舞台上的動作優美且流暢。"},{"id":1331,"word":"gracefully","pos":"adv","meaning":"adv. 優雅地","example":"She gracefully accepted the award and thanked her supporters.","example_zh":"她優雅地接受了獎項並感謝她的支持者。"},{"id":1332,"word":"gracious","pos":"adj","meaning":"adj. 親切的","example":"The hostess was very gracious, making all the guests feel welcome.","example_zh":"女主人非常親切，讓所有客人都感到賓至如歸。"},{"id":1333,"word":"gradual","pos":"adj","meaning":"adj. 漸漸的","example":"The gradual change in temperature indicates that autumn is coming.","example_zh":"溫度的漸漸變化預示著秋天即將到來。"},{"id":1334,"word":"graduate","pos":"v","meaning":"v. 畢業 (n) 畢業生","example":"After he graduated from college, he started looking for his first job.","example_zh":"他大學畢業後，開始尋找他的第一份工作。"},{"id":1335,"word":"graduation","pos":"n","meaning":"n. 畢業（典禮）","example":"My parents came to town to attend my graduation ceremony.","example_zh":"我父母來到城裡參加我的畢業典禮。"},{"id":1336,"word":"grain","pos":"n","meaning":"n. 穀物；顆粒","example":"Wheat and rice are the most important grains produced in this region.","example_zh":"小麥和稻米是該地區產出最重要的穀物。"},{"id":1337,"word":"gram","pos":"n","meaning":"n. 公克","example":"A small paperclip weighs about one gram.","example_zh":"一個小迴紋針大約重一公克。"},{"id":1338,"word":"grammar","pos":"n","meaning":"n. 文法","example":"Understanding basic grammar is essential for learning any new language.","example_zh":"了解基本文法對於學習任何新語言都至關重要。"},{"id":1339,"word":"grammatical","pos":"adj","meaning":"adj. （合乎）文法的","example":"The teacher corrected the student's grammatical errors in the essay.","example_zh":"老師糾正了學生論文中的文法錯誤。"},{"id":1340,"word":"grapefruit","pos":"n","meaning":"n. 葡萄柚","example":"I like to have half a grapefruit for breakfast every morning.","example_zh":"我喜歡每天早上吃半個葡萄柚當早餐。"},{"id":1341,"word":"grasp","pos":"v","meaning":"v. 抓住；抓緊；理解 (n) 緊握；抓牢","example":"He tried to grasp the complex concept, but it was too difficult.","example_zh":"他試圖理解那個複雜的概念，但太困難了。"},{"id":1342,"word":"grasshopper","pos":"n","meaning":"n. 蚱蜢","example":"The grasshopper jumped quickly across the field and disappeared.","example_zh":"蚱蜢快速跳過田野後消失了。"},{"id":1343,"word":"grateful","pos":"adj","meaning":"adj. 感激的","example":"I am extremely grateful for all the help you have given me.","example_zh":"我對你給予我的所有幫助感到非常感激。"},{"id":1344,"word":"gratitude","pos":"n","meaning":"n. 感激之情；謝意","example":"He expressed his deep gratitude to the doctors who saved his life.","example_zh":"他向救了他性命的醫生們表達了深深的謝意。"},{"id":1345,"word":"grave","pos":"adj","meaning":"adj. 嚴重的；嚴肅的 (n) 墳墓；墓地","example":"The doctor had a grave expression on his face as he delivered the news.","example_zh":"醫生傳達消息時臉上帶著嚴肅的表情。"},{"id":1346,"word":"gravely","pos":"adv","meaning":"adv. 嚴重地","example":"The patient is gravely ill and needs immediate medical attention.","example_zh":"病人病得很嚴重，需要立即的醫療照護。"},{"id":1347,"word":"gravitational","pos":"adj","meaning":"adj. 引力的","example":"The planets are held in their orbits by gravitational forces.","example_zh":"行星被引力維持在各自的軌道上。"},{"id":1348,"word":"gravity","pos":"n","meaning":"n. 地心引力；嚴重性","example":"Without gravity, everything on Earth would float away into space.","example_zh":"沒有地心引力，地球上的一切都會漂浮到太空中。"},{"id":1349,"word":"greasy","pos":"adj","meaning":"adj. 油膩的","example":"The fried chicken was too greasy, so I didn't enjoy it very much.","example_zh":"炸雞太油膩了，所以我不太喜歡。"},{"id":1350,"word":"greenhouse","pos":"n","meaning":"n. 花房；溫室","example":"They grow tropical plants in a greenhouse to protect them from the cold.","example_zh":"他們在溫室裡種植熱帶植物以保護它們免受寒冷。"},{"id":1351,"word":"greeting","pos":"n","meaning":"n. 問候；祝賀（慣用複數）","example":"We sent our warmest greetings to the family during the holiday season.","example_zh":"我們在節日期間向那家人致以最誠摯的問候。"},{"id":1352,"word":"grief","pos":"n","meaning":"n. 悲傷；傷心事","example":"She was overcome with grief after the loss of her beloved pet.","example_zh":"在失去心愛的寵物後，她陷入了極大的悲傷。"},{"id":1353,"word":"grieve","pos":"v","meaning":"v. 悲傷","example":"It is important to allow yourself time to grieve after a major loss.","example_zh":"在重大的損失之後，讓自己有時間悲傷是很重要的。"},{"id":1354,"word":"grin","pos":"v","meaning":"v. 露齒而笑 (n) 露齒的笑","example":"He gave a wide grin when he saw the surprise birthday party.","example_zh":"當他看到驚喜生日派對時，露齒而笑。"},{"id":1355,"word":"grind","pos":"v","meaning":"v. 碾碎；磨","example":"You need to grind the coffee beans before you can brew a fresh cup.","example_zh":"你需要先磨碎咖啡豆才能煮出一杯新鮮的咖啡。"},{"id":1356,"word":"grip","pos":"v/n","meaning":"v/n. 緊抓，緊握，理解","example":"He kept a firm grip on the handle as the train started to move.","example_zh":"火車開始移動時，他緊緊握住把手。"},{"id":1357,"word":"grocery","pos":"n","meaning":"n. 食品雜貨；食品雜貨店","example":"She went to the grocery store to buy some bread and milk.","example_zh":"她去食品雜貨店買些麵包和牛奶。"},{"id":1358,"word":"groom","pos":"n","meaning":"n. 新郎","example":"The groom looked very handsome in his tuxedo on his wedding day.","example_zh":"新郎在婚禮當天穿著燕尾服，看起來非常帥氣。"},{"id":1359,"word":"grow in","pos":"phr","meaning":"phr. 漸漸成為","example":"Over the years, he has grown in confidence and leadership.","example_zh":"這些年來，他漸漸成為一個有自信且具領導力的人。"},{"id":1360,"word":"grow out of (something)","pos":"phr","meaning":"phr. 產生於","example":"Many of our modern traditions grow out of ancient customs.","example_zh":"我們許多現代傳統都是產生於古代習俗。"},{"id":1361,"word":"guarantee","pos":"n","meaning":"n. 保證（書） (v) 保證；擔保","example":"The manufacturer offers a one-year guarantee on all its products.","example_zh":"製造商對其所有產品提供一年的保固。"},{"id":1362,"word":"guardian","pos":"n","meaning":"n. 監護人；保護人","example":"After his parents passed away, his uncle became his legal guardian.","example_zh":"在他父母過世後，他叔叔成了他的法定監護人。"},{"id":1363,"word":"guidance","pos":"n","meaning":"n. 指導；引導","example":"The counselor provides guidance to students who are choosing their careers.","example_zh":"輔導員為正在選擇職業的學生提供指導。"},{"id":1364,"word":"guilt","pos":"n","meaning":"n. 罪（行）；內疚；罪惡感","example":"He felt a deep sense of guilt after lying to his best friend.","example_zh":"在對最好的朋友撒謊後，他感到深深的內疚。"},{"id":1365,"word":"guilty","pos":"adj","meaning":"adj. 有罪的；感到內疚的","example":"The jury found the defendant guilty of the crime.","example_zh":"陪審團判定被告有罪。"},{"id":1366,"word":"gulf","pos":"n","meaning":"n. 海灣；隔閡；鴻溝","example":"The Gulf of Mexico is home to many different species of marine life.","example_zh":"墨西哥灣是許多不同海洋生物物種的家園。"},{"id":1367,"word":"gum","pos":"n","meaning":"n. 黏膠；牙齦（慣用複數）","example":"Chewing gum is not allowed during the examination.","example_zh":"考試期間禁止嚼口香糖。"},{"id":1368,"word":"gymnasium","pos":"n","meaning":"n. 健身房；體育館","example":"Students often gather in the gymnasium for physical education classes.","example_zh":"學生們經常在體育館集合上體育課。"},{"id":1369,"word":"habitual","pos":"adj","meaning":"adj. 習慣性的；慣常的","example":"He is a habitual smoker who finds it very difficult to quit.","example_zh":"他是個習慣性的抽菸者，覺得戒菸非常困難。"},{"id":1370,"word":"hairdresser","pos":"n","meaning":"n. 美髮師","example":"She made an appointment with her hairdresser for a new haircut.","example_zh":"她預約了她的美髮師要剪個新髮型。"},{"id":1371,"word":"hallway","pos":"n","meaning":"n. 門廳；走廊","example":"The walls of the hallway were decorated with beautiful paintings.","example_zh":"走廊的牆上裝飾著美麗的畫作。"},{"id":1372,"word":"halt","pos":"v","meaning":"v. （使）停止 (n) 停止","example":"The construction work came to a sudden halt due to the heavy rain.","example_zh":"由於大雨，建築工程突然停止。"},{"id":1373,"word":"handful","pos":"n","meaning":"n. 一把；少數；少量","example":"She picked up a handful of sand and let it slip through her fingers.","example_zh":"她抓起一把沙子，讓它從指縫間滑落。"},{"id":1374,"word":"handle","pos":"n","meaning":"n. 把手 (v) 拿，處理","example":"Please use the handle to open the door carefully.","example_zh":"請使用把手小心地開門。"},{"id":1375,"word":"handwriting","pos":"n","meaning":"n. 手寫；筆跡","example":"It is difficult to read his handwriting because it is so messy.","example_zh":"他的筆跡很亂，很難閱讀。"},{"id":1376,"word":"handy","pos":"adj","meaning":"adj. 方便的；簡便的；手巧的","example":"A Swiss Army knife is a handy tool to have when you are camping.","example_zh":"露營時，瑞士刀是一個很方便的工具。"},{"id":1377,"word":"harass","pos":"v","meaning":"v. 騷擾","example":"No one should have to endure someone trying to harass them at work.","example_zh":"沒有人應該忍受別人在工作場合騷擾他們。"},{"id":1378,"word":"harassment","pos":"n","meaning":"n. 騷擾","example":"The company has a zero-tolerance policy toward workplace harassment.","example_zh":"該公司對職場騷擾採取零容忍政策。"},{"id":1379,"word":"harbor","pos":"n","meaning":"n. 港口","example":"The ships returned to the harbor to seek shelter from the storm.","example_zh":"船隻回到港口以尋求避風雨之處。"},{"id":1380,"word":"harden","pos":"v","meaning":"v. （使）變硬","example":"The mud began to harden as it dried in the hot sun.","example_zh":"泥土在烈日下曝曬乾燥後開始變硬。"},{"id":1381,"word":"hardly","pos":"adv","meaning":"adv. 幾乎不(=scarcely； barely)","example":"It was so noisy that I could hardly hear what he was saying.","example_zh":"現場太吵了，我幾乎聽不見他在說什麼。"},{"id":1382,"word":"hardship","pos":"n","meaning":"n. 困苦；艱難","example":"The family faced great hardship after the father lost his job.","example_zh":"在父親失業後，這家人面臨了極大的困苦。"},{"id":1383,"word":"hardware","pos":"n","meaning":"n. 五金製品","example":"You can buy tools and nails at the local hardware store.","example_zh":"你可以在當地的五金行買到工具和釘子。"},{"id":1384,"word":"harm","pos":"v","meaning":"v. 傷害 (n) 危害；傷害","example":"We must be careful not to do any harm to the natural environment.","example_zh":"我們必須小心不要對自然環境造成任何傷害。"},{"id":1385,"word":"harmful","pos":"adj","meaning":"adj. 有害的","example":"Smoking is harmful to your lungs and your overall health.","example_zh":"抽菸對你的肺部和整體健康有害。"},{"id":1386,"word":"harmonica","pos":"n","meaning":"n. 口琴","example":"He played a beautiful tune on his harmonica during the campfire.","example_zh":"他在營火會期間用口琴吹奏了一首優美的曲子。"},{"id":1387,"word":"harmony","pos":"n","meaning":"n. 和睦；和聲","example":"The choir sang in perfect harmony, creating a wonderful sound.","example_zh":"合唱團以完美的和聲演唱，創造出美妙的聲音。"},{"id":1388,"word":"harsh","pos":"adj","meaning":"adj. 刺耳的；粗糙的；嚴厲的","example":"The desert has a harsh climate with very little water.","example_zh":"沙漠氣候嚴厲，水分極少。"},{"id":1389,"word":"harvest","pos":"v","meaning":"v. 收割；收穫 (n) 收穫；收割","example":"Farmers work long hours during the harvest season to collect the crops.","example_zh":"農夫在收穫季節長時間工作以收割作物。"},{"id":1390,"word":"haste","pos":"n","meaning":"n. 匆忙；匆促","example":"In her haste to leave, she forgot to lock the front door.","example_zh":"在匆忙離開之際，她忘了鎖前門。"},{"id":1391,"word":"hasten","pos":"v","meaning":"v. 加速；趕快","example":"We need to hasten our departure if we want to arrive before dark.","example_zh":"如果我們想在天黑前抵達，我們需要加速出發。"},{"id":1392,"word":"hasty","pos":"adj","meaning":"adj. 匆忙的；草率的","example":"He made a hasty decision that he later came to regret.","example_zh":"他做了一個草率的決定，後來感到後悔。"},{"id":1393,"word":"hatch","pos":"v","meaning":"v. 孵化；孵出","example":"The bird eggs are expected to hatch in about two weeks.","example_zh":"鳥蛋預計在大約兩週內孵化。"},{"id":1394,"word":"hate","pos":"v","meaning":"v. 憎恨","example":"I hate to see food being wasted when so many people are hungry.","example_zh":"我憎恨看到食物被浪費，尤其還有這麼多人挨餓。"},{"id":1395,"word":"hatred","pos":"n","meaning":"n. 仇恨","example":"The two countries have a long history of hatred and conflict.","example_zh":"這兩個國家有著長久的仇恨與衝突歷史。"},{"id":1396,"word":"have come a long way","pos":"phr","meaning":"phr. 大為進步","example":"Technology has come a long way since the invention of the first computer.","example_zh":"自第一台電腦發明以來，科技已經大為進步。"},{"id":1397,"word":"have nothing to do with","pos":"phr","meaning":"phr. 與～無關","example":"My personal life has nothing to do with my professional work.","example_zh":"我的私生活與我的專業工作無關。"},{"id":1398,"word":"hawk","pos":"n","meaning":"n. 鷹","example":"The hawk circled high in the sky, searching for its next meal.","example_zh":"老鷹在高空中盤旋，尋找下一餐。"},{"id":1399,"word":"hay","pos":"n","meaning":"n. 乾草","example":"The farmer stacked the hay in the barn to feed the animals in winter.","example_zh":"農夫將乾草堆在穀倉裡，以便在冬天餵養動物。"},{"id":1400,"word":"hazard","pos":"n","meaning":"n. 危險；危害物","example":"Working with chemicals can be a major hazard if not done properly.","example_zh":"若處理不當，使用化學物質可能會是重大危害。"},{"id":1401,"word":"hazardous","pos":"adj","meaning":"adj. 危險的","example":"Climbing the mountain during a storm is extremely hazardous.","example_zh":"在暴風雨期間爬山極度危險。"},{"id":1402,"word":"headline","pos":"n","meaning":"n. 標題；頭條","example":"The newspaper headline caught everyone's attention this morning.","example_zh":"今早報紙的頭條吸引了所有人的注意。"},{"id":1403,"word":"headquarters","pos":"n","meaning":"n. 總部","example":"The company moved its international headquarters to a larger city.","example_zh":"該公司將其國際總部搬到了一座更大的城市。"},{"id":1404,"word":"heal","pos":"v","meaning":"v. 治癒；使康復","example":"It takes time for a deep wound to heal completely.","example_zh":"深層傷口需要時間才能完全癒合。"},{"id":1405,"word":"healthful","pos":"adj","meaning":"adj. 有益健康的","example":"Eating fresh fruits and vegetables is a healthful habit.","example_zh":"吃新鮮蔬果是有益健康的習慣。"},{"id":1406,"word":"heap","pos":"n","meaning":"n. 堆；許多","example":"He left a heap of books on his desk after finishing his research.","example_zh":"研究結束後，他在桌上留下了一堆書。"},{"id":1407,"word":"heaven","pos":"n","meaning":"n. 天堂；天空","example":"Many people believe that good deeds lead to heaven after life.","example_zh":"許多人相信善行能通往死後的天堂。"},{"id":1408,"word":"heel","pos":"n","meaning":"n. 腳跟；鞋跟","example":"She hurt her heel while running in uncomfortable shoes.","example_zh":"她穿著不舒服的鞋子跑步時弄傷了腳跟。"},{"id":1409,"word":"helicopter","pos":"n","meaning":"n. 直升機","example":"A rescue helicopter was sent to find the missing hiker.","example_zh":"一架救援直升機被派去尋找失蹤的徒步旅行者。"},{"id":1410,"word":"hell","pos":"n","meaning":"n. 地獄；地獄般的處境","example":"Living in that small, damp apartment felt like hell to her.","example_zh":"住在那個狹小潮濕的公寓對她來說簡直像地獄。"},{"id":1411,"word":"helmet","pos":"n","meaning":"n. 頭盔","example":"You must wear a helmet when riding a motorcycle for safety.","example_zh":"騎機車時為了安全，你必須戴頭盔。"},{"id":1412,"word":"hence","pos":"adv","meaning":"adv. 從此時起，因此","example":"He realized he was wrong; hence, he apologized to his friend.","example_zh":"他意識到自己錯了；因此，他向朋友道歉了。"},{"id":1413,"word":"herd","pos":"n","meaning":"n. 獸群 (v) 放牧","example":"The shepherd guided the herd of sheep back to the barn before sunset.","example_zh":"牧羊人在日落前將羊群引導回穀倉。"},{"id":1414,"word":"heritage","pos":"n","meaning":"n. 遺產 傳統","example":"Preserving our cultural heritage is important for future generations.","example_zh":"保存我們的文化遺產對後代子孫很重要。"},{"id":1415,"word":"hesitantly","pos":"adv","meaning":"adv. 遲疑地，猶豫地","example":"He hesitantly stepped forward, unsure of what to expect.","example_zh":"他遲疑地向前邁進，不確定會發生什麼。"},{"id":1416,"word":"hesitate","pos":"v","meaning":"v. 猶豫；遲疑","example":"Do not hesitate to ask if you need any further information.","example_zh":"如果你需要更多資訊，請不要猶豫去詢問。"},{"id":1417,"word":"hesitation","pos":"n","meaning":"n. 猶豫","example":"After a moment of hesitation, she decided to accept the offer.","example_zh":"在片刻的猶豫後，她決定接受這個提議。"},{"id":1418,"word":"highly","pos":"adv","meaning":"adv. 高度地；極為；高價地；評價高地","example":"The teacher is highly respected by all of her students.","example_zh":"這位老師受到所有學生的高度尊重。"},{"id":1419,"word":"hike","pos":"v","meaning":"v. 徒步旅行 (n) 徒步旅行","example":"We plan to go on a long hike in the mountains this weekend.","example_zh":"我們計畫這週末去山裡進行一趟長途徒步旅行。"},{"id":1420,"word":"hint","pos":"v","meaning":"v. 暗示 (n) 暗示；提示","example":"She gave me a subtle hint about the surprise party.","example_zh":"她給了我一個關於驚喜派對的微妙暗示。"},{"id":1421,"word":"historian","pos":"n","meaning":"n. 歷史學家","example":"The historian spent years studying ancient documents.","example_zh":"那位歷史學家花了好幾年研究古代文件。"},{"id":1422,"word":"historic","pos":"adj","meaning":"adj. 歷史上著名的；有歷史意義的","example":"This is a historic day that will be remembered for years to come.","example_zh":"這是一個具有歷史意義的日子，將在未來的歲月裡被銘記。"},{"id":1423,"word":"historical","pos":"adj","meaning":"adj. 歷史的","example":"The museum has many historical artifacts on display.","example_zh":"博物館裡展出了許多歷史文物。"},{"id":1424,"word":"hive","pos":"n","meaning":"n. 蜂房","example":"The bees worked together to build their hive in the tree.","example_zh":"蜜蜂合力在樹上建造牠們的蜂房。"},{"id":1425,"word":"hold on to (sth)","pos":"phr","meaning":"phr. 堅守（信念、理想等）","example":"It is important to hold on to your values even when life gets tough.","example_zh":"即使生活變得艱難，堅守你的價值觀也很重要。"},{"id":1426,"word":"hollow","pos":"adj","meaning":"adj. 中空的；凹陷的 (n) 窪地；洞","example":"The tree trunk was hollow, providing a home for several small animals.","example_zh":"樹幹是中空的，為一些小動物提供了家。"},{"id":1427,"word":"holy","pos":"adj","meaning":"adj. 神聖的","example":"Many people make a pilgrimage to this holy site every year.","example_zh":"許多人每年都會去這個神聖的地方朝聖。"},{"id":1428,"word":"homeland","pos":"n","meaning":"n. 祖國；故鄉","example":"He finally returned to his homeland after living abroad for decades.","example_zh":"在國外生活數十年後，他終於回到了祖國。"},{"id":1429,"word":"hometown","pos":"n","meaning":"n. 家鄉","example":"She loves returning to her hometown to visit her childhood friends.","example_zh":"她喜歡回到家鄉探望童年好友。"},{"id":1430,"word":"honesty","pos":"n","meaning":"n. 誠實","example":"Her honesty is what I appreciate most about her.","example_zh":"誠實是我最欣賞她的一點。"},{"id":1431,"word":"honeymoon","pos":"n","meaning":"n. 蜜月","example":"They enjoyed a romantic honeymoon on a beautiful tropical island.","example_zh":"他們在美麗的熱帶島嶼上享受了浪漫的蜜月。"},{"id":1432,"word":"honor","pos":"n","meaning":"n. 榮耀；光榮的事或人 (v) 給與榮耀","example":"He was awarded a medal in honor of his bravery.","example_zh":"他獲頒一枚獎章以表彰他的勇氣。"},{"id":1433,"word":"honorable","pos":"adj","meaning":"adj. 可尊敬的；光明正大的","example":"He is an honorable man who always acts with integrity.","example_zh":"他是一位光明正大的人，做事總是很正直。"},{"id":1434,"word":"hook","pos":"n","meaning":"n. 鉤 (v) 用鉤鉤住；釣魚","example":"He used a sharp hook to catch the large fish.","example_zh":"他用鋒利的鉤子釣到了那條大魚。"},{"id":1435,"word":"hopeful","pos":"adj","meaning":"adj. 有希望的","example":"The team felt hopeful about winning the final match.","example_zh":"團隊對贏得最後一場比賽感到很有希望。"},{"id":1436,"word":"horizon","pos":"n","meaning":"n. 地平線；眼界","example":"We watched the sun rise slowly above the horizon.","example_zh":"我們看著太陽緩緩在地平線上升起。"},{"id":1437,"word":"horn","pos":"n","meaning":"n. 角；喇叭","example":"The driver honked his horn to warn the car in front of him.","example_zh":"駕駛按了喇叭以警告前面的車。"},{"id":1438,"word":"horrible","pos":"adj","meaning":"adj. 可怕的","example":"It was a horrible accident that left everyone in shock.","example_zh":"那是一場可怕的意外，讓每個人都感到震驚。"},{"id":1439,"word":"horrified","pos":"adj","meaning":"adj. 感到恐懼的","example":"She was horrified by the sight of the destroyed building.","example_zh":"她被那棟被摧毀建築物的景象嚇壞了。"},{"id":1440,"word":"horrify","pos":"v","meaning":"v. 驚嚇","example":"The sudden news began to horrify everyone in the room.","example_zh":"那則突如其來的消息開始讓室內的每個人感到驚恐。"},{"id":1441,"word":"horror","pos":"n","meaning":"n. 恐怖；驚恐","example":"The story filled the children with horror.","example_zh":"這則故事讓孩子們充滿了恐懼。"},{"id":1442,"word":"hose","pos":"n","meaning":"n. 水管 (v) 用水管澆洗","example":"He used a water hose to clean his car in the driveway.","example_zh":"他在車道上用水管清洗他的車。"},{"id":1443,"word":"host","pos":"n","meaning":"n. 主持人；主人 (v) 主辦","example":"She will host a dinner party for her friends this Saturday.","example_zh":"她將在本週六為朋友舉辦一場晚宴。"},{"id":1444,"word":"hostel","pos":"n","meaning":"n. 招待所；會館","example":"The youth hostel provides affordable rooms for travelers.","example_zh":"那間青年招待所為旅客提供負擔得起的房間。"},{"id":1445,"word":"hostile","pos":"adj","meaning":"adj. 有敵意的","example":"The two neighbors have been hostile toward each other for years.","example_zh":"這兩位鄰居多年來一直對彼此懷有敵意。"},{"id":1446,"word":"hostility","pos":"n","meaning":"n. 敵意","example":"The tension between the two groups grew into open hostility.","example_zh":"兩組人馬之間的緊張關係升級成了公開的敵意。"},{"id":1447,"word":"hourly","pos":"adj","meaning":"adj. 每小時的 (adv) 每小時","example":"The train service operates on an hourly basis throughout the day.","example_zh":"火車服務整天皆以每小時為單位運作。"},{"id":1448,"word":"household","pos":"n","meaning":"n. 一家人；家屬 (adj) 家庭的","example":"Every household needs to have a working smoke detector.","example_zh":"每個家庭都需要配備一個能運作的煙霧探測器。"},{"id":1449,"word":"housekeeper","pos":"n","meaning":"n. 管家","example":"The housekeeper cleans the rooms and changes the bedsheets every day.","example_zh":"管家每天打掃房間並更換床單。"},{"id":1450,"word":"housewife","pos":"n","meaning":"n. 家庭主婦","example":"Being a housewife is a demanding job that requires multitasking.","example_zh":"作為一名家庭主婦是一份需要多工處理的艱鉅工作。"},{"id":1451,"word":"housework","pos":"n","meaning":"n. 家務；家事","example":"They divide the housework equally to keep their home clean.","example_zh":"他們平等地分擔家務以保持家中整潔。"},{"id":1452,"word":"hug","pos":"v","meaning":"v. 擁抱 (n) 擁抱","example":"He gave his mother a warm hug before leaving for school.","example_zh":"他在出門上學前給了母親一個溫暖的擁抱。"},{"id":1453,"word":"human","pos":"adj","meaning":"adj. 人類的 (n) 人","example":"To err is human, but to forgive is divine.","example_zh":"人非聖賢，但寬恕是神聖的。"},{"id":1454,"word":"humanity","pos":"n","meaning":"n. 人性；人道；人類","example":"The organization works for the benefit of all humanity.","example_zh":"該組織致力於全人類的福祉。"},{"id":1455,"word":"humidity","pos":"n","meaning":"n. 濕氣","example":"The high humidity makes it feel much hotter than it really is.","example_zh":"高濕度讓人感覺比實際溫度熱得多。"},{"id":1456,"word":"humor","pos":"n","meaning":"n. 幽默","example":"She has a great sense of humor and always makes me laugh.","example_zh":"她很有幽默感，總是讓我笑。"},{"id":1457,"word":"humorous","pos":"adj","meaning":"adj. 幽默的","example":"He told a humorous story that kept us entertained all evening.","example_zh":"他講了一個幽默的故事，讓我們整個晚上都很開心。"},{"id":1458,"word":"hurricane","pos":"n","meaning":"n. 颶風","example":"The hurricane caused extensive damage to the coastal towns.","example_zh":"颶風對沿海城鎮造成了廣泛的破壞。"},{"id":1459,"word":"hush","pos":"v","meaning":"v. （使）安靜 (n) 安靜","example":"The teacher asked for a hush so she could begin the lesson.","example_zh":"老師要求安靜，以便她能開始上課。"},{"id":1460,"word":"hut","pos":"n","meaning":"n. 簡陋小屋；茅舍","example":"They found a small hut in the woods where they could stay for the night.","example_zh":"他們在樹林裡發現了一間小茅舍，可以在那過夜。"},{"id":1461,"word":"hydrogen","pos":"n","meaning":"n. 氫","example":"Hydrogen is the lightest and most abundant element in the universe.","example_zh":"氫是宇宙中最輕且最豐富的元素。"},{"id":1462,"word":"iceberg","pos":"n","meaning":"n. 冰山","example":"The ship sank after it collided with a large iceberg.","example_zh":"這艘船在與一座大型冰山相撞後沉沒了。"},{"id":1463,"word":"icy","pos":"adj","meaning":"adj. 冰冷的","example":"The water in the river was icy and dangerous to swim in.","example_zh":"河裡的水冰冷，游泳很危險。"}]},
{"unit":12,"unit_label":"p.23-24","words":[{"id":1464,"word":"ideal","pos":"adj","meaning":"adj. 理想的 (n) 理想","example":"That house is my ideal of a perfect family home.","example_zh":"那棟房子是我心目中完美家庭住宅的理想。"},{"id":1465,"word":"identical","pos":"adj","meaning":"adj. 同一個；同樣的","example":"The two twins look identical, making it difficult to tell them apart.","example_zh":"這對雙胞胎長得一模一樣，很難將他們分辨出來。"},{"id":1466,"word":"identification","pos":"n","meaning":"n. 辨認；確認；身分證明","example":"Please provide some form of identification to enter the building.","example_zh":"請提供某種身分證明以進入大樓。"},{"id":1467,"word":"identify","pos":"v","meaning":"v. 指認，顯示身份；認同","example":"Can you identify the bird singing in the tree?","example_zh":"你能指認出正在樹上唱歌的那隻鳥嗎？"},{"id":1468,"word":"identity","pos":"n","meaning":"n. 身分","example":"She is still trying to find her own identity in this complex world.","example_zh":"她仍在試圖在這個複雜的世界中找到自己的身分。"},{"id":1469,"word":"idiom","pos":"n","meaning":"n. 慣用語；成語","example":"Learning the common idioms will help you understand the language better.","example_zh":"學習慣用語將幫助你更好地理解這種語言。"},{"id":1470,"word":"idle","pos":"adj","meaning":"adj. 閒散的；不做事的 (v) 虛度；閒混","example":"He spent his day idle, sitting on the porch and watching the clouds.","example_zh":"他閒散地度過了一天，坐在門廊上望著雲朵。"},{"id":1471,"word":"idol","pos":"n","meaning":"n. 偶像","example":"She has been my musical idol since I was a teenager.","example_zh":"自從我青少年時期以來，她一直是我的音樂偶像。"},{"id":1472,"word":"ignorance","pos":"n","meaning":"n. 無知；不知道","example":"His ignorance of the law did not excuse him from his actions.","example_zh":"他對法律的無知並不能免除他行為的責任。"},{"id":1473,"word":"ignorant","pos":"adj","meaning":"adj. 無知的；不知曉的","example":"I was ignorant of the fact that the office would be closed today.","example_zh":"我當時不知道今天辦公室會關閉的事實。"},{"id":1474,"word":"ignore","pos":"v","meaning":"v. 忽略，不注意","example":"It is better to face your problems instead of trying to ignore them.","example_zh":"面對問題比試圖忽略它們要好得多。"},{"id":1475,"word":"illustrate","pos":"v","meaning":"v. 說明；用例子證明；加插圖；圖解","example":"The teacher used a diagram to illustrate the life cycle of a butterfly.","example_zh":"老師用一張圖解來說明蝴蝶的生命週期。"},{"id":1476,"word":"illustration","pos":"n","meaning":"n. 例子；實例；圖解","example":"This graph is a clear illustration of the company's growth.","example_zh":"這張圖表是公司成長的清楚實例。"},{"id":1477,"word":"image","pos":"n","meaning":"n. 形象；肖像；（心目中的）形象","example":"The politician wants to improve his image with the public.","example_zh":"這位政治人物想要改善他在大眾心中的形象。"},{"id":1478,"word":"imagery","pos":"n","meaning":"n. 意象，比喻（文學方面）","example":"The poet uses vivid imagery to describe the peaceful forest.","example_zh":"這位詩人使用生動的意象來描繪和平的森林。"},{"id":1479,"word":"imaginable","pos":"adj","meaning":"adj. 可想到的","example":"Everything imaginable went wrong during the trip.","example_zh":"旅行期間，所有想得到的東西都出了差錯。"},{"id":1480,"word":"imaginary","pos":"adj","meaning":"adj. 虛構的；想像的","example":"She is afraid of the imaginary monsters under her bed.","example_zh":"她害怕床底下的虛構怪物。"},{"id":1481,"word":"imagination","pos":"n","meaning":"n. 想像（力）","example":"Children have a very active imagination.","example_zh":"孩子們有非常活躍的想像力。"},{"id":1482,"word":"imaginative","pos":"adj","meaning":"adj. 富有想像力的；有創意的","example":"She is an imaginative writer who creates wonderful stories.","example_zh":"她是一位富有想像力的作家，創造出美妙的故事。"},{"id":1483,"word":"imagine","pos":"v","meaning":"v. 想像","example":"Can you imagine living on another planet?","example_zh":"你能想像生活在另一個星球上嗎？"},{"id":1484,"word":"imitate","pos":"v","meaning":"v. 模仿；效法","example":"Children often imitate their parents' behavior.","example_zh":"孩子們經常模仿父母的行為。"},{"id":1485,"word":"imitation","pos":"n","meaning":"n. 模仿；仿製品","example":"This bag is just a cheap imitation of the original designer brand.","example_zh":"這個包包只是原創設計師品牌的廉價仿製品。"},{"id":1486,"word":"immediate","pos":"adj","meaning":"adj. 直接的；立刻的","example":"We need an immediate solution to this urgent problem.","example_zh":"我們需要針對這個緊迫問題提供立刻的解決方案。"},{"id":1487,"word":"immediately","pos":"adv","meaning":"adv. 立刻，馬上","example":"He immediately started working on the project after the meeting.","example_zh":"會議後，他立刻開始執行該專案。"},{"id":1488,"word":"immense","pos":"adj","meaning":"adj. 巨大的","example":"The museum has an immense collection of rare artifacts.","example_zh":"這間博物館擁有數量巨大的稀有文物收藏。"},{"id":1489,"word":"immensely","pos":"adv","meaning":"adv. 極度，非常","example":"I was immensely happy when I heard the good news.","example_zh":"聽到好消息時，我感到極度快樂。"},{"id":1490,"word":"immensity","pos":"n","meaning":"n. 巨大","example":"The sheer immensity of the ocean is difficult to describe.","example_zh":"海洋的巨大程度難以形容。"},{"id":1491,"word":"immigrant","pos":"n","meaning":"n. （自外國移入的）移民","example":"Many immigrants have contributed to the cultural diversity of this country.","example_zh":"許多移民為這個國家的文化多樣性做出了貢獻。"},{"id":1492,"word":"immigrate","pos":"v","meaning":"v. 移居入境","example":"People immigrate to this country seeking better opportunities.","example_zh":"人們為了尋求更好的機會而移居這個國家。"},{"id":1493,"word":"immigration","pos":"n","meaning":"n. 移居","example":"The government has updated its policies regarding immigration.","example_zh":"政府更新了關於移居的政策。"},{"id":1494,"word":"impact","pos":"n","meaning":"n. 衝擊；影響 (v) 衝擊；影響","example":"The new law will have a significant impact on the environment.","example_zh":"這項新法律將對環境產生重大影響。"},{"id":1495,"word":"implement","pos":"v","meaning":"v. 實施，執行","example":"We need a good plan to implement these new changes.","example_zh":"我們需要一個好計畫來實施這些新變動。"},{"id":1496,"word":"implementation","pos":"n","meaning":"n. 實施，執行","example":"The successful implementation of the plan requires everyone's cooperation.","example_zh":"該計畫的成功執行需要大家的合作。"},{"id":1497,"word":"imply","pos":"v","meaning":"v. 暗示","example":"Are you trying to imply that I am responsible for this mistake?","example_zh":"你是在試圖暗示我對這個錯誤負責嗎？"},{"id":1498,"word":"import","pos":"v","meaning":"v. 進口 (n) 進口（品）；輸入","example":"The company decided to import goods from overseas to save costs.","example_zh":"為了節省成本，公司決定從海外進口貨物。"},{"id":1499,"word":"impress","pos":"v","meaning":"v. 使印象深刻","example":"She hoped to impress the interviewers with her experience.","example_zh":"她希望能以她的經驗給面試官留下深刻印象。"},{"id":1500,"word":"impression","pos":"n","meaning":"n. 印象","example":"Her first impression of the new student was that he was very shy.","example_zh":"她對那位新生的第一印象是他非常害羞。"},{"id":1501,"word":"impressive","pos":"adj","meaning":"adj. 令人印象深刻的","example":"The view from the top of the mountain was truly impressive.","example_zh":"山頂的景色真是令人印象深刻。"},{"id":1502,"word":"imprison","pos":"v","meaning":"v. 監禁","example":"The judge decided to imprison the criminal for five years.","example_zh":"法官決定將該罪犯監禁五年。"},{"id":1503,"word":"imprisonment","pos":"n","meaning":"n. 監禁","example":"He spent ten years of imprisonment for the crime he committed.","example_zh":"他因所犯下的罪行服了十年的刑（監禁）。"},{"id":1504,"word":"improper","pos":"adj","meaning":"adj. 不合適的","example":"It is improper to speak loudly in the library.","example_zh":"在圖書館大聲喧嘩是不合適的。"},{"id":1505,"word":"improve","pos":"v","meaning":"v. 改善","example":"She practices every day to improve her piano skills.","example_zh":"她每天練習以改善她的鋼琴技巧。"},{"id":1506,"word":"improvement","pos":"n","meaning":"n. 改善","example":"There has been a great improvement in his grades this semester.","example_zh":"他這學期的成績有了很大的改善。"},{"id":1507,"word":"in addition to","pos":"phr","meaning":"phr. 除了","example":"In addition to English, she also speaks Spanish and French.","example_zh":"除了英語，她還會說西班牙語和法語。"},{"id":1508,"word":"in close cooperation with","pos":"phr","meaning":"phr. 與～密切合作","example":"The charity works in close cooperation with the local government.","example_zh":"該慈善機構與當地政府密切合作。"},{"id":1509,"word":"in comparison","pos":"phr","meaning":"phr. 比較，相較之下","example":"In comparison to last year, our sales have increased significantly.","example_zh":"與去年相比，我們的銷售額顯著增加。"},{"id":1510,"word":"in contrast","pos":"phr","meaning":"phr. 相對地","example":"His personality is quite outgoing; in contrast, his brother is very quiet.","example_zh":"他的個性相當外向；相較之下，他哥哥非常安靜。"},{"id":1511,"word":"in crisis","pos":"phr","meaning":"phr. 陷入危機","example":"The nation is currently in crisis due to the severe economic downturn.","example_zh":"由於嚴重的經濟衰退，該國目前陷入危機。"},{"id":1512,"word":"in essence","pos":"phr","meaning":"phr. 本質上，實質上","example":"In essence, the problem is about how we communicate with each other.","example_zh":"本質上，這個問題在於我們如何溝通。"},{"id":1513,"word":"in honor of","pos":"phr","meaning":"phr. 為了紀念","example":"The statue was built in honor of the brave soldiers.","example_zh":"這座雕像的建立是為了紀念（為了向...致敬）勇敢的士兵。"},{"id":1514,"word":"in horror","pos":"phr","meaning":"phr. 驚恐地","example":"She looked at the wreckage in horror as the smoke filled the air.","example_zh":"當煙霧瀰漫時，她驚恐地看著殘骸。"},{"id":1515,"word":"in memory of (someone)","pos":"phr","meaning":"phr. 為了紀念某人，作為對(某人)的紀念","example":"They named the new library in memory of the late professor.","example_zh":"他們為新圖書館命名以紀念那位已故教授。"},{"id":1516,"word":"in one's presence","pos":"phr","meaning":"phr. 在某人面前","example":"Please be careful with your words in my presence.","example_zh":"在我面前說話時請小心。"},{"id":1517,"word":"in other words","pos":"phr","meaning":"phr. 換句話說(=that is, namely)","example":"The store is closed; in other words, you cannot buy anything today.","example_zh":"店沒開；換句話說，你今天買不到任何東西。"},{"id":1518,"word":"in public","pos":"phr","meaning":"phr. 公開地","example":"It is not polite to yell at someone in public.","example_zh":"在公共場合對人大吼大叫是不禮貌的。"},{"id":1519,"word":"in return (for something)","pos":"phr","meaning":"phr. 作為(對某事的)回報","example":"I helped him with his project, and in return, he helped me study.","example_zh":"我幫他做了專案，作為回報，他幫我學習。"},{"id":1520,"word":"in ruins","pos":"phr","meaning":"phr. (建築物、城鎮等 ) 殘破不堪","example":"The ancient city was left in ruins after the earthquake.","example_zh":"地震後，那座古城殘破不堪。"},{"id":1521,"word":"in spite of","pos":"phr","meaning":"phr. 儘管","example":"In spite of the heavy rain, the soccer game continued as scheduled.","example_zh":"儘管大雨滂沱，足球賽仍按原定計畫進行。"},{"id":1522,"word":"in the end","pos":"phr","meaning":"phr. 最後","example":"They argued for hours, but in the end, they reached an agreement.","example_zh":"他們爭論了好幾個小時，但最後達成了一致。"},{"id":1523,"word":"in the face of something","pos":"phr","meaning":"phr. 面臨(危險、困難的)情形","example":"He remained calm in the face of great danger.","example_zh":"他在面臨巨大危險時仍保持冷靜。"},{"id":1524,"word":"in the long term","pos":"phr","meaning":"phr. 從長期來看","example":"Education is a good investment in the long term.","example_zh":"從長期來看，教育是一項很好的投資。"},{"id":1525,"word":"in the meantime","pos":"phr","meaning":"phr. 在這時(=at the same time)","example":"I will finish my work soon; in the meantime, please wait here.","example_zh":"我很快就會完成工作；在此期間（同時），請在這裡等候。"},{"id":1526,"word":"in the midst of","pos":"phr","meaning":"phr. 在～的中間","example":"She was in the midst of cleaning her room when the phone rang.","example_zh":"電話響起時，她正在打掃房間。"},{"id":1527,"word":"in vain","pos":"phr","meaning":"phr. 徒勞無功","example":"All his efforts to fix the broken computer were in vain.","example_zh":"他修理電腦的所有努力都徒勞無功。"},{"id":1528,"word":"incapability","pos":"n","meaning":"n. 無能力","example":"His incapability to handle stress led to his resignation.","example_zh":"他無法處理壓力導致他辭職。"},{"id":1529,"word":"incapable","pos":"adj","meaning":"adj. 無能力的","example":"The car is incapable of driving on such rough roads.","example_zh":"這輛車無法在如此崎嶇的道路上行駛。"},{"id":1530,"word":"incident","pos":"n","meaning":"n. 偶發事件","example":"There was a minor incident at the airport yesterday morning.","example_zh":"昨天早上機場發生了一件小小的偶發事件。"},{"id":1531,"word":"include","pos":"v","meaning":"v. 包括，包含","example":"The price of the meal includes a drink and a dessert.","example_zh":"餐點價格包含飲料和甜點。"},{"id":1532,"word":"including","pos":"prep","meaning":"prep. 包括","example":"Twenty people, including three children, attended the party.","example_zh":"二十人參加了派對，其中包括三名兒童。"},{"id":1533,"word":"increase","pos":"v/n","meaning":"v/n. 增加","example":"The government hopes to increase the number of jobs available.","example_zh":"政府希望能增加現有的工作機會數量。"},{"id":1534,"word":"incredible","pos":"adj","meaning":"adj. 難以置信的","example":"The speed of the new computer is incredible.","example_zh":"這台新電腦的速度令人難以置信。"},{"id":1535,"word":"indeed","pos":"adv","meaning":"adv. 確實地；的確","example":"He was indeed very happy with his final test results.","example_zh":"他對於期末考結果確實感到非常高興。"},{"id":1536,"word":"indicate","pos":"v","meaning":"v. 象徵，表示","example":"The bright colors of the sky indicate that a storm is coming.","example_zh":"天空明亮的顏色象徵（顯示）風暴即將來臨。"},{"id":1537,"word":"indication","pos":"n","meaning":"n. 指示；徵候","example":"A fever is often an indication of a viral infection.","example_zh":"發燒通常是病毒感染的徵候。"},{"id":1538,"word":"individual","pos":"n","meaning":"n. 個人 (adj) 個別的","example":"Every individual in the company has a specific role to play.","example_zh":"公司裡的每個個人都有其特定的角色要擔任。"},{"id":1539,"word":"indoor","pos":"adj","meaning":"adj. 室內的","example":"Swimming is a popular indoor activity during the winter.","example_zh":"冬季期間，游泳是一項受歡迎的室內活動。"},{"id":1540,"word":"indoors","pos":"adv","meaning":"adv. 室內地","example":"It is better to exercise indoors when the air quality is poor.","example_zh":"當空氣品質不佳時，最好在室內運動。"},{"id":1541,"word":"industrial","pos":"adj","meaning":"adj. 工業的","example":"The country has experienced rapid industrial growth over the last decade.","example_zh":"過去十年，該國經歷了快速的工業成長。"},{"id":1542,"word":"industrialize","pos":"v","meaning":"v. （使）工業化","example":"The government is trying to industrialize the rural areas.","example_zh":"政府正試圖讓農村地區工業化。"},{"id":1543,"word":"industry","pos":"n","meaning":"n. 工業，產業","example":"The car industry is facing many new challenges today.","example_zh":"汽車工業今日正面臨許多新挑戰。"},{"id":1544,"word":"infant","pos":"n","meaning":"n. 嬰兒；幼兒","example":"The mother held her infant gently in her arms.","example_zh":"母親輕柔地將嬰兒抱在懷中。"},{"id":1545,"word":"infect","pos":"v","meaning":"v. 感染","example":"Be sure to clean the wound so it does not infect.","example_zh":"一定要清潔傷口，以免感染。"},{"id":1546,"word":"infection","pos":"n","meaning":"n. 傳染；感染","example":"She developed a serious infection after the surgery.","example_zh":"手術後，她發生了嚴重的感染。"},{"id":1547,"word":"infer","pos":"v","meaning":"v. 推論，推斷","example":"From the evidence, we can infer that the suspect was there.","example_zh":"從證據來看，我們可以推斷嫌疑人當時在場。"},{"id":1548,"word":"inference","pos":"n","meaning":"n. 推斷的結果","example":"Based on the facts, our inference is that he is guilty.","example_zh":"基於事實，我們的推論是他有罪。"},{"id":1549,"word":"inferior","pos":"adj","meaning":"adj. 下級的；次等的 (n) 下屬","example":"He refused to be treated as an inferior by his colleagues.","example_zh":"他拒絕被同事當作下屬（次等的人）對待。"},{"id":1550,"word":"infertility","pos":"n","meaning":"n. 不孕","example":"The couple is seeking medical help for their infertility.","example_zh":"這對夫婦正在尋求醫療協助以解決不孕問題。"},{"id":1551,"word":"inflation","pos":"n","meaning":"n. 通貨膨脹；膨脹；充氣","example":"Inflation has caused the price of basic goods to rise.","example_zh":"通貨膨脹導致基本商品價格上漲。"},{"id":1552,"word":"influence","pos":"v/n","meaning":"v/n. 影響","example":"His parents have a strong influence on his decision-making.","example_zh":"他的父母對他的決策有強大的影響。"},{"id":1553,"word":"influential","pos":"adj","meaning":"adj. 有影響力的","example":"She is an influential writer who has changed many people's perspectives.","example_zh":"她是一位有影響力的作家，改變了許多人的觀點。"},{"id":1554,"word":"inform","pos":"v","meaning":"v. 通知；告知","example":"Please inform the teacher if you will be absent from class.","example_zh":"如果你會缺席，請通知老師。"},{"id":1555,"word":"information","pos":"n","meaning":"n. 消息；資訊；情報","example":"The internet is a great source of information.","example_zh":"網際網路是獲取資訊的絕佳來源。"},{"id":1556,"word":"informative","pos":"adj","meaning":"adj. 具有知識性的","example":"The lecture was very informative and covered many new topics.","example_zh":"那場演講非常有知識性，涵蓋了許多新主題。"},{"id":1557,"word":"ingredient","pos":"n","meaning":"n. 材料；成分","example":"The secret ingredient in her recipe is a little bit of cinnamon.","example_zh":"她食譜裡的祕密材料是一點點肉桂。"},{"id":1558,"word":"initial","pos":"adj","meaning":"adj. 最初的 (n) 開頭的字母（常用複數型）","example":"The initial plan was to finish the project by Friday.","example_zh":"最初的計畫是在週五前完成專案。"},{"id":1559,"word":"initially","pos":"adv","meaning":"adv. 最初，開始","example":"We were initially confused, but then everything became clear.","example_zh":"我們起初感到困惑，但後來一切都清楚了。"},{"id":1560,"word":"injure","pos":"v","meaning":"v. 損害；受傷","example":"Be careful not to injure yourself while playing sports.","example_zh":"運動時要小心不要傷害到自己。"},{"id":1561,"word":"injury","pos":"n","meaning":"n. 損害；受傷","example":"He suffered a serious leg injury during the game.","example_zh":"他在比賽中遭受了嚴重的腿部受傷。"},{"id":1562,"word":"inn","pos":"n","meaning":"n. 旅店","example":"They stayed at a cozy country inn for the weekend.","example_zh":"他們在週末住了一間舒適的鄉村旅店。"},{"id":1563,"word":"inner","pos":"adj","meaning":"adj. 內部的；內心的","example":"She kept her inner thoughts to herself.","example_zh":"她將內心的想法留給自己。"},{"id":1564,"word":"innocence","pos":"n","meaning":"n. 無罪；清白；天真；純潔","example":"The child's innocence brought a smile to everyone's face.","example_zh":"這個孩子的天真帶給每個人臉上笑容。"},{"id":1565,"word":"innocent","pos":"adj","meaning":"adj. 無罪的；天真的","example":"The judge declared him innocent of all charges.","example_zh":"法官宣布他所有指控均無罪。"},{"id":1566,"word":"innovation","pos":"n","meaning":"n. 創新，革新","example":"The company is known for its constant innovation in design.","example_zh":"該公司以其在設計上的不斷創新而聞名。"},{"id":1567,"word":"innovative","pos":"adj","meaning":"adj. 創新的，革新的","example":"The engineer came up with an innovative way to solve the problem.","example_zh":"工程師想出了一種創新的方法來解決這個問題。"},{"id":1568,"word":"input","pos":"v","meaning":"v. 輸入 (n) 輸入","example":"You need to provide the correct input into the computer.","example_zh":"你需要提供正確的輸入給電腦。"},{"id":1569,"word":"inquire","pos":"v","meaning":"v. 詢問，打聽","example":"I called the office to inquire about the job application process.","example_zh":"我打電話到辦公室詢問求職申請程序。"},{"id":1570,"word":"inquiring","pos":"adj","meaning":"adj. 好奇的，好問的","example":"The child has an inquiring mind and asks many questions.","example_zh":"這孩子有顆好奇的心，總是問很多問題。"},{"id":1571,"word":"inquiry","pos":"n","meaning":"n. 詢問，打聽","example":"The police are making an inquiry into the recent events.","example_zh":"警方正在對最近的事件進行詢問（調查）。"},{"id":1572,"word":"insert","pos":"v","meaning":"v. 插入；放入","example":"Please insert your card into the machine to withdraw money.","example_zh":"請插入你的卡片到機器中以提款。"},{"id":1573,"word":"insertion","pos":"n","meaning":"n. 插入","example":"The insertion of the new chip improved the computer's performance.","example_zh":"新晶片的插入改善了電腦的效能。"},{"id":1574,"word":"insight","pos":"n","meaning":"n. 深刻了解，領悟","example":"The book provides deep insight into the nature of human relationships.","example_zh":"這本書對人類關係的本質提供了深刻的領悟。"},{"id":1575,"word":"inspect","pos":"v","meaning":"v. 檢查","example":"The safety inspector will inspect the building tomorrow.","example_zh":"安全檢查員明天將會檢查這棟建築。"},{"id":1576,"word":"inspection","pos":"n","meaning":"n. 檢查","example":"Regular inspection of the equipment can prevent accidents.","example_zh":"對設備進行定期檢查可以預防意外。"},{"id":1577,"word":"inspector","pos":"n","meaning":"n. 檢查者","example":"The building inspector checked that all safety codes were met.","example_zh":"建築檢查員檢查了所有安全準則皆已符合。"},{"id":1578,"word":"inspiration","pos":"n","meaning":"n. 靈感；鼓舞的人或事物","example":"Seeing the beautiful sunrise was an inspiration for her painting.","example_zh":"看見美麗的日出對她的畫作而言是一種靈感。"},{"id":1579,"word":"inspire","pos":"v","meaning":"v. 鼓舞；激發；賦予靈感；給予啟示","example":"His story continues to inspire many young people to follow their dreams.","example_zh":"他的故事持續鼓舞許多年輕人去追隨夢想。"},{"id":1580,"word":"install","pos":"v","meaning":"v. 安裝；設置；使就職","example":"The workers will install the new air conditioning unit today.","example_zh":"工人們今天將會安裝新的冷氣機。"},{"id":1581,"word":"instant","pos":"adj","meaning":"adj. 立即的，馬上的 (n) 瞬間","example":"The medicine provided instant relief from the pain.","example_zh":"這種藥物提供了立即的止痛效果。"},{"id":1582,"word":"instantly","pos":"adv","meaning":"adv. 立即，馬上","example":"She answered the question instantly without hesitation.","example_zh":"她毫不猶豫地立即回答了問題。"},{"id":1583,"word":"instead","pos":"adv","meaning":"adv. 作為替代","example":"There was no milk, so I used soy milk instead.","example_zh":"沒有牛奶，所以我用豆漿作為替代。"},{"id":1584,"word":"instead of","pos":"phr","meaning":"phr. 取代，代替","example":"She decided to study physics instead of chemistry.","example_zh":"她決定學習物理，而非化學。"},{"id":1585,"word":"instinct","pos":"n","meaning":"n. 直覺；天性；本能","example":"Animals rely on instinct to find food and survive.","example_zh":"動物仰賴本能來尋找食物並生存。"},{"id":1586,"word":"instruct","pos":"v","meaning":"v. 指示；吩咐；命令；教導；指導","example":"The teacher will instruct the students on how to use the lab equipment.","example_zh":"老師將指示學生如何使用實驗室器材。"},{"id":1587,"word":"instruction","pos":"n","meaning":"n. 教導；指示","example":"Please read the instructions carefully before you assemble the furniture.","example_zh":"請在組裝家具前仔細閱讀指示。"},{"id":1588,"word":"instructor","pos":"n","meaning":"n. （大學）講師；教練；指導員","example":"He is a qualified driving instructor with many years of experience.","example_zh":"他是一位有多年經驗的合格駕駛教練。"},{"id":1589,"word":"insult","pos":"v","meaning":"v. 侮辱 (n) 侮辱","example":"It is wrong to insult people just because you disagree with them.","example_zh":"僅僅因為你不同意人們的觀點就去侮辱他們是不對的。"},{"id":1590,"word":"insulting","pos":"adj","meaning":"adj. 侮辱的","example":"He made an insulting remark that upset his friend.","example_zh":"他說了一句侮辱性的話，讓他朋友很不高興。"},{"id":1591,"word":"insurance","pos":"n","meaning":"n. 保險","example":"You should purchase insurance for your car to cover potential accidents.","example_zh":"你應該為你的車購買保險以承擔潛在的事故。"},{"id":1592,"word":"intellectual","pos":"adj","meaning":"adj. 有智能的 (n) 知識分子","example":"He is a well-known intellectual who writes about social issues.","example_zh":"他是一位撰寫社會議題的知名知識分子。"},{"id":1593,"word":"intelligence","pos":"n","meaning":"n. 智能","example":"Artificial intelligence is changing the way we live and work.","example_zh":"人工智慧正在改變我們生活與工作的方式。"},{"id":1594,"word":"intelligent","pos":"adj","meaning":"adj. 聰明的","example":"She is an intelligent student who always asks insightful questions.","example_zh":"她是一位聰明的學生，總是提出深刻的問題。"},{"id":1595,"word":"intend","pos":"v","meaning":"v. 意圖；打算","example":"We intend to visit Europe during our summer vacation.","example_zh":"我們打算在暑假期間去歐洲旅遊。"},{"id":1596,"word":"intense","pos":"adj","meaning":"adj. 強烈的；激烈的","example":"The athlete felt intense pain in his leg during the race.","example_zh":"那位運動員在比賽中感受到腿部強烈的疼痛。"},{"id":1597,"word":"intensify","pos":"v","meaning":"v. （使）變強烈","example":"The government plans to intensify its efforts to fight crime.","example_zh":"政府計畫強化其打擊犯罪的力度。"},{"id":1598,"word":"intensity","pos":"n","meaning":"n. 強度","example":"The intensity of the light made it difficult to see clearly.","example_zh":"光線的強度讓我很難看清楚。"},{"id":1599,"word":"intensive","pos":"adj","meaning":"adj. 密集的；集中的","example":"They are taking an intensive English course this summer.","example_zh":"他們這個夏天正在上密集的英文課程。"},{"id":1600,"word":"intent","pos":"n","meaning":"n. 目的，意圖","example":"He had no intent to harm anyone when he entered the building.","example_zh":"他進入大樓時並沒有意圖要傷害任何人。"},{"id":1601,"word":"intention","pos":"n","meaning":"n. 意圖","example":"Her intention is to study abroad after she graduates.","example_zh":"她的意圖是在畢業後出國留學。"},{"id":1602,"word":"interact","pos":"v","meaning":"v. 互動；互相影響","example":"Children learn to interact with others through play.","example_zh":"孩子們透過遊戲學習與他人互動。"}]},
{"unit":13,"unit_label":"p.25-26","words":[{"id":1603,"word":"interaction","pos":"n","meaning":"n. 互動；互相影響","example":"Good social interaction is important for emotional development.","example_zh":"良好的社交互動對於情緒發展很重要。"},{"id":1604,"word":"interfere","pos":"v","meaning":"v. 妨礙；干涉","example":"Please do not interfere in matters that do not concern you.","example_zh":"請不要干涉與你無關的事。"},{"id":1605,"word":"interference","pos":"n","meaning":"n. 干涉，干預","example":"The constant interference from his boss made the work difficult.","example_zh":"上司不斷的干預讓工作變得困難。"},{"id":1606,"word":"intermediate","pos":"adj","meaning":"adj. 中等程度的；中級的","example":"This book is suitable for students at an intermediate level.","example_zh":"這本書適合中級程度的學生。"},{"id":1607,"word":"internal","pos":"adj","meaning":"adj. 內部的","example":"The company is undergoing some internal changes.","example_zh":"公司正在經歷一些內部變動。"},{"id":1608,"word":"international","pos":"adj","meaning":"adj. 國際的","example":"They signed an international treaty to protect the environment.","example_zh":"他們簽署了一項保護環境的國際條約。"},{"id":1609,"word":"Internet","pos":"n","meaning":"n. 網際網路","example":"The Internet has changed the way we access information.","example_zh":"網際網路改變了我們取得資訊的方式。"},{"id":1610,"word":"interpret","pos":"v","meaning":"v. 解釋；詮釋；口譯；翻譯","example":"The diplomat had to interpret the speech for the foreign visitors.","example_zh":"外交官必須為外國訪客口譯那場演講。"},{"id":1611,"word":"interrupt","pos":"v","meaning":"v. 打斷；阻礙","example":"Sorry to interrupt, but I have an urgent question.","example_zh":"抱歉打斷一下，但我有個緊急問題。"},{"id":1612,"word":"interruption","pos":"n","meaning":"n. 妨礙；中斷","example":"The meeting continued after a brief interruption.","example_zh":"在短暫中斷後，會議繼續進行。"},{"id":1613,"word":"intimate","pos":"adj","meaning":"adj. 親密的","example":"They have an intimate friendship that has lasted for years.","example_zh":"他們有著維持多年的親密友誼。"},{"id":1614,"word":"intonation","pos":"n","meaning":"n. 語調；抑揚","example":"Her intonation makes it clear that she is asking
