rime.","example_zh":"警方仍在試圖尋找該犯罪背後的動機。"},{"id":1910,"word":"motor","pos":"n","meaning":"n. 馬達；發動機","example":"The motor of the boat stopped working in the middle of the lake.","example_zh":"船的馬達在湖中央停止運作了。"},{"id":1911,"word":"mountainous","pos":"adj","meaning":"adj. 多山的","example":"Traveling through the mountainous region takes a long time.","example_zh":"通過該多山的地區需要很長時間。"},{"id":1912,"word":"MTV/music television","pos":"n","meaning":"n. 音樂電視台","example":"She enjoys watching programs on music television.","example_zh":"她喜歡看音樂電視台的節目。"},{"id":1913,"word":"muddy","pos":"adj","meaning":"adj. 泥濘的","example":"My shoes became muddy after walking in the rain.","example_zh":"雨中行走後我的鞋子變得泥濘不堪。"},{"id":1914,"word":"multiple","pos":"adj","meaning":"adj. 複合的；多樣的 (n) 倍數","example":"There are multiple ways to solve this math problem.","example_zh":"有多種方法可以解決這個數學問題。"},{"id":1915,"word":"multiply","pos":"v","meaning":"v. 相乘，增加，繁殖","example":"If you multiply 5 by 3, you get 15.","example_zh":"如果你把5乘以3，你會得到15。"},{"id":1916,"word":"murder","pos":"v","meaning":"v. 謀殺 (n) 謀殺","example":"The criminal was arrested for murder.","example_zh":"該罪犯因謀殺而被捕。"},{"id":1917,"word":"murderer","pos":"n","meaning":"n. 謀殺者；兇手","example":"The police are looking for the murderer.","example_zh":"警方正在尋找那個兇手。"},{"id":1918,"word":"murmur","pos":"n","meaning":"n. 低語聲 (v) 低聲說","example":"She heard a faint murmur coming from the next room.","example_zh":"她聽到隔壁房間傳來微弱的低語聲。"},{"id":1919,"word":"muscle","pos":"n","meaning":"n. 肌肉","example":"He has strong muscles from lifting weights every day.","example_zh":"他因為每天舉重而有強壯的肌肉。"},{"id":1920,"word":"mushroom","pos":"n","meaning":"n. 洋菇；蕈 (v) 急速增加","example":"The number of small businesses in the city mushroomed this year.","example_zh":"今年城市裡的小企業數量急速增加。"},{"id":1921,"word":"musical","pos":"adj","meaning":"adj. 音樂的 (n) 音樂劇","example":"We went to see a popular musical in London.","example_zh":"我們去倫敦看了一部熱門的音樂劇。"},{"id":1922,"word":"mustache","pos":"n","meaning":"n. 鬍鬚","example":"He decided to grow a mustache for a change.","example_zh":"他決定留鬍鬚來改變一下造型。"},{"id":1923,"word":"mutual","pos":"adj","meaning":"adj. 互相的","example":"They have a mutual respect for each other's work.","example_zh":"他們對彼此的工作有相互的尊重。"},{"id":1924,"word":"mutually","pos":"adv","meaning":"adv. 相互地，共同地","example":"They agreed to work mutually to achieve their goals.","example_zh":"他們同意共同（相互地）努力以達成目標。"},{"id":1925,"word":"mysterious","pos":"adj","meaning":"adj. 神祕難解的","example":"The origins of the ancient building remain mysterious.","example_zh":"那座古老建築的起源仍然神祕難解。"},{"id":1926,"word":"mystery","pos":"n","meaning":"n. 神秘（的事物）","example":"The sudden disappearance of the plane is a mystery.","example_zh":"飛機的突然失蹤是一個謎。"},{"id":1927,"word":"nag","pos":"v","meaning":"v. 嘮叨","example":"Don't nag me about cleaning my room; I'll do it later.","example_zh":"不要嘮叨我打掃房間；我待會兒會做的。"},{"id":1928,"word":"namely","pos":"adv","meaning":"adv. 即；也就是","example":"There is only one person who can do it, namely you.","example_zh":"只有一個人能做這件事，也就是你。"},{"id":1929,"word":"nap","pos":"n","meaning":"n. 小睡；午覺 (v) 打盹","example":"The baby is taking a nap in the crib.","example_zh":"嬰兒正在嬰兒床裡睡午覺。"},{"id":1930,"word":"nationality","pos":"n","meaning":"n. 國籍","example":"You need to provide your nationality on the form.","example_zh":"你需要在表格上填寫你的國籍。"},{"id":1931,"word":"native","pos":"adj","meaning":"adj. 本地的；故鄉的；天生的；與生俱來的 (n) 當地人；本國人","example":"He is a native of Taiwan.","example_zh":"他是台灣的當地人。"},{"id":1932,"word":"navy","pos":"n","meaning":"n. 海軍","example":"He joined the navy to serve his country.","example_zh":"他加入海軍以報效國家。"},{"id":1933,"word":"nearsighted","pos":"adj","meaning":"adj. 近視眼的","example":"He needs glasses because he is nearsighted.","example_zh":"他需要戴眼鏡因為他是近視。"},{"id":1934,"word":"necessary","pos":"adj","meaning":"adj. 必要的，必須的","example":"Is it necessary to bring an umbrella today?","example_zh":"今天有必要帶雨傘嗎？"},{"id":1935,"word":"necessity","pos":"n","meaning":"n. 必需品；必要（性）","example":"Food and water are basic necessities for life.","example_zh":"食物和水是生命的基本必需品。"},{"id":1936,"word":"necktie","pos":"n","meaning":"n. 領帶","example":"He wore a blue necktie to the interview.","example_zh":"他面試時戴了一條藍色領帶。"},{"id":1937,"word":"needless to say","pos":"phr","meaning":"phr. 不用說","example":"Needless to say, we were very happy with the results.","example_zh":"不用說，我們對結果感到非常高興。"},{"id":1938,"word":"needy","pos":"adj","meaning":"adj. 貧困的","example":"The charity helps needy families in the area.","example_zh":"該慈善機構幫助該地區貧困的家庭。"},{"id":1939,"word":"negative","pos":"adj","meaning":"adj. 否定的，負面的","example":"Don't be so negative; everything will turn out fine.","example_zh":"別這麼負面；一切都會好起來的。"},{"id":1940,"word":"neglect","pos":"v","meaning":"v. 疏忽；忽視 (n) 疏忽","example":"He was fired for his neglect of duty.","example_zh":"他因為疏忽職守而被解雇。"},{"id":1941,"word":"negotiate","pos":"v","meaning":"v. 協商；談判","example":"Both sides agreed to negotiate a peace treaty.","example_zh":"雙方同意協商一份和平條約。"},{"id":1942,"word":"neighborhood","pos":"n","meaning":"n. 附近地區；社區","example":"There is a nice park in our neighborhood.","example_zh":"我們社區裡有個不錯的公園。"},{"id":1943,"word":"neighboring","pos":"adj","meaning":"adj. 鄰近的，毗鄰的","example":"They visited the neighboring town for the festival.","example_zh":"他們去了鄰近的小鎮參加節慶。"},{"id":1944,"word":"nerve","pos":"n","meaning":"n. 神經","example":"The nerves in his hand were damaged in the accident.","example_zh":"他手部的神經在意外中受損了。"},{"id":1945,"word":"nervous","pos":"adj","meaning":"adj. 緊張的；神經的","example":"I feel nervous before giving a public speech.","example_zh":"公開發表演說前，我感到很緊張。"},{"id":1946,"word":"network","pos":"n","meaning":"n. 網狀物；網狀系統；電視網；廣播網","example":"The computer network is down, so we cannot access the internet.","example_zh":"電腦網路斷了，所以我們無法連接網際網路。"},{"id":1947,"word":"nevertheless","pos":"adv","meaning":"adv. 然而；儘管如此","example":"It was raining; nevertheless, we went for a walk.","example_zh":"當時正在下雨；儘管如此，我們還是去散步了。"},{"id":1948,"word":"nickname","pos":"n","meaning":"n. 綽號 (v) 取綽號","example":"His nickname is \"Speedy\" because he runs so fast.","example_zh":"他的綽號是「Speedy」，因為他跑得很快。"},{"id":1949,"word":"nightmare","pos":"n","meaning":"n. 惡夢","example":"I had a terrible nightmare that I was being chased.","example_zh":"我做了一個被追趕的可怕惡夢。"},{"id":1950,"word":"no longer","pos":"phr","meaning":"phr. 不再","example":"She no longer works at the library.","example_zh":"她不再在圖書館工作了。"},{"id":1951,"word":"noble","pos":"adj","meaning":"adj. 高尚的；貴族的 (n) 貴族","example":"He comes from a noble family.","example_zh":"他出身於貴族家庭。"},{"id":1952,"word":"nonetheless","pos":"adv","meaning":"adv. 雖然如此","example":"The task was difficult; nonetheless, he finished it on time.","example_zh":"這項任務很困難；雖然如此，他還是準時完成了。"},{"id":1953,"word":"nonsense","pos":"n","meaning":"n. 胡說；胡鬧","example":"That is pure nonsense; I don't believe you.","example_zh":"那純粹是胡說八道；我不相信你。"},{"id":1954,"word":"normal","pos":"adj","meaning":"adj. 標準的；正常的","example":"It is normal for children to be curious about everything.","example_zh":"小孩對每件事感到好奇是正常的。"},{"id":1955,"word":"not to mention","pos":"phr","meaning":"phr. 更別提","example":"The team played well, not to mention the captain's great leadership.","example_zh":"團隊表現得很好，更別提隊長卓越的領導力了。"},{"id":1956,"word":"not to mention (something)","pos":"phr","meaning":"phr. 更別提","example":"She is a great singer, not to mention a talented dancer.","example_zh":"她是一位很棒的歌手，更別提她還是一位有天賦的舞者。"},{"id":1957,"word":"noun","pos":"n","meaning":"n. 名詞","example":"\"Apple\" is a noun.","example_zh":"「蘋果」是一個名詞。"},{"id":1958,"word":"nourish","pos":"v","meaning":"v. 滋養；養育；助長","example":"Healthy food helps nourish the body and mind.","example_zh":"健康的食物有助於滋養身心。"},{"id":1959,"word":"novelist","pos":"n","meaning":"n. 小說家","example":"The novelist is working on her new book.","example_zh":"這位小說家正在創作她的新書。"},{"id":1960,"word":"nowadays","pos":"adv","meaning":"adv. 現今；當今","example":"Nowadays, most people use smartphones.","example_zh":"現今，大多數人都使用智慧型手機。"},{"id":1961,"word":"nuclear","pos":"adj","meaning":"adj. 原子核的；核子的","example":"The country has developed nuclear energy for electricity.","example_zh":"該國已發展出核能來發電。"},{"id":1962,"word":"numerous","pos":"adj","meaning":"adj. 許多的","example":"There are numerous reasons why I choose to live here.","example_zh":"我選擇住在這裡有許多的理由。"},{"id":1963,"word":"nun","pos":"n","meaning":"n. 尼姑；修女","example":"The nun lives in a quiet convent.","example_zh":"修女住在一間安靜的修道院裡。"},{"id":1964,"word":"nursery","pos":"n","meaning":"n. 托兒所","example":"The children are spending the day at the nursery.","example_zh":"孩子們在托兒所度過一天。"},{"id":1965,"word":"nutrition","pos":"n","meaning":"n. 營養（學）","example":"Proper nutrition is essential for a growing child.","example_zh":"適當的營養對成長中的孩子至關重要。"},{"id":1966,"word":"nylon","pos":"n","meaning":"n. 尼龍","example":"Her jacket is made of nylon.","example_zh":"她的夾克是用尼龍做的。"},{"id":1967,"word":"oak","pos":"n","meaning":"n. 橡樹；橡木","example":"The old oak tree in the yard is very big.","example_zh":"院子裡那棵老橡樹非常巨大。"},{"id":1968,"word":"oasis","pos":"n","meaning":"n. 綠洲 宜人的地方","example":"The spring in the desert is like an oasis.","example_zh":"沙漠中的泉水就像一處綠洲。"},{"id":1969,"word":"obedience","pos":"n","meaning":"n. 服從；順從","example":"The dog is trained for obedience.","example_zh":"那隻狗受過服從訓練。"},{"id":1970,"word":"obedient","pos":"adj","meaning":"adj. 服從的","example":"The obedient child did exactly what his parents asked.","example_zh":"那個服從的孩子完全照父母的要求做了。"},{"id":1971,"word":"objection","pos":"n","meaning":"n. 反對","example":"Does anyone have any objection to this plan?","example_zh":"有人對這個計畫有任何反對意見嗎？"},{"id":1972,"word":"objective","pos":"adj","meaning":"adj. 客觀的 (n) 目標；目的","example":"It is important to stay objective when making a decision.","example_zh":"做決定時保持客觀很重要。"},{"id":1973,"word":"observation","pos":"n","meaning":"n. 觀察（力）","example":"Careful observation is necessary for scientific experiments.","example_zh":"科學實驗需要仔細的觀察。"},{"id":1974,"word":"observe","pos":"v","meaning":"v. 觀察；遵守","example":"We must observe the traffic rules to stay safe.","example_zh":"我們必須遵守交通規則以保持安全。"},{"id":1975,"word":"obstacle","pos":"n","meaning":"n. 障礙物；障礙","example":"Lack of money is the biggest obstacle to our plans.","example_zh":"缺乏資金是我們計畫最大的障礙。"},{"id":1976,"word":"obtain","pos":"v","meaning":"v. 得到；獲得","example":"You can obtain a ticket at the front desk.","example_zh":"你可以在櫃台獲得一張票。"},{"id":1977,"word":"obvious","pos":"adj","meaning":"adj. 明顯的；清楚的","example":"It is obvious that he is tired; he is yawning a lot.","example_zh":"他很累是很明顯的；他一直在打哈欠。"},{"id":1978,"word":"occasion","pos":"n","meaning":"n. 場合","example":"A wedding is a special occasion.","example_zh":"婚禮是一個特殊的場合。"},{"id":1979,"word":"occasional","pos":"adj","meaning":"adj. 有時的；偶爾的","example":"We meet on occasional weekends for dinner.","example_zh":"我們偶爾在週末聚餐。"},{"id":1980,"word":"occupation","pos":"n","meaning":"n. 職業；佔領","example":"What is your occupation?","example_zh":"你的職業是什麼？"},{"id":1981,"word":"occupied","pos":"adj","meaning":"adj. 使用中的，忙碌的","example":"The room is currently occupied.","example_zh":"這個房間目前使用中。"},{"id":1982,"word":"occupy","pos":"v","meaning":"v. 佔領；佔據；使忙於","example":"The enemy army managed to occupy the city.","example_zh":"敵軍設法佔領了該城市。"},{"id":1983,"word":"occur to (someone)","pos":"phr","meaning":"phr. 想到，想起","example":"It didn't occur to me that he might be lying.","example_zh":"我沒想到他可能會撒謊。"},{"id":1984,"word":"odd","pos":"adj","meaning":"adj. 奇怪的；奇數的","example":"It is odd that he didn't call to tell us he would be late.","example_zh":"他沒有打電話告訴我們他會遲到，這很奇怪。"},{"id":1985,"word":"odds","pos":"n","meaning":"n. 劣勢，逆境；可能性","example":"The odds of winning the lottery are very low.","example_zh":"中彩券的機率非常低。"},{"id":1986,"word":"offend","pos":"v","meaning":"v. 激怒；冒犯；得罪","example":"I didn't mean to offend you with my comment.","example_zh":"我的評論並不是要冒犯你。"},{"id":1987,"word":"offended","pos":"adj","meaning":"adj. 被激怒的，受委屈的","example":"She felt offended by his rude behavior.","example_zh":"她對他粗魯的行為感到被冒犯。"},{"id":1988,"word":"offense","pos":"n","meaning":"n. 冒犯；無禮；令人討厭的事物；違規；犯法（行為）","example":"His comment was an offense to many people.","example_zh":"他的評論對許多人來說是一種冒犯。"},{"id":1989,"word":"offensive","pos":"adj","meaning":"adj. 討厭的；冒犯人的；攻擊的 (n) 進攻；攻勢","example":"The movie contains some offensive language.","example_zh":"這部電影包含了一些冒犯人的語言。"}]},
{"unit":16,"unit_label":"p.31-32","words":[{"id":1990,"word":"offer","pos":"v/n","meaning":"v/n. 提供","example":"They offered to help us with the heavy lifting.","example_zh":"他們提議幫我們搬運重物。"},{"id":1991,"word":"on and on","pos":"phr","meaning":"phr. 不停地","example":"The meeting went on and on for three hours.","example_zh":"會議持續不停地開了三個小時。"},{"id":1992,"word":"on average","pos":"phr","meaning":"phr. 一般來說","example":"On average, it takes thirty minutes to get to work.","example_zh":"一般來說，去上班需要三十分鐘。"},{"id":1993,"word":"on display","pos":"phr","meaning":"phr. 展示中","example":"The artwork is currently on display at the gallery.","example_zh":"藝術品目前正在藝廊展示中。"},{"id":1994,"word":"on hand","pos":"phr","meaning":"phr. 現有的，在手邊的","example":"We don't have enough supplies on hand for the whole week.","example_zh":"我們手邊沒有足夠一週使用的補給品。"},{"id":1995,"word":"on the other hand","pos":"phr","meaning":"phr. 另一方面","example":"The food is good; on the other hand, it is quite expensive.","example_zh":"食物很好吃；另一方面，它相當貴。"},{"id":1996,"word":"on the way","pos":"phr","meaning":"phr. 在～途中","example":"I am on the way to the airport.","example_zh":"我正在去機場的途中。"},{"id":1997,"word":"one day","pos":"phr","meaning":"phr. 某一天","example":"I hope to visit Japan one day.","example_zh":"我希望有一天能去日本旅遊。"},{"id":1998,"word":"one of a kind","pos":"phr","meaning":"phr. 獨一無二的","example":"This antique table is one of a kind.","example_zh":"這張古董桌子是獨一無二的。"},{"id":1999,"word":"onto","pos":"prep","meaning":"prep. 到～上面","example":"The cat jumped onto the table.","example_zh":"貓跳到桌子上。"},{"id":2000,"word":"opera","pos":"n","meaning":"n. 歌劇","example":"She loves listening to opera music at the theater.","example_zh":"她喜歡在劇院聽歌劇。"},{"id":2001,"word":"operate","pos":"v","meaning":"v. 操作","example":"The pilot knows how to operate the plane safely.","example_zh":"飛行員知道如何安全地操作飛機。"},{"id":2002,"word":"operation","pos":"n","meaning":"n. 手術；運作","example":"The patient is recovering well after the heart operation.","example_zh":"病人在心臟手術後恢復得很好。"},{"id":2003,"word":"operator","pos":"n","meaning":"n. 操作者；電話接線生","example":"You can talk to the operator if you need help with the call.","example_zh":"如果你需要通話協助，你可以跟接線生對話。"},{"id":2004,"word":"opportunity","pos":"n","meaning":"n. 機會","example":"This is a great opportunity to learn a new language.","example_zh":"這是學習新語言的絕佳機會。"},{"id":2005,"word":"oppose","pos":"v","meaning":"v. 對抗；反對","example":"The citizens decided to oppose the new law.","example_zh":"市民們決定反對這項新法律。"},{"id":2006,"word":"opposed","pos":"adj","meaning":"adj. 反對的","example":"Many people are opposed to building a factory here.","example_zh":"許多人反對在這裡蓋工廠。"},{"id":2007,"word":"opposing","pos":"adj","meaning":"adj. 相反的，（意見）對立的","example":"The two groups have opposing views on the matter.","example_zh":"這兩個團體對此事有對立的觀點。"},{"id":2008,"word":"opposite","pos":"adj","meaning":"adj. 對面的；相反的 (n) 相反的事物 (prep) 在對面","example":"We live on the opposite side of the street.","example_zh":"我們住在街道的對面。"},{"id":2009,"word":"opposition","pos":"n","meaning":"n. 反對，反抗","example":"There is strong opposition to the government's plan.","example_zh":"對政府的計畫有強烈的反對。"},{"id":2010,"word":"oppress","pos":"v","meaning":"v. 壓迫； 壓制","example":"The dictator continued to oppress the people.","example_zh":"獨裁者繼續壓迫人民。"},{"id":2011,"word":"oppression","pos":"n","meaning":"n. 壓迫，欺壓","example":"They fought against years of oppression.","example_zh":"他們對抗了多年的壓迫。"},{"id":2012,"word":"oppressive","pos":"adj","meaning":"adj. 壓迫的，難以忍受的","example":"The heat was oppressive during the afternoon.","example_zh":"下午的酷熱令人難以忍受。"},{"id":2013,"word":"optimism","pos":"n","meaning":"n. 樂觀，樂觀主義","example":"He has a sense of optimism about the future.","example_zh":"他對未來有一種樂觀感。"},{"id":2014,"word":"optimist","pos":"n","meaning":"n. 樂觀的人","example":"She is an optimist who always sees the bright side.","example_zh":"她是個總是看光明面的樂觀主義者。"},{"id":2015,"word":"optimistic","pos":"adj","meaning":"adj. 樂觀的","example":"He remains optimistic about finding a job soon.","example_zh":"他對於很快找到工作保持樂觀。"},{"id":2016,"word":"option","pos":"n","meaning":"n. 選擇","example":"You have the option to choose between coffee and tea.","example_zh":"你有咖啡和茶可以選擇。"},{"id":2017,"word":"optional","pos":"adj","meaning":"adj. 可選擇的，隨意的","example":"Attendance at the meeting is optional.","example_zh":"出席會議是隨意的（非強制性的）。"},{"id":2018,"word":"orbit","pos":"n","meaning":"n. （天體運行的）軌道 (v) 繞軌道運行","example":"The satellite is now in orbit around the Earth.","example_zh":"衛星現在正繞著地球軌道運行。"},{"id":2019,"word":"orchestra","pos":"n","meaning":"n. 管絃樂團","example":"The orchestra played a beautiful symphony.","example_zh":"管絃樂團演奏了一首美妙的交響曲。"},{"id":2020,"word":"ordinary","pos":"adj","meaning":"adj. 平凡的","example":"It was an ordinary day at the office.","example_zh":"在辦公室度過平凡的一天。"},{"id":2021,"word":"organic","pos":"adj","meaning":"adj. 器官的；有機的","example":"She prefers to buy organic vegetables.","example_zh":"她偏好購買有機蔬菜。"},{"id":2022,"word":"organization","pos":"n","meaning":"n. 組織，機構","example":"The United Nations is an international organization.","example_zh":"聯合國是一個國際組織。"},{"id":2023,"word":"organize","pos":"v","meaning":"v. 組織，籌備","example":"We need to organize a party for her birthday.","example_zh":"我們需要為她的生日籌備一場派對。"},{"id":2024,"word":"orient","pos":"vt","meaning":"vt. 以～為目標，以～為重點","example":"The company tries to orient its products toward young people.","example_zh":"公司試圖以年輕人為目標調整其產品。"},{"id":2025,"word":"oriented","pos":"adj","meaning":"adj. 以～為導向的","example":"This course is oriented toward beginners.","example_zh":"這門課程是以初學者為導向的。"},{"id":2026,"word":"origin","pos":"n","meaning":"n. 來源；出處；出身；血統","example":"The origin of the universe is still a topic of debate.","example_zh":"宇宙的起源仍然是一個爭論的話題。"},{"id":2027,"word":"original","pos":"adj","meaning":"adj. 最初的；有創意的 (n) 原作","example":"This painting is an original work by the artist.","example_zh":"這幅畫是那位藝術家的原作。"},{"id":2028,"word":"originality","pos":"n","meaning":"n. 原創性","example":"The design shows a lot of originality.","example_zh":"這項設計展現了許多原創性。"},{"id":2029,"word":"originally","pos":"adv","meaning":"adv. 最初，起先","example":"The building was originally a house, but now it is an office.","example_zh":"這棟建築最初是一間房子，但現在是辦公室。"},{"id":2030,"word":"originate","pos":"v","meaning":"v. 起源於","example":"Many customs originate from ancient traditions.","example_zh":"許多習俗起源於古老的傳統。"},{"id":2031,"word":"ornament","pos":"n","meaning":"n. 裝飾品","example":"She bought some ornaments for the Christmas tree.","example_zh":"她買了一些聖誕樹裝飾品。"},{"id":2032,"word":"orphan","pos":"n","meaning":"n. 孤兒","example":"The orphan was adopted by a kind family.","example_zh":"那個孤兒被一個善良的家庭領養了。"},{"id":2033,"word":"otherwise","pos":"adv","meaning":"adv. 否則；在其他方面","example":"I am tired; otherwise, I would help you.","example_zh":"我很累；否則，我會幫你的。"},{"id":2034,"word":"ought to","pos":"aux","meaning":"aux. 應當","example":"You ought to apologize for being late.","example_zh":"你應該為遲到道歉。"},{"id":2035,"word":"outcome","pos":"n","meaning":"n. 結果","example":"We are waiting for the final outcome of the test.","example_zh":"我們在等待考試的最終結果。"},{"id":2036,"word":"outdoor","pos":"adj","meaning":"adj. 戶外的","example":"We had an outdoor picnic in the park.","example_zh":"我們在公園進行了戶外野餐。"},{"id":2037,"word":"outdoors","pos":"adv","meaning":"adv. 戶外地","example":"Let's play outdoors while the sun is shining.","example_zh":"趁太陽出來時，我們去戶外玩吧。"},{"id":2038,"word":"outer","pos":"adj","meaning":"adj. 外部的","example":"The outer walls of the castle are very thick.","example_zh":"城堡的外牆非常厚。"},{"id":2039,"word":"outline","pos":"v","meaning":"v. 陳述要點；寫大綱；描繪輪廓 (n) 綱要；輪廓","example":"The professor gave us an outline of the lecture.","example_zh":"教授給了我們演講的大綱。"},{"id":2040,"word":"outrage","pos":"n","meaning":"n. 憤怒，震怒 (v) 激起憤怒","example":"The news of the injustice caused public outrage.","example_zh":"那則不公義的新聞引起了公眾的震怒。"},{"id":2041,"word":"outrageous","pos":"adj","meaning":"adj. 駭人的，無法忍受的","example":"It is outrageous that they charge so much for a simple service.","example_zh":"他們對一項簡單的服務收取這麼多錢，真是駭人聽聞。"},{"id":2042,"word":"outskirts","pos":"n","meaning":"n. 郊區","example":"They live in the outskirts of the city.","example_zh":"他們住在城市的郊區。"},{"id":2043,"word":"outstanding","pos":"adj","meaning":"adj. 傑出的；顯著的；重要的","example":"She is an outstanding student in our class.","example_zh":"她是我們班上傑出的學生。"},{"id":2044,"word":"outward","pos":"adj","meaning":"adj. 表面上的，外表的","example":"Her outward appearance is calm, but she is very nervous inside.","example_zh":"她的外表看起來很冷靜，但內心卻很緊張。"},{"id":2045,"word":"outwardly","pos":"adv","meaning":"adv. 表面上的，從外表看來","example":"Outwardly, he seemed happy, but he was actually sad.","example_zh":"從外表看來，他似乎很開心，但其實他很難過。"},{"id":2046,"word":"oval","pos":"adj","meaning":"adj. 橢圓形的；卵形的 (n) 橢圓形的物品；卵形的物品","example":"He drew an oval shape on the paper.","example_zh":"他在紙上畫了一個橢圓形。"},{"id":2047,"word":"over time","pos":"phr","meaning":"phr. 逐漸地","example":"Her confidence has grown over time.","example_zh":"她的信心已逐漸增長。"},{"id":2048,"word":"overcoat","pos":"n","meaning":"n. 外套；大衣","example":"It's cold outside, so remember to wear an overcoat.","example_zh":"外面很冷，所以記得穿外套。"},{"id":2049,"word":"overcome","pos":"v","meaning":"v. 克服","example":"You need to overcome your fear of heights.","example_zh":"你需要克服你的懼高症。"},{"id":2050,"word":"overlook","pos":"v","meaning":"v. 忽略；疏忽；俯瞰","example":"Do not overlook the small details in the contract.","example_zh":"不要忽略合約中的小細節。"},{"id":2051,"word":"overnight","pos":"adv","meaning":"adv. 整夜地；一夜；突然地 (adj) 整夜的；一夜的；突然的","example":"He finished the project overnight.","example_zh":"他一夜之間完成了專案。"},{"id":2052,"word":"overseas","pos":"adv","meaning":"adv. 海外（留學，工作）(adj) 外國的","example":"She plans to study overseas next year.","example_zh":"她計畫明年去海外留學。"},{"id":2053,"word":"overtake","pos":"v","meaning":"v. 超越；追上；（災難等）突然侵襲","example":"He ran fast to overtake the other runners.","example_zh":"他跑得很快以超越其他選手。"},{"id":2054,"word":"overthrow","pos":"v","meaning":"v. 推翻；顛覆 (n) 打倒；推翻","example":"The rebels tried to overthrow the government.","example_zh":"反叛軍試圖推翻政府。"},{"id":2055,"word":"overwhelm","pos":"v","meaning":"v. 壓倒；征服；使受不了","example":"She was overwhelmed by the amount of work.","example_zh":"她被工作量壓得喘不過氣來（受不了）。"},{"id":2056,"word":"owe","pos":"v","meaning":"v. 欠；把～歸功於","example":"I owe him $10.","example_zh":"我欠他10美元。"},{"id":2057,"word":"owing to","pos":"phr","meaning":"phr. 由於、因為","example":"The game was canceled owing to the rain.","example_zh":"因為雨的關係，比賽取消了。"},{"id":2058,"word":"ownership","pos":"n","meaning":"n. 所有權","example":"She is proud of her home ownership.","example_zh":"她為擁有房屋所有權感到自豪。"},{"id":2059,"word":"oxygen","pos":"n","meaning":"n. 氧氣","example":"Humans need oxygen to survive.","example_zh":"人類需要氧氣才能生存。"},{"id":2060,"word":"pace","pos":"n","meaning":"n. 一步；步調；速度 (v) 踱步","example":"He walked back and forth at a slow pace.","example_zh":"他以緩慢的步調走來走去。"},{"id":2061,"word":"pad","pos":"n","meaning":"n. 墊；護墊；襯墊 (v) 填塞","example":"He used a pad to protect his knee while skating.","example_zh":"他滑冰時用護墊保護膝蓋。"},{"id":2062,"word":"pail","pos":"n","meaning":"n. 桶子；一桶","example":"She carried a pail of water to the garden.","example_zh":"她提了一桶水到花園。"},{"id":2063,"word":"pal","pos":"n","meaning":"n. 朋友；好友；夥伴","example":"He is my best pal.","example_zh":"他是我最好的朋友。"},{"id":2064,"word":"palace","pos":"n","meaning":"n. 宮殿；富麗堂皇的大房屋","example":"The king lives in a beautiful palace.","example_zh":"國王住在美麗的宮殿裡。"},{"id":2065,"word":"pale","pos":"adj","meaning":"adj. 蒼白的；微弱的","example":"She looked pale because she was sick.","example_zh":"她看起來臉色蒼白因為她生病了。"},{"id":2066,"word":"pancake","pos":"n","meaning":"n. 薄煎餅；鬆餅","example":"We had pancakes for breakfast.","example_zh":"我們早餐吃了鬆餅。"},{"id":2067,"word":"panel","pos":"n","meaning":"n. 討論小組；調查小組","example":"The expert panel will discuss the new report.","example_zh":"專家小組將會討論這份新報告。"},{"id":2068,"word":"panic","pos":"n","meaning":"n. 恐慌 (adj) 恐慌的 (v) 恐慌；驚惶","example":"The crowd was in a panic when the alarm went off.","example_zh":"警報響起時，人群陷入恐慌。"},{"id":2069,"word":"parachute","pos":"n","meaning":"n. 降落傘 (v) 跳傘","example":"He jumped from the plane with a parachute.","example_zh":"他帶著降落傘從飛機上跳下。"},{"id":2070,"word":"parade","pos":"n","meaning":"n. 遊行；閱兵 (v) 遊行","example":"Many people watched the Independence Day parade.","example_zh":"許多人觀看了獨立紀念日的遊行。"},{"id":2071,"word":"paradise","pos":"n","meaning":"n. 天堂；樂園","example":"This beach is like a paradise.","example_zh":"這個海灘就像天堂一樣。"},{"id":2072,"word":"paralyze","pos":"v","meaning":"v. 使癱瘓，使麻痺；使無法正常運作","example":"The virus can paralyze the entire system.","example_zh":"這病毒會使整個系統癱瘓。"},{"id":2073,"word":"paralyzed","pos":"adj","meaning":"adj. 無法思考的，呆若木雞的","example":"She was paralyzed with fear during the storm.","example_zh":"風暴期間，她因恐懼而嚇呆了。"},{"id":2074,"word":"parcel","pos":"n","meaning":"n. 包裹；一片（土地）","example":"I received a parcel in the mail today.","example_zh":"我今天在郵件中收到了一個包裹。"},{"id":2075,"word":"pardon","pos":"n/v","meaning":"n/v. 赦免，寬恕，原諒","example":"Please pardon me for interrupting.","example_zh":"請原諒我打斷。"},{"id":2076,"word":"partial","pos":"adj","meaning":"adj. 局部的；部份的；偏心的","example":"He gave a partial explanation of what happened.","example_zh":"他對發生的事給了局部的解釋。"},{"id":2077,"word":"participant","pos":"n","meaning":"n. 參與者","example":"Each participant will receive a certificate.","example_zh":"每一位參與者都會收到證書。"},{"id":2078,"word":"participate","pos":"v","meaning":"v. 參加；參與","example":"Do you want to participate in the contest?","example_zh":"你想參加比賽嗎？"},{"id":2079,"word":"participation","pos":"n","meaning":"n. 參加；參與","example":"Active participation is encouraged in the class.","example_zh":"課堂上鼓勵積極參與。"},{"id":2080,"word":"participle","pos":"n","meaning":"n. 分詞","example":"A past participle is often used in the passive voice.","example_zh":"過去分詞常用在被動語態中。"},{"id":2081,"word":"particular","pos":"adj","meaning":"adj. 特別的，特定的","example":"Is there any particular reason you are late?","example_zh":"你遲到有什麼特別的原因嗎？"},{"id":2082,"word":"particularly (=especially)","pos":"adv","meaning":"adv. 特別；尤其","example":"I particularly like this song.","example_zh":"我特別喜歡這首歌。"},{"id":2083,"word":"partnership","pos":"n","meaning":"n. 夥伴關係","example":"The two companies formed a partnership.","example_zh":"這兩家公司形成了夥伴關係。"},{"id":2084,"word":"pass (something) onto (someone)","pos":"phr","meaning":"phr. 傳遞給～","example":"Please pass this information onto the manager.","example_zh":"請把這個資訊傳遞給經理。"},{"id":2085,"word":"pass through","pos":"phr","meaning":"phr. 路過，途經","example":"We had to pass through a small village to get there.","example_zh":"我們必須途經一個小村莊才能到達那裡。"},{"id":2086,"word":"passage","pos":"n","meaning":"n. 通道；一節；一段；（時間的）推移","example":"He read a long passage from the book.","example_zh":"他讀了書中的一段長文。"},{"id":2087,"word":"passion","pos":"n","meaning":"n. 激情；熱情","example":"She has a passion for music.","example_zh":"她對音樂有熱情。"},{"id":2088,"word":"passive","pos":"adj","meaning":"adj. 被動的；消極的","example":"He took a passive role in the discussion.","example_zh":"他在討論中採取了被動的角色。"},{"id":2089,"word":"passport","pos":"n","meaning":"n. 護照","example":"You need a passport to travel to another country.","example_zh":"你需要護照才能出國旅行。"},{"id":2090,"word":"password","pos":"n","meaning":"n. 暗語；密碼","example":"Make sure to keep your password secret.","example_zh":"請務必保密你的密碼。"},{"id":2091,"word":"pasta","pos":"n","meaning":"n. 義大利通心麵","example":"I love eating Italian pasta.","example_zh":"我愛吃義大利麵。"},{"id":2092,"word":"pat","pos":"v/n","meaning":"v/n. 輕拍，誇獎","example":"He gave the dog a gentle pat.","example_zh":"他輕拍了那隻狗。"},{"id":2093,"word":"patience","pos":"n","meaning":"n. 耐心；耐性","example":"You need to have patience when teaching children.","example_zh":"教導孩子時，你需要有耐心。"},{"id":2094,"word":"patient","pos":"adj","meaning":"adj. 有耐心的(n) 病人","example":"The doctor talked to the patient.","example_zh":"醫生與病人談話。"},{"id":2095,"word":"pause","pos":"v","meaning":"v. 停頓；暫停 (n) 停頓；暫停","example":"Let's take a short pause to drink some water.","example_zh":"我們暫停一下喝口水吧。"},{"id":2096,"word":"pave","pos":"v","meaning":"v. 築；鋪（路等）","example":"Workers are starting to pave the new road.","example_zh":"工人正開始鋪設新的道路。"},{"id":2097,"word":"paw","pos":"n","meaning":"n. 爪","example":"The kitten has soft paws.","example_zh":"小貓有柔軟的爪子。"},{"id":2098,"word":"pay off","pos":"phr","meaning":"phr. 成功，奏效，有所回報","example":"All your hard work will pay off eventually.","example_zh":"你所有的努力工作最終都會有所回報的。"},{"id":2099,"word":"pea","pos":"n","meaning":"n. 豌豆","example":"She added a few green peas to the soup.","example_zh":"她在湯裡加了一些綠豌豆。"},{"id":2100,"word":"peace","pos":"n","meaning":"n. 和平，安靜","example":"We all long for world peace.","example_zh":"我們都渴望世界和平。"},{"id":2101,"word":"peaceful","pos":"adj","meaning":"adj. 和平的","example":"It was a very peaceful afternoon in the garden.","example_zh":"那是在花園裡一個非常平靜的下午。"},{"id":2102,"word":"peak","pos":"n","meaning":"n. 山峰；山頂","example":"The view from the mountain peak was breathtaking.","example_zh":"從山頂看到的景色令人屏息。"},{"id":2103,"word":"pearl","pos":"n","meaning":"n. 珍珠","example":"She wore a beautiful necklace with a single pearl.","example_zh":"她戴著一條鑲有一顆珍珠的漂亮項鍊。"},{"id":2104,"word":"pebble","pos":"n","meaning":"n. 鵝卵石；小圓石","example":"The children were throwing pebbles into the river.","example_zh":"孩子們在往河裡扔鵝卵石。"},{"id":2105,"word":"peculiar","pos":"adj","meaning":"adj. 奇怪的；特有的","example":"He has a peculiar habit of whistling while he eats.","example_zh":"他有一種邊吃邊吹口哨的奇怪習慣。"},{"id":2106,"word":"pedal","pos":"n","meaning":"n. 踏板 (v) 騎（腳踏車）；踩踏板","example":"You need to pedal faster to go up the hill.","example_zh":"上坡時你需要踩快點踏板。"},{"id":2107,"word":"peel","pos":"v","meaning":"v. 剝皮；削皮；脫落 (n) （水果、蔬菜的）外皮","example":"Please peel the apple before you eat it.","example_zh":"吃蘋果前請先削皮。"},{"id":2108,"word":"peep","pos":"v","meaning":"v. 偷看；窺視 (n) 偷看；一瞥","example":"I saw him peeping through the keyhole.","example_zh":"我看見他透過鑰匙孔偷窺。"},{"id":2109,"word":"peer","pos":"n","meaning":"n. 同輩；同年齡的人 (v) 凝視","example":"He is well-liked by all his peers at work.","example_zh":"他在工作上很受同輩們的喜愛。"},{"id":2110,"word":"penalty","pos":"n","meaning":"n. 懲罰；刑罰；罰款","example":"The penalty for breaking the rules is a fine.","example_zh":"違反規定的懲罰是罰款。"},{"id":2111,"word":"penny","pos":"n","meaning":"n. 便士；一分錢","example":"It only costs a few pennies to buy this candy.","example_zh":"買這顆糖果只需要幾便士。"},{"id":2112,"word":"perceive","pos":"vt","meaning":"vt. 察覺，感知；理解，領悟","example":"It is sometimes hard to perceive the truth.","example_zh":"有時候很難察覺真相。"},{"id":2113,"word":"percent","pos":"n","meaning":"n. 百分之一 (adj) 百分之～的","example":"Only 10 percent of the students failed the test.","example_zh":"只有百分之十的學生考試不及格。"},{"id":2114,"word":"percentage","pos":"n","meaning":"n. 百分比；百分率","example":"The percentage of people who use the internet has increased.","example_zh":"使用網路的人口比例增加了。"}]},
{"unit":17,"unit_label":"p.33-34","words":[{"id":2115,"word":"perception","pos":"n","meaning":"n. 感知（能力），覺察；看法","example":"Her perception of the situation was quite different from mine.","example_zh":"她對局勢的看法與我大不相同。"},{"id":2116,"word":"perfect","pos":"adj","meaning":"adj. 十分合適的","example":"This place is perfect for a quiet vacation.","example_zh":"這個地方非常適合安靜的假期。"},{"id":2117,"word":"perfection","pos":"n","meaning":"n. 完美","example":"No one is aiming for perfection; just do your best.","example_zh":"沒有人追求完美；盡力就好。"},{"id":2118,"word":"perform","pos":"v","meaning":"v. 執行；完成；表演","example":"The band will perform at the concert tonight.","example_zh":"樂團今晚將會在演唱會上表演。"},{"id":2119,"word":"performance","pos":"n","meaning":"n. 演出；表演；表現","example":"The team's performance in the game was outstanding.","example_zh":"隊伍在那場比賽中的表現非常傑出。"},{"id":2120,"word":"perfume","pos":"n","meaning":"n. 香水","example":"She likes to wear a light perfume.","example_zh":"她喜歡噴淡淡的香水。"},{"id":2121,"word":"peril","pos":"n","meaning":"n. 險惡","example":"He was in great peril during the storm.","example_zh":"風暴期間他處於極大的險惡中。"},{"id":2122,"word":"perilous","pos":"adj","meaning":"adj. 非常危險的，險惡的","example":"The climbers faced a perilous journey up the mountain.","example_zh":"登山者面臨了一趟極度危險的登山之旅。"},{"id":2123,"word":"permanent","pos":"adj","meaning":"adj. 永久的；長久的","example":"She is looking for a permanent job in the city.","example_zh":"她正在這座城市尋找一份永久性的工作。"},{"id":2124,"word":"permission","pos":"n","meaning":"n. 許可；批准","example":"You need written permission to enter this area.","example_zh":"你需要書面許可才能進入此區。"},{"id":2125,"word":"permit","pos":"v","meaning":"v. 認可；許可 (n) 許可證","example":"Smoking is not permitted in this building.","example_zh":"這棟建築物內不允許抽菸。"},{"id":2126,"word":"personality","pos":"n","meaning":"n. 個性；人格","example":"She has a very outgoing personality.","example_zh":"她有一個非常外向的個性。"},{"id":2127,"word":"perspective","pos":"n","meaning":"n. 觀點，想法","example":"You need to change your perspective to see the problem clearly.","example_zh":"你需要改變觀點才能清楚看見這個問題。"},{"id":2128,"word":"persuade","pos":"v","meaning":"v. 說服；勸","example":"It was difficult to persuade him to change his mind.","example_zh":"要說服他改變主意很困難。"},{"id":2129,"word":"persuasion","pos":"n","meaning":"n. 說服","example":"After much persuasion, he finally agreed to come.","example_zh":"在多次說服後，他終於同意來了。"},{"id":2130,"word":"persuasive","pos":"adj","meaning":"adj. 有說服力的；勸誘的","example":"She gave a persuasive argument for her plan.","example_zh":"她對她的計畫提出了有說服力的論點。"},{"id":2131,"word":"pessimistic","pos":"adj","meaning":"adj. 悲觀的","example":"Don't be so pessimistic about the results.","example_zh":"對於結果不要這麼悲觀。"},{"id":2132,"word":"pest","pos":"n","meaning":"n. 有害的小動物；害蟲；討厭的人或物","example":"The garden is full of pests that eat the plants.","example_zh":"花園裡充滿了吃掉植物的害蟲。"},{"id":2133,"word":"petal","pos":"n","meaning":"n. 花瓣","example":"The rose dropped its petals on the ground.","example_zh":"玫瑰的花瓣掉落在地上。"},{"id":2134,"word":"phenomenon","pos":"n","meaning":"n. 現象","example":"The aurora is a beautiful natural phenomenon.","example_zh":"極光是一種美麗的自然現象。"},{"id":2135,"word":"philosopher","pos":"n","meaning":"n. 哲學家","example":"Socrates is a famous ancient Greek philosopher.","example_zh":"蘇格拉底是一位著名的古希臘哲學家。"},{"id":2136,"word":"philosophical","pos":"adj","meaning":"adj. 哲學的；豁達的","example":"He took a philosophical approach to his failure.","example_zh":"他對自己的失敗採取了豁達（哲學）的態度。"},{"id":2137,"word":"philosophy","pos":"n","meaning":"n. 哲學；人生觀","example":"My philosophy of life is to live in the moment.","example_zh":"我的人生哲學是活在當下。"},{"id":2138,"word":"photography","pos":"n","meaning":"n. 攝影（術）","example":"She has a strong interest in digital photography.","example_zh":"她對數位攝影有濃厚的興趣。"},{"id":2139,"word":"physical","pos":"adj","meaning":"adj. 身體的；物理（學）的","example":"Regular exercise is good for your physical health.","example_zh":"定期運動對你的身體健康有益。"},{"id":2140,"word":"physically","pos":"adv","meaning":"adv. 身體上地","example":"He is physically stronger than his brother.","example_zh":"他在身體上比他哥哥強壯。"},{"id":2141,"word":"physician","pos":"n","meaning":"n. 內科醫生","example":"You should see a physician if you feel sick.","example_zh":"如果你感到不適，你應該去看內科醫生。"},{"id":2142,"word":"physicist","pos":"n","meaning":"n. 物理學家","example":"Albert Einstein was a famous physicist.","example_zh":"阿爾伯特·愛因斯坦是一位著名的物理學家。"},{"id":2143,"word":"physics","pos":"n","meaning":"n. 物理（學）","example":"Physics is the study of matter and energy.","example_zh":"物理學是研究物質與能量的學科。"},{"id":2144,"word":"pianist","pos":"n","meaning":"n. 鋼琴家","example":"The pianist played a beautiful piece by Chopin.","example_zh":"鋼琴家彈奏了一首蕭邦的美妙樂曲。"},{"id":2145,"word":"pick up something","pos":"phr","meaning":"phr. 注意、察覺到某事","example":"I picked up on the fact that he was nervous.","example_zh":"我注意到他很緊張的事實。"},{"id":2146,"word":"pickle","pos":"n","meaning":"n. 醃漬黃瓜；泡菜","example":"Would you like some pickles with your burger?","example_zh":"你的漢堡要加醃黃瓜嗎？"},{"id":2147,"word":"pickpocket","pos":"n","meaning":"n. 扒手","example":"Watch out for pickpockets in crowded places.","example_zh":"在擁擠的地方要小心扒手。"},{"id":2148,"word":"pile","pos":"n/v","meaning":"n/v. 堆，堆疊","example":"Please put the pile of books on the desk.","example_zh":"請把那一堆書放在桌上。"},{"id":2149,"word":"pilgrim","pos":"n","meaning":"n. 朝聖客；香客","example":"The pilgrims traveled to the holy site.","example_zh":"朝聖客前往聖地。"},{"id":2150,"word":"pill","pos":"n","meaning":"n. 藥丸","example":"She takes a pill for her headache.","example_zh":"她吃了一顆藥丸來治頭痛。"},{"id":2151,"word":"pilot","pos":"n","meaning":"n. 飛行員；領航員 (v) 駕駛；帶領","example":"The pilot greeted the passengers before the flight.","example_zh":"飛行員在飛行前向乘客問候。"},{"id":2152,"word":"pine","pos":"n","meaning":"n. 松樹；松木","example":"The forest is filled with tall pine trees.","example_zh":"森林裡充滿了高大的松樹。"},{"id":2153,"word":"pint","pos":"n","meaning":"n. 品脫","example":"He ordered a pint of beer.","example_zh":"他點了一品脫啤酒。"},{"id":2154,"word":"pioneer","pos":"n","meaning":"n. 拓荒者；先鋒；首創者 (v) 開拓；成為先驅","example":"He was a pioneer in the field of space exploration.","example_zh":"他是太空探索領域的先鋒。"},{"id":2155,"word":"pirate","pos":"n","meaning":"n. 海盜；剽竊者；盜印者 (v) 剽竊；非法翻印","example":"The pirates sailed the seas looking for treasure.","example_zh":"海盜在海上航行尋找寶藏。"},{"id":2156,"word":"pit","pos":"n","meaning":"n. 坑洞；果核","example":"Don't eat the cherry pit; it's hard.","example_zh":"別吃櫻桃核；它是硬的。"},{"id":2157,"word":"pity","pos":"n","meaning":"n. 憐憫；同情 (v) 可憐；同情","example":"It's a pity that you can't come to the party.","example_zh":"你不能參加派對真可惜。"},{"id":2158,"word":"plague","pos":"n","meaning":"n. 瘟疫，麻煩 (vt)折磨，使苦惱","example":"The city was plagued by the disease for years.","example_zh":"這座城市多年來飽受瘟疫折磨。"},{"id":2159,"word":"plastic","pos":"n","meaning":"n. 塑膠（製品） (adj) 塑性的；塑膠做的","example":"We should reduce our use of plastic products.","example_zh":"我們應該減少使用塑膠產品。"},{"id":2160,"word":"pleased","pos":"adj","meaning":"adj. 高興的，滿意的","example":"I am very pleased with your progress.","example_zh":"我對你的進步感到很高興。"},{"id":2161,"word":"pleasure","pos":"n","meaning":"n. 樂趣，喜悅","example":"It was a pleasure to meet you.","example_zh":"很高興認識你。"},{"id":2162,"word":"plentiful","pos":"adj","meaning":"adj. 豐富的；多的","example":"The area has a plentiful supply of water.","example_zh":"該地區有豐富的水資源供應。"},{"id":2163,"word":"plenty","pos":"n","meaning":"n. 大量；充足","example":"We have plenty of time to finish the work.","example_zh":"我們有充足的時間完成工作。"},{"id":2164,"word":"plot","pos":"n","meaning":"n. 情節；陰謀 (v) 密謀；策劃","example":"The movie has a very exciting plot.","example_zh":"這部電影的情節非常刺激。"},{"id":2165,"word":"plug","pos":"n","meaning":"n. 插頭；塞子；栓 (v) 插上插頭；堵住；塞住","example":"Don't forget to plug the lamp into the outlet.","example_zh":"別忘了把燈插上插座。"},{"id":2166,"word":"plum","pos":"n","meaning":"n. 李子；梅子","example":"I had a sweet plum for dessert.","example_zh":"我吃了一顆甜李子作為甜點。"},{"id":2167,"word":"plumber","pos":"n","meaning":"n. 水電工；水管瓦斯工人","example":"We called the plumber because the sink was leaking.","example_zh":"我們打了電話給水電工，因為水槽在漏水。"},{"id":2168,"word":"plural","pos":"adj","meaning":"adj. 複數的 (n) 複數（形）","example":"\"Dogs\" is the plural form of \"dog.\"","example_zh":"「Dogs」是「dog」的複數形。"},{"id":2169,"word":"pm","pos":"adv","meaning":"adv. 下午","example":"The meeting is at 3 pm.","example_zh":"會議在下午3點。"},{"id":2170,"word":"point of view","pos":"n","meaning":"n. 看法，觀點，見解","example":"From my point of view, this is the best solution.","example_zh":"從我的觀點來看，這是最好的解決方案。"},{"id":2171,"word":"poisonous","pos":"adj","meaning":"adj. 有毒的；有害的","example":"Some wild mushrooms are poisonous.","example_zh":"一些野生蘑菇是有毒的。"},{"id":2172,"word":"pole","pos":"n","meaning":"n. 桿；柱；地極；極端","example":"The flag is flying on a tall pole.","example_zh":"旗幟在高的桿子上飄揚。"},{"id":2173,"word":"policy","pos":"n","meaning":"n. 政策","example":"The government has a new policy on education.","example_zh":"政府有關於教育的新政策。"},{"id":2174,"word":"polish","pos":"v","meaning":"v. 擦亮（鞋） (n) 擦亮劑；鞋油","example":"He needs to polish his shoes for the interview.","example_zh":"他需要擦亮鞋子去面試。"},{"id":2175,"word":"political","pos":"adj","meaning":"adj. 政治的","example":"The students were discussing political issues.","example_zh":"學生們正在討論政治議題。"},{"id":2176,"word":"politician","pos":"n","meaning":"n. 政治人物；政客","example":"She wants to become a politician to help her community.","example_zh":"她想成為政治人物來幫助她的社區。"},{"id":2177,"word":"politics","pos":"n","meaning":"n. 政治（學）","example":"He is very interested in politics.","example_zh":"他對政治非常有興趣。"},{"id":2178,"word":"poll","pos":"n","meaning":"n. 民意調查 (v) 對～進行民調","example":"They conducted a poll to see who people would vote for.","example_zh":"他們進行了一項民意調查以看看人們會投給誰。"},{"id":2179,"word":"pollutant","pos":"n","meaning":"n. 污染物質","example":"Factory waste is a major pollutant in our river.","example_zh":"工廠廢棄物是我們河川中的主要汙染物質。"},{"id":2180,"word":"pollute","pos":"v","meaning":"v. 汙染","example":"Don't pollute the environment by throwing trash on the ground.","example_zh":"不要把垃圾丟在地上來汙染環境。"},{"id":2181,"word":"pollution","pos":"n","meaning":"n. 汙染（物）","example":"Air pollution is a serious problem in big cities.","example_zh":"空氣汙染是大城市中的嚴重問題。"},{"id":2182,"word":"pony","pos":"n","meaning":"n. 小馬；矮種馬","example":"The child is learning how to ride a pony.","example_zh":"那個孩子正在學習如何騎小馬。"},{"id":2183,"word":"pop","pos":"v","meaning":"v. （使）劈啪作響 (n) 啪的一聲 (adj) 流行的；通俗的","example":"The balloon went pop when it touched the needle.","example_zh":"當氣球碰到針時，發出了「啪」的一聲。"},{"id":2184,"word":"popularity","pos":"n","meaning":"n. 普及；流行；受歡迎","example":"The popularity of this singer has grown rapidly.","example_zh":"這位歌手的受歡迎程度增長得很迅速。"},{"id":2185,"word":"population","pos":"n","meaning":"n. 人口，人口數","example":"The population of this city is over two million.","example_zh":"這座城市的人口超過兩百萬。"},{"id":2186,"word":"portable","pos":"adj","meaning":"adj. 可攜式的；手提的","example":"He carries a portable radio with him when he travels.","example_zh":"他旅行時會隨身攜帶一台可攜式收音機。"},{"id":2187,"word":"porter","pos":"n","meaning":"n. 搬行李工人；搬運工","example":"The porter helped us with our luggage at the hotel.","example_zh":"搬運工在飯店幫我們搬運行李。"},{"id":2188,"word":"portion","pos":"n","meaning":"n. 一部分","example":"I only ate a small portion of the meal.","example_zh":"我只吃了那頓餐的一小部分。"},{"id":2189,"word":"portrait","pos":"n","meaning":"n. 肖像畫","example":"The museum has a famous portrait of the Queen.","example_zh":"博物館裡有一幅女王的著名肖像畫。"},{"id":2190,"word":"portray","pos":"v","meaning":"v. 描繪；描述；畫；為～畫肖像","example":"The movie portrays the life of a famous writer.","example_zh":"這部電影描繪了一位著名作家的生活。"},{"id":2191,"word":"pose","pos":"v","meaning":"v. (造成)問題，威脅；提問","example":"The climate change poses a great threat to our future.","example_zh":"氣候變遷對我們的未來造成了巨大的威脅。"},{"id":2192,"word":"positive","pos":"adj","meaning":"adj. 樂觀的，積極的；同意的","example":"She has a positive attitude toward her work.","example_zh":"她對她的工作有積極的態度。"},{"id":2193,"word":"possess","pos":"v","meaning":"v. 擁有；佔有","example":"He does not possess any money at the moment.","example_zh":"他目前身上沒有任何錢。"},{"id":2194,"word":"possession","pos":"n","meaning":"n. 擁有；佔有；財產；所有物（常用複數形）","example":"Please take care of your personal possessions.","example_zh":"請妥善保管你的個人財物。"},{"id":2195,"word":"postage","pos":"n","meaning":"n. 郵資","example":"The postage for this letter is quite cheap.","example_zh":"這封信的郵資相當便宜。"},{"id":2196,"word":"poster","pos":"n","meaning":"n. 海報","example":"We hung a poster on the wall of our bedroom.","example_zh":"我們在臥室牆上掛了一張海報。"},{"id":2197,"word":"postpone","pos":"v","meaning":"v. 延期","example":"We had to postpone the meeting due to the storm.","example_zh":"因為風暴，我們不得不將會議延期。"},{"id":2198,"word":"potential","pos":"n","meaning":"n. 潛力 (a)有潛力的，可能的","example":"You have the potential to become a great athlete.","example_zh":"你有成為傑出運動員的潛力。"},{"id":2199,"word":"potentially","pos":"adv","meaning":"adv. 可能地，潛在地","example":"This new technology is potentially very useful.","example_zh":"這項新技術可能非常有益。"},{"id":2200,"word":"pottery","pos":"n","meaning":"n. 陶器","example":"She is taking a class to learn how to make pottery.","example_zh":"她正在上一門學習製作陶器的課。"},{"id":2201,"word":"poultry","pos":"n","meaning":"n. 家禽","example":"The farm keeps a lot of poultry, such as chickens and ducks.","example_zh":"那座農場飼養了許多家禽，例如雞和鴨。"},{"id":2202,"word":"pour","pos":"v","meaning":"v. （雨）傾盆而降；倒；灌","example":"It began to pour just as we left the house.","example_zh":"我們剛離開房子，雨就傾盆而降。"},{"id":2203,"word":"poverty","pos":"n","meaning":"n. 貧窮","example":"The government is working hard to reduce poverty.","example_zh":"政府正努力減少貧窮。"},{"id":2204,"word":"powder","pos":"n","meaning":"n. 粉末","example":"You can use this powder to make a drink.","example_zh":"你可以用這種粉末來製作飲料。"},{"id":2205,"word":"powdered","pos":"adj","meaning":"adj. 粉狀的，粉末的","example":"She bought some powdered milk for the baby.","example_zh":"她為寶寶買了一些奶粉（粉狀的奶）。"},{"id":2206,"word":"power","pos":"n","meaning":"n. 能力，權力","example":"Knowledge is power.","example_zh":"知識就是力量。"},{"id":2207,"word":"powerful","pos":"adj","meaning":"adj. 強而有力的","example":"He has a powerful voice that can be heard across the room.","example_zh":"他有一副強而有力的嗓音，整個房間都聽得見。"},{"id":2208,"word":"practical","pos":"adj","meaning":"adj. 實際的；實用的","example":"This is a practical solution to the problem.","example_zh":"這是解決問題的一個實際的方法。"},{"id":2209,"word":"praise","pos":"v/n","meaning":"v/n. 讚揚，稱讚","example":"The teacher gave her a lot of praise for her hard work.","example_zh":"老師因為她的努力而給予她許多讚揚。"},{"id":2210,"word":"prayer","pos":"n","meaning":"n. 祈禱；禱告","example":"They knelt down and said a prayer.","example_zh":"他們跪下來做了祈禱。"},{"id":2211,"word":"precious","pos":"adj","meaning":"adj. 珍愛的；寶貴的","example":"This ring is a precious gift from my mother.","example_zh":"這枚戒指是我母親給我的寶貴禮物。"},{"id":2212,"word":"precise","pos":"adj","meaning":"adj. 精準的；精確的","example":"He gave a precise answer to the question.","example_zh":"他對那個問題給出了精確的回答。"},{"id":2213,"word":"precisely","pos":"adv","meaning":"adv. 精確地，仔細地","example":"Please follow the instructions precisely.","example_zh":"請精確地遵循指示。"},{"id":2214,"word":"precision","pos":"n","meaning":"n. 精確","example":"The machine operates with great precision.","example_zh":"這台機器運作時極具精確度。"},{"id":2215,"word":"predict","pos":"v","meaning":"v. 預言；預測","example":"It is hard to predict the weather for next week.","example_zh":"很難預測下週的天氣。"},{"id":2216,"word":"prediction","pos":"n","meaning":"n. 預測","example":"His prediction about the stock market was correct.","example_zh":"他關於股市的預測是正確的。"},{"id":2217,"word":"prefer","pos":"v","meaning":"v. 更喜歡(A+to+B)","example":"I prefer coffee to tea.","example_zh":"我比起茶更喜歡咖啡。"},{"id":2218,"word":"preferable","pos":"adj","meaning":"adj. 較合適的；較好的","example":"A quiet room is preferable to a noisy one for studying.","example_zh":"對於讀書來說，安靜的房間比吵雜的房間更好。"},{"id":2219,"word":"preference","pos":"n","meaning":"n. 偏愛，優先選擇","example":"Do you have a preference for where we should eat?","example_zh":"你對於我們應該去哪裡吃有什麼偏好嗎？"},{"id":2220,"word":"pregnancy","pos":"n","meaning":"n. 懷孕","example":"She is in the late stages of her pregnancy.","example_zh":"她正處於懷孕的晚期。"},{"id":2221,"word":"pregnant","pos":"adj","meaning":"adj. 懷孕的","example":"She is currently pregnant with her second child.","example_zh":"她目前懷著第二個孩子。"},{"id":2222,"word":"preparation","pos":"n","meaning":"n. 準備","example":"Success depends on careful preparation.","example_zh":"成功取決於細心的準備。"},{"id":2223,"word":"preposition","pos":"n","meaning":"n. 介系詞","example":"\"In,\" \"on,\" and \"at\" are all examples of a preposition.","example_zh":"「In」、「on」和「at」都是介系詞的例子。"},{"id":2224,"word":"presentation","pos":"n","meaning":"n. 呈現；表現；演出；上演","example":"He gave an interesting presentation about the new project.","example_zh":"他針對新專案做了一場有趣的簡報。"},{"id":2225,"word":"preservation","pos":"n","meaning":"n. 保存；維護","example":"The preservation of old buildings is important to our history.","example_zh":"古建築的維護對我們的歷史很重要。"},{"id":2226,"word":"preserve","pos":"v","meaning":"v. 維持；維護；保存 (n) 保護區；禁獵區","example":"We must preserve these forests for future generations.","example_zh":"我們必須為後代保存這些森林。"},{"id":2227,"word":"pressure","pos":"n","meaning":"n. 壓力","example":"He is working under a lot of pressure lately.","example_zh":"他最近在很大的壓力下工作。"},{"id":2228,"word":"pretend","pos":"v","meaning":"v. 假裝","example":"Don't pretend that you don't know the answer.","example_zh":"別假裝你不知道答案。"},{"id":2229,"word":"prevail","pos":"v","meaning":"v. （思想）被接受，獲勝；盛行","example":"Justice will eventually prevail.","example_zh":"正義終將獲勝（盛行）。"},{"id":2230,"word":"prevent","pos":"v","meaning":"v. 防止","example":"We need to prevent accidents from happening.","example_zh":"我們需要預防意外發生。"},{"id":2231,"word":"prevention","pos":"n","meaning":"n. 預防；防止；妨礙","example":"Exercise is the best prevention against heart disease.","example_zh":"運動是預防心臟病最好的方法。"},{"id":2232,"word":"previous","pos":"adj","meaning":"adj. 先前的","example":"Based on our previous experience, we know what to do.","example_zh":"根據我們之前的經驗，我們知道該怎麼做。"},{"id":2233,"word":"previously","pos":"adv","meaning":"adv. 先前地，以前地","example":"I had previously met him at the conference.","example_zh":"我先前在研討會上見過他。"},{"id":2234,"word":"priest","pos":"n","meaning":"n. 牧師；神父","example":"The priest gave a sermon at the church.","example_zh":"牧師在教堂佈道。"},{"id":2235,"word":"primary","pos":"adj","meaning":"adj. 主要的；基本的；初級的；最初的","example":"The primary goal is to finish the project on time.","example_zh":"首要目標是準時完成專案。"},{"id":2236,"word":"prime","pos":"adj","meaning":"adj. 主要的；最佳的 (n) 全盛期","example":"She is in her prime as an athlete.","example_zh":"她正處於運動員生涯的全盛期。"},{"id":2237,"word":"primitive","pos":"adj","meaning":"adj. 原始的","example":"They lived in a primitive hut in the forest.","example_zh":"他們住在森林裡一間原始的小屋中。"},{"id":2238,"word":"principal","pos":"adj","meaning":"adj. 最重要的，首要的","example":"The principal reason for his success is his hard work.","example_zh":"他成功最主要的原因是他的努力。"},{"id":2239,"word":"principle","pos":"n","meaning":"n. 原則","example":"We should follow the principle of honesty.","example_zh":"我們應該遵循誠實的原則。"},{"id":2240,"word":"priority","pos":"n","meaning":"n. 優先考慮的事/優先權","example":"Safety is our top priority.","example_zh":"安全是我們最優先考慮的事。"},{"id":2241,"word":"prison","pos":"n","meaning":"n. 監獄","example":"He was sent to prison for five years.","example_zh":"他被送進監獄服刑五年。"},{"id":2242,"word":"prisoner","pos":"n","meaning":"n. 囚犯","example":"The prisoner was released after serving his time.","example_zh":"囚犯在服完刑後被釋放了。"},{"id":2243,"word":"privacy","pos":"n","meaning":"n. 隱私；私事","example":"Everyone has a right to their own privacy.","example_zh":"每個人都有權擁有自己的隱私。"},{"id":2244,"word":"private","pos":"adj","meaning":"adj. 個人的，私立的","example":"She prefers a private education for her children.","example_zh":"她偏好讓孩子接受私立教育。"}]},
{"unit":18,"unit_label":"p.35-36","words":[{"id":2245,"word":"privilege","pos":"n","meaning":"n. 特權；榮幸；恩惠","example":"It is a great privilege to meet you.","example_zh":"能見到你是莫大的榮幸。"},{"id":2246,"word":"prize","pos":"n","meaning":"n. 獎品，獎項","example":"She won the first prize in the competition.","example_zh":"她在比賽中贏得了頭獎。"},{"id":2247,"word":"probable","pos":"adj","meaning":"adj. 很有可能的","example":"It is probable that it will rain later today.","example_zh":"今天稍晚很有可能會下雨。"},{"id":2248,"word":"probably","pos":"adv","meaning":"adv. 或許，大概","example":"I will probably be late for the meeting.","example_zh":"我大概會參加會議遲到。"},{"id":2249,"word":"procedure","pos":"n","meaning":"n. 程序；手續；步驟","example":"What is the standard procedure for this?","example_zh":"這件事的標準程序是什麼？"},{"id":2250,"word":"proceed","pos":"v","meaning":"v. 繼續進行；前進","example":"Let's proceed with the next part of the meeting.","example_zh":"讓我們繼續進行會議的下一部分。"},{"id":2251,"word":"process","pos":"n","meaning":"n. 過程 (v) 加工；處理","example":"The process of making bread takes several hours.","example_zh":"製作麵包的過程需要數小時。"},{"id":2252,"word":"produce","pos":"v","meaning":"v. 製造，生產","example":"The factory produces thousands of cars every year.","example_zh":"這間工廠每年生產數千輛汽車。"},{"id":2253,"word":"product","pos":"n","meaning":"n. 產品","example":"This product is popular all over the world.","example_zh":"這項產品在全世界都很受歡迎。"},{"id":2254,"word":"production","pos":"n","meaning":"n. 生產；成果；產量","example":"The production of oil has been increased.","example_zh":"石油的生產量已經增加了。"},{"id":2255,"word":"productive","pos":"adj","meaning":"adj. 有生產力的；豐碩的","example":"She is a very productive member of our team.","example_zh":"她是我們團隊中非常有生產力的一員。"},{"id":2256,"word":"profession","pos":"n","meaning":"n. 職業；專業","example":"He chose the medical profession for his career.","example_zh":"他選擇醫療專業作為他的職業。"},{"id":2257,"word":"professional","pos":"adj","meaning":"adj. 職業的；專業的","example":"She is a professional photographer.","example_zh":"她是一位職業攝影師。"},{"id":2258,"word":"professor","pos":"n","meaning":"n. 教授","example":"He is a professor at the university.","example_zh":"他是大學的一位教授。"},{"id":2259,"word":"proficiency","pos":"n","meaning":"n. 熟練，精通","example":"She has a high level of proficiency in English.","example_zh":"她的英語精通程度很高。"},{"id":2260,"word":"proficient","pos":"adj","meaning":"adj. 熟練的，精通的","example":"He is proficient in using many computer programs.","example_zh":"他很熟練於使用許多電腦程式。"},{"id":2261,"word":"profit","pos":"n","meaning":"n. 利潤；利益 (v) 獲利；有利於","example":"The company made a large profit this year.","example_zh":"公司今年獲得了鉅額利潤。"},{"id":2262,"word":"profitable","pos":"adj","meaning":"adj. 有益的；有利的","example":"This is a very profitable investment.","example_zh":"這是一個非常有益（有利可圖）的投資。"},{"id":2263,"word":"progress","pos":"v/n","meaning":"v/n. 進步，進展","example":"He has made great progress in his English studies.","example_zh":"他在英語學習上有了很大的進步。"},{"id":2264,"word":"progressive","pos":"adj","meaning":"adj. 穩定發展的，逐步的","example":"There has been a progressive increase in the number of students.","example_zh":"學生人數呈現穩步增長。"},{"id":2265,"word":"prominent","pos":"adj","meaning":"adj. 突出的；重要的","example":"She holds a prominent position in the company.","example_zh":"她在公司擔任顯要的職位。"},{"id":2266,"word":"promise","pos":"v/n","meaning":"v/n. 承諾","example":"He kept his promise to help me.","example_zh":"他信守了幫我的承諾。"},{"id":2267,"word":"promising","pos":"adj","meaning":"adj. 有希望的；有前途的","example":"He is a promising young artist.","example_zh":"他是一位有前途的年輕藝術家。"},{"id":2268,"word":"promote","pos":"v","meaning":"v. 晉升；提升；宣傳；促銷","example":"The company decided to promote her to manager.","example_zh":"公司決定將她晉升為經理。"},{"id":2269,"word":"promotion","pos":"n","meaning":"n. 晉升；促銷；推廣","example":"The store is having a special promotion this week.","example_zh":"這間商店這週有特別的促銷活動。"},{"id":2270,"word":"prompt","pos":"adj","meaning":"adj. 敏捷的；迅速的","example":"Please give a prompt reply to my email.","example_zh":"請迅速回覆我的電子郵件。"},{"id":2271,"word":"pronoun","pos":"n","meanin . 保護的","example":"He has a protective attitude toward his younger sister.","example_zh":"他對他的妹妹有保護的態度。"},{"id":2285,"word":"protein","pos":"n","meaning":"n. 蛋白質","example":"Beans are a good source of protein.","example_zh":"豆類是蛋白質的良好來源。"},{"id":2286,"word":"protest","pos":"v","meaning":"v. 抗議；反對 (n) 抗議；反對","example":"Many people gathered to protest against the war.","example_zh":"許多人聚集起來抗議戰爭。"},{"id":2287,"word":"proverb","pos":"n","meaning":"n. 諺語；格言","example":"As the proverb says, \"Time is money.\"","example_zh":"正如諺語所說：「時間就是金錢。」"},{"id":2288,"word":"provide","pos":"v","meaning":"v. 提供，供給","example":"The company will provide food for the meeting.","example_zh":"公司將為會議提供食物。"},{"id":2289,"word":"psychological","pos":"adj","meaning":"adj. 心理（上）的","example":"He is having some psychological problems.","example_zh":"他有一些心理上的問題。"},{"id":2290,"word":"psychologist","pos":"n","meaning":"n. 心理學家","example":"A psychologist can help you with your stress.","example_zh":"心理學家可以協助你處理壓力。"},{"id":2291,"word":"psychology","pos":"n","meaning":"n. 心理（學）","example":"She is studying psychology at university.","example_zh":"她在大學研讀心理學。"},{"id":2292,"word":"pub","pos":"n","meaning":"n. 酒館；酒吧","example":"They went to the local pub for a drink.","example_zh":"他們去當地的酒吧喝一杯。"},{"id":2293,"word":"publication","pos":"n","meaning":"n. 出版；發行","example":"The publication of the book was delayed.","example_zh":"這本書的出版被延誤了。"},{"id":2294,"word":"publicity","pos":"n","meaning":"n. 廣告；宣傳","example":"The movie received a lot of publicity before it was released.","example_zh":"這部電影在上映前獲得了許多宣傳。"},{"id":2295,"word":"publish","pos":"v","meaning":"v. 出版；發行；刊載","example":"They plan to publish her new novel next month.","example_zh":"他們計畫下個月出版她的新小說。"},{"id":2296,"word":"publisher","pos":"n","meaning":"n. 出版公司；發行公司；出版商","example":"She works for a large publisher in New York.","example_zh":"她在紐約的一家大型出版公司工作。"},{"id":2297,"word":"pull up","pos":"phr","meaning":"phr. 停車","example":"The taxi pulled up in front of the hotel.","example_zh":"計程車在飯店前停了下來。"},{"id":2298,"word":"punch","pos":"v","meaning":"v. 用力擊；用力按 (n) 拳打","example":"He gave the heavy door a punch.","example_zh":"他用力擊了那扇沉重的門。"},{"id":2299,"word":"punctual","pos":"adj","meaning":"adj. 準時的","example":"It is important to be punctual for your job interview.","example_zh":"面試時準時是很重要的。"},{"id":2300,"word":"punish","pos":"v","meaning":"v. 處罰","example":"The judge decided to punish the criminal for his actions.","example_zh":"法官決定處罰該名罪犯的行為。"},{"id":2301,"word":"punishment","pos":"n","meaning":"n. 處罰","example":"The punishment for speeding is a fine.","example_zh":"超速的處罰是罰款。"},{"id":2302,"word":"purchase","pos":"v/n","meaning":"v/n. 購買","example":"I made a purchase at the store this morning.","example_zh":"我今天早上在店裡完成了一次購買。"},{"id":2303,"word":"pure","pos":"adj","meaning":"adj. 純淨的","example":"She likes to drink pure water.","example_zh":"她喜歡喝純淨的水。"},{"id":2304,"word":"pursue","pos":"v","meaning":"v. 追趕；追捕；追求","example":"He is trying to pursue a career in music.","example_zh":"他正試圖追求音樂事業。"},{"id":2305,"word":"pursuit","pos":"n","meaning":"n. 追求；尋求","example":"She is in pursuit of her dreams.","example_zh":"她正在追求她的夢想。"},{"id":2306,"word":"put (something) behind","pos":"phr","meaning":"phr. 拋諸腦後","example":"It's time to put the past behind you and move on.","example_zh":"是時候把過去拋諸腦後，繼續前進了。"},{"id":2307,"word":"put off","pos":"phr","meaning":"phr. 拖延","example":"Don't put off until tomorrow what you can do today.","example_zh":"不要把今天能做的事拖延到明天。"},{"id":2308,"word":"put something into action","pos":"phr","meaning":"phr. 將(某事)付諸實行","example":"You should put your plans into action.","example_zh":"你應該將你的計畫付諸實行。"},{"id":2309,"word":"put something up","pos":"phr","meaning":"phr. 建造","example":"They decided to put up a new fence around the garden.","example_zh":"他們決定在花園周圍建造一扇新圍籬。"},{"id":2310,"word":"quake","pos":"v","meaning":"v. 抖；哆嗦；震動；搖晃 (n) 地震；震動","example":"The ground began to quake during the earthquake.","example_zh":"地震時地面開始震動。" aning":"v. 舉起；養育","example":"She was raised by her grandparents.","example_zh":"她是由祖父母養育長大的。"},{"id":2325,"word":"raisin","pos":"n","meaning":"n. 葡萄乾","example":"He likes to put raisins in his oatmeal.","example_zh":"他喜歡在燕麥粥裡加葡萄乾。"},{"id":2326,"word":"range","pos":"v/n","meaning":"v/n. 範圍包括(from A to B 從A到B)","example":"The prices range from $10 to $100.","example_zh":"價格範圍從10美元到100美元不等。"},{"id":2327,"word":"rank","pos":"n","meaning":"n. 等級；地位；階級 (v) 列為（某一）等級","example":"She holds a high rank in the army.","example_zh":"她在軍中擁有很高的階級。"},{"id":2328,"word":"rapid","pos":"adj","meaning":"adj. 快速的，迅速的","example":"He made a rapid recovery after the surgery.","example_zh":"他在手術後恢復得很快。"},{"id":2329,"word":"rapidly","pos":"adv","meaning":"adv. 快速地，迅速地","example":"The number of students is increasing rapidly.","example_zh":"學生人數正快速增加。"},{"id":2330,"word":"rate","pos":"n","meaning":"n. 比率；價格；等級 (v) 評價","example":"The interest rate has changed this month.","example_zh":"本月的利率已經變更了。"},{"id":2331,"word":"rather than","pos":"phr","meaning":"phr. 而不是","example":"I would like tea rather than coffee.","example_zh":"我想要茶，而不是咖啡。"},{"id":2332,"word":"raw","pos":"adj","meaning":"adj. 生的；未加工的","example":"Some people like to eat raw fish.","example_zh":"有些人喜歡吃生魚。"},{"id":2333,"word":"ray","pos":"n","meaning":"n. 光線","example":"A ray of sunlight came through the window.","example_zh":"一道陽光穿過窗戶射入。"},{"id":2334,"word":"razor","pos":"n","meaning":"n. 剃刀","example":"He uses a sharp razor to shave.","example_zh":"他用一把鋒利的剃刀刮鬍子。"},{"id":2335,"word":"reach","pos":"v","meaning":"v. 實現，達成；抵達","example":"We finally reached our destination.","example_zh":"我們終於抵達了目的地。"},{"id":2336,"word":"reach out to someone","pos":"phr","meaning":"phr. 向～伸出援手","example":"You can always reach out to me if you need support.","example_zh":"如果你需要支持，你可以隨時向我伸出援手（聯絡我）。"},{"id":2337,"word":"react","pos":"v","meaning":"v. 反應","example":"How did she react to your suggestion?","example_zh":"她對你的建議有什麼反應？"},{"id":2338,"word":"reaction","pos":"n","meaning":"n. 反應","example":"His reaction was one of total surprise.","example_zh":"他的反應是完全的驚訝。"},{"id":2339,"word":"realistic","pos":"adj","meaning":"adj. 現實的；寫實的","example":"We need to have a realistic view of the situation.","example_zh":"我們對局勢需要有現實的看法。"},{"id":2340,"word":"realize","pos":"v","meaning":"v. 了解，發覺；實現","example":"I didn't realize that it was so late.","example_zh":"我沒發覺時間已經這麼晚了。"},{"id":2341,"word":"rear","pos":"adj","meaning":"adj. 後面的 (n) 後面 (v) 撫養","example":"The rear door of the car was locked.","example_zh":"車子的後門鎖住了。"},{"id":2342,"word":"reasonable","pos":"adj","meaning":"adj. 講道理的；合理的","example":"It is not reasonable to expect perfection.","example_zh":"期待完美是不合理的。"},{"id":2343,"word":"rebel","pos":"v","meaning":"v. 反叛 (n) 反抗者","example":"The rebels fought against the government.","example_zh":"反抗者與政府作戰。"},{"id":2344,"word":"recall","pos":"v","meaning":"v. 回想；收回","example":"I cannot recall his name at the moment.","example_zh":"我現在回想不起他的名字。"},{"id":2345,"word":"receipt","pos":"n","meaning":"n. 收據","example":"Please keep your receipt if you want to return the item.","example_zh":"如果你想退貨，請保留收據。"},{"id":2346,"word":"receive","pos":"v","meaning":"v. 得到，收到","example":"I received a letter from my friend today.","example_zh":"我今天收到了一封朋友的信。"},{"id":2347,"word":"receiver","pos":"n","meaning":"n. 接收器；電話聽筒","example":"The phone receiver was off the hook.","example_zh":"電話聽筒沒放好。"},{"id":2348,"word":"recent","pos":"adj","meaning":"adj. 最近的，近來的","example":"These are recent photos of my family.","example_zh":"這些是我家人的近期照片。"},{"id":2349,"word":"recently","pos":"adv","meaning":"adv. 最近，近來","example":"I saw her recently at the library.","example_zh":"我最近在圖書館看見她。"},{"id":2350,"word":"reception","pos":"n","meaning":"n. 接待；歡迎","example":"The hotel has a very nice reception.","example_zh":"這家飯店有非常好的接待處。"},{"id":2351,"word":"recipe","pos":"n","meaning":"n. 食譜","example":"This is my grandmother's secret recipe.","example_zh":"這是祖母的秘方（食譜）。"},{"id":2352,"word":"recite","pos":"v","meaning":"v. 背誦","example":"The student had to recite a poem in class.","example_zh":"那位學生必須在課堂上背誦一首詩。"},{"id":2353,"word":"recognition","pos":"n","meaning":"n. 認出；識別；承認；認可","example":"She received recognition for her hard work.","example_zh":"她因為努力工作而獲得了表彰。"},{"id":2354,"word":"recognize","pos":"v","meaning":"v. 認出；承認；感謝；表彰","example":"I didn't recognize him with his new haircut.","example_zh":"他留了新髮型，我沒認出他來。"},{"id":2355,"word":"recommend","pos":"v","meaning":"v. 推薦，介紹","example":"Can you recommend a good book to read?","example_zh":"你能推薦一本好書嗎？"},{"id":2356,"word":"recommendation","pos":"n","meaning":"n. 推薦、推薦信","example":"He wrote a recommendation for his employee.","example_zh":"他為他的員工寫了一封推薦信。"},{"id":2357,"word":"reconcile","pos":"v","meaning":"v. 和解，和好","example":"They finally reconciled after their long fight.","example_zh":"他們在長期的爭吵後終於和解了。"},{"id":2358,"word":"reconciliation","pos":"n","meaning":"n. 和解，和好","example":"The reconciliation was a relief for everyone.","example_zh":"和解讓每個人都鬆了一口氣。"},{"id":2359,"word":"reconstruction","pos":"n","meaning":"n. 重建，復原","example":"The reconstruction of the building will take a year.","example_zh":"那棟建築的重建將花費一年。"},{"id":2360,"word":"record","pos":"n/v","meaning":"n/v. 錄音；紀錄","example":"We need to record the meeting for future reference.","example_zh":"我們需要將會議錄音以備未來參考。"},{"id":2361,"word":"recorder","pos":"n","meaning":"n. 錄音機；錄放影機","example":"I use a digital recorder to take notes.","example_zh":"我用數位錄音機來做筆記。"},{"id":2362,"word":"recover","pos":"v","meaning":"v. 康復；收復；尋回","example":"It takes time to recover from a serious illness.","example_zh":"從重病中康復需要時間。"},{"id":2363,"word":"recovery","pos":"n","meaning":"n. 康復；復元；取回；收復","example":"The economy is making a slow recovery.","example_zh":"經濟正緩慢地復甦。"},{"id":2364,"word":"recreation","pos":"n","meaning":"n. 消遣；娛樂","example":"Sports and music are popular forms of recreation.","example_zh":"運動和音樂是流行的娛樂形式。"},{"id":2365,"word":"recruit","pos":"v","meaning":"v. 招募","example":"The company is trying to recruit new workers.","example_zh":"公司正試圖招募新員工。"},{"id":2366,"word":"recur","pos":"v","meaning":"v. 再發生， 復發","example":"We must make sure the problem does not recur.","example_zh":"我們必須確保問題不會再發生。"},{"id":2367,"word":"recurrence","pos":"n","meaning":"n. 反覆發生","example":"The recurrence of the disease is a major concern.","example_zh":"疾病的反覆發生是一個主要隱憂。"},{"id":2368,"word":"recurrent","pos":"adj","meaning":"adj. 反覆出現的","example":"He suffers from recurrent headaches.","example_zh":"他飽受反覆出現的頭痛之苦。"},{"id":2369,"word":"recycle","pos":"v","meaning":"v. 回收；再利用","example":"It is important to recycle paper and plastic.","example_zh":"回收紙張和塑膠很重要。"},{"id":2370,"word":"reduce","pos":"v","meaning":"v. 減少；使陷於～的地步；降級","example":"We need to reduce our energy consumption.","example_zh":"我們需要減少能源消耗。"},{"id":2371,"word":"reduction","pos":"n","meaning":"n. 減少","example":"The reduction in prices helped sales.","example_zh":"價格的降低有助於銷售。"},{"id":2372,"word":"refer","pos":"v","meaning":"v. 參考；查閱；提到；說起","example":"Please refer to the textbook for more information.","example_zh":"請查閱課本以獲取更多資訊。"},{"id":2373,"word":"refer to … as","pos":"phr","meaning":"phr. 把A稱作B","example":"We refer to this style as \"modern.\"","example_zh":"我們把這種風格稱作「現代」。"},{"id":2374,"word":"reference","pos":"n","meaning":"n. 寫介紹信的人；證明書；介紹信；參考；言及；提及","example":"You can use this report as a reference.","example_zh":"你可以將這份報告作為參考。"},{"id":2375,"word":"reflect","pos":"v","meaning":"v. 反射；映現；反映；仔細思考","example":"The water reflects the blue sky.","example_zh":"水面映照出藍天。"},{"id":2376,"word":"reflection","pos":"n","meaning":"n. 倒影；反映；沉思；深思熟慮","example":"He spent time in quiet reflection.","example_zh":"他花了一些時間沉思。"},{"id":2377,"word":"reform","pos":"v","meaning":"v. 改革 (n) 改革","example":"The government is planning a major reform.","example_zh":"政府正計畫一項重大改革。"},{"id":2378,"word":"refresh","pos":"v","meaning":"v. 使恢復活力；使喚起","example":"A cold shower can refresh you.","example_zh":"洗個冷水澡可以讓你恢復活力。"},{"id":2379,"word":"refreshment","pos":"n","meaning":"n. 精力恢復；心曠神怡；點心","example":"We were served light refreshments at the meeting.","example_zh":"會議上提供了點心。"}]},
{"unit":19,"unit_label":"p.37-38","words":[{"id":2380,"word":"refugee","pos":"n","meaning":"n. 難民","example":"The war forced many people to become refugees.","example_zh":"戰爭迫使許多人成為難民。"},{"id":2381,"word":"refusal","pos":"n","meaning":"n. 拒絕","example":"His refusal to help was unexpected.","example_zh":"他拒絕提供幫助出乎意料。"},{"id":2382,"word":"refuse","pos":"v","meaning":"v. 拒絕","example":"She refused to accept the gift.","example_zh":"她拒絕接受那份禮物。"},{"id":2383,"word":"regard","pos":"v","meaning":"v. 認為，視為(A as B) (n) 尊敬，欽佩","example":"I regard him as a very good friend.","example_zh":"我把他視為非常好的朋友。"},{"id":2384,"word":"regarding","pos":"prep","meaning":"prep. 關於","example":"Regarding your request, we will look into it.","example_zh":"關於你的要求，我們會深入調查。"},{"id":2385,"word":"region","pos":"n","meaning":"n. 地區","example":"This region is known for its beautiful mountains.","example_zh":"這個地區以美麗的山脈聞名。"},{"id":2386,"word":"regional","pos":"adj","meaning":"adj. 地區的","example":"We are looking at regional economic growth.","example_zh":"我們正在關注區域經濟增長。"},{"id":2387,"word":"register","pos":"v","meaning":"v. 登記；註冊；以掛號寄出 (n) 名冊；登記簿","example":"You need to register for the course online.","example_zh":"你需要在線上註冊課程。"},{"id":2388,"word":"registration","pos":"n","meaning":"n. 登記；註冊；掛號","example":"Please complete your registration by Friday.","example_zh":"請在週五前完成你的註冊。"},{"id":2389,"word":"regret","pos":"v","meaning":"v. 後悔；遺憾 (n) 後悔；遺憾","example":"I regret saying those things to you.","example_zh":"我後悔對你說了那些話。"},{"id":2390,"word":"regretful","pos":"adj","meaning":"adj. 後悔的，遺憾的","example":"She felt regretful about missing the party.","example_zh":"她對錯過派對感到後悔。"},{"id":2391,"word":"regretfully","pos":"adv","meaning":"adv. 後悔地；不幸地","example":"He regretfully admitted his mistake.","example_zh":"他遺憾地承認了自己的錯誤。"},{"id":2392,"word":"regrettably","pos":"adv","meaning":"adv. 令人遺憾地，令人後悔地","example":"Regrettably, we cannot attend the wedding.","example_zh":"令人遺憾地，我們無法參加婚禮。"},{"id":2393,"word":"regular","pos":"adj","meaning":"adj. 規律的，頻繁的","example":"He has a regular exercise routine.","example_zh":"他有規律的運動習慣。"},{"id":2394,"word":"regularly","pos":"adv","meaning":"adv. 規律地","example":"She goes to the gym regularly.","example_zh":"她規律地去健身房。"},{"id":2395,"word":"regulate","pos":"v","meaning":"v. 管理；控制；調節；調整","example":"The government needs to regulate the banking industry.","example_zh":"政府需要管理銀行業。"},{"id":2396,"word":"regulation","pos":"n","meaning":"n. 規定；規則","example":"You must follow all school regulations.","example_zh":"你必須遵守所有學校規定。"},{"id":2397,"word":"rehearsal","pos":"n","meaning":"n. 排練；預演","example":"We had a long rehearsal for the play.","example_zh":"我們為那場戲劇進行了長時間的排練。"},{"id":2398,"word":"rehearse","pos":"v","meaning":"v. 排演","example":"The band needs to rehearse for the concert.","example_zh":"樂團需要為演唱會排演。"},{"id":2399,"word":"rejection","pos":"n","meaning":"n. 拒絕","example":"The rejection of his proposal disappointed him.","example_zh":"他的提案被拒絕讓他感到失望。"},{"id":2400,"word":"relate","pos":"v","meaning":"v. （使）有關聯；與～有親戚關係","example":"It is hard to relate these two events because they happened in different years.","example_zh":"這兩個事件發生在不同年份，很難把它們聯繫起來。"},{"id":2401,"word":"related","pos":"adj","meaning":"adj. 相關的，有關的","example":"Many health problems are related to a lack of sleep.","example_zh":"許多健康問題都與睡眠不足有關。"},{"id":2402,"word":"relation","pos":"n","meaning":"n. 關係，關聯","example":"The relation between the two countries has improved in recent years.","example_zh":"這兩個國家之間的關係近年來已有改善。"},{"id":2403,"word":"relationship","pos":"n","meaning":"n. 關係，人際關係","example":"A good relationship with your classmates makes school life more enjoyable.","example_zh":"與同學保持良好的關係，會讓校園生活更愉快。"},{"id":2404,"word":"relative","pos":"n","meaning":"n. 親戚 (adj) 相對的；比較的","example":"We invited all our relatives to the wedding, including my uncle from Canada.","example_zh":"我們邀請了所有親戚來參加婚禮，包括從加拿大來的叔叔。"},{"id":2405,"word":"relax","pos":"v","meaning":"v. 使輕鬆；休息；放鬆","example":"After a long day at work, I like to relax by listening to soft music.","example_zh":"工作一整天後，我喜歡聽輕柔的音樂來放鬆。"},{"id":2406,"word":"relaxation","pos":"n","meaning":"n. 消遣；娛樂；鬆弛；鬆懈","example":"Reading novels is my favorite form of relaxation after the exam.","example_zh":"讀小說是我考試後最喜歡的消遣方式。"},{"id":2407,"word":"relaxed","pos":"adj","meaning":"adj. 放鬆的","example":"The teacher's friendly smile made the students feel relaxed.","example_zh":"老師友善的微笑讓學生們感到放鬆。"},{"id":2408,"word":"release","pos":"v","meaning":"v. 釋放；解除；發行 (n) 釋放；解脫；發行的作品","example":"The singer will release her new album next month.","example_zh":"那位歌手下個月將發行她的新專輯。"},{"id":2409,"word":"reliable","pos":"adj","meaning":"adj. 可靠的","example":"My brother is a reliable person who always keeps his promises.","example_zh":"我哥哥是個可靠的人，總是信守承諾。"},{"id":2410,"word":"reliance","pos":"n","meaning":"n. 對～的依賴","example":"Too much reliance on smartphones may weaken our memory.","example_zh":"過度依賴智慧型手機可能會削弱我們的記憶力。"},{"id":2411,"word":"relief","pos":"n","meaning":"n. 減輕；消除；慰藉","example":"The cool breeze brought great relief on such a hot afternoon.","example_zh":"在這麼炎熱的午後，涼爽的微風帶來了極大的舒緩。"},{"id":2412,"word":"relieve","pos":"v","meaning":"v. 減輕；解除","example":"This medicine can relieve the pain in your back.","example_zh":"這種藥可以減輕你背部的疼痛。"},{"id":2413,"word":"relieved","pos":"adj","meaning":"adj. 寬慰的，放心的","example":"She was relieved to hear that her son had arrived safely.","example_zh":"聽到兒子平安抵達，她感到寬慰。"},{"id":2414,"word":"religion","pos":"n","meaning":"n. 宗教（信仰）","example":"People in different countries may follow different religions.","example_zh":"不同國家的人可能信仰不同的宗教。"},{"id":2415,"word":"religious","pos":"adj","meaning":"adj. 宗教的；虔誠的","example":"The village holds a religious ceremony every spring.","example_zh":"這個村莊每年春天都會舉行宗教儀式。"},{"id":2416,"word":"reluctant","pos":"adj","meaning":"adj. 不情願的","example":"He was reluctant to tell his parents about his poor test result.","example_zh":"他不願意告訴父母自己考試成績不好。"},{"id":2417,"word":"rely","pos":"v","meaning":"v. 依賴；依靠","example":"You can rely on me whenever you need help.","example_zh":"只要你需要幫忙，都可以依靠我。"},{"id":2418,"word":"rely on","pos":"phr","meaning":"phr. 依賴","example":"Young children rely on their parents for food and care.","example_zh":"年幼的孩子依賴父母提供食物與照顧。"},{"id":2419,"word":"remain","pos":"v","meaning":"v. 存留；保持；留待","example":"Please remain seated until the plane has come to a complete stop.","example_zh":"請在飛機完全停妥前保持就座。"},{"id":2420,"word":"remains","pos":"n","meaning":"n. 剩餘物，遺跡","example":"Archaeologists found the remains of an ancient city under the sand.","example_zh":"考古學家在沙子底下發現了一座古城的遺跡。"},{"id":2421,"word":"remark","pos":"v","meaning":"v. 說；評論 (n) 談論；評論","example":"\"That's a great idea,\" the teacher remarked with a smile.","example_zh":"老師微笑著說：「那是個很棒的主意。」"},{"id":2422,"word":"remarkable","pos":"adj","meaning":"adj. 顯著的；非凡的","example":"She made remarkable progress in English after joining the speech club.","example_zh":"加入演講社之後，她的英文進步得很顯著。"},{"id":2423,"word":"remedy","pos":"n","meaning":"n. 治療法；補救辦法 (v) 補救","example":"Drinking warm water with honey is a simple remedy for a sore throat.","example_zh":"喝蜂蜜溫開水是緩解喉嚨痛的簡單療法。"},{"id":2424,"word":"remind","pos":"v","meaning":"v. 提醒；使想起","example":"This photo always reminds me of my happy childhood.","example_zh":"這張照片總是讓我想起快樂的童年。"},{"id":2425,"word":"remote","pos":"adj","meaning":"adj. 遙遠的；偏僻的","example":"They live in a remote village far away from any big city.","example_zh":"他們住在一個遠離任何大城市的偏僻村莊。"},{"id":2426,"word":"remove","pos":"v","meaning":"v. 移開","example":"Please remove your shoes before entering the house.","example_zh":"進屋前請脫掉鞋子。"},{"id":2427,"word":"renew","pos":"v","meaning":"v. 使延期；更換（執照等）；更新","example":"I need to renew my library card before it expires.","example_zh":"我得在圖書證到期前辦理更新。"},{"id":2428,"word":"rent","pos":"v","meaning":"v. 租；出租 (n) 房租","example":"They decided to rent a small apartment near the school.","example_zh":"他們決定在學校附近租一間小公寓。"},{"id":2429,"word":"repair","pos":"v","meaning":"v. 修理 (n) 修理；修復","example":"The mechanic promised to repair my bike by tomorrow morning.","example_zh":"技師答應明天早上以前修好我的腳踏車。"},{"id":2430,"word":"repetition","pos":"n","meaning":"n. 重複；反覆","example":"Repetition is an important part of learning new vocabulary.","example_zh":"重複是學習新單字的重要環節。"},{"id":2431,"word":"replace","pos":"v","meaning":"v. 取代","example":"We need to replace the old light bulb in the kitchen.","example_zh":"我們得更換廚房裡那顆舊燈泡。"},{"id":2432,"word":"replacement","pos":"n","meaning":"n. 替代者，替代物","example":"The coach is looking for a replacement for the injured player.","example_zh":"教練正在為那位受傷的球員尋找替補人選。"},{"id":2433,"word":"reply","pos":"v/n","meaning":"v/n. 回覆","example":"He didn't reply to my message until the next morning.","example_zh":"他直到隔天早上才回覆我的訊息。"},{"id":2434,"word":"represent","pos":"v","meaning":"v. 代表；表示；象徵","example":"The white dove is often used to represent peace.","example_zh":"白鴿常被用來象徵和平。"},{"id":2435,"word":"representation","pos":"n","meaning":"n. 代表（權）","example":"Many citizens demand fair representation in the city council.","example_zh":"許多市民要求在市議會中有公平的代表權。"},{"id":2436,"word":"representative","pos":"n","meaning":"n. 代表 (adj) 代表性的","example":"Each class will choose a representative to speak at the meeting.","example_zh":"每個班級將選出一位代表在會議上發言。"},{"id":2437,"word":"reproduce","pos":"vi","meaning":"vi. 繁殖，生殖","example":"Frogs reproduce by laying eggs in the water.","example_zh":"青蛙靠在水中產卵來繁殖。"},{"id":2438,"word":"reproduction","pos":"n","meaning":"n. 繁殖、生殖","example":"The reproduction of these rare birds is closely watched by scientists.","example_zh":"科學家密切關注這些稀有鳥類的繁殖情況。"},{"id":2439,"word":"republic","pos":"n","meaning":"n. 共和國；共和政體","example":"France became a republic after the revolution in the eighteenth century.","example_zh":"法國在十八世紀的革命後成為共和國。"},{"id":2440,"word":"reputation","pos":"n","meaning":"n. 名譽；名聲","example":"The restaurant has a good reputation for its fresh seafood.","example_zh":"那家餐廳以新鮮海產聞名，享有良好的名聲。"},{"id":2441,"word":"request","pos":"v","meaning":"v. 請求；要求；點歌 (n) 請求；要求；點播曲","example":"The guests can request their favorite songs at the party.","example_zh":"賓客可以在派對上點播自己喜歡的歌曲。"},{"id":2442,"word":"require","pos":"v","meaning":"v. 需要，要求","example":"This job requires at least two years of working experience.","example_zh":"這份工作需要至少兩年的工作經驗。"},{"id":2443,"word":"requirement","pos":"n","meaning":"n. 必需品，必要條件","example":"Passing the oral test is a requirement for graduation.","example_zh":"通過口試是畢業的必要條件。"},{"id":2444,"word":"rescue","pos":"v","meaning":"v. 救援 (n) 救援","example":"The firefighters rescued the child from the burning building.","example_zh":"消防員從著火的建築物中救出了那個孩子。"},{"id":2445,"word":"research","pos":"n","meaning":"n. 研究 (v) 研究","example":"Scientists are doing research on how to protect coral reefs.","example_zh":"科學家正在研究如何保護珊瑚礁。"},{"id":2446,"word":"researcher","pos":"n","meaning":"n. 研究人員","example":"The researcher spent three years studying the habits of wild monkeys.","example_zh":"那位研究人員花了三年研究野生猴子的習性。"},{"id":2447,"word":"resemble","pos":"v","meaning":"v. 像","example":"The little girl resembles her mother in both looks and personality.","example_zh":"那個小女孩在外貌和個性上都像她媽媽。"},{"id":2448,"word":"reservation","pos":"n","meaning":"n. 預訂；疑慮；懷疑","example":"I made a reservation for four people at the Italian restaurant.","example_zh":"我在那家義大利餐廳訂了四個人的位子。"},{"id":2449,"word":"reserve","pos":"v","meaning":"v. 保留；保存；預定 (n) 保護區","example":"Could you reserve two seats for us near the window?","example_zh":"你可以幫我們預訂兩個靠窗的座位嗎？"},{"id":2450,"word":"reside","pos":"v","meaning":"v. 居住","example":"Many students reside in the dormitory during the school year.","example_zh":"許多學生在學年期間住在宿舍。"},{"id":2451,"word":"residence","pos":"n","meaning":"n. 住所","example":"The president's official residence is guarded day and night.","example_zh":"總統的官邸日夜都有人守衛。"},{"id":2452,"word":"resident","pos":"n","meaning":"n. 居民","example":"The residents of this building are holding a meeting tonight.","example_zh":"這棟大樓的居民今晚要開會。"},{"id":2453,"wo
