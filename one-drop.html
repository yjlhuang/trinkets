<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一滴水・單字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --soil:#bba88b; --speck:#a08d70; --speck2:#cbbb9f;
  --wet:#6f5a40;
  --panel:#e8ebe1; --ink:#27301f; --muted:#66705a; --line:#c9cfbd;
  --opt:#f4f6ef; --opt-hover:#fbfcf8;
  --water:#3b7ea8; --right:#4c7a33; --wrong:#a4513b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --soil:#5c4f3d; --speck:#4b4032; --speck2:#6a5c48; --wet:#2e251a;
    --panel:#1c2119; --ink:#e2e6d8; --muted:#9aa38c; --line:#343c2e;
    --opt:#252b21; --opt-hover:#2d3428;
    --water:#6fb1d8; --right:#8fbf6c; --wrong:#e0886f;
  }
}
:root[data-theme="dark"]{
  --soil:#5c4f3d; --speck:#4b4032; --speck2:#6a5c48; --wet:#2e251a;
  --panel:#1c2119; --ink:#e2e6d8; --muted:#9aa38c; --line:#343c2e;
  --opt:#252b21; --opt-hover:#2d3428;
  --water:#6fb1d8; --right:#8fbf6c; --wrong:#e0886f;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--panel); color:var(--ink);
  font-family:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  display:flex; overflow:hidden;
}
button{font:inherit}
.land{position:relative;flex:1;min-width:0;min-height:0;background:var(--soil);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:default}
.land.has-water canvas{cursor:pointer}
.hint{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:1.35rem;color:var(--ink);opacity:.55;pointer-events:none;
  text-align:center;line-height:1.6;transition:opacity .6s;white-space:nowrap;
}
.hint.gone{opacity:0}
.toast{
  position:absolute;left:50%;bottom:1.25rem;transform:translateX(-50%);
  background:var(--panel);color:var(--ink);padding:.5rem 1rem;border-radius:999px;
  font-size:1rem;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:.95}
.snap{
  position:absolute;right:.75rem;top:.75rem;font-size:.9rem;
  color:var(--ink);background:var(--panel);border:0;border-radius:999px;
  padding:.35rem .9rem;cursor:pointer;opacity:.85;
}
.snap:hover{opacity:1}
.snap[hidden]{display:none}
.stale{
  position:absolute;left:50%;top:.75rem;transform:translateX(-50%);width:max-content;max-width:calc(100% - 2rem);
  background:var(--panel);color:var(--ink);border:1.5px solid var(--wrong);border-radius:12px;
  padding:.6rem .9rem;font-size:.95rem;line-height:1.5;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;
}
.stale[hidden]{display:none}
.stale button{font-size:.9rem;padding:.3rem .9rem;border-radius:999px;border:0;background:var(--ink);color:var(--panel);cursor:pointer}
/* 存檔失敗警告會一直掛著：靠左放，讓出右上角的「存成圖片」 */
#savewarn{left:.75rem;transform:none;max-width:calc(100% - 8.5rem)}

/* 換玩法：一滴水 ⇄ 單字水彩（各自存檔、各自記熟字） */
.games{display:flex;gap:.25rem;margin:.6rem 1.25rem 0;padding:.2rem;border-radius:999px;background:var(--opt);border:1px solid var(--line);align-self:flex-start}
.games a{font-size:.9rem;color:var(--muted);text-decoration:none;padding:.2rem .9rem;border-radius:999px}
.games a[aria-current]{background:var(--ink);color:var(--panel)}
.games a:not([aria-current]):hover{color:var(--ink)}
@media (max-width:760px){.games{margin:.45rem 1rem 0}}
.panel{
  width:min(440px,42vw);display:flex;flex-direction:column;
  border-left:1px solid var(--line);min-height:0;
}
.water{
  display:flex;align-items:center;gap:.6rem;padding:.9rem 1.25rem;
  border-bottom:1px solid var(--line);min-height:3.75rem;
}
.water-label{font-size:1rem;color:var(--muted);white-space:nowrap}
.drops{display:flex;flex-wrap:wrap;gap:.2rem;align-items:center;flex:1;min-width:0}
.drops svg{width:18px;height:24px;display:block}
.drops .more{font-size:1rem;color:var(--water);margin-left:.25rem}
.drops .none{color:var(--muted);font-size:.95rem}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) translateY(-8px)}100%{transform:scale(1)}}
.bar-btn{
  flex:none;font-size:.9rem;color:var(--muted);background:none;
  border:1px solid transparent;border-radius:999px;padding:.3rem .75rem;cursor:pointer;white-space:nowrap;
}
.bar-btn:hover{border-color:var(--line);color:var(--ink)}
.bar-btn.armed{color:var(--wrong);border-color:var(--wrong)}
#range{color:var(--ink);border-color:var(--line)}

.view{flex:1;overflow-y:auto;padding:1.1rem 1.5rem 1.5rem;min-height:0}
.view[hidden]{display:none}
.where{display:flex;flex-wrap:wrap;gap:.35rem .75rem;align-items:center;font-size:.85rem;color:var(--muted);margin:0 0 .9rem}
.kind{color:var(--ink);background:var(--opt);border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem}
.again{color:var(--wrong)}
.again[hidden]{display:none}

.prompt{margin:0 0 1rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.prompt .word{font-size:2rem;font-weight:700;line-height:1.25;word-break:break-word}
.prompt .mean{font-size:1.2rem;line-height:1.7}
.say{
  flex:none;width:2.25rem;height:2.25rem;border-radius:50%;border:1px solid var(--line);
  background:var(--opt);color:var(--water);cursor:pointer;display:inline-grid;place-items:center;padding:0;
}
.say:hover{background:var(--opt-hover)}
.say svg{width:18px;height:18px}
.say[hidden]{display:none}

.opts{display:flex;flex-direction:column;gap:.5rem;margin:0;padding:0;list-style:none}
.opt{
  display:flex;gap:.6rem;width:100%;text-align:left;font-size:1rem;line-height:1.6;
  color:var(--ink);background:var(--opt);border:1.5px solid var(--line);border-radius:10px;
  padding:.6rem .8rem;cursor:pointer;
}
.opt.en{font-size:1.15rem}
.opt:hover:not(:disabled){background:var(--opt-hover);border-color:var(--muted)}
.opt .k{font-weight:700;color:var(--muted);flex:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--right);background:color-mix(in srgb,var(--right) 14%,var(--opt))}
.opt.right .k{color:var(--right)}
.opt.wrong{border-color:var(--wrong);opacity:.8}
.opt.wrong .k{color:var(--wrong)}
.opt.dim{opacity:.5}

.spell{display:flex;flex-direction:column;gap:.6rem}
.spell[hidden]{display:none}
.letters small{letter-spacing:0;font-size:.85rem;margin-left:.75rem}
.letters{font-size:1.2rem;letter-spacing:.18em;color:var(--muted);margin:0;word-break:break-all}
.spell input{
  font:inherit;font-size:1.35rem;padding:.6rem .8rem;border-radius:10px;width:100%;
  border:1.5px solid var(--line);background:var(--opt);color:var(--ink);
}
.spell input:focus{outline:none;border-color:var(--water)}
.spell input.ok{border-color:var(--right)}
.spell input.no{border-color:var(--wrong)}
.spell-row{display:flex;gap:.5rem;flex-wrap:wrap}

.after{margin-top:1rem;display:none;flex-direction:column;gap:.75rem}
.after.on{display:flex}
.msg{font-size:1rem;line-height:1.6;margin:0}
.msg.good{color:var(--right)}
.msg.bad{color:var(--wrong)}
.card{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem .8rem;border-radius:10px;background:var(--opt);border:1px solid var(--line)}
.card b{font-size:1.15rem}
.card span{color:var(--muted);line-height:1.6}
.card .ex{flex-basis:100%;margin-top:.15rem;padding-top:.5rem;border-top:1px dashed var(--line);line-height:1.6}
.card .ex p{margin:0;font-style:italic}
.card .ex .ez{font-style:normal;color:var(--muted);font-size:.92em}
.next{
  align-self:flex-start;font-size:1rem;padding:.55rem 1.2rem;border-radius:999px;cursor:pointer;
  background:var(--ink);color:var(--panel);border:0;
}
.next:disabled{opacity:.4;cursor:default}
.ghost{
  font-size:1rem;padding:.55rem 1.1rem;border-radius:999px;cursor:pointer;
  background:none;color:var(--muted);border:1px solid var(--line);
}
.ghost:hover{color:var(--ink)}

/* range picker */
.pick h2{font-size:1.25rem;margin:0 0 .25rem}
.pick h3{font-size:1rem;margin:1.1rem 0 .5rem;color:var(--muted);font-weight:400}
.pick .sub{margin:0 0 .75rem;color:var(--muted);font-size:.9rem}
.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem;margin-top:.75rem}
.unit,.chip{
  text-align:left;color:var(--ink);background:var(--opt);border:1.5px solid var(--line);
  border-radius:10px;padding:.55rem .7rem;cursor:pointer;
}
.unit{display:flex;flex-direction:column;gap:.2rem;min-width:0;padding:.4rem .45rem}
.unit[aria-pressed="true"],.chip[aria-pressed="true"]{border-color:var(--water);background:color-mix(in srgb,var(--water) 13%,var(--opt))}
.unit.mid{border-style:dashed}                 /* 整段中間的回；頭尾兩回是實線 */
.unit.anchor{outline:2px solid var(--water);outline-offset:2px}   /* 點了頭、還沒點尾 */
.unit .pg{font-weight:700;font-size:.92rem;white-space:nowrap}
.unit .meta{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsum{background:color-mix(in srgb,var(--water) 10%,var(--opt));border-radius:10px;padding:.5rem .75rem;margin:.4rem 0 0}
.rsum .v{font-weight:700}
.rsum .h{font-size:.8rem;color:var(--muted)}
.unit .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.unit .bar i{display:block;height:100%;background:var(--right)}
.quick{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0 0}
.quick .chip{font-size:.88rem;padding:.3rem .8rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border-radius:999px;padding:.4rem .9rem}
.chip small{color:var(--muted);margin-left:.3rem}
.go{margin-top:1.25rem}
.ver-line{margin:.9rem 0 0;font-size:.75rem;color:var(--muted)}
.fine{margin-top:1.5rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

button:focus-visible,.unit:focus-visible,.chip:focus-visible{outline:3px solid var(--water);outline-offset:2px}

@media (max-width:760px){
  body{flex-direction:column}
  .land{flex:1 1 40%}
  .panel{width:100%;flex:1 1 60%;border-left:0;border-top:1px solid var(--line)}
  .water{padding:.5rem 1rem;min-height:3rem;gap:.4rem}
  .view{padding:.9rem 1rem 1.2rem}
  .prompt .word{font-size:1.7rem}
  .prompt .mean{font-size:1.1rem}
  .opt{font-size:.97rem}
  .after .next{align-self:stretch;padding:.8rem 1.2rem}   /* 手機：下一題滿版長條，左右手都好按（同 Painless GRE 一滴水） */
}
@media (max-width:480px){ .water-label{display:none} }
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>
<main class="land" id="land">
  <canvas id="cv" aria-label="你的土地。手上有水時，點一下土地把水滴下去。"></canvas>
  <div class="hint" id="hint">一片安靜的空地</div>
  <div class="toast" id="toast" role="status"></div>
  <button class="snap" id="snap" hidden>存成圖片</button>
  <div class="stale" id="stale" role="alert" hidden>另一個分頁更新了紀錄，這個分頁先暫停存檔。<button type="button" onclick="location.reload()">重新載入</button></div>
  <div class="stale" id="savewarn" role="alert" hidden>存檔失敗（可能是瀏覽器空間不足），最近的進度還沒存到。</div>
</main>
<aside class="panel">
  <nav class="games" aria-label="換玩法"><a href="one-drop.html" aria-current="page">一滴水</a><a href="vocab-watercolor.html">水彩</a></nav>
  <div class="water">
    <span class="water-label">手上的水</span>
    <div class="drops" id="drops" aria-live="polite"></div>
    <button class="bar-btn" id="range">範圍</button>
    <button class="bar-btn" id="reset">清空土地</button>
  </div>

  <section class="view" id="quiz" hidden>
    <p class="where"><span class="kind" id="kind"></span><span id="scope"></span><span class="again" id="again" hidden>上次答錯的字</span></p>
    <div class="prompt" id="prompt"></div>
    <ul class="opts" id="opts"></ul>
    <form class="spell" id="spell" hidden autocomplete="off">
      <p class="letters" id="letters"></p>
      <input id="typed" type="text" inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="輸入英文拼法">
      <div class="spell-row">
        <button class="next" type="submit" id="check">送出</button>
        <button class="ghost" type="button" id="giveup">不會，看答案</button>
      </div>
    </form>
    <div class="after" id="after">
      <p class="msg" id="msg"></p>
      <div class="card" id="card"></div>
      <button class="next" id="next">下一題</button>
    </div>
  </section>

  <section class="view pick" id="pick" hidden>
    <h2>要練哪幾頁？</h2>
    <div class="rsum" aria-live="polite"><div class="v" id="rsum-v"></div><div class="h" id="rsum-h"></div></div>
    <div class="quick">
      <button class="chip" id="exam">考試範圍</button>
      <button class="chip" id="all">全本</button>
      <button class="chip" id="weak">只出還不熟的字</button>
    </div>
    <div class="units" id="units"></div>
    <h3>題型（可複選，會隨機出）</h3>
    <div class="chips" id="modes">
      <button class="chip" data-m="e2c">看英文選中文</button>
      <button class="chip" data-m="c2e">看中文選英文</button>
      <button class="chip" data-m="spell">看中文拼英文<small>答對兩滴水</small></button>
    </div>
    <button class="next go" id="go">開始</button>
    <div class="fine">
      <span>連續答對兩次，就算這個字「熟了」。紀錄存在這台裝置上。</span>
      <button class="bar-btn" id="wipe">清除單字紀錄</button>
    </div>
    <p class="ver-line" id="ver"></p>
  </section>
</aside>

<script src="one-drop-lib/world.v1.4.js"></script>
<script>
/* ================= 單字資料 =================
   一個單元一行，格式和單字 JSON 檔一樣：{"unit":…, "unit_label":"p.31-32", "words":[{"id","word","pos","meaning"}…]}
   **字不要在這裡手改**：正本是班網 longjin2026 的 data/wordsblue.xlsx，改完在班網上線後，
   跑 python -I tools/sync_blue.py --write 同步過來（照班網 units.json 的回數，缺的回會自動補；2026-10-30 起全本 24 回）。
   單字水彩（vocab-watercolor.html）建置時也是讀這份清單：同步完到 vocab-watercolor-src/ 重跑 python build.py。 */
const UNITS = [
{"unit":1,"unit_label":"p.1-2","words":[{"id":1,"word":"a wealth of","pos":"phr","meaning":"phr. 大量的～","example":"The internet provides a wealth of information for students to research topics.","example_zh":"網路為學生研究課題提供了大量的資訊。"},{"id":2,"word":"abandon","pos":"v","meaning":"v. 拋棄，遺棄；放棄","example":"The kitten was so small that the family couldn't bear to abandon it in the rain.","example_zh":"小貓是如此瘦小，以至於這家人不忍心在雨中遺棄牠。"},{"id":3,"word":"aboard","pos":"adv","meaning":"adv. 登上（交通工具） (prep) 登上（交通工具）","example":"All passengers must present their tickets before going aboard the plane.","example_zh":"所有乘客在登上飛機前必須出示車票。"},{"id":4,"word":"aboriginal","pos":"adj","meaning":"adj. 原住民的，原生的","example":"The museum showcases various artifacts belonging to the aboriginal tribes of Taiwan.","example_zh":"這間博物館展示了屬於台灣原住民部落的各種文物。"},{"id":5,"word":"absolute","pos":"adj","meaning":"adj. 完全的；絕對的","example":"The king ruled the country with absolute power and made all the major decisions.","example_zh":"國王以絕對的權力統治國家，並做出所有重大決定。"},{"id":6,"word":"absolutely","pos":"adv","meaning":"adv. 完全地，絕對地","example":"I absolutely agree with your suggestion to start the project earlier.","example_zh":"我完全同意你提早開始這項計畫的建議。"},{"id":7,"word":"absorb","pos":"v","meaning":"v. 吸收","example":"Plants use their roots to absorb water and nutrients from the soil.","example_zh":"植物利用根部從土壤中吸收水分和養分。"},{"id":8,"word":"abstract","pos":"adj","meaning":"adj. 抽象的","example":"Modern art can be quite abstract, making it difficult for some people to understand.","example_zh":"現代藝術可能相當抽象，使得有些人難以理解。"},{"id":9,"word":"abuse","pos":"v/n","meaning":"v/n. 濫用；虐待；辱罵","example":"The government is taking measures to prevent the abuse of illegal drugs.","example_zh":"政府正採取措施防止非法藥物的濫用。"},{"id":10,"word":"abusive","pos":"adj","meaning":"adj. 辱罵的，濫用的，虐待的","example":"The player was disqualified for using abusive language toward the referee.","example_zh":"該名球員因對裁判使用辱罵言詞而被取消資格。"},{"id":11,"word":"academic","pos":"adj","meaning":"adj. 學業的，學校的","example":"Students are encouraged to maintain a balance between academic studies and sports.","example_zh":"學生被鼓勵在學業研究與運動之間保持平衡。"},{"id":12,"word":"accent","pos":"n","meaning":"n. 重音；腔調；口音","example":"Although he has lived in London for years, he still speaks with a strong French accent.","example_zh":"雖然他在倫敦住了多年，他說話仍帶著濃厚的法語口音。"},{"id":13,"word":"accept","pos":"v","meaning":"v. 接受","example":"I am happy to accept your invitation to the graduation party next week.","example_zh":"我很高興接受你下週畢業派對的邀請。"},{"id":14,"word":"acceptable","pos":"adj","meaning":"adj. 可接受的；令人滿意的","example":"It is not acceptable to talk loudly in the library while others are studying.","example_zh":"在圖書館他人讀書時大聲說話是不可接受的。"},{"id":15,"word":"acceptance","pos":"n","meaning":"n. 接受，收下","example":"The new policy gained wide acceptance among the citizens after the explanation.","example_zh":"這項新政策在解釋後獲得了市民的廣泛接受。"},{"id":16,"word":"access","pos":"n","meaning":"n. 使用～的機會、通路，路徑 (+to)","example":"Students have easy access to the library's online resources from home.","example_zh":"學生在家中可以輕鬆擁有使用圖書館線上資源的機會。"},{"id":17,"word":"access","pos":"v","meaning":"v. 存取","example":"You need to enter a password to access the files on this computer.","example_zh":"你需要輸入密碼才能存取這台電腦上的檔案。"},{"id":18,"word":"accessible","pos":"adj","meaning":"adj. 可到達的，可進入的；易取得的，可使用的","example":"The mountain trail is only accessible during the summer months due to snow.","example_zh":"由於積雪，這條山徑僅在夏季月份可到達。"},{"id":19,"word":"accidental","pos":"adj","meaning":"adj. 意外的","example":"The discovery of the ancient ruins was purely accidental.","example_zh":"發現這座古老遺跡純屬意外。"},{"id":20,"word":"accommodate","pos":"v","meaning":"v. 為～提供住所，容納，使適應","example":"The new hotel is large enough to accommodate up to five hundred guests.","example_zh":"這間新飯店大到足以容納多達五百名賓客。"},{"id":21,"word":"accommodation","pos":"n","meaning":"n. 住宿","example":"We need to find cheap accommodation for our trip to Hualien.","example_zh":"我們需要為花蓮之行尋找便宜的住宿。"},{"id":22,"word":"accompany","pos":"v","meaning":"v. 伴隨，陪伴","example":"Children under twelve must be accompanied by an adult to enter the cinema.","example_zh":"十二歲以下的兒童必須由大人陪伴才能進入電影院。"},{"id":23,"word":"accomplish","pos":"v","meaning":"v. 達成","example":"With hard work and determination, you can accomplish your goals.","example_zh":"透過努力與決心，你可以達成你的目標。"},{"id":24,"word":"account","pos":"n","meaning":"n. 敘述，描述；帳戶 (v) 認為是","example":"The witness gave a detailed account of the accident to the police.","example_zh":"證人向警方提供了關於這起事故的詳細描述。"},{"id":25,"word":"accountant","pos":"n","meaning":"n. 會計師","example":"My brother works as an accountant for a large international company.","example_zh":"我哥哥在一家大型國際公司擔任會計師。"},{"id":26,"word":"accumulate","pos":"v","meaning":"v. 累積","example":"Dust will quickly accumulate on the furniture if you don't clean it regularly.","example_zh":"如果你不定期清理，灰塵會很快在家具上累積。"},{"id":27,"word":"accumulation","pos":"n","meaning":"n. 累積","example":"The accumulation of wealth is not the only purpose of life.","example_zh":"財富的累積並非人生的唯一目的。"},{"id":28,"word":"accuracy","pos":"n","meaning":"n. 準確，精確","example":"The scientist checked the accuracy of the data before publishing the report.","example_zh":"科學家在發表報告前檢查了數據的準確性。"},{"id":29,"word":"accurate","pos":"adj","meaning":"adj. 準確的，正確無誤的","example":"It is important to provide accurate information when filling out the form.","example_zh":"填寫表格時提供準確的資訊是非常重要的。"},{"id":30,"word":"accuse","pos":"v","meaning":"v. 指控  (sb+of+sth)","example":"The police decided to accuse the man of theft based on the evidence.","example_zh":"警方決定根據證據指控這名男子偷竊。"},{"id":31,"word":"ache","pos":"v","meaning":"v. 痛 (n) 痛","example":"My muscles began to ache after I ran ten kilometers this morning.","example_zh":"在今天早上跑了十公里後，我的肌肉開始痛了。"},{"id":32,"word":"achieve","pos":"v","meaning":"v. 實現，達成","example":"If you work hard, you will eventually achieve success in your career.","example_zh":"如果你努力工作，你最終會在事業上實現成功。"},{"id":33,"word":"achievement","pos":"n","meaning":"n. 成就","example":"Winning the gold medal was a great achievement for the young athlete.","example_zh":"贏得金牌對這位年輕運動員來說是一項偉大的成就。"},{"id":34,"word":"acid","pos":"n","meaning":"n. 酸 (adj) 酸的","example":"Lemon juice is a type of acid that gives the fruit its sour taste.","example_zh":"檸檬汁是一種酸，賦予了這種水果酸味。"},{"id":35,"word":"acknowledge","pos":"v","meaning":"v. 承認","example":"The manager failed to acknowledge his mistakes in front of the team.","example_zh":"經理未能在團隊面前承認他的錯誤。"},{"id":36,"word":"acknowledgment","pos":"n","meaning":"n. 承認，確認，感謝","example":"We sent an email to the customer as an acknowledgment of their order.","example_zh":"我們給客戶發了一封電子郵件，作為對其訂單的確認。"},{"id":37,"word":"acquaint","pos":"v","meaning":"v. 使知道；使熟悉","example":"New employees need to acquaint themselves with the company's safety rules.","example_zh":"新員工需要使自己熟悉公司的安全守則。"},{"id":38,"word":"acquaintance","pos":"n","meaning":"n. 熟人；熟悉；相識","example":"He is just a casual acquaintance, not a close friend of mine.","example_zh":"他只是一個普通熟人，不是我的好朋友。"},{"id":39,"word":"acquire","pos":"v","meaning":"v. 獲得","example":"The company hopes to acquire more customers by launching a new product.","example_zh":"該公司希望透過推出新產品來獲得更多客戶。"},{"id":40,"word":"acre","pos":"n","meaning":"n. 英畝","example":"The farmer owns forty acres of land where he grows corn and wheat.","example_zh":"這位農夫擁有四十英畝的土地，在那裡種植玉米和小麥。"},{"id":41,"word":"act","pos":"v","meaning":"v. 行動","example":"We must act immediately to stop the problem from getting worse.","example_zh":"我們必須立即行動，以防止問題惡化。"},{"id":42,"word":"action","pos":"n","meaning":"n. 行動","example":"The fire department took quick action to put out the fire.","example_zh":"消防部門採取了迅速的行動來撲滅火災。"},{"id":43,"word":"active","pos":"adj","meaning":"adj. 活躍的，積極的","example":"My grandfather is very active and goes for a walk every morning.","example_zh":"我祖父非常活躍，每天早上都會去散步。"},{"id":44,"word":"actively","pos":"adv","meaning":"adv. 投入地，積極地","example":"The students were actively involved in the discussion about environmental issues.","example_zh":"學生們積極地投入關於環境議題的討論。"},{"id":45,"word":"activity","pos":"n","meaning":"n. 活動","example":"Playing basketball is my favorite outdoor activity during the summer.","example_zh":"打籃球是我夏天最喜歡的戶外活動。"},{"id":46,"word":"actual","pos":"adj","meaning":"adj. 真實的","example":"The actual cost of the trip was much higher than we had expected.","example_zh":"這次旅行的真實花費比我們預期的要高得多。"},{"id":47,"word":"acute","pos":"adj","meaning":"adj. 劇烈的","example":"The patient suffered from acute pain in his chest and was rushed to the hospital.","example_zh":"病人胸部劇烈疼痛，被緊急送往醫院。"},{"id":48,"word":"acutely","pos":"adv","meaning":"adv. 劇烈地；敏銳地","example":"People are acutely aware of the importance of protecting the environment.","example_zh":"人們敏銳地意識到保護環境的重要性。"},{"id":49,"word":"acuteness","pos":"n","meaning":"n. 劇烈","example":"The acuteness of the situation forced the government to take urgent measures.","example_zh":"局勢的劇烈程度迫使政府採取緊急措施。"},{"id":50,"word":"ad","pos":"n","meaning":"n. 廣告(=advertisement)","example":"I saw an ad for a new smartphone in the newspaper today.","example_zh":"我今天在報紙上看到了一個新智慧型手機的廣告。"},{"id":51,"word":"adapt","pos":"v","meaning":"v. 適應，改編(+to)","example":"It takes time for international students to adapt to a new culture.","example_zh":"留學生需要時間來適應新文化。"},{"id":52,"word":"adaptation","pos":"n","meaning":"n. 適應，改編","example":"The movie is a clever adaptation of a famous novel by Charles Dickens.","example_zh":"這部電影是對查爾斯·狄更斯著名小說的巧妙改編。"},{"id":53,"word":"add","pos":"v","meaning":"v. 添加(+A+to+B)","example":"Please add some sugar to my coffee because it is too bitter.","example_zh":"請在我的咖啡裡添加一些糖，因為它太苦了。"},{"id":54,"word":"addition","pos":"n","meaning":"n. 添加","example":"The addition of a new library will benefit all the students in the school.","example_zh":"新圖書館的添加將使全校學生受益。"},{"id":55,"word":"additional","pos":"adj","meaning":"adj. 附加的，額外的","example":"You can get additional information about the course on the school website.","example_zh":"你可以在學校網站上獲得關於這門課程的額外資訊。"},{"id":56,"word":"adequate","pos":"adj","meaning":"adj. 足夠的","example":"We need to make sure that the food supply is adequate for everyone.","example_zh":"我們需要確保食物供應對每個人來說都是足夠的。"},{"id":57,"word":"adjective","pos":"n","meaning":"n. 形容詞","example":"\"Beautiful\" is an adjective that is often used to describe scenery.","example_zh":"「美麗的」是一個經常用來描述風景的形容詞。"},{"id":58,"word":"adjust","pos":"v","meaning":"v. 調整，適應","example":"You can adjust the height of the chair to make yourself more comfortable.","example_zh":"你可以調整椅子的高度，讓自己更舒服。"},{"id":59,"word":"adjustment","pos":"n","meaning":"n. 調整，適應","example":"Moving to a new country requires a lot of emotional adjustment.","example_zh":"搬到一個新國家需要很多情感上的適應。"},{"id":60,"word":"admirable","pos":"adj","meaning":"adj. 令人欽佩的","example":"Her courage in facing the illness is truly admirable.","example_zh":"她面對疾病的勇氣真的很令人欽佩。"},{"id":61,"word":"admiration","pos":"n","meaning":"n. 讚賞，欽佩","example":"I have great admiration for my teacher's dedication to her students.","example_zh":"我非常讚賞老師對學生的奉獻。"},{"id":62,"word":"admire","pos":"v","meaning":"v. 欣賞 欽佩","example":"Many young musicians admire him for his incredible talent and hard work.","example_zh":"許多年輕音樂家因他驚人的才華和努力而欽佩他。"},{"id":63,"word":"admission","pos":"n","meaning":"n. 承認，准許進入","example":"The museum offers free admission to students on the first Sunday of every month.","example_zh":"博物館在每個月的第一個週日提供學生免費入場。"},{"id":64,"word":"admit","pos":"v","meaning":"v. 承認；允許進入","example":"You must admit that you were wrong to lie to your parents.","example_zh":"你必須承認你對父母撒謊是不對的。"},{"id":65,"word":"adopt","pos":"v","meaning":"v. 採取，領養","example":"The couple decided to adopt a child from the local orphanage.","example_zh":"這對夫婦決定從當地的孤兒院領養一個孩子。"},{"id":66,"word":"adopted","pos":"adj","meaning":"adj. 領養的（兒女）","example":"She has a very close relationship with her adopted daughter.","example_zh":"她和她的領養女兒關係非常親密。"},{"id":67,"word":"adoption","pos":"n","meaning":"n. 採用，領養","example":"The adoption of new technology has significantly improved our efficiency.","example_zh":"新技術的採用顯著提高了我們的效率。"},{"id":68,"word":"adoptive","pos":"adj","meaning":"adj. 有領養關係的（父母）","example":"The child was very happy to be with his adoptive parents in their new home.","example_zh":"這個孩子很高興和他的領養父母一起在新家。"},{"id":69,"word":"advanced","pos":"adj","meaning":"adj. 高級的","example":"This advanced course is designed for students who already have a basic knowledge.","example_zh":"這門高級課程是為已經具備基礎知識的學生設計的。"},{"id":70,"word":"advantage","pos":"n","meaning":"n. 好處，優點，優勢","example":"One major advantage of living in a city is the convenient public transport.","example_zh":"住在大城市的一個主要優點是便利的大眾運輸。"},{"id":71,"word":"adventure","pos":"n","meaning":"n. 冒險（活動）","example":"Traveling alone in a foreign country was a great adventure for me.","example_zh":"獨自在國外旅行對我來說是一次偉大的冒險。"},{"id":72,"word":"adventurer","pos":"n","meaning":"n. 冒險家","example":"The famous adventurer shared his stories of exploring the Amazon rainforest.","example_zh":"這位著名的冒險家分享了他探索亞馬遜雨林的故事。"},{"id":73,"word":"adventurous","pos":"adj","meaning":"adj. 喜歡冒險的，大膽的","example":"My adventurous sister wants to go skydiving for her twentieth birthday.","example_zh":"我那喜歡冒險的姊姊想在二十歲生日時去跳傘。"},{"id":74,"word":"adverb","pos":"n","meaning":"n. 副詞","example":"An adverb is used to modify a verb, an adjective, or another adverb.","example_zh":"副詞是用來修飾動詞、形容詞或另一個副詞。"},{"id":75,"word":"advertise","pos":"v","meaning":"v. 打廣告","example":"The company plans to advertise its new products on social media platforms.","example_zh":"該公司計劃在社群媒體平台上為其新產品打廣告。"},{"id":76,"word":"advertisement","pos":"n","meaning":"n. 廣告","example":"I saw an advertisement for a part-time job on the school bulletin board.","example_zh":"我在學校佈告欄上看到了一個兼職工作的廣告。"},{"id":77,"word":"advice","pos":"n","meaning":"n. 建議，忠告","example":"My father always gives me good advice when I have problems at school.","example_zh":"當我在學校遇到問題時，父親總是給我很好的建議。"},{"id":78,"word":"advise","pos":"v","meaning":"v. 建議，提出忠告","example":"The doctor strongly advised him to quit smoking for the sake of his health.","example_zh":"醫生為了他的健康強力建議他戒菸。"},{"id":79,"word":"adviser","pos":"n","meaning":"n. 顧問","example":"He works as a financial adviser, helping people manage their money.","example_zh":"他擔任理財顧問，幫助人們管理金錢。"},{"id":80,"word":"advisor","pos":"n","meaning":"n. 指導老師；顧問","example":"I need to talk to my academic advisor about which courses to take next semester.","example_zh":"我需要和我的指導老師談談下學期要修哪些課程。"},{"id":81,"word":"affect","pos":"v","meaning":"v. 影響，打動","example":"The cold weather can affect the growth of the crops in the fields.","example_zh":"寒冷的天氣會影響田裡作物的生長。"},{"id":82,"word":"affection","pos":"n","meaning":"n. 愛慕，關愛","example":"The grandmother looked at her grandson with great affection and pride.","example_zh":"祖母帶著極大的愛慕與自豪看著她的孫子。"},{"id":83,"word":"affectionate","pos":"adj","meaning":"adj. 充滿愛的，表示關愛的","example":"He gave his wife an affectionate kiss before leaving for work.","example_zh":"他在出門上班前給了妻子一個充滿愛的吻。"},{"id":84,"word":"afford","pos":"v","meaning":"v. 負擔得起","example":"We cannot afford to buy a new car this year because of our budget.","example_zh":"因為預算關係，我們今年負擔不起買新車。"},{"id":85,"word":"after all","pos":"phr","meaning":"phr. 畢竟","example":"Don't be too hard on him; after all, he is only a child.","example_zh":"不要對他太嚴苛；畢竟，他只是個孩子。"},{"id":86,"word":"afterward","pos":"adv","meaning":"adv. 後來","example":"We went to a movie and went to dinner afterward at a nice restaurant.","example_zh":"我們去看電影，後來去了一家不錯的餐廳吃晚餐。"},{"id":87,"word":"afterwards","pos":"adv","meaning":"adv. 後來","example":"I finished my homework and played video games shortly afterwards.","example_zh":"我做完功課，不久後來就玩了電子遊戲。"},{"id":88,"word":"agency","pos":"n","meaning":"n. 經銷，代理機構","example":"You should contact a travel agency to help you plan your vacation.","example_zh":"你應該聯絡旅行代理機構來幫助你規劃假期。"},{"id":89,"word":"agent","pos":"n","meaning":"n. 特務，間諜；代理人，代理商","example":"The real estate agent showed us several houses that were for sale.","example_zh":"房地產代理人帶我們看了幾間待售的房子。"},{"id":90,"word":"aggressive","pos":"adj","meaning":"adj. 好鬥的，具侵略性的","example":"Some stray dogs can become aggressive if they feel threatened by people.","example_zh":"如果感覺受到人的威脅，有些流浪狗會變得具侵略性。"},{"id":91,"word":"aggressiveness","pos":"n","meaning":"n. 好鬥，侵略性","example":"His aggressiveness on the basketball court sometimes leads to fouls.","example_zh":"他在籃球場上的好鬥有時會導致犯規。"},{"id":92,"word":"agreeable","pos":"adj","meaning":"adj. 令人愉快的；宜人的","example":"We spent an agreeable afternoon walking through the botanical gardens.","example_zh":"我們在植物園裡度過了一個令人愉快的下午。"},{"id":93,"word":"agricultural","pos":"adj","meaning":"adj. 農業的","example":"The government provides financial support for various agricultural projects.","example_zh":"政府為各種農業計畫提供財務支持。"},{"id":94,"word":"agriculture","pos":"n","meaning":"n. 農業","example":"Most of the people in this village depend on agriculture for their living.","example_zh":"這個村莊的大多數人依靠農業維生。"},{"id":95,"word":"aid","pos":"v/n","meaning":"v/n. 幫助，援助","example":"The charity organization provides aid to people affected by the earthquake.","example_zh":"該慈善組織為受地震影響的人們提供援助。"},{"id":96,"word":"AIDS","pos":"n","meaning":"n. 愛滋病","example":"Scientists are still searching for a cure for AIDS to save millions of lives.","example_zh":"科學家仍在尋找愛滋病的療法以挽救數百萬人的生命。"},{"id":97,"word":"air conditioner","pos":"n","meaning":"n. 冷氣機","example":"It was so hot outside that we turned on the air conditioner immediately.","example_zh":"室外太熱了，我們立刻打開了冷氣機。"},{"id":98,"word":"aisle","pos":"n","meaning":"n. 通道，走道","example":"The flight attendant asked the passengers to keep the aisle clear.","example_zh":"空服員要求乘客保持走道暢通。"},{"id":99,"word":"alcohol","pos":"n","meaning":"n. 酒精","example":"Driving after drinking alcohol is extremely dangerous and illegal.","example_zh":"飲酒後開車是非常危險且違法的。"},{"id":100,"word":"alcoholic","pos":"adj","meaning":"adj. 含酒精的 (n) 酗酒者","example":"The restaurant offers both alcoholic and non-alcoholic beverages on its menu.","example_zh":"這家餐廳的菜單上同時提供含酒精與不含酒精的飲料。"},{"id":101,"word":"alert","pos":"adj","meaning":"adj. 警覺的 (v) 提醒注意 (n) 警覺","example":"Drivers must stay alert at all times to avoid accidents on the highway.","example_zh":"駕駛者必須隨時保持警覺，以避免在高速公路上發生事故。"},{"id":102,"word":"alike","pos":"adj/adv","meaning":"adj/adv. 相似的，類似的","example":"The two brothers look very much alike, but their personalities are quite different.","example_zh":"這兩兄弟長得很像，但他們的個性卻截然不同。"},{"id":103,"word":"all in all","pos":"phr","meaning":"phr. 從各方面來看，總的來說","example":"All in all, it was a successful event despite the small problems at the beginning.","example_zh":"從各方面來看，儘管剛開始有些小問題，這仍是一次成功的活動。"},{"id":104,"word":"all the time","pos":"phr","meaning":"phr. 一直，始終；經常","example":"He practices the piano all the time because he wants to win the competition.","example_zh":"他一直練習鋼琴，因為他想贏得比賽。"},{"id":105,"word":"alley","pos":"n","meaning":"n. 小巷；弄","example":"The little boy followed the kitten into a narrow alley behind the shop.","example_zh":"那個小男孩跟著小貓走進了商店後方的一條窄巷。"},{"id":106,"word":"allowance","pos":"n","meaning":"n. 零用錢；津貼","example":"My parents give me a weekly allowance of five hundred dollars for my lunch.","example_zh":"我父母每週給我五百元的零用錢當作午餐費。"},{"id":107,"word":"along with","pos":"phr","meaning":"phr. 與～一起","example":"Please bring your textbooks along with your notebooks to the next class.","example_zh":"下堂課請把課本和筆記本一起帶過來。"},{"id":108,"word":"alter","pos":"v","meaning":"v. 改變","example":"The tailor had to alter the dress because it was too long for the bride.","example_zh":"裁縫師不得不修改這件禮服，因為它對新娘來說太長了。"},{"id":109,"word":"alternative","pos":"adj","meaning":"adj. 另類的，選擇的 (n) 替代方案","example":"If the flight is canceled, the alternative is to take the high-speed rail.","example_zh":"如果班機被取消，替代方案就是搭乘高鐵。"},{"id":110,"word":"aluminum","pos":"n","meaning":"n. 鋁","example":"Soda cans are usually made of aluminum because it is lightweight and recyclable.","example_zh":"汽水罐通常由鋁製成，因為它輕巧且可回收。"},{"id":111,"word":"amateur","pos":"n","meaning":"n. 業餘者 (adj) 業餘的","example":"Although he is an amateur photographer, his pictures look very professional.","example_zh":"雖然他是一位業餘攝影師，他的照片看起來卻非常專業。"},{"id":112,"word":"amaze","pos":"v","meaning":"v. 使人吃驚","example":"The magician's incredible tricks never fail to amaze the audience.","example_zh":"魔術師驚人的把戲總是能讓人吃驚。"},{"id":113,"word":"ambassador","pos":"n","meaning":"n. 大使","example":"The Taiwanese ambassador met with local officials to discuss trade agreements.","example_zh":"台灣大使與當地官員會面，討論貿易協定。"},{"id":114,"word":"ambition","pos":"n","meaning":"n. 野心，抱負，志向","example":"His greatest ambition is to become a doctor and help people in poor areas.","example_zh":"他最大的志向是成為一名醫生，幫助貧困地區的人。"},{"id":115,"word":"ambitious","pos":"adj","meaning":"adj. 野心勃勃的，有雄心大志的","example":"She is an ambitious young woman who plans to start her own company soon.","example_zh":"她是個野心勃勃的年輕女性，計劃很快要創立自己的公司。"},{"id":116,"word":"ambulance","pos":"n","meaning":"n. 救護車","example":"The ambulance arrived at the scene of the accident within five minutes.","example_zh":"救護車在五分鐘內抵達了事故現場。"},{"id":117,"word":"amidst","pos":"prep","meaning":"prep. 在～之中","example":"The small cottage sat peacefully amidst the beautiful green mountains.","example_zh":"那座小農舍安靜地坐落在美麗的青山之中。"},{"id":118,"word":"amuse","pos":"v","meaning":"v. 使開心，使歡樂","example":"The clown performed many funny tricks to amuse the children at the party.","example_zh":"小丑表演了許多有趣的把戲，讓派對上的孩子們開心。"},{"id":119,"word":"amused","pos":"adj","meaning":"adj. （人）快樂的，開心的","example":"We were all amused by his funny stories about his trip to Paris.","example_zh":"我們都被他去巴黎旅行的趣事逗得很開心。"},{"id":120,"word":"amusement","pos":"n","meaning":"n. 樂趣，娛樂活動","example":"The theme park provides various forms of amusement for people of all ages.","example_zh":"這座主題樂園為各年齡層的人提供各種形式的娛樂活動。"},{"id":121,"word":"amusing","pos":"adj","meaning":"adj. 有趣的","example":"I found his jokes quite amusing, and I couldn't stop laughing.","example_zh":"我覺得他的笑話挺有趣的，讓我忍不住一直笑。"},{"id":122,"word":"analysis","pos":"n","meaning":"n. 分析","example":"The financial analysis shows that the company's profits have increased this year.","example_zh":"財務分析顯示，該公司今年的利潤有所增加。"},{"id":123,"word":"analyze","pos":"v","meaning":"v. 分析","example":"Scientists need to analyze the water samples to see if they are polluted.","example_zh":"科學家需要分析水樣，看看它們是否受到污染。"},{"id":124,"word":"ancestor","pos":"n","meaning":"n. 祖先","example":"Many people visit their hometowns to honor their ancestors during the festival.","example_zh":"許多人在節日期間回到家鄉祭拜祖先。"},{"id":125,"word":"ancient","pos":"adj","meaning":"adj. 古老的","example":"Greece is famous for its ancient temples and rich historical heritage.","example_zh":"希臘以其古老的寺廟和豐富的歷史遺產聞名。"},{"id":126,"word":"angel","pos":"n","meaning":"n. 天使","example":"The little girl looked like a little angel in her white dress.","example_zh":"那個小女孩穿著白裙子，看起來像個小天使。"},{"id":127,"word":"angle","pos":"n","meaning":"n. 角；角度；觀點","example":"You need to view the problem from a different angle to find a solution.","example_zh":"你需要從不同的角度看待問題，以找到解決方案。"},{"id":128,"word":"anniversary","pos":"n","meaning":"n. 週年紀念日","example":"My parents are going to a fancy restaurant to celebrate their wedding anniversary.","example_zh":"我父母要去一家高級餐廳慶祝他們的結婚週年紀念日。"},{"id":129,"word":"announce","pos":"v","meaning":"v. 宣布","example":"The principal will announce the winner of the speech contest tomorrow morning.","example_zh":"校長將於明天早上宣布演講比賽的獲勝者。"},{"id":130,"word":"announcement","pos":"n","meaning":"n. 宣布","example":"The government made an important announcement regarding the new tax law.","example_zh":"政府就新稅法發布了一項重要宣布。"},{"id":131,"word":"annoy","pos":"v","meaning":"v. 惹惱，使生氣","example":"The constant noise from the construction site began to annoy the neighbors.","example_zh":"建築工地不斷傳出的噪音開始惹惱鄰居。"},{"id":132,"word":"annoyed","pos":"adj","meaning":"adj. （人）感到氣惱的","example":"He felt annoyed when his sister kept interrupting him while he was studying.","example_zh":"當他妹妹在他讀書時不斷打斷他時，他感到很氣惱。"},{"id":133,"word":"annoying","pos":"adj","meaning":"adj. 令人氣惱的","example":"It is very annoying when the internet connection is slow during a video call.","example_zh":"視訊通話時網路連接很慢是非常令人氣惱的。"},{"id":134,"word":"annual","pos":"adj","meaning":"adj. 一年一度的","example":"The school's annual sports day is usually held in the middle of October.","example_zh":"學校一年一度的運動會通常在十月中旬舉行。"},{"id":135,"word":"annually","pos":"adv","meaning":"adv. 一年一度地","example":"This music festival is held annually in the capital city every summer.","example_zh":"這場音樂節每年夏天都會在首都舉行。"},{"id":136,"word":"anticipate","pos":"v","meaning":"v. 預期；期望","example":"We anticipate that the project will be finished by the end of this month.","example_zh":"我們預期這項計畫將在月底前完成。"},{"id":137,"word":"anticipation","pos":"n","meaning":"n. 期待，預料","example":"There is a sense of anticipation in the air as the concert is about to start.","example_zh":"音樂會即將開始，空氣中瀰漫著一種期待感。"}]},
{"unit":2,"unit_label":"p.3-4","words":[{"id":138,"word":"anxiety","pos":"n","meaning":"n. 焦慮；不安","example":"Waiting for the exam results caused her a great deal of anxiety.","example_zh":"等待考試結果讓她感到非常焦慮。"},{"id":139,"word":"anxious","pos":"adj","meaning":"adj. 焦慮的；迫切渴望的","example":"He was anxious about the interview and couldn't sleep well the night before.","example_zh":"他對面試感到焦慮，前一天晚上睡不好。"},{"id":140,"word":"apart","pos":"adv","meaning":"adv. 相距 (adj)（思想上）獨特的；迥異的","example":"The two cities are about fifty kilometers apart from each other.","example_zh":"這兩座城市彼此相距約五十公里。"},{"id":141,"word":"apologize","pos":"v","meaning":"v. 道歉","example":"I want to apologize for being late to the meeting this morning.","example_zh":"我想為今天早上開會遲到道歉。"},{"id":142,"word":"apology","pos":"n","meaning":"n. 道歉","example":"Please accept my sincere apology for the mistake I made yesterday.","example_zh":"對於我昨天犯的錯誤，請接受我誠摯的道歉。"},{"id":143,"word":"apparent","pos":"adj","meaning":"adj. 顯而易見的","example":"It was apparent to everyone that he was not telling the whole truth.","example_zh":"每個人都顯而易見地看出他沒有說出全部實情。"},{"id":144,"word":"apparently","pos":"adv","meaning":"adv. 明顯地；顯然地","example":"Apparently, the event was canceled due to the heavy rain and strong wind.","example_zh":"顯然地，活動因為大雨和強風而取消了。"},{"id":145,"word":"appeal","pos":"v","meaning":"v. 吸引，懇求(n) 吸引力","example":"The idea of traveling around the world has always appealed to me.","example_zh":"環遊世界的想法一直很吸引我。"},{"id":146,"word":"appealing","pos":"adj","meaning":"adj. 有吸引力的，令人感興趣的","example":"The bright colors of the painting make it very appealing to children.","example_zh":"這幅畫鮮豔的色彩使其對孩子們非常有吸引力。"},{"id":147,"word":"appetite","pos":"n","meaning":"n. 食慾","example":"After a long day of hiking, we all had a huge appetite for dinner.","example_zh":"經過一整天的健行後，我們晚餐的食慾都非常好。"},{"id":148,"word":"applaud","pos":"v","meaning":"v. 鼓掌，讚賞","example":"The audience began to applaud loudly after the pianist finished his performance.","example_zh":"鋼琴家結束表演後，觀眾開始大聲鼓掌。"},{"id":149,"word":"applause","pos":"n","meaning":"n. 鼓掌，喝采","example":"The actor received a long round of applause for his outstanding performance.","example_zh":"這位演員因其出色的表演獲得了長久的喝采。"},{"id":150,"word":"appliance","pos":"n","meaning":"n. 家電","example":"A refrigerator is an essential home appliance in every modern kitchen.","example_zh":"冰箱是每個現代廚房中必不可少的家電。"},{"id":151,"word":"applicant","pos":"n","meaning":"n. 申請人","example":"Each applicant for the job must submit a resume and a cover letter.","example_zh":"每個工作申請人都必須提交履歷和求職信。"},{"id":152,"word":"application","pos":"n","meaning":"n. 申請，應用程式","example":"Your application for the scholarship will be reviewed by the committee.","example_zh":"你的獎學金申請將由委員會進行審查。"},{"id":153,"word":"apply","pos":"v","meaning":"v. 申請，應用","example":"You can apply for a passport at the Ministry of Foreign Affairs.","example_zh":"你可以在外交部申請護照。"},{"id":154,"word":"appoint","pos":"v","meaning":"v. 指定；任命；約定","example":"The board of directors decided to appoint her as the new CEO.","example_zh":"董事會決定任命她為新任執行長。"},{"id":155,"word":"appointment","pos":"n","meaning":"n. 指派；任命；約定","example":"I have an appointment with the dentist at three o'clock this afternoon.","example_zh":"我今天下午三點和牙醫有個預約。"},{"id":156,"word":"appreciate","pos":"v","meaning":"v. 理解，感激","example":"I really appreciate all the help you have given me during my hard times.","example_zh":"我真的很感激你在我困難時期給予的所有幫助。"},{"id":157,"word":"appreciation","pos":"n","meaning":"n. 理解，感激","example":"The teacher showed her appreciation for the students' hard work.","example_zh":"老師對學生的努力表示了感激。"},{"id":158,"word":"approach","pos":"v","meaning":"v. 接近 (n) 方法","example":"We need to find a new approach to solve this difficult math problem.","example_zh":"我們需要找到一個新方法來解決這個難度較高的數學題。"},{"id":159,"word":"appropriate","pos":"adj","meaning":"adj. 適當的，合適的","example":"It is important to wear appropriate clothes for a job interview.","example_zh":"參加工作面試時穿著適當的衣服是很重要的。"},{"id":160,"word":"appropriately","pos":"adv","meaning":"adv. 合適地，適當地","example":"The students behaved appropriately during the visit to the museum.","example_zh":"學生們在參觀博物館期間表現得很合適。"},{"id":161,"word":"approval","pos":"n","meaning":"n. 許可；同意","example":"You need to get your parents' approval before you go on the school trip.","example_zh":"在參加學校旅行之前，你需要獲得父母的許可。"},{"id":162,"word":"approve","pos":"v","meaning":"v. 贊成；同意","example":"My parents don't approve of me staying out late with my friends.","example_zh":"我父母不贊成我和朋友在外面待到很晚。"},{"id":163,"word":"aquarium","pos":"n","meaning":"n. 水族館；水族箱","example":"We saw many beautiful fish and sharks when we visited the aquarium.","example_zh":"我們參觀水族館時看到了許多美麗的魚和鯊魚。"},{"id":164,"word":"arch","pos":"n","meaning":"n. 拱門 (v) 拱起","example":"The beautiful stone arch leads to the entrance of the historical garden.","example_zh":"美麗的石造拱門通往這座歷史花園的入口。"},{"id":165,"word":"architect","pos":"n","meaning":"n. 建築師","example":"The architect spent months designing the modern office building.","example_zh":"建築師花了幾個月的時間設計這棟現代辦公大樓。"},{"id":166,"word":"architectural","pos":"adj","meaning":"adj. 建築的","example":"The city is famous for its architectural beauty and historic landmarks.","example_zh":"這座城市以其建築美學和歷史地標聞名。"},{"id":167,"word":"architecture","pos":"n","meaning":"n. 建築學","example":"My sister is studying architecture because she loves designing buildings.","example_zh":"我姊姊正在攻讀建築學，因為她熱愛設計建築。"},{"id":168,"word":"argue","pos":"v","meaning":"v. 爭辯，爭執","example":"Please don't argue with your brother about such a small matter.","example_zh":"請不要為了這麼小的事情跟你兄弟爭辯。"},{"id":169,"word":"argument","pos":"n","meaning":"n. 論點，理由，爭辯，爭論","example":"They had a heated argument about where to go for their summer vacation.","example_zh":"他們為了暑假要去哪裡而發生了激烈的爭論。"},{"id":170,"word":"arise","pos":"v","meaning":"v. 發生，出現；由～引起","example":"Many problems arise when people fail to communicate effectively with each other.","example_zh":"當人們無法有效溝通時，就會出現許多問題。"},{"id":171,"word":"arithmetic","pos":"n","meaning":"n. 算術 ( ired to assemble in the school hall for the meeting.","example_zh":"所有學生都必須在學校禮堂集合開會。"},{"id":194,"word":"assembly","pos":"n","meaning":"n. 集會","example":"The morning assembly is a time for the principal to make announcements.","example_zh":"晨間集會是校長宣布事情的時間。"},{"id":195,"word":"assess","pos":"vt","meaning":"vt. 評價，評估","example":"The teacher will assess the students' performance based on their final projects.","example_zh":"老師將根據學生的期末專題來評估他們的表現。"},{"id":196,"word":"assessment","pos":"n","meaning":"n. 估價，評價","example":"The continuous assessment helps teachers understand their students' progress.","example_zh":"持續性的評量有助於老師了解學生的進步情況。"},{"id":197,"word":"assign","pos":"v","meaning":"v. 派遣","example":"The manager decided to assign a new task to each member of the team.","example_zh":"經理決定派遣一項新任務給團隊的每位成員。"},{"id":198,"word":"assignment","pos":"n","meaning":"n. 作業，任務；指派","example":"Please make sure you hand in your history assignment by Friday afternoon.","example_zh":"請確保你在週五下午前繳交歷史作業。"},{"id":199,"word":"assist","pos":"v","meaning":"v. 幫助","example":"The young man offered to assist the elderly woman with her heavy bags.","example_zh":"那位年輕人主動提出幫助那位老太太提沉重的袋子。"},{"id":200,"word":"assistance","pos":"n","meaning":"n. 協助","example":"If you need any assistance with your luggage, please let the hotel staff know.","example_zh":"如果你需要行李方面的協助，請告知飯店工作人員。"},{"id":201,"word":"assistant","pos":"n","meaning":"n. 助理","example":"The shop assistant helped me find the right size for the jacket I wanted to buy.","example_zh":"店員助理幫我找到了我想買的外套尺寸。"},{"id":202,"word":"associate","pos":"v","meaning":"v. 聯想，結交","example":"Most people associate the color red with danger or strong emotions like love.","example_zh":"大多數人會將紅色與危險或像愛這樣的強烈情感聯想在一起。"},{"id":203,"word":"association","pos":"n","meaning":"n. 聯想，關聯；協會，團體","example":"He is a member of the local historical association, which protects old buildings.","example_zh":"他是當地歷史協會的成員，該團體致力於保護古老建築。"},{"id":204,"word":"assume","pos":"v","meaning":"v. 假定；認為； e_zh":"軍隊在夜間對敵軍基地發動了突然攻擊。"},{"id":226,"word":"attempt","pos":"v","meaning":"v. 嘗試；企圖","example":"She decided to attempt the difficult climb despite the bad weather conditions.","example_zh":"儘管天氣條件惡劣，她仍決定嘗試那次艱難的攀爬。"},{"id":227,"word":"attempted","pos":"adj","meaning":"adj. 企圖的；未遂的","example":"The suspect was arrested for an attempted robbery at the local bank.","example_zh":"嫌犯因企圖搶劫當地銀行未遂而被捕。"},{"id":228,"word":"attend","pos":"v","meaning":"v. 出席，參加","example":"All students are expected to attend the graduation ceremony next Friday.","example_zh":"所有學生都被要求出席下週五的畢業典禮。"},{"id":229,"word":"attention","pos":"n","meaning":"n. 注意","example":"You should pay close attention to what the teacher is saying in class.","example_zh":"你應該密切注意老師在課堂上所說的話。"},{"id":230,"word":"attitude","pos":"n","meaning":"n. 態度","example":"A positive attitude toward challenges can help you achieve success.","example_zh":"對挑戰抱持積極的態度能幫助你獲得成功。"},{"id":231,"word":"attract","pos":"v","meaning":"v. 吸引","example":"The beautiful flowers in the garden attract many colorful butterflies.","example_zh":"花園裡美麗的花朵吸引了許多色彩繽紛的蝴蝶。"},{"id":232,"word":"attraction","pos":"n","meaning":"n. 吸引（力）；吸引人的事物","example":"The Eiffel Tower is one of the most famous tourist attractions in Paris.","example_zh":"艾菲爾鐵塔是巴黎最著名的旅遊景點之一。"},{"id":233,"word":"attractive","pos":"adj","meaning":"adj. 動人的；有吸引力的","example":"The company is offering a higher salary to make the job more attractive.","example_zh":"公司提供更高的薪水以使這份工作更有吸引力。"},{"id":234,"word":"audience","pos":"n","meaning":"n. 觀眾；聽眾","example":"The audience stood up and cheered at the end of the amazing performance.","example_zh":"精采的表演結束時，觀眾起立歡呼。"},{"id":235,"word":"audio","pos":"adj","meaning":"adj. 聲音的","example":"The movie had great visual effects, but the audio quality was quite poor.","example_zh":"這部電影有很棒的視覺效果，但聲音品質相當差。"},{"id":236,"word":"author","pos":"n","meaning":"n. 作者","example":"J.K. Rowling is the famous author who wrote the Harry Potter series.","example_zh":"J.K. 羅琳是寫出《哈利波特》系列的著名作者。"},{"id":237,"word":"authorities","pos":"n","meaning":"n pl. 官方，當局","example":"The health authorities are working hard to control the spread of the virus.","example_zh":"衛生當局正努力控制病毒的傳播。"},{"id":238,"word":"authority","pos":"n","meaning":"n. 權威，權勢；官方，專家","example":"He is considered a leading authority on the history of ancient Rome.","example_zh":"他被認為是古羅馬歷史方面的頂尖權威。"},{"id":239,"word":"auto","pos":"n","meaning":"n. 車子","example":"The auto industry has been focusing on developing electric vehicles recently.","example_zh":"汽車產業最近一直專注於開發電動車。"},{"id":240,"word":"autobiography","pos":"n","meaning":"n. 自傳","example":"In his autobiography, the singer talks about his difficult childhood.","example_zh":"在他的自傳中，這位歌手談到了他艱辛的童年。"},{"id":241,"word":"automatic","pos":"adj","meaning":"adj. 自動化的，不自覺的","example":"The glass doors open with an automatic sensor when you walk toward them.","example_zh":"當你走向玻璃門時，它們會透過自動感應器開啟。"},{"id":242,"word":"automatically","pos":"adv","meaning":"adv. 自動地，不假思索地","example":"When I see a red light, I automatically step on the brakes of my car.","example_zh":"當我看到紅燈時，我會不假思索地踩下車子的煞車。"},{"id":243,"word":"automobile","pos":"n","meaning":"n. 車子","example":"Henry Ford played a key role in the development of the modern automobile.","example_zh":"亨利·福特在現代汽車的發展中扮演了關鍵角色。"},{"id":244,"word":"available","pos":"adj","meaning":"adj. 可獲得的；有時間的","example":"The manager is not available right now, but he can call you back later.","example_zh":"經理現在沒時間，但他稍後可以回電給你。"},{"id":245,"word":"avenue","pos":"n","meaning":"n. （林蔭）大道","example":"Fifth Avenue in New York is famous for its expensive shops and tall buildings.","example_zh":"紐約的第五大道以其昂貴的商店和高樓大廈聞名。"},{"id":246,"word":"average","pos":"adj","meaning":"adj. 平均的，普通的 (n) 平均值","example":"The average temperature in this city during the summer is about thirty degrees.","example_zh":"這座城市夏天的平均氣溫大約是三十度。"},{"id":247,"word":"avoid","pos":"v","meaning":"v. 避免，迴避","example":"You should avoid eating too many snacks if you want to lose weight.","example_zh":"如果你想減肥，你應該避免吃太多零食。"},{"id":248,"word":"await","pos":"v","meaning":"v. 等待","example":"The excited children were standing at the gate to await their father's return.","example_zh":"興奮的孩子們站在門口等待父親歸來。"},{"id":249,"word":"awake","pos":"adj","meaning":"adj. 清醒的 (v) 醒來","example":"I was still wide awake at midnight because I drank too much coffee.","example_zh":"因為喝了太多咖啡，我半夜還完全清醒著。"},{"id":250,"word":"awaken","pos":"v","meaning":"v. 喚醒","example":"The smell of fresh coffee managed to awaken him from his deep sleep.","example_zh":"新鮮咖啡的香味成功地將他從沉睡中喚醒。"},{"id":251,"word":"award","pos":"v/n","meaning":"v/n. 頒獎，獎品","example":"The actress was proud to receive the award for Best Supporting Actress.","example_zh":"這位女演員為獲得最佳女配角獎感到自豪。"},{"id":252,"word":"aware","pos":"adj","meaning":"adj. 意識到的","example":"Most people are aware of the dangers of driving under the influence of alcohol.","example_zh":"大多數人都意識到酒後駕車的危險。"},{"id":253,"word":"awareness","pos":"n","meaning":"n. 意識，察覺","example":"The campaign aims to raise public awareness about environmental protection.","example_zh":"這項活動旨在提高大眾對環境保護的意識。"},{"id":254,"word":"awful","pos":"adj","meaning":"adj. 糟糕的","example":"I had an awful headache yesterday and couldn't go to school.","example_zh":"我昨天頭痛得很糟糕，沒辦法去上學。"},{"id":255,"word":"awkward","pos":"adj","meaning":"adj. 笨拙的；尷尬的；棘手的","example":"There was an awkward silence after he made that inappropriate joke.","example_zh":"在他開了那個不當的笑話後，現場陷入了一種尷尬的沉默。"},{"id":256,"word":"ax(e)","pos":"n","meaning":"n. 斧頭","example":"The woodcutter used a sharp axe to chop down the old tree in the forest.","example_zh":"伐木工用一把鋒利的斧頭砍倒了森林裡的古樹。"},{"id":257,"word":"background","pos":"n","meaning":"n. 背景；經歷","example":"Her musical background helped her a lot when she started learning the piano.","example_zh":"她的音樂背景在她開始學鋼琴時給了她很大幫助。"},{"id":258,"word":"backpack","pos":"n","meaning":"n. 背包 (v) 自助旅行","example":"It is more convenient to travel with a backpack than a heavy suitcase.","example_zh":"帶著背包旅行比提著沉重的行李箱更方便。"},{"id":259,"word":"backpacker","pos":"n","meaning":"n. 背包客","example":"As a backpacker, he prefers staying in hostels to save money on his trip.","example_zh":"作為一名背包客，他偏好住在青年旅館以節省旅費。"},{"id":260,"word":"bacon","pos":"n","meaning":"n. 培根","example":"I usually have eggs and crispy bacon for breakfast on Sunday mornings.","example_zh":"我通常在週日早上的早餐吃雞蛋和脆培根。"},{"id":261,"word":"bacteria","pos":"n","meaning":"n. 細菌（複數）","example":"Washing your hands regularly is the best way to kill harmful bacteria.","example_zh":"定期洗手是殺死有害細菌的最佳方法。"},{"id":262,"word":"badly","pos":"adv","meaning":"adv. 不好；壞；非常","example":"The team played badly and lost the game by twenty points.","example_zh":"該隊表現得很不好，輸了比賽二十分。"},{"id":263,"word":"baggage","pos":"n","meaning":"n. 行李","example":"Please make sure you don't leave any baggage unattended at the airport.","example_zh":"請確保你沒有在機場將任何行李留在無人看管的狀態。"},{"id":264,"word":"bait","pos":"n","meaning":"n. 餌 (v) 裝誘餌於","example":"The fisherman used a small piece of bread as bait to catch the fish.","example_zh":"漁夫用一小塊麵包作為餌來釣魚。"},{"id":265,"word":"balance","pos":"n","meaning":"n. 平衡 (v) 保持平衡","example":"It is important to maintain a balance between your work and your personal life.","example_zh":"在工作與個人生活之間保持平衡是很重要的。"},{"id":266,"word":"bald","pos":"adj","meaning":"adj. 禿頭的","example":"My uncle started going bald in his early thirties and now has no hair.","example_zh":"我叔叔在三十出頭時開始變禿頭，現在已經沒頭髮了。"},{"id":267,"word":"ballet","pos":"n","meaning":"n. 芭蕾舞","example":"She has been practicing ballet since she was five years old.","example_zh":"她從五歲起就一直在練習芭蕾舞。"},{"id":268,"word":"bandage","pos":"n","meaning":"n. 繃帶 (v) 用繃帶包紮","example":"The nurse wrapped a bandage around his injured arm to stop the bleeding.","example_zh":"護士在他受傷的手臂上纏繞了繃帶以止血。"},{"id":269,"word":"bang","pos":"v","meaning":"v. 砰然作響 (n) 砰然作響","example":"I heard a loud bang from the kitchen and ran to see what had happened.","example_zh":"我聽到廚房傳來一聲巨大的砰然聲，便跑過去看發生了什麼事。"},{"id":270,"word":"bankrupt","pos":"adj","meaning":"adj. 破產的 (v) 使破產","example":"The company went bankrupt because it could not pay back its huge debts.","example_zh":"該公司因為無法償還巨額債務而破產了。"},{"id":271,"word":"bare","pos":"adj","meaning":"adj. 赤裸的；暴露的 (v) 露出；暴露","example":"He walked across the hot sand with bare feet to get to the ocean.","example_zh":"他赤腳走過發燙的沙灘去向大海。"},{"id":272,"word":"barely","pos":"adv","meaning":"adv. 幾乎不","example":"It was so noisy in the classroom that I could barely hear what the teacher said.","example_zh":"教室裡太吵了，以至於我幾乎聽不到老師在說什麼。"},{"id":273,"word":"bargain","pos":"n","meaning":"n. 交易；協議；便宜貨 (v) 講價；談條件","example":"You can often find a good bargain at the traditional market if you shop early.","example_zh":"如果你早點去逛，常能在傳統市場找到物超所值的便宜貨。"},{"id":274,"word":"barn","pos":"n","meaning":"n. 穀倉","example":"The farmer keeps his cows in the barn during the cold winter months.","example_zh":"農夫在寒冷的冬季月份將母牛關在穀倉裡。"},{"id":275,"word":"barrel","pos":"n","meaning":"n. （啤酒桶狀的）桶子","example":"The wine is stored in a large wooden barrel to age for several years.","example_zh":"葡萄酒被儲存在一個大型木桶中陳放幾年。"},{"id":276,"word":"barrier","pos":"n","meaning":"n. 障礙（物）","example":"Language can sometimes be a barrier to communication between people.","example_zh":"語言有時會成為人與人之間溝通的障礙。"}]},
{"unit":3,"unit_label":"p.5-6","words":[{"id":277,"word":"based on","pos":"phr","meaning":"phr. 以～為基礎，根據","example":"This movie is based on a true story that happened in Taiwan fifty years ago.","example_zh":"這部電影是根據五十年前發生在台灣的一個真實故事改編的。"},{"id":278,"word":"basin","pos":"n","meaning":"n. 臉盆；盆地；流域","example":"The Amazon River basin is home to many unique species of animals and plants.","example_zh":"亞馬遜河流域是許多獨特動植物物種的家園。"},{"id":279,"word":"battery","pos":"n","meaning":"n. 電池","example":"My phone's battery is low, so I need to find a place to charge it.","example_zh":"我的手機電池沒電了，所以我需要找個地方充電。"},{"id":280,"word":"battle","pos":"v/n","meaning":"v/n. 爭鬥，搏鬥","example":"The two armies prepared for a long and difficult battle in the valley.","example_zh":"兩軍準備在山谷中進行一場漫長且艱難的爭鬥。"},{"id":281,"word":"battlefield","pos":"n","meaning":"n. 戰場","example":"Many brave soldiers lost their lives on this historic battlefield.","example_zh":"許多勇敢的士兵在這片歷史戰場上犧牲了生命。"},{"id":282,"word":"bay","pos":"n","meaning":"n. 海灣","example":"We enjoyed a beautiful view of the bay from our hotel room window.","example_zh":"我們從飯店房間的窗戶欣賞了海灣的美麗景色。"},{"id":283,"word":"be alert to","pos":"phr","meaning":"phr. 對某事警覺","example":"Drivers should be alert to potential hazards when driving in heavy rain.","example_zh":"駕駛在暴雨中行駛時，應對潛在的危險保持警覺。"},{"id":284,"word":"be composed of","pos":"phr","meaning":"phr. 由～組成","example":"The atmosphere is composed of various gases, mainly nitrogen and oxygen.","example_zh":"大氣是由各種氣體組成的，主要是氮氣和氧氣。"},{"id":285,"word":"be dying to (do something)","pos":"phr","meaning":"phr. 很想、渴望做某事","example":"After a long semester, all the students are dying to go on a vacation.","example_zh":"經過一個長學期，所有學生都渴望去度假。"},{"id":286,"word":"be limited to","pos":"phr","meaning":"phr. 受限於～","example":"The special discount is limited to members who have a valid VIP card.","example_zh":"這項特別優惠僅限於持有有效貴賓卡的會員。"},{"id":287,"word":"be meant to","pos":"phr","meaning":"phr. 用於，意在","example":"This educational program is meant to help teenagers develop better social skills.","example_zh":"這個教育計畫旨在幫助青少年發展更好的社交技巧。"},{"id":288,"word":"be met with (something)","pos":"phr","meaning":"phr. 遭遇、得到(迴響、反應)","example":"The government's new policy was met with strong opposition from the public.","example_zh":"政府的新政策遭到了大眾強烈的反對。"},{"id":289,"word":"be on one's feet","pos":"phr","meaning":"phr. 久站","example":"The nurse had to be on her feet for ten hours during her busy shift.","example_zh":"那名護士在繁忙的輪班期間必須久站十個小時。"},{"id":290,"word":"be overwhelmed by/with","pos":"phr","meaning":"phr. 強烈感到，無法應付～","example":"She was overwhelmed by the kindness and support from her friends during the crisis.","example_zh":"在危機期間，她對朋友們展現的善意與支持深受感動。"},{"id":291,"word":"be supposed to","pos":"phr","meaning":"phr. (依規定、安排等)應當，該；一般認為","example":"You are supposed to turn off your mobile phone before the movie starts.","example_zh":"你應該在電影開始前關掉手機。"},{"id":292,"word":"be torn apart","pos":"phr","meaning":"phr. 被拆散","example":"Many families were torn apart by the war and lost contact for decades.","example_zh":"許多家庭被戰爭拆散，並失去聯繫數十年。"},{"id":293,"word":"beak","pos":"n","meaning":"n. 鳥喙","example":"The eagle used its sharp beak to catch a fish from the river.","example_zh":"老鷹用牠鋒利的鳥喙從河裡抓了一條魚。"},{"id":294,"word":"beam","pos":"n","meaning":"n. 光線；橫樑","example":"A beam of light shone through the window and woke me up this morning.","example_zh":"今天早上，一束光線穿過窗戶，把我喚醒。"},{"id":295,"word":"bear","pos":"v","meaning":"v. 生育；忍受","example":"She couldn't bear the thought of leaving her home and moving to another city.","example_zh":"她無法忍受離開家鄉搬到另一個城市的想法。"},{"id":296,"word":"bear in mind","pos":"phr","meaning":"phr. 記住","example":"You should bear in mind that the deadline for the project is next Friday.","example_zh":"你應該記住，這項計畫的截止日期是下週五。"},{"id":297,"word":"beast","pos":"n","meaning":"n. 野獸","example":"In the fairy tale, the beautiful princess falls in love with a scary beast.","example_zh":"在童話故事中，美麗的公主愛上了一隻可怕的野獸。"},{"id":298,"word":"before long","pos":"phr","meaning":"phr. 不久","example":"Don't worry, the rain will stop before long and we can go outside to play.","example_zh":"別擔心，不久雨就會停了，我們就可以出去玩。"},{"id":299,"word":"beg","pos":"v","meaning":"v. 乞求","example":"The poor man had to beg for food on the street because he had no money.","example_zh":"那個窮人因為沒錢，不得不在街上乞求食物。"},{"id":300,"word":"beggar","pos":"n","meaning":"n. 乞丐","example":"The kind woman gave some coins and a sandwich to the hungry beggar on the street.","example_zh":"那位好心的女士給了街上飢餓的乞丐一些硬幣和一份三明治。"},{"id":301,"word":"behave","pos":"v","meaning":"v. 表現；舉止得體","example":"Parents often tell their children to behave themselves when they visit others' homes.","example_zh":"父母在拜訪別人家時，常會叫孩子們要舉止得體。"},{"id":302,"word":"behavior","pos":"n","meaning":"n. 行為，舉止","example":"The teacher praised the students for their excellent behavior during the field trip.","example_zh":"老師稱讚學生們在校外教學期間優異的行為表現。"},{"id":303,"word":"being","pos":"n","meaning":"n. 存在；生物","example":"Some scientists believe that there might be living beings on other planets in the universe.","example_zh":"有些科學家認為宇宙中其他星球上可能存在生物。"},{"id":304,"word":"belief","pos":"n","meaning":"n. 相信，信任","example":"It is my firm belief that hard work will eventually lead to great success.","example_zh":"我堅定地相信，努力最終會帶來巨大的成功。"},{"id":305,"word":"belong to","pos":"phr","meaning":"phr. 屬於","example":"Do you know who these keys belong to? I found them near the school gate.","example_zh":"你知道這些鑰匙屬於誰嗎？我在校門口附近發現的。"},{"id":306,"word":"bend","pos":"v","meaning":"v. 轉彎，彎腰(n)轉彎處","example":"You should bend your knees when you lift heavy boxes to avoid hurting your back.","example_zh":"搬重物時你應該彎曲膝蓋，以避免傷到背部。"},{"id":307,"word":"beneath","pos":"prep","meaning":"prep. 在～下面；與～不相稱","example":"The workers found ancient coins buried deep beneath the surface of the earth.","example_zh":"工人們在地表深處發現了埋藏的古代硬幣。"},{"id":308,"word":"beneficial","pos":"adj","meaning":"adj. 有利的，有幫助的","example":"Regular exercise and a balanced diet are highly beneficial to our overall health.","example_zh":"規律運動和均衡飲食對我們的整體健康非常有益。"},{"id":309,"word":"benefit","pos":"n","meaning":"n. 優勢，益處 (v) 有助於，受益","example":"One major benefit of learning a second language is better career opportunities.","example_zh":"學習第二語言的一個主要好處是擁有更好的就業機會。"},{"id":310,"word":"berry","pos":"n","meaning":"n. 莓果；漿果","example":"We spent the afternoon picking every ripe berry we could find in the bushes.","example_zh":"我們下午都在採摘灌木叢中能找到的每一顆成熟莓果。"},{"id":311,"word":"besides","pos":"adv","meaning":"adv. 此外","example":"I don't feel like going out tonight; besides, I have a lot of homework to do.","example_zh":"我今晚不想出門；此外，我還有很多功課要做。"},{"id":312,"word":"betray","pos":"v","meaning":"v. 出賣 背叛","example":"He felt deeply hurt when he discovered that his best friend had decided to betray him.","example_zh":"當他發現最好的朋友決定出賣他時，他感到深受傷害。"},{"id":313,"word":"Bible","pos":"n","meaning":"n. 聖經","example":"The Bible is one of the most influential and widely read books in human history.","example_zh":"聖經是人類歷史上最具影響力且閱讀最廣泛的書籍之一。"},{"id":314,"word":"billion","pos":"n","meaning":"n. 十億","example":"The world's population has already exceeded eight billion people.","example_zh":"世界人口已經超過了八十億。"},{"id":315,"word":"bingo","pos":"n","meaning":"n. 賓果遊戲","example":"The elderly residents at the nursing home enjoy playing bingo every Friday afternoon.","example_zh":"養老院的老人家喜歡在每個週五下午玩賓果遊戲。"},{"id":316,"word":"biography","pos":"n","meaning":"n. 傳記","example":"I just finished reading an inspiring biography of the famous scientist Albert Einstein.","example_zh":"我剛讀完一本關於著名科學家愛因斯坦的勵志傳記。"},{"id":317,"word":"biology","pos":"n","meaning":"n. 生物學","example":"In biology class, students learn about cells, genetics, and the structure of living things.","example_zh":"在生物學課上，學生學習細胞、遺傳學和生物的結構。"},{"id":318,"word":"biscuit","pos":"n","meaning":"n. 餅乾","example":"Would you like to have a chocolate biscuit with your afternoon tea?","example_zh":"你想在下午茶時配一塊巧克力餅乾嗎？"},{"id":319,"word":"bit","pos":"n","meaning":"n. 少量，一點 (adv) 稍微","example":"I was a bit tired after the long hike, so I took a short nap on the grass.","example_zh":"長途健行後我有一點累，所以我在草地上小睡了一下。"},{"id":320,"word":"blame","pos":"v/n","meaning":"v/n. 怪罪，責備","example":"You shouldn't always blame others for your own mistakes; take responsibility for your actions.","example_zh":"你不該總是把自己的錯誤怪罪到別人身上；要為自己的行為負責。"},{"id":321,"word":"blanket","pos":"n","meaning":"n. 毛毯；厚覆蓋層","example":"It was so cold last night that I had to use an extra blanket to stay warm.","example_zh":"昨晚太冷了，我不得不加蓋一條毛毯來保暖。"},{"id":322,"word":"blaze","pos":"v","meaning":"v. 燃燒 (n)烈火","example":"Firefighters fought for hours to put out the blaze that destroyed the old factory.","example_zh":"消防員奮戰了數小時才撲滅了摧毀那座舊工廠的烈火。"},{"id":323,"word":"blazing","pos":"adj","meaning":"adj. 炎熱的，熊熊燃燒的","example":"We decided to stay indoors to avoid the blazing sun in the middle of the day.","example_zh":"我們決定待在室內，以避開正午炎熱的陽光。"},{"id":324,"word":"bleed","pos":"v","meaning":"v. 流血","example":"If your finger continues to bleed, you should put a bandage on it immediately.","example_zh":"如果你的手指繼續流血，你應該立刻貼上繃帶。"},{"id":325,"word":"blend","pos":"v","meaning":"v. 混合 (n) 混合（物）","example":"This smoothie is a perfect blend of bananas, strawberries, and yogurt.","example_zh":"這杯果昔是香蕉、草莓和優格的完美混合。"},{"id":326,"word":"bless","pos":"v","meaning":"v. 祝福；保佑","example":"May God bless you and your family with health and happiness in the new year.","example_zh":"願上帝在新年祝福你和你的家人健康快樂。"},{"id":327,"word":"blessing","pos":"n","meaning":"n. 祝福；恩賜；可喜之事","example":"Good health is a great blessing that people often take for granted until they get sick.","example_zh":"健康是極大的恩賜，人們往往在生病前都視之為理所當然。"},{"id":328,"word":"blink","pos":"v","meaning":"v. 眨眼 (n) 眨眼","example":"If you blink too often, it might be a sign that your eyes are too dry or tired.","example_zh":"如果你眨眼太頻繁，這可能是眼睛太乾或太累的徵兆。"},{"id":329,"word":"bloom","pos":"n","meaning":"n. 花；開花 (v) 開花","example":"The cherry trees are in full bloom, attracting many tourists to the park.","example_zh":"櫻花正盛開著，吸引了許多遊客前往公園。"},{"id":330,"word":"blossom","pos":"n","meaning":"n. 花 (v) 開花；進展","example":"Their friendship began to blossom into a romantic relationship over the summer.","example_zh":"他們的友誼在夏季期間開始進展為一段浪漫關係。"},{"id":331,"word":"blouse","pos":"n","meaning":"n. （女裝的）上衣","example":"She wore a silk blouse and a long skirt to the formal dinner party.","example_zh":"她穿著絲質上衣和長裙參加正式晚宴。"},{"id":332,"word":"blow someone away","pos":"phr","meaning":"phr. 使某人印象深刻","example":"The young pianist's incredible talent and performance really blew the audience away.","example_zh":"那位年輕鋼琴家驚人的才華和表演真的讓觀眾印象深刻。"},{"id":333,"word":"blush","pos":"v","meaning":"v. 臉紅；感到慚愧 (n) 臉紅","example":"She couldn't help but blush when the teacher praised her in front of the whole class.","example_zh":"當老師全班面前稱讚她時，她禁不住臉紅了。"},{"id":334,"word":"boast","pos":"v","meaning":"v. 自誇；誇耀 (n) 自誇","example":"He likes to boast about how many marathons he has completed in the past year.","example_zh":"他喜歡誇耀自己在過去一年裡完成了多少場馬拉松。"},{"id":335,"word":"bold","pos":"adj","meaning":"adj. 大膽的","example":"The hero made a bold decision to save the people trapped in the burning building.","example_zh":"英雄做出了一個大膽的決定，救出受困在燃燒建築物中的人們。"},{"id":336,"word":"bond","pos":"v/n","meaning":"v/n. 聯繫，關係","example":"Reading together is a great way for parents to strengthen the bond with their children.","example_zh":"一起閱讀是父母加強與孩子之間聯繫的好方法。"},{"id":337,"word":"boost","pos":"v/n","meaning":"v/n. 改善，促進","example":"The government introduced new measures to boost the country's economy.","example_zh":"政府推出了新措施來促進國家經濟。"},{"id":338,"word":"boot","pos":"n","meaning":"n. 靴子","example":"You should wear heavy boots if you plan to go hiking in the snowy mountains.","example_zh":"如果你打算在雪山健行，你應該穿上厚重的靴子。"},{"id":339,"word":"border","pos":"v","meaning":"v. 鄰接 (n) 邊界","example":"Mexico and Canada both share a long border with the United States.","example_zh":"墨西哥和加拿大都與美國接壤。"},{"id":340,"word":"bore","pos":"v","meaning":"v. 使厭煩 (n) 討厭的人或事物","example":"I don't want to bore you with all the details of my long and tiring journey.","example_zh":"我不想用我那漫長又累人的旅程細節來使你厭煩。"},{"id":341,"word":"born","pos":"adj","meaning":"adj. 天生的","example":"Mozart was a born musician who started composing music at a very young age.","example_zh":"莫札特是個天生的音樂家，在很小的時候就開始作曲。"},{"id":342,"word":"bounce","pos":"v","meaning":"v. （使）彈起 (n) 彈力；彈性","example":"The children love to watch the rubber ball bounce high after it hits the ground.","example_zh":"孩子們喜歡看橡膠球撞擊地面後高高彈起。"},{"id":343,"word":"bound","pos":"adj","meaning":"adj. 肯定會，極有可能","example":"If you don't study hard for the final exam, you are bound to fail.","example_zh":"如果你期末考不努力讀書，你肯定會不及格。"},{"id":344,"word":"bra","pos":"n","meaning":"n. 胸罩","example":"She went to the department store to buy a new bra that fits her comfortably.","example_zh":"她去百貨公司買一件穿起來舒服的新胸罩。"},{"id":345,"word":"bracelet","pos":"n","meaning":"n. 手鐲","example":"The beautiful gold bracelet was a graduation gift from her grandmother.","example_zh":"那個漂亮的金手鐲是她祖母送她的畢業禮物。"},{"id":346,"word":"brake","pos":"n","meaning":"n. 煞車 (v) 煞車","example":"The driver had to step on the brake suddenly to avoid hitting the dog.","example_zh":"駕駛不得不突然踩下煞車，以避免撞到那隻狗。"},{"id":347,"word":"brass","pos":"n","meaning":"n. 黃銅","example":"The antique lamp is made of brass and has beautiful patterns on its base.","example_zh":"那盞古董燈由黃銅製成，底座上有美麗的圖案。"},{"id":348,"word":"brassiere","pos":"n","meaning":"n. 胸罩","example":"She wore a silk brassiere under her evening gown for a better fit.","example_zh":"她在晚禮服裡面穿了絲質胸罩以更合身。"},{"id":349,"word":"bravery","pos":"n","meaning":"n. 勇敢","example":"The soldier was awarded a medal for his bravery on the battlefield.","example_zh":"那名士兵因在戰場上的勇敢而被授予勳章。"},{"id":350,"word":"break out","pos":"phr","meaning":"phr. 爆發，突然發生","example":"Local officials are worried that a new disease might break out in the crowded city.","example_zh":"地方官員擔心擁擠的城市可能會爆發新疾病。"},{"id":351,"word":"break through","pos":"phr","meaning":"phr. 突破，克服","example":"The scientist hopes to break through the difficulties in her cancer research soon.","example_zh":"那位科學家希望很快能突破癌症研究中的困難。"},{"id":352,"word":"breast","pos":"n","meaning":"n. 乳房；胸部","example":"The mother held the crying baby close to her breast to comfort him.","example_zh":"母親將哭泣的嬰兒緊貼在胸部以安撫他。"},{"id":353,"word":"breath","pos":"n","meaning":"n. 氣息；呼吸","example":"I took a deep breath of fresh air before I started my long presentation.","example_zh":"在開始漫長的簡報前，我深吸了一口新鮮空氣。"},{"id":354,"word":"breathe","pos":"v","meaning":"v. 呼吸","example":"It is important to breathe slowly and deeply when you feel stressed or nervous.","example_zh":"當你感到壓力或緊張時，緩慢而深地呼吸是很重要的。"},{"id":355,"word":"breed","pos":"v","meaning":"v. 繁殖；滋生 (n) 品種","example":"Farmers often keep different types of sheep to breed for better wool quality.","example_zh":"農夫常飼養不同種類的羊來進行繁殖，以獲得更好的羊毛品質。"},{"id":356,"word":"breeze","pos":"n","meaning":"n. 微風；輕而易舉之事","example":"A gentle breeze blew across the lake, making the water ripple slightly.","example_zh":"一陣微風吹過湖面，使水面泛起微波。"},{"id":357,"word":"bride","pos":"n","meaning":"n. 新娘","example":"The bride looked absolutely stunning in her white wedding dress.","example_zh":"新娘穿著白色婚紗看起來真的美極了。"},{"id":358,"word":"bridegroom","pos":"n","meaning":"n. 新郎","example":"The bridegroom was very nervous while waiting for his future wife at the altar.","example_zh":"新郎在祭壇前等待未來的妻子時非常緊張。"},{"id":359,"word":"brilliant","pos":"adj","meaning":"adj. 光輝奪目的；聰穎的；傑出的","example":"My cousin is a brilliant student who won a scholarship to study at Harvard.","example_zh":"我表弟是個聰穎的學生，贏得了去哈佛大學讀書的獎學金。"},{"id":360,"word":"bring about = lead to = give rise to","pos":"phr","meaning":"phr. 導致(+N/Ving)","example":"The invention of the internet has managed to bring about many changes in our lives.","example_zh":"網路的發明成功導致了我們生活中的許多改變。"},{"id":361,"word":"broadcast","pos":"v/n","meaning":"v/n. 廣播(三態同行)","example":"The news about the earthquake was broadcast on all major TV channels.","example_zh":"關於地震的消息在所有主要電視頻道播出。"},{"id":362,"word":"broke","pos":"adj","meaning":"adj. 身無分文的","example":"I spent all my money on the new computer, and now I am completely broke.","example_zh":"我把所有的錢都花在買新電腦上了，現在我完全身無分文。"},{"id":363,"word":"brook","pos":"n","meaning":"n. 小河","example":"The children spent the whole afternoon playing by the small brook in the forest.","example_zh":"孩子們整個下午都在森林裡的小河邊玩耍。"},{"id":364,"word":"broom","pos":"n","meaning":"n. 掃帚","example":"The old woman used a wooden broom to sweep the leaves off her porch.","example_zh":"老婦人拿著一把木製掃帚清掃門廊上的落葉。"},{"id":365,"word":"brow","pos":"n","meaning":"n. 眉毛；額頭","example":"He wiped the sweat from his brow after working in the garden all day.","example_zh":"在花園工作一整天後，他擦去了額頭上的汗水。"},{"id":366,"word":"brutal","pos":"adj","meaning":"adj. 殘忍的","example":"The movie shows the brutal reality of war and its impact on innocent people.","example_zh":"這部電影展示了戰爭殘忍的現實及其對無辜民眾的影響。"},{"id":367,"word":"bubble","pos":"n","meaning":"n. 氣泡；泡沫","example":"The children were laughing and chasing every soap bubble in the air.","example_zh":"孩子們笑著追逐空氣中的每一個肥皂氣泡。"},{"id":368,"word":"bucket","pos":"n","meaning":"n. 水桶","example":"Please help me carry this bucket of water to the garden to water the plants.","example_zh":"請幫我提這桶水到花園去澆灌植物。"},{"id":369,"word":"bud","pos":"n","meaning":"n. 枝芽；花蕾 (v) 萌芽","example":"In early spring, the trees start to have many small green buds on their branches.","example_zh":"初春時，樹木的枝條上開始長出許多綠色的小枝芽。"},{"id":370,"word":"budget","pos":"n","meaning":"n. 預算 (v) 安排；預定","example":"We need to plan our travel budget carefully to avoid spending too much money.","example_zh":"我們需要仔細規劃旅遊預算，以免花太多錢。"},{"id":371,"word":"buffalo","pos":"n","meaning":"n. 水牛；野牛","example":"In some parts of Asia, farmers still use buffalo to help them plow the fields.","example_zh":"在亞洲某些地區，農夫仍使用水牛幫助他們耕田。"},{"id":372,"word":"buffet","pos":"n","meaning":"n. 自助式飲食；自助式餐廳","example":"The hotel provides a delicious breakfast buffet with many different choices.","example_zh":"飯店提供美味的自助式早餐，有多種不同的選擇。"},{"id":373,"word":"bulb","pos":"n","meaning":"n. 燈泡","example":"I need to buy a new light bulb because the one in my room burned out.","example_zh":"我需要買一個新燈泡，因為我房間裡的那顆燒壞了。"},{"id":374,"word":"bull","pos":"n","meaning":"n. 公牛","example":"The strong bull was grazing peacefully in the green field behind the fence.","example_zh":"那頭強壯的公牛在籬笆後的綠地裡安靜地吃草。"},{"id":375,"word":"bullet","pos":"n","meaning":"n. 子彈","example":"The police officer wore a bulletproof vest to protect himself from a potential bullet.","example_zh":"警官穿著防彈背心，以保護自己免受潛在子彈的傷害。"},{"id":376,"word":"bulletin","pos":"n","meaning":"n. 公告","example":"Students should check the bulletin board regularly for important school news.","example_zh":"學生應定期查看佈告欄以獲取重要的學校公告。"},{"id":377,"word":"bump","pos":"v","meaning":"v. 碰撞 (n) 砰然一聲；撞擊","example":"I accidentally bumped into an old friend while I was shopping at the mall.","example_zh":"我在購物中心逛街時意外碰撞到一位老朋友。"},{"id":378,"word":"bunch","pos":"n","meaning":"n. 串；束；群","example":"My father bought a large bunch of bananas and some apples from the market.","example_zh":"我父親從市場買了一大串香蕉和一些蘋果。"},{"id":379,"word":"burden","pos":"n","meaning":"n. 負擔 (v) 使負擔","example":"Don't burden your parents with your financial problems if you can solve them yourself.","example_zh":"如果你能自己解決財務問題，就不要讓父母背負負擔。"},{"id":380,"word":"bureau","pos":"n","meaning":"n. （政府部門的）局；部","example":"The Central Weather Bureau issued a typhoon warning for the entire island.","example_zh":"中央氣象局對全島發布了颱風警報。"},{"id":381,"word":"burglar","pos":"n","meaning":"n. 竊賊","example":"The burglar broke into the house and stole all the expensive jewelry.","example_zh":"竊賊闖入屋內偷走了所有昂貴的珠寶。"},{"id":382,"word":"burst into","pos":"phr","meaning":"phr. 突然爆出","example":"The baby suddenly burst into tears when she realized her mother was not there.","example_zh":"當小寶寶發現媽媽不在那裡時，突然大哭了起來。"},{"id":383,"word":"bury","pos":"v","meaning":"v. 埋葬；埋首於；埋藏","example":"Many people like to bury themselves in a good book during their free time.","example_zh":"許多人喜歡在空閒時間埋首於一本好書中。"},{"id":384,"word":"bush","pos":"n","meaning":"n. 灌木；矮樹","example":"The small rabbit quickly hid behind a thick bush when it saw the fox.","example_zh":"小兔子看見狐狸時，迅速躲在一叢茂密的灌木後面。"},{"id":385,"word":"buzz","pos":"v","meaning":"v. 嗡嗡叫；按鈴叫喚 (n) 嗡嗡聲；吵雜聲","example":"I can hear the bees as they buzz around the flowers in the garden.","example_zh":"我可以聽到蜜蜂在花園的花叢周圍嗡嗡叫。"},{"id":386,"word":"by coincidence","pos":"phr","meaning":"phr. 碰巧，剛好","example":"I met my primary school teacher at the airport yesterday by coincidence.","example_zh":"我昨天在機場碰巧遇到了我的國小老師。"},{"id":387,"word":"by inference","pos":"phr","meaning":"phr. 根據推論","example":"We can tell by inference that the suspect was present at the scene of the crime.","example_zh":"我們可以根據推論得知嫌犯曾出現在犯罪現場。"},{"id":388,"word":"by oneself","pos":"phr","meaning":"phr. 單獨地，獨立地","example":"She prefers to travel by oneself because it gives her more freedom.","example_zh":"她偏好單獨旅行，因為這給她更多自由。"},{"id":389,"word":"by the way","pos":"phr","meaning":"phr. 順便一提","example":"By the way, have you seen my glasses? I can't find them anywhere.","example_zh":"順便一提，你有看到我的眼鏡嗎？我哪裡都找不到。"},{"id":390,"word":"by virtue of","pos":"phr","meaning":"phr. 由於","example":"He got the job by virtue of his excellent communication skills and experience.","example_zh":"由於他優異的溝通技巧和經驗，他得到了這份工作。"},{"id":391,"word":"cabin","pos":"n","meaning":"n. 船艙；機艙；小木屋","example":"We spent the night in a cozy wooden cabin near the beautiful lake.","example_zh":"我們在美麗湖泊附近的一間舒適木屋裡度過了一晚。"},{"id":392,"word":"cabinet","pos":"n","meaning":"n. 櫥櫃；酒櫃；政府內閣；內閣人員","example":"Please put the clean dishes back into the kitchen cabinet after they are dry.","example_zh":"碗盤乾了以後，請把它們放回廚房櫥櫃。"},{"id":393,"word":"calculate","pos":"v","meaning":"v. 計算","example":"You need to calculate the total cost of the trip before you decide to go.","example_zh":"在決定要去之前，你需要計算這次旅行的總花費。"},{"id":394,"word":"calculation","pos":"n","meaning":"n. 估算；精算","example":"According to my calculation, we should have enough money for the whole month.","example_zh":"根據我的估算，我們應該有足夠的錢過完這整個月。"},{"id":395,"word":"calculator","pos":"n","meaning":"n. 計算機","example":"The math teacher allowed the students to use a calculator during the exam.","example_zh":"數學老師允許學生在考試期間使用計算機。"},{"id":396,"word":"call for","pos":"phr","meaning":"phr. 要求，呼籲；需要","example":"The environmental group plans to call for a ban on single-use plastic bags.","example_zh":"環保團體計劃呼籲禁止使用一次性塑膠袋。"},{"id":397,"word":"calm","pos":"v","meaning":"v. 使平靜，使鎮定 (adj) 平靜的，鎮定的 (n) 寧靜","example":"It is important to stay calm and follow the instructions during an emergency.","example_zh":"在緊急情況下保持鎮定並遵循指示是很重要的。"},{"id":398,"word":"calorie","pos":"n","meaning":"n. 卡路里","example":"You should check the number of calories on the food label before you eat it.","example_zh":"吃東西前你應該查看食品標籤上的卡路里數量。"},{"id":399,"word":"campaign","pos":"n","meaning":"n. 運動；活動 (v) 從事活動；參加競選","example":"The students organized a campaign to raise money for the local animal shelter.","example_zh":"學生們組織了一項活動，為當地的動物收容所籌集資金。"},{"id":400,"word":"candidate","pos":"n","meaning":"n. 候選人","example":"The committee is interviewing each candidate to find the most suitable person for the job.","example_zh":"委員會正在面試每一位候選人，以找到最適合這份工作的人。"},{"id":401,"word":"cane","pos":"n","meaning":"n. 手杖","example":"My grandfather uses a wooden cane to help him walk more steadily.","example_zh":"我祖父使用木製手杖來幫助他走得更穩。"},{"id":402,"word":"canoe","pos":"n","meaning":"n. 獨木舟 (v) 划獨木舟","example":"We decided to canoe down the river to enjoy the peaceful scenery of the valley.","example_zh":"我們決定划獨木舟順流而下，欣賞山谷寧靜的景色。"},{"id":403,"word":"can't compare with","pos":"phr","meaning":"phr. 不能相比","example":"The quality of this cheap replica simply can't compare with the original product.","example_zh":"這件廉價複製品的品質完全無法與原版產品相比。"},{"id":404,"word":"can't help but","pos":"phr","meaning":"phr. 忍不住 (+Ving)","example":"Looking at the old photos, she ca
