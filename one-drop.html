o never gives up, no matter how hard the task is.","example_zh":"她是一位心意堅決的學生，無論任務多困難，從不放棄。"},{"id":826,"word":"develop","pos":"v","meaning":"v. 發展，開發，培養","example":"The city is trying to develop new parks to improve the quality of life.","example_zh":"城市正試圖開發新的公園以改善生活品質。"},{"id":827,"word":"developed","pos":"adj","meaning":"adj. 已開發的","example":"Many developed countries are investing in renewable energy sources.","example_zh":"許多已開發國家正投資於再生能源。"},{"id":828,"word":"development","pos":"n","meaning":"n. 發展","example":"The rapid development of artificial intelligence has changed how we live.","example_zh":"人工智慧的快速發展已經改變了我們的生活方式。"},{"id":829,"word":"device","pos":"n","meaning":"n. 儀器；設備","example":"This new medical device allows doctors to monitor the patient's heart rate wirelessly.","example_zh":"這項新的醫療設備讓醫生能無線監控病人的心跳。"},{"id":830,"word":"devil","pos":"n","meaning":"n. 惡魔；魔鬼","example":"In many stories, the devil is portrayed as an evil being who tries to lead people astray.","example_zh":"在許多故事中，魔鬼被描繪成一個試圖引誘人們誤入歧途的邪惡生物。"},{"id":831,"word":"devise","pos":"v","meaning":"v. 計畫；發明","example":"The team had to devise a new strategy to solve the complex problem.","example_zh":"團隊必須計畫出一項新策略來解決這個複雜的問題。"},{"id":832,"word":"devote","pos":"v","meaning":"v. 奉獻","example":"He decided to devote his life to helping the poor and those in need.","example_zh":"他決定將一生奉獻給幫助窮人與有需要的人。"},{"id":833,"word":"devote oneself to something","pos":"phr","meaning":"phr. 致力、獻身於某事","example":"She wants to devote herself to music once she finishes her university studies.","example_zh":"一旦完成大學學業，她便想致力於音樂。"},{"id":834,"word":"dialogue","pos":"n","meaning":"n. 對話；對白","example":"The two characters in the play have a very interesting dialogue.","example_zh":"戲裡的兩個角色有一段非常有趣的對話。"},{"id":835,"word":"diaper","pos":"n","meaning":"n. 尿布","example":"The baby needs a fresh diaper to stay clean and comfortable.","example_zh":"嬰兒需要一片乾淨的尿布以保持潔淨與舒適。"},{"id":836,"word":"diet","pos":"n","meaning":"n. 飲食 (v) 節食","example":"A healthy diet should include plenty of fresh fruits and vegetables.","example_zh":"健康的飲食應包含大量的新鮮蔬果。"},{"id":837,"word":"differ","pos":"v","meaning":"v. 不同；不一樣","example":"My opinion on this issue seems to differ from yours.","example_zh":"我對這個問題的看法似乎與你的不同。"},{"id":838,"word":"digest","pos":"v","meaning":"v. 消化（食物）；融會貫通 (n) 摘要；文摘","example":"It takes time for the human body to digest a large meal.","example_zh":"人體需要時間來消化豐盛的一餐。"},{"id":839,"word":"digestion","pos":"n","meaning":"n. 消化","example":"Regular exercise is known to improve digestion and overall health.","example_zh":"定期運動已知能改善消化與整體健康。"},{"id":840,"word":"digital","pos":"adj","meaning":"adj. 數位的；數字的","example":"We now live in a digital age where most information is stored on computers.","example_zh":"我們現在生活在一個大多數資訊都儲存在電腦裡的數位時代。"},{"id":841,"word":"dignity","pos":"n","meaning":"n. 尊嚴","example":"Even in the most difficult situations, she always maintained her dignity.","example_zh":"即使在最困難的情況下，她始終保持著尊嚴。"},{"id":842,"word":"dilemma","pos":"n","meaning":"n. 進退兩難","example":"She was in a dilemma: should she take the new job or stay where she was?","example_zh":"她陷入了進退兩難：她應該接受新工作還是留在原地？"},{"id":843,"word":"diligence","pos":"n","meaning":"n. 勤勉；勤奮","example":"Through sheer diligence, he managed to learn a new language in just six months.","example_zh":"憑藉著純粹的勤勉，他竟然在短短六個月內學會了一門新語言。"},{"id":844,"word":"diligent","pos":"adj","meaning":"adj. 勤勉的","example":"The diligent worker always finished his tasks ahead of schedule.","example_zh":"那位勤勉的員工總是在期限前完成他的工作。"},{"id":845,"word":"diligently","pos":"adv","meaning":"adv. 勤奮地","example":"She studied diligently every evening to prepare for the upcoming final exams.","example_zh":"她每天晚上都勤奮地讀書，以準備即將到來的期末考。"},{"id":846,"word":"dim","pos":"adj","meaning":"adj. 昏暗的；模糊不清的","example":"The light in the room was too dim to read a book comfortably.","example_zh":"房間裡的燈光太昏暗，無法舒適地閱讀書籍。"},{"id":847,"word":"dime","pos":"n","meaning":"n. 一角硬幣","example":"In the past, a dime was enough to buy a small candy.","example_zh":"在過去，一枚一角硬幣足以買到一顆小糖果。"},{"id":848,"word":"diminish","pos":"v","meaning":"v. 減少","example":"As we grow older, our physical strength may slowly diminish.","example_zh":"隨著年紀增長，我們的體力可能會慢慢減少。"},{"id":849,"word":"dine","pos":"v","meaning":"v. 進正餐","example":"We were invited to dine with the mayor at his official residence.","example_zh":"我們受邀與市長在他的官邸進正餐。"},{"id":850,"word":"diner","pos":"n","meaning":"n. 小餐館","example":"We stopped at a small diner for a quick breakfast before hitting the road.","example_zh":"我們在上路前，在一家小餐館停下來吃頓快速早餐。"},{"id":851,"word":"dip","pos":"v","meaning":"v. 浸泡","example":"The kids love to dip their fries into ketchup.","example_zh":"孩子們喜歡把薯條浸泡在番茄醬裡。"},{"id":852,"word":"diploma","pos":"n","meaning":"n. 文憑","example":"After four years of hard work, she finally received her university diploma.","example_zh":"經過四年的努力，她終於拿到了大學文憑。"},{"id":853,"word":"diplomat","pos":"n","meaning":"n. 外交官","example":"The diplomat worked hard to maintain friendly relations between the two countries.","example_zh":"那位外交官努力維持兩國間的友好關係。"},{"id":854,"word":"dirt","pos":"n","meaning":"n. 泥土","example":"The children came back inside with their shoes covered in dirt.","example_zh":"孩子們回來時，他們的鞋子上沾滿了泥土。"},{"id":855,"word":"disability","pos":"n","meaning":"n. 殘疾 無能","example":"Despite his physical disability, he never let it stop him from achieving his goals.","example_zh":"儘管有身體殘疾，他從未讓這件事阻礙他實現目標。"},{"id":856,"word":"disable","pos":"v","meaning":"v. 使傷殘；使失去能力","example":"The injury was enough to disable him from playing professional sports.","example_zh":"這項傷勢足以使他喪失參與職業運動的能力。"},{"id":857,"word":"disabled","pos":"adj","meaning":"adj. 殘疾的，喪失能力的","example":"The sports center has special facilities for disabled athletes.","example_zh":"運動中心有為殘疾運動員提供的特殊設施。"},{"id":858,"word":"disadvantage","pos":"n","meaning":"n. 不利；劣勢","example":"The main disadvantage of living in the city is the high cost of rent.","example_zh":"住在城市的主要劣勢是高昂的租金。"},{"id":859,"word":"disappoint","pos":"v","meaning":"v. 令人失望","example":"I don't want to disappoint my parents by failing the exam.","example_zh":"我不想因考試不及格而使我的父母失望。"},{"id":860,"word":"disappointed","pos":"adj","meaning":"adj. 失望的，沮喪的","example":"She felt very disappointed when she didn't get the job she wanted.","example_zh":"當她沒得到想要的工作時，她感到非常失望。"},{"id":861,"word":"disappointment","pos":"n","meaning":"n. 失望","example":"To my great disappointment, the concert was canceled due to bad weather.","example_zh":"令我非常失望的是，演唱會因為天氣不好而取消了。"},{"id":862,"word":"disaster","pos":"n","meaning":"n. 災難","example":"The earthquake was a terrible disaster that destroyed many homes.","example_zh":"那場地震是一場毀滅許多家園的可怕災難。"},{"id":863,"word":"disastrous","pos":"adj","meaning":"adj. 災難性的，造成傷害的","example":"The flood had a disastrous effect on the local farming community.","example_zh":"那場洪水對當地的農業社區造成了災難性的影響。"},{"id":864,"word":"disbelief","pos":"n","meaning":"n. 不相信，懷疑","example":"He stared at the news in total disbelief, unable to process what he was hearing.","example_zh":"他目瞪口呆地看著那則新聞，完全無法相信他所聽到的消息。"},{"id":865,"word":"discipline","pos":"n","meaning":"n. 紀律；鍛鍊；訓練 (v) 訓練；鍛鍊；懲戒","example":"Self-discipline is essential for anyone who wants to achieve their long-term goals.","example_zh":"對於任何想要實現長期目標的人來說，自律是不可或缺的。"},{"id":866,"word":"disco","pos":"n","meaning":"n. 迪斯可舞廳","example":"We danced all night at the local disco to celebrate our graduation.","example_zh":"我們在當地的迪斯可舞廳徹夜跳舞，慶祝我們的畢業。"},{"id":867,"word":"disconnect","pos":"v","meaning":"v. 使分離；使中斷連接","example":"Please disconnect the power supply before you start working on the electrical wires.","example_zh":"在處理電線之前，請先將電源中斷連接。"},{"id":868,"word":"discontent","pos":"n","meaning":"n. 不滿","example":"The workers expressed their growing discontent with the new low wages.","example_zh":"工人們表達了他們對於新的低薪資日益增長的不滿。"},{"id":869,"word":"discotheque","pos":"n","meaning":"n. 迪斯可舞廳","example":"In the 1970s, the discotheque was the most popular place for young people to socialize.","example_zh":"在 1970 年代，迪斯可舞廳是年輕人社交最熱門的地方。"},{"id":870,"word":"discount","pos":"n","meaning":"n. 折扣 (v) 打折扣","example":"The bookstore offers a 20% discount if you buy more than five books.","example_zh":"如果你購買超過五本書，這家書店提供 20% 的折扣。"},{"id":871,"word":"discourage","pos":"v","meaning":"v. 使沮喪；勸阻","example":"Don't let your failures discourage you from trying again.","example_zh":"不要讓你的失敗使你灰心而不再嘗試。"},{"id":872,"word":"discover","pos":"v","meaning":"v. 發現","example":"Scientists were thrilled to discover a new planet orbiting a distant star.","example_zh":"科學家們興奮地發現了一顆繞著遙遠恆星運行的新行星。"},{"id":873,"word":"discovery","pos":"n","meaning":"n. 發現","example":"The discovery of antibiotics changed the course of modern medicine forever.","example_zh":"抗生素的發現永遠改變了現代醫學的進程。"},{"id":874,"word":"discriminate","pos":"v","meaning":"v. 歧視","example":"It is illegal to discriminate against anyone based on their race or gender.","example_zh":"基於種族或性別而歧視任何人是非法的。"},{"id":875,"word":"discrimination","pos":"n","meaning":"n. 歧視","example":"The organization works hard to fight against all forms of racial discrimination.","example_zh":"該組織努力奮鬥，對抗所有形式的種族歧視。"},{"id":876,"word":"disease","pos":"n","meaning":"n. 疾病","example":"Regular handwashing is a simple way to prevent the spread of infectious disease.","example_zh":"定期洗手是預防傳染病傳播的簡單方法。"},{"id":877,"word":"disguise","pos":"v","meaning":"v. 掩飾；偽裝","example":"The spy used a fake mustache to disguise himself so he wouldn't be recognized.","example_zh":"間諜用假鬍子偽裝自己，以免被認出來。"},{"id":878,"word":"disgust","pos":"v","meaning":"v. 厭惡 (n) 厭惡","example":"I felt a sense of disgust when I saw how dirty the kitchen had become.","example_zh":"當我看到廚房變得有多髒時，我感到一陣厭惡。"},{"id":879,"word":"disk/disc","pos":"n","meaning":"n. 碟片；唱片","example":"You can save all your important files on this small portable disk.","example_zh":"你可以將所有重要檔案儲存在這張小型的可攜式碟片上。"},{"id":880,"word":"dislike","pos":"v","meaning":"v. 不喜歡 (n) 不喜歡；厭惡","example":"I really dislike waking up early on cold winter mornings.","example_zh":"我真的很不喜歡在寒冷的冬日早晨早起。"},{"id":881,"word":"dismiss","pos":"v","meaning":"v. 解散；解雇","example":"The judge decided to dismiss the case because there was not enough evidence.","example_zh":"法官因證據不足而決定駁回此案。"},{"id":882,"word":"disorder","pos":"n","meaning":"n. 混亂；病","example":"The room was in complete disorder after the children finished playing.","example_zh":"孩子們玩耍過後，房間裡一片混亂。"},{"id":883,"word":"display","pos":"v/n","meaning":"v/n. 陳列，展出；顯示","example":"The museum will display the collection of ancient paintings starting next week.","example_zh":"博物館將從下週開始展出那批古代畫作。"},{"id":884,"word":"dispute","pos":"v","meaning":"v. 爭吵；爭論 (n) 爭論；爭執","example":"The neighbors had a heated dispute over where to build the new fence.","example_zh":"鄰居們對於新圍欄該建在哪裡發生了激烈的爭論。"},{"id":885,"word":"distinct","pos":"adj","meaning":"adj. 清晰易辨的；不同的","example":"The two brothers have distinct personalities: one is outgoing, and the other is quiet.","example_zh":"這對兄弟有著截然不同的個性：一個外向，另一個安靜。"},{"id":886,"word":"distinction","pos":"n","meaning":"n. 差別，區別；優秀，傑出","example":"She graduated with distinction, which means she had the highest grades in her class.","example_zh":"她以優異的成績畢業，這意味著她是班上成績最好的。"},{"id":887,"word":"distinctive","pos":"adj","meaning":"adj. 有特色的，獨特的","example":"The peacock is famous for its distinctive and colorful tail feathers.","example_zh":"孔雀以其獨特且色彩鮮豔的尾羽而聞名。"},{"id":888,"word":"distinctly","pos":"adv","meaning":"adv. 顯然地，清楚地","example":"I distinctly remember locking the door before I left the house this morning.","example_zh":"我清楚地記得今天早上離開家之前鎖了門。"},{"id":889,"word":"distinguish","pos":"v","meaning":"v. 分辨；區別；使有別於","example":"It is sometimes difficult to distinguish between truth and lies on the internet.","example_zh":"有時很難分辨網路上的真假資訊。"},{"id":890,"word":"distinguished","pos":"adj","meaning":"adj. 著名的；傑出的","example":"The event was attended by many distinguished guests, including the president.","example_zh":"許多傑出的嘉賓參加了這場活動，包括總統。"},{"id":891,"word":"distinguishing","pos":"adj","meaning":"adj. 特殊的；區別性的","example":"The most distinguishing feature of this plant is its bright purple leaves.","example_zh":"這種植物最特殊的特徵就是它鮮紫色的葉子。"},{"id":892,"word":"distribute","pos":"v","meaning":"v. 分發；分配","example":"The volunteers will distribute food and water to the people in the shelter.","example_zh":"志工們將會分發食物與水給收容所的人們。"},{"id":893,"word":"distribution","pos":"n","meaning":"n. 分布；分配；分發","example":"The government is responsible for the fair distribution of wealth in the country.","example_zh":"政府有責任確保國家財富的公平分配。"},{"id":894,"word":"district","pos":"n","meaning":"n. 地區；地域","example":"She lives in a quiet residential district on the outskirts of the city.","example_zh":"她住在城市邊緣一個安靜的住宅區。"},{"id":895,"word":"disturb","pos":"v","meaning":"v. 干擾；打擾","example":"Please try not to disturb the baby while he is sleeping.","example_zh":"請試著不要在嬰兒睡覺時打擾他。"},{"id":896,"word":"ditch","pos":"n","meaning":"n. 水溝；壕溝","example":"The car accidentally drove into a ditch by the side of the road.","example_zh":"那輛車不小心開進了路邊的水溝。"},{"id":897,"word":"dive","pos":"v","meaning":"v. 潛水；跳水 (n) 跳水；潛水","example":"I would love to learn how to dive into the deep end of the pool.","example_zh":"我很想學習如何潛入游泳池的深水區。"},{"id":898,"word":"diverse","pos":"adj","meaning":"adj. 互異的，多樣化的","example":"Our team consists of people with diverse backgrounds and skills.","example_zh":"我們的團隊由擁有多元背景與技能的人組成。"},{"id":899,"word":"diversify","pos":"v","meaning":"v. 使多樣化","example":"The company plans to diversify its products to reach more customers.","example_zh":"公司計畫使產品多樣化，以觸及更多客戶。"},{"id":900,"word":"diversity","pos":"n","meaning":"n. 差異，多樣性","example":"The university promotes cultural diversity by welcoming students from all over the world.","example_zh":"大學透過歡迎來自世界各地的學生來促進文化多樣性。"},{"id":901,"word":"divide","pos":"v","meaning":"v. 劃分","example":"The teacher decided to divide the class into small groups for the project.","example_zh":"老師決定將班級劃分為小組來進行專案。"},{"id":902,"word":"divine","pos":"adj","meaning":"adj. 神的；神聖的","example":"The sunrise over the mountains was a truly divine sight to behold.","example_zh":"山上的日出是一個真正神聖的景象。"},{"id":903,"word":"divorce","pos":"n","meaning":"n. 離婚 (v) 離婚","example":"After many years of conflict, the couple decided to file for divorce.","example_zh":"經過多年的衝突，這對夫妻決定訴請離婚。"},{"id":904,"word":"dock","pos":"n","meaning":"n. 碼頭；修船場","example":"The ship waited at the dock to be loaded with cargo.","example_zh":"船隻在碼頭等待裝載貨物。"},{"id":905,"word":"dodge","pos":"v","meaning":"v. 閃躲；逃避 (n) 閃躲","example":"He managed to dodge the ball just in time during the game.","example_zh":"他在遊戲中及時閃躲掉了球。"},{"id":906,"word":"domestic","pos":"adj","meaning":"adj. 家庭的；國內的","example":"The country is facing some difficult domestic issues, such as unemployment.","example_zh":"這個國家正面臨一些困難的國內議題，例如失業。"},{"id":907,"word":"dominant","pos":"adj","meaning":"adj. 支配的","example":"The dominant strategy in the game is to control the center of the board.","example_zh":"遊戲中佔支配地位的策略是控制棋盤的中心。"},{"id":908,"word":"dominate","pos":"v","meaning":"v. 支配；控制；居主要地位","example":"Large companies often try to dominate the market by lowering their prices.","example_zh":"大公司常試圖透過降低價格來支配市場。"},{"id":909,"word":"donate","pos":"v","meaning":"v. 捐贈，捐獻","example":"Many people donate blood to help those who are in need of a transfusion.","example_zh":"許多人捐血以幫助那些需要輸血的人。"},{"id":910,"word":"donation","pos":"n","meaning":"n. 捐贈，捐款","example":"The charity relies on every small donation to continue its work.","example_zh":"該慈善機構仰賴每一筆小額捐款來持續運作。"},{"id":911,"word":"donor","pos":"n","meaning":"n. 捐贈者","example":"The anonymous donor gave a million dollars to the local hospital.","example_zh":"那位匿名捐贈者給了當地醫院一百萬美元。"},{"id":912,"word":"dorm","pos":"n","meaning":"n. 學生宿舍","example":"He is currently living in a dorm with two other students at the university.","example_zh":"他目前在大學裡與另外兩名學生住在宿舍。"},{"id":913,"word":"dormitory","pos":"n","meaning":"n. 學生宿舍","example":"The new dormitory provides comfortable rooms for all incoming freshmen.","example_zh":"新的學生宿舍為所有即將入學的新生提供舒適的房間。"},{"id":914,"word":"dose","pos":"n","meaning":"n. 一劑 (v) 使服藥","example":"The doctor prescribed the correct dose of medicine for the patient.","example_zh":"醫生為病人開出了正確的藥劑量。"},{"id":915,"word":"doubtful","pos":"adj","meaning":"adj. 可疑的；懷疑的","example":"It is doubtful whether we can finish the project by tomorrow's deadline.","example_zh":"我們是否能在明天的期限前完成專案，令人懷疑。"},{"id":916,"word":"download","pos":"v","meaning":"v. 下載","example":"You can download the software from the company's official website.","example_zh":"你可以從公司的官方網站下載該軟體。"},{"id":917,"word":"doze","pos":"v","meaning":"v. 打瞌睡 (n) 小睡","example":"He started to doze during the long, boring meeting this afternoon.","example_zh":"他今天下午在漫長且無聊的會議中開始打瞌睡。"},{"id":918,"word":"draft","pos":"n","meaning":"n. 初稿 (v) 打草稿；草擬","example":"I am currently writing the first draft of my essay for history class.","example_zh":"我目前正在寫歷史課論文的初稿。"},{"id":919,"word":"drag","pos":"v","meaning":"v. 強行拖拉，緩慢進行","example":"The heavy sled was hard to drag across the thick snow.","example_zh":"那個沉重的雪橇很難在厚厚的雪地上拖行。"},{"id":920,"word":"drain","pos":"v","meaning":"v. 排光；流光 (n) 排水管；下水道","example":"Make sure to clear the drain if it gets blocked by leaves.","example_zh":"如果排水管被樹葉堵住了，務必將其清理乾淨。"},{"id":921,"word":"dramatic","pos":"adj","meaning":"adj. 戲劇的；戲劇性的","example":"The play had a dramatic ending that left the audience in shock.","example_zh":"那部戲有一個戲劇性的結局，讓觀眾感到震驚。"},{"id":922,"word":"dread","pos":"n","meaning":"n. 恐懼 (v) 害怕","example":"She began to dread the thought of having to speak in public.","example_zh":"她開始害怕必須在公開場合發言的想法。"},{"id":923,"word":"dreadful","pos":"adj","meaning":"adj. 可怕的","example":"The stormy weather was dreadful, with high winds and heavy rain.","example_zh":"暴風雨天氣相當可怕，伴隨著強風與大雨。"},{"id":924,"word":"drift","pos":"v","meaning":"v. 漂流；漂泊 (n) 漂流","example":"The small boat began to drift away from the shore due to the current.","example_zh":"因為洋流，那艘小船開始漂流，遠離海岸。"},{"id":925,"word":"drill","pos":"v","meaning":"v. 鑽孔；反覆教導；訓練 (n) 鑽孔機；操練；練習","example":"The firefighters conduct a fire drill every month to ensure everyone is prepared.","example_zh":"消防員每個月都會進行消防演練，以確保每個人都做好準備。"},{"id":926,"word":"drip","pos":"v","meaning":"v. 滴 (n) 水滴（聲）","example":"I could hear the constant drip of water from the broken faucet in the kitchen.","example_zh":"我能聽到廚房壞掉的水龍頭傳來不斷的滴水聲。"},{"id":927,"word":"drive … out","pos":"phr","meaning":"phr. 驅離","example":"The goal of the project is to drive out invasive species that harm local plants.","example_zh":"這個專案的目標是驅離危害當地植物的外來物種。"}]},
{"unit":8,"unit_label":"p.15-16","words":[{"id":928,"word":"drive off","pos":"phr","meaning":"phr. （車輛）開走","example":"As we waited, we saw him drive off in his new sports car.","example_zh":"在等待時，我們看著他開著新跑車駛離。"},{"id":929,"word":"drown","pos":"v","meaning":"v. 淹死；淹沒；蓋過","example":"The loud music was enough to drown out the sound of the rain outside.","example_zh":"音樂大聲到足以蓋過外面的雨聲。"},{"id":930,"word":"drowsy","pos":"adj","meaning":"adj. 昏昏欲睡的","example":"She felt drowsy after taking the cold medicine in the morning.","example_zh":"她在早上吃了感冒藥後感到昏昏欲睡。"},{"id":931,"word":"drunk","pos":"adj","meaning":"adj. 醉的 (n) 酒鬼","example":"It is dangerous and illegal to drive while you are drunk.","example_zh":"酒醉駕車既危險又不合法。"},{"id":932,"word":"due","pos":"adj","meaning":"adj. 到期的","example":"The final payment for the house is due on the first of next month.","example_zh":"房子的最後一筆款項在下個月初到期。"},{"id":933,"word":"dump","pos":"v","meaning":"v. 傾倒；遺棄 (n) 垃圾場","example":"Please do not dump your trash in this area; there is a proper waste site nearby.","example_zh":"請不要將垃圾傾倒在此區域；附近有合適的垃圾處理場。"},{"id":934,"word":"durable","pos":"adj","meaning":"adj. 持久的；耐用的","example":"We bought these sturdy boots because they are known to be very durable.","example_zh":"我們買了這些耐用的靴子，因為它們以非常持久耐用而聞名。"},{"id":935,"word":"duration","pos":"n","meaning":"n. 持續的期間","example":"The total duration of the flight is about twelve hours.","example_zh":"航班的總持續時間大約是十二小時。"},{"id":936,"word":"dust","pos":"n","meaning":"n. 灰塵 (v) 除去灰塵；撣去","example":"Please dust the shelves and clean the desk before the guests arrive.","example_zh":"請在客人抵達前撣去架上的灰塵並清理書桌。"},{"id":937,"word":"dusty","pos":"adj","meaning":"adj. 佈滿灰塵的","example":"The old attic was very dusty because it hadn't been cleaned in years.","example_zh":"那間舊閣樓佈滿灰塵，因為已經好幾年沒清理了。"},{"id":938,"word":"duty","pos":"n","meaning":"n. 職責，義務","example":"It is our duty to protect the environment for future generations.","example_zh":"保護環境以留給後代是我們的職責。"},{"id":939,"word":"DVD (=digital video disk)","pos":"n","meaning":"n. 數位影音光碟","example":"We watched a movie on DVD that we bought at the store.","example_zh":"我們看了在商店買的 DVD 電影。"},{"id":940,"word":"dye","pos":"v","meaning":"v. 染色 (n) 染料","example":"She decided to dye her hair a bright color for the summer festival.","example_zh":"她決定為了夏季祭典將頭髮染成鮮豔的顏色。"},{"id":941,"word":"dynamic","pos":"adj","meaning":"adj. 有活力的；動態的；動力的","example":"He is a dynamic leader who always has new and exciting ideas.","example_zh":"他是一位有活力的領導者，總是有新奇且令人興奮的想法。"},{"id":942,"word":"dynasty","pos":"n","meaning":"n. 朝代","example":"The Ming dynasty is well-known for its beautiful porcelain work.","example_zh":"明朝以其美麗的瓷器作品聞名。"},{"id":943,"word":"eager","pos":"adj","meaning":"adj. 熱切的；渴望的","example":"The students were eager to start their new science project.","example_zh":"學生們熱切地想要開始他們的新科學專案。"},{"id":944,"word":"earn","pos":"v","meaning":"v. 贏得，博得；賺錢","example":"You need to work hard if you want to earn enough money for your education.","example_zh":"如果你想賺足教育費用，就必須努力工作。"},{"id":945,"word":"earnest","pos":"adj","meaning":"adj. 認真的 (n) 認真；誠摯","example":"He made an earnest effort to apologize to his friend for his mistake.","example_zh":"他認真地努力向朋友為自己的錯誤道歉。"},{"id":946,"word":"earnings","pos":"n","meaning":"n. 薪水；工資","example":"After tax, his monthly earnings are just enough to cover his basic expenses.","example_zh":"稅後，他的每月薪水剛好足夠支付基本開支。"},{"id":947,"word":"earphone","pos":"n","meaning":"n. 耳機","example":"She put on her earphone to listen to music while she was on the train.","example_zh":"她戴上耳機，在火車上聽音樂。"},{"id":948,"word":"echo","pos":"n","meaning":"n. 回音 (v) 發出回音","example":"If you shout into the canyon, you can hear your own voice echo back.","example_zh":"如果你對著峽谷大喊，你能聽到自己的聲音傳出回音。"},{"id":949,"word":"eclipse","pos":"n","meaning":"n. 日蝕，月蝕，(vt) 使黯然失色","example":"The team's success this year helped eclipse their performance from last year.","example_zh":"今年團隊的成功使他們去年的表現顯得黯然失色。"},{"id":950,"word":"economic","pos":"adj","meaning":"adj. 經濟的；經濟學的","example":"The government is discussing new economic policies to help small businesses.","example_zh":"政府正在討論新的經濟政策以幫助小型企業。"},{"id":951,"word":"economical","pos":"adj","meaning":"adj. 節儉的；節省的","example":"It is economical to buy items in bulk when you have a large family.","example_zh":"對大家庭來說，批量購買物品很節省。"},{"id":952,"word":"economics","pos":"n","meaning":"n. 經濟（學）","example":"She decided to study economics because she is interested in how markets work.","example_zh":"她決定研究經濟學，因為她對市場運作方式很感興趣。"},{"id":953,"word":"economist","pos":"n","meaning":"n. 經濟學家","example":"The economist predicted that the stock market would rise in the coming months.","example_zh":"那位經濟學家預測股市將在未來幾個月內上漲。"},{"id":954,"word":"economy","pos":"n","meaning":"n. 經濟（制度）","example":"The country is trying to build a stronger economy by increasing its exports.","example_zh":"國家正試圖透過增加出口來建立更強健的經濟。"},{"id":955,"word":"edit","pos":"v","meaning":"v. 編輯","example":"She had to edit the manuscript before it could be sent to the publisher.","example_zh":"在手稿送往出版商前，她必須先進行編輯。"},{"id":956,"word":"edition","pos":"n","meaning":"n. 版；版本","example":"Have you read the latest edition of this popular book?","example_zh":"你讀過這本熱門書籍的最新版了嗎？"},{"id":957,"word":"editor","pos":"n","meaning":"n. 編輯者","example":"The editor checked the article for any errors before it was printed.","example_zh":"編輯在文章印製前檢查是否有任何錯誤。"},{"id":958,"word":"educate","pos":"v","meaning":"v. 教育","example":"The primary goal of any school should be to educate students to think for themselves.","example_zh":"任何學校的首要目標都應是教育學生獨立思考。"},{"id":959,"word":"educational","pos":"adj","meaning":"adj. 教育的","example":"We visited the museum because it offers many educational exhibits for children.","example_zh":"我們參觀了博物館，因為它為孩子提供許多教育性的展覽。"},{"id":960,"word":"effect","pos":"n","meaning":"n. 影響，效果（+on）","example":"Drinking too much coffee can have a negative effect on your sleep.","example_zh":"喝太多咖啡可能會對你的睡眠產生負面影響。"},{"id":961,"word":"effective","pos":"adj","meaning":"adj. 有效的","example":"The company introduced a more effective way to manage customer orders.","example_zh":"公司引進了一種更有效的方法來管理顧客訂單。"},{"id":962,"word":"efficiency","pos":"n","meaning":"n. 效率","example":"Efficiency is the key to finishing your work in a short amount of time.","example_zh":"效率是在短時間內完成工作的關鍵。"},{"id":963,"word":"efficient","pos":"adj","meaning":"adj. 效率高的","example":"She is an efficient manager who always finds ways to save time and money.","example_zh":"她是一位高效率的經理，總能找到節省時間與金錢的方法。"},{"id":964,"word":"effort","pos":"n","meaning":"n. 嘗試，努力","example":"Your hard work and effort will surely lead to success in the end.","example_zh":"你的努力終究會引領你走向成功。"},{"id":965,"word":"elaborate","pos":"adj","meaning":"adj. 精心製作的 (v) 闡述","example":"Could you please elaborate on what you meant by that statement?","example_zh":"你能闡述一下你那句話是什麼意思嗎？"},{"id":966,"word":"elastic","pos":"adj","meaning":"adj. 有彈性的；靈活的","example":"Rubber is very elastic, which makes it useful for making bands.","example_zh":"橡膠非常有彈性，這使得它在製作橡皮筋時很有用。"},{"id":967,"word":"elbow","pos":"n","meaning":"n. 手肘","example":"He fell and scraped his elbow while riding his bicycle.","example_zh":"他騎腳踏車時摔倒並擦傷了手肘。"},{"id":968,"word":"elder","pos":"adj","meaning":"adj. 年長的(n) 長者","example":"The village elder told stories about the history of their people.","example_zh":"村裡的長者講述著他們族群的歷史故事。"},{"id":969,"word":"elderly","pos":"adj","meaning":"adj. 上了年紀的","example":"The elderly man needs some help to walk down the stairs.","example_zh":"那位上了年紀的老人下樓需要一些協助。"},{"id":970,"word":"election","pos":"n","meaning":"n. 選舉","example":"The country is preparing for a national election that will take place next month.","example_zh":"國家正在準備下個月即將舉行的全國選舉。"},{"id":971,"word":"electric","pos":"adj","meaning":"adj. 用電的；發電的","example":"We need to switch to electric cars to reduce air pollution.","example_zh":"我們需要改用電動車以減少空氣污染。"},{"id":972,"word":"electrician","pos":"n","meaning":"n. 電機師","example":"We called an electrician to fix the broken lights in the kitchen.","example_zh":"我們請了一位電機師來修繕廚房壞掉的燈。"},{"id":973,"word":"electricity","pos":"n","meaning":"n. 電","example":"The power station generates electricity for the entire city.","example_zh":"發電廠為整個城市發電。"},{"id":974,"word":"electronic","pos":"adj","meaning":"adj. 電子的","example":"Electronic devices have made our daily tasks much easier to complete.","example_zh":"電子設備使得我們的日常工作更容易完成。"},{"id":975,"word":"electronics","pos":"n","meaning":"n. 電子學","example":"He is studying electronics to become an engineer in the future.","example_zh":"他正在研究電子學，以便未來成為工程師。"},{"id":976,"word":"elegant","pos":"adj","meaning":"adj. 優雅的；優美的","example":"She looked elegant in her formal dress at the wedding reception.","example_zh":"她在婚禮接待會上穿著正式禮服，看起來很優雅。"},{"id":977,"word":"element","pos":"n","meaning":"n. 元素，要素，成分","example":"Water is a basic element that is necessary for all forms of life.","example_zh":"水是所有生命形式必需的基本元素。"},{"id":978,"word":"elementary","pos":"adj","meaning":"adj. 基本的","example":"We started with the elementary concepts of math before moving to harder problems.","example_zh":"我們從數學的基本概念開始，才進入更難的問題。"},{"id":979,"word":"eligible","pos":"adj","meaning":"adj. 合格的，有資格的","example":"You must meet certain requirements to be eligible for the scholarship.","example_zh":"你必須符合特定條件才有資格獲得獎學金。"},{"id":980,"word":"eliminate","pos":"v","meaning":"v. 淘汰；消除；排除","example":"The sports club decided to eliminate the oldest rules from the game.","example_zh":"運動俱樂部決定從遊戲中淘汰掉最舊的規則。"},{"id":981,"word":"elsewhere","pos":"adv","meaning":"adv. 在別處","example":"Since the library is closed, you might be able to find that book elsewhere.","example_zh":"因為圖書館關閉了，你也許能在別處找到那本書。"},{"id":982,"word":"e-mail","pos":"n","meaning":"n. 電子郵件","example":"I will send you the project details via e-mail by the end of the day.","example_zh":"我會在今天結束前透過電子郵件將專案細節寄給你。"},{"id":983,"word":"embark on","pos":"phr","meaning":"phr. 開始，著手","example":"The company is ready to embark on a new adventure in international trade.","example_zh":"公司已準備好在國際貿易中開始一場新冒險。"},{"id":984,"word":"embarrass","pos":"v","meaning":"v. 使難堪","example":"He didn't mean to embarrass her by pointing out her small mistake.","example_zh":"他並非故意指出她的小錯誤而讓她難堪。"},{"id":985,"word":"embarrassed","pos":"adj","meaning":"adj. 難堪的，尷尬的","example":"She felt embarrassed when she realized she had walked into the wrong room.","example_zh":"當她意識到自己走錯房間時，她感到很尷尬。"},{"id":986,"word":"embarrassing","pos":"adj","meaning":"adj. 令人難為情的","example":"It was an embarrassing moment when he forgot his lines on stage.","example_zh":"當他在舞台上忘詞時，那是個令人難為情的時刻。"},{"id":987,"word":"embarrassment","pos":"n","meaning":"n. 難堪，尷尬","example":"He tried to hide his embarrassment by laughing at his own mistake.","example_zh":"他試圖透過嘲笑自己的錯誤來掩飾他的尷尬。"},{"id":988,"word":"embassy","pos":"n","meaning":"n. 大使館","example":"The ambassador lives and works at the embassy in the capital city.","example_zh":"大使住在首都的大使館並在那裡工作。"},{"id":989,"word":"embrace","pos":"n/v","meaning":"n/v. 擁抱","example":"They met at the airport and shared a warm embrace.","example_zh":"他們在機場見面並分享了一個溫暖的擁抱。"},{"id":990,"word":"emerge","pos":"v","meaning":"v. 出現；露出","example":"The sun began to emerge from behind the dark clouds.","example_zh":"太陽開始從烏雲後露出。"},{"id":991,"word":"emergency","pos":"n","meaning":"n. 緊急事件","example":"In case of an emergency, please call the local rescue team immediately.","example_zh":"如果發生緊急事件，請立即撥打當地救援隊電話。"},{"id":992,"word":"emotional","pos":"adj","meaning":"adj. 情緒化的；激動的；情緒的；感情的","example":"It is normal to feel emotional after such a long and tiring journey.","example_zh":"在如此漫長且疲憊的旅程後感到情緒激動是很正常的。"},{"id":993,"word":"emperor","pos":"n","meaning":"n. 皇帝","example":"The emperor ruled over the empire with great power and authority.","example_zh":"皇帝以強大的權力與威信統治著帝國。"},{"id":994,"word":"emphasis","pos":"n","meaning":"n. 強調；加強","example":"The professor put a lot of emphasis on the importance of reading primary sources.","example_zh":"教授非常強調閱讀原始文獻的重要性。"},{"id":995,"word":"emphasize","pos":"v","meaning":"v. 強調","example":"You should emphasize the main points when you give your presentation.","example_zh":"你在簡報時應該強調重點。"},{"id":996,"word":"emphatic","pos":"adj","meaning":"adj. 強調的","example":"She made an emphatic statement that she would not change her mind.","example_zh":"她做了一個強調的聲明，表示她不會改變心意。"},{"id":997,"word":"emphatically","pos":"adv","meaning":"adv. 斷然地，堅決地","example":"He stood up and emphatically denied that he was involved in the crime.","example_zh":"他站起來並斷然地否認他涉入那起犯罪。"},{"id":998,"word":"empire","pos":"n","meaning":"n. 帝國","example":"The Roman empire was one of the most powerful empires in ancient history.","example_zh":"羅馬帝國是古代歷史上最強大的帝國之一。"},{"id":999,"word":"employ","pos":"v","meaning":"v. 雇用；使用；利用","example":"The company plans to employ more staff to handle the increase in work.","example_zh":"公司計畫雇用更多員工來處理增加的工作。"},{"id":1000,"word":"employee","pos":"n","meaning":"n. 雇員","example":"The company has over five hundred employees working in its headquarters.","example_zh":"該公司有超過五百名雇員在總部工作。"},{"id":1001,"word":"employer","pos":"n","meaning":"n. 雇主","example":"A good employer should care about the well-being of their workers.","example_zh":"一位好的雇主應該關心他們員工的福祉。"},{"id":1002,"word":"employment","pos":"n","meaning":"n. 工作，職業","example":"The government is launching a new program to increase the rate of employment.","example_zh":"政府正在啟動一項新計畫以提高就業率。"},{"id":1003,"word":"empty","pos":"adj","meaning":"adj. 空的 (v) 倒空","example":"Please empty your pockets before you go through the metal detector.","example_zh":"請在通過金屬探測器前將你的口袋清空。"},{"id":1004,"word":"enable","pos":"v","meaning":"v. 使能夠","example":"This new software will enable you to work more efficiently from home.","example_zh":"這套新軟體將能使你更有效率地在家工作。"},{"id":1005,"word":"enclose","pos":"v","meaning":"v. 圍繞；包圍；附寄","example":"I have enclosed a copy of my resume with this letter for your review.","example_zh":"我已將履歷副本附寄於此信中供您參閱。"},{"id":1006,"word":"encounter","pos":"v","meaning":"v. 遭遇；偶遇；邂逅 (n) 偶遇","example":"We didn't expect to encounter so many problems on the first day of the project.","example_zh":"我們沒預料到在專案第一天就會遭遇這麼多問題。"},{"id":1007,"word":"encourage","pos":"v","meaning":"v. 鼓勵","example":"My parents always encourage me to pursue my dreams no matter how difficult they seem.","example_zh":"無論夢想看起來多困難，我的父母總是鼓勵我追求它們。"},{"id":1008,"word":"encouragement","pos":"n","meaning":"n. 鼓勵","example":"Your kind words of encouragement gave me the strength to keep going.","example_zh":"你那友善的鼓勵言語給了我繼續前進的力量。"},{"id":1009,"word":"end up (+Ving)","pos":"phr","meaning":"phr. 結果變成，最終變成","example":"If you don't study for the exam, you might end up failing the course.","example_zh":"如果你不為考試讀書，你最後可能會導致課程不及格。"},{"id":1010,"word":"endanger","pos":"v","meaning":"v. 危害","example":"Pollution from the factory continues to endanger the health of local residents.","example_zh":"工廠的污染持續危害著當地居民的健康。"},{"id":1011,"word":"endangered","pos":"adj","meaning":"adj. 瀕臨絕種的","example":"The panda is one of the many endangered species that need protection.","example_zh":"大貓熊是許多需要保護的瀕臨絕種生物之一。"},{"id":1012,"word":"endurable","pos":"adj","meaning":"adj. 可忍受的","example":"The pain from the injury was barely endurable, so he went to the hospital.","example_zh":"受傷的疼痛幾乎難以忍受，所以他去了醫院。"},{"id":1013,"word":"endurance","pos":"n","meaning":"n. 忍受","example":"Running a marathon requires a great deal of physical endurance.","example_zh":"跑馬拉松需要極大的體力忍耐力。"},{"id":1014,"word":"endure","pos":"v","meaning":"v. 忍耐；持久","example":"She had to endure hours of training to prepare for the athletic competition.","example_zh":"她必須忍耐數小時的訓練來為運動競賽做準備。"},{"id":1015,"word":"enduring","pos":"adj","meaning":"adj. 持久的，永久性的","example":"Their friendship is based on an enduring bond that has lasted for decades.","example_zh":"他們的友誼建立在持續數十年的永久性紐帶上。"},{"id":1016,"word":"energetic","pos":"adj","meaning":"adj. 精力充沛的","example":"He is a very energetic child who loves to play soccer after school.","example_zh":"他是一個非常有活力的小孩，放學後喜歡踢足球。"},{"id":1017,"word":"energy","pos":"n","meaning":"n. 精力，能源","example":"Renewable energy, like solar and wind power, is essential for a greener future.","example_zh":"像太陽能和風力發電這樣的再生能源，對於更綠色的未來至關重要。"},{"id":1018,"word":"enforce","pos":"v","meaning":"v. 實施；執行；強迫","example":"The police have a duty to enforce the law to maintain public safety.","example_zh":"警方有責任執行法律以維護公共安全。"},{"id":1019,"word":"engage","pos":"v","meaning":"v. 使從事；吸引；使訂婚","example":"I tried to engage the students in a discussion about the importance of history.","example_zh":"我試圖讓學生們參與關於歷史重要性的討論。"},{"id":1020,"word":"engaged","pos":"adj","meaning":"adj. 已訂婚的，忙於（某事）的","example":"They are happily engaged and plan to get married early next year.","example_zh":"他們已快樂地訂婚，並計畫明年年初結婚。"},{"id":1021,"word":"engagement","pos":"n","meaning":"n. 訂婚","example":"They celebrated their engagement with a party for family and friends.","example_zh":"他們舉辦了派對與親友慶祝他們的訂婚。"},{"id":1022,"word":"engine","pos":"n","meaning":"n. 引擎","example":"The airplane engine started making a strange noise during the flight.","example_zh":"飛行中，飛機引擎開始發出奇怪的噪音。"},{"id":1023,"word":"engineer","pos":"n","meaning":"n. 工程師","example":"He wants to become an engineer to build better bridges for the city.","example_zh":"他想成為一名工程師，為城市建造更好的橋樑。"},{"id":1024,"word":"engineering","pos":"n","meaning":"n. 工程（學）","example":"Engineering is a challenging but very rewarding field of study.","example_zh":"工程學是一門充滿挑戰但非常有收穫的研究領域。"},{"id":1025,"word":"enhance","pos":"v","meaning":"v. 提高，增強","example":"These new glasses will enhance your ability to read in low light.","example_zh":"這副新眼鏡將增強你在低光源下的閱讀能力。"},{"id":1026,"word":"enhancement","pos":"n","meaning":"n. 提高，增強","example":"The new software update provides a significant enhancement to system performance.","example_zh":"新的軟體更新為系統效能提供了顯著的提升。"},{"id":1027,"word":"enjoyable","pos":"adj","meaning":"adj. 愉快的；有趣的","example":"We had an enjoyable weekend visiting the mountains and relaxing by the lake.","example_zh":"我們在造訪山區與在湖邊放鬆中度過了一個愉快的週末。"},{"id":1028,"word":"enlarge","pos":"v","meaning":"v. 增大；放大","example":"The photographer decided to enlarge the photo so it would fit the frame.","example_zh":"攝影師決定放大那張照片，這樣它才放得進相框。"},{"id":1029,"word":"enormous","pos":"adj","meaning":"adj. 極大的；巨大的","example":"The company made an enormous profit from its new product line this year.","example_zh":"公司今年從其新產品線中獲取了巨大的利潤。"},{"id":1030,"word":"entertain","pos":"v","meaning":"v. 娛樂；招待","example":"She likes to entertain guests by cooking delicious meals at home.","example_zh":"她喜歡在家烹飪美味佳餚來招待客人。"},{"id":1031,"word":"entertaining","pos":"adj","meaning":"adj. 有娛樂效果的","example":"It was a very entertaining movie that kept everyone laughing until the end.","example_zh":"這是一部非常有趣的電影，讓大家從頭笑到尾。"},{"id":1032,"word":"entertainment","pos":"n","meaning":"n. 娛樂","example":"Watching plays and movies is a popular form of entertainment for many people.","example_zh":"對許多人來說，看戲劇和電影是一種流行的娛樂形式。"},{"id":1033,"word":"enthusiasm","pos":"n","meaning":"n. 熱心；熱誠","example":"His enthusiasm for learning new languages is truly inspiring.","example_zh":"他對學習新語言的熱誠真的非常激勵人心。"},{"id":1034,"word":"entire","pos":"adj","meaning":"adj. 全部的，整個的","example":"He spent the entire day cleaning his house from top to bottom.","example_zh":"他花了一整天的時間從頭到尾打掃房子。"},{"id":1035,"word":"entirely","pos":"adv","meaning":"adv. 完全地","example":"I entirely agree with your opinion on this matter.","example_zh":"我完全同意你對這件事的看法。"},{"id":1036,"word":"entirety","pos":"n","meaning":"n. 整體，全部","example":"We need to consider the problem in its entirety, not just one part of it.","example_zh":"我們需要將這個問題視為整體來考量，而非僅僅是其中一部分。"},{"id":1037,"word":"entitle","pos":"vt","meaning":"vt. 給權利；給題名，給稱號","example":"The book is entitled \"The Great Journey\" and tells the story of a long adventure.","example_zh":"這本書題名為《偉大的旅程》，講述了一段漫長冒險的故事。"},{"id":1038,"word":"entrance","pos":"vt","meaning":"vt. 使某人陶醉，令某人出神","example":"The audience was completely entranced by the beautiful music.","example_zh":"觀眾完全被那美妙的音樂給陶醉了。"},{"id":1039,"word":"entrancing","pos":"adj","meaning":"adj. 使人入神的，使某人陶醉的","example":"The sunset was an entrancing view that no one wanted to miss.","example_zh":"夕陽是一個令人入神的景象，沒有人想錯過。"},{"id":1040,"word":"entry","pos":"n","meaning":"n. 進入；加入；項目；入口","example":"Please sign your name in the guest entry book before entering the museum.","example_zh":"請在進入博物館前在訪客項目簿簽名。"},{"id":1041,"word":"envious","pos":"adj","meaning":"adj. 羨慕的","example":"She felt envious of her friend's new bicycle.","example_zh":"她對朋友的新腳踏車感到羨慕。"},{"id":1042,"word":"environment","pos":"n","meaning":"n. 環境","example":"We all have a responsibility to keep our environment clean and safe.","example_zh":"我們大家都有責任保持我們的環境潔淨與安全。"},{"id":1043,"word":"environmental","pos":"adj","meaning":"adj. 環境的","example":"Protecting the ozone layer is an important environmental issue today.","example_zh":"保護臭氧層是現今一個重要的環境議題。"},{"id":1044,"word":"envy","pos":"v","meaning":"v. 羨慕；嫉妒 (n) 羨慕；嫉妒","example":"You don't need to envy others; focus on your own progress instead.","example_zh":"你不需要羨慕他人；反而應專注於自己的進步。"},{"id":1045,"word":"episode","pos":"n","meaning":"n. 一集（連續劇），一段時間","example":"I missed the first episode of the new show, so I will watch it online later.","example_zh":"我錯過了新節目的第一集，所以我之後會上網看。"},{"id":1046,"word":"equality","pos":"n","meaning":"n. 平等；相等","example":"Equality for all people is a basic principle of a fair society.","example_zh":"對所有人平等是公平社會的基本原則。"},{"id":1047,"word":"equip","pos":"v","meaning":"v. 裝備","example":"The hiking club decided to equip everyone with maps and compasses.","example_zh":"登山社決定為每個人裝備地圖與指南針。"},{"id":1048,"word":"equipment","pos":"n","meaning":"n. 設備，器材","example":"The gym has new equipment that helps people improve their fitness.","example_zh":"健身房有能幫助人們改善體能的新器材。"},{"id":1049,"word":"era","pos":"n","meaning":"n. 時代","example":"The invention of the internet marked the beginning of a new era.","example_zh":"網際網路的發明標誌著一個新時代的開始。"},{"id":1050,"word":"erase","pos":"v","meaning":"v. 擦掉","example":"If you make a mistake, you can simply erase it with your rubber.","example_zh":"如果你犯了錯，你只需用橡皮擦把它擦掉。"},{"id":1051,"word":"errand","pos":"n","meaning":"n. 差事","example":"I have to run an errand for my grandmother this afternoon.","example_zh":"我今天下午必須幫我祖母跑個差事。"},{"id":1052,"word":"erupt","pos":"v","meaning":"v. 突然表達情緒，爆發","example":"He suddenly erupted in laughter after hearing the funny story.","example_zh":"聽到那個有趣的故事後，他突然爆發出大笑。"},{"id":1053,"word":"eruption","pos":"n","meaning":"n. （火山）爆發","example":"The volcanic eruption caused a lot of smoke and ash to cover the sky.","example_zh":"火山爆發導致大量的煙霧與灰燼覆蓋了天空。"},{"id":1054,"word":"escalator","pos":"n","meaning":"n. 手扶梯","example":"You can take the escalator to the second floor of the shopping mall.","example_zh":"你可以搭乘手扶梯前往購物中心的二樓。"},{"id":1055,"word":"escape","pos":"v","meaning":"v. 逃脫；逃避 (n) 逃脫；逃避","example":"The criminal managed to escape from prison through a small window.","example_zh":"那名罪犯設法從監獄的小窗戶逃脫。"},{"id":1056,"word":"essay","pos":"n","meaning":"n. 論文；散文","example":"The students were asked to write a short essay about their summer vacation.","example_zh":"學生們被要求寫一篇關於他們暑假的短論文。"},{"id":1057,"word":"essence","pos":"n","meaning":"n. 本質","example":"The essence of a good friendship is trust and mutual support.","example_zh":"好友誼的本質是信任與互助。"},{"id":1058,"word":"essential","pos":"adj","meaning":"adj. 必要的 (n) 必需品；要點；要素","example":"Hard work and dedication are essential for achieving long-term success.","example_zh":"努力與奉獻對於達成長期成功是必要的。"},{"id":1059,"word":"establish","pos":"v","meaning":"v. 建立；確立；使立足於","example":"The two companies decided to establish a partnership to work on the project.","example_zh":"兩家公司決定建立夥伴關係來進行該專案。"},{"id":1060,"word":"estimate","pos":"v","meaning":"v. 估計；評定 (n) 估計","example":"Can you estimate how long it will take to complete the construction?","example_zh":"你能估計完成這項建造工程需要多久嗎？"},{"id":1061,"word":"evaluate","pos":"v","meaning":"v. 評估","example":"The teacher will evaluate your work based on your creativity and effort.","example_zh":"老師將根據你的創造力與努力來評估你的作品。"},{"id":1062,"word":"evaluation","pos":"n","meaning":"n. 評估","example":"After a thorough evaluation of the plan, we decided to proceed.","example_zh":"在對該計畫進行徹底評估後，我們決定繼續進行。"},{"id":1063,"word":"eve","pos":"n","meaning":"n. 前夕","example":"Everyone was excited on the eve of the school's annual festival.","example_zh":"在學校年度祭典的前夕，大家都感到很興奮。"},{"id":1064,"word":"even though","pos":"phr","meaning":"phr. 即使","example":"Even though it was raining, they still went for a walk in the park.","example_zh":"即使在下雨，他們仍去公園散步。"},{"id":1065,"word":"eventual","pos":"adj","meaning":"adj. 結果的；最後的","example":"The eventual winner of the contest will receive a prize of one thousand dollars.","example_zh":"比賽的最後優勝者將獲得一千美元的獎品。"},{"id":1066,"word":"every now and then","pos":"phr","meaning":"phr. 偶爾 (=from time to time)","example":"I see my old friend every now and then when I visit my hometown.","example_zh":"當我造訪家鄉時，我偶爾會見到我的老朋友。"},{"id":1067,"word":"evidence","pos":"n","meaning":"n. 證據","example":"The police found enough evidence to prove that he was innocent.","example_zh":"警方找到了足夠的證據證明他是清白的。"}]},
{"unit":9,"unit_label":"p.17-18","words":[{"id":1068,"word":"evident","pos":"adj","meaning":"adj. 明顯的","example":"It was evident from her smile that she was happy with the results.","example_zh":"從她的微笑明顯可以看出她對結果感到滿意。"},{"id":1069,"word":"evil","pos":"adj","meaning":"adj. 不道德的；邪惡的 (n) 邪惡","example":"He believed that greed is the root of much evil in the world.","example_zh":"他相信貪婪是世上許多邪惡的根源。"},{"id":1070,"word":"exact","pos":"adj","meaning":"adj. 確切的","example":"Can you give me the exact time the train is scheduled to arrive?","example_zh":"你能給我火車預定抵達的確切時間嗎？"},{"id":1071,"word":"exactly","pos":"adv","meaning":"adv. 確切地","example":"That is exactly what I was trying to say earlier.","example_zh":"那正是我稍早試圖要表達的。"},{"id":1072,"word":"exaggerate","pos":"v","meaning":"v. 誇張；誇大","example":"Some people like to exaggerate their achievements to impress others.","example_zh":"有些人喜歡誇大他們的成就來給別人留下深刻印象。"},{"id":1073,"word":"exaggerated","pos":"adj","meaning":"adj. 誇張的，言過其實的","example":"The news report was criticized for using exaggerated claims to attract readers.","example_zh":"那篇新聞報導因為使用誇張的說法來吸引讀者而受到批評。"},{"id":1074,"word":"exaggeration","pos":"n","meaning":"n. 誇張，言過其實","example":"It is no exaggeration to say that this invention changed the world.","example_zh":"說這項發明改變了世界一點也不誇張。"},{"id":1075,"word":"examinee","pos":"n","meaning":"n. 應試者","example":"Every examinee must bring their identification card to the testing center.","example_zh":"每位應試者都必須帶身分證件到考場。"},{"id":1076,"word":"examiner","pos":"n","meaning":"n. 檢查員；審查員","example":"The examiner asked the candidate a few more questions before finishing the interview.","example_zh":"考官在結束面試前又問了候選人幾個問題。"},{"id":1077,"word":"exceed","pos":"v","meaning":"v. 超過","example":"You must not exceed the speed limit when driving on the highway.","example_zh":"在高速公路上駕駛時，你不得超過速限。"},{"id":1078,"word":"excel","pos":"v","meaning":"v. 擅長；勝過","example":"She hopes to excel in mathematics and eventually become a scientist.","example_zh":"她希望能擅長數學，並最終成為一名科學家。"},{"id":1079,"word":"excellence","pos":"n","meaning":"n. 卓越；優秀","example":"The school is known for its excellence in teaching and research.","example_zh":"該校以其卓越的教學與研究聞名。"},{"id":1080,"word":"exception","pos":"n","meaning":"n. 例外","example":"Everyone must follow the rules, and there will be no exception.","example_zh":"每個人都必須遵守規則，沒有例外。"},{"id":1081,"word":"exceptional","pos":"adj","meaning":"adj. 例外的，異常的，特別的","example":"She is an exceptional student who consistently gets top grades.","example_zh":"她是一位表現優異的學生，總是拿到最高分。"},{"id":1082,"word":"excerpt","pos":"v/n","meaning":"v/n. 摘錄；引用","example":"The teacher read a short excerpt from the novel to the class.","example_zh":"老師向全班朗讀了小說的一小段摘錄。"},{"id":1083,"word":"exchange","pos":"v","meaning":"v. 交換；交流 (n) 交換；交流","example":"The student exchange program allows students to study in another country for a year.","example_zh":"學生交流計畫讓學生能到另一個國家學習一年。"},{"id":1084,"word":"exclude","pos":"vt","meaning":"vt. 把～排除在外","example":"We should not exclude anyone from the group based on their background.","example_zh":"我們不該因背景而將任何人排除在團體之外。"},{"id":1085,"word":"excluding","pos":"prep","meaning":"prep. 不包括","example":"Excluding today, we have only two days left to finish the assignment.","example_zh":"不包括今天，我們只剩下兩天時間完成作業。"},{"id":1086,"word":"exclusive","pos":"adj","meaning":"adj. 排外的， 獨有的","example":"This club offers exclusive membership to people who meet certain criteria.","example_zh":"這個俱樂部提供符合特定條件的人獨有的會員資格。"},{"id":1087,"word":"exclusively","pos":"adv","meaning":"adv. 專用地，獨有地","example":"This area is reserved exclusively for staff members.","example_zh":"此區域專供員工使用。"},{"id":1088,"word":"execute","pos":"vt","meaning":"vt. 執行，實行，處死","example":"The government plans to execute the new plan by the end of this year.","example_zh":"政府計畫在今年底執行新方案。"},{"id":1089,"word":"execution","pos":"n","meaning":"n. 執行、處決","example":"The successful execution of the project depends on everyone working together.","example_zh":"專案的成功執行取決於大家的合作。"},{"id":1090,"word":"executive","pos":"n","meaning":"n. 高級主管","example":"The executive made the final decision about the new business strategy.","example_zh":"那位高級主管對新的商業策略做了最終決定。"},{"id":1091,"word":"exert","pos":"v","meaning":"v. 施加，運用","example":"You need to exert more effort if you want to achieve your goals.","example_zh":"如果你想達成目標，就需要施加更多的努力。"},{"id":1092,"word":"exhaust","pos":"v","meaning":"v. 使筋疲力竭；用盡；耗盡 (n) 廢氣","example":"After the long climb, I felt completely exhausted.","example_zh":"在那段漫長的攀登後，我感到筋疲力竭。"},{"id":1093,"word":"exhausted","pos":"adj","meaning":"adj. 疲憊不堪的，筋疲力盡的","example":"The exhaust from the cars contributes to air pollution in the city.","example_zh":"汽車排放的廢氣導致了城市的空氣污染。"},{"id":1094,"word":"exhausting","pos":"adj","meaning":"adj. 令人疲憊不堪的","example":"It was an exhausting day, and I am ready to go to sleep.","example_zh":"那是令人疲憊不堪的一天，我準備睡覺了。"},{"id":1095,"word":"exhibit","pos":"v","meaning":"v. 展覽；顯示 (n) 展覽（品）","example":"The museum will exhibit the artist's new paintings next month.","example_zh":"博物館下個月將展出該藝術家的新畫作。"},{"id":1096,"word":"exhibition","pos":"n","meaning":"n. 展覽（會）","example":"We attended an art exhibition and saw many beautiful works of art.","example_zh":"我們參加了一場藝術展覽，看到了許多美麗的藝術品。"},{"id":1097,"word":"existence","pos":"n","meaning":"n. 存在","example":"The existence of life on other planets is still a mystery.","example_zh":"其他行星上是否存在生命仍是一個謎。"},{"id":1098,"word":"exit","pos":"n","meaning":"n. 出口；離去","example":"The emergency exit is located at the back of the building.","example_zh":"緊急出口位於建築物的後方。"},{"id":1099,"word":"expand","pos":"v","meaning":"v. 擴充；膨脹","example":"The city continues to expand as more people move to the area.","example_zh":"隨著更多人搬遷至此，城市持續在擴充。"},{"id":1100,"word":"expansion","pos":"n","meaning":"n. 擴張；膨脹","example":"The company's rapid expansion into new markets has doubled its revenue.","example_zh":"該公司向新市場的快速擴張使其營收倍增。"},{"id":1101,"word":"expect","pos":"v","meaning":"v. 預期，預料；期待，要求","example":"We expect a large turnout for the charity event this weekend.","example_zh":"我們預期這週末的慈善活動將有許多人出席。"},{"id":1102,"word":"expectation","pos":"n","meaning":"n. 預期；期望","example":"She lived up to everyone's expectation by winning the gold medal.","example_zh":"她贏得金牌，達成了每個人的期望。"},{"id":1103,"word":"expense","pos":"n","meaning":"n. 費用；代價","example":"He paid for the luxury vacation at the expense of his savings.","example_zh":"他以存款作為代價支付了豪華假期。"},{"id":1104,"word":"experiment","pos":"n","meaning":"n. 實驗 (v) 做實驗","example":"The scientists are conducting an experiment to test the new drug.","example_zh":"科學家們正在做一項實驗來測試這種新藥。"},{"id":1105,"word":"experimental","pos":"adj","meaning":"adj. 實驗的","example":"The experimental results showed that the new method is highly effective.","example_zh":"實驗結果顯示該新方法非常有效。"},{"id":1106,"word":"expert","pos":"n","meaning":"n. 專家 (adj) 專業的，熟練的","example":"If you have a computer problem, you should ask an expert for help.","example_zh":"如果你有電腦問題，應該請教專家。"},{"id":1107,"word":"explain","pos":"v","meaning":"v. 解釋，說明","example":"Please explain how to solve this difficult math problem.","example_zh":"請說明如何解開這道困難的數學題。"},{"id":1108,"word":"explanation","pos":"n","meaning":"n. 解釋；說明","example":"His explanation for being late was not very convincing to the boss.","example_zh":"他對於遲到的解釋對老闆來說不太具說服力。"},{"id":1109,"word":"explode","pos":"v","meaning":"v. 爆炸","example":"The gas tank could explode if it is exposed to extreme heat.","example_zh":"如果瓦斯桶暴露在極端高溫下可能會爆炸。"},{"id":1110,"word":"exploration","pos":"n","meaning":"n. 探勘，探測","example":"Space exploration has led to many technological breakthroughs.","example_zh":"太空探勘帶來了許多科技上的突破。"},{"id":1111,"word":"explore","pos":"v","meaning":"v. 探索","example":"They decided to explore the unknown forest behind the village.","example_zh":"他們決定去探索村莊後方那片未知的森林。"},{"id":1112,"word":"explorer","pos":"n","meaning":"n. 探險家","example":"The famous explorer discovered a new island during his long voyage.","example_zh":"那位著名的探險家在漫長的航程中發現了一座新島嶼。"},{"id":1113,"word":"explosion","pos":"n","meaning":"n. 爆炸（聲）","example":"The loud explosion shook the windows of nearby houses.","example_zh":"那聲巨大的爆炸震動了附近房子的窗戶。"},{"id":1114,"word":"explosive","pos":"n","meaning":"n. 爆炸物；炸藥 (adj) 爆炸（性）的","example":"Workers must handle explosive materials with extreme caution.","example_zh":"工人們必須極度謹慎地處理爆炸性物質。"},{"id":1115,"word":"export","pos":"v","meaning":"v. 輸出；出口 (n) 輸出（品）；出口","example":"The country relies heavily on the export of agricultural products.","example_zh":"該國嚴重依賴農產品的出口。"},{"id":1116,"word":"expose","pos":"v","meaning":"v. 使接觸；揭露；揭發","example":"Journalists aim to expose the truth behind the political scandal.","example_zh":"記者們旨在揭露那樁政治醜聞背後的真相。"},{"id":1117,"word":"exposure","pos":"n","meaning":"n. 暴露；揭露；揭發；曝光","example":"Prolonged exposure to the sun can be harmful to your skin.","example_zh":"長期暴露在陽光下對皮膚有害。"},{"id":1118,"word":"express","pos":"vt","meaning":"vt. 表達，表示","example":"She found it difficult to express her feelings in words.","example_zh":"她覺得很難用言語表達自己的感受。"},{"id":1119,"word":"expression","pos":"n","meaning":"n. 表情；措辭；詞句；表達","example":"A smile is a universal expression of happiness.","example_zh":"微笑是通用的快樂表情。"},{"id":1120,"word":"expressive","pos":"adj","meaning":"adj. 表達的","example":"He is a very expressive dancer who uses movement to tell a story.","example_zh":"他是一位非常有表現力的舞者，運用動作來說故事。"},{"id":1121,"word":"extend","pos":"v","meaning":"v. 延長；延續；擴張；擴大","example":"The government decided to extend the deadline for the tax application.","example_zh":"政府決定延長稅務申請的期限。"},{"id":1122,"word":"extinct","pos":"adj","meaning":"adj. 絕種的","example":"The dodo is a well-known extinct bird species.","example_zh":"度度鳥是一種著名的絕種鳥類。"},{"id":1123,"word":"extinction","pos":"n","meaning":"n. 絕種","example":"Scientists are concerned about the rapid extinction of many wildlife species.","example_zh":"科學家們擔憂許多野生動物物種的快速絕種。"},{"id":1124,"word":"extraordinary","pos":"adj","meaning":"adj. 奇特的；非凡的","example":"It was an extraordinary performance that left the audience in awe.","example_zh":"那是一場非凡的表演，讓觀眾肅然起敬。"},{"id":1125,"word":"extreme","pos":"adj","meaning":"adj. 極度的；極端的 (n) 極限；極端","example":"He likes to engage in extreme sports like skydiving.","example_zh":"他喜歡參與像高空跳傘這樣的極限運動。"},{"id":1126,"word":"extremely","pos":"adv","meaning":"adv. 極端地","example":"It is extremely important to arrive at the airport on time.","example_zh":"準時抵達機場極端重要。"},{"id":1127,"word":"fable","pos":"n","meaning":"n. 寓言","example":"The story of the tortoise and the hare is a famous fable.","example_zh":"龜兔賽跑的故事是一則著名的寓言。"},{"id":1128,"word":"facial","pos":"adj","meaning":"adj. 臉部的","example":"She uses a gentle facial cleanser to wash her face every morning.","example_zh":"她每天早上使用溫和的臉部清潔用品洗臉。"},{"id":1129,"word":"facilitate","pos":"vt","meaning":"vt. 幫助，使容易，促進","example":"Good communication helps facilitate teamwork within the office.","example_zh":"良好的溝通有助於促進辦公室內的團隊合作。"},{"id":1130,"word":"facilities","pos":"n","meaning":"n. 設備，設施","example":"The hotel offers various facilities like a gym and a swimming pool.","example_zh":"這間飯店提供多種設施，如健身房和游泳池。"},{"id":1131,"word":"facility","pos":"n","meaning":"n. 便利；設施","example":"The new library provides every facility needed for quiet study.","example_zh":"新圖書館提供了安靜學習所需的一切便利設施。"},{"id":1132,"word":"factor","pos":"n","meaning":"n. 因素；要素","example":"Hard work is a key factor in achieving success.","example_zh":"努力是達成成功的關鍵因素。"},{"id":1133,"word":"fade","pos":"v","meaning":"v. 變弱；逐漸消失","example":"The colors of the old painting began to fade over time.","example_zh":"那幅舊畫的色彩隨著時間逐漸褪色。"},{"id":1134,"word":"fail","pos":"v","meaning":"v. 失敗","example":"If you don't practice, you might fail the driving test.","example_zh":"如果你不練習，可能會在駕駛考試中失敗。"},{"id":1135,"word":"failure","pos":"n","meaning":"n. 失敗的人，失敗","example":"Her business was a failure because she didn't plan well.","example_zh":"她的生意失敗了，因為她沒有妥善規劃。"},{"id":1136,"word":"faint","pos":"v","meaning":"v. 昏倒 (adj) 暈眩的；模糊的；微弱的","example":"The light was too faint to see anything in the dark room.","example_zh":"光線太微弱，在暗室裡什麼也看不見。"},{"id":1137,"word":"fairly","pos":"adv","meaning":"adv. 相當地；公正地","example":"The price of the meal was fairly reasonable for the quality.","example_zh":"那餐的價格以其品質來說相當合理。"},{"id":1138,"word":"fairy","pos":"n","meaning":"n. 小精靈","example":"In the story, a fairy grants the young girl three wishes.","example_zh":"在故事中，一位小精靈實現了那位年輕女孩的三個願望。"},{"id":1139,"word":"faith","pos":"n","meaning":"n. 信心；信任；（宗教）信仰","example":"He has great faith that everything will turn out well in the end.","example_zh":"他懷有強大的信心，相信一切最終都會好轉。"},{"id":1140,"word":"faithful","pos":"adj","meaning":"adj. 確實的；正確的；可靠的；忠實的","example":"She is a faithful employee who has worked for the company for twenty years.","example_zh":"她是一位忠實的員工，已為公司工作了二十年。"},{"id":1141,"word":"fake","pos":"adj","meaning":"adj. 假裝的；偽造的 (n) 冒牌貨；仿造品 (v) 偽造","example":"He tried to sell a fake watch as a genuine designer product.","example_zh":"他試圖將一支假錶當作真正的設計師產品販售。"},{"id":1142,"word":"fall for","pos":"phr","meaning":"phr. 喜歡上；上～的當","example":"Don't fall for his tricks; he is trying to cheat you.","example_zh":"別上當中了他的詭計；他試圖欺騙你。"},{"id":1143,"word":"fame","pos":"n","meaning":"n. 名聲","example":"He achieved world fame after starring in the famous movie.","example_zh":"他在主演那部知名電影後獲得了世界名聲。"},{"id":1144,"word":"famed","pos":"adj","meaning":"adj. 有名的","example":"The famed restaurant is known for its delicious local dishes.","example_zh":"那間有名的餐廳以其美味的在地料理聞名。"},{"id":1145,"word":"familiar","pos":"adj","meaning":"adj. 熟悉的","example":"The scenery looked familiar, as if I had been there before.","example_zh":"那風景看起來很熟悉，彷彿我以前來過這裡。"},{"id":1146,"word":"familiarity","pos":"n","meaning":"n. 熟悉度","example":"Her familiarity with the city helped us find the best restaurants.","example_zh":"她對城市的熟悉度幫助我們找到了最好的餐館。"},{"id":1147,"word":"fan","pos":"n","meaning":"n. 扇子；風扇；迷 (v) （用扇子）煽；煽動","example":"The fans waved their banners to show support for the team.","example_zh":"那些迷們揮舞著旗幟以展現對球隊的支持。"},{"id":1148,"word":"fancy","pos":"v","meaning":"v. 想像 (n) 喜好；想像；幻想 (adj) 精緻的；昂貴的","example":"Do you fancy going out for dinner tonight?","example_zh":"你想要今晚出去吃晚餐嗎？"},{"id":1149,"word":"fantastic","pos":"adj","meaning":"adj. 極好的；美妙的；奇幻的","example":"The team had a fantastic season, winning almost every game.","example_zh":"該團隊度過了一個極好的賽季，幾乎贏得每場比賽。"},{"id":1150,"word":"fantasy","pos":"n","meaning":"n. 幻想；夢想","example":"She lives in a world of fantasy, dreaming of magical adventures.","example_zh":"她生活在幻想的世界裡，夢想著魔法冒險。"},{"id":1151,"word":"fare","pos":"n","meaning":"n. 車費","example":"The bus fare has increased by ten percent this year.","example_zh":"公車車費今年上漲了百分之十。"},{"id":1152,"word":"farewell","pos":"n","meaning":"n. 道別","example":"We gathered at the station to bid our friend a sad farewell.","example_zh":"我們聚集在車站，向我們的朋友道別。"},{"id":1153,"word":"farther","pos":"adv","meaning":"adv. 更遠地 (adj) 更遠的","example":"We decided to travel farther north to see the beautiful lakes.","example_zh":"我們決定往更北方旅行以看看那些美麗的湖泊。"},{"id":1154,"word":"fascinate","pos":"v","meaning":"v. 使著迷","example":"The way the engine works continues to fascinate me.","example_zh":"引擎運作的方式持續令我著迷。"},{"id":1155,"word":"fascinated","pos":"adj","meaning":"adj. 著迷的","example":"I was fascinated by the history of the ancient temple.","example_zh":"我對那座古廟的歷史感到著迷。"},{"id":1156,"word":"fascinating","pos":"adj","meaning":"adj. 令人著迷的","example":"It is a fascinating documentary about life under the sea.","example_zh":"這是一部關於海底生活的令人著迷的紀錄片。"},{"id":1157,"word":"fascination","pos":"n","meaning":"n. 魔力，魅力","example":"Her fascination with stars led her to study astronomy.","example_zh":"她對星星的著迷引領她研究天文學。"},{"id":1158,"word":"fashion","pos":"n","meaning":"n. 時尚；流行款式","example":"In the world of fashion, styles change very quickly.","example_zh":"在時尚界，風格變化得非常快。"},{"id":1159,"word":"fashionable","pos":"adj","meaning":"adj. 時髦的","example":"She always wears the most fashionable clothes from the latest collections.","example_zh":"她總是穿著最新系列中最時髦的衣服。"},{"id":1160,"word":"fasten","pos":"v","meaning":"v. 繫牢","example":"Please fasten your seatbelt before the plane takes off.","example_zh":"請在飛機起飛前繫牢你的安全帶。"},{"id":1161,"word":"fatal","pos":"adj","meaning":"adj. 致命的","example":"The earthquake had a fatal effect, causing the collapse of many buildings.","example_zh":"那場地震產生了致命的影響，導致許多建築物倒塌。"},{"id":1162,"word":"fatality","pos":"n","meaning":"n. 死亡、致命","example":"The car accident resulted in a high fatality rate this year.","example_zh":"這場車禍導致今年的死亡率偏高。"},{"id":1163,"word":"fate","pos":"n","meaning":"n. 命運","example":"We believe that it was our fate to meet in such a strange place.","example_zh":"我們相信在這麼奇特的地方相遇是我們的命運。"},{"id":1164,"word":"faucet","pos":"n","meaning":"n. 水龍頭","example":"Please turn off the faucet after you finish washing your hands.","example_zh":"請在你洗完手後關掉水龍頭。"},{"id":1165,"word":"favorable","pos":"adj","meaning":"adj. 稱讚的；有利的；適合的","example":"The weather was favorable for our outdoor picnic.","example_zh":"天氣對我們的戶外野餐來說相當有利。"},{"id":1166,"word":"fax","pos":"n","meaning":"n. 傳真 (v) 傳真","example":"Could you fax the signed documents to my office?","example_zh":"你能將簽署後的文件傳真到我的辦公室嗎？"},{"id":1167,"word":"feast","pos":"n","meaning":"n. 宴會；盛宴 (v) 盡情地吃","example":"The family prepared a grand feast to celebrate the holiday.","example_zh":"這家人準備了一場盛宴來慶祝節日。"},{"id":1168,"word":"feather","pos":"n","meaning":"n. 羽毛；翎","example":"The bird has colorful feathers that shine in the sunlight.","example_zh":"那隻鳥有在陽光下閃耀的彩色羽毛。"},{"id":1169,"word":"feature","pos":"v","meaning":"v. 以～為特色；由～主演 (n) 特色","example":"The new camera will feature advanced technology for better photos.","example_zh":"這台新相機將以先進技術為特色，以獲得更好的照片。"},{"id":1170,"word":"ferry","pos":"n","meaning":"n. 渡輪 (v) 運送","example":"We took a ferry to cross the river to the other side.","example_zh":"我們搭乘渡輪渡河到另一邊。"},{"id":1171,"word":"fertile","pos":"adj","meaning":"adj. 肥沃的","example":"The region has fertile soil, which is great for farming.","example_zh":"該地區擁有肥沃的土壤，非常適合耕作。"},{"id":1172,"word":"fertility","pos":"n","meaning":"n. 肥沃，豐饒，生產力","example":"The fertility of the land allows for two harvests every year.","example_zh":"這塊土地的豐饒使得每年可以收成兩次。"},{"id":1173,"word":"fertilize","pos":"vt","meaning":"vt. 施肥，使豐饒，使受精","example":"Farmers use compost to fertilize their crops naturally.","example_zh":"農夫使用堆肥來自然地為作物施肥。"},{"id":1174,"word":"fertilizer","pos":"n","meaning":"n. 肥料","example":"Using the right fertilizer will help your plants grow faster.","example_zh":"使用正確的肥料將幫助你的植物長得更快。"},{"id":1175,"word":"fetch","pos":"v","meaning":"v. 取來；叫來","example":"Can you fetch me a glass of water from the kitchen?","example_zh":"你能從廚房幫我取來一杯水嗎？"},{"id":1176,"word":"fiction","pos":"n","meaning":"n. 小說","example":"She prefers reading historical fiction over true biographies.","example_zh":"她比起真實的傳記，更喜歡閱讀歷史小說。"},{"id":1177,"word":"fierce","pos":"adj","meaning":"adj. 強烈的；兇惡的","example":"The wolf looked fierce, with sharp teeth and angry eyes.","example_zh":"那隻狼看起來很兇惡，有銳利的牙齒和憤怒的眼睛。"},{"id":1178,"word":"figure","pos":"n","meaning":"n. 數字，身材","example":"You need to use your imagination to figure out the solution.","example_zh":"你需要運用你的想像力來找出解決方法。"},{"id":1179,"word":"file","pos":"n","meaning":"n. 檔案；卷宗；文件夾 (v) 存檔；正式提出","example":"Please put the document in the file cabinet after you read it.","example_zh":"請在你閱讀後將文件放入檔案櫃。"},{"id":1180,"word":"finance","pos":"n","meaning":"n. 財務 (v) 提供經費","example":"The committee is responsible for the finance of the school project.","example_zh":"委員會負責學校專案的財務。"},{"id":1181,"word":"financial","pos":"adj","meaning":"adj. 財務的","example":"We need to improve our financial situation before we buy a new car.","example_zh":"我們在買新車前需要改善我們的財務狀況。"},{"id":1182,"word":"firecracker","pos":"n","meaning":"n. 鞭炮","example":"The children lit a firecracker to celebrate the Chinese New Year.","example_zh":"孩子們點燃鞭炮來慶祝農曆新年。"},{"id":1183,"word":"fireplace","pos":"n","meaning":"n. 壁爐","example":"We sat by the fireplace to stay warm during the winter night.","example_zh":"我們坐在壁爐旁，在冬夜裡保持溫暖。"},{"id":1184,"word":"firework","pos":"n","meaning":"n. 煙火","example":"The colorful fireworks lit up the night sky during the festival.","example_zh":"五彩繽紛的煙火在祭典期間點亮了夜空。"},{"id":1185,"word":"fist","pos":"n","meaning":"n. 拳頭","example":"He clenched his fist when he felt very angry.","example_zh":"他感到非常憤怒時握緊了拳頭。"},{"id":1186,"word":"fit","pos":"adj","meaning":"adj. 適合的，健壯的","example":"He trains every day to stay fit for the upcoming competition.","example_zh":"他每天訓練以保持強健的身體，迎接即將到來的比賽。"},{"id":1187,"word":"fitness","pos":"n","meaning":"n [U]. 健康，體能；適合，勝任","example":"Regular exercise is important for maintaining good fitness.","example_zh":"定期運動對於維持良好的體能很重要。"},{"id":1188,"word":"flame","pos":"n","meaning":"n. 火焰","example":"The flame of the candle flickered in the wind.","example_zh":"蠟燭的火焰在風中閃爍。"},{"id":1189,"word":"flatter","pos":"v","meaning":"v. 諂媚；奉承","example":"He tried to flatter the boss to get a promotion.","example_zh":"他試圖諂媚老闆以獲得升遷。"},{"id":1190,"word":"flavor","pos":"n","meaning":"n. 味道 (v) 使具有味道","example":"The soup has a unique flavor because of the special herbs used.","example_zh":"由於使用了特殊的香草，這碗湯有一種獨特的味道。"},{"id":1191,"word":"flaw","pos":"n","meaning":"n. 缺點，瑕疵","example":"The diamond has a small flaw that is visible under a microscope.","example_zh":"這顆鑽石有一個在顯微鏡下可見的小瑕疵。"},{"id":1192,"word":"flawed","pos":"adj","meaning":"adj. 有缺點的","example":"The initial plan was flawed, so we had to start over.","example_zh":"最初的計畫是有缺點的，所以我們必須重頭來過。"},{"id":1193,"word":"flawless","pos":"adj","meaning":"adj. 完美無瑕的","example":"She gave a flawless performance on the piano at the concert.","example_zh":"她在音樂會上的鋼琴演奏完美無瑕。"},{"id":1194,"word":"flea","pos":"n","meaning":"n. 跳蚤","example":"The cat was scratching itself because it had a flea.","example_zh":"那隻貓一直在抓癢，因為牠身上有跳蚤。"},{"id":1195,"word":"flee","pos":"v","meaning":"v. 逃走","example":"The residents had to flee their homes when the flood began.","example_zh":"當洪水開始時，居民們必須逃走。"},{"id":1196,"word":"flesh","pos":"n","meaning":"n. 肉體","example":"Some animals have more flesh than others, which affects their survival.","example_zh":"有些動物比其他動物有更多的肉體，這影響了牠們的生存。"},{"id":1197,"word":"flexible","pos":"adj","meaning":"adj. 有彈性的；可變通的","example":"We need a flexible schedule to accommodate everyone's needs.","example_zh":"我們需要一個有彈性的行程來配合每個人的需求。"},{"id":1198,"word":"flip","pos":"v","meaning":"v. 拋擲，快速翻動，按（開關）","example":"Can you flip the switch to turn on the lights?","example_zh":"你能按那個開關來打開燈嗎？"},{"id":1199,"word":"float","pos":"v","meaning":"v. 漂浮","example":"The boat managed to float despite the rough sea conditions.","example_zh":"儘管海況惡劣，船隻仍設法漂浮著。"},{"id":1200,"word":"flock","pos":"v","meaning":"v. 群集；簇擁 (n) 一群","example":"People flock to the beach whenever the weather is sunny and warm.","example_zh":"每當天氣晴朗溫暖時，人們總是群集到海灘。"}]},
{"unit":10,"unit_label":"p.19-20","words":[{"id":1201,"word":"fluent","pos":"adj","meaning":"adj. 流利的","example":"She is fluent in three languages, including English, French, and Spanish.","example_zh":"她精通三種語言，包含英語、法語和西班牙語。"},{"id":1202,"word":"flunk","pos":"v","meaning":"v. （使）不及格；失敗","example":"If you don't prepare for the exam, you will likely flunk the course.","example_zh":"如果你不準備考試，你很可能會被這門課當掉。"},{"id":1203,"word":"flush","pos":"v","meaning":"v. 臉紅；用水沖洗 (n) 臉紅；紅暈","example":"Her face began to flush when she realized everyone was looking at her.","example_zh":"當她意識到大家都在看她時，臉開始紅了起來。"},{"id":1204,"word":"foam","pos":"n","meaning":"n. 泡沫 (v) 起泡沫","example":"The crashing waves left a thick layer of white foam on the shore.","example_zh":"拍岸的浪花在岸邊留下一層厚厚的白色泡沫。"},{"id":1205,"word":"focus","pos":"v/n","meaning":"v/n. 集中專注，焦點","example":"You need to focus your attention on the task in front of you.","example_zh":"你需要將注意力集中在眼前的任務上。"},{"id":1206,"word":"fold","pos":"v","meaning":"v. 摺疊 (n) 摺疊；摺痕","example":"Please fold the laundry after it has been dried.","example_zh":"請在洗好的衣服晾乾後將其摺疊。"},{"id":1207,"word":"folk","pos":"n","meaning":"n. 人們（作為複數）；家屬；雙親（慣用複數） (adj) 民間的","example":"The local folk traditions are preserved by the elderly in the village.","example_zh":"當地的民間傳統是由村裡的長者們保存下來的。"},{"id":1208,"word":"follow","pos":"v","meaning":"v. 接在～之後","example":"He decided to follow his older brother into the medical profession.","example_zh":"他決定追隨他哥哥的腳步進入醫療行業。"},{"id":1209,"word":"follower","pos":"n","meaning":"n. 追隨者；信徒","example":"The leader addressed his loyal followers before the long journey.","example_zh":"在漫長的旅程前，領袖對他忠誠的追隨者們發表演說。"},{"id":1210,"word":"following","pos":"adj","meaning":"adj. 下一個(prep)在～以後(n) 下列各項","example":"Please read the following instructions before you begin the test.","example_zh":"在開始測驗前，請閱讀下列說明。"},{"id":1211,"word":"fond","pos":"adj","meaning":"adj. 喜歡的；喜愛的","example":"I have always been very fond of classical music.","example_zh":"我一直非常喜愛古典音樂。"},{"id":1212,"word":"fondness","pos":"n","meaning":"n. 喜愛","example":"He showed a great fondness for animals by taking care of the stray cats.","example_zh":"他透過照顧流浪貓展現出對動物的極大喜愛。"},{"id":1213,"word":"fool","pos":"v","meaning":"v. 愚弄，欺騙 (n) 傻瓜，笨蛋","example":"Do not let anyone fool you into giving away your private information.","example_zh":"不要讓任何人愚弄你，誘騙你交出私人資訊。"},{"id":1214,"word":"foolish","pos":"adj","meaning":"adj. 愚蠢的","example":"It was very foolish of him to try and climb the mountain without any gear.","example_zh":"他嘗試在沒有任何裝備的情況下爬山，真是太愚蠢了。"},{"id":1215,"word":"for example","pos":"phr","meaning":"phr. 舉例來說(=for instance)","example":"For example, you could use a computer to organize your daily schedule.","example_zh":"舉例來說，你可以使用電腦來整理你的每日行程。"},{"id":1216,"word":"for good","pos":"phr","meaning":"phr. 永遠","example":"She decided to move to another country for good to start a new life.","example_zh":"她決定永遠搬到另一個國家去展開新生活。"},{"id":1217,"word":"forbid","pos":"v","meaning":"v. 禁止","example":"The school rules forbid students from using phones during class.","example_zh":"學校規定禁止學生在課堂上使用手機。"},{"id":1218,"word":"forecast","pos":"v","meaning":"v. 預測 (n) 預報","example":"The weather forecast says it will be sunny throughout the weekend.","example_zh":"天氣預報說整個週末都會是晴天。"},{"id":1219,"word":"forehead","pos":"n","meaning":"n. 額頭","example":"He wiped the sweat from his forehead after a long day of work.","example_zh":"在辛苦工作一天後，他擦去了額頭上的汗水。"},{"id":1220,"word":"forever","pos":"adv","meaning":"adv. 永遠","example":"They promised to stay friends forever, no matter where they go.","example_zh":"他們約定不管到哪裡，都要永遠做朋友。"},{"id":1221,"word":"forgive","pos":"v","meaning":"v. 原諒(forgave, forgiven)","example":"It is often difficult to forgive someone who has broken your trust.","example_zh":"要原諒打破你信任的人通常很難。"},{"id":1222,"word":"forgiveness","pos":"n","meaning":"n. 原諒，寬恕","example":"Seeking forgiveness is the first step toward repairing a damaged relationship.","example_zh":"尋求寬恕是修復受損關係的第一步。"},{"id":1223,"word":"form","pos":"n","meaning":"n. 型態，種類，表格(v) 形成","example":"Water can take many forms, such as ice, liquid, or vapor.","example_zh":"水可以呈現多種型態，例如冰、液體或蒸汽。"},{"id":1224,"word":"formation","pos":"n","meaning":"n. 形成；養成；組成；排列；隊形","example":"The formation of mountains takes millions of years.","example_zh":"山脈的形成需要數百萬年。"},{"id":1225,"word":"formula","pos":"n","meaning":"n. 公式；方程式；製法；配方","example":"The scientist developed a new formula for a cleaner fuel.","example_zh":"科學家研發了一種用於更潔淨燃料的新公式。"},{"id":1226,"word":"fort","pos":"n","meaning":"n. 要塞","example":"The soldiers protected the fort from incoming attacks.","example_zh":"士兵們保護要塞免受入侵攻擊。"},{"id":1227,"word":"forth","pos":"adv","meaning":"adv. 向前","example":"He looked forth to the future with hope and determination.","example_zh":"他帶著希望與決心看向未來。"},{"id":1228,"word":"fortunate","pos":"adj","meaning":"adj. 幸運的","example":"We were fortunate enough to arrive just before the rain started.","example_zh":"我們很幸運，在雨開始下之前就抵達了。"},{"id":1229,"word":"fortune","pos":"n","meaning":"n. 命運；財富","example":"She inherited a great fortune from her grandfather, which helped her start her business.","example_zh":"她從祖父那繼承了一筆巨大的財富，這幫助她創業。"},{"id":1230,"word":"found","pos":"v","meaning":"v. 興建；建立","example":"The city was founded more than three hundred years ago.","example_zh":"這座城市建於三百多年前。"},{"id":1231,"word":"foundation","pos":"n","meaning":"n. 基礎；基金會；創立；創建","example":"The organization relies on its strong foundation of volunteers to succeed.","example_zh":"該組織仰賴其強大的志工基礎來取得成功。"},{"id":1232,"word":"founder","pos":"n","meaning":"n. 創始者；建立者","example":"As the founder of the company, he is very proud of what it has become.","example_zh":"身為公司的創始者，他對公司的現狀感到非常驕傲。"},{"id":1233,"word":"fountain","pos":"n","meaning":"n. 噴水池；源頭","example":"We sat by the fountain in the park and enjoyed the cooling mist.","example_zh":"我們坐在公園的噴水池旁，享受著涼爽的水霧。"},{"id":1234,"word":"fragrance","pos":"n","meaning":"n. 芳香；芬芳","example":"The fragrance of the blooming flowers filled the entire garden.","example_zh":"盛開花朵的芳香充滿了整個花園。"},{"id":1235,"word":"frame","pos":"n","meaning":"n. 骨架；結構；框架 (v) 給～裝框","example":"You should put your favorite photo in a nice frame on your desk.","example_zh":"你應該把最喜歡的照片放在桌上一個精美的框裡。"},{"id":1236,"word":"frantic","pos":"adj","meaning":"adj. 手忙腳亂的，發狂似的","example":"She made a frantic effort to find her keys before the meeting started.","example_zh":"在會議開始前，她手忙腳亂地嘗試尋找鑰匙。"},{"id":1237,"word":"frantically","pos":"adv","meaning":"adv. 手忙腳亂地","example":"The parents searched frantically for their lost child in the crowded market.","example_zh":"父母在擁擠的市場裡驚慌地手忙腳亂地尋找走失的孩子。"},{"id":1238,"word":"freedom","pos":"n","meaning":"n. 自由，免除","example":"Everyone has the right to freedom of speech in a democratic society.","example_zh":"在民主社會中，每個人都有言論自由的權利。"},{"id":1239,"word":"freeway","pos":"n","meaning":"n. 高速公路","example":"We took the freeway to save time during our trip to the city.","example_zh":"為了在前往城市的旅途中省時，我們走了高速公路。"},{"id":1240,"word":"freeze","pos":"v","meaning":"v. （使）結冰；冷凍；寒冷刺骨","example":"It is so cold outside that the water in the bucket might freeze.","example_zh":"外面太冷了，水桶裡的水可能會結冰。"},{"id":1241,"word":"frequency","pos":"n","meaning":"n. 頻率；頻繁；頻仍","example":"We need to increase the frequency of our meetings to improve communication.","example_zh":"我們需要增加會議的頻率以改善溝通。"},{"id":1242,"word":"frequent","pos":"adj","meaning":"adj. 頻繁的","example":"Frequent travel can be exhausting, even if it is for leisure.","example_zh":"頻繁的旅行可能會讓人疲憊，即使是為了休閒也是如此。"},{"id":1243,"word":"frequently","pos":"adv","meaning":"adv. 時常，屢次，經常地","example":"She frequently visits the local library to borrow new books.","example_zh":"她經常造訪當地圖書館借新書。"},{"id":1244,"word":"freshman","pos":"n","meaning":"n. 大一新生","example":"As a freshman, he felt both excited and nervous about starting university.","example_zh":"身為一名大一新生，他對於開始大學生活感到既興奮又緊張。"},{"id":1245,"word":"friendship","pos":"n","meaning":"n. 友誼；友情","example":"Their friendship has lasted through many challenges over the years.","example_zh":"他們的友誼在這些年來歷經了許多挑戰而持續至今。"},{"id":1246,"word":"fright","pos":"n","meaning":"n. 驚嚇，害怕","example":"He felt a sudden sense of fright when the loud noise went off.","example_zh":"當巨大的噪音發出時，他突然感到一陣驚嚇。"},{"id":1247,"word":"frighten","pos":"v","meaning":"v. 使驚嚇","example":"Loud and sudden sounds can easily frighten small children.","example_zh":"大聲且突如其來的聲音很容易驚嚇到小小孩。"},{"id":1248,"word":"frighten someone out of one's wits","pos":"phr","meaning":"phr. 把某人嚇得驚慌失措","example":"The unexpected movement in the dark almost frightened me out of my wits.","example_zh":"暗處突如其來的動作差點把我嚇得驚慌失措。"},{"id":1249,"word":"frightened","pos":"adj","meaning":"adj. 受驚嚇的，害怕的","example":"The frightened cat hid under the sofa during the thunderstorm.","example_zh":"受驚嚇的貓在雷雨期間躲在沙發底下。"},{"id":1250,"word":"frightening","pos":"adj","meaning":"adj. 令人驚嚇的","example":"Seeing a spider in the bedroom can be a frightening experience.","example_zh":"在臥室看到蜘蛛可能是一個令人驚嚇的體驗。"},{"id":1251,"word":"from time to time","pos":"phr","meaning":"phr. 偶爾，有時","example":"From time to time, it is good to take a break and relax.","example_zh":"偶爾休息一下並放鬆是很好的。"},{"id":1252,"word":"frost","pos":"n","meaning":"n. 霜；嚴寒 (v) 結霜；凍壞","example":"The morning frost covered the grass with a thin layer of white.","example_zh":"早晨的霜在草地上覆蓋了一層薄薄的白色。"},{"id":1253,"word":"frown","pos":"v","meaning":"v. 皺眉 (n) 皺眉；愁眉苦臉","example":"She would frown whenever she was deep in thought.","example_zh":"每當她在沉思時，總會皺眉。"},{"id":1254,"word":"frustrate","pos":"v","meaning":"v. 使受挫；使沮喪","example":"It is easy to feel frustrated when you don't see results from your efforts.","example_zh":"當你沒有從努力中看到結果時，很容易感到受挫折。"},{"id":1255,"word":"frustrated","pos":"adj","meaning":"adj. 失意的，挫敗的","example":"He felt frustrated because he could not solve the puzzle.","example_zh":"他感到失意，因為他無法解開那個謎題。"},{"id":1256,"word":"frustration","pos":"n","meaning":"n. 挫折；挫敗","example":"The delay caused a lot of frustration for the travelers.","example_zh":"這場延誤對旅客們造成了很大的挫折。"},{"id":1257,"word":"fry","pos":"v","meaning":"v. 炸；煎","example":"They like to fry the fish until it is golden brown and crispy.","example_zh":"他們喜歡把魚炸到呈現金黃色且酥脆。"},{"id":1258,"word":"fuel","pos":"n","meaning":"n. 燃料 (v) 給～加燃料；助長","example":"We need to stop at the gas station to get more fuel for the car.","example_zh":"我們需要停在加油站，為汽車補充更多燃料。"},{"id":1259,"word":"fulfill","pos":"v","meaning":"v. 實現；履行；完成","example":"It is important to fulfill your promises to build trust with others.","example_zh":"履行你的諾言對於與他人建立信任至關重要。"},{"id":1260,"word":"fulfilling","pos":"adj","meaning":"adj. 使人滿意、滿足的","example":"Teaching can be a very fulfilling experience for many people.","example_zh":"對許多人來說，教學是一種非常滿足的體驗。"},{"id":1261,"word":"fulfillment","pos":"n","meaning":"n. 滿足感","example":"Achieving her long-term goals gave her a sense of fulfillment.","example_zh":"達成她的長期目標帶給她一種滿足感。"},{"id":1262,"word":"functional","pos":"adj","meaning":"adj. 有功能的；實用的","example":"The design of the new building is both functional and beautiful.","example_zh":"這棟新建築的設計既實用又美麗。"},{"id":1263,"word":"fund","pos":"n","meaning":"n. 基金；資金 (v) 提供資金","example":"The organization will fund the new research project for two years.","example_zh":"該組織將為這項新的研究專案提供兩年的資金。"},{"id":1264,"word":"fundamental","pos":"adj","meaning":"adj. 基本的；根本的；重要的","example":"Respect is a fundamental part of a healthy relationship.","example_zh":"尊重是健康關係的基本部分。"},{"id":1265,"word":"funds","pos":"n","meaning":"n. 現款，資金","example":"The city lacks the funds to repair all the broken roads.","example_zh":"這個城市缺乏修復所有破損道路的資金。"},{"id":1266,"word":"funeral","pos":"n","meaning":"n. 葬禮","example":"Many friends attended the funeral to pay their last respects.","example_zh":"許多朋友參加了葬禮以表達最後的敬意。"},{"id":1267,"word":"fur","pos":"n","meaning":"n. 毛；毛皮","example":"Some animals grow thick fur to keep themselves warm during winter.","example_zh":"一些動物長出厚厚的毛皮以在冬天保持溫暖。"},{"id":1268,"word":"furious","pos":"adj","meaning":"adj. 憤怒的；狂怒的；有力的；猛烈的","example":"He wa
