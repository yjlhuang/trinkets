d":1627,"word":"invitation","pos":"n","meaning":"n. 邀請","example":"Did you receive an invitation to the wedding?","example_zh":"你有收到婚禮的邀請函嗎？"},{"id":1628,"word":"invite","pos":"v","meaning":"v. 邀請(人+to)","example":"They decided to invite all their neighbors to the party.","example_zh":"他們決定邀請所有鄰居來參加派對。"},{"id":1629,"word":"involuntarily","pos":"adv","meaning":"adv. 不由自主地","example":"He laughed involuntarily at the funny sight.","example_zh":"看到那個滑稽的景象，他不由自主地笑了。"},{"id":1630,"word":"involuntary","pos":"adj","meaning":"adj. 不由自主的，非自願的","example":"The muscle twitch was involuntary.","example_zh":"肌肉抽搐是不由自主的。"},{"id":1631,"word":"involve","pos":"v","meaning":"v. 牽涉；拖累；包含","example":"The project will involve a lot of teamwork.","example_zh":"這項專案將會牽涉到許多團隊合作。"},{"id":1632,"word":"involved","pos":"adj","meaning":"adj. 有關的，牽涉在內的","example":"Many people were involved in the planning of the event.","example_zh":"許多人涉入這場活動的規劃。"},{"id":1633,"word":"involvement","pos":"n","meaning":"n. 涉入，投入","example":"Her deep involvement in the project led to its success.","example_zh":"她對該專案的深度投入促成了其成功。"},{"id":1634,"word":"isolate","pos":"v","meaning":"v. 孤立","example":"The country tried to isolate itself from the rest of the world.","example_zh":"該國試圖將自己與世界其餘地區孤立開來。"},{"id":1635,"word":"isolation","pos":"n","meaning":"n. 孤立；隔離","example":"After moving to a new city, he felt a sense of isolation.","example_zh":"搬到新城市後，他感到一種孤立感。"},{"id":1636,"word":"issue","pos":"n","meaning":"n. 問題，議題；期（刊）(v)發行，核發","example":"The latest issue of the magazine has an interesting article.","example_zh":"該雜誌的最新一期有一篇有趣的文章。"},{"id":1637,"word":"itch","pos":"v","meaning":"v. 癢 (n) 癢","example":"My skin started to itch because of the mosquito bite.","example_zh":"因為被蚊子叮，我的皮膚開始發癢。"},{"id":1638,"word":"ivory","pos":"n","meaning":"n. 象牙 (adj) 象牙色的；象牙製的","example":"The ancient statue was carved from ivory.","example_zh":"那座古老的雕像是由象牙雕刻而成的。"},{"id":1639,"word":"jail","pos":"n","meaning":"n. 監獄；監禁 (v) 拘留；關進監獄","example":"The thief was sent to jail for his crimes.","example_zh":"那個小偷因為他的罪行被送進監獄。"},{"id":1640,"word":"jar","pos":"n","meaning":"n. 瓶子；罐子 (v) 不一致；衝突","example":"She kept her cookies in a glass jar.","example_zh":"她把餅乾放在玻璃瓶裡。"},{"id":1641,"word":"jaw","pos":"n","meaning":"n. 顎；下巴","example":"He hurt his jaw while playing basketball.","example_zh":"他打籃球時傷到了下巴。"},{"id":1642,"word":"jealous","pos":"adj","meaning":"adj. 嫉妒的；猜忌的","example":"He felt jealous when he saw her talking to someone else.","example_zh":"當他看到她跟別人說話時，他感到嫉妒。"},{"id":1643,"word":"jealousy","pos":"n","meaning":"n. 嫉妒；猜忌","example":"Her success caused a lot of jealousy among her colleagues.","example_zh":"她的成功在同事間引起了很多嫉妒。"},{"id":1644,"word":"jelly","pos":"n","meaning":"n. 果凍","example":"We had fruit jelly for dessert after lunch.","example_zh":"我們午餐後的甜點吃了水果果凍。"},{"id":1645,"word":"jet","pos":"n","meaning":"n. 噴射；噴射機","example":"The jet flew across the sky at high speed.","example_zh":"那架噴射機高速飛過天空。"},{"id":1646,"word":"jewel","pos":"n","meaning":"n. 珠寶","example":"She wore a beautiful jewel on her necklace.","example_zh":"她的項鍊上戴著一顆美麗的珠寶。"},{"id":1647,"word":"jewelry","pos":"n","meaning":"n. 珠寶首飾（總稱）","example":"She inherited some valuable jewelry from her grandmother.","example_zh":"她從祖母那繼承了一些珍貴的珠寶首飾。"},{"id":1648,"word":"journal","pos":"n","meaning":"n. 日記；日誌；期刊","example":"He writes down his thoughts in a journal every night.","example_zh":"他每天晚上都會把想法寫進日記裡。"},{"id":1649,"word":"journey","pos":"n","meaning":"n. 旅行；行程","example":"Their journey across the country lasted three weeks.","example_zh":"他們橫跨全國的旅行持續了三週。"},{"id":1650,"word":"joyful","pos":"adj","meaning":"adj. 喜悅的","example":"It was a joyful occasion for the whole family.","example_zh":"這對全家人來說是一個喜悅的場合。"},{"id":1651,"word":"jungle","pos":"n","meaning":"n. 叢林","example":"They explored the dense jungle with a local guide.","example_zh":"他們在當地嚮導帶領下探索了茂密的叢林。"},{"id":1652,"word":"junior","pos":"adj","meaning":"adj. 年輕的；資淺的；職位較低的 (n) 年幼者；大三生","example":"As a junior, he still has a lot to learn from his manager.","example_zh":"身為資淺人員，他仍有很多要向經理學習。"},{"id":1653,"word":"junk","pos":"n","meaning":"n. 廢棄物；垃圾","example":"Please clean up all that junk in the garage.","example_zh":"請清理車庫裡的所有垃圾。"},{"id":1654,"word":"justice","pos":"n","meaning":"n. 正義；公正","example":"He fought for justice and fairness for all people.","example_zh":"他為所有人的正義與公平而戰。"},{"id":1655,"word":"juvenile","pos":"n","meaning":"n. 青少年， (adj)青少年的","example":"The court deals with many juvenile offenders every year.","example_zh":"法院每年處理許多青少年犯罪者。"},{"id":1656,"word":"kangaroo","pos":"n","meaning":"n. 袋鼠","example":"The kangaroo carries its young in a pouch.","example_zh":"袋鼠將幼兒放在育兒袋中。"},{"id":1657,"word":"keen","pos":"adj","meaning":"adj. 激烈的；敏銳的；熱心的","example":"He has a keen interest in learning new things.","example_zh":"他對於學習新事物有熱心的興趣。"},{"id":1658,"word":"keep (someone) out of something","pos":"phr","meaning":"phr. 使(某人)置身(某事)之外，不捲入(某事)","example":"She tries to keep her children out of trouble at school.","example_zh":"她試圖讓孩子在學校不捲入麻煩。"},{"id":1659,"word":"keep … in mind","pos":"phr","meaning":"phr. 記住","example":"Please keep the meeting in mind for next week.","example_zh":"請記住下週的會議。"},{"id":1660,"word":"keep off","pos":"phr","meaning":"phr. 避免吃某物","example":"The doctor told him to keep off sugar to lose weight.","example_zh":"醫生告訴他為了減重要避免吃糖。"},{"id":1661,"word":"keep on (Ving)","pos":"phr","meaning":"phr. 繼續","example":"He will keep on practicing until he gets it right.","example_zh":"他會繼續練習直到做對為止。"},{"id":1662,"word":"keep up with","pos":"phr","meaning":"phr. 跟上","example":"It is hard to keep up with the latest technology trends.","example_zh":"很難跟上最新的科技趨勢。"},{"id":1663,"word":"keep~ at bay","pos":"phr","meaning":"phr. 抑制，使無法靠近","example":"The police tried to keep the crowd at bay.","example_zh":"警方試圖抑制人群，使無法靠近。"},{"id":1664,"word":"kettle","pos":"n","meaning":"n. 水壺","example":"She put the kettle on the stove to boil water.","example_zh":"她把水壺放在爐子上煮水。"},{"id":1665,"word":"keyboard","pos":"n","meaning":"n. 鍵盤；琴鍵 (v) 鍵入資料","example":"Please use the keyboard to type your name.","example_zh":"請使用鍵盤輸入你的名字。"},{"id":1666,"word":"kidney","pos":"n","meaning":"n. 腎","example":"The doctor checked the health of her kidneys.","example_zh":"醫生檢查了她的腎臟健康。"},{"id":1667,"word":"kilogram","pos":"n","meaning":"n. 公斤","example":"He needs to lose a few kilograms.","example_zh":"他需要減掉幾公斤。"},{"id":1668,"word":"kilometer","pos":"n","meaning":"n. 公里","example":"It is about five kilometers from my house to the school.","example_zh":"從我家到學校大約五公里。"},{"id":1669,"word":"kit","pos":"n","meaning":"n. 成套用具","example":"Each student was given a kit containing all the necessary tools.","example_zh":"每個學生都拿到了一套包含所有必要工具的成套用具。"},{"id":1670,"word":"kneel","pos":"v","meaning":"v. 跪下","example":"The king asked the knight to kneel before him.","example_zh":"國王要求騎士在他面前跪下。"},{"id":1671,"word":"knight","pos":"n","meaning":"n. 武士；騎士 (v) 授予某人爵位","example":"The brave knight fought to protect the kingdom.","example_zh":"勇敢的騎士奮戰以保護王國。"},{"id":1672,"word":"knit","pos":"v","meaning":"v. 編織","example":"She likes to knit sweaters for her grandchildren.","example_zh":"她喜歡為孫子們編織毛衣。"},{"id":1673,"word":"knob","pos":"n","meaning":"n. 圓形的門把","example":"Please turn the door knob to open the door.","example_zh":"請轉動圓形門把來開門。"},{"id":1674,"word":"knot","pos":"n","meaning":"n. 結 (v) 把～打結","example":"Can you help me tie a knot in this rope?","example_zh":"你能幫我在這條繩子上打個結嗎？"},{"id":1675,"word":"knuckle","pos":"n","meaning":"n. 指關節","example":"He injured his knuckles while punching the wall.","example_zh":"他因毆打牆壁而傷到了指關節。"},{"id":1676,"word":"lab","pos":"n","meaning":"n. 實驗室","example":"The students are doing experiments in the lab.","example_zh":"學生們正在實驗室裡做實驗。"},{"id":1677,"word":"label","pos":"n","meaning":"n. 標籤 (v) 貼標籤於；歸類","example":"Please put a label on each box so we know what is inside.","example_zh":"請在每個箱子上貼標籤，這樣我們才知道裡面是什麼。"},{"id":1678,"word":"labor","pos":"n","meaning":"n. 勞動；勞工；勞動階級 (v) 辛勞工作","example":"The factory workers provide the labor needed to produce goods.","example_zh":"工廠工人提供生產商品所需的勞動。"},{"id":1679,"word":"laboratory","pos":"n","meaning":"n. 實驗室","example":"The scientists have a modern laboratory for their research.","example_zh":"科學家有間現代化的實驗室進行研究。"},{"id":1680,"word":"lace","pos":"n","meaning":"n. 鞋帶；花邊；蕾絲","example":"She bought some beautiful lace to decorate her dress.","example_zh":"她買了一些美麗的蕾絲來裝飾洋裝。"},{"id":1681,"word":"lack","pos":"v/n","meaning":"v/n. 缺乏，缺少","example":"The project failed due to a lack of funding.","example_zh":"由於缺乏資金，該專案失敗了。"},{"id":1682,"word":"ladder","pos":"n","meaning":"n. 梯子","example":"Use a ladder to reach the books on the top shelf.","example_zh":"用梯子來拿到頂層書架上的書。"},{"id":1683,"word":"lag","pos":"v","meaning":"v. 落後 (n) 延遲；落後","example":"He began to lag behind the other runners in the race.","example_zh":"他在比賽中開始落後其他參賽者。"},{"id":1684,"word":"landmark","pos":"n","meaning":"n. 地標；里程碑","example":"The Eiffel Tower is a famous landmark in Paris.","example_zh":"艾菲爾鐵塔是巴黎著名的地標。"},{"id":1685,"word":"landscape","pos":"n","meaning":"n. 風景（畫）","example":"He enjoys painting the beautiful landscape of the countryside.","example_zh":"他喜歡繪畫鄉間美麗的風景。"},{"id":1686,"word":"landslide","pos":"n","meaning":"n. 山崩；壓倒性的勝利","example":"Heavy rain caused a landslide on the main road.","example_zh":"大雨導致主要道路發生山崩。"},{"id":1687,"word":"largely","pos":"adv","meaning":"adv. 大部份地；主要地","example":"The success of the project was largely due to his hard work.","example_zh":"該專案的成功主要歸功於他的努力工作。"},{"id":1688,"word":"lash out at (someone)","pos":"phr","meaning":"phr. 痛斥，拳打腳踢","example":"The angry customer started to lash out at the store clerk.","example_zh":"那位憤怒的顧客開始痛斥店員。"},{"id":1689,"word":"lately","pos":"adv","meaning":"adv. 近來；最近","example":"I haven't seen him lately.","example_zh":"我最近沒見到他。"},{"id":1690,"word":"latter","pos":"adj","meaning":"adj. 後者的；後面的","example":"Of the two options, the latter is more expensive.","example_zh":"在兩個選項中，後者比較貴。"},{"id":1691,"word":"laughter","pos":"n","meaning":"n. 笑；笑聲","example":"The children's laughter filled the room.","example_zh":"孩子們的笑聲充滿了房間。"},{"id":1692,"word":"launch","pos":"n","meaning":"n. （船）下水；（火箭）發射 (v) 使下水；發射（火箭）；展開行動；推出","example":"The company is planning to launch a new product next month.","example_zh":"公司計畫下個月推出新產品。"},{"id":1693,"word":"laundry","pos":"n","meaning":"n. 洗衣店；待洗衣物","example":"I need to take my clothes to the laundry.","example_zh":"我需要把衣服拿到洗衣店。"},{"id":1694,"word":"lawful","pos":"adj","meaning":"adj. 合法的；法定的","example":"He is involved in a lawful business.","example_zh":"他從事的是合法生意。"},{"id":1695,"word":"lawn","pos":"n","meaning":"n. 草地；草坪","example":"The children are playing on the lawn.","example_zh":"孩子們在草地上玩耍。"},{"id":1696,"word":"lay down","pos":"phr","meaning":"phr. 制定，明定","example":"The new rules were laid down by the management.","example_zh":"新規定由管理層制定。"},{"id":1697,"word":"lead","pos":"n","meaning":"n. 鉛","example":"Old water pipes used to be made of lead.","example_zh":"老舊的水管過去是用鉛做的。"},{"id":1698,"word":"lead to","pos":"phr","meaning":"phr. 導致","example":"Hard work will lead to success.","example_zh":"努力工作會導致成功。"},{"id":1699,"word":"leak","pos":"v","meaning":"v. 漏；滲；洩漏 (n) 漏出（物）；漏洞","example":"There is a leak in the roof, so the room gets wet.","example_zh":"屋頂有漏水，所以房間會濕。"},{"id":1700,"word":"lean","pos":"v","meaning":"v. 把～靠在（某物上）；靠；（使）傾斜；依賴 (adj) 瘦的；無脂肪的","example":"She likes to lean against the wall while waiting for the bus.","example_zh":"她喜歡等公車時靠在牆上。"},{"id":1701,"word":"leap","pos":"v","meaning":"v. 跳躍 (n) 跳躍","example":"The frog took a long leap across the pond.","example_zh":"青蛙在池塘上跳了一大步。"},{"id":1702,"word":"learned","pos":"adj","meaning":"adj. 有學問的；精通的","example":"He is a learned scholar in the field of ancient history.","example_zh":"他是一位古代歷史領域中很有學問的學者。"},{"id":1703,"word":"learning","pos":"n","meaning":"n. 學識；學問","example":"The old man was known for his great learning and wisdom.","example_zh":"這位老人以其深厚的學識與智慧而聞名。"},{"id":1704,"word":"leather","pos":"n","meaning":"n. 皮革","example":"This bag is made of high-quality leather.","example_zh":"這個包包是用高品質的皮革製成的。"},{"id":1705,"word":"leave alone","pos":"phr","meaning":"phr. 別動（某物），不打擾（某人）","example":"Please leave my papers alone; I just organized them.","example_zh":"請別動我的文件，我剛整理好。"},{"id":1706,"word":"lecture","pos":"n","meaning":"n. 演講；講課；教訓 (v) 演講；講課；教訓","example":"The professor gave a fascinating lecture on climate change.","example_zh":"教授針對氣候變遷做了一場精彩的演講。"},{"id":1707,"word":"lecturer","pos":"n","meaning":"n. 演講者；講師","example":"The lecturer answered many questions after the presentation.","example_zh":"講師在簡報後回答了許多問題。"},{"id":1708,"word":"legend","pos":"n","meaning":"n. 傳說；傳奇人物","example":"According to local legend, a dragon lives in that mountain.","example_zh":"根據當地傳說，那座山裡住著一條龍。"},{"id":1709,"word":"legendary","pos":"adj","meaning":"adj. 知名的，著名的，傳說的","example":"He became a legendary hero because of his brave actions.","example_zh":"因為他勇敢的行動，他成為了一位傳奇英雄。"},{"id":1710,"word":"legislate","pos":"vi","meaning":"vi. 制定法律(vt)使依法成立","example":"The government needs to legislate to protect workers' rights.","example_zh":"政府需要立法以保護勞工權利。"},{"id":1711,"word":"legislative","pos":"adj","meaning":"adj. 立法的；有立法權的","example":"The legislative branch of the government is responsible for creating laws.","example_zh":"政府的立法部門負責制定法律。"},{"id":1712,"word":"legislator","pos":"n","meaning":"n. 立法委員","example":"The legislator proposed a new bill to improve the school system.","example_zh":"這位立法委員提議了一項改善學校制度的新法案。"},{"id":1713,"word":"leisure","pos":"n","meaning":"n. 閒暇","example":"I don't have much leisure time during the busy work week.","example_zh":"在繁忙的工作週期間，我沒有太多閒暇時間。"},{"id":1714,"word":"leisurely","pos":"adj","meaning":"adj. 悠閒的；從容的 (adv) 從容地","example":"They took a leisurely walk through the park on Sunday.","example_zh":"他們週日在公園裡悠閒地散步。"},{"id":1715,"word":"lengthen","pos":"v","meaning":"v. 加長；（使）變長","example":"The days begin to lengthen as spring approaches.","example_zh":"隨著春天接近，白天開始變長。"},{"id":1716,"word":"lens","pos":"n","meaning":"n. 透鏡；鏡片","example":"The camera lens needs to be cleaned to take clear photos.","example_zh":"相機鏡片需要清潔才能拍出清晰的照片。"},{"id":1717,"word":"lest","pos":"conj","meaning":"conj. 以免","example":"He studied hard lest he should fail the final exam.","example_zh":"他努力讀書以免期末考不及格。"},{"id":1718,"word":"let alone","pos":"phr","meaning":"phr. 更不用說","example":"He can barely afford rent, let alone buy a new car.","example_zh":"他連房租都快付不起，更不用說買新車了。"},{"id":1719,"word":"let go (of something)","pos":"phr","meaning":"phr. 捨棄，放棄","example":"It is time to let go of your past mistakes and move forward.","example_zh":"是時候捨棄（放下）過去的錯誤並向前看了。"},{"id":1720,"word":"level","pos":"n","meaning":"n. 數量，含量，程度，水準","example":"The pollution level in the river has become very dangerous.","example_zh":"河川中的汙染程度已變得非常危險。"},{"id":1721,"word":"liar","pos":"n","meaning":"n. 說謊的人；騙子","example":"Nobody trusts him because he is a known liar.","example_zh":"沒有人相信他，因為他是有名的騙子。"},{"id":1722,"word":"liberal","pos":"adj","meaning":"adj. 慷慨的；自由主義的；不守舊的；無偏見的；（思想）開放的","example":"She has very liberal views on education.","example_zh":"她對教育有非常開明（自由主義）的看法。"},{"id":1723,"word":"liberty","pos":"n","meaning":"n. 自由","example":"People fought for their liberty and independence.","example_zh":"人們為他們的自由與獨立而戰。"},{"id":1724,"word":"librarian","pos":"n","meaning":"n. 圖書館員","example":"The librarian helped me find the book I needed.","example_zh":"圖書館員幫我找到了我需要的書。"},{"id":1725,"word":"license","pos":"n","meaning":"n. 許可證；執照 (v) 准許","example":"You need a driver's license to drive a car legally.","example_zh":"你需要駕照才能合法開車。"},{"id":1726,"word":"lifeboat","pos":"n","meaning":"n. 救生艇","example":"The crew lowered the lifeboat into the water during the emergency.","example_zh":"緊急狀況時，船員將救生艇放入水中。"},{"id":1727,"word":"lifeguard","pos":"n","meaning":"n. 救生員","example":"The lifeguard rescued the swimmer who was in trouble.","example_zh":"救生員救起了發生困難的游泳者。"},{"id":1728,"word":"lifetime","pos":"n","meaning":"n. 一生；終身","example":"He has dreamed of traveling the world his entire lifetime.","example_zh":"他一生都夢想著環遊世界。"},{"id":1729,"word":"lighten","pos":"v","meaning":"v. 減輕；使明亮","example":"The new design helps to lighten the weight of the bag.","example_zh":"新的設計有助於減輕包包的重量。"}]},
{"unit":14,"unit_label":"p.27-28","words":[{"id":1730,"word":"lighthouse","pos":"n","meaning":"n. 燈塔","example":"The lighthouse guides ships safely to the harbor at night.","example_zh":"燈塔在夜晚引導船隻安全進入港口。"},{"id":1731,"word":"limb","pos":"n","meaning":"n. 肢；臂；腿；翼","example":"He lost a limb in the accident but still plays sports.","example_zh":"他在意外中失去了一肢，但仍參與運動。"},{"id":1732,"word":"limit","pos":"n","meaning":"n. 限制，限定；限度，極限","example":"There is a limit to how much work one person can do.","example_zh":"一個人能做的工作量是有極限的。"},{"id":1733,"word":"limitation","pos":"n","meaning":"n. 限制","example":"One of the limitations of this study is the small sample size.","example_zh":"這項研究的其中一個限制是樣本數太小。"},{"id":1734,"word":"limited","pos":"adj","meaning":"adj. 有限的","example":"The number of tickets for the concert is limited.","example_zh":"演唱會的門票數量有限。"},{"id":1735,"word":"linen","pos":"n","meaning":"n. 亞麻；亞麻布","example":"She loves wearing clothes made of linen in the summer.","example_zh":"她夏天喜歡穿亞麻做的衣服。"},{"id":1736,"word":"lipstick","pos":"n","meaning":"n. 口紅","example":"She applied a bright red lipstick before going out.","example_zh":"她出門前擦了一層亮紅色的口紅。"},{"id":1737,"word":"liquid","pos":"adj/n","meaning":"adj/n. 液體（的）","example":"Water is a liquid at room temperature.","example_zh":"水在室溫下是液體。"},{"id":1738,"word":"liquor","pos":"n","meaning":"n. 烈酒","example":"He only drinks expensive liquor on special occasions.","example_zh":"他只在特殊場合喝昂貴的烈酒。"},{"id":1739,"word":"literary","pos":"adj","meaning":"adj. 文學的","example":"She has a deep interest in literary works from the 19th century.","example_zh":"她對19世紀的文學作品有深厚的興趣。"},{"id":1740,"word":"literature","pos":"n","meaning":"n. 文學（作品）","example":"English literature is a popular major in this university.","example_zh":"英國文學是這所大學熱門的主修科目。"},{"id":1741,"word":"litter","pos":"v","meaning":"v. 亂扔；把～弄亂 (n) 垃圾；一窩小動物","example":"It is against the law to litter in the park.","example_zh":"在公園亂扔垃圾是違法的。"},{"id":1742,"word":"live on","pos":"phr","meaning":"phr. 以～維持生命，靠～生活","example":"Some small animals live on insects and nuts.","example_zh":"一些小動物靠昆蟲和堅果維持生命。"},{"id":1743,"word":"live out (something)","pos":"phr","meaning":"phr. 實現某事","example":"He finally managed to live out his dream of becoming a pilot.","example_zh":"他最終成功實現了成為飛行員的夢想。"},{"id":1744,"word":"lively","pos":"adj","meaning":"adj. 活潑的；輕快的；熱烈的","example":"The party was very lively with music and dancing.","example_zh":"這場派對有音樂和舞蹈，非常活潑（熱鬧）。"},{"id":1745,"word":"liver","pos":"n","meaning":"n. 肝臟","example":"Alcohol consumption can damage your liver.","example_zh":"飲酒會損害你的肝臟。"},{"id":1746,"word":"load","pos":"n","meaning":"n. 裝載的物品；負擔 (v) 把貨物裝上；裝子彈於","example":"Please help me load the boxes into the truck.","example_zh":"請幫我把箱子裝上卡車。"},{"id":1747,"word":"loan","pos":"n","meaning":"n. 貸款；借貸 (v) 借貸","example":"He applied for a bank loan to start his business.","example_zh":"他申請了一筆銀行貸款來創業。"},{"id":1748,"word":"lobby","pos":"n","meaning":"n. 大廳","example":"We met in the hotel lobby at noon.","example_zh":"我們中午在飯店大廳見面。"},{"id":1749,"word":"lobster","pos":"n","meaning":"n. 龍蝦","example":"They enjoyed a fresh lobster dinner by the sea.","example_zh":"他們在海邊享用了新鮮的龍蝦晚餐。"},{"id":1750,"word":"locate","pos":"v","meaning":"v. 找出位置，建置於～","example":"The police are trying to locate the missing car.","example_zh":"警方正試圖找出失蹤車輛的位置。"},{"id":1751,"word":"location","pos":"n","meaning":"n. 位置","example":"The location of the new restaurant is very convenient.","example_zh":"這家新餐廳的位置非常方便。"},{"id":1752,"word":"locker","pos":"n","meaning":"n. （加鎖的）置物櫃","example":"You can leave your bag in the locker at the gym.","example_zh":"你可以把包包放在健身房的置物櫃裡。"},{"id":1753,"word":"logic","pos":"n","meaning":"n. 常理；邏輯","example":"There is no logic in his argument; it doesn't make sense.","example_zh":"他的論點沒有邏輯；這說不通。"},{"id":1754,"word":"logical","pos":"adj","meaning":"adj. 合乎邏輯的；合理的","example":"A logical explanation can help people understand the situation.","example_zh":"一個合理的解釋可以幫助人們了解狀況。"},{"id":1755,"word":"lollipop","pos":"n","meaning":"n. 棒棒糖","example":"The child was happy with his strawberry lollipop.","example_zh":"那個孩子對他的草莓棒棒糖感到開心。"},{"id":1756,"word":"look back","pos":"phr","meaning":"phr. 回憶，回首(往事)","example":"Sometimes it is good to look back at your childhood memories.","example_zh":"有時候回首童年回憶是件好事。"},{"id":1757,"word":"look forward to (Ving) something","pos":"phr","meaning":"phr. 高興地期盼","example":"I look forward to meeting you next week.","example_zh":"我很期待下週見到你。"},{"id":1758,"word":"look into","pos":"phr","meaning":"phr. 調查","example":"The detectives will look into the suspicious activity.","example_zh":"偵探們將會調查那項可疑行動。"},{"id":1759,"word":"look up","pos":"phr","meaning":"phr. 查閱","example":"If you don't know the word, you can look it up in the dictionary.","example_zh":"如果你不認識那個字，你可以查字典。"},{"id":1760,"word":"loop","pos":"n","meaning":"n. 圈；環狀物","example":"The magician made a loop with the rope.","example_zh":"魔術師用繩子做了一個圈。"},{"id":1761,"word":"loose","pos":"adj","meaning":"adj. 鬆的","example":"These pants are too loose at the waist.","example_zh":"這條褲子腰部太鬆了。"},{"id":1762,"word":"loosen","pos":"v","meaning":"v. 鬆開","example":"You need to loosen the knot before you can untie it.","example_zh":"你需要先鬆開結，才能把它解開。"},{"id":1763,"word":"lord","pos":"n","meaning":"n. 貴族；主人","example":"In ancient times, the lord owned the land and the people who worked it.","example_zh":"在古代，貴族擁有土地以及在土地上工作的人。"},{"id":1764,"word":"lose one's mind","pos":"phr","meaning":"phr. 發瘋","example":"He must have lost his mind to do something so dangerous!","example_zh":"他一定是發瘋了才會做這麼危險的事！"},{"id":1765,"word":"lotion","pos":"n","meaning":"n. 化妝水；乳液","example":"She uses moisturizing lotion after taking a shower.","example_zh":"她洗完澡後會使用保濕乳液。"},{"id":1766,"word":"loudspeaker","pos":"n","meaning":"n. 擴音器","example":"The voice from the loudspeaker was very clear.","example_zh":"從擴音器傳出的聲音非常清晰。"},{"id":1767,"word":"lousy","pos":"adj","meaning":"adj. 討厭的","example":"The weather has been lousy for the past few days.","example_zh":"過去幾天，天氣一直很討厭。"},{"id":1768,"word":"loyal","pos":"adj","meaning":"adj. 忠實的；忠誠的","example":"She is a loyal friend who always supports me.","example_zh":"她是一位總支持我的忠實朋友。"},{"id":1769,"word":"loyalty","pos":"n","meaning":"n. 忠實","example":"He demonstrated his loyalty to the company by working there for 30 years.","example_zh":"他在那家公司工作了30年，展現了他對公司的忠誠。"},{"id":1770,"word":"luggage","pos":"n","meaning":"n. 行李","example":"Please weigh your luggage before you go to the airport.","example_zh":"請在去機場前秤一下你的行李。"},{"id":1771,"word":"lullaby","pos":"n","meaning":"n. 催眠曲；搖籃曲","example":"She sang a soft lullaby to help the baby fall asleep.","example_zh":"她唱了一首輕柔的搖籃曲來幫助嬰兒入睡。"},{"id":1772,"word":"lung","pos":"n","meaning":"n. 肺","example":"Smoking is extremely harmful to your lungs.","example_zh":"抽菸對你的肺部極度有害。"},{"id":1773,"word":"luxurious","pos":"adj","meaning":"adj. 奢侈的；豐盛的；豪華的","example":"They stayed at a luxurious hotel with a beautiful pool.","example_zh":"他們住進了一間有美麗泳池的豪華飯店。"},{"id":1774,"word":"luxury","pos":"n","meaning":"n. 豪華；奢侈品","example":"Buying a sports car is a real luxury.","example_zh":"買跑車是一種真正的奢侈。"},{"id":1775,"word":"machinery","pos":"n","meaning":"n. 機器（總稱）","example":"The factory is filled with heavy machinery for production.","example_zh":"工廠裡充滿了用於生產的重型機器。"},{"id":1776,"word":"madam","pos":"n","meaning":"n. 女士；夫人","example":"Excuse me, madam, may I help you?","example_zh":"打擾了，女士，有什麼我可以幫您的嗎？"},{"id":1777,"word":"magic","pos":"n","meaning":"n. 魔法 (adj) 魔術的","example":"The children believe in magic and fairytales.","example_zh":"孩子們相信魔法與童話。"},{"id":1778,"word":"magical","pos":"adj","meaning":"adj. 魔法的；迷人的","example":"The forest has a magical quality at dawn.","example_zh":"森林在黎明時有一種迷人的氛圍。"},{"id":1779,"word":"magician","pos":"n","meaning":"n. 魔術師","example":"The magician pulled a rabbit out of his hat.","example_zh":"魔術師從他的帽子裡拉出一隻兔子。"},{"id":1780,"word":"magnet","pos":"n","meaning":"n. 磁鐵；有吸引力的人或物","example":"The small magnet sticks to the refrigerator.","example_zh":"那塊小磁鐵吸在冰箱上。"},{"id":1781,"word":"magnetic","pos":"adj","meaning":"adj. 有磁性的；有吸引力的","example":"He has a magnetic personality that attracts many people.","example_zh":"他有一種吸引許多人的迷人性格。"},{"id":1782,"word":"magnificent","pos":"adj","meaning":"adj. 華麗的","example":"The palace is a magnificent building with gold decorations.","example_zh":"那座宮殿是一棟有黃金裝飾的華麗建築物。"},{"id":1783,"word":"maid","pos":"n","meaning":"n. 女僕；少女","example":"The maid cleaned the guest rooms every morning.","example_zh":"女僕每天早上清掃客房。"},{"id":1784,"word":"maintain","pos":"v","meaning":"v. 維持","example":"It is hard to maintain a healthy weight without exercise.","example_zh":"沒有運動很難維持健康的體重。"},{"id":1785,"word":"maintenance","pos":"n","meaning":"n. 維修，保養","example":"The maintenance of the building is very expensive.","example_zh":"這棟建築物的維修費非常昂貴。"},{"id":1786,"word":"major","pos":"adj","meaning":"adj. 主要的 (v) 主修 (n) 主修科目","example":"History is her major at the university.","example_zh":"歷史是她在大學的主修科目。"},{"id":1787,"word":"majority","pos":"n","meaning":"n. 多數","example":"The majority of the students voted in favor of the new plan.","example_zh":"大多數學生投下贊成票支持新計畫。"},{"id":1788,"word":"make it","pos":"phr","meaning":"phr. 及時趕到；成功","example":"We ran fast and managed to make it to the station on time.","example_zh":"我們跑得很快，設法及時趕到車站。"},{"id":1789,"word":"make it through","pos":"phr","meaning":"phr. 熬過","example":"It was a difficult illness, but he finally made it through.","example_zh":"這是一場嚴重的疾病，但他最終熬過來了。"},{"id":1790,"word":"make sense","pos":"phr","meaning":"phr. 合乎情理；明智；說得通；易於理解","example":"It makes sense to save money for the future.","example_zh":"為未來存錢是合乎情理的。"},{"id":1791,"word":"make the headlines","pos":"phr","meaning":"phr. 成為重要新聞、頭條","example":"The scandal is sure to make the headlines tomorrow.","example_zh":"這樁醜聞明天肯定會成為頭條。"},{"id":1792,"word":"make the most of something","pos":"phr","meaning":"phr. 充分利用(某物)","example":"You should make the most of your time while you are young.","example_zh":"你年輕時應該充分利用你的時間。"},{"id":1793,"word":"make up (something)","pos":"phr","meaning":"phr. 組成 編造","example":"They had to make up a story to explain why they were late.","example_zh":"他們必須編造一個故事來解釋為什麼遲到。"},{"id":1794,"word":"make up one's mind","pos":"phr","meaning":"phr. 下定決心","example":"He finally made up his mind to quit his job.","example_zh":"他終於下定決心辭職。"},{"id":1795,"word":"makeup","pos":"n","meaning":"n. 組成；構成；化妝（品）","example":"Her makeup was perfect for the evening event.","example_zh":"她的妝容在晚宴上非常完美。"},{"id":1796,"word":"mall","pos":"n","meaning":"n. 購物中心","example":"We spent the afternoon walking around the mall.","example_zh":"我們花了一下午在購物中心逛街。"},{"id":1797,"word":"manage","pos":"v","meaning":"v. 經營；管理；設法做到","example":"How do you manage to finish so much work in one day?","example_zh":"你是如何設法在一天內完成這麼多工作的？"},{"id":1798,"word":"manageable","pos":"adj","meaning":"adj. 能處理的","example":"The amount of work is manageable if we share the tasks.","example_zh":"如果我們分擔任務，工作量是可以處理的。"},{"id":1799,"word":"manager","pos":"n","meaning":"n. 管理人員；經理","example":"She is the manager of this department.","example_zh":"她是這個部門的經理。"},{"id":1800,"word":"mankind","pos":"n","meaning":"n. 人類","example":"The development of technology has changed the life of mankind.","example_zh":"科技的發展改變了人類的生活。"},{"id":1801,"word":"manners","pos":"n","meaning":"n. 禮貌；規矩","example":"It is important to have good table manners.","example_zh":"擁有良好的餐桌禮儀很重要。"},{"id":1802,"word":"manual","pos":"adj","meaning":"adj. 耗體力的；用手操作的 (n) 手冊","example":"He prefers manual labor to working in an office.","example_zh":"他比起在辦公室工作，更喜歡體力勞動。"},{"id":1803,"word":"manufacture","pos":"v","meaning":"v. (n) 製造","example":"This company manufactures high-quality electronic components.","example_zh":"這家公司製造高品質的電子零件。"},{"id":1804,"word":"manufacturer","pos":"n","meaning":"n. 製造商","example":"The manufacturer provides a two-year warranty for this product.","example_zh":"製造商為該產品提供兩年保固。"},{"id":1805,"word":"marathon","p
