rry I was rude to you. I take back what I said.","example_zh":"很抱歉我對你很無禮，我收回我說的話。"},{"id":2866,"word":"take up","pos":"phr","meaning":"phr. 佔據","example":"The big sofa takes up too much space in our small living room.","example_zh":"那張大沙發佔據了我們小客廳太多的空間。"},{"id":2867,"word":"talk someone into doing something","pos":"phr","meaning":"phr. 說服某人做某事","example":"My friends talked me into joining the school choir.","example_zh":"我的朋友們說服我加入了學校的合唱團。"},{"id":2868,"word":"tame","pos":"adj","meaning":"adj. 馴服的；溫順的 (v) 馴服","example":"The tame rabbit ate carrots right from the girl's hand.","example_zh":"那隻溫順的兔子直接從女孩的手上吃紅蘿蔔。"},{"id":2869,"word":"tap","pos":"v","meaning":"v. 輕拍 (n) 輕拍；水龍頭","example":"She tapped me on the shoulder to get my attention.","example_zh":"她輕拍我的肩膀來引起我的注意。"},{"id":2870,"word":"tax","pos":"n","meaning":"n. 稅","example":"People who earn more money usually pay more tax.","example_zh":"賺比較多錢的人通常要繳比較多稅。"},{"id":2871,"word":"tease","pos":"v","meaning":"v. 取笑；嘲弄","example":"The older boys teased him about his new haircut.","example_zh":"那些大男孩們取笑他的新髮型。"},{"id":2872,"word":"technical","pos":"adj","meaning":"adj. 技術的；專門性的","example":"The company called a technical expert to fix the computer problem.","example_zh":"公司請了一位技術專家來解決電腦的問題。"},{"id":2873,"word":"technician","pos":"n","meaning":"n. 技術人員","example":"A technician came to our house to repair the air conditioner.","example_zh":"一位技術人員來到我們家修理冷氣機。"},{"id":2874,"word":"technique","pos":"n","meaning":"n. 技能；技巧","example":"The teacher showed us a useful technique for memorizing new words.","example_zh":"老師教了我們一個背新單字的實用技巧。"},{"id":2875,"word":"technological","pos":"adj","meaning":"adj. 技術的","example":"Technological progress has changed the way we communicate.","example_zh":"技術的進步已經改變了我們溝通的方式。"},{"id":2876,"word":"technology","pos":"n","meaning":"n. 科技；工藝；技術","example":"Modern technology allows us to talk to people on the other side of the world.","example_zh":"現代科技讓我們能夠與地球另一端的人交談。"},{"id":2877,"word":"telegram","pos":"n","meaning":"n. 電報","example":"In the past, people sent a telegram when they needed to deliver urgent news.","example_zh":"以前的人需要傳遞緊急消息時會發電報。"},{"id":2878,"word":"telegraph","pos":"n","meaning":"n. 電報 (v) 打電報（給某人）","example":"The telegraph was an important invention in the nineteenth century.","example_zh":"電報是十九世紀的一項重要發明。"},{"id":2879,"word":"telescope","pos":"n","meaning":"n. 望遠鏡","example":"We used a telescope to look at the moon last night.","example_zh":"我們昨晚用望遠鏡觀察月亮。"},{"id":2880,"word":"temper","pos":"n","meaning":"n. 脾氣；情緒","example":"He has a bad temper and often gets angry over small things.","example_zh":"他脾氣很差，常常為小事生氣。"},{"id":2881,"word":"temperature","pos":"n","meaning":"n. 氣溫，體溫","example":"The temperature dropped to five degrees last night.","example_zh":"昨晚氣溫降到了五度。"},{"id":2882,"word":"temporary","pos":"adj","meaning":"adj. 暫時的","example":"This is only a temporary solution, so we need to find a better one.","example_zh":"這只是個暫時的解決辦法，所以我們需要找到更好的辦法。"},{"id":2883,"word":"tempt","pos":"v","meaning":"v. 引誘，吸引","example":"The smell of fresh bread tempted me to buy a loaf.","example_zh":"剛出爐麵包的香味誘使我買了一條。"},{"id":2884,"word":"temptation","pos":"n","meaning":"n. 誘惑","example":"It was hard to resist the temptation to check my phone during class.","example_zh":"上課時很難抗拒查看手機的誘惑。"},{"id":2885,"word":"tend","pos":"v","meaning":"v. 傾向，往往","example":"Teenagers tend to stay up late on weekends.","example_zh":"青少年週末往往會熬夜。"},{"id":2886,"word":"tendency","pos":"n","meaning":"n. 傾向，趨勢","example":"There is a growing tendency among young people to shop online.","example_zh":"年輕人之間有越來越多人傾向於網路購物。"},{"id":2887,"word":"tender","pos":"adj","meaning":"adj. 溫柔的；柔軟的","example":"She sang a tender song to help the baby fall asleep.","example_zh":"她唱了一首溫柔的歌，幫助寶寶入睡。"},{"id":2888,"word":"tense","pos":"adj","meaning":"adj. 緊張的 (n) 時態；時式","example":"I always feel tense before an important exam.","example_zh":"重要考試之前，我總是感到緊張。"},{"id":2889,"word":"tension","pos":"n","meaning":"n. 緊張；張力","example":"There was a lot of tension in the room before the results were announced.","example_zh":"成績公布之前，房間裡充滿了緊張的氣氛。"},{"id":2890,"word":"terrified","pos":"adj","meaning":"adj. 恐懼的","example":"The terrified child hid under the bed during the thunderstorm.","example_zh":"那個受到驚嚇的孩子在雷雨期間躲到了床底下。"},{"id":2891,"word":"terrify","pos":"v","meaning":"v. 使害怕","example":"The sound of thunder used to terrify my little sister.","example_zh":"雷聲以前會把我妹妹嚇壞。"},{"id":2892,"word":"territory","pos":"n","meaning":"n. 領土","example":"The two countries have fought for years over the territory near the border.","example_zh":"這兩個國家為了邊界附近的領土爭戰多年。"},{"id":2893,"word":"terror","pos":"n","meaning":"n. 恐怖；驚恐","example":"The children screamed in terror when the lights suddenly went out.","example_zh":"燈突然熄滅時，孩子們驚恐地尖叫。"},{"id":2894,"word":"text","pos":"n","meaning":"n. 正文；課文","example":"Please read the text on page 20 and answer the questions below.","example_zh":"請閱讀第20頁的課文並回答下面的問題。"},{"id":2895,"word":"thankful","pos":"adj","meaning":"adj. 感激的","example":"I am thankful for all the help you gave me this year.","example_zh":"我很感謝你今年給我的所有幫助。"},{"id":2896,"word":"thankfully","pos":"adv","meaning":"adv. 幸虧，感激地","example":"Thankfully, nobody was hurt in the small accident.","example_zh":"幸好在這場小意外中沒有人受傷。"},{"id":2897,"word":"thanks to","pos":"phr","meaning":"phr. 由於 幸虧","example":"Thanks to your advice, I passed the interview.","example_zh":"多虧你的建議，我通過了面試。"},{"id":2898,"word":"that is","pos":"phr","meaning":"phr. 也就是說(= in other words)","example":"He is a vegetarian; that is, he doesn't eat any meat or fish.","example_zh":"他是素食者，也就是說，他不吃任何肉類或魚類。"},{"id":2899,"word":"theme","pos":"n","meaning":"n. 主題","example":"The main theme of the story is the importance of friendship.","example_zh":"這個故事的主題是友誼的重要性。"},{"id":2900,"word":"theory","pos":"n","meaning":"n. 理論","example":"Darwin's theory of evolution changed the way people think about life.","example_zh":"達爾文的進化論改變了人們對生命的看法。"},{"id":2901,"word":"there is no denying that","pos":"phr","meaning":"phr. 無庸置疑","example":"There is no denying that regular exercise is good for your health.","example_zh":"無庸置疑，規律運動對健康有益。"},{"id":2902,"word":"think a lot of","pos":"phr","meaning":"phr. 對～評價很高","example":"Everyone in the office thinks a lot of our new manager.","example_zh":"辦公室裡的每個人都對我們的新經理評價很高。"},{"id":2903,"word":"think of","pos":"phr","meaning":"phr. 為～著想，設想","example":"She always thinks of others before she makes a decision.","example_zh":"她做決定之前總是先為別人著想。"},{"id":2904,"word":"think up","pos":"phr","meaning":"phr. 想出","example":"We need to think up a new way to raise money for the school trip.","example_zh":"我們得想出一個新方法來為校外旅行籌錢。"}]},
{"unit":23,"unit_label":"p.45-46","words":[{"id":2905,"word":"thirst","pos":"n","meaning":"n. 口渴；渴望 (v) 渴望","example":"After the long walk in the sun, his thirst was almost unbearable.","example_zh":"在太陽底下走了很久之後，他口渴得幾乎受不了。"},{"id":2906,"word":"thorough","pos":"adj","meaning":"adj. 徹底的；完全的","example":"The police made a thorough search of the house but found nothing.","example_zh":"警方徹底搜查了那間房子，但什麼也沒找到。"},{"id":2907,"word":"thoroughly","pos":"adv","meaning":"adv. 完全地；徹底地","example":"I thoroughly enjoyed the movie, and I want to watch it again.","example_zh":"我非常喜歡這部電影，還想再看一次。"},{"id":2908,"word":"thoughtful","pos":"adj","meaning":"adj. 體貼的；沉思的；思考的","example":"It was thoughtful of you to bring me an umbrella when it started to rain.","example_zh":"開始下雨時你幫我帶傘，真是體貼。"},{"id":2909,"word":"thread","pos":"n","meaning":"n. 線","example":"She used a needle and thread to fix the button on her coat.","example_zh":"她用針和線把外套上的鈕扣縫好。"},{"id":2910,"word":"threat","pos":"n","meaning":"n. 威脅","example":"Pollution is a serious threat to the health of people in big cities.","example_zh":"污染對大城市居民的健康是一項嚴重的威脅。"},{"id":2911,"word":"threaten","pos":"v","meaning":"v. 威脅","example":"The boy threatened to tell the teacher if his classmate didn't stop.","example_zh":"那個男孩威脅同學，如果他不停手，就要告訴老師。"},{"id":2912,"word":"throughout","pos":"prep","meaning":"prep. 遍及，從頭到尾","example":"It rained heavily throughout the night, so we couldn't sleep well.","example_zh":"雨整夜都下得很大，所以我們沒辦法睡好。"},{"id":2913,"word":"thus","pos":"adv","meaning":"adv. 因此","example":"He was sick all week and thus could not attend the final meeting.","example_zh":"他整個星期都在生病，因此無法參加最後一次會議。"},{"id":2914,"word":"tickle","pos":"v","meaning":"v. 搔癢 (n) 癢的感覺","example":"The soft feather tickled my nose and made me laugh.","example_zh":"那根柔軟的羽毛搔著我的鼻子，讓我笑了起來。"},{"id":2915,"word":"tide","pos":"n","meaning":"n. 潮汐；潮水","example":"The tide is low now, so we can walk along the beach and look for shells.","example_zh":"現在是退潮，所以我們可以沿著海灘走，尋找貝殼。"},{"id":2916,"word":"tidy","pos":"adj","meaning":"adj. 整齊的 (v) 使整齊；整理","example":"She keeps her room tidy, and everything is in its place.","example_zh":"她把房間保持得很整齊，所有東西都在固定的位置。"},{"id":2917,"word":"tight","pos":"adj","meaning":"adj. 緊的 (adv) 緊緊地；牢固地","example":"These shoes are too tight, so my feet hurt after walking.","example_zh":"這雙鞋太緊了，所以我走路後腳會痛。"},{"id":2918,"word":"tighten","pos":"v","meaning":"v. 把～弄緊","example":"You should tighten the screw to keep the chair from shaking.","example_zh":"你應該把螺絲鎖緊，椅子才不會搖晃。"},{"id":2919,"word":"timber","pos":"n","meaning":"n. 木材","example":"The house was built with timber from the nearby forest.","example_zh":"這間房子是用附近森林的木材蓋成的。"},{"id":2920,"word":"timid","pos":"adj","meaning":"adj. 膽小的","example":"The timid girl was afraid to speak in front of the class.","example_zh":"那個膽小的女孩不敢在全班面前說話。"},{"id":2921,"word":"tip","pos":"n","meaning":"n. 訣竅，小費","example":"The teacher gave us some useful tips on how to write a good essay.","example_zh":"老師給了我們一些關於如何寫好作文的實用訣竅。"},{"id":2922,"word":"tiresome","pos":"adj","meaning":"adj. 令人討厭的；煩人的","example":"It's tiresome to listen to the same story again and again.","example_zh":"一再聽同一個故事真是讓人厭煩。"},{"id":2923,"word":"tissue","pos":"n","meaning":"n. （生物的）組織；面紙","example":"She wiped her tears with a tissue and tried to smile.","example_zh":"她用面紙擦掉眼淚，努力擠出微笑。"},{"id":2924,"word":"to … extent","pos":"phr","meaning":"phr. 到達～程度","example":"To some extent, you are right, but I still don't agree with your plan.","example_zh":"在某種程度上你是對的，但我還是不同意你的計畫。"},{"id":2925,"word":"to be sure","pos":"phr","meaning":"phr. 不可否認","example":"To be sure, the plan has some problems, but it is still worth trying.","example_zh":"不可否認，這個計畫有些問題，但仍然值得一試。"},{"id":2926,"word":"to date","pos":"phr","meaning":"phr. 到目前為止","example":"To date, more than ten thousand people have signed up for the event.","example_zh":"到目前為止，已有超過一萬人報名這項活動。"},{"id":2927,"word":"to name but a few","pos":"phr","meaning":"phr. 略舉幾例","example":"Many animals live in this forest, such as deer, monkeys and owls, to name but a few.","example_zh":"這座森林裡住著許多動物，像是鹿、猴子和貓頭鷹，這只是略舉幾例。"},{"id":2928,"word":"tobacco","pos":"n","meaning":"n. 菸草","example":"Smoking tobacco is a major cause of lung disease.","example_zh":"吸菸草是肺部疾病的主要原因。"},{"id":2929,"word":"tolerable","pos":"adj","meaning":"adj. 可忍受的","example":"The noise from the street was tolerable, so I could still study.","example_zh":"街上的噪音還在可以忍受的範圍內，所以我仍然能讀書。"},{"id":2930,"word":"tolerance","pos":"n","meaning":"n. 寬容；忍耐（力）","example":"A teacher needs a lot of tolerance when working with young children.","example_zh":"老師在帶領年幼的孩子時需要很大的耐心。"},{"id":2931,"word":"tolerant","pos":"adj","meaning":"adj. 寬容的","example":"We should be tolerant of people who have different opinions.","example_zh":"我們應該寬容對待意見不同的人。"},{"id":2932,"word":"tolerate","pos":"v","meaning":"v. 忍受","example":"I can't tolerate people who talk loudly on their phones in the library.","example_zh":"我無法忍受有人在圖書館裡大聲講電話。"},{"id":2933,"word":"tomb","pos":"n","meaning":"n. 墳墓","example":"The tomb of the ancient king was found deep under the ground.","example_zh":"那位古代國王的墳墓是在地底深處被發現的。"},{"id":2934,"word":"ton","pos":"n","meaning":"n. 公噸","example":"The truck can carry up to five tons of rice.","example_zh":"這輛卡車最多可以載運五公噸的米。"},{"id":2935,"word":"tortoise","pos":"n","meaning":"n. 烏龜","example":"The tortoise moved slowly, but it finally reached the other side of the road.","example_zh":"烏龜移動得很慢，但最後還是走到了馬路的另一邊。"},{"id":2936,"word":"torture","pos":"v/n","meaning":"v/n. 折磨","example":"The noise from the construction site tortured the neighbors all day long.","example_zh":"工地的噪音整天折磨著鄰居們。"},{"id":2937,"word":"toss","pos":"n","meaning":"n. 扔；拋 (v) 扔；拋","example":"He tossed the ball to his friend, who caught it with one hand.","example_zh":"他把球拋給朋友，朋友單手接住了。"},{"id":2938,"word":"tough","pos":"adj","meaning":"adj. 辛苦的；賣力的；咬不動的","example":"Being a farmer is a tough job because you have to work in all kinds of weather.","example_zh":"當農夫是份辛苦的工作，因為各種天氣都得下田工作。"},{"id":2939,"word":"tourism","pos":"n","meaning":"n. 旅遊（業）","example":"Tourism is an important source of income for this small island.","example_zh":"觀光業是這座小島重要的收入來源。"},{"id":2940,"word":"tourist","pos":"n","meaning":"n. 遊客","example":"The tourist asked me how to get to the night market.","example_zh":"那位遊客問我怎麼去夜市。"},{"id":2941,"word":"trace","pos":"v","meaning":"v. 追溯來源，追蹤 (n) 痕跡","example":"Scientists traced the disease back to a small village in Africa.","example_zh":"科學家追溯發現這種疾病源自非洲的一個小村莊。"},{"id":2942,"word":"track down","pos":"phr","meaning":"phr. (經長時間)追蹤到","example":"It took the police several months to track down the thief.","example_zh":"警方花了好幾個月才追蹤到那名小偷。"},{"id":2943,"word":"trade","pos":"v/n","meaning":"v/n. 交換，交易","example":"The two countries trade rice and tea with each other.","example_zh":"這兩個國家彼此交易稻米和茶葉。"},{"id":2944,"word":"trader","pos":"n","meaning":"n. 商人","example":"The trader sold silk and spices at the busy market.","example_zh":"那位商人在熱鬧的市場裡販賣絲綢和香料。"},{"id":2945,"word":"tradition","pos":"n","meaning":"n. 傳統","example":"Eating dumplings on New Year's Eve is a family tradition.","example_zh":"除夕夜吃水餃是一項家庭傳統。"},{"id":2946,"word":"traditional","pos":"adj","meaning":"adj. 傳統的","example":"They wore traditional clothes to celebrate the festival.","example_zh":"他們穿著傳統服飾慶祝這個節日。"},{"id":2947,"word":"tragedy","pos":"n","meaning":"n. 悲劇；悲慘的事；不幸的事件","example":"The sinking of the ship was a terrible tragedy that no one will forget.","example_zh":"那艘船的沉沒是一場沒有人會忘記的可怕悲劇。"},{"id":2948,"word":"tragic","pos":"adj","meaning":"adj. 悲劇的；悲慘的；不幸的","example":"The tragic news of the accident made everyone in the town very sad.","example_zh":"那起意外的不幸消息讓鎮上的每個人都很難過。"},{"id":2949,"word":"trample","pos":"v","meaning":"v. 踐踏，踩踏","example":"The crowd trampled the flowers in the garden when they ran out.","example_zh":"人群跑出來時踐踏了花園裡的花。"},{"id":2950,"word":"transform","pos":"v","meaning":"v. 改變","example":"Just add water, and the powder will transform into a thick drink.","example_zh":"只要加水，這種粉末就會變成濃稠的飲料。"},{"id":2951,"word":"transformation","pos":"n","meaning":"n. 轉變","example":"The old factory underwent a complete transformation into a modern art center.","example_zh":"那座舊工廠徹底轉變成一座現代藝術中心。"},{"id":2952,"word":"translate","pos":"v","meaning":"v. 翻譯","example":"Could you translate this letter from Chinese into English?","example_zh":"你可以把這封信從中文翻譯成英文嗎？"},{"id":2953,"word":"translation","pos":"n","meaning":"n. 翻譯","example":"The translation of the poem lost some of its original beauty.","example_zh":"這首詩的翻譯失去了一些原有的美感。"},{"id":2954,"word":"translator","pos":"n","meaning":"n. 譯者；翻譯家","example":"The translator worked on the novel for two years before it was published.","example_zh":"這位譯者花了兩年翻譯那本小說，後來才出版。"},{"id":2955,"word":"transport","pos":"v","meaning":"v. 運輸；運送","example":"Large trucks transport fresh vegetables from the farms to the city every morning.","example_zh":"大卡車每天早上把新鮮蔬菜從農場運送到城裡。"},{"id":2956,"word":"transportation","pos":"n","meaning":"n. 運輸（工具）","example":"Public transportation in Taipei is convenient and cheap.","example_zh":"台北的大眾運輸方便又便宜。"},{"id":2957,"word":"trap","pos":"v","meaning":"v. 使困於（險境）(n)困境，陷阱","example":"The hunter set a trap in the forest to catch a wild rabbit.","example_zh":"獵人在森林裡設了陷阱，想抓一隻野兔。"},{"id":2958,"word":"trash","pos":"n","meaning":"n. 垃圾；廢物","example":"Please put the trash in the bin and don't throw it on the ground.","example_zh":"請把垃圾丟進垃圾桶，不要亂丟在地上。"},{"id":2959,"word":"traveler","pos":"n","meaning":"n. 旅客","example":"The traveler asked for directions at the small station.","example_zh":"那位旅客在小車站向人問路。"},{"id":2960,"word":"tray","pos":"n","meaning":"n. 托盤","example":"The waiter carried a tray of cold drinks to our table.","example_zh":"服務生端著一托盤的冷飲來到我們的桌子。"},{"id":2961,"word":"tremble","pos":"v","meaning":"v. 顫抖 (n) 顫抖","example":"Her hands trembled with excitement as she opened the letter.","example_zh":"她打開信時，雙手因興奮而顫抖。"},{"id":2962,"word":"tremendous","pos":"adj","meaning":"adj. 巨大的","example":"The new teacher made a tremendous effort to learn all the students' names.","example_zh":"新老師非常努力地想記住所有學生的名字。"},{"id":2963,"word":"tremor","pos":"n","meaning":"n. 顫抖","example":"A slight tremor ran through the old man's hands when he held the cup.","example_zh":"老先生拿起杯子時，手微微地顫抖著。"},{"id":2964,"word":"trend","pos":"n","meaning":"n. 趨勢；流行","example":"Wearing large sunglasses has become a popular trend this summer.","example_zh":"戴大墨鏡成了今年夏天流行的趨勢。"},{"id":2965,"word":"tribal","pos":"adj","meaning":"adj. 部落的；部族的","example":"The tribal dance is performed only at special festivals.","example_zh":"這種部落舞蹈只在特殊節慶時表演。"},{"id":2966,"word":"tribe","pos":"n","meaning":"n. 部落","example":"The tribe lives deep in the mountains and has its own language.","example_zh":"這個部落住在深山裡，擁有自己的語言。"},{"id":2967,"word":"trick","pos":"v/n","meaning":"v/n. 戲弄，欺騙","example":"The magician tricked the audience into believing the coin had disappeared.","example_zh":"魔術師騙觀眾相信那枚硬幣消失了。"},{"id":2968,"word":"tricky","pos":"adj","meaning":"adj. 詭計多端的；複雜的；棘手的","example":"This math problem is tricky, so be careful when you solve it.","example_zh":"這道數學題很棘手，解題時要小心。"},{"id":2969,"word":"troop","pos":"n","meaning":"n. 部隊","example":"The general sent troops to protect the border.","example_zh":"將軍派遣部隊去保衛邊界。"},{"id":2970,"word":"tropical","pos":"adj","meaning":"adj. 熱帶的","example":"Bananas and pineapples grow well in tropical countries.","example_zh":"香蕉和鳳梨在熱帶國家生長得很好。"},{"id":2971,"word":"troublesome","pos":"adj","meaning":"adj. 造成麻煩的","example":"My little brother is troublesome because he keeps asking for more candy.","example_zh":"我弟弟很惹人煩，因為他一直要求再多給他一些糖果。"},{"id":2972,"word":"true to life","pos":"phr","meaning":"phr. 逼真，寫實的","example":"The painting is so true to life that it looks like a photograph.","example_zh":"這幅畫逼真到看起來像一張照片。"},{"id":2973,"word":"trunk","pos":"n","meaning":"n. 樹幹；旅行箱；後車廂","example":"He put the heavy bags in the trunk of the car.","example_zh":"他把沉重的袋子放進車子的後車廂。"},{"id":2974,"word":"trust","pos":"v/n","meaning":"v/n. 相信，信任","example":"I trust my best friend because she has never lied to me.","example_zh":"我信任我最好的朋友，因為她從未對我說過謊。"},{"id":2975,"word":"trust someone with","pos":"phr","meaning":"phr. 將～託付給某人","example":"I would never trust him with my secrets because he talks too much.","example_zh":"我絕不會把我的祕密託付給他，因為他話太多了。"},{"id":2976,"word":"truthful","pos":"adj","meaning":"adj. 誠實的；真實的","example":"A truthful person always says what really happened, even when it is difficult.","example_zh":"誠實的人總是照實說出事情的經過，即使那很困難。"},{"id":2977,"word":"tub","pos":"n","meaning":"n. 浴缸","example":"After a long day, she likes to relax in a hot tub.","example_zh":"忙了一整天後，她喜歡泡在熱浴缸裡放鬆。"},{"id":2978,"word":"tug","pos":"v","meaning":"v. 用力拉或拖 (n) 猛拉","example":"The little girl tugged at her mother's sleeve and asked for candy.","example_zh":"小女孩拉著媽媽的袖子，向她要糖果。"},{"id":2979,"word":"tug-of-war","pos":"n","meaning":"n. 拔河","example":"Our class won the tug-of-war on sports day.","example_zh":"我們班在運動會上贏得了拔河比賽。"},{"id":2980,"word":"tulip","pos":"n","meaning":"n. 鬱金香","example":"The garden was full of red and yellow tulips in spring.","example_zh":"春天時，花園裡開滿了紅色和黃色的鬱金香。"},{"id":2981,"word":"tumble","pos":"v","meaning":"v. 脫口而出，跌倒滾下","example":"The words tumbled out of her mouth before she could stop them.","example_zh":"那些話在她來得及阻止之前就脫口而出了。"},{"id":2982,"word":"tune","pos":"n","meaning":"n. 曲子 (v) 調音；收聽；收看","example":"She hummed a happy tune while cooking dinner.","example_zh":"她煮晚餐時哼著一首歡快的曲子。"},{"id":2983,"word":"turn A into B","pos":"phr","meaning":"phr. 將A變成B","example":"The magician turned the handkerchief into a white dove.","example_zh":"魔術師把手帕變成了一隻白鴿。"},{"id":2984,"word":"turn on","pos":"phr","meaning":"phr. 打開(電器)","example":"Please turn on the air conditioner because it's too hot in here.","example_zh":"這裡太熱了，請打開冷氣。"},{"id":2985,"word":"turn out","pos":"phr","meaning":"phr. 結果是～","example":"The weather turned out to be much better than we expected.","example_zh":"天氣結果比我們預期的好得多。"},{"id":2986,"word":"turn to","pos":"phr","meaning":"phr. 求助於～","example":"When he was in trouble, he turned to his teacher for help.","example_zh":"他遇到麻煩時，向老師求助。"},{"id":2987,"word":"tutor","pos":"n","meaning":"n. 家教 (v) 當～的家教；指導","example":"My parents hired a tutor to help me with math.","example_zh":"我父母請了一位家教幫我補數學。"},{"id":2988,"word":"twig","pos":"n","meaning":"n. 細枝","example":"The bird built its nest with small twigs and dry leaves.","example_zh":"那隻鳥用小樹枝和乾葉子築巢。"},{"id":2989,"word":"twin","pos":"n","meaning":"n. 雙胞胎之一","example":"One twin likes sports, while the other prefers reading.","example_zh":"雙胞胎中的一個喜歡運動，另一個則比較喜歡閱讀。"},{"id":2990,"word":"twinkle","pos":"v","meaning":"v. 閃爍 (n) 閃爍","example":"The stars twinkled in the clear night sky.","example_zh":"星星在晴朗的夜空中閃爍。"},{"id":2991,"word":"twist","pos":"v","meaning":"v. 扭；轉；纏繞；扭曲；曲解 (n) 扭；擰；突然轉變","example":"He twisted the cap off the bottle and took a big drink.","example_zh":"他扭開瓶蓋，大喝了一口。"},{"id":2992,"word":"type","pos":"n","meaning":"n. 類型，種類","example":"What type of music do you like best?","example_zh":"你最喜歡哪一種類型的音樂？"},{"id":2993,"word":"typewriter","pos":"n","meaning":"n. 打字機","example":"My grandfather still keeps an old typewriter in his study.","example_zh":"我爺爺的書房裡還留著一台老舊的打字機。"},{"id":2994,"word":"typical","pos":"adj","meaning":"adj. 典型的","example":"A typical Taiwanese breakfast includes soy milk and a fried dough stick.","example_zh":"典型的台灣早餐包括豆漿和油條。"},{"id":2995,"word":"typist","pos":"n","meaning":"n. 打字員","example":"The typist can type more than eighty words per minute.","example_zh":"那位打字員每分鐘可以打超過八十個字。"},{"id":2996,"word":"ultimate","pos":"adj","meaning":"adj. 根本的，終極的","example":"Her ultimate goal is to become a doctor and help people in need.","example_zh":"她的終極目標是成為醫生，幫助有需要的人。"},{"id":2997,"word":"ultimately","pos":"adv","meaning":"adv. 最終地，最基本地","example":"After many failures, he ultimately achieved his dream.","example_zh":"歷經多次失敗後，他終究實現了夢想。"},{"id":2998,"word":"unashamed","pos":"adj","meaning":"adj. 不害羞的，恬不知恥的","example":"He was unashamed of his poor background and often talked about it.","example_zh":"他對自己貧窮的出身毫不感到羞愧，還經常談起它。"},{"id":2999,"word":"unashamedly","pos":"adv","meaning":"adv. 不覺羞恥、難堪地","example":"She unashamedly admitted that she had never read the book.","example_zh":"她毫不羞愧地承認自己從沒讀過那本書。"},{"id":3000,"word":"unconditional","pos":"adj","meaning":"adj. 無條件的","example":"The charity offers unconditional help to anyone who needs it.","example_zh":"這個慈善團體對任何有需要的人提供無條件的協助。"},{"id":3001,"word":"unconditionally","pos":"adv","meaning":"adv. 無條件地","example":"A good friend will support you unconditionally, even when you make mistakes.","example_zh":"好朋友即使在你犯錯時，也會無條件地支持你。"},{"id":3002,"word":"unconsciously","pos":"adv","meaning":"adv. 不知不覺地，無意地","example":"He unconsciously bit his nails whenever he felt nervous.","example_zh":"他一緊張就會不自覺地咬指甲。"},{"id":3003,"word":"uncover","pos":"v","meaning":"v. 揭露 發現","example":"The reporter uncovered the truth about the dishonest company.","example_zh":"那位記者揭露了那家不老實公司的真相。"},{"id":3004,"word":"under construction","pos":"phr","meaning":"phr. 施工中","example":"The road is under construction, so we have to take another route.","example_zh":"這條路正在施工，所以我們得走別條路。"},{"id":3005,"word":"under way","pos":"phr","meaning":"phr. 已開始、進行中","example":"The preparations for the school festival are already under way.","example_zh":"校慶的籌備工作已經開始進行了。"},{"id":3006,"word":"undergo = go through","pos":"vt","meaning":"vt. 遭受，經歷，忍受","example":"Patients who undergo this operation usually need two weeks to recover.","example_zh":"接受這種手術的病人通常需要兩週才能康復。"},{"id":3007,"word":"underline","pos":"v","meaning":"v. 畫底線","example":"Please underline the key words in the sentence with a red pen.","example_zh":"請用紅筆在句子中的關鍵字下面畫線。"},{"id":3008,"word":"underneath","pos":"prep","meaning":"prep. 在～下面","example":"The cat was sleeping underneath the table.","example_zh":"那隻貓正睡在桌子底下。"},{"id":3009,"word":"underpass","pos":"n","meaning":"n. 地下道","example":"We walked through the underpass to get to the other side of the road.","example_zh":"我們穿過地下道，走到馬路的另一邊。"},{"id":3010,"word":"unemployed","pos":"adj","meaning":"adj. 失業的","example":"He has been unemployed for six months and is looking for a new job.","example_zh":"他已經失業六個月了，正在找新工作。"},{"id":3011,"word":"unexpected","pos":"adj","meaning":"adj. 意料之外的","example":"An unexpected visitor knocked on the door late at night.","example_zh":"一位意料之外的訪客在深夜敲了門。"},{"id":3012,"word":"unfold","pos":"v","meaning":"v. 展開；呈現","example":"The story began to unfold as the detective explained what had happened.","example_zh":"隨著偵探說明事情的經過，整個故事逐漸展開。"},{"id":3013,"word":"unfortunate","pos":"adj","meaning":"adj. 不幸的","example":"The unfortunate boy lost his wallet on the first day of the trip.","example_zh":"那個不幸的男孩在旅行的第一天就弄丟了錢包。"},{"id":3014,"word":"unfortunately","pos":"adv","meaning":"adv. 不幸地","example":"Unfortunately, the concert was canceled because of the typhoon.","example_zh":"很不幸，演唱會因颱風而取消了。"},{"id":3015,"word":"union","pos":"n","meaning":"n. 結合；聯盟；協會","example":"The European Union is a group of countries that work closely together.","example_zh":"歐盟是一群緊密合作的國家所組成的聯盟。"},{"id":3016,"word":"unique","pos":"adj","meaning":"adj. 獨一無二的","example":"Every snowflake is unique, and no two are exactly the same.","example_zh":"每一片雪花都是獨一無二的，沒有兩片完全相同。"},{"id":3017,"word":"unite","pos":"v","meaning":"v. （使）團結；（使）統一","example":"The fans were united by their love for the team.","example_zh":"球迷們因為對球隊的熱愛而團結在一起。"},{"id":3018,"word":"unity","pos":"n","meaning":"n. 一致；和睦","example":"The class showed great unity when they worked together on the project.","example_zh":"全班在合力完成專案時展現出高度的團結。"},{"id":3019,"word":"universal","pos":"adj","meaning":"adj. 全體的；共同的","example":"Education is a universal right that every child should have.","example_zh":"教育是每個孩子都應該擁有的普遍權利。"},{"id":3020,"word":"universally","pos":"adv","meaning":"adv. 在各種情況下，普遍地","example":"English is universally used as the language of international business.","example_zh":"英語普遍被用作國際商務的語言。"},{"id":3021,"word":"universe","pos":"n","meaning":"n. 宇宙","example":"Scientists are still trying to understand how the universe began.","example_zh":"科學家仍在努力了解宇宙是如何形成的。"},{"id":3022,"word":"university","pos":"n","meaning":"n. 大學","example":"She hopes to study law at a famous university in Taipei.","example_zh":"她希望能在台北一所著名的大學攻讀法律。"},{"id":3023,"word":"unlimited","pos":"adj","meaning":"adj. 無限的，不受限制的","example":"The library offers unlimited access to online books for its members.","example_zh":"圖書館提供會員無限制地使用線上書籍。"},{"id":3024,"word":"up and down","pos":"phr","meaning":"phr. 來來回回，往復","example":"The little boy walked up and down the hall while waiting for his mother.","example_zh":"小男孩在等媽媽的時候，在走廊上來回踱步。"},{"id":3025,"word":"up to","pos":"phr","meaning":"phr. 至多達到；由…決定","example":"Up to fifty people can sit in this classroom.","example_zh":"這間教室最多可以坐五十個人。"},{"id":3026,"word":"update","pos":"v/n","meaning":"v/n. 更新，最新消息","example":"Please update your phone software to fix the problem.","example_zh":"請更新你的手機軟體來解決這個問題。"},{"id":3027,"word":"upload","pos":"v","meaning":"v. 上傳","example":"I need to upload these photos to the school website before noon.","example_zh":"我得在中午前把這些照片上傳到學校網站。"},{"id":3028,"word":"ups and downs","pos":"phr","meaning":"phr. 浮沈，盛衰","example":"Every family has its ups and downs, but love keeps them together.","example_zh":"每個家庭都有起起伏伏，但愛讓大家凝聚在一起。"},{"id":3029,"word":"upset","pos":"v","meaning":"v. 使苦惱或心煩；使不高興 (adj) 擾亂的；不安的；（胃）不適的","example":"The bad news upset her so much that she couldn't stop crying.","example_zh":"這個壞消息讓她非常難過，以致哭個不停。"},{"id":3030,"word":"urban","pos":"adj","meaning":"adj. 都市的","example":"More and more young people prefer to live in urban areas.","example_zh":"越來越多年輕人偏好住在都市地區。"},{"id":3031,"word":"urge","pos":"n","meaning":"n. 強烈的慾望，衝動 (v) 力勸某人做～","example":"She felt an urge to laugh when she saw the funny hat.","example_zh":"她看到那頂滑稽的帽子時，忍不住有股想笑的衝動。"},{"id":3032,"word":"urgency","pos":"n","meaning":"n. 迫切，緊急","example":"There was no sense of urgency in his voice, so I wasn't worried.","example_zh":"他的語氣中沒有一絲緊迫感，所以我並不擔心。"},{"id":3033,"word":"urgent","pos":"adj","meaning":"adj. 緊急的","example":"I have an urgent message for the manager, so please let me in.","example_zh":"我有一則緊急訊息要告訴經理，所以請讓我進去。"},{"id":3034,"word":"urgently","pos":"adv","meaning":"adv. 緊迫地","example":"The villagers urgently need clean water and medicine after the flood.","example_zh":"水災過後，村民們迫切需要乾淨的水和藥品。"},{"id":3035,"word":"usage","pos":"n","meaning":"n. 用法；使用","example":"This dictionary explains the usage of common English words clearly.","example_zh":"這本字典清楚地說明了常見英文單字的用法。"},{"id":3036,"word":"useless","pos":"adj","meaning":"adj. 無用的","example":"The broken umbrella is useless, so I'm going to throw it away.","example_zh":"這把壞掉的雨傘沒有用了，所以我打算把它丟掉。"},{"id":3037,"word":"utility","pos":"n","meaning":"n. 效用 實用","example":"This old tool has little utility in a modern kitchen.","example_zh":"這件舊工具在現代廚房裡幾乎沒有實用性。"},{"id":3038,"word":"utilize","pos":"v","meaning":"v. 利用；使用","example":"We should utilize every opportunity to practice speaking English.","example_zh":"我們應該利用每個機會練習說英語。"},{"id":3039,"word":"utter","pos":"v","meaning":"v. 說出，講","example":"He didn't utter a single word during the whole meeting.","example_zh":"整場會議中，他連一個字都沒說。"}]},
{"unit":24,"unit_label":"p.47-48","words":[{"id":3040,"word":"utterance","pos":"n","meaning":"n. 發表，言論","example":"The politician's last utterance on the subject surprised the reporters.","example_zh":"那位政治人物針對這個議題的最後一次發言讓記者們很驚訝。"},{"id":3041,"word":"vacant","pos":"adj","meaning":"adj. 空著的","example":"There are no vacant seats on the train, so we have to stand.","example_zh":"火車上沒有空位，所以我們只好站著。"},{"id":3042,"word":"vain","pos":"adj","meaning":"adj. 白費的；虛榮的","example":"All his efforts were in vain because the shop had already closed.","example_zh":"他所有的努力都白費了，因為那家店已經關門了。"},{"id":3043,"word":"valuable","pos":"adj","meaning":"adj. 貴重的；值錢的 (n) 貴重物品（慣用複數）","example":"Please keep your valuable items in the safe when you leave the room.","example_zh":"離開房間時，請將貴重物品放在保險箱裡。"},{"id":3044,"word":"value","pos":"n","meaning":"n. 價值；(v) 重視","example":"I value my friendship with her more than anything else.","example_zh":"我比任何事都更重視我和她的友誼。"},{"id":3045,"word":"van","pos":"n","meaning":"n. 客貨車；廂型車","example":"The delivery man parked his van in front of the shop.","example_zh":"送貨員把他的廂型車停在店門口。"},{"id":3046,"word":"vanish","pos":"v","meaning":"v. 消失","example":"The magician waved his hand, and the rabbit suddenly vanished.","example_zh":"魔術師揮了揮手，兔子突然消失了。"},{"id":3047,"word":"variety","pos":"n","meaning":"n. 種類","example":"This supermarket sells a wide variety of fresh fruit.","example_zh":"這家超市販售各式各樣的新鮮水果。"},{"id":3048,"word":"various","pos":"adj","meaning":"adj. 各式各樣的","example":"The festival attracts visitors from various parts of the world.","example_zh":"這個節慶吸引了來自世界各地的遊客。"},{"id":3049,"word":"vary","pos":"v","meaning":"v. 不同","example":"Prices vary from store to store, so it pays to compare them.","example_zh":"各家商店的價格不一樣，所以比較一下是值得的。"},{"id":3050,"word":"vase","pos":"n","meaning":"n. 花瓶","example":"She put the fresh roses in a glass vase on the table.","example_zh":"她把新鮮的玫瑰花插在桌上的玻璃花瓶裡。"},{"id":3051,"word":"vast","pos":"adj","meaning":"adj. 廣闊的；極大的","example":"A vast desert stretches from the coast to the mountains.","example_zh":"一片廣闊的沙漠從海岸一直延伸到山區。"},{"id":3052,"word":"VCD (=video compact disk)","pos":"n","meaning":"n. 影音光碟","example":"My uncle still has a collection of old VCDs from the 1990s.","example_zh":"我叔叔還留著一批1990年代的舊影音光碟。"},{"id":3053,"word":"vegetarian","pos":"n","meaning":"n. 素食者","example":"As a vegetarian, he does not eat meat, but he eats eggs and dairy.","example_zh":"身為素食者，他不吃肉，但會吃蛋和乳製品。"},{"id":3054,"word":"vehicle","pos":"n","meaning":"n. 車輛（總稱）","example":"Only vehicles with a special permit may enter this area.","example_zh":"只有持有特別通行證的車輛才可以進入這個區域。"},{"id":3055,"word":"verb","pos":"n","meaning":"n. 動詞","example":"The verb in this sentence should be in the past tense.","example_zh":"這個句子裡的動詞應該用過去式。"},{"id":3056,"word":"verse","pos":"n","meaning":"n. 韻文；詩","example":"The poet wrote a beautiful verse about the changing seasons.","example_zh":"那位詩人寫了一首關於季節變遷的優美詩句。"},{"id":3057,"word":"very","pos":"adj","meaning":"adj. 正是；完全","example":"This is the very book I have been looking for all week.","example_zh":"這正是我找了一整個星期的那本書。"},{"id":3058,"word":"vessel","pos":"n","meaning":"n. 船艦；容器","example":"The old vessel carried goods across the sea for many years.","example_zh":"那艘老船多年來載運貨物橫越海洋。"},{"id":3059,"word":"vest","pos":"n","meaning":"n. 背心","example":"He wore a warm vest under his coat on the cold morning.","example_zh":"在寒冷的早晨，他在外套裡面穿了一件保暖背心。"},{"id":3060,"word":"vibrate","pos":"v","meaning":"v. 震動","example":"Please put your phone on silent mode so that it won't vibrate during class.","example_zh":"請把手機調成靜音，這樣上課時才不會震動。"},{"id":3061,"word":"vibration","pos":"n","meaning":"n. 震動","example":"The vibration of the train made it difficult to write clearly.","example_zh":"火車的震動讓人很難把字寫清楚。"},{"id":3062,"word":"vice-president","pos":"n","meaning":"n. 副總統","example":"The vice-president will give a speech at the meeting this afternoon.","example_zh":"副總統今天下午將在會議上發表談話。"},{"id":3063,"word":"vicious","pos":"adj","meaning":"adj. 惡毒的，惡意的","example":"The vicious dog barked at everyone who walked past the gate.","example_zh":"那隻凶惡的狗對每個經過大門的人狂吠。"},{"id":3064,"word":"victim","pos":"n","meaning":"n. 受害者","example":"The victim of the robbery gave the police a clear description of the thief.","example_zh":"這起搶案的受害者向警方清楚描述了小偷的長相。"},{"id":3065,"word":"vinegar","pos":"n","meaning":"n. 醋","example":"Add a little vinegar to the salad to make it taste fresher.","example_zh":"在沙拉裡加一點醋，嘗起來會更清爽。"},{"id":3066,"word":"violate","pos":"v","meaning":"v. 違反；侵犯","example":"Drivers who violate traffic rules may have to pay a heavy fine.","example_zh":"違反交通規則的駕駛可能要繳交一大筆罰款。"},{"id":3067,"word":"violation","pos":"n","meaning":"n. 違反；侵犯","example":"The company was fined for a violation of safety rules.","example_zh":"那家公司因違反安全規定而被罰款。"},{"id":3068,"word":"violence","pos":"n","meaning":"n. 暴力；暴行","example":"The school does not allow any kind of violence among students.","example_zh":"學校不容許學生之間出現任何形式的暴力。"},{"id":3069,"word":"violent","pos":"adj","meaning":"adj. 暴力的","example":"Some video games are too violent for young children.","example_zh":"有些電玩遊戲對年幼的孩子來說太暴力了。"},{"id":3070,"word":"violet","pos":"n","meaning":"n. 紫羅蘭 (adj) 藍紫色的","example":"The garden was filled with violets in early spring.","example_zh":"初春時，花園裡開滿了紫羅蘭。"},{"id":3071,"word":"virgin","pos":"n","meaning":"n. 處女；處男 (adj) 未開墾的；未經使用的","example":"The hikers walked through a virgin forest that no one had ever cut down.","example_zh":"登山客走過一片從未有人砍伐過的原始森林。"},{"id":3072,"word":"virtual","pos":"adj","meaning":"adj. 虛擬的","example":"During the pandemic, many students attended virtual classes at home.","example_zh":"疫情期間，許多學生在家上虛擬課程。"},{"id":3073,"word":"virtually","pos":"adv","meaning":"adv. 實質上，實際上","example":"The two houses are virtually the same, except for the color of the door.","example_zh":"這兩間房子實際上幾乎一模一樣，只有門的顏色不同。"},{"id":3074,"word":"virtue","pos":"n","meaning":"n. 美德；優點","example":"Honesty is a virtue that everyone should have.","example_zh":"誠實是每個人都應該具備的美德。"},{"id":3075,"word":"virus","pos":"n","meaning":"n. 病毒；電腦病毒","example":"My computer was infected with a virus, so I had to reinstall everything.","example_zh":"我的電腦中了病毒，所以不得不重新安裝所有東西。"},{"id":3076,"word":"visible","pos":"adj","meaning":"adj. 顯著的；可見的","example":"The stars are not visible in the city because of the bright lights.","example_zh":"由於燈光太亮，在城市裡看不到星星。"},{"id":3077,"word":"vision","pos":"n","meaning":"n. 視力；眼光；遠見；幻想；幻覺","example":"The old man has poor vision and needs glasses to read the newspaper.","example_zh":"這位老先生視力不好，看報紙需要戴眼鏡。"},{"id":3078,"word":"visual","pos":"adj","meaning":"adj. 視覺的","example":"Pictures and videos can make a lesson more visual and fun.","example_zh":"圖片和影片可以讓課程更有視覺效果、更有趣。"},{"id":3079,"word":"vital","pos":"adj","meaning":"adj. 極重要的；精力旺盛的","example":"Water is vital for all living things on Earth.","example_zh":"水對地球上所有生物來說都極為重要。"},{"id":3080,"word":"vitamin","pos":"n","meaning":"n. 維他命","example":"Oranges are rich in vitamin C, which helps protect your body from colds.","example_zh":"柳橙富含維他命C，有助於保護身體免於感冒。"},{"id":3081,"word":"vivid","pos":"adj","meaning":"adj. 生動的","example":"She gave a vivid description of her trip to Japan.","example_zh":"她生動地描述了她的日本之旅。"},{"id":3082,"word":"volcano","pos":"n","meaning":"n. 火山","example":"The volcano erupted suddenly and covered the town with ash.","example_zh":"火山突然爆發，火山灰覆蓋了整個小鎮。"},{"id":3083,"word":"volume","pos":"n","meaning":"n. 冊；容積；容量；音量","example":"Please turn down the volume because the baby is sleeping.","example_zh":"寶寶正在睡覺，請把音量調小。"},{"id":3084,"word":"voluntary","pos":"adj","meaning":"adj. 自願的","example":"Joining the club is voluntary, so nobody is forced to attend.","example_zh":"加入社團是自願的，所以沒有人被迫參加。"},{"id":3085,"word":"volunteer","pos":"n","meaning":"n. 自願者；志工 (v) 自願做","example":"Many volunteers helped clean the beach after the typhoon.","example_zh":"颱風過後，許多志工幫忙清理海灘。"},{"id":3086,"word":"vowel","pos":"n","meaning":"n. 母音","example":"The letters a, e, i, o and u are vowels in English.","example_zh":"字母a、e、i、o、u在英文中是母音。"},{"id":3087,"word":"voyage","pos":"n","meaning":"n. 航行","example":"The long voyage across the Pacific Ocean took almost a month.","example_zh":"橫越太平洋的漫長航程花了將近一個月。"},{"id":3088,"word":"wage","pos":"n","meaning":"n. 工資","example":"He earns a weekly wage of five thousand dollars at the factory.","example_zh":"他在工廠領的週薪是五千元。"},{"id":3089,"word":"wagon","pos":"n","meaning":"n. 馬車；四輪貨車","example":"The farmer loaded the vegetables into a wagon and took them to market.","example_zh":"農夫把蔬菜裝上四輪貨車，運到市場去賣。"},{"id":3090,"word":"waken","pos":"v","meaning":"v. 喚醒；醒來","example":"The sound of the birds wakened me early in the morning.","example_zh":"鳥叫聲一大早就把我吵醒了。"},{"id":3091,"word":"wander","pos":"v","meaning":"v. 漫遊；閒逛","example":"We wandered around the old town without a map and found a lovely café.","example_zh":"我們沒帶地圖在老城區閒逛，結果發現了一家可愛的咖啡館。"},{"id":3092,"word":"warm up","pos":"phr","meaning":"phr. 加熱， 變暖， 暖身","example":"Let's warm up for a few minutes before we start playing basketball.","example_zh":"我們開始打籃球之前，先暖身幾分鐘吧。"},{"id":3093,"word":"warmth","pos":"n","meaning":"n. 溫暖","example":"I felt the warmth of the sun on my face as I walked along the beach.","example_zh":"我沿著海灘散步時，感受到太陽照在臉上的溫暖。"},{"id":3094,"word":"warn","pos":"v","meaning":"v. 警告","example":"The sign warns visitors not to feed the wild animals.","example_zh":"這塊告示牌警告遊客不要餵食野生動物。"},{"id":3095,"word":"warning","pos":"n","meaning":"n. 警告","example":"The weather bureau issued a warning about the coming typhoon.","example_zh":"氣象局針對即將來襲的颱風發布了警報。"},{"id":3096,"word":"waste","pos":"v/n","meaning":"v/n. 浪費，廢棄物","example":"Don't waste water while you are brushing your teeth.","example_zh":"刷牙時不要浪費水。"},{"id":3097,"word":"waterproof","pos":"adj","meaning":"adj. 防水的","example":"I bought a waterproof jacket for the rainy season.","example_zh":"我為了雨季買了一件防水外套。"},{"id":3098,"word":"wax","pos":"n","meaning":"n. 蠟 (v) 上蠟","example":"The candle was made of wax and smelled like lavender.","example_zh":"這根蠟燭是用蠟製成的，聞起來有薰衣草的香味。"},{"id":3099,"word":"weaken","pos":"v","meaning":"v. 變弱","example":"A poor diet can weaken your body and make you sick more easily.","example_zh":"不良的飲食會削弱你的身體，讓你更容易生病。"},{"id":3100,"word":"wealth","pos":"n","meaning":"n. 財產；財富；豐富；大量","example":"The old man shared his wealth with poor families in the village.","example_zh":"那位老先生把他的財富分給村裡的貧困家庭。"},{"id":3101,"word":"wealthy","pos":"adj","meaning":"adj. 富有的","example":"The wealthy businessman donated a million dollars to the hospital.","example_zh":"那位富有的商人捐了一百萬元給醫院。"},{"id":3102,"word":"weave","pos":"v","meaning":"v. 編織","example":"In the past, people used to weave baskets from bamboo.","example_zh":"過去人們習慣用竹子編織籃子。"},{"id":3103,"word":"web","pos":"n","meaning":"n. 網","example":"A spider spun a delicate web between two branches of the tree.","example_zh":"一隻蜘蛛在兩根樹枝之間結了一張精緻的網。"},{"id":3104,"word":"website","pos":"n","meaning":"n. 網站","example":"You can find the full schedule on the school's website.","example_zh":"你可以在學校的網站上找到完整的時間表。"},{"id":3105,"word":"weed","pos":"n","meaning":"n. 雜草 (v) 除去雜草","example":"There were so many weeds in the garden that we spent the whole morning pulling them out.","example_zh":"花園裡雜草太多，我們花了整個早上把它們拔掉。"},{"id":3106,"word":"weekly","pos":"adj","meaning":"adj. 一週一次的 (adv) 每週一次地 (n) 週刊","example":"We have a weekly meeting every Monday morning.","example_zh":"我們每週一早上都有一次例行會議。"},{"id":3107,"word":"weep","pos":"v","meaning":"v. 哭泣；流（淚）","example":"She wept quietly when she read the sad letter from her friend.","example_zh":"她讀到朋友那封悲傷的信時，靜靜地流下了淚。"},{"id":3108,"word":"weird","pos":"adj","meaning":"adj. 怪異的，不尋常的","example":"I heard a weird noise coming from the basement last night.","example_zh":"昨晚我聽到地下室傳來一種怪異的聲響。"},{"id":3109,"word":"welfare","pos":"n","meaning":"n. 福利；幸福","example":"The government should care about the welfare of the elderly.","example_zh":"政府應該關心老年人的福利。"},{"id":3110,"word":"what's more","pos":"phr","meaning":"phr. 而且","example":"The restaurant is cheap, and what's more, the food is delicious.","example_zh":"這家餐廳很便宜，而且食物很好吃。"},{"id":3111,"word":"wheat","pos":"n","meaning":"n. 小麥","example":"Farmers in this area grow wheat and corn.","example_zh":"這個地區的農夫種植小麥和玉米。"},{"id":3112,"word":"when it comes to","pos":"phr","meaning":"phr. 說到，提及","example":"When it comes to cooking, my mother is the best in our family.","example_zh":"說到烹飪，我媽媽是我們家最厲害的。"},{"id":3113,"word":"whine","pos":"v/n","meaning":"v/n. 抱怨","example":"He whined about the weather the whole time we were on the trip.","example_zh":"我們旅行的整段時間，他都在抱怨天氣。"},{"id":3114,"word":"whiny","pos":"adj","meaning":"adj. 愛抱怨的，常發牢騷的","example":"The whiny child kept complaining about the long ride.","example_zh":"那個愛抱怨的孩子一直在抱怨車程太久。"},{"id":3115,"word":"whip","pos":"v","meaning":"v. 鞭打 (n) 鞭子","example":"The rider whipped the horse to make it run faster.","example_zh":"騎士鞭打那匹馬，想讓牠跑得更快。"},{"id":3116,"word":"whisper","pos":"v","meaning":"v. 小聲說 (n) 低語","example":"The students whispered to each other during the boring speech.","example_zh":"在無聊的演講過程中，學生們彼此小聲交談。"},{"id":3117,"word":"whistle","pos":"v","meaning":"v. 吹口哨；用口哨吹出 (n) 口哨；汽笛（聲）；哨子","example":"He whistled a happy song as he walked down the street.","example_zh":"他走在街上時，吹著口哨哼出一首快樂的歌。"},{"id":3118,"word":"wicked","pos":"adj","meaning":"adj. 邪惡的","example":"In the fairy tale, the wicked queen gave the princess a poisoned apple.","example_zh":"在這則童話故事裡，邪惡的皇后給了公主一顆有毒的蘋果。"},{"id":3119,"word":"willing","pos":"adj","meaning":"adj. 情願的，樂意的","example":"I am willing to help you with your homework after dinner.","example_zh":"我願意在晚餐後幫你寫作業。"},{"id":3120,"word":"willow","pos":"n","meaning":"n. 柳樹","example":"A big willow tree grows beside the quiet river.","example_zh":"一棵高大的柳樹長在寧靜的河邊。"},{"id":3121,"word":"wind up","pos":"phr","meaning":"phr. 結果","example":"If you keep eating junk food, you will wind up with health problems.","example_zh":"如果你一直吃垃圾食物，最後會落得健康出問題。"},{"id":3122,"word":"wink","pos":"v","meaning":"v. 眨眼 (n) 眨眼睛","example":"She winked at me to show that she was only joking.","example_zh":"她對我眨了眨眼，表示她只是在開玩笑。"},{"id":3123,"word":"wipe","pos":"v","meaning":"v. 擦拭","example":"Please wipe the table before you put the dishes on it.","example_zh":"在把碗盤放上桌之前，請先把桌子擦乾淨。"},{"id":3124,"word":"wisdom","pos":"n","meaning":"n. 智慧","example":"My grandfather is full of wisdom and always gives me good advice.","example_zh":"我爺爺充滿智慧，總是給我很好的建議。"},{"id":3125,"word":"wise","pos":"adj","meaning":"adj. 明智的","example":"It was wise of you to save some money for emergencies.","example_zh":"你存一些錢以備不時之需，是很明智的。"},{"id":3126,"word":"wit","pos":"n","meaning":"n. 機智","example":"The comedian is famous for his quick wit and funny jokes.","example_zh":"那位喜劇演員以他的機智和有趣的笑話聞名。"},{"id":3127,"word":"witch","pos":"n","meaning":"n. 女巫","example":"The witch in the story flew across the sky on a broom.","example_zh":"故事裡的女巫騎著掃帚飛過天空。"},{"id":3128,"word":"with one's bare hands","pos":"phr","meaning":"phr. 赤手空拳","example":"The strong man tore the thick phone book in half with his bare hands.","example_zh":"那個大力士徒手把厚厚的電話簿撕成兩半。"},{"id":3129,"word":"withdraw","pos":"v","meaning":"v. 收回；提領；退出；離開","example":"He withdrew some money from the bank to pay for the new bike.","example_zh":"他從銀行領了一些錢來支付新腳踏車的費用。"},{"id":3130,"word":"withdrawal","pos":"n","meaning":"n. 撤離，提款","example":"The withdrawal of the troops from the area ended the long war.","example_zh":"軍隊從該地區撤離，結束了這場漫長的戰爭。"},{"id":3131,"word":"without a doubt","pos":"phr","meaning":"phr. 毫無疑問地","example":"Without a doubt, she is the best singer in our school.","example_zh":"毫無疑問，她是我們學校最會唱歌的人。"},{"id":3132,"word":"witness","pos":"n","meaning":"n. 目擊者；見證人 (v) 目擊","example":"A witness told the police that he saw the car speeding away.","example_zh":"一位目擊者告訴警方，他看到那輛車疾駛而去。"},{"id":3133,"word":"wizard","pos":"n","meaning":"n. 男巫；術士","example":"In the movie, the old wizard taught the young boy how to use magic.","example_zh":"在這部電影裡，年老的巫師教那個小男孩如何使用魔法。"},{"id":3134,"word":"wonder","pos":"v","meaning":"v. 想知道， /* ================= words ================= */
const $ = id => document.getElementById(id);
const POS_OK=/^(n|v|vt|vi|adj|adv|a|prep|phr|aux|conj|pron|int)(\/(n|v|adj|adv))?$/i;
function posKey(p){ p=(p||'').toLowerCase().split('/')[0]; return p==='vt'||p==='vi'?'v':p==='a'?'adj':p; }
function cleanMeaning(m){
  // "adv可能地" → "adv. 可能地"
  return m.trim().replace(/^([a-z]+(?:\/[a-z]+)?)\.?\s*/i,(x,p)=>POS_OK.test(p)?p+'. ':x);
}
function glosses(m){
  const s=m.replace(/\([^)]*\)|（[^）]*）/g,' ').replace(/\b(n|v|vt|vi|adj|adv|a|prep|phr|aux|conj)\b\.?/gi,' ');
  return s.split(/[；;，,、\/\s]+/).map(x=>x.replace(/[～~.。]/g,'').replace(/[的地]$/,'')).filter(x=>/[一-鿿]/.test(x));
}
function spellForm(w){
  const s=w.replace(/\(=[^)]*\)/g,'').trim().toLowerCase().replace(/\s+/g,' ');
  return /^[a-z][a-z' \-]*$/.test(s)?s:null;
}
const normWord=w=>w.replace(/\(=[^)]*\)/g,'').trim().toLowerCase();
const WORDS={}, UNIT_IDS={};
UNITS.forEach(un=>{
  UNIT_IDS[un.unit]=[];
  un.words.forEach(w=>{
    const meaning=cleanMeaning(w.meaning);
    let pos=w.pos; if(!pos){const m=meaning.match(/^([a-z]+(?:\/[a-z]+)?)\./i); pos=m?m[1]:'';}
    WORDS[w.id]={id:w.id,word:w.word.trim(),meaning,pk:posKey(pos),unit:un.unit,gl:glosses(meaning),spell:spellForm(w.word),ex:w.example||'',ez:w.example_zh||''};
    UNIT_IDS[un.unit].push(w.id);
  });
});
const ALL_IDS=Object.keys(WORDS).map(Number);
const overlap=(a,b)=>a.some(x=>b.includes(x));

/* ================= state ================= */
// 新學生預設勾最新的四回（舊學生照自己存的範圍）；vocab-watercolor.html 也照這個規則
let sel=UNITS.slice(-4).map(u=>u.unit), modes={e2c:true,c2e:true,spell:false}, weakOnly=false;
let stats={};             // id → [streak, right, wrong]
let order=[], qi=-1, Q=null, again=false, answered=false, shown=0;
let retry=[];             // [{id, due}]
const mastered=id=>(stats[id]&&stats[id][0]>=2);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selIds(){ return sel.flatMap(u=>UNIT_IDS[u]||[]); }
function pool(){
  const all=selIds();
  if(!weakOnly) return all;
  const weak=all.filter(id=>!mastered(id));
  if(!weak.length){ toast('這個範圍的字全都熟了，改成全部出'); return all; }
  return weak;
}

/* ---------- building a question ---------- */
function distractors(t){
  const out=[];
  const fits=id=>{
    const c=WORDS[id];
    if(!c || id===t.id || out.includes(id)) return false;
    if(normWord(c.word)===normWord(t.word) || overlap(c.gl,t.gl)) return false;
    return out.every(o=>normWord(WORDS[o].word)!==normWord(c.word) && !overlap(WORDS[o].gl,c.gl));
  };
  const fill=list=>{for(const id of shuffle(list)){ if(out.length>=3) break; if(fits(id)) out.push(id); }};
  const inSel=selIds(), same=id=>WORDS[id].pk===t.pk;
  // one look-alike neighbour from the list (e.g. oppress / oppression) makes it a real test
  if(Math.random()<.7){
    for(const id of shuffle(inSel.filter(id=>same(id)&&Math.abs(id-t.id)<=6))){ if(fits(id)){out.push(id);break} }
  }
  fill(inSel.filter(same));
  if(out.length<3) fill(ALL_IDS.filter(same));
  if(out.length<3) fill(ALL_IDS);
  return out;
}
function buildQ(id){
  const w=WORDS[id], types=[];
  if(modes.e2c) types.push('e2c');
  if(modes.c2e) types.push('c2e');
  if(modes.spell && w.spell) types.push('spell');
  if(!types.length) types.push('e2c');     // spelling only, but this one is a phrase with ( ) — ask it as a choice
  const type=types[Math.floor(Math.random()*types.length)];
  if(type==='spell') return {id,type};
  const opts=shuffle([id,...distractors(w)]);
  return {id,type,opts,a:opts.indexOf(id)};
}

/* ---------- flow ---------- */
function nextQuestion(){
  shown++;
  const r=retry.findIndex(x=>x.due<=shown);
  let id;
  if(r>=0){ id=retry.splice(r,1)[0].id; again=true; }
  else{
    qi++;
    if(qi>=order.length){
      if(order.length) toast('這個範圍全部出過一輪了，重新洗牌');
      order=shuffle(pool()); qi=0;
      if(Q && order.length>1 && order[0]===Q.id) order.push(order.shift());
    }
    id=order[qi]; again=false;
    retry=retry.filter(x=>x.id!==id);
  }
  Q=buildQ(id);
  showQuestion();
  save();
}

const SPEAK_SVG='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
function sayBtn(word){
  const b=document.createElement('button');
  b.className='say'; b.type='button'; b.innerHTML=SPEAK_SVG; b.setAttribute('aria-label','唸出 '+word);
  b.hidden=!canSpeak; b.onclick=()=>speak(word);
  return b;
}
const KIND={e2c:'看英文選中文',c2e:'看中文選英文',spell:'看中文拼英文'};
function showQuestion(){
  const w=WORDS[Q.id];
  answered=false;
  $('kind').textContent=KIND[Q.type];
  $('again').hidden=!again;
  updateScope();
  const pr=$('prompt'); pr.innerHTML='';
  if(Q.type==='e2c'){
    const s=document.createElement('span'); s.className='word'; s.textContent=w.word; pr.append(s, sayBtn(w.word));
  }else{
    const s=document.createElement('span'); s.className='mean'; s.textContent=w.meaning; pr.append(s);
  }
  const ul=$('opts'); ul.innerHTML='';
  $('spell').hidden=Q.type!=='spell';
  if(Q.type==='spell'){
    const t=$('typed'); t.value=''; t.disabled=false; t.className='';
    $('check').disabled=false; $('giveup').disabled=false;
    $('letters').textContent=w.spell.split('').map((c,i)=>i===0?c:c===' '?' ':c==='-'||c==="'"?c:'_').join(' ');
    const cnt=document.createElement('small'); cnt.textContent='（'+w.spell.replace(/[^a-z]/g,'').length+' 個字母）'; $('letters').append(cnt);
    if(matchMedia('(pointer:fine)').matches) t.focus({preventScroll:true});
  }else{
    Q.opts.forEach((oid,i)=>{
      const o=WORDS[oid];
      const li=document.createElement('li');
      const b=document.createElement('button');
      b.className='opt'+(Q.type==='c2e'?' en':'');
      b.innerHTML='<span class="k">'+'ABCD'[i]+'</span><span></span>';
      b.lastChild.textContent=Q.type==='c2e'?o.word:o.meaning;
      b.onclick=()=>answer(i);
      li.appendChild(b); ul.appendChild(li);
    });
  }
  $('after').classList.remove('on');
  $('quiz').scrollTop=0;
}
function record(id,ok){
  const s=stats[id]||[0,0,0];
  if(ok){s[0]++;s[1]++}else{s[0]=0;s[2]++}
  stats[id]=s;
}
function finish(ok,badText){
  const w=WORDS[Q.id];
  record(Q.id,ok);
  const msg=$('msg');
  if(ok){
    const got=Q.type==='spell'?2:1;
    world.addWater(got);
    msg.className='msg good';
    msg.textContent= world.water===got ? '答對了，得到'+(got===2?'兩滴':'一滴')+'水。點土地，把它滴下去。'
      : (got===2?'拼對了，拿兩滴水。':'答對了，又多一滴水。')+(mastered(Q.id)&&stats[Q.id][0]===2?'這個字熟了。':'');
  }else{
    retry.push({id:Q.id,due:shown+3+Math.floor(Math.random()*3)});
    msg.className='msg bad';
    msg.textContent=badText+'這個字過一會兒會再出現。';
  }
  const card=$('card'); card.innerHTML='';
  const b=document.createElement('b'); b.textContent=w.word;
  const s=document.createElement('span'); s.textContent=w.meaning;
  card.append(b, sayBtn(w.word), s);
  if(w.ex){const d=document.createElement('div'); d.className='ex'; const e=document.createElement('p'); e.textContent=w.ex; d.append(e); if(w.ez){const z=document.createElement('p'); z.className='ez'; z.textContent=w.ez; d.append(z)} card.append(d)}
  $('after').classList.add('on');
  $('next').focus({preventScroll:true});
  requestAnimationFrame(()=>$('after').scrollIntoView({block:'nearest',behavior:'smooth'}));
  save();
}
function answer(i){
  if(answered||Q.type==='spell'||i>=Q.opts.length) return;
  answered=true;
  [...document.querySelectorAll('.opt')].forEach((b,k)=>{
    b.disabled=true;
    if(k===Q.a) b.classList.add('right');
    else if(k===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  finish(i===Q.a,'答案是 '+'ABCD'[Q.a]+'。');
}
const tidy=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim();
function submitSpell(giveUp){
  if(answered||Q.type!=='spell') return;
  const w=WORDS[Q.id], t=$('typed'), v=tidy(t.value);
  if(!giveUp && !v){ t.focus(); return; }
  answered=true;
  const ok=!giveUp && v===w.spell;
  t.disabled=true; t.className=ok?'ok':'no';
  $('check').disabled=true; $('giveup').disabled=true;
  finish(ok, giveUp?'沒關係，記一下拼法。':'正確拼法是 '+w.spell+'。');
}
$('spell').onsubmit=e=>{e.preventDefault();submitSpell(false)};
$('giveup').onclick=()=>submitSpell(true);
$('next').onclick=nextQuestion;
document.addEventListener('keydown',e=>{
  if(!$('pick').hidden) return;
  if(e.target.tagName==='INPUT') return;
  if(e.target.tagName==='BUTTON' && (e.key==='Enter'||e.key===' ')) return;
  const k=e.key.toUpperCase();
  const idx='ABCD'.indexOf(k)>=0?'ABCD'.indexOf(k):'1234'.indexOf(k);
  if(!answered && Q && Q.type!=='spell' && idx>=0 && k.length===1){answer(idx)}
  else if(answered && e.key==='Enter'){nextQuestion()}
});

/* ---------- speech ---------- */
const canSpeak='speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
let enVoice=null;
function pickVoice(){ try{const vs=speechSynthesis.getVoices(); enVoice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){} }
if(canSpeak){ pickVoice(); try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){} }
function speak(t){
  if(!canSpeak) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/\([^)]*\)/g,' ').replace(/…/g,' '));
    u.lang='en-US'; u.rate=.85; if(enVoice) u.voice=enVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- range picker ---------- */
function pageSpan(units){
  // "p.31-32" + "p.33-34" → "p.31-34"
  const r=units.map(u=>{const un=UNITS.find(x=>x.unit===u);const m=(un&&un.unit_label||'').match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2],un.unit_label]:[null,null,un?un.unit_label:'']});
  const parts=[]; let cur=null;
  for(const [a,b,l] of r){
    if(a===null){parts.push(l);cur=null;continue}
    if(cur && a===cur[1]+1){cur[1]=b} else {cur=[a,b];parts.push(cur)}
  }
  return parts.map(p=>typeof p==='string'?p:'p.'+p[0]+'-'+p[1]).join('、');
}
function updateScope(){
  const ids=selIds(), m=ids.filter(mastered).length;
  $('scope').textContent=pageSpan(sel)+' · 熟 '+m+'/'+ids.length;
}
let draft=null;
function openPick(){
  draft={sel:[...sel],modes:{...modes},weakOnly};
  renderPick();
  $('quiz').hidden=true; $('pick').hidden=false; $('pick').scrollTop=0;
}
function renderPick(){
  const box=$('units'); box.innerHTML='';
  UNITS.forEach(un=>{
    const ids=UNIT_IDS[un.unit], m=ids.filter(mastered).length;
    const b=document.createElement('button');
    b.className='unit'; b.setAttribute('aria-pressed',draft.sel.includes(un.unit));
    b.innerHTML='<span class="pg"></span><span class="meta"></span><span class="bar"><i></i></span>';
    b.querySelector('.pg').textContent=un.unit_label||('Unit '+un.unit);
    b.querySelector('.meta').textContent=ids.length+' 字 · 熟 '+m;
    b.querySelector('i').style.width=(ids.length?m/ids.length*100:0)+'%';
    b.onclick=()=>{
      const i=draft.sel.indexOf(un.unit);
      if(i>=0) draft.sel.splice(i,1); else draft.sel.push(un.unit);
      draft.sel.sort((a,b)=>a-b); renderPick();
    };
    box.appendChild(b);
  });
  document.querySelectorAll('#modes .chip').forEach(c=>{
    c.setAttribute('aria-pressed',!!draft.modes[c.dataset.m]);
    c.onclick=()=>{draft.modes[c.dataset.m]=!draft.modes[c.dataset.m];renderPick()};
  });
  $('weak').setAttribute('aria-pressed',draft.weakOnly);
  const n=draft.sel.flatMap(u=>UNIT_IDS[u]||[]).length;
  const anyMode=draft.modes.e2c||draft.modes.c2e||draft.modes.spell;
  const go=$('go');
  go.disabled=!n||!anyMode;
  go.textContent=!n?'至少選一個範圍':!anyMode?'至少選一種題型':'開始（'+pageSpan(draft.sel)+'，共 '+n+' 字）';
}
$('weak').onclick=()=>{draft.weakOnly=!draft.weakOnly;renderPick()};
$('all').onclick=()=>{draft.sel=UNITS.map(u=>u.unit);renderPick()};
$('none').onclick=()=>{draft.sel=[];renderPick()};
$('range').onclick=()=>{ if($('pick').hidden) openPick(); else closePick(false); };
function closePick(apply){
  if(apply){
    const changed=JSON.stringify([sel,weakOnly])!==JSON.stringify([draft.sel,draft.weakOnly]);
    const modesChanged=JSON.stringify(modes)!==JSON.stringify(draft.modes);
    sel=draft.sel; modes=draft.modes; weakOnly=draft.weakOnly;
    if(changed || !Q){
      const inSel=new Set(selIds());
      order=[]; qi=-1; retry=retry.filter(x=>inSel.has(x.id));
      $('pick').hidden=true; $('quiz').hidden=false;
      nextQuestion(); return;
    }
    if(modesChanged && !answered){ Q=buildQ(Q.id); showQuestion(); }
    save();
  }
  if(!Q) return;                 // nothing to go back to yet
  $('pick').hidden=true; $('quiz').hidden=false;
  updateScope();
}
$('go').onclick=()=>closePick(true);
let wipeT=null;
$('wipe').onclick=()=>{
  const b=$('wipe');
  if(!b.classList.contains('armed')){
    b.classList.add('armed'); b.textContent='再按一次清除';
    clearTimeout(wipeT); wipeT=setTimeout(()=>{b.classList.remove('armed');b.textContent='清除單字紀錄'},3000);
    return;
  }
  clearTimeout(wipeT); b.classList.remove('armed'); b.textContent='清除單字紀錄';
  stats={}; retry=[]; order=[]; qi=-1; Q=null;
  renderPick(); save(); toast('單字紀錄清掉了');
};

const DROP_SVG='<svg viewBox="0 0 18 24" aria-hidden="true"><path d="M9 1C9 1 2 10 2 15a7 7 0 0 0 14 0C16 10 9 1 9 1Z" fill="var(--water)"/><path d="M6 15a3 3 0 0 0 3 3" stroke="#fff" stroke-opacity=".6" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
function renderDrops(gained){
  const d=$('drops'), water=world.water;
  if(water===0){d.innerHTML='<span class="none">答對一題就有水</span>';d.removeAttribute('aria-label');return}
  const cap=innerWidth<480?6:12;
  const n=Math.min(water,cap);
  let h=''; for(let i=0;i<n;i++) h+=DROP_SVG;
  if(water>cap) h+='<span class="more">共 '+water+' 滴</span>';
  d.innerHTML=h;
  d.setAttribute('aria-label','手上有 '+water+' 滴水');
  if(gained && water<=cap) d.children[n-1].classList.add('pop');
}

/* ================= 土地（共用 world：one-drop-lib/world.vX.Y.js） =================
   土地、植物、居民、手上的水、存檔都由 world 負責；這裡只接事件、決定要說什麼。 */
// github.io 上所有 trinkets 頁面共用同一個 localStorage
const SAVE_KEY='drop-vocab-v1';
const cv=$('cv');
let toastT;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}
// world 發現新東西時要不要說話：查不到的 kind 就安靜（之後 world 加新種類，這頁不用改也不會出錯）
const DISCOVER_TEXT={pond:'水積成了一個小水塘','rare-flower':'開了一朵沒見過的花',butterfly:'有東西飛來了'};
const world=OneDropWorld.create({
  root:$('land'), key:SAVE_KEY, snapshotPrefix:'我的小土地-',
  getProgress:()=>({sel, modes, weakOnly, stats, order, qi, shown, retry, Q, again, answered}),      // 存檔欄位與順序照舊
});
world.on('water',e=>renderDrops(e.gained));
world.on('discover',e=>{ if(DISCOVER_TEXT[e.kind]) toast(DISCOVER_TEXT[e.kind]); });
world.on('nowater',()=>toast('答對一題，就有一滴水'));
world.on('message',toast);
// 橫幅：stale（別的分頁改了存檔）與 saveFailed（寫入失敗）都由這頁擁有；兩個同時成立時只顯示 stale
let stale=false, saveFailed=false;
function showBanners(){ $('stale').hidden=!stale; $('savewarn').hidden=!saveFailed||stale; }
world.on('external',()=>{ stale=true; world.freeze(); showBanners(); });
world.on('saveerror',()=>{ saveFailed=true; showBanners(); });
world.on('saved',()=>{ if(saveFailed){ saveFailed=false; showBanners(); } });
function save(){ world.save(); }
// 版本號（範圍選單底部）：頁面改了就更新 PAGE_VERSION；world 的版本由載入的 world 檔自己報
const PAGE_VERSION='2026-10-19b';
$('ver').textContent='版本 '+PAGE_VERSION+' · world '+OneDropWorld.VERSION;

/* ================= 讀檔（題庫進度） ================= */
// returns 'question' when a question is back on screen, 'next' when the quiz can continue, false for a fresh start
function load(){
  const d=world.load();                  // 土地由 world 讀進去；這裡只還原題庫進度
  if(!d) return false;
  if(d.stats && typeof d.stats==='object') for(const k in d.stats) if(WORDS[k]) stats[k]=d.stats[k];
  if(d.modes && typeof d.modes==='object') modes={e2c:!!d.modes.e2c,c2e:!!d.modes.c2e,spell:!!d.modes.spell};
  if(!modes.e2c&&!modes.c2e&&!modes.spell) modes.e2c=true;
  weakOnly=!!d.weakOnly;
  if(Array.isArray(d.sel)){
    const ok=d.sel.filter(u=>UNIT_IDS[u]);
    if(ok.length) sel=ok; else return false;      // the saved range no longer exists: ask again
  }else return false;
  const inSel=new Set(selIds());
  if(Array.isArray(d.order) && d.order.length && d.order.every(id=>WORDS[id])){
    order=d.order; qi=d.qi|0; shown=d.shown|0;
  }
  retry=Array.isArray(d.retry)?d.retry.filter(x=>x&&WORDS[x.id]&&inSel.has(x.id)):[];
  const q=d.Q;
  if(q && WORDS[q.id] && !d.answered && (q.type==='spell' || (Array.isArray(q.opts)&&q.opts.every(id=>WORDS[id])))){
    Q=q; again=!!d.again; return 'question';
  }
  return 'next';
}

/* ================= clear the land ================= */
let armT=null;
$('reset').onclick=()=>{
  const b=$('reset');
  if(!b.classList.contains('armed')){
    b.classList.add('armed'); b.textContent='再按一次清空';
    clearTimeout(armT);
    armT=setTimeout(()=>{b.classList.remove('armed');b.textContent='清空土地'},3000);
    return;
  }
  clearTimeout(armT); b.classList.remove('armed'); b.textContent='清空土地';
  world.reset();
  toast('土地清空了，單字紀錄還在');
};

/* ================= start ================= */
const resumed=load();
if(resumed==='question'){ $('quiz').hidden=false; showQuestion(); }
else if(resumed==='next'){ $('quiz').hidden=false; nextQuestion(); }
else openPick();
world.refresh();

</script>
