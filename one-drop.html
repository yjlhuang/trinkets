<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一滴水・單字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --soil:#bba88b; --speck:#a08d70; --speck2:#cbbb9f;
  --wet:#6f5a40;
  --panel:#e8ebe1; --ink:#27301f; --muted:#66705a; --line:#c9cfbd;
  --opt:#f4f6ef; --opt-hover:#fbfcf8;
  --water:#3b7ea8; --right:#4c7a33; --wrong:#a4513b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --soil:#5c4f3d; --speck:#4b4032; --speck2:#6a5c48; --wet:#2e251a;
    --panel:#1c2119; --ink:#e2e6d8; --muted:#9aa38c; --line:#343c2e;
    --opt:#252b21; --opt-hover:#2d3428;
    --water:#6fb1d8; --right:#8fbf6c; --wrong:#e0886f;
  }
}
:root[data-theme="dark"]{
  --soil:#5c4f3d; --speck:#4b4032; --speck2:#6a5c48; --wet:#2e251a;
  --panel:#1c2119; --ink:#e2e6d8; --muted:#9aa38c; --line:#343c2e;
  --opt:#252b21; --opt-hover:#2d3428;
  --water:#6fb1d8; --right:#8fbf6c; --wrong:#e0886f;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--panel); color:var(--ink);
  font-family:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  display:flex; overflow:hidden;
}
button{font:inherit}
.land{position:relative;flex:1;min-width:0;min-height:0;background:var(--soil);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:default}
.land.has-water canvas{cursor:pointer}
.hint{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:1.35rem;color:var(--ink);opacity:.55;pointer-events:none;
  text-align:center;line-height:1.6;transition:opacity .6s;white-space:nowrap;
}
.hint.gone{opacity:0}
.toast{
  position:absolute;left:50%;bottom:1.25rem;transform:translateX(-50%);
  background:var(--panel);color:var(--ink);padding:.5rem 1rem;border-radius:999px;
  font-size:1rem;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:.95}
.snap{
  position:absolute;right:.75rem;top:.75rem;font-size:.9rem;
  color:var(--ink);background:var(--panel);border:0;border-radius:999px;
  padding:.35rem .9rem;cursor:pointer;opacity:.85;
}
.snap:hover{opacity:1}
.snap[hidden]{display:none}
.stale{
  position:absolute;left:50%;top:.75rem;transform:translateX(-50%);width:max-content;max-width:calc(100% - 2rem);
  background:var(--panel);color:var(--ink);border:1.5px solid var(--wrong);border-radius:12px;
  padding:.6rem .9rem;font-size:.95rem;line-height:1.5;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;
}
.stale[hidden]{display:none}
.stale button{font-size:.9rem;padding:.3rem .9rem;border-radius:999px;border:0;background:var(--ink);color:var(--panel);cursor:pointer}
/* 存檔失敗警告會一直掛著：靠左放，讓出右上角的「存成圖片」 */
#savewarn{left:.75rem;transform:none;max-width:calc(100% - 8.5rem)}

/* 換玩法：一滴水 ⇄ 單字水彩（各自存檔、各自記熟字） */
.games{display:flex;gap:.25rem;margin:.6rem 1.25rem 0;padding:.2rem;border-radius:999px;background:var(--opt);border:1px solid var(--line);align-self:flex-start}
.games a{font-size:.9rem;color:var(--muted);text-decoration:none;padding:.2rem .9rem;border-radius:999px}
.games a[aria-current]{background:var(--ink);color:var(--panel)}
.games a:not([aria-current]):hover{color:var(--ink)}
@media (max-width:760px){.games{margin:.45rem 1rem 0}}
.panel{
  width:min(440px,42vw);display:flex;flex-direction:column;
  border-left:1px solid var(--line);min-height:0;
}
.water{
  display:flex;align-items:center;gap:.6rem;padding:.9rem 1.25rem;
  border-bottom:1px solid var(--line);min-height:3.75rem;
}
.water-label{font-size:1rem;color:var(--muted);white-space:nowrap}
.drops{display:flex;flex-wrap:wrap;gap:.2rem;align-items:center;flex:1;min-width:0}
.drops svg{width:18px;height:24px;display:block}
.drops .more{font-size:1rem;color:var(--water);margin-left:.25rem}
.drops .none{color:var(--muted);font-size:.95rem}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) translateY(-8px)}100%{transform:scale(1)}}
.bar-btn{
  flex:none;font-size:.9rem;color:var(--muted);background:none;
  border:1px solid transparent;border-radius:999px;padding:.3rem .75rem;cursor:pointer;white-space:nowrap;
}
.bar-btn:hover{border-color:var(--line);color:var(--ink)}
.bar-btn.armed{color:var(--wrong);border-color:var(--wrong)}
#range{color:var(--ink);border-color:var(--line)}

.view{flex:1;overflow-y:auto;padding:1.1rem 1.5rem 1.5rem;min-height:0}
.view[hidden]{display:none}
.where{display:flex;flex-wrap:wrap;gap:.35rem .75rem;align-items:center;font-size:.85rem;color:var(--muted);margin:0 0 .9rem}
.kind{color:var(--ink);background:var(--opt);border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem}
.again{color:var(--wrong)}
.again[hidden]{display:none}

.prompt{margin:0 0 1rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.prompt .word{font-size:2rem;font-weight:700;line-height:1.25;word-break:break-word}
.prompt .mean{font-size:1.2rem;line-height:1.7}
.say{
  flex:none;width:2.25rem;height:2.25rem;border-radius:50%;border:1px solid var(--line);
  background:var(--opt);color:var(--water);cursor:pointer;display:inline-grid;place-items:center;padding:0;
}
.say:hover{background:var(--opt-hover)}
.say svg{width:18px;height:18px}
.say[hidden]{display:none}

.opts{display:flex;flex-direction:column;gap:.5rem;margin:0;padding:0;list-style:none}
.opt{
  display:flex;gap:.6rem;width:100%;text-align:left;font-size:1rem;line-height:1.6;
  color:var(--ink);background:var(--opt);border:1.5px solid var(--line);border-radius:10px;
  padding:.6rem .8rem;cursor:pointer;
}
.opt.en{font-size:1.15rem}
.opt:hover:not(:disabled){background:var(--opt-hover);border-color:var(--muted)}
.opt .k{font-weight:700;color:var(--muted);flex:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--right);background:color-mix(in srgb,var(--right) 14%,var(--opt))}
.opt.right .k{color:var(--right)}
.opt.wrong{border-color:var(--wrong);opacity:.8}
.opt.wrong .k{color:var(--wrong)}
.opt.dim{opacity:.5}

.spell{display:flex;flex-direction:column;gap:.6rem}
.spell[hidden]{display:none}
.letters small{letter-spacing:0;font-size:.85rem;margin-left:.75rem}
.letters{font-size:1.2rem;letter-spacing:.18em;color:var(--muted);margin:0;word-break:break-all}
.spell input{
  font:inherit;font-size:1.35rem;padding:.6rem .8rem;border-radius:10px;width:100%;
  border:1.5px solid var(--line);background:var(--opt);color:var(--ink);
}
.spell input:focus{outline:none;border-color:var(--water)}
.spell input.ok{border-color:var(--right)}
.spell input.no{border-color:var(--wrong)}
.spell-row{display:flex;gap:.5rem;flex-wrap:wrap}

.after{margin-top:1rem;display:none;flex-direction:column;gap:.75rem}
.after.on{display:flex}
.msg{font-size:1rem;line-height:1.6;margin:0}
.msg.good{color:var(--right)}
.msg.bad{color:var(--wrong)}
.card{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem .8rem;border-radius:10px;background:var(--opt);border:1px solid var(--line)}
.card b{font-size:1.15rem}
.card span{color:var(--muted);line-height:1.6}
.next{
  align-self:flex-start;font-size:1rem;padding:.55rem 1.2rem;border-radius:999px;cursor:pointer;
  background:var(--ink);color:var(--panel);border:0;
}
.next:disabled{opacity:.4;cursor:default}
.ghost{
  font-size:1rem;padding:.55rem 1.1rem;border-radius:999px;cursor:pointer;
  background:none;color:var(--muted);border:1px solid var(--line);
}
.ghost:hover{color:var(--ink)}

/* range picker */
.pick h2{font-size:1.25rem;margin:0 0 .25rem}
.pick h3{font-size:1rem;margin:1.1rem 0 .5rem;color:var(--muted);font-weight:400}
.pick .sub{margin:0 0 .75rem;color:var(--muted);font-size:.9rem}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.8rem,1fr));gap:.5rem}
.unit,.chip{
  text-align:left;color:var(--ink);background:var(--opt);border:1.5px solid var(--line);
  border-radius:10px;padding:.55rem .7rem;cursor:pointer;
}
.unit{display:flex;flex-direction:column;gap:.25rem}
.unit[aria-pressed="true"],.chip[aria-pressed="true"]{border-color:var(--water);background:color-mix(in srgb,var(--water) 13%,var(--opt))}
.unit .pg{font-weight:700;font-size:1.05rem}
.unit .meta{font-size:.8rem;color:var(--muted)}
.unit .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.unit .bar i{display:block;height:100%;background:var(--right)}
.quick{display:flex;gap:.5rem;margin:.6rem 0 0}
.quick button{font-size:.85rem;padding:.25rem .8rem;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border-radius:999px;padding:.4rem .9rem}
.chip small{color:var(--muted);margin-left:.3rem}
.go{margin-top:1.25rem}
.ver-line{margin:.9rem 0 0;font-size:.75rem;color:var(--muted)}
.fine{margin-top:1.5rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

button:focus-visible,.unit:focus-visible,.chip:focus-visible{outline:3px solid var(--water);outline-offset:2px}

@media (max-width:760px){
  body{flex-direction:column}
  .land{flex:1 1 40%}
  .panel{width:100%;flex:1 1 60%;border-left:0;border-top:1px solid var(--line)}
  .water{padding:.5rem 1rem;min-height:3rem;gap:.4rem}
  .view{padding:.9rem 1rem 1.2rem}
  .prompt .word{font-size:1.7rem}
  .prompt .mean{font-size:1.1rem}
  .opt{font-size:.97rem}
}
@media (max-width:480px){ .water-label{display:none} }
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>
<main class="land" id="land">
  <canvas id="cv" aria-label="你的土地。手上有水時，點一下土地把水滴下去。"></canvas>
  <div class="hint" id="hint">一片安靜的空地</div>
  <div class="toast" id="toast" role="status"></div>
  <button class="snap" id="snap" hidden>存成圖片</button>
  <div class="stale" id="stale" role="alert" hidden>另一個分頁更新了紀錄，這個分頁先暫停存檔。<button type="button" onclick="location.reload()">重新載入</button></div>
  <div class="stale" id="savewarn" role="alert" hidden>存檔失敗（可能是瀏覽器空間不足），最近的進度還沒存到。</div>
</main>
<aside class="panel">
  <nav class="games" aria-label="換玩法"><a href="one-drop.html" aria-current="page">一滴水</a><a href="vocab-watercolor.html">水彩</a></nav>
  <div class="water">
    <span class="water-label">手上的水</span>
    <div class="drops" id="drops" aria-live="polite"></div>
    <button class="bar-btn" id="range">範圍</button>
    <button class="bar-btn" id="reset">清空土地</button>
  </div>

  <section class="view" id="quiz" hidden>
    <p class="where"><span class="kind" id="kind"></span><span id="scope"></span><span class="again" id="again" hidden>上次答錯的字</span></p>
    <div class="prompt" id="prompt"></div>
    <ul class="opts" id="opts"></ul>
    <form class="spell" id="spell" hidden autocomplete="off">
      <p class="letters" id="letters"></p>
      <input id="typed" type="text" inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="輸入英文拼法">
      <div class="spell-row">
        <button class="next" type="submit" id="check">送出</button>
        <button class="ghost" type="button" id="giveup">不會，看答案</button>
      </div>
    </form>
    <div class="after" id="after">
      <p class="msg" id="msg"></p>
      <div class="card" id="card"></div>
      <button class="next" id="next">下一題</button>
    </div>
  </section>

  <section class="view pick" id="pick" hidden>
    <h2>要練哪幾頁？</h2>
    <p class="sub">可以選一個，也可以多選一起考。</p>
    <div class="units" id="units"></div>
    <div class="quick"><button id="all">全選</button><button id="none">全不選</button></div>
    <h3>題型（可複選，會隨機出）</h3>
    <div class="chips" id="modes">
      <button class="chip" data-m="e2c">看英文選中文</button>
      <button class="chip" data-m="c2e">看中文選英文</button>
      <button class="chip" data-m="spell">看中文拼英文<small>答對兩滴水</small></button>
    </div>
    <h3>出題方式</h3>
    <div class="chips">
      <button class="chip" id="weak">只出還不熟的字</button>
    </div>
    <button class="next go" id="go">開始</button>
    <div class="fine">
      <span>連續答對兩次，就算這個字「熟了」。紀錄存在這台裝置上。</span>
      <button class="bar-btn" id="wipe">清除單字紀錄</button>
    </div>
    <p class="ver-line" id="ver"></p>
  </section>
</aside>

<script src="one-drop-lib/world.v1.2.js"></script>
<script>

   要加新單元：把整個 JSON 檔的內容貼成新的一行，前一行結尾記得加逗號。
   單字水彩（vocab-watercolor.html）建置時也是讀這份清單：改完這裡，到 vocab-watercolor-src/ 重跑 python build.py。 */

const $ = id => document.getElementById(id);
const POS_OK=/^(n|v|vt|vi|adj|adv|a|prep|phr|aux|conj|pron|int)(\/(n|v|adj|adv))?$/i;
function posKey(p){ p=(p||'').toLowerCase().split('/')[0]; return p==='vt'||p==='vi'?'v':p==='a'?'adj':p; }
function cleanMeaning(m){
  // "adv可能地" → "adv. 可能地"
  return m.trim().replace(/^([a-z]+(?:\/[a-z]+)?)\.?\s*/i,(x,p)=>POS_OK.test(p)?p+'. ':x);
}
function glosses(m){
  const s=m.replace(/\([^)]*\)|（[^）]*）/g,' ').replace(/\b(n|v|vt|vi|adj|adv|a|prep|phr|aux|conj)\b\.?/gi,' ');
  return s.split(/[；;，,、\/\s]+/).map(x=>x.replace(/[～~.。]/g,'').replace(/[的地]$/,'')).filter(x=>/[一-鿿]/.test(x));
}
function spellForm(w){
  const s=w.replace(/\(=[^)]*\)/g,'').trim().toLowerCase().replace(/\s+/g,' ');
  return /^[a-z][a-z' \-]*$/.test(s)?s:null;
}
const normWord=w=>w.replace(/\(=[^)]*\)/g,'').trim().toLowerCase();
const WORDS={}, UNIT_IDS={};
UNITS.forEach(un=>{
  UNIT_IDS[un.unit]=[];
  un.words.forEach(w=>{
    const meaning=cleanMeaning(w.meaning);
    let pos=w.pos; if(!pos){const m=meaning.match(/^([a-z]+(?:\/[a-z]+)?)\./i); pos=m?m[1]:'';}
    WORDS[w.id]={id:w.id,word:w.word.trim(),meaning,pk:posKey(pos),unit:un.unit,gl:glosses(meaning),spell:spellForm(w.word)};
    UNIT_IDS[un.unit].push(w.id);
  });
});
const ALL_IDS=Object.keys(WORDS).map(Number);
const overlap=(a,b)=>a.some(x=>b.includes(x));

/* ================= state ================= */
// 新學生預設勾最新的四回（舊學生照自己存的範圍）；vocab-watercolor.html 也照這個規則
let sel=UNITS.slice(-4).map(u=>u.unit), modes={e2c:true,c2e:true,spell:false}, weakOnly=false;
let stats={};             // id → [streak, right, wrong]
let order=[], qi=-1, Q=null, again=false, answered=false, shown=0;
let retry=[];             // [{id, due}]
const mastered=id=>(stats[id]&&stats[id][0]>=2);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selIds(){ return sel.flatMap(u=>UNIT_IDS[u]||[]); }
function pool(){
  const all=selIds();
  if(!weakOnly) return all;
  const weak=all.filter(id=>!mastered(id));
  if(!weak.length){ toast('這個範圍的字全都熟了，改成全部出'); return all; }
  return weak;
}

/* ---------- building a question ---------- */
function distractors(t){
  const out=[];
  const fits=id=>{
    const c=WORDS[id];
    if(!c || id===t.id || out.includes(id)) return false;
    if(normWord(c.word)===normWord(t.word) || overlap(c.gl,t.gl)) return false;
    return out.every(o=>normWord(WORDS[o].word)!==normWord(c.word) && !overlap(WORDS[o].gl,c.gl));
  };
  const fill=list=>{for(const id of shuffle(list)){ if(out.length>=3) break; if(fits(id)) out.push(id); }};
  const inSel=selIds(), same=id=>WORDS[id].pk===t.pk;
  // one look-alike neighbour from the list (e.g. oppress / oppression) makes it a real test
  if(Math.random()<.7){
    for(const id of shuffle(inSel.filter(id=>same(id)&&Math.abs(id-t.id)<=6))){ if(fits(id)){out.push(id);break} }
  }
  fill(inSel.filter(same));
  if(out.length<3) fill(ALL_IDS.filter(same));
  if(out.length<3) fill(ALL_IDS);
  return out;
}
function buildQ(id){
  const w=WORDS[id], types=[];
  if(modes.e2c) types.push('e2c');
  if(modes.c2e) types.push('c2e');
  if(modes.spell && w.spell) types.push('spell');
  if(!types.length) types.push('e2c');     // spelling only, but this one is a phrase with ( ) — ask it as a choice
  const type=types[Math.floor(Math.random()*types.length)];
  if(type==='spell') return {id,type};
  const opts=shuffle([id,...distractors(w)]);
  return {id,type,opts,a:opts.indexOf(id)};
}

/* ---------- flow ---------- */
function nextQuestion(){
  shown++;
  const r=retry.findIndex(x=>x.due<=shown);
  let id;
  if(r>=0){ id=retry.splice(r,1)[0].id; again=true; }
  else{
    qi++;
    if(qi>=order.length){
      if(order.length) toast('這個範圍全部出過一輪了，重新洗牌');
      order=shuffle(pool()); qi=0;
      if(Q && order.length>1 && order[0]===Q.id) order.push(order.shift());
    }
    id=order[qi]; again=false;
    retry=retry.filter(x=>x.id!==id);
  }
  Q=buildQ(id);
  showQuestion();
  save();
}

const SPEAK_SVG='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
function sayBtn(word){
  const b=document.createElement('button');
  b.className='say'; b.type='button'; b.innerHTML=SPEAK_SVG; b.setAttribute('aria-label','唸出 '+word);
  b.hidden=!canSpeak; b.onclick=()=>speak(word);
  return b;
}
const KIND={e2c:'看英文選中文',c2e:'看中文選英文',spell:'看中文拼英文'};
function showQuestion(){
  const w=WORDS[Q.id];
  answered=false;
  $('kind').textContent=KIND[Q.type];
  $('again').hidden=!again;
  updateScope();
  const pr=$('prompt'); pr.innerHTML='';
  if(Q.type==='e2c'){
    const s=document.createElement('span'); s.className='word'; s.textContent=w.word; pr.append(s, sayBtn(w.word));
  }else{
    const s=document.createElement('span'); s.className='mean'; s.textContent=w.meaning; pr.append(s);
  }
  const ul=$('opts'); ul.innerHTML='';
  $('spell').hidden=Q.type!=='spell';
  if(Q.type==='spell'){
    const t=$('typed'); t.value=''; t.disabled=false; t.className='';
    $('check').disabled=false; $('giveup').disabled=false;
    $('letters').textContent=w.spell.split('').map((c,i)=>i===0?c:c===' '?' ':c==='-'||c==="'"?c:'_').join(' ');
    const cnt=document.createElement('small'); cnt.textContent='（'+w.spell.replace(/[^a-z]/g,'').length+' 個字母）'; $('letters').append(cnt);
    if(matchMedia('(pointer:fine)').matches) t.focus({preventScroll:true});
  }else{
    Q.opts.forEach((oid,i)=>{
      const o=WORDS[oid];
      const li=document.createElement('li');
      const b=document.createElement('button');
      b.className='opt'+(Q.type==='c2e'?' en':'');
      b.innerHTML='<span class="k">'+'ABCD'[i]+'</span><span></span>';
      b.lastChild.textContent=Q.type==='c2e'?o.word:o.meaning;
      b.onclick=()=>answer(i);
      li.appendChild(b); ul.appendChild(li);
    });
  }
  $('after').classList.remove('on');
  $('quiz').scrollTop=0;
}
function record(id,ok){
  const s=stats[id]||[0,0,0];
  if(ok){s[0]++;s[1]++}else{s[0]=0;s[2]++}
  stats[id]=s;
}
function finish(ok,badText){
  const w=WORDS[Q.id];
  record(Q.id,ok);
  const msg=$('msg');
  if(ok){
    const got=Q.type==='spell'?2:1;
    world.addWater(got);
    msg.className='msg good';
    msg.textContent= world.water===got ? '答對了，得到'+(got===2?'兩滴':'一滴')+'水。點土地，把它滴下去。'
      : (got===2?'拼對了，拿兩滴水。':'答對了，又多一滴水。')+(mastered(Q.id)&&stats[Q.id][0]===2?'這個字熟了。':'');
  }else{
    retry.push({id:Q.id,due:shown+3+Math.floor(Math.random()*3)});
    msg.className='msg bad';
    msg.textContent=badText+'這個字過一會兒會再出現。';
  }
  const card=$('card'); card.innerHTML='';
  const b=document.createElement('b'); b.textContent=w.word;
  const s=document.createElement('span'); s.textContent=w.meaning;
  card.append(b, sayBtn(w.word), s);
  $('after').classList.add('on');
  $('next').focus({preventScroll:true});
  requestAnimationFrame(()=>$('after').scrollIntoView({block:'nearest',behavior:'smooth'}));
  save();
}
function answer(i){
  if(answered||Q.type==='spell'||i>=Q.opts.length) return;
  answered=true;
  [...document.querySelectorAll('.opt')].forEach((b,k)=>{
    b.disabled=true;
    if(k===Q.a) b.classList.add('right');
    else if(k===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  finish(i===Q.a,'答案是 '+'ABCD'[Q.a]+'。');
}
const tidy=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim();
function submitSpell(giveUp){
  if(answered||Q.type!=='spell') return;
  const w=WORDS[Q.id], t=$('typed'), v=tidy(t.value);
  if(!giveUp && !v){ t.focus(); return; }
  answered=true;
  const ok=!giveUp && v===w.spell;
  t.disabled=true; t.className=ok?'ok':'no';
  $('check').disabled=true; $('giveup').disabled=true;
  finish(ok, giveUp?'沒關係，記一下拼法。':'正確拼法是 '+w.spell+'。');
}
$('spell').onsubmit=e=>{e.preventDefault();submitSpell(false)};
$('giveup').onclick=()=>submitSpell(true);
$('next').onclick=nextQuestion;
document.addEventListener('keydown',e=>{
  if(!$('pick').hidden) return;
  if(e.target.tagName==='INPUT') return;
  if(e.target.tagName==='BUTTON' && (e.key==='Enter'||e.key===' ')) return;
  const k=e.key.toUpperCase();
  const idx='ABCD'.indexOf(k)>=0?'ABCD'.indexOf(k):'1234'.indexOf(k);
  if(!answered && Q && Q.type!=='spell' && idx>=0 && k.length===1){answer(idx)}
  else if(answered && e.key==='Enter'){nextQuestion()}
});

/* ---------- speech ---------- */
const canSpeak='speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
let enVoice=null;
function pickVoice(){ try{const vs=speechSynthesis.getVoices(); enVoice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){} }
if(canSpeak){ pickVoice(); try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){} }
function speak(t){
  if(!canSpeak) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/\([^)]*\)/g,' ').replace(/…/g,' '));
    u.lang='en-US'; u.rate=.85; if(enVoice) u.voice=enVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- range picker ---------- */
function pageSpan(units){
  // "p.31-32" + "p.33-34" → "p.31-34"
  const r=units.map(u=>{const un=UNITS.find(x=>x.unit===u);const m=(un&&un.unit_label||'').match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2],un.unit_label]:[null,null,un?un.unit_label:'']});
  const parts=[]; let cur=null;
  for(const [a,b,l] of r){
    if(a===null){parts.push(l);cur=null;continue}
    if(cur && a===cur[1]+1){cur[1]=b} else {cur=[a,b];parts.push(cur)}
  }
  return parts.map(p=>typeof p==='string'?p:'p.'+p[0]+'-'+p[1]).join('、');
}
function updateScope(){
  const ids=selIds(), m=ids.filter(mastered).length;
  $('scope').textContent=pageSpan(sel)+' · 熟 '+m+'/'+ids.length;
}
let draft=null;
function openPick(){
  draft={sel:[...sel],modes:{...modes},weakOnly};
  renderPick();
  $('quiz').hidden=true; $('pick').hidden=false; $('pick').scrollTop=0;
}
function renderPick(){
  const box=$('units'); box.innerHTML='';
  UNITS.forEach(un=>{
    const ids=UNIT_IDS[un.unit], m=ids.filter(mastered).length;
    const b=document.createElement('button');
    b.className='unit'; b.setAttribute('aria-pressed',draft.sel.includes(un.unit));
    b.innerHTML='<span class="pg"></span><span class="meta"></span><span class="bar"><i></i></span>';
    b.querySelector('.pg').textContent=un.unit_label||('Unit '+un.unit);
    b.querySelector('.meta').textContent=ids.length+' 字 · 熟 '+m;
    b.querySelector('i').style.width=(ids.length?m/ids.length*100:0)+'%';
    b.onclick=()=>{
      const i=draft.sel.indexOf(un.unit);
      if(i>=0) draft.sel.splice(i,1); else draft.sel.push(un.unit);
      draft.sel.sort((a,b)=>a-b); renderPick();
    };
    box.appendChild(b);
  });
  document.querySelectorAll('#modes .chip').forEach(c=>{
    c.setAttribute('aria-pressed',!!draft.modes[c.dataset.m]);
    c.onclick=()=>{draft.modes[c.dataset.m]=!draft.modes[c.dataset.m];renderPick()};
  });
  $('weak').setAttribute('aria-pressed',draft.weakOnly);
  const n=draft.sel.flatMap(u=>UNIT_IDS[u]||[]).length;
  const anyMode=draft.modes.e2c||draft.modes.c2e||draft.modes.spell;
  const go=$('go');
  go.disabled=!n||!anyMode;
  go.textContent=!n?'至少選一個範圍':!anyMode?'至少選一種題型':'開始（'+pageSpan(draft.sel)+'，共 '+n+' 字）';
}
$('weak').onclick=()=>{draft.weakOnly=!draft.weakOnly;renderPick()};
$('all').onclick=()=>{draft.sel=UNITS.map(u=>u.unit);renderPick()};
$('none').onclick=()=>{draft.sel=[];renderPick()};
$('range').onclick=()=>{ if($('pick').hidden) openPick(); else closePick(false); };
function closePick(apply){
  if(apply){
    const changed=JSON.stringify([sel,weakOnly])!==JSON.stringify([draft.sel,draft.weakOnly]);
    const modesChanged=JSON.stringify(modes)!==JSON.stringify(draft.modes);
    sel=draft.sel; modes=draft.modes; weakOnly=draft.weakOnly;
    if(changed || !Q){
      const inSel=new Set(selIds());
      order=[]; qi=-1; retry=retry.filter(x=>inSel.has(x.id));
      $('pick').hidden=true; $('quiz').hidden=false;
      nextQuestion(); return;
    }
    if(modesChanged && !answered){ Q=buildQ(Q.id); showQuestion(); }
    save();
  }
  if(!Q) return;                 // nothing to go back to yet
  $('pick').hidden=true; $('quiz').hidden=false;
  updateScope();
}
$('go').onclick=()=>closePick(true);
let wipeT=null;
$('wipe').onclick=()=>{
  const b=$('wipe');
  if(!b.classList.contains('armed')){
    b.classList.add('armed'); b.textContent='再按一次清除';
    clearTimeout(wipeT); wipeT=setTimeout(()=>{b.classList.remove('armed');b.textContent='清除單字紀錄'},3000);
    return;
  }
  clearTimeout(wipeT); b.classList.remove('armed'); b.textContent='清除單字紀錄';
  stats={}; retry=[]; order=[]; qi=-1; Q=null;
  renderPick(); save(); toast('單字紀錄清掉了');
};

const DROP_SVG='<svg viewBox="0 0 18 24" aria-hidden="true"><path d="M9 1C9 1 2 10 2 15a7 7 0 0 0 14 0C16 10 9 1 9 1Z" fill="var(--water)"/><path d="M6 15a3 3 0 0 0 3 3" stroke="#fff" stroke-opacity=".6" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
function renderDrops(gained){
  const d=$('drops'), water=world.water;
  if(water===0){d.innerHTML='<span class="none">答對一題就有水</span>';d.removeAttribute('aria-label');return}
  const cap=innerWidth<480?6:12;
  const n=Math.min(water,cap);
  let h=''; for(let i=0;i<n;i++) h+=DROP_SVG;
  if(water>cap) h+='<span class="more">共 '+water+' 滴</span>';
  d.innerHTML=h;
  d.setAttribute('aria-label','手上有 '+water+' 滴水');
  if(gained && water<=cap) d.children[n-1].classList.add('pop');
}

/* ================= 土地（共用 world：one-drop-lib/world.vX.Y.js） =================
   土地、植物、居民、手上的水、存檔都由 world 負責；這裡只接事件、決定要說什麼。 */
// github.io 上所有 trinkets 頁面共用同一個 localStorage
const SAVE_KEY='drop-vocab-v1';
const cv=$('cv');
let toastT;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}
// world 發現新東西時要不要說話：查不到的 kind 就安靜（之後 world 加新種類，這頁不用改也不會出錯）
const DISCOVER_TEXT={pond:'水積成了一個小水塘','rare-flower':'開了一朵沒見過的花',butterfly:'有東西飛來了'};
const world=OneDropWorld.create({
  root:$('land'), key:SAVE_KEY, snapshotPrefix:'我的小土地-',
  getProgress:()=>({sel, modes, weakOnly, stats, order, qi, shown, retry, Q, again, answered}),      // 存檔欄位與順序照舊
});
world.on('water',e=>renderDrops(e.gained));
world.on('discover',e=>{ if(DISCOVER_TEXT[e.kind]) toast(DISCOVER_TEXT[e.kind]); });
world.on('nowater',()=>toast('答對一題，就有一滴水'));
world.on('message',toast);
// 橫幅：stale（別的分頁改了存檔）與 saveFailed（寫入失敗）都由這頁擁有；兩個同時成立時只顯示 stale
let stale=false, saveFailed=false;
function showBanners(){ $('stale').hidden=!stale; $('savewarn').hidden=!saveFailed||stale; }
world.on('external',()=>{ stale=true; world.freeze(); showBanners(); });
world.on('saveerror',()=>{ saveFailed=true; showBanners(); });
world.on('saved',()=>{ if(saveFailed){ saveFailed=false; showBanners(); } });
function save(){ world.save(); }
// 版本號（範圍選單底部）：頁面改了就更新 PAGE_VERSION；world 的版本由載入的 world 檔自己報
const PAGE_VERSION='2026-10-14';
$('ver').textContent='版本 '+PAGE_VERSION+' · world '+OneDropWorld.VERSION;

/* ================= 讀檔（題庫進度） ================= */
// returns 'question' when a question is back on screen, 'next' when the quiz can continue, false for a fresh start
function load(){
  const d=world.load();                  // 土地由 world 讀進去；這裡只還原題庫進度
  if(!d) return false;
  if(d.stats && typeof d.stats==='object') for(const k in d.stats) if(WORDS[k]) stats[k]=d.stats[k];
  if(d.modes && typeof d.modes==='object') modes={e2c:!!d.modes.e2c,c2e:!!d.modes.c2e,spell:!!d.modes.spell};
  if(!modes.e2c&&!modes.c2e&&!modes.spell) modes.e2c=true;
  weakOnly=!!d.weakOnly;
  if(Array.isArray(d.sel)){
    const ok=d.sel.filter(u=>UNIT_IDS[u]);
    if(ok.length) sel=ok; else return false;      // the saved range no longer exists: ask again
  }else return false;
  const inSel=new Set(selIds());
  if(Array.isArray(d.order) && d.order.length && d.order.every(id=>WORDS[id])){
    order=d.order; qi=d.qi|0; shown=d.shown|0;
  }
  retry=Array.isArray(d.retry)?d.retry.filter(x=>x&&WORDS[x.id]&&inSel.has(x.id)):[];
  const q=d.Q;
  if(q && WORDS[q.id] && !d.answered && (q.type==='spell' || (Array.isArray(q.opts)&&q.opts.every(id=>WORDS[id])))){
    Q=q; again=!!d.again; return 'question';
  }
  return 'next';
}

/* ================= clear the land ================= */
let armT=null;
$('reset').onclick=()=>{
  const b=$('reset');
  if(!b.classList.contains('armed')){
    b.classList.add('armed'); b.textContent='再按一次清空';
    clearTimeout(armT);
    armT=setTimeout(()=>{b.classList.remove('armed');b.textContent='清空土地'},3000);
    return;
  }
  clearTimeout(armT); b.classList.remove('armed'); b.textContent='清空土地';
  world.reset();
  toast('土地清空了，單字紀錄還在');
};

/* ================= start ================= */
const resumed=load();
if(resumed==='question'){ $('quiz').hidden=false; showQuestion(); }
else if(resumed==='next'){ $('quiz').hidden=false; nextQuestion(); }
else openPick();
world.refresh();

</script>
