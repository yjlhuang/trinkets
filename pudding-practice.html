<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>搭配詞片語刷題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 配色沿用布丁打地鼠（pudding-whack.html） */
:root{
  --bg-a:#eef5fb; --bg-b:#b9d1e5; --panel:#ffffff; --ink:#1d3248; --ink-2:#4d6d8a; --line:rgba(29,50,72,.16);
  --accent:#c2570f; --on-accent:#ffffff; --good:#137a55; --good-bg:#d6f3e6; --bad:#b0321c; --bad-bg:#ffe1da;
  --shadow:0 10px 30px rgba(29,50,72,.14);
  --f-display:'Fredoka','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-a:#35506f; --bg-b:#141d2b; --panel:#1b2a3f; --ink:#edf3fa; --ink-2:#a8bcd1; --line:rgba(237,243,250,.18);
    --accent:#ffb35c; --on-accent:#2a1300; --good:#7ce8b8; --good-bg:#123a2b; --bad:#ff9a86; --bad-bg:#4a1d16;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-a:#35506f; --bg-b:#141d2b; --panel:#1b2a3f; --ink:#edf3fa; --ink-2:#a8bcd1; --line:rgba(237,243,250,.18);
  --accent:#ffb35c; --on-accent:#2a1300; --good:#7ce8b8; --good-bg:#123a2b; --bad:#ff9a86; --bad-bg:#4a1d16;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background-color:var(--bg-b);background-image:radial-gradient(ellipse 90% 70% at 50% 0%, var(--bg-a) 0%, var(--bg-b) 85%);background-attachment:fixed}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px;padding-bottom:max(40px,env(safe-area-inset-bottom))}
h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(26px,6.5vw,34px);line-height:1.1}
.sub{margin:6px 0 18px;font-weight:700;font-size:16px;color:var(--ink-2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px 20px 18px}
.lab{margin:0 0 8px;font-weight:700;font-size:15px}
.hide{display:none!important}

/* 設定 */
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;padding:9px 14px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:15px;line-height:1.2}
.opts input:checked + span{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.opts input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.opts small{font-weight:500;opacity:.75}
.btn{appearance:none;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font:700 17px/1 var(--f-body);padding:15px 18px;width:100%;cursor:pointer;margin-top:6px;touch-action:manipulation}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn + .btn{margin-top:10px}
.note{margin:14px 0 0;color:var(--ink-2);font-size:14px;line-height:1.6}
.note a{color:var(--accent);font-weight:700}

/* 作答 */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.track{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
.stat{font-size:14px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.stat b{color:var(--good)}
.quit{appearance:none;border:0;background:none;color:var(--ink-2);font:700 14px var(--f-body);cursor:pointer;padding:4px}
.tagline{margin:0 0 6px;color:var(--ink-2);font-size:13px}
.sent{margin:2px 0 8px;font-family:var(--f-display);font-weight:500;font-size:clamp(19px,4.8vw,25px);line-height:1.45}
.blank{display:inline-block;min-width:4.2em;padding:0 .25em;margin:0 .1em;border-bottom:3px solid var(--accent);color:var(--accent);font-weight:600;text-align:center}
.blank.ok{color:var(--good);border-color:var(--good)}
.hintrow{display:flex;align-items:center;gap:10px;min-height:36px;margin:0 0 14px}
.hintbtn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:999px;padding:7px 14px;font:700 14px var(--f-body);cursor:pointer}
.hintbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hintbtn kbd{font:600 12px var(--f-display);opacity:.7;margin-left:4px}
.hintzh{font-weight:700;font-size:17px;color:var(--ink-2)}
.choices{display:grid;gap:10px}
.ch{appearance:none;text-align:left;width:100%;display:flex;align-items:center;gap:12px;background:transparent;color:var(--ink);
  border:2px solid var(--line);border-radius:14px;padding:13px 14px;font:500 clamp(17px,4.4vw,20px)/1.3 var(--f-display);cursor:pointer;touch-action:manipulation}
.ch kbd{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--line);font:600 13px var(--f-display);color:var(--ink-2)}
.ch:hover:not(:disabled){border-color:var(--accent)}
.ch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ch:disabled{cursor:default}
.ch.right{border-color:var(--good);background:var(--good-bg)}
.ch.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ch.dim{opacity:.55}
.fb{margin-top:16px}
.verdict{margin:0 0 8px;font-weight:700;font-size:20px}
.verdict.ok{color:var(--good)}.verdict.bad{color:var(--bad)}
.chunk{border-left:4px solid var(--good);padding:4px 0 4px 12px;margin:0 0 10px;line-height:1.5}
.chunk .l{display:block;font-size:13px;color:var(--ink-2)}
.chunk .e{font-family:var(--f-display);font-weight:600;font-size:20px}
.chunk .z{font-weight:700;margin-left:8px}
.picked{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.picked s{color:var(--bad);font-weight:700}
.tag{display:inline-block;font:500 12px/1 var(--f-body);letter-spacing:.04em;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:4px 9px 5px}

/* 結果 */
.big{font-family:var(--f-display);font-weight:600;font-size:56px;line-height:1;margin:4px 0}
.big small{font-size:24px;color:var(--ink-2)}
.ri{border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.ri .h{margin:0 0 4px;font-size:13px;color:var(--ink-2)}
.ri .c{margin:0;font:600 18px/1.3 var(--f-display)}
.ri .c span{font:700 15px var(--f-body);color:var(--ink-2);margin-left:8px}
.ri .en{font-size:15px;line-height:1.5;margin:4px 0}
.ri .en b{color:var(--good)}
.ri .p{margin:0;font-size:14px;color:var(--ink-2)}
.ri .p s{color:var(--bad);font-weight:700}
.sec{margin:18px 0 8px;font-size:16px;font-weight:700}
.foot{margin-top:22px;text-align:center;color:var(--ink-2);font-size:12px}
@media (prefers-reduced-motion:reduce){ .track i{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <h1>搭配詞片語刷題</h1>
  <p class="sub">100–115 學測考過的搭配詞和片語，選項是當年的四個</p>

  <section class="card" id="setup">
    <p class="lab">範圍</p>
    <div class="opts" id="poolOpts">
      <label><input type="radio" name="pool" value="all"><span>全部 <small id="nAll"></small></span></label>
      <label><input type="radio" name="pool" value="搭配詞"><span>搭配詞（詞彙題） <small id="nL"></small></span></label>
      <label><input type="radio" name="pool" value="片語"><span>片語（綜合測驗） <small id="nP"></small></span></label>
    </div>
    <p class="lab">題數</p>
    <div class="opts" id="lenOpts">
      <label><input type="radio" name="len" value="10"><span>10 題</span></label>
      <label><input type="radio" name="len" value="20"><span>20 題</span></label>
      <label><input type="radio" name="len" value="0"><span>全部 <small id="nPool"></small></span></label>
    </div>
    <button class="btn" id="goBtn">開始刷題 ▶</button>
    <p class="note">不計時，看完整的原句再選。想不出來可以按「看中文提示」。鍵盤可按 1–4 選答案、H 看提示、Enter 下一題。想玩遊戲版？<a href="pudding-whack.html">去敲布丁 🍮</a></p>
  </section>

  <section class="card hide" id="play">
    <div class="bar">
      <div class="track"><i id="prog"></i></div>
      <span class="stat" id="stat"></span>
      <button class="quit" id="quitBtn">結束</button>
    </div>
    <p class="tagline" id="tagline"></p>
    <p class="sent" id="sent"></p>
    <div class="hintrow"><button class="hintbtn" id="hintBtn" type="button">看中文提示<kbd>H</kbd></button><span class="hintzh hide" id="hintZh"></span></div>
    <div class="choices" id="choices"></div>
    <div class="fb hide" id="fb"></div>
    <button class="btn hide" id="nextBtn">下一題 ▶</button>
  </section>

  <section class="card hide" id="result">
    <p class="lab" style="margin:0">這一輪</p>
    <div class="big" id="rScore"></div>
    <p class="note" id="rMeta" style="margin:0 0 6px"></p>
    <div id="rMiss"></div>
    <button class="btn hide" id="retryWrong">只重做答錯的</button>
    <button class="btn" id="againBtn">再來一輪</button>
    <button class="btn ghost" id="setupBtn">換範圍／題數</button>
  </section>

  <p class="foot">題庫與布丁打地鼠共用（pudding-words.js）；答錯的紀錄也共用，遊戲裡會優先再出</p>
</div>

<script src="pudding-words.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ITEMS = window.PUDDING_ITEMS || [];
const src = id => id.replace(/學測-0?(\d+)$/, ' 學測 第 $1 題');
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') || d; } catch(e){ return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

const PREF_KEY = 'pudding-practice-pref', DECK_KEY = 'pudding-practice-deck';
const STATS_KEY = 'pudding-colloc';   // 和遊戲共用：每題答對／答錯幾次
let pref = Object.assign({ pool:'all', len:'10' }, load(PREF_KEY, {}));
const show = id => ['setup','play','result'].forEach(k => $('#'+k).classList.toggle('hide', k !== id));
const pool = () => pref.pool === 'all' ? ITEMS : ITEMS.filter(it => it.kind === pref.pool);

/* ---------- 設定畫面 ---------- */
function renderSetup(){
  $('#nAll').textContent = `${ITEMS.length} 題`;
  $('#nL').textContent = `${ITEMS.filter(i => i.kind === '搭配詞').length} 題`;
  $('#nP').textContent = `${ITEMS.filter(i => i.kind === '片語').length} 題`;
  if (!/^(all|搭配詞|片語)$/.test(pref.pool)) pref.pool = 'all';
  if (!/^(10|20|0)$/.test(pref.len)) pref.len = '10';
  document.querySelector(`input[name=pool][value="${pref.pool}"]`).checked = true;
  document.querySelector(`input[name=len][value="${pref.len}"]`).checked = true;
  $('#nPool').textContent = `${pool().length} 題`;
  show('setup');
}
$('#poolOpts').addEventListener('change', e => { pref.pool = e.target.value; $('#nPool').textContent = `${pool().length} 題`; });
$('#lenOpts').addEventListener('change', e => { pref.len = e.target.value; });

/* 抽題：跟遊戲一樣洗成一疊，抽完才重洗，答對的不會很快又出現；答錯還沒補回來的先出（最多三分之一） */
function pickList(){
  const all = pool(), n = +pref.len || all.length;
  if (n >= all.length) return shuffle(all.slice());
  const stats = load(STATS_KEY, {}), byId = {}, decks = load(DECK_KEY, {});
  all.forEach(it => byId[it.id] = it);
  const d = decks[pref.pool] = decks[pref.pool] || {};
  const last = (d.last || []).filter(id => byId[id]);
  let deck = (d.left || []).filter(id => byId[id]);
  const pick = shuffle(all.filter(it => { const s = stats[it.id]; return s && s.miss > s.ok; })).slice(0, Math.ceil(n / 3));
  while (pick.length < n){
    if (!deck.length){
      deck = shuffle(all.filter(it => !pick.includes(it) && !last.includes(it.id)).map(it => it.id));
      if (!deck.length) deck = shuffle(all.filter(it => !pick.includes(it)).map(it => it.id));
    }
    const it = byId[deck.pop()];
    if (!pick.includes(it)) pick.push(it);
  }
  d.left = deck; d.last = pick.map(it => it.id); save(DECK_KEY, decks);
  return shuffle(pick);
}

/* ---------- 作答 ---------- */
let run = null;
function startRun(list){ run = { list, i:0, right:0, noHint:0, misses:[], locked:false }; next(); }
function begin(){ save(PREF_KEY, pref); startRun(pickList()); }
function next(){
  if (run.i >= run.list.length) return finish();
  const q = run.q = run.list[run.i];
  run.locked = false; run.hinted = false;
  run.opts = shuffle(q.options.slice());
  const [a, b] = q.sentence.split('___');
  $('#sent').innerHTML = esc(a) + '<span class="blank" id="blank">&nbsp;</span>' + esc(b);
  $('#tagline').innerHTML = `第 ${run.i + 1} 題　<span class="tag">${esc(q.kind)}</span>　${esc(src(q.id))}`;
  $('#hintZh').textContent = q.zh; $('#hintZh').classList.add('hide'); $('#hintBtn').classList.remove('hide');
  $('#choices').innerHTML = run.opts.map((o, i) => `<button class="ch" data-i="${i}"><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`).join('');
  $('#fb').classList.add('hide'); $('#nextBtn').classList.add('hide');
  stat(); show('play');
  $('#choices').firstElementChild.focus({ preventScroll:true });
}
function stat(){
  $('#prog').style.width = (run.i / run.list.length * 100) + '%';
  $('#stat').innerHTML = `${run.i + 1} / ${run.list.length}　<b>✓ ${run.right}</b>`;
}
function hint(){
  if (run.locked || run.hinted) return;
  run.hinted = true; $('#hintZh').classList.remove('hide'); $('#hintBtn').classList.add('hide');
}
function pick(i){
  if (run.locked) return;
  run.locked = true;
  const o = run.opts[i], q = run.q, ok = o === q.answer;
  [...document.querySelectorAll('.ch')].forEach((b, k) => { b.disabled = true; b.classList.add(run.opts[k] === q.answer ? 'right' : (k === i ? 'wrong' : 'dim')); });
  const blank = $('#blank'); blank.textContent = q.answer; blank.classList.add('ok');
  const stats = load(STATS_KEY, {}), st = stats[q.id] = stats[q.id] || { ok:0, miss:0 };
  if (ok){ st.ok++; run.right++; if (!run.hinted) run.noHint++; } else { st.miss++; run.misses.push({ q, picked:o }); }
  save(STATS_KEY, stats);
  $('#hintBtn').classList.add('hide'); $('#hintZh').classList.add('hide');
  $('#fb').innerHTML = (ok ? `<p class="verdict ok">✓ 答對了${run.hinted ? '（看了提示）' : ''}</p>` : `<p class="verdict bad">✗ 再看一下</p>`)
    + `<div class="chunk"><span class="l">整塊背</span><span class="e">${esc(q.chunk)}</span><span class="z">${esc(q.zh)}</span></div>`
    + (ok ? '' : `<p class="picked">你選的是 <s>${esc(o)}</s>，正確答案是 <b>${esc(q.answer)}</b></p>`);
  $('#fb').classList.remove('hide');
  $('#nextBtn').textContent = run.i + 1 >= run.list.length ? '看成績 ▶' : '下一題 ▶';
  $('#nextBtn').classList.remove('hide');
  stat();
  $('#nextBtn').focus({ preventScroll:true });
  $('#nextBtn').scrollIntoView({ block:'nearest', behavior:'smooth' });
}
$('#choices').addEventListener('click', e => { const b = e.target.closest('.ch'); if (b) pick(+b.dataset.i); });
$('#hintBtn').addEventListener('click', hint);
$('#nextBtn').addEventListener('click', () => { run.i++; next(); });
document.addEventListener('keydown', e => {
  if ($('#play').classList.contains('hide') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!run.locked && /^[1-4]$/.test(e.key)) pick(+e.key - 1);
  else if (!run.locked && (e.key === 'h' || e.key === 'H')) hint();
});
$('#quitBtn').addEventListener('click', () => { run.list.length = run.i + (run.locked ? 1 : 0); run.i = run.list.length; finish(); });

/* ---------- 結果 ---------- */
function finish(){
  const n = run.list.length;
  if (!n){ renderSetup(); return; }
  $('#rScore').innerHTML = `${run.right}<small> / ${n}</small>`;
  $('#rMeta').textContent = (run.misses.length ? `答錯 ${run.misses.length} 題，下面是整理。` : '全對！')
    + (run.right ? `其中 ${run.noHint} 題沒看中文提示就答對。` : '');
  $('#rMiss').innerHTML = run.misses.length ? '<p class="sec">答錯的題目</p>' + run.misses.map(m => {
    const [a, b] = m.q.sentence.split('___');
    return `<div class="ri"><p class="h"><span class="tag">${esc(m.q.kind)}</span>　${esc(src(m.q.id))}</p>
      <p class="c">${esc(m.q.chunk)}<span>${esc(m.q.zh)}</span></p>
      <p class="en">${esc(a)}<b>${esc(m.q.answer)}</b>${esc(b)}</p>
      <p class="p">你選 <s>${esc(m.picked)}</s></p></div>`;
  }).join('') : '';
  $('#retryWrong').classList.toggle('hide', !run.misses.length);
  run.lastMisses = run.misses.map(m => m.q);
  show('result'); window.scrollTo(0, 0);
}
$('#retryWrong').addEventListener('click', () => startRun(shuffle(run.lastMisses.slice())));
$('#againBtn').addEventListener('click', begin);
$('#setupBtn').addEventListener('click', renderSetup);
$('#goBtn').addEventListener('click', () => { if (pool().length) begin(); });

renderSetup();
})();
</script>
</body>
</html>
