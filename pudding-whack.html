<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>布丁打地鼠：搭配詞片語</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
/* Layout: full-bleed WebGL stage; UI floats on top (brand left, two small controls right, one hint at the bottom). */
:root{
  --bg-a:#eef5fb;
  --bg-b:#b9d1e5;
  --dot:rgba(29,50,72,.13);
  --ink:#1d3248;
  --ink-2:#4d6d8a;
  --panel:rgba(255,255,255,.80);
  --line:rgba(29,50,72,.16);
  --accent:#c2570f;
  --on-accent:#ffffff;
  --pop:#fff6dc;
  --pop-edge:#8f3a05;
  --f-display:'Fredoka','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-a:#35506f; --bg-b:#141d2b; --dot:rgba(234,241,248,.10);
    --ink:#edf3fa; --ink-2:#a8bcd1; --panel:rgba(18,27,41,.80); --line:rgba(237,243,250,.18);
    --accent:#ffb35c; --on-accent:#2a1300; --pop:#fff3d1; --pop-edge:#7a3004;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg-a:#35506f; --bg-b:#141d2b; --dot:rgba(234,241,248,.10);
  --ink:#edf3fa; --ink-2:#a8bcd1; --panel:rgba(18,27,41,.80); --line:rgba(237,243,250,.18);
  --accent:#ffb35c; --on-accent:#2a1300; --pop:#fff3d1; --pop-edge:#7a3004;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{
  background-color:var(--bg-b);
  background-image:radial-gradient(ellipse 80% 70% at 50% 42%, var(--bg-a) 0%, var(--bg-b) 78%);
  color:var(--ink);
  font-family:var(--f-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#app::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(var(--dot) 1.1px, transparent 1.4px);
  background-size:24px 24px;
  -webkit-mask-image:radial-gradient(ellipse 70% 65% at 50% 50%, #000 0%, transparent 100%);
          mask-image:radial-gradient(ellipse 70% 65% at 50% 50%, #000 0%, transparent 100%);
}
#gl{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  touch-action:none;outline:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#gl:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
#gl[data-pointer]:focus-visible{outline:none}   /* 滑鼠或觸控點擊取得的焦點不畫框，只有鍵盤操作才畫 */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{
  position:absolute;white-space:nowrap;
  font-family:var(--f-display);font-weight:600;font-size:clamp(24px,5vmin,42px);
  color:var(--pop);
  text-shadow:2px 0 var(--pop-edge),-2px 0 var(--pop-edge),0 2px var(--pop-edge),0 -2px var(--pop-edge),
              1.5px 1.5px var(--pop-edge),-1.5px 1.5px var(--pop-edge),1.5px -1.5px var(--pop-edge),-1.5px -1.5px var(--pop-edge),
              0 5px 0 var(--pop-edge);
  animation:pop .6s cubic-bezier(.2,.8,.25,1) forwards;
}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-30%) scale(.35) rotate(var(--rot))}
  16%{opacity:1;transform:translate(-50%,-70%) scale(1.25) rotate(var(--rot))}
  100%{opacity:0;transform:translate(-50%,-210%) scale(1) rotate(var(--rot))}
}
#ui{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  pointer-events:none;
}
.top-stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.6vw,30px);line-height:1.05;letter-spacing:.01em}
.brand p{margin:3px 0 0;font-size:13px;letter-spacing:.28em;color:var(--ink-2);font-weight:500}
.ctrls{display:flex;gap:8px;pointer-events:auto}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  font:500 13px/1 var(--f-body);color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px 9px 12px;min-height:38px;cursor:pointer;touch-action:manipulation;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.pill:hover{border-color:var(--ink-2)}
.pill:focus-visible,.chk input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pill svg{width:16px;height:16px;flex:none}
.pill[aria-pressed="false"]{color:var(--ink-2)}
#perf{
  align-self:flex-end;width:min(330px,100%);pointer-events:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 10px}
.stats div{min-width:0}
.stats dt{font-size:11px;color:var(--ink-2);white-space:nowrap;letter-spacing:.04em}
.stats dd{margin:2px 0 0;font:600 15px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.35;padding:5px 0;cursor:pointer}
.chk input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--accent);flex:none}
.chk span{min-width:0}
#hint{
  align-self:center;margin:0;text-align:center;
  font-size:14px;letter-spacing:.12em;color:var(--ink-2);font-weight:500;
  padding:8px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:opacity .6s ease, transform .6s ease;
}
#hint.gone{opacity:0;transform:translateY(8px)}
#fail{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:var(--bg-b);z-index:5;
}
#fail > div{max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px}
#fail h2{margin:0 0 8px;font-family:var(--f-display);font-size:20px}
#fail p{margin:0;line-height:1.6;font-size:14px;color:var(--ink-2)}
@media (max-width:460px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pill span.lbl-long{display:none}
}
@media (prefers-reduced-motion: reduce){
  .pop{animation-duration:.01s}
  #hint{transition:none}
}

/* ===== 第 2 階段：單字層 ===== */
:root{
  --good:#137a55; --good-bg:#d6f3e6;
  --bad:#b0321c;  --bad-bg:#ffe1da;
  --lbl-bg:rgba(255,255,255,.97);
  --veil:rgba(238,245,251,.74);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --good:#7ce8b8; --good-bg:#123a2b;
    --bad:#ff9a86;  --bad-bg:#4a1d16;
    --lbl-bg:rgba(27,42,63,.97);
    --veil:rgba(14,21,32,.72);
  }
}
:root[data-theme="dark"]{
  --good:#7ce8b8; --good-bg:#123a2b;
  --bad:#ff9a86;  --bad-bg:#4a1d16;
  --lbl-bg:rgba(27,42,63,.97);
  --veil:rgba(14,21,32,.72);
}
#ui{z-index:2}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.lbl{
  position:absolute;left:0;top:0;white-space:nowrap;
  font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1;letter-spacing:.01em;
  color:var(--ink);background:var(--lbl-bg);
  border:2px solid var(--line);border-radius:999px;padding:7px 13px 8px;
  box-shadow:0 3px 0 rgba(29,50,72,.18);
  will-change:transform;
}
.lbl.good{color:var(--good);background:var(--good-bg);border-color:var(--good)}
.lbl.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad)}
.tag{
  display:inline-block;font:500 12px/1 var(--f-body);letter-spacing:.06em;
  color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:4px 9px 5px;
}
#quiz{
  position:absolute;z-index:1;top:62px;
  left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));
  max-width:520px;margin-inline:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 16px 14px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
#quiz.good{border-color:var(--good)}
#quiz.bad{border-color:var(--bad)}
.q-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.q-prog{font:500 13px/1 var(--f-display);letter-spacing:.08em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.q-main{margin-top:8px;font-weight:700;font-size:28px;line-height:1.2;text-wrap:balance}
.q-fb{margin-top:6px}
/* 中文提示：出題 8 秒還沒敲才淡淡浮出來，程度好的學生不用看 */
.q-hint{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:700;font-size:17px;line-height:1.3;color:var(--ink-2);animation:hint-in .5s ease both}
.q-hint .tag{flex:none}
@keyframes hint-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (max-height:620px){ .q-hint{font-size:15px;margin-top:5px} }
@media (prefers-reduced-motion: reduce){ .q-hint{animation:none} }
.fb-word{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.1}
.fb-zh{margin-top:4px;font-weight:700;font-size:18px}
.fb-ex{margin:8px 0 0;font-size:15px;line-height:1.45}
.fb-ex mark{background:transparent;color:var(--accent);font-weight:700;border-bottom:2px solid currentColor}
.fb-exzh{margin:3px 0 0;font-size:13px;line-height:1.5;color:var(--ink-2)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:48px;padding:0 22px;border:0;border-radius:14px;cursor:pointer;touch-action:manipulation;
  font:600 16px/1 var(--f-body);color:var(--on-accent);background:var(--accent);
}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#btn-next{margin-top:10px;width:100%;min-height:44px}
.sheet{
  position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:var(--veil);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.sheet-card{
  width:100%;max-width:360px;max-height:100%;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 22px 22px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.sheet-card h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1}
.sheet-card p{margin:10px 0 0;font-size:15px;line-height:1.6;color:var(--ink-2)}
.sheet-card .btn{margin-top:20px;width:100%}
.sum-score{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:1;margin-top:12px}
.sheet-card p.alt{margin-top:6px;font-size:14px}
.sheet-card p.alt a{color:var(--accent);font-weight:700}
.sum-score small{font-size:20px;color:var(--ink-2);font-weight:500}
/* 結算彩紙（參照 hoops）：8 題以上才撒，疊在結算卡上面、不擋點擊 */
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.badge{display:inline-block;margin-top:10px;padding:5px 12px 6px;border-radius:999px;font:600 15px/1 var(--f-display);color:var(--on-accent);background:var(--accent)}
.sum-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.sum-list li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:15px;border-top:1px solid var(--line);padding-top:8px}
.sum-list b{font-family:var(--f-display);font-weight:600;font-size:17px}
.sum-list span{color:var(--ink-2);text-align:right;min-width:0}
/* 錯題檢討（參照 hoops）：整局十題，答錯的排最前面 */
.btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--line)}
.sheet-card .btn.ghost{margin-top:16px}
.sheet-card .btn.ghost + .btn{margin-top:10px}
.sheet-card.rev{max-width:520px;display:flex;flex-direction:column;overflow:hidden}
.rev-list{flex:1;min-height:0;overflow:auto;margin:12px -6px 0;padding:0 6px}
.ri{border-top:1px solid var(--line);padding:10px 0 12px}
.ri-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.ri-h .no{font:600 14px/1 var(--f-display);color:var(--ink);min-width:1.4em}
.ri-h .st{margin-left:auto;font-weight:700}
.ri.bad .st{color:var(--bad)} .ri.hint .st{color:var(--accent)} .ri.ok .st{color:var(--good)}
.sheet-card .ri .chunk,.sheet-card .ri .en{color:var(--ink)}
.ri .chunk{margin:6px 0 0;font:600 18px/1.25 var(--f-display)}
.ri .chunk span{font:700 15px var(--f-body);color:var(--ink-2);margin-left:8px}
.ri .en{margin:4px 0 0;font-size:14px;line-height:1.5}
.ri .en b{color:var(--good)}
.ri .pick{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.ri .pick s{color:var(--bad);font-weight:700}
.rev-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sheet-card .rev-btns .btn{margin-top:0}
@media (max-width:460px){
  .q-main{font-size:26px}
  .fb-word{font-size:28px}
}
@media (max-height:620px){
  #quiz{top:58px;padding:9px 14px 11px}
  .q-main{font-size:22px;margin-top:5px}
  .fb-word{font-size:22px}
  .fb-zh{font-size:15px}
  .fb-ex{font-size:13px;margin-top:6px}
  .fb-exzh{display:none}
  #btn-next{min-height:42px;margin-top:8px}
}

/* 標題換成較長的 Pudding Whack：標題列不換行，窄螢幕縮小按鈕 */
.top{flex-wrap:nowrap}
.ctrls{flex-shrink:0}
@media (max-width:460px){
  .brand h1{font-size:18px;white-space:nowrap}
  .brand p{letter-spacing:.2em}
  .pill{padding:8px 11px 8px 10px;gap:5px}
}
@media (max-width:340px){ #snd-label{display:none} .brand p{display:none} }

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:18px;padding:4px;border:1px solid var(--line);border-radius:14px}
.seg button{
  min-height:42px;border:0;border-radius:10px;cursor:pointer;touch-action:manipulation;
  font:600 15px/1 var(--f-body);color:var(--ink-2);background:transparent;
}
.seg button[aria-checked="true"]{color:var(--bg-a);background:var(--ink)}
.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.sheet-card .seg-note{margin:8px 2px 0;font-size:13px;line-height:1.5}
.sheet-card .seg + .seg-note + .btn{margin-top:14px}
.seg3{grid-template-columns:1fr 1fr 1fr}
.q-main.frame{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.4;text-wrap:pretty}
.q-main .blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);margin:0 .12em;transform:translateY(-.15em)}
.fb-word{font-size:24px}
.fb-ex mark{white-space:nowrap}
.lbl.long{font-size:15px;padding:6px 11px 7px}
.lbl.xlong{font-size:13px;padding:6px 9px 7px}
@media (max-width:460px){ .q-main.frame{font-size:19px} .fb-word{font-size:22px} .lbl.long{font-size:13px} .lbl.xlong{font-size:11.5px;padding:5px 8px 6px} }
@media (max-height:620px){ .q-main.frame{font-size:17px} .fb-word{font-size:19px} }
/* 自動繼續：按鈕底色慢慢變深，表示快要跳到下一題；點按鈕可提早跳過 */
#btn-next.auto{background-image:linear-gradient(90deg,rgba(0,0,0,.24) calc(var(--p,0) * 100%),transparent 0)}
</style>

<div id="app">
  <canvas id="gl" tabindex="0" aria-label="布丁打地鼠：點擊或觸碰冒出來的布丁，木槌會敲下去。按 Enter 或空白鍵也可以敲。"></canvas>
  <div id="fx" aria-hidden="true"></div>
  <div id="labels" aria-hidden="true"></div>
  <div id="ui">
    <div class="top-stack">
      <header class="top">
        <div class="brand">
          <h1>Pudding Whack</h1>
          <p>學測搭配詞・片語</p>
        </div>
        <div class="ctrls">
          <button id="btn-sound" class="pill" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path id="snd-wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
            <span id="snd-label">音效 開</span>
          </button>
          <button id="btn-perf" class="pill" type="button" aria-expanded="false" aria-controls="perf">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h4l3-8 4 14 3-6h4"/></svg>
            <span>效能</span>
          </button>
        </div>
      </header>
      <section id="perf" hidden aria-label="效能測試面板">
        <dl class="stats">
          <div><dt>幀率</dt><dd id="st-fps">--</dd></div>
          <div><dt>幀時間</dt><dd id="st-ms">--</dd></div>
          <div><dt>繪製呼叫</dt><dd id="st-calls">--</dd></div>
          <div><dt>三角形</dt><dd id="st-tris">--</dd></div>
          <div><dt>像素比</dt><dd id="st-dpr">--</dd></div>
        </dl>
        <label class="chk"><input type="checkbox" id="opt-trans" checked><span>焦糖半透明（關掉可比較重疊像素的成本）</span></label>
        <label class="chk"><input type="checkbox" id="opt-hires" checked><span>高解析度（使用裝置像素比，上限 2）</span></label>
        <label class="chk"><input type="checkbox" id="opt-auto"><span>自動連打壓力測試（每秒約 9 下）</span></label>
      </section>
    </div>
    <p id="hint">點冒出來的布丁，敲下去</p>
  </div>
  <section id="quiz" hidden aria-live="polite">
    <div class="q-row"><span id="q-prog" class="q-prog">1 / 10</span><span id="q-pos" class="tag"></span></div>
    <div id="q-main" class="q-main"></div>
    <div id="q-hint" class="q-hint" hidden><span class="tag">提示</span><span id="q-hint-zh"></span></div>
    <div id="q-fb" class="q-fb" hidden>
      <div class="fb-word"><span id="fb-word"></span><span id="fb-pos" class="tag"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function () {
'use strict';

/* ---------- 啟動檢查：CDN 與 WebGL ---------- */
var $ = function (s) { return document.querySelector(s); };
function fail(msg) { $('#fail-msg').textContent = msg; $('#fail').hidden = false; }

if (typeof THREE === 'undefined') {
  fail('無法從 cdnjs.cloudflare.com 載入 Three.js。請確認網路連線，然後重新整理頁面。');
  return;
}

var stage = $('#app');
var canvas = $('#gl');
var renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (err) {
  fail('這個瀏覽器或裝置無法建立 WebGL 繪圖環境，所以看不到 3D 布丁。');
  return;
}
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x000000, 0);
renderer.localClippingEnabled = true;   // 布丁沉到台面以下的部分用裁切平面藏起來

canvas.addEventListener('webglcontextlost', function (e) {
  e.preventDefault();
  fail('繪圖環境中斷了（可能是裝置記憶體不足）。請重新整理頁面。');
});

/* ---------- 基本常數 ---------- */
var H = 2.0;            // 布丁高度
var RB = 1.62;          // 底部半徑
var RT = 1.34;          // 頂部半徑
var NU = 72;            // 圍繞一圈的分段數
var TOP_REST = H + 0.12;// 靜止時焦糖頂面高度
var STEP = 1 / 240;     // 固定物理步長
var MALLET_S = 1.4;     // 木槌整體放大，手機上才看得清楚
var MALLET_R = 0.425 * MALLET_S, MALLET_HL = 0.59 * MALLET_S;
var HOLE_R = 1.84;      // 洞的半徑
var HIDE_Y = -2.75;     // 完全藏起來時的高度（整顆在台面以下）
var BOARD_T = 0.7;      // 台面厚度
var SPX = 3.95, SPZ = 4.2;   // 洞的間距

function lin(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, k) { return a + (b - a) * k; }
function rnd(a, b) { return a + Math.random() * (b - a); }

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 160);
var TARGET = new THREE.Vector3(0, 0.6, 0);
var CAM_ELEV = 0.96;     // 俯視約 55 度，前排不會把後排的臉擋住
var camDist = 30;
var shake = 0;

function placeCamera() {
  var s = shake * 0.035;
  camera.position.set(
    TARGET.x + (Math.random() - 0.5) * s,
    TARGET.y + Math.sin(CAM_ELEV) * camDist + (Math.random() - 0.5) * s,
    TARGET.z + Math.cos(CAM_ELEV) * camDist
  );
  camera.lookAt(TARGET);
}

/* ---------- 版面：四個選項就四個洞，直向 2x2，橫向 4x1 ---------- */
var layout = null;      // { key, cols, rows, holes:[{x,z}], bw, bd, home }
function makeLayout(aspect) {
  var portrait = aspect < 0.95, cols = portrait ? 2 : 4, rows = portrait ? 2 : 1, holes = [];
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) holes.push({ x: (c - (cols - 1) / 2) * SPX, z: (r - (rows - 1) / 2) * SPZ });
  var margin = HOLE_R + 0.95;
  var bw = (cols - 1) * SPX + 2 * margin, bd = (rows - 1) * SPZ + 2 * margin;
  var backZ = -(rows - 1) / 2 * SPZ;
  return {
    key: portrait ? 'p' : 'l', portrait: portrait, cols: cols, rows: rows, holes: holes, bw: bw, bd: bd,
    home: { x: bw * 0.24, y: TOP_REST + 1.4, z: backZ - 3.3 }
  };
}
function fitCamera(w, h) {
  var asp = w / h, L = makeLayout(asp);
  camera.aspect = asp;
  camera.fov = L.portrait ? 42 : 30;
  var t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  var uiTop = L.portrait ? 5.7 : 3.6;                     // 畫面上方留給標題與之後的題目列（世界單位）
  var needW = L.bw + 0.9;
  var needH = L.bd * Math.sin(CAM_ELEV) + 2.8 * Math.cos(CAM_ELEV) + uiTop + 1.2;
  camDist = Math.max((needW / 2) / (t * asp), (needH / 2) / t);
  TARGET.set(0, 0.6, -(uiTop * 0.5) / Math.sin(CAM_ELEV));
  camera.updateProjectionMatrix();
  placeCamera();
  return L;
}

/* ---------- 燈光與環境反射（只在啟動時算一次） ---------- */
scene.add(new THREE.HemisphereLight(0xfff4e2, 0xa9b6c8, 0.38));
var key = new THREE.DirectionalLight(0xffffff, 0.78); key.position.set(4, 8, 6); scene.add(key);
var rimL = new THREE.DirectionalLight(0xcfe2ff, 0.38); rimL.position.set(-6, 3, -4); scene.add(rimL);

var envRT = null;
(function makeEnv() {
  try {
    var es = new THREE.Scene();
    var sg = new THREE.SphereGeometry(30, 24, 14);
    var cols = [], p = sg.attributes.position;
    for (var i = 0; i < p.count; i++) {
      var yy = p.getY(i) / 30;
      var c = yy > 0 ? new THREE.Color(0.78, 0.86, 1.0).lerp(new THREE.Color(1.0, 0.97, 0.9), 1 - yy)
                     : new THREE.Color(1.0, 0.97, 0.9).lerp(new THREE.Color(0.45, 0.36, 0.3), -yy);
      cols.push(c.r * 0.55, c.g * 0.55, c.b * 0.55);
    }
    sg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    es.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));
    function panel(w, h, c, x, y, z) {
      var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c[0], c[1], c[2]), side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m);
    }
    panel(11, 7, [3.0, 2.9, 2.7], 7, 9, 12);      // 主柔光箱
    panel(3, 9, [1.8, 2.0, 2.4], -13, 5, -4);      // 冷色背光條
    panel(6, 2.4, [2.0, 1.8, 1.5], 0, 14, -2);     // 頂光
    var pm = new THREE.PMREMGenerator(renderer);
    envRT = pm.fromScene(es, 0.03);
    pm.dispose();
    es.traverse(function (o) { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    scene.environment = envRT.texture;
  } catch (e) { envRT = null; }
})();

/* ---------- 讓材質邊緣有「透光」感的小補丁（假的次表面散射） ---------- */
function patchRim(mat, keyName, rgb, power, strength) {
  mat.customProgramCacheKey = function () { return keyName; };
  mat.onBeforeCompile = function (sh) {
    sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>',
      '#include <emissivemap_fragment>\n' +
      'float rimF = pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0), ' + power.toFixed(2) + ');\n' +
      'totalEmissiveRadiance += vec3(' + rgb.map(function (n) { return n.toFixed(3); }).join(',') + ') * rimF * ' + strength.toFixed(3) + ';');
  };
}

/* ---------- 布丁輪廓（旋轉體的剖面） ---------- */
function buildProfile() {
  var P = [], FB = 0.3, FT = 0.3, i, a, s;
  for (i = 0; i <= 3; i++) P.push([(RB - FB) * i / 3, 0]);
  for (i = 1; i <= 6; i++) { a = -Math.PI / 2 + (Math.PI / 2) * (i / 6); P.push([RB - FB + Math.cos(a) * FB, FB + Math.sin(a) * FB]); }
  var y0 = FB, y1 = H - FT;
  for (i = 1; i <= 16; i++) { s = i / 17; P.push([RB + (RT - RB) * s + 0.04 * Math.sin(Math.PI * s), y0 + (y1 - y0) * s]); }
  var iFillet = P.length;
  for (i = 0; i <= 10; i++) { a = (Math.PI / 2) * (i / 10); P.push([RT - FT + Math.cos(a) * FT, H - FT + Math.sin(a) * FT]); }
  var rc = RT - FT;
  for (i = 1; i <= 10; i++) { var r = rc * (1 - i / 10); P.push([r, H + 0.05 * (1 - (r / rc) * (r / rc))]); }
  for (var k = 0; k < 2; k++) {
    var Q = P.map(function (p) { return p.slice(); });
    for (i = 1; i < P.length - 1; i++) {
      Q[i][0] = (P[i - 1][0] + 2 * P[i][0] + P[i + 1][0]) / 4;
      Q[i][1] = (P[i - 1][1] + 2 * P[i][1] + P[i + 1][1]) / 4;
    }
    for (i = 1; i < P.length - 1; i++) P[i] = Q[i];
  }
  return { P: P, iFillet: iFillet };
}
var PROF = buildProfile();

function radiusAtY(y) {
  var P = PROF.P;
  for (var i = 10; i < PROF.iFillet; i++) {
    if (P[i][1] >= y) { var f = (y - P[i - 1][1]) / (P[i][1] - P[i - 1][1]); return lerp(P[i - 1][0], P[i][0], f); }
  }
  return RT;
}

/* ---------- 網格幾何：自己算法線，沒有接縫 ---------- */
function makeGrid(nu, nv, fill) {
  var W = nu + 1, count = W * nv;
  var pos = new Float32Array(count * 3), nor = new Float32Array(count * 3);
  fill(pos);
  var idx = [];
  for (var j = 0; j < nv - 1; j++) {
    for (var i = 0; i < nu; i++) {
      var a = j * W + i, b = a + 1, c = a + W, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3).setUsage(THREE.DynamicDrawUsage));
  g.setIndex(idx);
  return g;
}

function gridNormals(P, N, nu, nv, poles) {
  var W = nu + 1, i, j;
  for (j = 0; j < nv; j++) {
    var jm = j > 0 ? j - 1 : 0, jp = j < nv - 1 ? j + 1 : nv - 1;
    for (i = 0; i < nu; i++) {
      var im = (i - 1 + nu) % nu, ip = (i + 1) % nu;
      var a0 = (j * W + im) * 3, a1 = (j * W + ip) * 3, b0 = (jm * W + i) * 3, b1 = (jp * W + i) * 3;
      var ax = P[a1] - P[a0], ay = P[a1 + 1] - P[a0 + 1], az = P[a1 + 2] - P[a0 + 2];
      var bx = P[b1] - P[b0], by = P[b1 + 1] - P[b0 + 1], bz = P[b1 + 2] - P[b0 + 2];
      var nx = by * az - bz * ay, ny = bz * ax - bx * az, nz = bx * ay - by * ax;
      var l = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      var o = (j * W + i) * 3;
      N[o] = nx / l; N[o + 1] = ny / l; N[o + 2] = nz / l;
    }
    var o0 = (j * W) * 3, o1 = (j * W + nu) * 3;
    N[o1] = N[o0]; N[o1 + 1] = N[o0 + 1]; N[o1 + 2] = N[o0 + 2];
  }
  for (var q = 0; q < poles.length; q++) {
    var pj = poles[q], nj = pj === 0 ? 1 : nv - 2, sx = 0, sy = 0, sz = 0;
    for (i = 0; i < nu; i++) { var t = (nj * W + i) * 3; sx += N[t]; sy += N[t + 1]; sz += N[t + 2]; }
    var sl = Math.sqrt(sx * sx + sy * sy + sz * sz) || 1;
    for (i = 0; i <= nu; i++) { var u = (pj * W + i) * 3; N[u] = sx / sl; N[u + 1] = sy / sl; N[u + 2] = sz / sl; }
  }
}

/* ---------- 形變的權重：只算一次，所有布丁共用 ---------- */
function makeTemplate(geo, nu, nv, poles) {
  var pos = geo.attributes.position.array, count = pos.length / 3;
  var T = {
    geo: geo, base: new Float32Array(pos), count: count, nu: nu, nv: nv, poles: poles,
    hp: new Float32Array(count), h2: new Float32Array(count), sp: new Float32Array(count),
    w: new Float32Array(count), dw: new Float32Array(count)
  };
  for (var k = 0; k < count; k++) {
    var hc = clamp(T.base[k * 3 + 1] / H, 0, 1);
    T.hp[k] = Math.pow(hc, 1.35);
    T.h2[k] = hc * hc;
    T.sp[k] = Math.sin(Math.PI * hc);
    T.w[k] = 0.3 + 0.7 * Math.sin(Math.PI * Math.pow(hc, 0.8));
    var q = clamp((hc - 0.55) / 0.45, 0, 1);
    T.dw[k] = q * q * (3 - 2 * q);
  }
  gridNormals(geo.attributes.position.array, geo.attributes.normal.array, nu, nv, poles);
  return T;
}
function cloneDeformable(T) {
  var g = T.geo.clone();
  return {
    geo: g, pos: g.attributes.position.array, nor: g.attributes.normal.array,
    base: T.base, hp: T.hp, h2: T.h2, sp: T.sp, w: T.w, dw: T.dw, count: T.count, nu: T.nu, nv: T.nv, poles: T.poles
  };
}

/* ---------- 布丁本體與焦糖的幾何模板 ---------- */
var nvBody = PROF.P.length;
var bodyGeoT = makeGrid(NU, nvBody, function (pos) {
  var W = NU + 1;
  for (var j = 0; j < nvBody; j++) for (var i = 0; i <= NU; i++) {
    var th = (i % NU) / NU * Math.PI * 2, r = PROF.P[j][0], y = PROF.P[j][1], o = (j * W + i) * 3;
    pos[o] = r * Math.cos(th); pos[o + 1] = y; pos[o + 2] = r * Math.sin(th);
  }
});
(function paintBody() {
  var p = bodyGeoT.attributes.position.array, n = p.length / 3, col = new Float32Array(n * 3);
  var cA = lin('#f0a91a'), cB = lin('#fbc43f'), cC = lin('#ffdc7c'), c = new THREE.Color();
  for (var k = 0; k < n; k++) {
    var h = clamp(p[k * 3 + 1] / H, 0, 1);
    if (h < 0.5) c.copy(cA).lerp(cB, h / 0.5); else c.copy(cB).lerp(cC, (h - 0.5) / 0.5);
    col[k * 3] = c.r; col[k * 3 + 1] = c.g; col[k * 3 + 2] = c.b;
  }
  bodyGeoT.setAttribute('color', new THREE.BufferAttribute(col, 3));
})();
var bodyT = makeTemplate(bodyGeoT, NU, nvBody, [0, nvBody - 1]);

var CP = PROF.P.slice().reverse();                 // 從頂部中心往下
var cum = [0], cn = [], ci;
for (ci = 1; ci < CP.length; ci++) cum.push(cum[ci - 1] + Math.hypot(CP[ci][0] - CP[ci - 1][0], CP[ci][1] - CP[ci - 1][1]));
for (ci = 0; ci < CP.length; ci++) {
  var pa = CP[Math.max(ci - 1, 0)], pb = CP[Math.min(ci + 1, CP.length - 1)];
  var tr = pb[0] - pa[0], ty = pb[1] - pa[1], tl = Math.hypot(tr, ty) || 1;
  cn.push([-ty / tl, tr / tl]);
}
var L_TOP = cum[CP.length - 1 - PROF.iFillet];
var CARAMEL_TOP_T = 0.045;
function posAt(s) {
  s = clamp(s, 0, cum[cum.length - 1]);
  var i = 0;
  while (i < cum.length - 2 && cum[i + 1] < s) i++;
  var f = (s - cum[i]) / ((cum[i + 1] - cum[i]) || 1);
  var nr = lerp(cn[i][0], cn[i + 1][0], f), ny = lerp(cn[i][1], cn[i + 1][1], f), nl = Math.hypot(nr, ny) || 1;
  return { r: lerp(CP[i][0], CP[i + 1][0], f), y: lerp(CP[i][1], CP[i + 1][1], f), nr: nr / nl, ny: ny / nl };
}
function angDiff(a, b) { return Math.atan2(Math.sin(a - b), Math.cos(a - b)); }
function dripLen(th) {   // th = π/2 是正對鏡頭的臉，要保持較短
  var L = 0.11 + 0.05 * Math.sin(2 * th + 0.8) + 0.035 * Math.sin(5 * th + 2.1);
  function lobe(c, w, hh) { var d = angDiff(th, c); return hh * Math.exp(-d * d / (w * w)); }
  return L + lobe(0.15, 0.2, 0.55) + lobe(2.55, 0.17, 0.4) + lobe(-1.25, 0.2, 0.6) + lobe(4.0, 0.16, 0.34) + lobe(-0.55, 0.12, 0.25);
}
var NVC = 28;
var caramelGeoT = makeGrid(NU, NVC, function (pos) {
  var W = NU + 1;
  for (var j = 0; j < NVC; j++) for (var i = 0; i <= NU; i++) {
    var th = (i % NU) / NU * Math.PI * 2, L = dripLen(th), S = L_TOP + L, tt = 1 - j / (NVC - 1), s = tt * S;
    var p = posAt(s), thk;
    if (s <= L_TOP) thk = lerp(0.06, CARAMEL_TOP_T, s / L_TOP);
    else { var u = clamp((s - L_TOP) / L, 0, 1); thk = 0.05 * Math.sqrt(Math.max(0, 1 - u * u * u)) + 0.004; }
    var rr = p.r + p.nr * thk, o = (j * W + i) * 3;
    pos[o] = rr * Math.cos(th); pos[o + 1] = p.y + p.ny * thk; pos[o + 2] = rr * Math.sin(th);
  }
});
var caramelT = makeTemplate(caramelGeoT, NU, NVC, [NVC - 1]);

/* ---------- 共用材質（裁切平面讓布丁從洞裡「長」出來） ---------- */
var CLIP = [new THREE.Plane(new THREE.Vector3(0, 1, 0), 0)];
var bodyMatT = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, vertexColors: true, roughness: 0.42, metalness: 0,
  clearcoat: 0.5, clearcoatRoughness: 0.28, envMapIntensity: 0.55, clippingPlanes: CLIP
});
var caramelMatT = new THREE.MeshPhysicalMaterial({
  color: lin('#8c3604'), roughness: 0.12, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05,
  envMapIntensity: 1.1, emissive: lin('#3d1500'), transparent: true, opacity: 0.86, clippingPlanes: CLIP
});
var faceMat = new THREE.MeshStandardMaterial({ color: lin('#3a1c10'), roughness: 0.28, envMapIntensity: 1, clippingPlanes: CLIP });
var mouthInMat = new THREE.MeshStandardMaterial({ color: lin('#8c2b2b'), roughness: 0.4, clippingPlanes: CLIP });
var hiMat = new THREE.MeshBasicMaterial({ color: 0xffffff, clippingPlanes: CLIP });
var cheekMat = new THREE.MeshBasicMaterial({ color: lin('#ff7f9d'), transparent: true, opacity: 0.55, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, clippingPlanes: CLIP });

    var c = e.c, st = !e.ok ? ['bad', '答錯'] : e.hint ? ['hint', '看了提示才對'] : ['ok', '一次就對'];
    var ri = el('div', 'ri ' + st[0]), hd = el('div', 'ri-h');
    hd.appendChild(el('span', 'no', String(e.n))); hd.appendChild(el('span', 'tag', c.kind));
    hd.appendChild(el('span', '', c.id.replace(/學測-0?(\d+)$/, ' 學測 第 $1 題'))); hd.appendChild(el('span', 'st', st[1]));
    ri.appendChild(hd);
    var ch = el('p', 'chunk', c.chunk); ch.appendChild(el('span', '', c.zh)); ri.appendChild(ch);
    var i = c.sentence.indexOf('___'), en = el('p', 'en');
    en.appendChild(document.createTextNode(c.sentence.slice(0, i))); en.appendChild(el('b', '', c.answer)); en.appendChild(document.createTextNode(c.sentence.slice(i + 3)));
    ri.appendChild(en);
    if (!e.ok) { var pk = el('p', 'pick', '你敲的是 '); pk.appendChild(el('s', '', e.pick)); ri.appendChild(pk); }
    list.appendChild(ri);
  });
}
$('#btn-rev').addEventListener('click', function () {
  buildReview(); summaryEl.hidden = true; $('#review').hidden = false; $('#rev-list').scrollTop = 0;
  try { $('#rev-back').focus({ preventScroll: true }); } catch (e) {}
});
$('#rev-back').addEventListener('click', function () { $('#review').hidden = true; summaryEl.hidden = false; });
$('#rev-again').addEventListener('click', function () { $('#review').hidden = true; ensureAudio(); startRound(); });
btnNext.addEventListener('click', nextQuestion);

(function seed() {
  var order = puddings.filter(function (P) { return P.used; }).sort(function () { return Math.random() - 0.5; });
  for (var i = 0; i < Math.min(3, order.length); i++) {
    var P = order[i]; P.state = 'up'; P.timer = rnd(2.4, 3.8) + i * 0.6; P.riseY = 0; P.riseTarget = 0; P.alive = true; P.group.visible = true; P.group.position.y = 0; Game.last = P.idx;
  }
  Game.next = 0.5;
})();
puddings.forEach(function (P) { if (P.used) { computeEffective(P, 0); updateDeformable(P, P.bodyD); updateDeformable(P, P.caramelD); updateFace(P, 0); } });
raf = requestAnimationFrame(frame);
window.__pudding = {
  puddings: puddings, game: Game, mallet: mallet, M: M, scene: scene, camera: camera, renderer: renderer,
  get layout() { return layout; },
  get seg() { return seg ? seg.tag : null; },

  pick: pickAt,

};
})();
