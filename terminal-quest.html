<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminal Quest 🦆</title><style>
*{box-sizing:border-box}body{margin:0;font:17px/1.7 system-ui,'Noto Sans TC',sans-serif;color:#35294c;background:radial-gradient(#e9dcff 1.5px,transparent 1.5px) 0 0/22px 22px,#f9f5ff}main{max-width:820px;margin:auto;padding:24px 15px 65px}header{display:flex;justify-content:space-between;align-items:center;font-weight:900;color:#7550b7}#xp{background:white;padding:8px 15px;border-radius:30px;border:2px solid #e2d4fc}.card{background:#fff;border:2px solid #e5d8fb;border-radius:27px;padding:clamp(18px,5vw,35px);margin-top:23px;box-shadow:0 9px #e9dff7}h1{font-size:clamp(28px,5vw,41px);line-height:1.25;margin:12px 0}h2{font-size:21px}.small{font-size:13px;color:#8d7a9d}.progress{height:12px;background:#eee7fb;border-radius:20px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#f48bb7,#8256d6);border-radius:20px}.scene{position:relative;margin:22px 0;background:linear-gradient(130deg,#e8dbff,#f8d9ef 75%,#cff2e6);border-radius:23px;height:205px;display:flex;justify-content:center;align-items:center;overflow:hidden}.scene:before{content:'✦ ✧ ✦';position:absolute;top:16px;left:30px;color:white;font-size:28px}.duck{width:190px;filter:drop-shadow(0 10px #bba7db66);animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px) rotate(2deg)}}.bubble{position:absolute;right:14px;top:15px;background:white;border:2px solid #d5c1f8;border-radius:20px;padding:8px 12px;font-size:13px;font-weight:800}.story{background:#fff6d7;border-left:5px solid #efbf53;border-radius:14px;padding:16px 20px}.terminal{background:#1e2333;color:#dce3f4;border-radius:15px;padding:19px;white-space:pre-wrap;overflow:auto;font:14px/1.6 Consolas,monospace;margin:18px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}button,input{font:inherit}button{cursor:pointer}.opt{background:white;border:2px solid #e3d4fa;border-radius:16px;padding:14px;text-align:left;color:#48345e;font-weight:800}.opt small{display:block;font-weight:400;color:# ['你在哪裡？','pwd','鴨子在電腦裡迷路了。先確認自己站在哪個資料夾！','PS C:\\Projects\\duck-index> █','要顯示目前位置，你會輸入？',[['ls','列出內容'],['pwd','顯示路徑'],['cd','切換資料夾'],['mkdir','建立資料夾']],'pwd','pwd 是 PowerShell 中 Get-Location 的別名，能確認自己在哪裡。'],
['鴨子失蹤案','ls','Opus 說專案做完了。鴨子決定先看看資料夾裡有什麼。','PS C:\\Projects\\duck-index> █','要列出目前資料夾的內容？',[['ls','列出檔案和資料夾'],['pwd','顯示位置'],['cd ..','返回上一層'],['mkdir ducks','新建資料夾']],'ls','ls 是 Get-ChildItem 的別名，只查看內容，不會修改檔案。','src/\ndata/\nREADME.md\npackage.json'],

let s={level:0,xp:0,completed:[]};try{const a=JSON.parse(localStorage.getItem('terminal-quest-v1'));if(a&&a.level>=0&&a.level<=8)s=a}catch{}let chosen='',passed=false;const $=id=>document.getElementById(id),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem('terminal-quest-v1',JSON.stringify(s))}catch{}};
function render(){ $('xp').textContent='⭐ '+s.xp+' XP';if(s.level===8){$('app').innerHTML=`<span class="badge">ALL MISSIONS CLEARED</span><h1>🏆 鴨子偵探畢業！</h1><div class="scene">${duck}<div class="bubble">🎓 畢業快樂！</div></div><div class="end"><h2>你學會八個核心技能</h2><p>pwd → ls → cd src → cd .. → Get-Content → git status → git diff → AI 施工驗收。</p><p><strong>最重要的一課：AI 說修好了，是線索，不是證據。</strong></p><p>⭐ ${s.xp} XP</p></div><button class="btn" id="restart">重新冒險 ↻</button>`;$('restart').onclick=()=>{if(confirm('重新開始八關嗎？')){s={level:0,xp:0,completed:[]};save();render()}};return}const l=L[s.level];chosen='';passed=false;$('app').innerHTML=`<div class="small" style="font-weight:900;color:#8254cb">LEVEL ${s.level+1} / 8 · ${esc(l[1])}</div><div class="progress"><div style="width:${(s.level+1)/8*100}%"></div></div><h1>${esc(l[0])} 🦆</h1><div class="scene">${duck}<div class="bubble">✨ ${esc(l[1])}</div></div><div class="story">${esc(l[2])}</div><div class="terminal">${esc(l[3])}</div><h2>🎯 ${esc(l[4])}</h2>${l[5]?`<div class="options">${l[5].map((x,i)=>`<button class="opt" data-i="${i}">${esc(x[0])}<small>${esc(x[1])}</small></button>`).join('')}</div>`:`<input id="input" autocomplete="off" spellcheck="false" placeholder="PS> 輸入指令……">`}<div id="feedback"></div><button class="btn" id="check" disabled>執行指令 ▶</button><button class="btn alt" id="hint">提示 💡</button><p class="small">這是模擬器，不會真的執行指令。</p>`;if(l[5])document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');chosen=l[5][+b.dataset.i][0];$('check').disabled=false});else{$('input').oninput=e=>{chosen=e.target.value;$('check').disabled=!chosen.trim()};$('input').onkeydown=e=>{if(e.key==='Enter'&&!$('check').disabled)check()}}$('check').onclick=check;$('hint').onclick=()=>{$('feedback').innerHTML=`<div class="feedback no">💡 ${l[5]?'仔細看看選項的說明！':'今天的指令是 '+esc(l[6])}</div>`}};
function check(){let l=L[s.level],v=chosen.trim().toLowerCase().replace(/\s+/g,' '),good=v===l[6].toLowerCase()||(!l[5]&&({2:['set-location src','cd .\\src'],3:['cd..','set-location ..'],4:['cat readme.md','gc readme.md','type readme.md'],5:['git status -s','git status --short'],6:['git diff -- src/index.js','git diff src/index.js']}[s.level]||[]).includes(v));if(!good){$('feedback').innerHTML='<div class="feedback no">🐣 差一點！再試一次。鴨子還在等你。</div>';return}if(!passed){s.xp+=100;passed=true;s.completed.push(s.level);save()}$('xp').textContent='⭐ '+s.xp+' XP';document.querySelectorAll('.opt,#input,#check,#hint').forEach(x=>x.disabled=true);$('feedback').innerHTML=`<div class="feedback"><span class="badge">SUCCESS · +100 XP</span><h2>🎉 鴨子找到線索了！</h2>${esc(l[7])}${l[8]?`<div class="terminal">${esc(l[8])}</div>`:''}</div><button class="btn" id="next">${s.level===7?'領取畢業證書 🏆':'下一關 →'}</button>`;$('next').onclick=()=>{s.level++;save();render();scrollTo({top:0,behavior:'smooth'})}}render();
