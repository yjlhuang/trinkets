<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Road Not Taken</title>
<style>
:root{--ink:#2f2418;--paper:#fbf3de}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1512}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  font-family:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,'Times New Roman',serif}
#stage{position:fixed;inset:0;overflow:hidden}
#stage.pick{cursor:pointer}
.world{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;visibility:hidden}
#leaves,#grain,#vignette,#veil{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#vignette{background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 58%,rgba(46,28,10,.34) 100%)}
#grain{opacity:.09;mix-blend-mode:multiply;background-size:200px 200px}
#veil{background:#0c0909;opacity:0}
#text{position:absolute;inset:0;pointer-events:none}
.tx{position:absolute;left:0;right:0;padding:0 max(16px,7vw);text-align:center;isolation:isolate;transition:opacity .6s ease}
.tx::before{content:'';position:absolute;left:8%;right:8%;top:-1.6em;bottom:-1.6em;z-index:-1;opacity:var(--w,0);
  background:radial-gradient(ellipse at 50% 50%,rgba(252,244,224,.78) 0%,rgba(252,244,224,.5) 40%,rgba(252,244,224,0) 72%)}
.tx.dark::before{background:radial-gradient(ellipse at 50% 50%,rgba(14,9,11,.62) 0%,rgba(14,9,11,.35) 45%,rgba(14,9,11,0) 72%)}
.tx.out{opacity:0}
.tx.top{top:max(5.5vh,20px)}
.tx.center{top:50%;transform:translateY(-50%)}
.tx.left{top:13vh;right:auto;width:min(66vw,1100px);text-align:left;padding-left:6vw}
.tx.left::before{left:-10%;right:-10%}
.line{display:block;font-size:clamp(20px,2.3vw + .9vh,48px);line-height:1.34;color:var(--ink);opacity:0;
  text-shadow:0 0 14px rgba(255,248,228,.95),0 0 5px rgba(255,248,228,.9),0 0 1px rgba(255,248,228,1);
  text-wrap:balance;will-change:opacity,transform}
.line+.line{margin-top:.3em}
.dark .line{color:#f5e8cb;text-shadow:0 0 14px rgba(12,8,10,.95),0 0 4px rgba(12,8,10,.9)}
.line.title{font-size:clamp(34px,5.6vw + 1vh,96px);letter-spacing:.01em;line-height:1.1}
.line.by{font-size:clamp(15px,1.3vw + .6vh,26px);font-style:italic;margin-top:.6em}
.line.begin{font-size:clamp(15px,1.1vw + .6vh,22px);margin-top:2.2em;letter-spacing:.08em;color:#4a3a28}
.linkish{pointer-events:auto;cursor:pointer;background:none;border:0;padding:.35em .2em;margin:0;font:inherit;color:inherit;
  font-style:italic;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:.25em;letter-spacing:.04em}
.linkish:focus-visible{outline:2px solid rgba(80,60,30,.5);outline-offset:3px;border-radius:4px}
#ap,#snd{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(47,36,24,.28);background:rgba(251,243,222,.6);color:var(--ink);display:grid;place-items:center;
  opacity:0;pointer-events:none;transition:opacity .6s;cursor:pointer;padding:0}
#snd{right:calc(max(12px,env(safe-area-inset-right)) + 52px)}
#ap.show,#snd.show{opacity:.78;pointer-events:auto}
#ap svg,#snd svg{width:16px;height:16px}
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 8s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(-50px)}50%{transform:translateX(50px)}}
.drift{animation:drift 28s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.flutter{transform-box:fill-box;transform-origin:10% 0%;animation:flutter 1.7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
.breathe{animation:breathe 9s ease-in-out infinite}
@media (max-aspect-ratio:9/10){
  .line{font-size:clamp(19px,5.2vw,34px);line-height:1.25}
  .line+.line{margin-top:.55em}
  .line.title{font-size:clamp(34px,10vw,64px)}
  .line.by{font-size:clamp(15px,4vw,22px)}
  .line.begin{font-size:clamp(15px,3.9vw,20px)}
  .tx.left{top:max(5.5vh,20px);right:0;width:auto;text-align:center;padding:0 max(16px,7vw)}
}
@media (prefers-reduced-motion:reduce){.sway,.drift,.flutter,.breathe{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <svg class="world" id="wA" aria-hidden="true"></svg>
  <svg class="world" id="wC" aria-hidden="true"></svg>
  <svg class="world" id="wD" aria-hidden="true"></svg>
  <svg class="world" id="wE" aria-hidden="true"></svg>
  <canvas id="leaves"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="veil"></div>
  <div id="text" aria-live="polite"></div>
</div>
<button id="ap" type="button" aria-label="autoplay"></button>
<button id="snd" type="button" aria-label="sound"></button>
<script>
(function(){
'use strict';

/* The Road Not Taken — Robert Frost, Mountain Interval (1916). Public domain.
   Every line shown on screen comes from this one constant. */
const POEM=[
"Two roads diverged in a yellow wood,",
"And sorry I could not travel both",
"And be one traveler, long I stood",
"And looked down one as far as I could",
"To where it bent in the undergrowth;",
"Then took the other, as just as fair,",
"And having perhaps the better claim,",
"Because it was grassy and wanted wear;",
"Though as for that the passing there",
"Had worn them really about the same,",
"And both that morning equally lay",
"In leaves no step had trodden black.",
"Oh, I kept the first for another day!",
"Yet knowing how way leads on to way,",
"I doubted if I should ever come back.",
"I shall be telling this with a sigh",
"Somewhere ages and ages hence:",
"Two roads diverged in a wood, and I—",
"I took the one less travelled by,",
"And that has made all the difference."];

const NS='http://www.w3.org/2000/svg';
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- helpers ---------- */
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ramp=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const ease=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function bump(t,a,b,c){if(t<a||t>c)return 0;return t<b?smooth((t-a)/(b-a)):1-smooth((t-b)/(c-b));}
function h2r(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){const A=h2r(a),B=h2r(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
const f1=v=>(Math.round(v*10)/10);
function lg(defs,id,stops,x1,y1,x2,y2,units){const g=el('linearGradient',{id:id,x1:x1,y1:y1,x2:x2,y2:y2},defs);if(units)g.setAttribute('gradientUnits',units);
  stops.forEach(s=>el('stop',{offset:s[0],'stop-color':s[1],'stop-opacity':s[2]==null?1:s[2]},g));return g;}
function rg(defs,id,stops){const g=el('radialGradient',{id:id},defs);stops.forEach(s=>el('stop',{offset:s[0],'stop-color':s[1],'stop-opacity':s[2]==null?1:s[2]},g));return g;}
function bez(p,u){const v=1-u;return{x:v*v*v*p[0][0]+3*v*v*u*p[1][0]+3*v*u*u*p[2][0]+u*u*u*p[3][0],y:v*v*v*p[0][1]+3*v*v*u*p[1][1]+3*v*u*u*p[2][1]+u*u*u*p[3][1]};}
function bezD(p,u){const v=1-u;return{x:3*v*v*(p[1][0]-p[0][0])+6*v*u*(p[2][0]-p[1][0])+3*u*u*(p[3][0]-p[2][0]),y:3*v*v*(p[1][1]-p[0][1])+6*v*u*(p[2][1]-p[1][1])+3*u*u*(p[3][1]-p[2][1])};}
function ribbon(c,wf,u0,u1,off,n){u0=u0||0;u1=u1==null?1:u1;off=off||0;n=n||44;const a=[],b=[];
  for(let i=0;i<=n;i++){const u=u0+(u1-u0)*i/n,p=bez(c,u),d=bezD(c,u),l=Math.hypot(d.x,d.y)||1,nx=-d.y/l,ny=d.x/l,w=wf(p.y),cx=p.x+nx*off*w,cy=p.y+ny*off*w;
    a.push(f1(cx+nx*w/2)+' '+f1(cy+ny*w/2));b.push(f1(cx-nx*w/2)+' '+f1(cy-ny*w/2));}
  return'M'+a.join('L')+'L'+b.reverse().join('L')+'Z';}
function catSeg(pts,i){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  return' C'+f1(p1[0]+(p2[0]-p0[0])/6)+' '+f1(p1[1]+(p2[1]-p0[1])/6)+' '+f1(p2[0]-(p3[0]-p1[0])/6)+' '+f1(p2[1]-(p3[1]-p1[1])/6)+' '+p2[0]+' '+p2[1];}
function catmull(pts){let d='M'+pts[0][0]+' '+pts[0][1];for(let i=0;i<pts.length-1;i++)d+=catSeg(pts,i);return d;}
const LEAF='M0 -1C.56 -.55 .5 .45 0 1C-.5 .45 -.56 -.55 0 -1Z';
function leafAt(g,x,y,sz,rot,fill,squash,op){const a={d:LEAF,fill:fill,transform:'translate('+f1(x)+' '+f1(y)+')'+(squash?' scale(1 '+squash+')':'')+' rotate('+Math.round(rot)+') scale('+f1(sz*10)/10+')'};if(op!=null)a.opacity=op;return el('path',a,g);}

/* ---------- palettes ---------- */
const PAL={skyTop:'#f4e2b4',skyBot:'#fbf1d6',haze:'#eadcb4',far0:'#e3cf9a',far1:'#d8bd7c',
  canopy:['#f0bf3e','#e8a92c','#f5d060','#d98b25','#eec04f','#e4b347','#cf7f22'],
  trunk:'#4c3a31',groundTop:'#c8a557',groundBot:'#86632a',road:'#dcc38e',roadEdge:'#a9874f',
  leaf:['#f2c94c','#e8a93a','#f5d86b','#d9892a','#c96f2a','#eab54a'],
  bush:['#8e7a34','#a2863a','#7b6a2e','#b0772f','#968238'],tuft:'#76863a',wear:'#9a7a47',mist:'#fff7e2',glow:'#fff3cc',shaft:'#fff6dc',
  fig:{coat:'#4b5f64',coatDark:'#3b4b50',pants:'#3a302c',boot:'#2b221e',bag:'#7a5534',scarf:'#9c3f2e',hair:'#5a3e2e',skin:'#d9a883',hat:'#3b2f2a',band:'#6f4a2e'}};
function sepia(h){const r=h2r(h),L=(r[0]*.3+r[1]*.59+r[2]*.11)/255;return mix('#3a2a1d','#f0e0c0',Math.pow(L,1.15));}
function sepiaPal(p){const o={};for(const k in p){const v=p[k];if(typeof v==='string')o[k]=sepia(v);else if(Array.isArray(v))o[k]=v.map(sepia);else{o[k]={};for(const j in v)o[k][j]=sepia(v[j]);}}return o;}

/* ---------- figure ---------- */
function makeFigure(parent,c){
  const g=el('g',null,parent);
  const shadow=el('ellipse',{cx:0,cy:0,rx:21,ry:4.5,fill:'#2a1c10',opacity:.26},g);
  const legL=el('g',null,g);el('path',{d:'M-9 -37L-2 -37L-2.6 -3L-10 -3Z',fill:c.pants},legL);el('path',{d:'M-11.5 -4.5h10.5v4.5h-11.5z',fill:c.boot},legL);
  const legR=el('g',null,g);el('path',{d:'M2 -37L9 -37L10 -3L2.6 -3Z',fill:c.pants},legR);el('path',{d:'M1 -4.5h10.5v4.5h-10.5z',fill:c.boot},legR);
  const body=el('g',null,g);
  el('path',{d:'M-11 -74C-21 -66 -22.5 -54 -21.5 -44L-16.5 -44C-16.5 -54 -15 -64 -10 -70Z',fill:c.coatDark},body);
  el('path',{d:'M11 -74C21 -66 22.5 -54 21.5 -44L16.5 -44C16.5 -54 15 -64 10 -70Z',fill:c.coatDark},body);
  el('path',{d:'M-15 -80C-18 -60 -21 -41 -22 -27L22 -27C21 -41 18 -60 15 -80C8 -84.5 -8 -84.5 -15 -80Z',fill:c.coat},body);
  el('path',{d:'M0 -80L0 -28',stroke:c.coatDark,'stroke-width':1.3,fill:'none',opacity:.7},body);
  el('path',{d:'M-22 -27L22 -27L21.4 -31L-21.4 -31Z',fill:c.coatDark,opacity:.55},body);
  el('path',{d:'M-13 -79L17 -45',stroke:c.bag,'stroke-width':2.3},body);
  el('rect',{x:12.5,y:-51,width:12,height:13,rx:2.5,fill:c.bag},body);
  el('path',{d:'M-9.5 -84Q0 -79.5 9.5 -84L9.5 -78.5Q0 -75 -9.5 -78.5Z',fill:c.scarf},body);
  const tw=el('g',null,body);el('path',{class:'flutter',d:'M4 -80q4 9 2 19l5.5 -1.5q2 -9 -2.5 -18.5z',fill:c.scarf},tw);
  const head=el('g',null,body);
  el('ellipse',{cx:-9.2,cy:-90,rx:1.8,ry:2.8,fill:c.skin},head);el('ellipse',{cx:9.2,cy:-90,rx:1.8,ry:2.8,fill:c.skin},head);
  el('rect',{x:-4,y:-86,width:8,height:4,fill:c.skin},head);
  el('circle',{cx:0,cy:-91.5,r:9.5,fill:c.hair},head);
  el('path',{d:'M-8 -88Q0 -84 8 -88',stroke:mix(c.hair,'#000000',.35),'stroke-width':1.2,fill:'none'},head);
  const face=el('g',{opacity:0},head);
  el('path',{d:'M5.5 -96Q11.2 -93 10.8 -88.5Q10.2 -86 6.5 -85Z',fill:c.skin},face);
  el('ellipse',{cx:-1,cy:-90,rx:2,ry:2.8,fill:c.skin,opacity:.9},face);
  el('ellipse',{cx:0,cy:-97.5,rx:15.5,ry:3.7,fill:c.hat},head);
  el('path',{d:'M-8.2 -97.5Q-8.2 -109 0 -109Q8.2 -109 8.2 -97.5Z',fill:c.hat},head);
  el('path',{d:'M-8.1 -100H8.1',stroke:c.band,'stroke-width':1.7},head);
  return{g:g,legL:legL,legR:legR,body:body,head:head,face:face,shadow:shadow};
}
function poseFigure(f,x,y,s,walk,turn,shadowDx){
  f.g.setAttribute('transform','translate('+f1(x)+' '+f1(y)+') scale('+(Math.round(s*1000)/1000)+')');
  if(walk!=null){const a=Math.sin(walk);f.legL.setAttribute('transform','translate(0 '+f1(-Math.max(0,a)*5)+')');f.legR.setAttribute('transform','translate(0 '+f1(-Math.max(0,-a)*5)+')');
    f.body.setAttribute('transform','translate(0 '+f1(-Math.abs(Math.cos(walk))*1.6)+')');}
  else{f.legL.removeAttribute('transform');f.legR.removeAttribute('transform');f.body.removeAttribute('transform');}
  turn=turn||0;f.face.setAttribute('opacity',Math.round(Math.abs(turn)*100)/100);
  f.face.setAttribute('transform','scale('+(turn<0?-1:1)+' 1)');f.head.setAttribute('transform','translate('+f1(turn*1.6)+' 0)');
  f.shadow.setAttribute('cx',f1(shadowDx||0));
}

/* ======================================================================
   WORLD A — the fork in the yellow wood (eye level)
   ====================================================================== */
const AG={trunk:[[800,1520],[826,1120],[782,820],[800,642]],L:[[800,642],[722,606],[626,508],[430,462]]};
AG.R=AG.L.map(p=>[1600-p[0],p[1]]);
const wA=y=>Math.max(8,(y-430)*.72);
const sA=y=>Math.max(.07,(y-430)/210*1.3);
const ROADS=(function(){const s=[];['trunk','L','R'].forEach(k=>{for(let u=0;u<=1.0001;u+=.015){const p=bez(AG[k],u);s.push({x:p.x,y:p.y,w:wA(p.y)});}});return s;})();
function blocksRoad(x,by,tw,h,R){for(const s of ROADS){const dx=Math.abs(s.x-x);
    if(Math.hypot(s.x-x,s.y-by)<s.w/2+tw+6)return true;
    if(s.y<by+4&&s.y>by-h*1.05&&dx<s.w/2+tw)return true;
    if(Math.abs(s.y-(by-h))<R&&dx<R+s.w/2)return true;}return false;}

function drawTree(g,x,by,h,tw,pal,depth,rng,sway,shadow){
  const tg=el('g',null,g),lean=(rng()-.5)*h*.07;
  const tc=mix(pal.trunk,pal.haze,depth*.8);
  if(shadow)el('ellipse',{cx:f1(x),cy:f1(by),rx:f1(tw*2.2),ry:f1(tw*.45),fill:'#2a1c10',opacity:.16},tg);
  el('path',{d:'M'+f1(x-tw/2)+' '+f1(by)+'C'+f1(x-tw*.45)+' '+f1(by-h*.4)+' '+f1(x-tw*.3+lean*.5)+' '+f1(by-h*.72)+' '+f1(x-tw*.2+lean)+' '+f1(by-h*1.02)+
    'L'+f1(x+tw*.2+lean)+' '+f1(by-h*1.02)+'C'+f1(x+tw*.3+lean*.5)+' '+f1(by-h*.72)+' '+f1(x+tw*.45)+' '+f1(by-h*.4)+' '+f1(x+tw/2)+' '+f1(by)+'Z',fill:tc},tg);
  if(h>60){const bx=x+lean*.6,byy=by-h*.62,dir=rng()<.5?-1:1;
    el('path',{d:'M'+f1(bx)+' '+f1(byy)+'Q'+f1(bx+dir*h*.12)+' '+f1(byy-h*.08)+' '+f1(bx+dir*h*.2)+' '+f1(byy-h*.2),stroke:tc,'stroke-width':f1(tw*.35),fill:'none','stroke-linecap':'round'},tg);}
  const cg=el('g',sway?{class:'sway',style:'animation-delay:-'+(rng()*8).toFixed(2)+'s;animation-duration:'+(7+rng()*4).toFixed(1)+'s'}:null,tg);
  const R=h*.34,cx=x+lean,cy=by-h*1.02,n=5+Math.floor(rng()*4);
  const base=pal.canopy[Math.floor(rng()*pal.canopy.length)];
  const dark=mix(mix(base,'#6b4a1c',.32),pal.haze,depth*.7),lite=mix(mix(base,'#fff0c0',.12),pal.haze,depth*.7),mid=mix(base,pal.haze,depth*.7);
  for(let i=0;i<n;i++)el('circle',{cx:f1(cx+(rng()-.5)*R*1.4),cy:f1(cy+(rng()-.2)*R*.8+R*.18),r:f1(R*(.42+rng()*.3)),fill:dark},cg);
  for(let i=0;i<n;i++)el('circle',{cx:f1(cx+(rng()-.55)*R*1.2),cy:f1(cy+(rng()-.6)*R*.8),r:f1(R*(.36+rng()*.28)),fill:rng()<.5?mid:lite},cg);
  return tg;
}

function buildFork(root,pal,opt){
  const id=opt.id,rng=mulberry32(opt.seed||7),live=!!opt.live,refs={};
  const defs=el('defs',null,root);
  lg(defs,id+'sky',[[0,pal.skyTop],[1,pal.skyBot]],0,0,0,1);
  lg(defs,id+'gnd',[[0,pal.groundTop],[.35,mix(pal.groundTop,pal.groundBot,.55)],[1,pal.groundBot]],0,0,0,1);
  lg(defs,id+'shaft',[[0,pal.shaft,0],[.35,pal.shaft,.32],[1,pal.shaft,0]],0,0,0,1);
  rg(defs,id+'mist',[[0,pal.mist,.8],[1,pal.mist,0]]);
  lg(defs,id+'sweep',[[0,pal.glow,0],[.5,pal.glow,.85],[1,pal.glow,0]],0,0,1,0);

  el('rect',{x:-1400,y:-1400,width:4400,height:1900,fill:'url(#'+id+'sky)'},root);
  el('ellipse',{cx:800,cy:430,rx:760,ry:150,fill:'url(#'+id+'mist)'},root);
  [[pal.far0,392,.9],[pal.far1,418,1]].forEach(([col,base,op],k)=>{let d='M-1400 520L-1400 '+base;
    for(let x=-1400;x<=3000;x+=26){const y=base-12*Math.sin(x*.011+k*2)-9*Math.sin(x*.041+k)-rng()*14;d+='Q'+f1(x+13)+' '+f1(y-16-rng()*10)+' '+f1(x+26)+' '+f1(y);}
    el('path',{d:d+'L3000 520Z',fill:col,opacity:op},root);});
  el('rect',{x:-1400,y:438,width:4400,height:2600,fill:'url(#'+id+'gnd)'},root);
  // forest-floor litter
  const lit=el('g',null,root);
  for(let i=0;i<(opt.lite?140:320);i++){const y=440+1500*Math.pow(rng(),1.8),x=-1400+4400*rng(),s=sA(y);

  else if(b.special==='end'){add('The Road Not Taken',3,'title');add('Robert Frost · Mountain Interval, 1916',3.8,'by');
    const btn=document.createElement('button');btn.className='linkish';btn.type='button';btn.textContent='walk again';
    btn.addEventListener('click',e=>{e.stopPropagation();setAuto(false);goto(0);});add(btn,5.6,'begin');}
  else(b.lines||[]).forEach(([i,at])=>add(POEM[i],at));
  textEl.appendChild(tx);}
function updText(t){if(!tx)return;let m=0;tx.querySelectorAll('.line').forEach(s=>{const at=s._at?s._at():+s.dataset.at,o=smooth(ramp(t,at,at+1.2));m=Math.max(m,o);
  s.style.opacity=o.toFixed(3);s.style.transform='translateY('+((1-o)*8).toFixed(1)+'px)';s.style.pointerEvents=o>.5?'':'none';});tx.style.setProperty('--w',m.toFixed(3));}

/* ---------- ambient score: autoplay only, synthesized (no audio files) ----------
   Open stacked fifths (neither major nor minor), never resolving; wind as the ground.
   Nothing marks "with a sigh" — the texture just continues. */
const mtof=m=>440*Math.pow(2,(m-69)/12);
function pinkBuffer(c){const n=Math.floor(c.sampleRate*6),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<n;i++){const w=Math.random()*2-1;b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926;}
  const f=Math.floor(c.sampleRate*.05);for(let i=0;i<f;i++){d[i]*=i/f;d[n-1-i]*=i/f;}return b;}
function makeScore(c,out){
  const master=c.createGain();master.gain.value=0;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=12;comp.ratio.value=3;comp.attack.value=.02;comp.release.value=.4;
  master.connect(comp);comp.connect(out);
  const wf=c.createBiquadFilter();wf.type='lowpass';wf.frequency.value=600;wf.Q.value=.3;
  const wg=c.createGain();wg.gain.value=0;
  const src=c.createBufferSource();src.buffer=pinkBuffer(c);src.loop=true;src.connect(wf);wf.connect(wg);wg.connect(master);src.start();
  const pad=c.createGain();pad.gain.value=1;const pf=c.createBiquadFilter();pf.type='lowpass';pf.frequency.value=1300;pad.connect(pf);pf.connect(master);
  const bells=c.createGain();bells.gain.value=.16;bells.connect(master);
  const dl=c.createDelay(2);dl.delayTime.value=.47;const fb=c.createGain();fb.gain.value=.32;const dlf=c.createBiquadFilter();dlf.type='lowpass';dlf.frequency.value=1600;
  bells.connect(dl);dl.connect(dlf);dlf.connect(fb);fb.connect(dl);const wet=c.createGain();wet.gain.value=.6;dlf.connect(wet);wet.connect(master);
  let voices=[],notes=[];
  return{master:master,
    chord:function(ns,now,level){notes=ns;
      voices.forEach(v=>{v.g.gain.cancelScheduledValues(now);v.g.gain.setValueAtTime(v.g.gain.value,now);v.g.gain.linearRampToValueAtTime(0,now+6);v.o.forEach(o=>o.stop(now+6.2));});
      voices=ns.map((m,i)=>{const g=c.createGain();g.gain.value=0;g.connect(pad);const f=mtof(m);
        const o1=c.createOscillator();o1.type='sine';o1.frequency.value=f;const o2=c.createOscillator();o2.type='triangle';o2.frequency.value=f*1.0035;
        const g2=c.createGain();g2.gain.value=.28;o1.connect(g);o2.connect(g2);g2.connect(g);o1.start(now);o2.start(now);
        g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(level*(i?.5:.8)/(1+i*.2),now+5);return{g:g,o:[o1,o2]};});},
    bell:function(now){if(!notes.length)return;const m=notes[Math.floor(Math.random()*notes.length)]+12+(Math.random()<.35?12:0),o=c.createOscillator();o.type='sine';o.frequency.value=mtof(m);
      const g=c.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.5,now+.015);g.gain.exponentialRampToValueAtTime(.0008,now+3.4);o.connect(g);g.connect(bells);o.start(now);o.stop(now+3.5);},
    wind:function(level,cut,now){wg.gain.setTargetAtTime(level,now,.8);wf.frequency.setTargetAtTime(cut,now,.8);}};
}
const SC={ctx:null,eng:null,on:false,muted:false,ending:false,key:'',nextBell:0,gustAt:-99,lastUpd:0,quietSince:0};
const CHORDS={A:[50,57,64,71],C:[55,62,69,74],E:[45,52,59],end:[50,57,64,71]},DROOTS=[50,48,53,45,52,47];
const WIND={A:[.38,700],C:[.27,880],D:[.46,540],E:[.06,300]},BELLGAP={A:5.5,C:3.4,D:4.4,E:10};
function scoreStart(){if(SC.muted)return;if(!SC.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{SC.ctx=new AC();SC.eng=makeScore(SC.ctx,SC.ctx.destination);}catch(e){SC.ctx=null;return;}}
  if(SC.ctx.state==='suspended')SC.ctx.resume().catch(()=>{});SC.on=true;SC.ending=false;SC.key='';}
function scoreStop(){SC.on=false;SC.ending=false;}
function scoreUpdate(){if(!SC.ctx)return;const c=SC.ctx,now=c.currentTime,b=B[cur];
  if(gnow-SC.lastUpd<.2)return;SC.lastUpd=gnow;
  let target=SC.on&&!SC.muted?1:0;
  if(SC.ending){target*=1-smooth(ramp(t,7,24));if(t>26)SC.on=SC.ending=false;}
  if(trans&&trans.kind==='dark'){const p=clamp((gnow-trans.start)/trans.dur,0,1);target*=1-.92*Math.sin(Math.PI*p);}
  SC.eng.master.gain.setTargetAtTime(target*.22,now,target>0?1.1:(SC.ending?2:.7));
  if(target<=.001){if(!SC.quietSince)SC.quietSince=gnow;if(gnow-SC.quietSince>4&&c.state==='running'&&!SC.on)c.suspend().catch(()=>{});return;}
  SC.quietSince=0;
  const w=b.world,key=b.final?'end':(w==='D'?'D'+Math.floor(t/7):w);
  if(key!==SC.key){SC.key=key;const ns=w==='D'?(r=>[r,r+7,r+14,r+21])(DROOTS[Math.floor(t/7)%DROOTS.length]):CHORDS[key==='end'?'end':w];
    SC.eng.chord(ns,now,w==='E'?.085:.11);}
  const wd=WIND[w],g=clamp((gnow-SC.gustAt)/2.6,0,1),gb=g<1?Math.sin(Math.PI*g):0,drift=.78+.16*Math.sin(gnow*.21)+.08*Math.sin(gnow*.57);
  SC.eng.wind(wd[0]*drift+.5*gb,wd[1]*(.85+.2*Math.sin(gnow*.13))+900*gb,now);
  if(gnow>=SC.nextBell){if(SC.nextBell)SC.eng.bell(now+.05);SC.nextBell=gnow+BELLGAP[w]*(.6+Math.random()*.8);}}
document.addEventListener('visibilitychange',()=>{if(!SC.ctx)return;if(document.hidden)SC.ctx.suspend().catch(()=>{});else if(SC.on&&!SC.muted)SC.ctx.resume().catch(()=>{});});

/* ---------- core loop ---------- */
let cur=0,t=0,gnow=0,last=performance.now(),auto=false,hover=null,curWorld=null,trans=null,camFrom=null,camIn=2.2;
const veil=document.getElementById('veil'),stage=document.getElementById('stage');
function isP(){return VW/VH<.9;}
function fit(f){const a=VW/VH;let w=f.w,h=f.h;if(w/h>a)h=w/a;else w=h*a;return[f.cx-w/2,f.cy-h/2,w,h];}
function showWorld(k,o,z){const e=W[k].el;e.style.visibility=o>0?'visible':'hidden';e.style.opacity=o;e.style.zIndex=z||0;}
function goto(i,o){o=o||{};i=clamp(i,0,B.length-1);const nb=B[i],ob=B[cur];
  camFrom=(!o.jump&&curWorld===nb.world&&W[nb.world].focus)?W[nb.world].focus:null;camIn=nb.camIn||2.2;
  if(nb.world!==curWorld){if(!o.jump&&curWorld){trans={from:curWorld,to:nb.world,start:gnow,kind:nb.trans||'fade',dur:nb.trans==='dark'?3.4:1.9};if(trans.kind==='gust')gust();
      for(const k in W)if(k!==trans.from&&k!==trans.to)showWorld(k,0);if(trans.kind!=='dark')veil.style.opacity=0;}
    else{trans=null;for(const k in W)showWorld(k,k===nb.world?1:0);}curWorld=nb.world;}
  if(nb.choice&&!(o.settled&&state.gazed)){state.gazed=null;state.tc=null;}
  if(nb.choice&&o.settled&&state.gazed)state.tc=0;
  cur=i;t=o.t!=null?o.t:(o.settled?settleOf(nb):0);leafTarget=nb.leaves;buildText(nb);
  try{history.replaceState(null,'',i?'#s='+i+(state.gazed?'&c='+state.gazed:''):location.pathname+location.search);}catch(e){}
  if(nb.final){const was=auto&&SC.on;setAuto(false,true);if(was){SC.on=true;SC.ending=true;}}}
function choose(side){if(state.gazed)return;state.gazed=side;state.tc=t;hover=null;stage.classList.remove('pick');
  try{history.replaceState(null,'','#s='+cur+'&c='+side);}catch(e){}}
function forkScreenX(){const vb=W.A.vb;return vb?(800-vb[0])/vb[2]*VW:VW/2;}
function advance(x){const b=B[cur];
  if(b.choice&&!state.gazed){if(t<b.settle0){t=b.settle0;return;}choose(x==null?(Math.random()<.5?'L':'R'):(x<forkScreenX()?'L':'R'));return;}
  if(t<settleOf(b)){t=settleOf(b);return;}if(b.final)return;goto(cur+1);}
function render(){const b=B[cur],P=isP();
  if(trans){const p=clamp((gnow-trans.start)/trans.dur,0,1);
    if(trans.kind==='dark'){veil.style.opacity=Math.sin(Math.PI*p).toFixed(3);showWorld(trans.from,p<.5?1:0,0);showWorld(trans.to,p<.5?0:1,1);}
    else{showWorld(trans.from,1,0);showWorld(trans.to,smooth(p),1);}
    if(p>=1){showWorld(trans.from,0);showWorld(trans.to,1);veil.style.opacity=0;trans=null;}}
  let f=b.cam(t,P);if(camFrom)f=lerpF(camFrom,f,ease(t/camIn));
  if(t>=camIn)camFrom=null;
  const w=W[b.world];w.focus=f;w.vb=fit(f);w.el.setAttribute('viewBox',w.vb.map(v=>v.toFixed(1)).join(' '));
  UPD[b.world](b,t);updText(t);}
function frame(now){let dt=Math.min(.1,(now-last)/1000);last=now;if(document.hidden)dt=0;gnow+=dt;t+=dt;
  const b=B[cur];
  if(auto){if(b.choice&&!state.gazed&&t>=4.6)choose(Math.random()<.5?'L':'R');else if(t>=durOf(b))goto(cur+1);}
  render();stepLeaves(dt);scoreUpdate();requestAnimationFrame(frame);}

/* ---------- autoplay control ---------- */
const ap=document.getElementById('ap');let apT=0;
const IC_PLAY='<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',IC_PAUSE='<svg viewBox="0 0 16 16"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/></svg>';
function setAuto(v,quiet){auto=v;if(v)scoreStart();else scoreStop();ap.innerHTML=v?IC_PAUSE:IC_PLAY;ap.setAttribute('aria-label',v?'pause':'play');sndIcon();if(!quiet)peek(v?2600:5000);}
function peek(ms){if(cur===0||B[cur].final){ap.classList.remove('show');snd.classList.remove('show');return;}ap.classList.add('show');snd.classList.toggle('show',auto);clearTimeout(apT);
  apT=setTimeout(()=>{ap.classList.remove('show');snd.classList.remove('show');},ms);}
const snd=document.getElementById('snd');
const IC_SND='<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5q2 2.5 0 5M12.8 3.8q3.4 4.2 0 8.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>',
  IC_MUTE='<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
function sndIcon(){snd.innerHTML=SC.muted?IC_MUTE:IC_SND;snd.setAttribute('aria-label',SC.muted?'sound off':'sound on');}
function toggleSound(){SC.muted=!SC.muted;if(!SC.muted&&auto)scoreStart();sndIcon();peek(2600);}
snd.addEventListener('click',e=>{e.stopPropagation();toggleSound();});
ap.addEventListener('click',e=>{e.stopPropagation();setAuto(!auto);});

/* ---------- input ---------- */
stage.addEventListener('click',e=>{if(e.target.closest('button'))return;if(auto){setAuto(false);return;}advance(e.clientX);});
stage.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){if(cur>0)peek(1800);
  const b=B[cur];if(b.choice&&!state.gazed&&t>=b.settle0){hover=e.clientX<forkScreenX()?'L':'R';stage.classList.add('pick');}else{hover=null;stage.classList.remove('pick');}}});
addEventListener('keydown',e=>{const b=B[cur],k=e.key;
  if(b.choice&&!state.gazed&&t>=b.settle0&&(k==='ArrowLeft'||k==='ArrowRight')){choose(k==='ArrowLeft'?'L':'R');e.preventDefault();return;}
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){if(auto)setAuto(false);advance(null);e.preventDefault();}
  else if(k==='ArrowLeft'||k==='PageUp'){if(auto)setAuto(false);if(cur>0)goto(cur-1,{settled:true});e.preventDefault();}
  else if(k==='p'||k==='P'){setAuto(!auto);}
  else if(k==='m'||k==='M'){toggleSound();}
  else if(k==='Home'){setAuto(false);goto(0);}
  else if(k==='f'||k==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen&&document.exitFullscreen();}});
addEventListener('resize',resize);

/* ---------- start (supports #s=5&c=L&t=3 to open at a given moment) ---------- */
resize();setAuto(false,true);
const hp=new URLSearchParams(location.hash.slice(1));const s0=clamp(parseInt(hp.get('s')||'0',10)||0,0,B.length-1);
if(hp.get('c')==='L'||hp.get('c')==='R'){state.gazed=hp.get('c');state.tc=0;}
goto(s0,{jump:true,settled:s0>0,t:hp.get('t')!=null?parseFloat(hp.get('t')):null});
if(hp.get('ap')==='1')setAuto(true,true);
requestAnimationFrame(frame);
})();
</script>
</body>
