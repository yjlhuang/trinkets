<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>秋牡丹・水彩塗色</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@1&family=Noto+Serif+TC:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #e6e8e3;
  --tray: #f7f7f4;
  --well: #ffffff;
  --line: #d6d9d2;
  --ink: #2c2f2b;
  --muted: #6a6f68;
  --soft: #9a9f97;
  --pigment: #c25f7f;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --latin: "EB Garamond", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--desk);
  color: var(--ink);
  font: 15px/1.5 var(--sans);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.studio {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 292px;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.sheet { position: relative; min-height: 0; min-width: 0; }
#paper, #touch { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#touch { touch-action: none; cursor: crosshair; }
body:not(.ready) #paper { opacity: 0; }
#paper { transition: opacity .5s ease; }

.hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px 6px 10px; border-radius: 999px;
  background: rgb(247 247 244 / .86); border: 1px solid var(--line);
  color: var(--muted); font-size: 13px; white-space: nowrap; pointer-events: none;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.hint::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--pigment); }
body[data-tool="lighten"] .hint::before { background: color-mix(in srgb, var(--pigment) 35%, white); }
body[data-tool="clear"] .hint::before { background: transparent; border: 1.5px solid var(--soft); }
#fit {
  position: absolute; top: 12px; right: 12px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--tray); color: var(--muted); font-size: 13px;
}

/* ---- the tray ---- */
.tray {
  margin: 14px 14px 14px 0;
  padding: 22px 20px 18px;
  background: var(--tray);
  border: 1px solid var(--line);
  border-radius: 20px;
  display: flex; flex-direction: column; gap: 18px;
  overflow-y: auto; min-height: 0;
}
.title h1 { font: 500 21px/1.25 var(--serif); letter-spacing: .08em; margin: 0; }
.title p { font: italic 16px/1.2 var(--latin); color: var(--muted); margin: 6px 0 0; letter-spacing: .01em; }

.box {
  background: #eceee9;
  border-radius: 14px;
  padding: 10px;
  box-shadow: inset 0 1px 2px rgb(0 0 0 / .06);
}
.pans { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pans.all { grid-template-columns: repeat(8, 1fr); gap: 5px; max-height: 260px; overflow-y: auto; }
.pans.all .pan { padding: 3px; border-radius: 9px; }
.pans.all .cake { inset: 3px; border-radius: 6px; }
.pan {
  aspect-ratio: 1; border: 0; padding: 5px; border-radius: 12px;
  background: var(--well);
  box-shadow: inset 0 0 0 1px #e1e3de, 0 1px 0 rgb(255 255 255 / .8);
  display: block; position: relative; min-width: 0;
}
.cake {
  position: absolute; inset: 5px;
  border-radius: 8px;
  background:
    radial-gradient(120% 90% at 30% 25%, color-mix(in srgb, var(--c) 45%, white) 0%, transparent 55%),
    radial-gradient(90% 90% at 70% 80%, color-mix(in srgb, var(--c) 82%, black) 0%, transparent 70%),
    var(--c);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .08);
}
.pan.on { box-shadow: inset 0 0 0 1px #e1e3de, 0 0 0 2px var(--tray), 0 0 0 3.5px var(--ink); }
.color-name { margin: 8px 2px 0; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
.color-name b { font-weight: 500; color: var(--ink); }

.group { display: grid; gap: 7px; }
.group > span { font-size: 12.5px; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #eceee9; border-radius: 11px; padding: 3px; gap: 3px; }
.seg button {
  border: 0; background: transparent; border-radius: 8px; padding: 8px 4px; color: var(--muted); font-size: 14px;
  min-height: 38px;
}
.seg button[aria-pressed="true"] { background: var(--well); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08), inset 0 0 0 1px #e1e3de; }

.actions { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions button {
  border: 1px solid var(--line); background: var(--well); border-radius: 11px; min-height: 42px; padding: 8px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px;
}
.actions button:disabled { opacity: .4; cursor: default; }
.actions svg { width: 17px; height: 17px; }
.actions .primary { grid-column: 1 / -1; background: var(--ink); color: #f7f7f4; border-color: var(--ink); }
.actions .quiet { grid-column: 1 / -1; border: 0; background: transparent; color: var(--muted); min-height: 34px; font-size: 13px; }
.credit { font-size: 11px; color: var(--soft); line-height: 1.45; margin: 0; }
.credit a { color: inherit; }

.title { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.change { border: 1px solid var(--line); background: var(--well); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink); white-space: nowrap; }
.schemes .seg button { font-size: 13.5px; padding: 6px 1px; min-height: 34px; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin: 6px 0 12px; }
.pick { border: 1px solid var(--line); background: var(--well); border-radius: 12px; padding: 6px 6px 8px; display: grid; gap: 6px; font-size: 13px; text-align: center; }
.pick img { width: 100%; aspect-ratio: 4 / 5; object-fit: contain; background: #fff; border-radius: 6px; }
.pick.on { box-shadow: 0 0 0 2px var(--ink); }
.pan .picker { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; }
.pan.custom::after { content: ""; position: absolute; right: 1px; bottom: 1px; width: 11px; height: 11px; border-radius: 50%;
  background: conic-gradient(#f33, #fd3, #3d5, #3cf, #36f, #c3f, #f33); box-shadow: 0 0 0 1.5px #fff; pointer-events: none; }
.pan.white .cake { box-shadow: inset 0 0 0 1px rgb(0 0 0 / .14); }
.pick-wrap { position: relative; display: grid; }
.pick-del { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--tray); color: var(--muted); font-size: 18px; line-height: 1; display: grid; place-items: center; padding: 0; }
.pick .broken { aspect-ratio: 4 / 5; display: grid; place-items: center; background: #fff; border-radius: 6px; color: var(--soft); font-size: 12px; line-height: 1.5; }
.pick.add { place-content: center; color: var(--muted); border-style: dashed; min-height: 160px; }
.pick .plus { font-size: 28px; line-height: 1; }
#busy { position: fixed; inset: 0; display: grid; place-items: center; z-index: 35; background: rgb(230 232 227 / .55); }
#busy[hidden] { display: none; }
.busy-card { background: var(--tray); border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; display: flex; gap: 10px; align-items: center; color: var(--muted); }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ink); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- portrait & phones: canvas on top, a compact tray below ---- */
@media (orientation: portrait), (max-width: 760px) {
  .studio { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .tray {
    margin: 0 10px 10px; padding: 12px 12px 10px; gap: 10px; border-radius: 18px;
    display: grid; grid-template-columns: 1fr 1fr 1fr; overflow: visible;
  }
  .credit, .group > span, .title p { display: none; }
  .title { grid-column: 1 / -1; align-items: center; }
  .title h1 { font-size: 18px; letter-spacing: .08em; }
  .schemes { grid-column: 1 / -1; }
  .palette { grid-column: 1 / -1; }
  .box { padding: 7px; }
  .pans { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
  .pan { padding: 3px; border-radius: 9px; }
  .cake { inset: 3px; }
  .pans.all { display: flex; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px; margin: -4px; }
  .pans.all .pan { flex: 0 0 calc((100% - 45px) / 10); scroll-snap-align: start; }
  .cake { border-radius: 6px; }
  .color-name { display: none; }
  .seg button { min-height: 36px; font-size: 13.5px; padding: 6px 2px; }
  .actions { grid-column: 1 / -1; grid-template-columns: 1fr 1fr 1.4fr 1fr; margin: 0; }
  .actions .primary, .actions .quiet { grid-column: auto; }
  .actions .quiet { border: 1px solid var(--line); background: var(--well); color: var(--muted); min-height: 42px; }
  .hint { bottom: 8px; font-size: 12.5px; }
}
@media (orientation: portrait) and (min-width: 700px) {
  .tray { margin: 0 16px 16px; padding: 16px; gap: 12px; }
  .pans { gap: 8px; }
  .seg button { min-height: 42px; font-size: 15px; }
}
@media (max-width: 420px) {
  .tray { grid-template-columns: 1fr 1fr; }
  .group.line { grid-column: 1 / -1; }
}

/* ---- toast & dialog ---- */
#toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px);
  background: var(--ink); color: #f7f7f4; padding: 8px 16px; border-radius: 999px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 20;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#dialog {
  position: fixed; inset: 0; background: rgb(40 42 39 / .32); display: grid; place-items: center; z-index: 30; padding: 20px;
}
#dialog[hidden] { display: none; }
.card {
  background: var(--tray); border-radius: 18px; padding: 22px; width: min(440px, 100%);
  max-height: calc(100% - 20px); overflow: auto; border: 1px solid var(--line);
  -webkit-user-select: text; user-select: text;
}
.card h2 { font: 500 19px/1.3 var(--serif); margin: 0 0 8px; letter-spacing: .04em; }
.card p { margin: 0 0 12px; color: var(--muted); }
.card .small { font-size: 13px; }
.card .preview { display: block; width: 100%; max-height: 52vh; object-fit: contain; border-radius: 8px; background: #fff; margin: 4px 0 12px; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
.dlg-actions button { border: 1px solid var(--line); background: var(--well); border-radius: 10px; padding: 9px 16px; min-height: 42px; }
.dlg-actions .primary { background: var(--ink); color: #f7f7f4; border-color: var(--ink); }
.dlg-actions .quiet { background: transparent; border-color: transparent; color: var(--muted); }
#fatal { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--desk); z-index: 40; text-align: center; }
#fatal[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { #toast, #paper { transition: none; } }
</style>
</head>
<body data-tool="paint">
<main class="studio">
  <section class="sheet" aria-label="畫紙">
    <canvas id="paper"></canvas>
    <div id="touch" role="application" aria-label="點選區域上色。兩指可縮放與移動畫紙。"></div>
    <div class="hint" id="hint" aria-live="polite"></div>
    <button type="button" id="fit" hidden>看整張</button>
  </section>
  <aside class="tray" aria-label="顏料與工具">
    <header class="title">
      <div><h1 id="title">秋牡丹</h1><p id="latin">Anemone hupehensis</p></div>
      <button type="button" id="change" class="change">換畫作</button>
    </header>
    <div class="group schemes">
      <span>配色</span>
      <div class="seg" role="group" aria-label="配色">
        <button type="button" data-scheme="autumn">秋日</button>
        <button type="button" data-scheme="dusk">暮色</button>
        <button type="button" data-scheme="mist">晨霧</button>
        <button type="button" data-scheme="spring">春日</button>
        <button type="button" data-scheme="all">全部</button>
      </div>
    </div>
    <div class="palette">
      <div class="box"><div class="pans" id="pans" role="radiogroup" aria-label="顏料"></div></div>
      <p class="color-name"><span>顏料</span><b id="color-name"></b></p>
    </div>
    <div class="group">
      <span>點一下區域時</span>
      <div class="seg" role="group" aria-label="點一下區域時">
        <button type="button" data-tool="paint">上色</button>
        <button type="button" data-tool="lighten">洗淡</button>
        <button type="button" data-tool="clear">洗掉</button>
      </div>
    </div>
    <div class="group">
      <span>每次的顏料量</span>
      <div class="seg" role="group" aria-label="每次的顏料量">
        <button type="button" data-amount="light">淡彩</button>
        <button type="button" data-amount="mid">適中</button>
        <button type="button" data-amount="rich">飽和</button>
      </div>
    </div>
    <div class="group line">
      <span>線稿</span>
      <div class="seg" role="group" aria-label="線稿">
        <button type="button" data-line="show">顯示</button>
        <button type="button" data-line="faint">淡化</button>
        <button type="button" data-line="hide">隱藏</button>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="undo" aria-label="復原"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5 3.5 9l4 4"/><path d="M4 9h8a4.5 4.5 0 0 1 0 9h-2"/></svg>復原</button>
      <button type="button" id="redo" aria-label="重做"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12.5 5 4 4-4 4"/><path d="M16 9H8a4.5 4.5 0 0 0 0 9h2"/></svg>重做</button>
      <button type="button" class="primary" id="save">存成圖片</button>
      <button type="button" class="quiet" id="reset">重新開始</button>
    </div>
    <p class="credit">水彩模擬引擎改寫自 <a href="https://github.com/msurguy/watercolor-playground" target="_blank" rel="noopener">watercolor-playground</a>（Maksim Surguy，MIT 授權）。<span id="sync">作品會自動保存在這台裝置的瀏覽器中。</span></p>
  </aside>
</main>
<input type="file" id="file" accept="image/*" hidden>
<div id="busy" hidden><div class="busy-card"><span class="spinner"></span>整理線稿中…</div></div>
<div id="toast" role="status"></div>
<div id="dialog" hidden><div class="card" role="dialog" aria-modal="true"></div></div>
<div id="fatal" hidden><div><h2 style="font-family:var(--serif)">這個瀏覽器無法執行水彩模擬</h2><p id="fatal-msg" style="color:var(--muted)"></p><p style="color:var(--muted)">需要支援 WebGL2 與浮點貼圖的瀏覽器（新版 Safari、Chrome、Edge 都可以）。</p></div></div>
